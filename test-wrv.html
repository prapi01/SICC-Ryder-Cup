<!--
FILE: test-wrv.html
VERSION: 1.00
KEY CHANGES:
   - NEW: WRV test suite for validating Write-Read-Verify functionality
   - Tests: WRV.write(), read verification, retry mechanism, celebration photo integration
   - Self-contained test page with pass/fail results
   - Deploy and run before deploying WRV to production
DEPENDS ON: js/firebase-config.js, js/celebration-photo.js, js/wrv.js
STATUS: Ready for testing
-->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WRV Test Suite</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- App modules -->
    <script src="js/firebase-config.js?v=1.02"></script>
    <script src="js/celebration-photo.js?v=1.21"></script>
    <script src="js/wrv.js?v=1.14"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            color: #fff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 16px 0 20px 0;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #4caf50;
            letter-spacing: 0.5px;
        }
        
        .header .subtitle {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .test-box {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 10px 0;
        }
        
        .test-box .result {
            font-weight: 700;
            font-size: 15px;
        }
        
        .test-box .result.pass { color: #4caf50; }
        .test-box .result.fail { color: #ff4444; }
        .test-box .result.info { color: #ffaa44; }
        
        .test-box .message {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        
        .test-box .details {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
            font-family: monospace;
            background: #0a0a0a;
            padding: 8px 12px;
            border-radius: 6px;
            overflow: auto;
            max-height: 100px;
            word-break: break-all;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            border: 1px solid;
            background: #1a1a1a;
            color: #fff;
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: #1a3a1a;
            border-color: #4caf50;
            color: #4caf50;
        }
        
        .btn-secondary {
            background: #1a1a1a;
            border-color: #333;
            color: #888;
        }
        
        .btn-danger {
            background: #2a1a1a;
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .log-container {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }
        
        .log-container .pass { color: #4caf50; }
        .log-container .fail { color: #ff4444; }
        .log-container .info { color: #ffaa44; }
        
        .summary {
            text-align: center;
            padding: 16px;
            margin-top: 16px;
            border-top: 1px solid #1a1a1a;
        }
        
        .summary .big {
            font-size: 28px;
            font-weight: 700;
        }
        
        .summary .big.pass { color: #4caf50; }
        .summary .big.fail { color: #ff4444; }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        @media (max-width: 380px) {
            body { padding: 12px; }
            .header h1 { font-size: 20px; }
            .btn { font-size: 14px; padding: 12px 16px; min-width: 80px; }
            .test-box { padding: 12px 16px; }
        }
        
        @media (min-width: 501px) {
            .container { max-width: 480px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🧪 WRV Test Suite</h1>
        <div class="subtitle">Write-Read-Verify with Self-Healing</div>
    </div>
    
    <div id="results"></div>
    
    <div class="btn-group">
        <button class="btn btn-primary" id="runBtn">▶ Run All Tests</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
    </div>
    
    <div class="log-container" id="log"></div>
    
    <div class="summary" id="summary">
        <div style="color:#666;font-size:13px;">Ready to test</div>
    </div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.00</div>

<script>
// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.TEST_WRV_VERSION = "1.00";
console.log("[TEST-WRV] Initializing v1.00");

// ============================================================
// Test Configuration
// ============================================================
var TEST_GAME_ID = 'WRV_TEST_' + Date.now();
var TEST_COLLECTION = 'test_wrv';

// ============================================================
// DOM Refs
// ============================================================
var resultsContainer = document.getElementById('results');
var logContainer = document.getElementById('log');
var summaryContainer = document.getElementById('summary');
var runBtn = document.getElementById('runBtn');
var clearBtn = document.getElementById('clearBtn');

// ============================================================
// Logging Functions
// ============================================================
function log(msg, type) {
    var line = document.createElement('div');
    var timestamp = new Date().toLocaleTimeString();
    line.textContent = '[' + timestamp + '] ' + msg;
    if (type === 'pass') line.className = 'pass';
    else if (type === 'fail') line.className = 'fail';
    else if (type === 'info') line.className = 'info';
    logContainer.appendChild(line);
    logContainer.scrollTop = logContainer.scrollHeight;
    console.log('[TEST-WRV]', msg);
}

function addResult(testName, passed, message, details) {
    var box = document.createElement('div');
    box.className = 'test-box';
    
    var resultSpan = document.createElement('div');
    resultSpan.className = 'result ' + (passed ? 'pass' : 'fail');
    resultSpan.textContent = (passed ? '✅ PASS' : '❌ FAIL') + ' - ' + testName;
    box.appendChild(resultSpan);
    
    if (message) {
        var msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.textContent = message;
        box.appendChild(msgDiv);
    }
    
    if (details) {
        var detailDiv = document.createElement('div');
        detailDiv.className = 'details';
        detailDiv.textContent = details;
        box.appendChild(detailDiv);
    }
    
    resultsContainer.appendChild(box);
    log(testName + ': ' + (passed ? 'PASS' : 'FAIL') + (message ? ' - ' + message : ''), passed ? 'pass' : 'fail');
}

function updateSummary(passed, total) {
    if (total === 0) {
        summaryContainer.innerHTML = '<div style="color:#666;font-size:13px;">No tests run</div>';
        return;
    }
    
    var allPassed = (passed === total);
    var html = '';
    html += '<div class="big ' + (allPassed ? 'pass' : 'fail') + '">' + passed + '/' + total + ' tests passed</div>';
    if (allPassed) {
        html += '<div style="color:#4caf50;font-size:14px;margin-top:4px;">🎉 All tests passed! WRV is ready.</div>';
    } else {
        html += '<div style="color:#ff4444;font-size:14px;margin-top:4px;">⚠️ Some tests failed. Check the logs above.</div>';
    }
    summaryContainer.innerHTML = html;
}

// ============================================================
// Test Functions
// ============================================================

/**
 * TEST 1: WRV.write() basic write
 */
function test1_WRWrite() {
    return new Promise(function(resolve) {
        log('Test 1: WRV.write() basic write...', 'info');
        
        var data = {
            testId: TEST_GAME_ID,
            message: 'Hello WRV!',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        if (typeof WRV === 'undefined') {
            addResult('WRV.write() basic', false, 'WRV not available');
            resolve(false);
            return;
        }
        
        WRV.write(TEST_COLLECTION, TEST_GAME_ID, data, function(err, result) {
            if (err) {
                addResult('WRV.write() basic', false, err.message);
                resolve(false);
                return;
            }
            addResult('WRV.write() basic', true, 'Document written successfully');
            resolve(true);
        });
    });
}

/**
 * TEST 2: WRV Read Verification
 */
function test2_WRVRead() {
    return new Promise(function(resolve) {
        log('Test 2: WRV read back verification...', 'info');
        
        var db = firebase.firestore();
        db.collection(TEST_COLLECTION).doc(TEST_GAME_ID).get()
            .then(function(doc) {
                if (!doc.exists) {
                    addResult('WRV read verification', false, 'Document not found');
                    resolve(false);
                    return;
                }
                var data = doc.data();
                if (data.message === 'Hello WRV!') {
                    addResult('WRV read verification', true, 'Data verified: ' + data.message);
                    resolve(true);
                } else {
                    addResult('WRV read verification', false, 'Data mismatch: ' + data.message);
                    resolve(false);
                }
            })
            .catch(function(err) {
                addResult('WRV read verification', false, err.message);
                resolve(false);
            });
    });
}

/**
 * TEST 3: WRV Update
 */
function test3_WRVUpdate() {
    return new Promise(function(resolve) {
        log('Test 3: WRV.update()...', 'info');
        
        var data = {
            message: 'Updated WRV!',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        if (typeof WRV === 'undefined') {
            addResult('WRV.update()', false, 'WRV not available');
            resolve(false);
            return;
        }
        
        WRV.update(TEST_COLLECTION, TEST_GAME_ID, data, function(err, result) {
            if (err) {
                addResult('WRV.update()', false, err.message);
                resolve(false);
                return;
            }
            
            // Verify the update
            var db = firebase.firestore();
            db.collection(TEST_COLLECTION).doc(TEST_GAME_ID).get()
                .then(function(doc) {
                    if (!doc.exists) {
                        addResult('WRV.update()', false, 'Document not found after update');
                        resolve(false);
                        return;
                    }
                    var data = doc.data();
                    if (data.message === 'Updated WRV!') {
                        addResult('WRV.update()', true, 'Update verified: ' + data.message);
                        resolve(true);
                    } else {
                        addResult('WRV.update()', false, 'Update mismatch: ' + data.message);
                        resolve(false);
                    }
                })
                .catch(function(err) {
                    addResult('WRV.update()', false, err.message);
                    resolve(false);
                });
        });
    });
}

/**
 * TEST 4: WRV Retry Mechanism
 */
function test4_WRVRetry() {
    return new Promise(function(resolve) {
        log('Test 4: WRV retry mechanism...', 'info');
        
        var hasRetry = typeof WRV !== 'undefined' && 
                       typeof WRV.MAX_RETRIES !== 'undefined' &&
                       WRV.MAX_RETRIES > 0;
        
        if (hasRetry) {
            addResult('WRV retry mechanism', true, 'Retry configured (max: ' + WRV.MAX_RETRIES + ')');
            resolve(true);
        } else {
            addResult('WRV retry mechanism', false, 'Retry mechanism not found');
            resolve(false);
        }
    });
}

/**
 * TEST 5: Celebration Photo Integration
 */
function test5_CelebrationPhoto() {
    return new Promise(function(resolve) {
        log('Test 5: Celebration photo integration...', 'info');
        
        var hasCheck = typeof checkAndRenameCelebrationPhoto === 'function';
        var hasCopy = typeof copyCelebrationPhoto === 'function';
        var hasGet = typeof getCelebrationPhoto === 'function';
        
        var allFound = hasCheck && hasCopy && hasGet;
        
        if (allFound) {
            addResult('Celebration photo integration', true, 
                'checkAndRenameCelebrationPhoto(), copyCelebrationPhoto(), getCelebrationPhoto() available');
            resolve(true);
        } else {
            var missing = [];
            if (!hasCheck) missing.push('checkAndRenameCelebrationPhoto');
            if (!hasCopy) missing.push('copyCelebrationPhoto');
            if (!hasGet) missing.push('getCelebrationPhoto');
            addResult('Celebration photo integration', false, 'Missing: ' + missing.join(', '));
            resolve(false);
        }
    });
}

/**
 * TEST 6: Firestore Connection
 */
function test6_FirestoreConnection() {
    return new Promise(function(resolve) {
        log('Test 6: Firestore connection...', 'info');
        
        var db = firebase.firestore();
        db.collection(TEST_COLLECTION).limit(1).get()
            .then(function() {
                addResult('Firestore connection', true, 'Connected successfully');
                resolve(true);
            })
            .catch(function(err) {
                addResult('Firestore connection', false, err.message);
                resolve(false);
            });
    });
}

/**
 * TEST 7: Cleanup
 */
function test7_Cleanup() {
    return new Promise(function(resolve) {
        log('Test 7: Cleanup test document...', 'info');
        
        var db = firebase.firestore();
        db.collection(TEST_COLLECTION).doc(TEST_GAME_ID).delete()
            .then(function() {
                addResult('Cleanup', true, 'Test document deleted');
                resolve(true);
            })
            .catch(function(err) {
                addResult('Cleanup', false, err.message);
                resolve(false);
            });
    });
}

// ============================================================
// Run All Tests
// ============================================================
async function runAllTests() {
    resultsContainer.innerHTML = '';
    logContainer.innerHTML = '';
    
    log('🧪 Starting WRV test suite...', 'info');
    log('Test ID: ' + TEST_GAME_ID, 'info');
    log('Collection: ' + TEST_COLLECTION, 'info');
    
    // Check if Firebase is initialized
    if (typeof firebase === 'undefined' || !firebase.apps.length) {
        log('❌ Firebase not initialized!', 'fail');
        addResult('Firebase initialization', false, 'Firebase not initialized');
        updateSummary(0, 1);
        return;
    }
    
    var results = [];
    
    // Run tests in order
    results.push(await test6_FirestoreConnection());
    results.push(await test1_WRWrite());
    results.push(await test2_WRVRead());
    results.push(await test3_WRVUpdate());
    results.push(await test4_WRVRetry());
    results.push(await test5_CelebrationPhoto());
    results.push(await test7_Cleanup());
    
    var passed = results.filter(function(r) { return r === true; }).length;
    var total = results.length;
    
    updateSummary(passed, total);
    
    if (passed === total) {
        log('🎉 All tests passed! WRV is ready.', 'pass');
    } else {
        log('⚠️ Some tests failed. Check the logs above.', 'fail');
    }
}

function clearResults() {
    resultsContainer.innerHTML = '';
    logContainer.innerHTML = '';
    updateSummary(0, 0);
    log('Cleared', 'info');
}

// ============================================================
// Event Listeners
// ============================================================
runBtn.addEventListener('click', runAllTests);
clearBtn.addEventListener('click', clearResults);

// ============================================================
// Device Tag
// ============================================================
async function initDeviceTag() {
    try {
        if (typeof SessionManager !== 'undefined' && typeof SessionManager.getShortNameOnly === 'function') {
            var name = await SessionManager.getShortNameOnly();
            document.getElementById('deviceTag').textContent = '🧪 ' + (name || 'DEV-??');
        }
    } catch(e) {
        document.getElementById('deviceTag').textContent = '🧪 DEV-??';
    }
}
initDeviceTag();

// ============================================================
// Auto-run on load (with small delay for modules to load)
// ============================================================
setTimeout(function() {
    log('Auto-running tests in 1 second...', 'info');
    setTimeout(runAllTests, 1000);
}, 500);

/*
FILE: test-wrv.html
VERSION: 1.00
KEY CHANGES:
   - NEW: WRV test suite for validating Write-Read-Verify functionality
   - Tests: WRV.write(), read verification, update, retry mechanism, celebration photo integration
   - Self-contained test page with pass/fail results
   - Deploy and run before deploying WRV to production
DEPENDS ON: js/firebase-config.js, js/celebration-photo.js, js/wrv.js
STATUS: Ready for testing
*/
</script>

</body>
</html>
