    <style>

            min-height: 100vh;

        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;

        }
        
        .container {
            max-width: 500px;

        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));

        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));

            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .game-complete-modal {
            background: #1a1a1a;

<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="loading-placeholder">⛳ Loading game data...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.07</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[POST-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.07: Removed duplicate photo check
// ============================================================
var APP_VERSION = "1.07";
var CACHE_KEY = "post_game_version_v107";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    // Preserve ALL existing URL parameters (gameId, etc.)
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[POST-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.POST_GAME_PAGE_VERSION = "1.07";
console.log("[POST-GAME] Initializing v1.07 - Removed duplicate photo check");
console.log("[POST-GAME] WRV loaded:", typeof WRV !== 'undefined');

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var gameData = null;
var isSeeResultsClicked = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[POST-GAME] gameId:", gameId);
}

function showGameCompleteModal() {
    var content = document.getElementById('content');
    
    var html = `
        <div class="modal-overlay" id="postGameModal" style="position:relative; background:transparent; z-index:auto;">
            <div class="game-complete-modal">
                <div class="game-complete-title">🏆 GAME COMPLETED</div>
                <div class="game-complete-message">Both cards have been signed!</div>
                <div class="game-complete-emojis">🍺 🏆 🍺</div>
                <button class="game-complete-btn" id="seeResultsBtn">🏆 SEE RESULTS</button>
            </div>
        </div>
    `;
    
    content.innerHTML = html;
    
    document.getElementById('seeResultsBtn').addEventListener('click', function() {
        // v1.07: Prevent multiple clicks
        if (isSeeResultsClicked) {
            console.log("[POST-GAME] SEE RESULTS already clicked - ignoring duplicate");
            return;
        }
        isSeeResultsClicked = true;
        
        var btn = this;
        btn.disabled = true;
        btn.textContent = '⏳ Loading...';
        
        console.log("[POST-GAME] SEE RESULTS clicked");
        
        // v1.07: REMOVED duplicate photo check - photo already copied at H17
        // The celebration photo is already in Firestore from the H17 checkpoint
        
        // Prepare celebration data from gameData
        var players = gameData.players || [];
        var results = gameData.results || {};
        var tr = results.tr || {};
        var lastIdx = tr.teamA ? tr.teamA.length - 1 : 0;
        var teamAScore = tr.teamA ? tr.teamA[lastIdx] : 9.5;
        var teamBScore = tr.teamB ? tr.teamB[lastIdx] : 9.5;
        var winner = teamAScore > teamBScore ? 'A' : (teamBScore > teamAScore ? 'B' : 'Tie');
        
        var winningPlayers = {
            teamA: players.filter(function(p) { return p.team === "A"; }),
            teamB: players.filter(function(p) { return p.team === "B"; })
        };
        
        var celebrationData = {
            winner: winner,
            teamAScore: teamAScore,
            teamBScore: teamBScore,
            winningPlayers: winningPlayers,
            gameId: gameId
        };
        sessionStorage.setItem('celebrationData', JSON.stringify(celebrationData));
        window._currentCelebrationData = celebrationData;
        
        // Go to celebration immediately - photo is already in Firestore
        if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
            SignCard.showCelebrationScreen(
                winner,
                teamAScore,
                teamBScore,
                winningPlayers,
                gameId,
                function() {
                    // onClose callback - do NOT navigate automatically
                    console.log("[POST-GAME] Celebration screen closed by user (onClose fired)");
                    // Re-enable button if they come back
                    isSeeResultsClicked = false;
                }
            );
        } else {
            console.error("[POST-GAME] SignCard not loaded");
            window.location.href = 'hcp-adjust.html?gameId=' + gameId;
        }
    });
}

function loadGameData() {
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID provided';
        return;
    }
    
    console.log("[POST-GAME] Loading game:", gameId);
    
    if (typeof FirebaseRetry === 'undefined') {
        document.getElementById('debug').textContent = 'Error: FirebaseRetry not loaded';
        return;
    }
    
    // Show waiting screen before Firestore read
    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
        WaitingScreen.show("Loading game data...");
        console.log("[POST-GAME] Waiting screen shown");
    }
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                WaitingScreen.hide();
            }
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        // Hide waiting screen on success
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
            console.log("[POST-GAME] Waiting screen hidden (success)");
        }
        
        if (!doc.exists) {
            document.getElementById('debug').textContent = 'Error: Game not found';
            return;
        }
        
        gameData = doc.data();
        console.log("[POST-GAME] Game loaded, players:", gameData.players ? gameData.players.length : 0);
        
        // Check if game data is valid
        if (!gameData.players || gameData.players.length === 0) {
            document.getElementById('debug').textContent = 'Error: Invalid game data - no players';
            return;
        }
        
        // Check if game is complete
        var signatures = gameData.signatures || {};
        var f1Signed = signatures.f1?.signed === true;
        var f2Signed = signatures.f2?.signed === true;
        var isComplete = f1Signed && f2Signed;
        
        if (!isComplete) {
            console.log("[POST-GAME] Game not complete - redirecting to pre-game");
            window.location.href = 'pre-game.html?gameId=' + gameId;
            return;
        }
        
        // Show the GAME COMPLETED modal
        showGameCompleteModal();
        
    }).catch(function(err) {
        // Hide waiting screen on error
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
            console.log("[POST-GAME] Waiting screen hidden (error)");
        }
        
        console.error("[POST-GAME] Error loading game:", err);
        document.getElementById('debug').textContent = 'Error: ' + err.message;
        
        // Show retry option
        var content = document.getElementById('content');
        content.innerHTML = `
            <div style="padding:40px 20px; text-align:center;">
                <div style="font-size:1.2rem; color:#ff6b6b; margin-bottom:16px;">⚠️ Failed to load game</div>
                <div style="font-size:0.85rem; color:#888; margin-bottom:24px;">${err.message}</div>
                <button onclick="location.reload()" style="background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:14px 32px; border-radius:40px; font-size:1rem; font-weight:700; cursor:pointer;">RETRY</button>
            </div>
        `;
    });
}

function init() {
    console.log("[POST-GAME] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    // SessionManager.getShortNameOnly() is SYNC - no .then()
    try {
        var name = SessionManager.getShortNameOnly();
        document.getElementById('deviceTag').textContent = '🏌️ ' + (name || 'DEV-??');
    } catch(e) {
        console.warn("[POST-GAME] Failed to get device name:", e.message);
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    loadGameData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
