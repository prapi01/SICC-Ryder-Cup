<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SICC Ryder Cup - POST GAME</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- html2canvas for celebration capture -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <script src="js/firebase-config.js?v=1.12"></script>
    <script src="js/session.js?v=1.12"></script>
    <script src="js/settings.js?v=1.12"></script>
    <script src="js/modal.js?v=1.12"></script>
    
    <!-- WRV Core -->
    <script src="js/wrv.js?v=1.02"></script>
    <script src="js/celebration-photo.js?v=1.03"></script>
    <script src="js/sign-card.js?v=1.38"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
            text-align: center;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .loading-placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .debug {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="loading-placeholder">⛳ Loading...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.13</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[POST-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.13: Simple display page
// ============================================================
var APP_VERSION = "1.13";
var CACHE_KEY = "post_game_version_v113";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[POST-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.POST_GAME_PAGE_VERSION = "1.13";
console.log("[POST-GAME] Initializing v1.13 - Simple display page");

// ============================================================
// Main Logic
// ============================================================

var gameId = null;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[POST-GAME] gameId:", gameId);
}

// ============================================================
// v1.13: Show celebration directly from sessionStorage
// ============================================================

function showCelebrationFromSession() {
    console.log("[POST-GAME] Showing celebration from sessionStorage...");
    
    // Step 1: Get celebration data from sessionStorage
    var celebrationDataStr = sessionStorage.getItem('celebrationData');
    if (!celebrationDataStr) {
        console.error("[POST-GAME] ❌ No celebrationData in sessionStorage");
        document.getElementById('content').innerHTML = `
            <div style="padding:40px 20px; text-align:center; color:#888;">
                <div style="font-size:3rem; margin-bottom:16px;">⛳</div>
                <div style="font-size:1rem; color:#666;">No celebration data found.</div>
                <div style="font-size:0.8rem; color:#444; margin-top:8px;">Please return to the game.</div>
                <button onclick="window.location.href='index.html'" style="margin-top:20px; background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:12px 24px; border-radius:30px; font-size:1rem; cursor:pointer;">🏠 Main Menu</button>
            </div>
        `;
        return;
    }
    
    try {
        var celebrationData = JSON.parse(celebrationDataStr);
        console.log("[POST-GAME] celebrationData loaded:", celebrationData);
        
        var winner = celebrationData.winner || 'Tie';
        var teamAScore = celebrationData.teamAScore || 9.5;
        var teamBScore = celebrationData.teamBScore || 9.5;
        var winningPlayers = celebrationData.winningPlayers || { teamA: [], teamB: [] };
        var gameId = celebrationData.gameId || null;
        
        // Step 2: Get photo from sessionStorage (instant)
        var photoDataUrl = null;
        if (typeof getPhotoFromSessionStorage === 'function') {
            photoDataUrl = getPhotoFromSessionStorage();
            console.log("[POST-GAME] Photo from sessionStorage:", photoDataUrl ? '✅ FOUND' : '❌ NOT FOUND');
        } else {
            console.warn("[POST-GAME] getPhotoFromSessionStorage not available");
        }
        
        // Step 3: Show celebration screen
        if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
            // Pass photo to SignCard if available
            if (photoDataUrl) {
                SignCard._cachedImagePath = photoDataUrl;
            }
            
            SignCard.showCelebrationScreen(
                winner,
                teamAScore,
                teamBScore,
                winningPlayers,
                gameId,
                function() {
                    console.log("[POST-GAME] Celebration screen closed by user");
                }
            );
        } else {
            console.error("[POST-GAME] ❌ SignCard not loaded");
            document.getElementById('content').innerHTML = `
                <div style="padding:40px 20px; text-align:center; color:#888;">
                    <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
                    <div style="font-size:1rem; color:#666;">SignCard not loaded.</div>
                    <button onclick="window.location.href='hcp-adjust.html?gameId=${gameId}'" style="margin-top:20px; background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:12px 24px; border-radius:30px; font-size:1rem; cursor:pointer;">🏌️ Handicap Adjustment</button>
                </div>
            `;
        }
        
    } catch(e) {
        console.error("[POST-GAME] ❌ Failed to parse celebrationData:", e.message);
        document.getElementById('content').innerHTML = `
            <div style="padding:40px 20px; text-align:center; color:#888;">
                <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
                <div style="font-size:1rem; color:#666;">Invalid celebration data.</div>
                <button onclick="window.location.href='index.html'" style="margin-top:20px; background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:12px 24px; border-radius:30px; font-size:1rem; cursor:pointer;">🏠 Main Menu</button>
            </div>
        `;
    }
}

// ============================================================
// init - v1.13: Simple initialization
// ============================================================

function init() {
    console.log("[POST-GAME] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        document.getElementById('content').innerHTML = `
            <div style="padding:40px 20px; text-align:center; color:#888;">
                <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
                <div style="font-size:1rem; color:#666;">No game ID provided.</div>
                <button onclick="window.location.href='index.html'" style="margin-top:20px; background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:12px 24px; border-radius:30px; font-size:1rem; cursor:pointer;">🏠 Main Menu</button>
            </div>
        `;
        return;
    }
    
    // Set device tag
    try {
        var name = SessionManager.getShortNameOnly();
        document.getElementById('deviceTag').textContent = '🏌️ ' + (name || 'DEV-??');
    } catch(e) {
        console.warn("[POST-GAME] Failed to get device name:", e.message);
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    // v1.13: Show celebration directly from sessionStorage
    showCelebrationFromSession();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
