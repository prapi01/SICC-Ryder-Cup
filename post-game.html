<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="loading-placeholder">⛳ Loading...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.12</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[POST-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.12: Restore cache from sessionStorage
// ============================================================
var APP_VERSION = "1.12";
var CACHE_KEY = "post_game_version_v112";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[POST-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.POST_GAME_PAGE_VERSION = "1.12";
console.log("[POST-GAME] Initializing v1.12 - Restore cache from sessionStorage");
console.log("[POST-GAME] WRV loaded:", typeof WRV !== 'undefined');

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var isSeeResultsClicked = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[POST-GAME] gameId:", gameId);
}

// ============================================================
// v1.12: Restore cache from sessionStorage
// ============================================================

function restoreCacheFromSession() {
    var stored = sessionStorage.getItem('gameCache');
    if (stored) {
        try {
            var cache = JSON.parse(stored);
            if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
                GameLoader.setLocalCache(cache);
                console.log('[POST-GAME] ✅ Cache restored from sessionStorage');
                console.log('[POST-GAME] Cache keys:', Object.keys(cache));
                if (cache.signatures) {
                    console.log('[POST-GAME] f1.signed:', cache.signatures.f1?.signed);
                    console.log('[POST-GAME] f2.signed:', cache.signatures.f2?.signed);
                }
                return true;
            } else {
                console.warn('[POST-GAME] GameLoader not available to restore cache');
            }
        } catch(e) {
            console.warn('[POST-GAME] Failed to restore cache:', e.message);
        }
    } else {
        console.warn('[POST-GAME] No gameCache found in sessionStorage');
    }
    return false;
}

// ============================================================
// showGameCompleteModal - Shows the Game Complete modal
// ============================================================

function showGameCompleteModal() {
    var content = document.getElementById('content');
    
    var html = `
        <div class="modal-overlay" id="postGameModal" style="position:relative; background:transparent; z-index:auto;">
            <div class="game-complete-modal">
                <div class="game-complete-title">🏆 GAME COMPLETED</div>
                <div class="game-complete-message">Both cards have been signed!</div>
                <div class="game-complete-emojis">🍺 🏆 🍺</div>
                <button class="game-complete-btn" id="seeResultsBtn">🏆 SEE RESULTS</button>
            </div>
        </div>
    `;
    
    content.innerHTML = html;
    
    var btn = document.getElementById('seeResultsBtn');
    if (btn) {
        btn.addEventListener('click', function() {
            if (isSeeResultsClicked) {
                console.log("[POST-GAME] SEE RESULTS already clicked - ignoring duplicate");
                return;
            }
            isSeeResultsClicked = true;
            
            btn.disabled = true;
            btn.textContent = '⏳ Loading...';
            
            console.log("[POST-GAME] SEE RESULTS clicked");
            
            // v1.12: Show celebration from cache + sessionStorage photo
            showCelebrationFromCache();
        });
    }
}

// ============================================================
// showCelebrationFromCache - v1.12: Uses sessionStorage photo
// ============================================================

function showCelebrationFromCache() {
    // Step 1: Get data from cache
    var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
    
    if (!cache) {
        console.error("[POST-GAME] ❌ No cache available - cannot show celebration");
        // Try to restore from sessionStorage as last resort
        var restored = restoreCacheFromSession();
        if (restored) {
            cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
            console.log("[POST-GAME] Cache restored on-demand");
        }
        
        if (!cache) {
            var btn = document.getElementById('seeResultsBtn');
            if (btn) {
                btn.disabled = false;
                btn.textContent = '🏆 SEE RESULTS';
                isSeeResultsClicked = false;
            }
            return;
        }
    }
    
    // Step 2: Get celebration data from cache
    var results = cache.results || {};
    var tr = results.tr || {};
    var lastIdx = tr.teamA ? tr.teamA.length - 1 : 0;
    var teamAScore = tr.teamA ? tr.teamA[lastIdx] : 9.5;
    var teamBScore = tr.teamB ? tr.teamB[lastIdx] : 9.5;
    var winner = teamAScore > teamBScore ? 'A' : (teamBScore > teamAScore ? 'B' : 'Tie');
    
    var players = cache.players || [];
    var winningPlayers = {
        teamA: players.filter(function(p) { return p.team === "A"; }),
        teamB: players.filter(function(p) { return p.team === "B"; })
    };
    
    var celebrationData = {
        winner: winner,
        teamAScore: teamAScore,
        teamBScore: teamBScore,
        winningPlayers: winningPlayers,
        gameId: gameId
    };
    
    // Step 3: Store in sessionStorage for hcp-adjust
    try {
        sessionStorage.setItem('celebrationData', JSON.stringify(celebrationData));
    } catch(e) {
        console.warn("[POST-GAME] Failed to save celebration data:", e.message);
    }
    window._currentCelebrationData = celebrationData;
    
    // Step 4: v1.12 - Get photo from sessionStorage (INSTANT)
    var photoDataUrl = null;
    if (typeof getPhotoFromSessionStorage === 'function') {
        photoDataUrl = getPhotoFromSessionStorage();
        console.log("[POST-GAME] Photo from sessionStorage:", photoDataUrl ? '✅ FOUND' : '❌ NOT FOUND');
    } else {
        console.warn("[POST-GAME] getPhotoFromSessionStorage not available");
    }
    
    // Step 5: Show celebration screen
    if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
        // v1.12: Pass photoDataUrl to SignCard if available
        if (photoDataUrl) {
            // Store in SignCard cache
            SignCard._cachedImagePath = photoDataUrl;
        }
        
        SignCard.showCelebrationScreen(
            winner,
            teamAScore,
            teamBScore,
            winningPlayers,
            gameId,
            function() {
                console.log("[POST-GAME] Celebration screen closed by user (onClose fired)");
                isSeeResultsClicked = false;
                var btn = document.getElementById('seeResultsBtn');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🏆 SEE RESULTS';
                }
            }
        );
    } else {
        console.error("[POST-GAME] SignCard not loaded");
        window.location.href = 'hcp-adjust.html?gameId=' + gameId;
    }
}

// ============================================================
// init - v1.12: Restore cache before showing modal
// ============================================================

function init() {
    console.log("[POST-GAME] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    // Set device tag
    try {
        var name = SessionManager.getShortNameOnly();
        document.getElementById('deviceTag').textContent = '🏌️ ' + (name || 'DEV-??');
    } catch(e) {
        console.warn("[POST-GAME] Failed to get device name:", e.message);
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    // v1.12: Restore cache from sessionStorage BEFORE showing modal
    var cacheRestored = restoreCacheFromSession();
    if (cacheRestored) {
        console.log("[POST-GAME] ✅ Cache ready for celebration");
    } else {
        console.warn("[POST-GAME] ⚠️ No cache in sessionStorage - celebration may fail");
    }
    
    // v1.12: IMMEDIATELY show modal
    showGameCompleteModal();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
