<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[POST-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.06: User clicks SEE RESULTS after backend work
// ============================================================
var APP_VERSION = "1.06";
var CACHE_KEY = "post_game_version_v106";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[POST-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.POST_GAME_PAGE_VERSION = "1.06";
console.log("[POST-GAME] Initializing v1.06 - User clicks SEE RESULTS after backend work");

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var gameData = null;
var processingComplete = false;
var processingError = null;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[POST-GAME] gameId:", gameId);
}

// ============================================================
// v1.06: Show Post-Game UI with status
// ============================================================

function showPostGameUI(statusText, statusType, buttonText, buttonEnabled, buttonCallback, errorMessage) {
    var content = document.getElementById('content');
    
    var statusColor = '';
    var statusClass = '';
    if (statusType === 'processing') {
        statusClass = 'status-processing';
    } else if (statusType === 'ready') {
        statusClass = 'status-ready';
    } else if (statusType === 'error') {
        statusClass = 'status-error';
    }
    
    var errorHtml = '';
    if (errorMessage) {
        errorHtml = `
            <div class="post-game-error">
                ⚠️ ${errorMessage}
                <br><button class="post-game-retry-btn" id="retryBtn">🔄 Retry</button>
            </div>
        `;
    }
    
    var spinnerHtml = '';
    if (statusType === 'processing') {
        spinnerHtml = '<span class="btn-spinner"></span>';
    }
    
    var buttonDisabled = buttonEnabled ? '' : 'disabled';
    
    var html = `
        <div class="post-game-modal">
            <div class="post-game-title">🏆 GAME COMPLETED</div>
            <div class="post-game-message">Both cards have been signed!</div>
            <div class="post-game-submessage">Finalizing game data...</div>
            <div class="post-game-emojis">🍺 🏆 🍺</div>
            
            <div class="post-game-status ${statusClass}">
                ${statusText}
            </div>
            
            ${errorHtml}
            
            <button class="post-game-btn" id="seeResultsBtn" ${buttonDisabled}>
                ${spinnerHtml} ${buttonText}
            </button>
        </div>
    `;
    
    content.innerHTML = html;
    
    // Attach button event
    var btn = document.getElementById('seeResultsBtn');
    if (btn && buttonEnabled && buttonCallback) {
        btn.addEventListener('click', buttonCallback);
    }
    
    // Attach retry button
    var retryBtn = document.getElementById('retryBtn');
    if (retryBtn) {
        retryBtn.addEventListener('click', function() {
            console.log("[POST-GAME] Retry clicked");
            processingComplete = false;
            processingError = null;
            startBackgroundProcessing();
        });
    }
}

// ============================================================
// v1.06: Background Processing - Calculate & Write
// ============================================================

function startBackgroundProcessing() {
    console.log("[POST-GAME] Starting background processing...");
    
    // Show processing state
    showPostGameUI(
        '⏳ Processing game data...',
        'processing',
        '⏳ Processing...',
        false,
        null,
        null
    );
    
    if (typeof SignCard === 'undefined') {
        showPostGameUI(
            '❌ Error',
            'error',
            '⚠️ Error',
            false,
            null,
            'SignCard module not loaded. Please refresh.'
        );
        return;
    }
    
    if (typeof HistoryRecord === 'undefined') {
        showPostGameUI(
            '❌ Error',
            'error',
            '⚠️ Error',
            false,
            null,
            'HistoryRecord module not loaded. Please refresh.'
        );
        return;
    }
    
    // Check if game data is available
    if (!gameData) {
        showPostGameUI(
            '❌ Error',
            'error',
            '⚠️ Error',
            false,
            null,
            'Game data not loaded. Please refresh.'
        );
        return;
    }
    
    // ============================================================
    // Step 1: Calculate handicaps
    // ============================================================
    console.log("[POST-GAME] Calculating handicap adjustments...");
    
    var handicapData = null;
    try {
        handicapData = SignCard.calculateAdjustedHandicapsFromGameData(gameData);
        if (!handicapData) {
            throw new Error("Failed to calculate handicap data");
        }
        console.log("[POST-GAME] Handicap calculation complete:", handicapData.players.length, "players");
    } catch (err) {
        console.error("[POST-GAME] Handicap calculation failed:", err);
        showPostGameUI(
            '❌ Calculation failed',
            'error',
            '⚠️ Error',
            false,
            null,
            'Failed to calculate handicap adjustments: ' + err.message
        );
        return;
    }
    
    // ============================================================
    // Step 2: Write to historyGames
    // ============================================================
    var archiveId = gameId + "_H";
    console.log("[POST-GAME] Writing to historyGames:", archiveId);
    
    var finalScores = {
        teamA: gameData.results?.tr?.teamA?.[17] || 9.5,
        teamB: gameData.results?.tr?.teamB?.[17] || 9.5
    };
    var signatures = gameData.signatures || {};
    var results = gameData.results || {};
    var flight1DataString = gameData.f1?.d || "";
    var flight2DataString = gameData.f2?.d || "";
    
    // Get starting players
    var startingPlayers = gameData.players.map(function(p) {
        return {
            name: p.name,
            label: p.label || '',
            handicap: p.handicap,
            team: p.team,
            flight: p.flight
        };
    });
    
    // Create or update history record with handicap data + dummy celebration pointer
    // First check if record exists
    var db = firebase.firestore();
    db.collection('historyGames').doc(archiveId).get()
        .then(function(doc) {
            var isUpdate = doc.exists;
            
            // Add dummy celebration pointer to handicapData
            handicapData.celebration = {
                imageRef: "dummy_celebration_image.jpg",
                capturedAt: new Date().toISOString()
            };
            
            if (isUpdate) {
                console.log("[POST-GAME] Updating existing history record:", archiveId);
                // Update existing record
                HistoryRecord.updateWithHandicap(archiveId, handicapData, startingPlayers, function(err) {
                    if (err) {
                        console.error("[POST-GAME] Failed to update history record:", err);
                        showPostGameUI(
                            '❌ Write failed',
                            'error',
                            '⚠️ Error',
                            false,
                            null,
                            'Failed to update history record: ' + err.message
                        );
                        return;
                    }
                    console.log("[POST-GAME] historyGames updated successfully");
                    // Step 3: Update scheduledGames status
                    updateScheduledGameStatus();
                });
            } else {
                console.log("[POST-GAME] Creating new history record:", archiveId);
                // Create pending record first
                HistoryRecord.upsertPendingRecord(
                    gameId,
                    gameData,
                    results,
                    finalScores,
                    signatures,
                    flight1DataString,
                    flight2DataString,
                    {},
                    function(err, newDocId) {
                        if (err) {
                            console.error("[POST-GAME] Failed to create pending record:", err);
                            showPostGameUI(
                                '❌ Write failed',
                                'error',
                                '⚠️ Error',
                                false,
                                null,
                                'Failed to create history record: ' + err.message
                            );
                            return;
                        }
                        console.log("[POST-GAME] Pending record created:", newDocId);
                        // Now update with handicap data
                        HistoryRecord.updateWithHandicap(newDocId, handicapData, startingPlayers, function(err2) {
                            if (err2) {
                                console.error("[POST-GAME] Failed to update with handicap:", err2);
                                showPostGameUI(
                                    '❌ Write failed',
                                    'error',
                                    '⚠️ Error',
                                    false,
                                    null,
                                    'Failed to update history record: ' + err2.message
                                );
                                return;
                            }
                            console.log("[POST-GAME] historyGames created and updated successfully");
                            // Step 3: Update scheduledGames status
                            updateScheduledGameStatus();
                        });
                    }
                );
            }
        })
        .catch(function(err) {
            console.error("[POST-GAME] Error checking history record:", err);
            showPostGameUI(
                '❌ Write failed',
                'error',
                '⚠️ Error',
                false,
                null,
                'Error checking history record: ' + err.message
            );
        });
}

// ============================================================
// Step 3: Update scheduledGames status
// ============================================================

function updateScheduledGameStatus() {
    console.log("[POST-GAME] Updating scheduledGames status to 'completed'...");
    
    var db = firebase.firestore();
    var updatePayload = {
        status: "completed",
        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection('scheduledGames').doc(gameId).update(updatePayload)
        .then(function() {
            console.log("[POST-GAME] scheduledGames status updated to 'completed'");
            
            // ALL BACKEND WORK COMPLETE!
            processingComplete = true;
            processingError = null;
            
            // Show READY state with enabled button
            showPostGameUI(
                '✅ Ready! Click below to see results.',
                'ready',
                '🏆 SEE RESULTS',
                true,
                onSeeResultsClick,
                null
            );
        })
        .catch(function(err) {
            console.error("[POST-GAME] Failed to update scheduledGames status:", err);
            showPostGameUI(
                '❌ Write failed',
                'error',
                '⚠️ Error',
                false,
                null,
                'Failed to update game status: ' + err.message
            );
        });
}

// ============================================================
// v1.06: SEE RESULTS button handler
// ============================================================

function onSeeResultsClick() {
    console.log("[POST-GAME] SEE RESULTS clicked - triggering celebration");
    
    if (!processingComplete) {
        console.warn("[POST-GAME] SEE RESULTS clicked but processing not complete");
        return;
    }
    
    if (!gameData) {
        console.error("[POST-GAME] No game data available");
        return;
    }
    
    var players = gameData.players || [];
    var results = gameData.results || {};
    var tr = results.tr || {};
    var lastIdx = tr.teamA ? tr.teamA.length - 1 : 0;
    var teamAScore = tr.teamA ? tr.teamA[lastIdx] : 9.5;
    var teamBScore = tr.teamB ? tr.teamB[lastIdx] : 9.5;
    var winner = teamAScore > teamBScore ? 'A' : (teamBScore > teamAScore ? 'B' : 'Tie');
    
    var winningPlayers = {
        teamA: players.filter(function(p) { return p.team === "A"; }),
        teamB: players.filter(function(p) { return p.team === "B"; })
    };
    
    console.log("[POST-GAME] Calling SignCard.showCelebrationScreen()");
    console.log("  - winner:", winner);
    console.log("  - teamAScore:", teamAScore);
    console.log("  - teamBScore:", teamBScore);
    console.log("  - gameId:", gameId);
    
    // v1.06: SignCard.showCelebrationScreen() should already have the data
    // but we pass the data anyway for safety. The writes are already done.
    if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
        SignCard.showCelebrationScreen(
            winner,
            teamAScore,
            teamBScore,
            winningPlayers,
            gameId,
            function() {
                console.log("[POST-GAME] Celebration screen closed by user (onClose fired)");
            }
        );
    } else {
        console.error("[POST-GAME] SignCard.showCelebrationScreen not available");
        // Fallback: navigate to hcp-adjust
        window.location.href = 'hcp-adjust.html?gameId=' + gameId;
    }
}

// ============================================================
// Load Game Data
// ============================================================

function loadGameData() {
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID provided';
        return;
    }
    
    console.log("[POST-GAME] Loading game:", gameId);
    
    if (typeof FirebaseRetry === 'undefined') {
        document.getElementById('debug').textContent = 'Error: FirebaseRetry not loaded';
        return;
    }
    
    // Show waiting screen before Firestore read
    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
        WaitingScreen.show("Loading game data...");
        console.log("[POST-GAME] Waiting screen shown");
    }
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                WaitingScreen.hide();
            }
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        // Hide waiting screen on success
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
            console.log("[POST-GAME] Waiting screen hidden (success)");
        }
        
        if (!doc.exists) {
            document.getElementById('debug').textContent = 'Error: Game not found';
            showPostGameUI(
                '❌ Error',
                'error',
                '⚠️ Error',
                false,
                null,
                'Game not found. Please return to main menu.'
            );
            return;
        }
        
        gameData = doc.data();
        console.log("[POST-GAME] Game loaded, players:", gameData.players ? gameData.players.length : 0);
        
        // Check if game data is valid
        if (!gameData.players || gameData.players.length === 0) {
            document.getElementById('debug').textContent = 'Error: Invalid game data - no players';
            showPostGameUI(
                '❌ Error',
                'error',
                '⚠️ Error',
                false,
                null,
                'Invalid game data. Please return to main menu.'
            );
            return;
        }
        
        // Check if game is complete
        var signatures = gameData.signatures || {};
        var f1Signed = signatures.f1?.signed === true;
        var f2Signed = signatures.f2?.signed === true;
        var isComplete = f1Signed && f2Signed;
        
        if (!isComplete) {
            console.log("[POST-GAME] Game not complete - redirecting to pre-game");
            window.location.href = 'pre-game.html?gameId=' + gameId;
            return;
        }
        
        // Check if already completed (status check)
        if (gameData.status === "completed") {
            console.log("[POST-GAME] Game already completed - showing READY state");
            processingComplete = true;
            showPostGameUI(
                '✅ Already completed! Click below to see results.',
                'ready',
                '🏆 SEE RESULTS',
                true,
                onSeeResultsClick,
                null
            );
            return;
        }
        
        // v1.06: Start background processing
        startBackgroundProcessing();
        
    }).catch(function(err) {
        // Hide waiting screen on error
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
            console.log("[POST-GAME] Waiting screen hidden (error)");
        }
        
        console.error("[POST-GAME] Error loading game:", err);
        document.getElementById('debug').textContent = 'Error: ' + err.message;
        
        showPostGameUI(
            '❌ Error',
            'error',
            '⚠️ Error',
            false,
            null,
            'Failed to load game: ' + err.message
        );
    });
}

// ============================================================
// Init
// ============================================================

function init() {
    console.log("[POST-GAME] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    try {
        var name = SessionManager.getShortNameOnly();
        document.getElementById('deviceTag').textContent = '🏌️ ' + (name || 'DEV-??');
    } catch(e) {
        console.warn("[POST-GAME] Failed to get device name:", e.message);
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    loadGameData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
