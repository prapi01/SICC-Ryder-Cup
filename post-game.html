    <style>

            justify-content: center;
            z-index: 10001;

        .game-complete-modal {

<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="loading-placeholder">⛳ Loading...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.09</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[POST-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.09: Fix showCelebrationFromData function name
// ============================================================
var APP_VERSION = "1.09";
var CACHE_KEY = "post_game_version_v109";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    // Preserve ALL existing URL parameters (gameId, etc.)
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[POST-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.POST_GAME_PAGE_VERSION = "1.09";
console.log("[POST-GAME] Initializing v1.09 - Fixed showCelebrationFromData function name");
console.log("[POST-GAME] WRV loaded:", typeof WRV !== 'undefined');

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var isSeeResultsClicked = false;
var cachedGameData = null;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[POST-GAME] gameId:", gameId);
}

function showGameCompleteModal() {
    var content = document.getElementById('content');
    
    var html = `
        <div class="modal-overlay" id="postGameModal" style="position:relative; background:transparent; z-index:auto;">
            <div class="game-complete-modal">
                <div class="game-complete-title">🏆 GAME COMPLETED</div>
                <div class="game-complete-message">Both cards have been signed!</div>
                <div class="game-complete-emojis">🍺 🏆 🍺</div>
                <button class="game-complete-btn" id="seeResultsBtn">🏆 SEE RESULTS</button>
            </div>
        </div>
    `;
    
    content.innerHTML = html;
    
    var btn = document.getElementById('seeResultsBtn');
    if (btn) {
        btn.addEventListener('click', function() {
            // v1.08: Prevent multiple clicks
            if (isSeeResultsClicked) {
                console.log("[POST-GAME] SEE RESULTS already clicked - ignoring duplicate");
                return;
            }
            isSeeResultsClicked = true;
            
            btn.disabled = true;
            btn.textContent = '⏳ Loading...';
            
            console.log("[POST-GAME] SEE RESULTS clicked");
            
            // v1.08: Use cached data - NO Firestore read!
            showCelebrationFromCache();
        });
    }
}

function showCelebrationFromCache() {
    // Step 1: Get data from cache
    var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
    
    if (!cache) {
        console.warn("[POST-GAME] No cache available - attempting to load from sessionStorage");
        // Try to get from sessionStorage as fallback
        var stored = sessionStorage.getItem('celebrationData');
        if (stored) {
            try {
                var data = JSON.parse(stored);
                if (data && data.gameId === gameId) {
                    showCelebrationScreenFromData(data);
                    return;
                }
            } catch(e) {
                console.warn("[POST-GAME] Failed to parse sessionStorage data:", e.message);
            }
        }
        
        // Last resort - try Firestore but DON'T block UI
        loadGameDataInBackground(function(err, data) {
            if (err) {
                console.error("[POST-GAME] Failed to load data:", err);
                // Show error but let user retry
                var btn = document.getElementById('seeResultsBtn');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🏆 SEE RESULTS';
                    isSeeResultsClicked = false;
                }
                return;
            }
            // v1.09: FIXED - Use correct function name
            showCelebrationScreenFromData(data);
        });
        return;
    }
    
    // Build celebration data from cache
    var results = cache.results || {};
    var tr = results.tr || {};
    var lastIdx = tr.teamA ? tr.teamA.length - 1 : 0;
    var teamAScore = tr.teamA ? tr.teamA[lastIdx] : 9.5;
    var teamBScore = tr.teamB ? tr.teamB[lastIdx] : 9.5;
    var winner = teamAScore > teamBScore ? 'A' : (teamBScore > teamAScore ? 'B' : 'Tie');
    
    var players = cache.players || [];
    var winningPlayers = {
        teamA: players.filter(function(p) { return p.team === "A"; }),
        teamB: players.filter(function(p) { return p.team === "B"; })
    };
    
    var celebrationData = {
        winner: winner,
        teamAScore: teamAScore,
        teamBScore: teamBScore,
        winningPlayers: winningPlayers,
        gameId: gameId
    };
    
    // Store for later use (hcp-adjust)
    try {
        sessionStorage.setItem('celebrationData', JSON.stringify(celebrationData));
    } catch(e) {
        console.warn("[POST-GAME] Failed to save celebration data:", e.message);
    }
    window._currentCelebrationData = celebrationData;
    
    // Show celebration
    showCelebrationScreenFromData(celebrationData);
    
    // Background: Start history record creation (non-blocking)
    startBackgroundTasks(cache);
}

function showCelebrationScreenFromData(celebrationData) {
    if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
        SignCard.showCelebrationScreen(
            celebrationData.winner,
            celebrationData.teamAScore,
            celebrationData.teamBScore,
            celebrationData.winningPlayers,
            celebrationData.gameId,
            function() {
                // onClose callback
                console.log("[POST-GAME] Celebration screen closed by user (onClose fired)");
                // Re-enable button if they come back
                isSeeResultsClicked = false;
                var btn = document.getElementById('seeResultsBtn');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🏆 SEE RESULTS';
                }
            }
        );
    } else {
        console.error("[POST-GAME] SignCard not loaded");
        // Fallback: go to hcp-adjust
        window.location.href = 'hcp-adjust.html?gameId=' + gameId;
    }
}

function loadGameDataInBackground(callback) {
    if (!gameId) {
        if (callback) callback(new Error('No game ID'), null);
        return;
    }
    
    console.log("[POST-GAME] Background loading game data:", gameId);
    
    var db = firebase.firestore();
    db.collection('scheduledGames').doc(gameId).get()
        .then(function(doc) {
            if (!doc.exists) {
                if (callback) callback(new Error('Game not found'), null);
                return;
            }
            var data = doc.data();
            cachedGameData = data;
            console.log("[POST-GAME] Background data loaded, players:", data.players ? data.players.length : 0);
            if (callback) callback(null, data);
        })
        .catch(function(err) {
            console.error("[POST-GAME] Background load error:", err);
            if (callback) callback(err, null);
        });
}

function startBackgroundTasks(cache) {
    // Use setTimeout to ensure UI renders first
    setTimeout(function() {
        if (!cache) {
            cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
        }
        if (!cache) {
            console.warn("[POST-GAME] No cache for background tasks");
            return;
        }
        
        var results = cache.results || {};
        var tr = results.tr || {};
        var lastIdx = tr.teamA ? tr.teamA.length - 1 : 0;
        var teamAScore = tr.teamA ? tr.teamA[lastIdx] : 9.5;
        var teamBScore = tr.teamB ? tr.teamB[lastIdx] : 9.5;
        var signatures = cache.signatures || {};
        var matchResults = results.matchResults || {};
        
        // Create history record in background
        if (typeof HistoryRecord !== 'undefined' && HistoryRecord.createPendingRecord) {
            console.log("[POST-GAME] Background: Creating history record for:", gameId);
            HistoryRecord.createPendingRecord(
                gameId,
                cache,
                results,
                { teamA: teamAScore, teamB: teamBScore },
                signatures,
                cache.f1?.d || '',
                cache.f2?.d || '',
                matchResults,
                function(err, archiveId) {
                    if (err) {
                        console.warn("[POST-GAME] Background history record error:", err);
                    } else {
                        console.log("[POST-GAME] Background history record created:", archiveId);
                    }
                }
            );
        } else {
            console.warn("[POST-GAME] HistoryRecord not available for background task");
        }
    }, 200);
}

function init() {
    console.log("[POST-GAME] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    // Set device tag
    try {
        var name = SessionManager.getShortNameOnly();
        document.getElementById('deviceTag').textContent = '🏌️ ' + (name || 'DEV-??');
    } catch(e) {
        console.warn("[POST-GAME] Failed to get device name:", e.message);
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    // v1.08: IMMEDIATELY show modal - NO signature checking!
    // Entry condition already guarantees both signatures are true
    showGameCompleteModal();
    
    // Load data in background for history record (non-blocking)
    loadGameDataInBackground(function(err, data) {
        if (!err && data) {
            // Data loaded, but UI already showing
            console.log("[POST-GAME] Background data ready for history record");
            // Start background tasks with the loaded data
            var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
            if (cache) {
                startBackgroundTasks(cache);
            }
        }
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
