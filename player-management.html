KEY CHANGES from v1.01:
   - ADDED: System-generated label field (read-only)
   - ADDED: generateLabel() function - first letter of each word, up to 3 chars, uppercase
   - ADDED: Label display in form (read-only input)
   - CHANGED: Player list now shows label alongside name
   - PRESERVED: All baseline UI styling from v1.01
   - PRESERVED: All functionality from v1.01

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Player Management - SICC Ryder Cup</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/modal.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #0a0a0a;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a0a;
            font-family: -apple-system, 'Helvetica Neue', 'SF Pro Text', system-ui, sans-serif;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }
        
        .version-tag {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            font-size: 0.6rem;
            color: #4caf50;
            background: rgba(0,0,0,0.5);
            padding: 2px 10px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            letter-spacing: 0.3px;
        }
        
        .device-tag {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            font-size: 0.5rem;
            color: #4caf50;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
        }
        
        /* ===== BASELINE UI ===== */
        .header { text-align: center; margin-bottom: 24px; margin-top: 4px; }
        .title { 
            font-size: 1.2rem; 
            font-weight: 600; 
            color: #4caf50; 
            letter-spacing: -0.3px;
        }
        .subtitle { 
            font-size: 0.6rem; 
            color: #4caf50; 
            opacity: 0.7;
            margin-top: 2px; 
            letter-spacing: 0.5px; 
            text-transform: uppercase;
        }
        
        .card { 
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #2a5a2a; 
            border-radius: 10px; 
            padding: 16px; 
            margin-bottom: 12px; 
        }
        
        .card-title { 
            font-size: 0.7rem; 
            font-weight: 500; 
            color: #4caf50; 
            margin-bottom: 12px; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }
        .form-row label {
            font-size: 0.7rem;
            color: #4caf50;
            min-width: 40px;
        }
        .form-row input,
        .form-row select {
            background: #0a0a0a;
            border: 1px solid #2a5a2a;
            border-radius: 8px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-size: 0.85rem;
            flex: 1;
            min-width: 60px;
            transition: border-color 0.2s ease;
        }
        .form-row input:focus,
        .form-row select:focus {
            outline: none;
            border-color: #4caf50;
        }
        .form-row input.hcp-input {
            flex: 0 0 50px;
            text-align: center;
        }
        .form-row select.team-select {
            flex: 0 0 90px;
        }
        
        /* v1.02: Label input - read-only, system generated */
        .form-row input.label-input {
            flex: 0 0 60px;
            text-align: center;
            font-weight: 600;
            color: #4caf50;
            background: #1a3a1a;
            border-color: #4caf50;
            cursor: default;
            opacity: 0.7;
        }
        .form-row input.label-input:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 400;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid #3a7a3a;
            transition: all 0.15s ease;
            background: rgba(20, 20, 20, 0.5);
            color: #4caf50;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { border-color: #4caf50; border-width: 2px; }
        .btn-primary:hover { background: rgba(76, 175, 80, 0.04); }
        .btn-secondary { border-color: #2a5a2a; color: #666; }
        .btn-secondary:hover { border-color: #4caf50; color: #888; }
        .btn-danger { border-color: #3a1a1a; color: #ff6b6b; }
        .btn-danger:hover { border-color: #ff6b6b; background: rgba(255, 107, 107, 0.04); }
        .btn-small { padding: 6px 12px; font-size: 0.7rem; }
        .btn-save { border-color: #4caf50; color: #4caf50; }
        .btn-save:hover { background: rgba(76, 175, 80, 0.04); }
        .btn-cancel { border-color: #2a5a2a; color: #666; }
        .btn-cancel:hover { border-color: #4caf50; color: #888; }
        
        .player-list { margin-top: 4px; }
        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(10, 10, 10, 0.5);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #2a5a2a;
            gap: 8px;
        }
        .player-item .info {
            flex: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-item .info .name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #e0e0e0;
        }
        /* v1.02: Label display in player list */
        .player-item .info .label-display {
            font-size: 0.65rem;
            font-weight: 600;
            color: #4caf50;
            background: #1a3a1a;
            padding: 1px 8px;
            border-radius: 4px;
            min-width: 32px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .player-item .info .hcp {
            font-size: 0.65rem;
            color: #4caf50;
            background: #1a3a1a;
            padding: 1px 10px;
            border-radius: 4px;
        }
        .player-item .info .team {
            font-size: 0.65rem;
            color: #ffaa44;
            background: #2a2a1a;
            padding: 1px 10px;
            border-radius: 4px;
        }
        .player-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        
        .player-item.editing {
            border-color: #4caf50;
            background: #1a2a1a;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #444;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        
        .back-btn {
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid #2a5a2a;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.15s ease;
        }
        .back-btn:hover { border-color: #4caf50; background: rgba(20, 20, 20, 0.8); }
        .back-btn:active { transform: scale(0.98); }
        .back-btn .label { 
            font-size: 0.8rem; 
            font-weight: 500; 
            color: #4caf50; 
            letter-spacing: 0.2px;
        }
        
        .footer { text-align: center; margin-top: 16px; font-size: 0.5rem; color: #1a3a1a; letter-spacing: 0.5px; }
        .loading { text-align: center; padding: 60px 20px; color: #444; font-size: 0.8rem; }
        
        @media (max-width: 400px) {
            .player-item { flex-wrap: wrap; }
            .player-item .actions { width: 100%; justify-content: flex-end; }
            .form-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="loading">Loading players...</div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.02</div>

<script>
// ============================================================
// FILE: player-management.html
// VERSION: 1.02
// ============================================================

if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[PLAYER-MGMT] AppSettings not loaded, zoom may be enabled by default");
}

var APP_VERSION = "1.02";
var CACHE_KEY = "player_management_v102";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    console.log("[PLAYER-MGMT] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

window.PLAYER_MGMT_VERSION = "1.02";
console.log("[PLAYER-MGMT] Initializing v1.02 - System-generated labels");

// ============================================================
// Firebase
// ============================================================
var db = firebase.firestore();
var firestoreReady = true;
var deviceSession = null;

// ============================================================
// State
// ============================================================
var players = [];
var editingIndex = -1;
var isLoading = false;

// ============================================================
// v1.02: generateLabel - system-generated, user cannot change
// Rule: First letter of each word, up to 3 chars, uppercase
// ============================================================
function generateLabel(name) {
    if (!name || name.trim() === '') return '';
    var parts = name.trim().split(/\s+/);
    var label = '';
    for (var i = 0; i < Math.min(3, parts.length); i++) {
        if (parts[i].length > 0) {
            label += parts[i].charAt(0).toUpperCase();
        }
    }
    return label;
}

// ============================================================
// DOM Helpers
// ============================================================
function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// Load Players from Firestore
// ============================================================
function loadPlayers(callback) {
    if (isLoading) return;
    isLoading = true;
    
    db.collection("playerInformation").doc("players").get()
        .then(function(doc) {
            if (doc.exists && doc.data().players) {
                players = doc.data().players;
                players.sort(function(a, b) {
                    return a.name.localeCompare(b.name);
                });
                console.log("[PLAYER-MGMT] Loaded", players.length, "players");
            } else {
                players = [
                    { name: "Ang C H", handicap: 1, defaultTeam: "A", label: "ACH" },
                    { name: "Chenh Hoe", handicap: 10, defaultTeam: "A", label: "CH" },
                    { name: "C K", handicap: 8, defaultTeam: "A", label: "CK" },
                    { name: "Yip H M", handicap: 12, defaultTeam: "A", label: "YHM" },
                    { name: "Jeff Goh", handicap: 0, defaultTeam: "B", label: "JG" },
                    { name: "Ong C B", handicap: 1, defaultTeam: "B", label: "OCB" },
                    { name: "Piti", handicap: 8, defaultTeam: "B", label: "P" },
                    { name: "James Ong", handicap: 11, defaultTeam: "B", label: "JO" }
                ];
                console.log("[PLAYER-MGMT] Using default players with labels");
                savePlayers(function() {
                    if (callback) callback();
                });
                return;
            }
            if (callback) callback();
        })
        .catch(function(err) {
            console.error("[PLAYER-MGMT] Error loading players:", err);
            Modal.alert("Error loading players: " + err.message);
            if (callback) callback();
        })
        .finally(function() {
            isLoading = false;
        });
}

// ============================================================
// Save Players to Firestore
// ============================================================
function savePlayers(callback) {
    var data = {
        players: players,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection("playerInformation").doc("players").set(data)
        .then(function() {
            console.log("[PLAYER-MGMT] Saved", players.length, "players");
            if (callback) callback(true);
        })
        .catch(function(err) {
            console.error("[PLAYER-MGMT] Error saving players:", err);
            Modal.alert("Error saving players: " + err.message);
            if (callback) callback(false);
        });
}

// ============================================================
// v1.02: updateLabelPreview - updates the label input field when name changes
// ============================================================
function updateLabelPreview() {
    var nameInput = document.getElementById('playerNameInput');
    var labelInput = document.getElementById('playerLabelInput');
    if (nameInput && labelInput) {
        var label = generateLabel(nameInput.value);
        labelInput.value = label;
    }
}

// ============================================================
// Render
// ============================================================
function render() {
    var container = document.getElementById('app');
    
    var currentLabel = '';
    if (editingIndex >= 0 && players[editingIndex]) {
        currentLabel = players[editingIndex].label || generateLabel(players[editingIndex].name);
    }
    
    var html = `
        <div class="header">
            <div class="title">Player Management</div>
            <div class="subtitle">Add, edit, or remove players</div>
        </div>
        
        <div class="card">
            <div class="card-title">${editingIndex >= 0 ? 'Edit Player' : 'Add New Player'}</div>
            <div class="form-row">
                <label>Name</label>
                <input type="text" id="playerNameInput" placeholder="Player name" value="${editingIndex >= 0 ? escapeHtml(players[editingIndex].name) : ''}" oninput="updateLabelPreview()">
            </div>
            <div class="form-row">
                <label>Label</label>
                <input type="text" id="playerLabelInput" class="label-input" value="${currentLabel}" readonly disabled>
                <span style="font-size:0.55rem; color:#555;">system generated</span>
            </div>
            <div class="form-row">
                <label>Hcp</label>
                <input type="number" id="playerHcpInput" class="hcp-input" min="0" max="54" value="${editingIndex >= 0 ? players[editingIndex].handicap : 0}">
                <label>Team</label>
                <select id="playerTeamSelect" class="team-select">
                    <option value="A" ${editingIndex >= 0 && players[editingIndex].defaultTeam === 'A' ? 'selected' : ''}>Team A</option>
                    <option value="B" ${editingIndex >= 0 && players[editingIndex].defaultTeam === 'B' ? 'selected' : ''}>Team B</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <button class="btn btn-save" id="savePlayerBtn">${editingIndex >= 0 ? 'Update Player' : 'Add Player'}</button>
                ${editingIndex >= 0 ? '<button class="btn btn-cancel" id="cancelEditBtn">Cancel</button>' : ''}
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">Existing Players (${players.length})</div>
            <div class="player-list" id="playerList">
                ${renderPlayerList()}
            </div>
        </div>
        
        <div class="back-btn" onclick="goBackToSettings()">
            <span class="label">Back to Game Settings</span>
        </div>
        
        <div class="footer">SICC Ryder Cup v${APP_VERSION}</div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById('savePlayerBtn').addEventListener('click', function() {
        savePlayer();
    });
    
    var cancelBtn = document.getElementById('cancelEditBtn');
    if (cancelBtn) {
        cancelBtn.addEventListener('click', function() {
            editingIndex = -1;
            render();
        });
    }
    
    document.getElementById('playerNameInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    document.getElementById('playerHcpInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    
    // Initial label preview
    updateLabelPreview();
}

// ============================================================
// Render Player List
// ============================================================
function renderPlayerList() {
    if (players.length === 0) {
        return '<div class="empty-state">No players found. Add your first player above.</div>';
    }
    
    var html = '';
    for (var i = 0; i < players.length; i++) {
        var p = players[i];
        var isEditing = (i === editingIndex);
        var label = p.label || generateLabel(p.name);
        html += `
            <div class="player-item ${isEditing ? 'editing' : ''}">
                <div class="info">
                    <span class="name">${escapeHtml(p.name)}</span>
                    <span class="label-display">${escapeHtml(label)}</span>
                    <span class="hcp">HCP ${p.handicap}</span>
                    <span class="team">Team ${p.defaultTeam}</span>
                </div>
                <div class="actions">
                    <button class="btn btn-small btn-primary edit-btn" data-index="${i}">Edit</button>
                    <button class="btn btn-small btn-danger delete-btn" data-index="${i}">Delete</button>
                </div>
            </div>
        `;
    }
    return html;
}

function attachPlayerActions() {
    var editBtns = document.querySelectorAll('.edit-btn');
    for (var i = 0; i < editBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() {
                var index = parseInt(this.dataset.index);
                startEdit(index);
            });
        })(editBtns[i]);
    }
    
    var deleteBtns = document.querySelectorAll('.delete-btn');
    for (var i = 0; i < deleteBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() {
                var index = parseInt(this.dataset.index);
                deletePlayer(index);
            });
        })(deleteBtns[i]);
    }
}

var originalRender = render;
render = function() {
    originalRender();
    attachPlayerActions();
};

// ============================================================
// Player CRUD Operations
// ============================================================

function startEdit(index) {
    editingIndex = index;
    render();
    setTimeout(function() {
        var nameInput = document.getElementById('playerNameInput');
        if (nameInput) {
            nameInput.focus();
            nameInput.select();
            updateLabelPreview();
        }
    }, 100);
}

function savePlayer() {
    var nameInput = document.getElementById('playerNameInput');
    var labelInput = document.getElementById('playerLabelInput');
    var hcpInput = document.getElementById('playerHcpInput');
    var teamSelect = document.getElementById('playerTeamSelect');
    
    var name = nameInput.value.trim();
    var label = labelInput ? labelInput.value.trim() : generateLabel(name);
    var handicap = parseInt(hcpInput.value);
    var defaultTeam = teamSelect.value;
    
    if (!name) {
        Modal.alert("Please enter a player name.");
        nameInput.focus();
        return;
    }
    
    if (isNaN(handicap) || handicap < 0 || handicap > 54) {
        Modal.alert("Please enter a valid handicap (0-54).");
        hcpInput.focus();
        return;
    }
    
    var duplicate = false;
    for (var i = 0; i < players.length; i++) {
        if (i !== editingIndex && players[i].name.toLowerCase() === name.toLowerCase()) {
            duplicate = true;
            break;
        }
    }
    if (duplicate) {
        Modal.alert("A player with this name already exists.");
        nameInput.focus();
        return;
    }
    
    // v1.02: Label is system-generated, not user-editable
    var playerData = {
        name: name,
        label: generateLabel(name),
        handicap: handicap,
        defaultTeam: defaultTeam
    };
    
    if (editingIndex >= 0) {
        players[editingIndex] = playerData;
        players.sort(function(a, b) { return a.name.localeCompare(b.name); });
        editingIndex = -1;
    } else {
        players.push(playerData);
        players.sort(function(a, b) { return a.name.localeCompare(b.name); });
    }
    
    savePlayers(function(success) {
        if (success) {
            render();
            Modal.alert("Player saved successfully.");
        } else {
            loadPlayers(function() {
                render();
                Modal.alert("Failed to save player. Changes reverted.");
            });
        }
    });
}

function deletePlayer(index) {
    var player = players[index];
    Modal.confirm(
        "Delete player '" + player.name + "'? This action cannot be undone.",
        function() {
            players.splice(index, 1);
            if (editingIndex === index) {
                editingIndex = -1;
            } else if (editingIndex > index) {
                editingIndex--;
            }
            savePlayers(function(success) {
                if (success) {
                    render();
                    Modal.alert("Player deleted.");
                } else {
                    loadPlayers(function() {
                        render();
                        Modal.alert("Failed to delete player. Changes reverted.");
                    });
                }
            });
        },
        function() {
            console.log("[PLAYER-MGMT] Deletion cancelled");
        }
    );
}

// ============================================================
// Navigation
// ============================================================
function goBackToSettings() {
    var returnDest = SessionManager.getReturnDestination();
    window.location.href = returnDest || "admin.html";
}

// ============================================================
// INIT
// ============================================================
SessionManager.initSession("player-management.html", "admin.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    displayDeviceId();
    
    loadPlayers(function() {
        render();
    });
});

window.goBackToSettings = goBackToSettings;
window.startEdit = startEdit;
window.deletePlayer = deletePlayer;
window.savePlayer = savePlayer;
window.generateLabel = generateLabel;
window.updateLabelPreview = updateLabelPreview;
</script>
</body>
</html>
