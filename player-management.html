<script>
// ============================================================
// FILE: player-management.html
// VERSION: 1.20
// ============================================================

if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[PLAYER-MGMT] AppSettings not loaded, zoom may be enabled by default");
}

var APP_VERSION = "1.20";
var CACHE_KEY = "player_management_v120";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    console.log("[PLAYER-MGMT] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

window.PLAYER_MGMT_VERSION = "1.20";
console.log("[PLAYER-MGMT] Initializing v1.20 - usedLabels from playerInformation");

// ============================================================
// Firebase
// ============================================================
var db = firebase.firestore();
var firestoreReady = true;
var deviceSession = null;

// ============================================================
// State
// ============================================================
var players = [];
var editingIndex = -1;
var isLoading = false;
var usedLabelsLoaded = false;
var labelValidationResult = null;

// ============================================================
// SVG Icons
// ============================================================
function getEditSvg() {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
}

function getDeleteSvg() {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
}

// ============================================================
// generateLabel - system-generated, user can override
// Rule: First letter of each word, up to 3 chars, uppercase
// ============================================================
function generateLabel(name) {
    if (!name || name.trim() === '') return '';
    var parts = name.trim().split(/\s+/);
    var label = '';
    for (var i = 0; i < Math.min(3, parts.length); i++) {
        if (parts[i].length > 0) {
            label += parts[i].charAt(0).toUpperCase();
        }
    }
    return label;
}

// ============================================================
// v1.19: Label Validation Functions
// ============================================================

// Check if a label is currently in use by another active player (not the one being edited)
function isLabelInUseByPlayer(label, excludeIndex) {
    if (!label || label === '') return false;
    var upperLabel = label.toUpperCase();
    for (var i = 0; i < players.length; i++) {
        if (i === excludeIndex) continue;
        var playerLabel = players[i].label || generateLabel(players[i].name);
        if (playerLabel.toUpperCase() === upperLabel) {
            return true;
        }
    }
    return false;
}

// Check 12-month cooldown for label change
function canChangeLabel(player) {
    if (!player) return true;
    
    // First change always allowed
    if (!player.lastLabelChange) {
        return true;
    }
    
    var lastChange = new Date(player.lastLabelChange);
    var twelveMonthsAgo = new Date();
    twelveMonthsAgo.setMonth(twelveMonthsAgo.getMonth() - 12);
    
    return lastChange <= twelveMonthsAgo;
}

// Get cooldown remaining in months (for display)
function getCooldownRemaining(player) {
    if (!player || !player.lastLabelChange) return 0;
    
    var lastChange = new Date(player.lastLabelChange);
    var now = new Date();
    var monthsPassed = (now.getFullYear() - lastChange.getFullYear()) * 12 + (now.getMonth() - lastChange.getMonth());
    var monthsRemaining = 12 - monthsPassed;
    return monthsRemaining > 0 ? monthsRemaining : 0;
}

// Validate label change - returns { valid: boolean, message: string, type: 'error'|'warning'|'success' }
function validateLabelChange(newLabel, currentPlayer, excludeIndex) {
    var label = newLabel ? newLabel.toUpperCase().trim() : '';
    
    // Empty label - allow but warn
    if (!label || label === '') {
        return { valid: false, message: 'Label cannot be empty', type: 'error' };
    }
    
    // Check length
    if (label.length > 3) {
        return { valid: false, message: 'Label must be 3 characters or less', type: 'error' };
    }
    
    // v1.20: Check against usedLabels (now stored in playerInformation)
    if (typeof UsedLabels !== 'undefined' && UsedLabels.isLabelUsed) {
        if (UsedLabels.isLabelUsed(label)) {
            return { valid: false, message: 'Label "' + label + '" is already used in history', type: 'error' };
        }
    }
    
    // Check against current players (excluding the one being edited)
    if (isLabelInUseByPlayer(label, excludeIndex)) {
        return { valid: false, message: 'Label "' + label + '" is already in use by another player', type: 'error' };
    }
    
    // Check cooldown if changing an existing player's label
    if (currentPlayer && currentPlayer.label && currentPlayer.label.toUpperCase() !== label) {
        if (!canChangeLabel(currentPlayer)) {
            var monthsLeft = getCooldownRemaining(currentPlayer);
            return { valid: false, message: 'Label can only be changed once every 12 months. ' + monthsLeft + ' month(s) remaining.', type: 'error' };
        }
    }
    
    return { valid: true, message: 'Label "' + label + '" is available', type: 'success' };
}

// ============================================================
// DOM Helpers
// ============================================================
function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// Load Players from Firestore
// ============================================================
function loadPlayers(callback) {
    if (isLoading) return;
    isLoading = true;
    
    db.collection("playerInformation").doc("players").get()
        .then(function(doc) {
            if (doc.exists && doc.data().players) {
                players = doc.data().players;
                players.sort(function(a, b) {
                    return a.name.localeCompare(b.name);
                });
                console.log("[PLAYER-MGMT] Loaded", players.length, "players");
            } else {
                players = [
                    { name: "Ang C H", handicap: 1, defaultTeam: "A", label: "ACH" },
                    { name: "Chenh Hoe", handicap: 10, defaultTeam: "A", label: "CH" },
                    { name: "C K", handicap: 8, defaultTeam: "A", label: "CK" },
                    { name: "Yip H M", handicap: 12, defaultTeam: "A", label: "YHM" },
                    { name: "Jeff Goh", handicap: 0, defaultTeam: "B", label: "JG" },
                    { name: "Ong C B", handicap: 1, defaultTeam: "B", label: "OCB" },
                    { name: "Piti", handicap: 8, defaultTeam: "B", label: "P" },
                    { name: "James Ong", handicap: 11, defaultTeam: "B", label: "JO" }
                ];
                console.log("[PLAYER-MGMT] Using default players");
                savePlayers(function() {
                    if (callback) callback();
                });
                return;
            }
            if (callback) callback();
        })
        .catch(function(err) {
            console.error("[PLAYER-MGMT] Error loading players:", err);
            Modal.alert("Error loading players: " + err.message);
            if (callback) callback();
        })
        .finally(function() {
            isLoading = false;
        });
}

// ============================================================
// Save Players to Firestore with labelHistory support
// ============================================================
function savePlayers(callback) {
    var data = {
        players: players,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    // v1.19: Also preserve labelHistory if it exists
    db.collection("playerInformation").doc("players").get()
        .then(function(doc) {
            if (doc.exists && doc.data().labelHistory) {
                data.labelHistory = doc.data().labelHistory;
            }
            return db.collection("playerInformation").doc("players").set(data);
        })
        .then(function() {
            console.log("[PLAYER-MGMT] Saved", players.length, "players");
            if (callback) callback(true);
        })
        .catch(function(err) {
            console.error("[PLAYER-MGMT] Error saving players:", err);
            Modal.alert("Error saving players: " + err.message);
            if (callback) callback(false);
        });
}

// ============================================================
// v1.19: Update labelHistory when a label changes
// ============================================================
function updateLabelHistory(playerName, oldLabel, newLabel) {
    if (!oldLabel || !newLabel || oldLabel === newLabel) return Promise.resolve();
    
    var labelHistoryEntry = {};
    labelHistoryEntry[oldLabel] = newLabel;
    
    console.log("[PLAYER-MGMT] Updating labelHistory:", oldLabel, "→", newLabel);
    
    return db.collection("playerInformation").doc("players").update({
        labelHistory: firebase.firestore.FieldValue.merge(labelHistoryEntry),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
        console.log("[PLAYER-MGMT] labelHistory updated:", oldLabel, "→", newLabel);
    }).catch(function(err) {
        console.warn("[PLAYER-MGMT] Failed to update labelHistory:", err);
        // Don't fail the main flow
    });
}

// ============================================================
// updateLabelPreview - auto-generate label from name
// ============================================================
function updateLabelPreview() {
    var nameInput = document.getElementById('playerName');
    var labelInput = document.getElementById('playerLabel');
    if (nameInput && labelInput) {
        if (!labelInput.dataset.userEdited || labelInput.dataset.userEdited === 'false') {
            labelInput.value = generateLabel(nameInput.value);
            validateLabelInput();
        }
    }
}

function onLabelInput() {
    var labelInput = document.getElementById('playerLabel');
    if (labelInput) {
        labelInput.dataset.userEdited = 'true';
        if (labelInput.value.length > 3) {
            labelInput.value = labelInput.value.substring(0, 3);
        }
        labelInput.value = labelInput.value.toUpperCase();
        validateLabelInput();
    }
}

function onNameInput() {
    var nameInput = document.getElementById('playerName');
    var labelInput = document.getElementById('playerLabel');
    if (nameInput && labelInput) {
        if (!labelInput.dataset.userEdited || labelInput.dataset.userEdited === 'false') {
            labelInput.value = generateLabel(nameInput.value);
            validateLabelInput();
        }
    }
}

// ============================================================
// v1.19: Real-time label validation
// ============================================================
function validateLabelInput() {
    var labelInput = document.getElementById('playerLabel');
    var statusDiv = document.getElementById('labelStatus');
    
    if (!labelInput || !statusDiv) return;
    
    var label = labelInput.value.trim().toUpperCase();
    var excludeIndex = editingIndex;
    
    // Get current player for cooldown check
    var currentPlayer = null;
    if (editingIndex >= 0 && players[editingIndex]) {
        currentPlayer = players[editingIndex];
    }
    
    var result = validateLabelChange(label, currentPlayer, excludeIndex);
    labelValidationResult = result;
    
    // Update status display
    statusDiv.textContent = result.message;
    statusDiv.className = 'label-status ' + result.type;
    
    // Update input border color
    labelInput.className = '';
    if (result.type === 'error') {
        labelInput.classList.add('label-error-input');
    } else if (result.type === 'warning') {
        labelInput.classList.add('label-warning-input');
    } else if (result.type === 'success') {
        labelInput.classList.add('label-valid-input');
    }
    
    return result;
}

// ============================================================
// Cancel Edit / Add
// ============================================================
function cancelForm() {
    editingIndex = -1;
    labelValidationResult = null;
    render();
}

// ============================================================
// Render
// ============================================================
function render() {
    var container = document.getElementById('app');
    
    var currentLabel = '';
    var currentName = '';
    var currentHcp = 0;
    var currentTeam = 'A';
    if (editingIndex >= 0 && players[editingIndex]) {
        var p = players[editingIndex];
        currentName = p.name;
        currentLabel = p.label || generateLabel(p.name);
        currentHcp = p.handicap;
        currentTeam = p.defaultTeam || 'A';
    }
    
    var html = `
        <div class="header">
            <div class="title">Player Management</div>
            <div class="subtitle">Add, edit, or remove players</div>
        </div>
        
        <!-- Player List (FIRST) -->
        <div class="card">
            <div class="card-title">Players (${players.length})</div>
            <div class="player-list" id="playerList">
                ${renderPlayerList()}
            </div>
        </div>
        
        <!-- Add/Edit Form (SECOND) - 2-LINE LAYOUT -->
        <div class="card">
            <div class="card-title">${editingIndex >= 0 ? 'Edit Player' : 'Add New Player'}</div>
            
            <!-- LINE 1: Name + Label -->
            <div class="form-line">
                <div class="form-group name-group">
                    <label>Name</label>
                    <input type="text" id="playerName" placeholder="" value="${escapeHtml(currentName)}" oninput="onNameInput()">
                </div>
                <div class="form-group label-group">
                    <label>Label</label>
                    <input type="text" id="playerLabel" class="label-input" value="${escapeHtml(currentLabel)}" maxlength="3" placeholder="" oninput="onLabelInput()">
                    <div id="labelStatus" class="label-status"></div>
                </div>
            </div>
            
            <!-- LINE 2: Hcp + Team + Cancel + Add -->
            <div class="form-line">
                <div class="form-group hcp-group">
                    <label>Hcp</label>
                    <input type="number" id="playerHcp" min="0" max="54" value="${currentHcp}">
                </div>
                <div class="form-group team-group">
                    <label>Team</label>
                    <div class="select-wrapper">
                        <select id="playerTeam">
                            <option value="A" ${currentTeam === 'A' ? 'selected' : ''}>Team A</option>
                            <option value="B" ${currentTeam === 'B' ? 'selected' : ''}>Team B</option>
                        </select>
                        <span class="arrow">▼</span>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
                    <button class="btn btn-save" id="savePlayerBtn">${editingIndex >= 0 ? 'Update' : 'Add'}</button>
                </div>
            </div>
        </div>
        
        <div class="back-link" onclick="goBackToSettings()">Back to Game Settings</div>
        
        <div class="footer">SICC Ryder Cup v${APP_VERSION}</div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById('savePlayerBtn').addEventListener('click', savePlayer);
    document.getElementById('cancelBtn').addEventListener('click', cancelForm);
    
    document.getElementById('playerName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    document.getElementById('playerHcp').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    document.getElementById('playerLabel').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    document.getElementById('playerTeam').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') savePlayer();
    });
    
    var nameInput = document.getElementById('playerName');
    var labelInput = document.getElementById('playerLabel');
    if (nameInput && labelInput) {
        nameInput.addEventListener('input', function() {
            if (!labelInput.value || labelInput.dataset.userEdited === 'false') {
                labelInput.value = generateLabel(nameInput.value);
                validateLabelInput();
            }
        });
    }
    
    if (editingIndex >= 0 && labelInput) {
        labelInput.dataset.userEdited = 'true';
        // Validate the current label on render
        setTimeout(validateLabelInput, 50);
    }
    
    attachPlayerActions();
}

// ============================================================
// Render Player List - with SVG icons
// ============================================================
function renderPlayerList() {
    if (players.length === 0) {
        return '<div class="empty-state">No players found.</div>';
    }
    
    var html = '';
    for (var i = 0; i < players.length; i++) {
        var p = players[i];
        var isEditing = (i === editingIndex);
        var label = p.label || generateLabel(p.name);
        
        html += `
            <div class="player-item ${isEditing ? 'editing' : ''}">
                <span class="p-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
                <span class="p-label">${escapeHtml(label)}</span>
                <span class="p-hcp">${p.handicap}</span>
                <span class="p-team">${p.defaultTeam || 'A'}</span>
                <div class="p-actions">
                    <button class="btn btn-small btn-small-edit edit-btn" data-index="${i}">${getEditSvg()}</button>
                    <button class="btn btn-small btn-small-delete delete-btn" data-index="${i}">${getDeleteSvg()}</button>
                </div>
            </div>
        `;
    }
    return html;
}

function attachPlayerActions() {
    document.querySelectorAll('.edit-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            editingIndex = parseInt(this.dataset.index);
            labelValidationResult = null;
            render();
            setTimeout(function() {
                var nameInput = document.getElementById('playerName');
                if (nameInput) { nameInput.focus(); nameInput.select(); }
                var labelInput = document.getElementById('playerLabel');
                if (labelInput) {
                    labelInput.dataset.userEdited = 'true';
                    validateLabelInput();
                }
            }, 100);
        });
    });
    
    document.querySelectorAll('.delete-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            deletePlayer(parseInt(this.dataset.index));
        });
    });
}

// ============================================================
// Player CRUD Operations - v1.19: With label validation
// ============================================================
function savePlayer() {
    var nameInput = document.getElementById('playerName');
    var labelInput = document.getElementById('playerLabel');
    var hcpInput = document.getElementById('playerHcp');
    var teamSelect = document.getElementById('playerTeam');
    
    var name = nameInput.value.trim();
    var newLabel = labelInput ? labelInput.value.trim().toUpperCase() : generateLabel(name);
    var handicap = parseInt(hcpInput.value);
    var defaultTeam = teamSelect.value;
    
    if (!name) {
        Modal.alert("Please enter a player name.");
        nameInput.focus();
        return;
    }
    
    if (isNaN(handicap) || handicap < 0 || handicap > 54) {
        Modal.alert("Please enter a valid handicap (0-54).");
        hcpInput.focus();
        return;
    }
    
    // v1.19: Get current player for cooldown check
    var currentPlayer = null;
    var oldLabel = null;
    if (editingIndex >= 0 && players[editingIndex]) {
        currentPlayer = players[editingIndex];
        oldLabel = currentPlayer.label || generateLabel(currentPlayer.name);
    }
    
    // Validate label
    var validationResult = validateLabelChange(newLabel, currentPlayer, editingIndex);
    
    if (!validationResult.valid) {
        Modal.alert(validationResult.message);
        document.getElementById('playerLabel').focus();
        return;
    }
    
    // Check duplicate name
    for (var i = 0; i < players.length; i++) {
        if (i !== editingIndex && players[i].name.toLowerCase() === name.toLowerCase()) {
            Modal.alert("A player with this name already exists.");
            nameInput.focus();
            return;
        }
    }
    
    // v1.19: Label is changing - need to update labelHistory and lastLabelChange
    var labelChanged = (oldLabel && oldLabel.toUpperCase() !== newLabel);
    
    var playerData = {
        name: name,
        label: newLabel || generateLabel(name),
        handicap: handicap,
        defaultTeam: defaultTeam
    };
    
    // v1.19: If label changed, record it
    if (labelChanged) {
        playerData.lastLabelChange = new Date().toISOString();
        console.log("[PLAYER-MGMT] Label changed:", oldLabel, "→", newLabel);
    } else if (currentPlayer && currentPlayer.lastLabelChange) {
        // Preserve existing lastLabelChange if label didn't change
        playerData.lastLabelChange = currentPlayer.lastLabelChange;
    }
    
    // v1.19: Preserve other fields
    if (currentPlayer) {
        // Preserve any fields not being updated
        if (currentPlayer.isDefault !== undefined) playerData.isDefault = currentPlayer.isDefault;
        if (currentPlayer.flight !== undefined) playerData.flight = currentPlayer.flight;
    }
    
    if (editingIndex >= 0) {
        players[editingIndex] = playerData;
        
        // v1.19: Update labelHistory if label changed
        if (labelChanged && oldLabel) {
            updateLabelHistory(name, oldLabel, newLabel)
                .then(function() {
                    // Continue with save
                })
                .catch(function(err) {
                    console.warn("[PLAYER-MGMT] labelHistory update warning:", err);
                });
        }
        
        players.sort(function(a, b) { return a.name.localeCompare(b.name); });
        editingIndex = -1;
    } else {
        players.push(playerData);
        players.sort(function(a, b) { return a.name.localeCompare(b.name); });
    }
    
    labelValidationResult = null;
    
    savePlayers(function(success) {
        if (success) {
            render();
            Modal.alert("Player saved.");
        } else {
            loadPlayers(function() {
                render();
                Modal.alert("Failed to save player. Changes reverted.");
            });
        }
    });
}

function deletePlayer(index) {
    var player = players[index];
    Modal.confirm(
        "Delete '" + player.name + "'?",
        function() {
            players.splice(index, 1);
            if (editingIndex === index) editingIndex = -1;
            else if (editingIndex > index) editingIndex--;
            savePlayers(function(success) {
                if (success) { render(); Modal.alert("Player deleted."); }
                else { loadPlayers(function() { render(); Modal.alert("Failed to delete."); }); }
            });
        },
        function() { console.log("Cancelled"); }
    );
}

// ============================================================
// Navigation - Back to Game Settings (admin.html)
// ============================================================
function goBackToSettings() {
    window.location.href = "admin.html";
}

// ============================================================
// v1.19: Check usedLabels loading status
// ============================================================
function checkUsedLabelsStatus() {
    if (typeof UsedLabels !== 'undefined') {
        UsedLabels.ensureInitialized()
            .then(function() {
                usedLabelsLoaded = true;
                console.log("[PLAYER-MGMT] usedLabels loaded, count:", UsedLabels.getLabelCount());
                // Re-validate label if currently editing
                if (document.getElementById('playerLabel')) {
                    validateLabelInput();
                }
            })
            .catch(function(err) {
                console.warn("[PLAYER-MGMT] usedLabels not loaded:", err);
                usedLabelsLoaded = false;
            });
    } else {
        console.warn("[PLAYER-MGMT] UsedLabels not available");
        usedLabelsLoaded = false;
    }
}
