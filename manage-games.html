<body>
<div class="container" id="app">
    <div class="loading">Loading</div>
</div>
<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.30</div>

<script>
// FILE: manage-games.html - VERSION 1.30

if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[MANAGE-GAMES] AppSettings not loaded, zoom may be enabled by default");
}

var VERSION = "1.30";
var CACHE_KEY = "manage_games_version_v130";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[MANAGE-GAMES] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

var db = firebase.firestore();
var firestoreReady = true;
var deviceSession = null;

var showAllGames = false;

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function formatDate(dateString) {
    if (!dateString) return "Unknown";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    return dateString;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
}

// Admin Bubble
var adminBubbleElement = null;
var isAdminBubbleActive = false;

function showAdminBubble(x, y, icon, line1, line2, onAction) {
    hideAdminBubble();
    
    var bubble = document.createElement('div');
    bubble.className = 'admin-bubble';
    bubble.innerHTML = `
        <span class="bubble-icon">${icon}</span>
        <span class="bubble-line1">${line1}</span>
        <span class="bubble-line2">${line2}</span>
    `;
    
    var bubbleSize = 72;
    bubble.style.left = Math.max(10, Math.min(window.innerWidth - bubbleSize - 10, x - bubbleSize / 2)) + 'px';
    bubble.style.top = Math.max(10, Math.min(window.innerHeight - bubbleSize - 10, y - bubbleSize / 2)) + 'px';
    
    bubble.addEventListener('click', function(e) {
        e.stopPropagation();
        hideAdminBubble();
        if (onAction) onAction();
    });
    
    document.body.appendChild(bubble);
    adminBubbleElement = bubble;
    isAdminBubbleActive = true;
    
    setTimeout(function() {
        if (isAdminBubbleActive) {
            hideAdminBubble();
        }
    }, 4000);
}

function hideAdminBubble() {
    if (adminBubbleElement && adminBubbleElement.parentNode) {
        adminBubbleElement.remove();
    }
    adminBubbleElement = null;
    isAdminBubbleActive = false;
}

function setupLongClick(element, icon, line1, line2, onAction) {
    if (!element) return;
    
    var holdTimer = null;
    
    element.addEventListener('pointerdown', function(e) {
        if (isAdminBubbleActive) {
            hideAdminBubble();
            return;
        }
        if (e.metaKey || e.ctrlKey) return;
        
        holdTimer = setTimeout(function() {
            showAdminBubble(
                e.clientX || e.pageX || window.innerWidth / 2,
                e.clientY || e.pageY || window.innerHeight / 2,
                icon, line1, line2, onAction
            );
        }, 800);
    });
    
    element.addEventListener('pointerup', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('pointerleave', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('click', function(e) {
        if (e.metaKey || e.ctrlKey) {
            e.preventDefault();
            e.stopPropagation();
            hideAdminBubble();
            if (onAction) onAction();
        }
    });
}

function generateGameId() {
    var now = new Date();
    var yy = String(now.getFullYear()).slice(-2);
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(now.getDate()).padStart(2, '0');
    var yymmdd = yy + mm + dd;
    var hh = String(now.getHours()).padStart(2, '0');
    var min = String(now.getMinutes()).padStart(2, '0');
    var hhmm = hh + min;
    var random = String(Math.floor(Math.random() * 100)).padStart(2, '0');
    return 'GM_' + yymmdd + '_' + hhmm + '_' + random;
}

function copyGameWithNewDate(sourceGameId, newDate) {
    var sourceRef = db.collection("scheduledGames").doc(sourceGameId);
    var newGameId = generateGameId();
    
    sourceRef.get().then(function(doc) {
        if (!doc.exists) {
            Modal.alert("Source game not found.");
            return;
        }
        
        var sourceData = doc.data();
        var newData = JSON.parse(JSON.stringify(sourceData));
        
        newData.date = newDate;
        delete newData.id;
        delete newData.updatedAt;
        delete newData.lastActive;
        
        newData.updatedAt = new Date().toISOString();
        
        return db.collection("scheduledGames").doc(newGameId).set(newData);
    }).then(function() {
        Modal.alert("Game copied successfully!\n\nNew Game ID: " + newGameId + "\nDate: " + newDate);
        loadAndRender();
    }).catch(function(err) {
        Modal.alert("Error copying game: " + err.message);
        console.error(err);
    });
}

function showCopyModal(gameId, currentDate) {
    var existing = document.querySelector('.copy-modal-overlay');
    if (existing) existing.remove();
    
    var today = new Date().toISOString().split('T')[0];
    var defaultDate = today;
    if (currentDate && currentDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
        defaultDate = currentDate;
    }
    
    var modalHtml = `
        <div class="copy-modal-overlay" id="copyModal">
            <div class="copy-modal">
                <div class="copy-modal-title">Copy Game</div>
                <div class="copy-modal-subtitle">Create an exact copy with a new date</div>
                <label class="copy-modal-label">New Game Date</label>
                <input type="date" class="copy-modal-input" id="copyDateInput" value="${defaultDate}">
                <div class="copy-modal-buttons">
                    <button class="copy-modal-btn copy-modal-btn-cancel" id="copyCancelBtn">Cancel</button>
                    <button class="copy-modal-btn copy-modal-btn-confirm" id="copyConfirmBtn">Copy</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    var modal = document.getElementById('copyModal');
    var dateInput = document.getElementById('copyDateInput');
    var cancelBtn = document.getElementById('copyCancelBtn');
    var confirmBtn = document.getElementById('copyConfirmBtn');
    
    setTimeout(function() { dateInput.focus(); }, 100);
    
    cancelBtn.onclick = function() { modal.remove(); };
    modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
    
    confirmBtn.onclick = function() {
        var newDate = dateInput.value;
        if (!newDate) {
            Modal.alert("Please select a date.");
            return;
        }
        var today = new Date().toISOString().split('T')[0];
        if (newDate < today) {
            if (!confirm("This date is in the past. Continue anyway?")) {
                return;
            }
        }
        modal.remove();
        copyGameWithNewDate(gameId, newDate);
    };
    
    dateInput.onkeydown = function(e) {
        if (e.key === 'Enter') {
            confirmBtn.click();
        }
    };
}

function editGameDirect(gameId) {
    editGameConfirmed(gameId);
}

function editGameConfirmed(gameId) {
    SessionManager.addNavigationHistory("setup-game.html", "game_edit", { gameId: gameId });
    db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            var gameData = doc.data();
            gameData.id = doc.id;
            sessionStorage.setItem("editGameData", JSON.stringify(gameData));
            window.location.href = "setup-game.html?mode=edit";
        } else {
            Modal.alert("Game not found");
        }
    }).catch(function(e) {
        Modal.alert("Error loading game: " + e.message);
    });
}

function performFirestoreDelete(collectionName, docId, redirectUrl) {
    WaitingScreen.show("Deleting game...");
    
    return new Promise(function(resolve) {
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                resolve();
            });
        });
    }).then(function() {
        return db.collection(collectionName).doc(docId).delete();
    }).then(function() {
        setTimeout(function() {
            window.location.href = redirectUrl;
        }, 1500);
    }).catch(function(e) {
        WaitingScreen.hide();
        Modal.alert("Error deleting game: " + e.message);
        return Promise.reject(e);
    });
}

function deleteGameProtected(gameId, gameDate) {
    AuthPin.requireAuth('delete', gameId, gameDate, function() {
        deleteGameConfirmed(gameId, gameDate);
    });
}

function deleteGameConfirmed(gameId, gameDate) {
    Modal.confirm(
        "Delete scheduled game on " + gameDate + "? This action cannot be undone.",
        function() {
            SessionManager.addNavigationHistory("manage-games.html", "game_deleted", { gameId: gameId });
            performFirestoreDelete("scheduledGames", gameId, "manage-games.html");
        },
        function() {
            console.log("Deletion cancelled");
        }
    );
}

function goBackToSettings() {
    showAllGames = false;
    window.location.href = "admin.html";
}

function toggleView() {
    showAllGames = !showAllGames;
    loadAndRender();
}

function loadAndRender() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Connecting</div>';
        return;
    }
    
    var todayStr = getTodayString();
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            var data = doc.data();
            var gameDate = data.date || data.gameInfo?.date || "Unknown";
            
            if (showAllGames) {
                games.push({ id: doc.id, date: gameDate, course: data.course, players: data.players });
            } else {
                if (gameDate !== "Unknown" && gameDate >= todayStr) {
                    games.push({ id: doc.id, date: gameDate, course: data.course, players: data.players });
                }
            }
        });
        
        games.sort(function(a, b) {
            if (a.date === "Unknown") return 1;
            if (b.date === "Unknown") return -1;
            if (a.date < b.date) return -1;
            if (a.date > b.date) return 1;
            return 0;
        });
        
        var titleText = showAllGames ? 'All Scheduled Games' : 'Upcoming Games';
        var badgeText = showAllGames ? 'All' : 'Upcoming';
        var badgeClass = showAllGames ? 'badge-all' : '';
        var viewHint = showAllGames ? 'cmd+click to show upcoming' : 'cmd+click to show all';
        
        if (games.length === 0) {
            var emptyMsg = showAllGames ? 'No scheduled games found.' : 'No upcoming games found.';
            document.getElementById("app").innerHTML = `
                <div class="header">
                    <div class="title">Scheduled Games</div>
                    <div class="subtitle">Manage</div>
                </div>
                <div class="card">
                    <div class="card-title" id="cardTitle">
                        ${titleText}
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <span class="hint">${viewHint}</span>
                    </div>
                    <div class="empty-msg">${emptyMsg}</div>
                </div>
                <div class="back-link" onclick="goBackToSettings()">Back to Game Settings</div>
            `;
            attachTitleClickHandler();
            return;
        }
        
        var gamesHtml = '';
        for (var i = 0; i < games.length; i++) {
            var game = games[i];
            var formattedDate = formatDate(game.date);
            var courseName = game.course ? game.course.name : 'Unknown Course';
            var playerCount = game.players ? game.players.length : 0;
            
            var isPastGame = (game.date !== "Unknown" && game.date < todayStr);
            var pastClass = isPastGame ? 'game-item-past' : '';
            
            var docIdHtml = '<div class="doc-id-display doc-copy-target" data-gameid="' + escapeHtml(game.id) + '" data-gamedate="' + escapeHtml(game.date) + '">' + escapeHtml(game.id) + '<span class="copy-hint">cmd+click to copy</span></div>';
            
            gamesHtml += `
                <div class="game-item ${pastClass}">
                    <div class="game-info">
                        <div class="game-date">${formattedDate}${isPastGame ? ' (past)' : ''}</div>
                        <div class="game-course">${escapeHtml(courseName)}</div>
                        <div class="game-players">${playerCount} players</div>
                    </div>
                    <div class="game-actions">
                        <button class="btn-edit" onclick="editGameDirect('${game.id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteGameProtected('${game.id}', '${formattedDate}')">Delete</button>
                    </div>
                    ${docIdHtml}
                </div>
            `;
        }
        
        var html = `
            <div class="header">
                <div class="title">Scheduled Games</div>
                <div class="subtitle">Manage</div>
            </div>
            <div class="card">
                <div class="card-title" id="cardTitle">
                    ${titleText}
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <span class="hint">${viewHint}</span>
                </div>
                <div class="game-list">
                    ${gamesHtml}
                </div>
            </div>
            <div class="back-link" onclick="goBackToSettings()">Back to Game Settings</div>
        `;
        
        document.getElementById("app").innerHTML = html;
        attachTitleClickHandler();
        
        var docElements = document.querySelectorAll('.doc-copy-target');
        for (var j = 0; j < docElements.length; j++) {
            (function(el) {
                var gameId = el.getAttribute('data-gameid');
                var gameDate = el.getAttribute('data-gamedate');
                setupLongClick(
                    el,
                    '📋',
                    'Copy',
                    'Game',
                    function() {
                        showCopyModal(gameId, gameDate);
                    }
                );
            })(docElements[j]);
        }
        
    }).catch(function(e) {
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading games. Please refresh.</div>';
    });
}

function attachTitleClickHandler() {
    var titleEl = document.getElementById('cardTitle');
    if (titleEl) {
        var newTitle = titleEl.cloneNode(true);
        titleEl.parentNode.replaceChild(newTitle, titleEl);
        
        var titleAction = function() {
            toggleView();
        };
        
        setupLongClick(
            newTitle,
            '📋',
            showAllGames ? 'Upcoming' : 'All',
            'Games',
            titleAction
        );
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

window.deleteGame = deleteGameProtected;
window.editGameDirect = editGameDirect;
window.goBackToSettings = goBackToSettings;
window.showCopyModal = showCopyModal;
window.copyGameWithNewDate = copyGameWithNewDate;
window.generateGameId = generateGameId;
window.toggleView = toggleView;

SessionManager.initSession("manage-games.html", "admin.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    displayDeviceId();
    loadAndRender();
});
</script>
</body>
</html>
