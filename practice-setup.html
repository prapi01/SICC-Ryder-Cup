<!-- FILE: practice-setup.html - VERSION 1.09 -->
<!-- Start a new practice game with SHOTGUN START support -->
<!-- Compact Shotgun button with inline dropdown -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Practice Setup - SICC Ryder Cup</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(145deg, #0a1a0a 0%, #000000 100%);
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; 
            color: #ffffff; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .version-tag { 
            position: fixed; 
            top: 8px; 
            right: 8px; 
            font-size: 0.65rem; 
            color: #ffaa44; 
            background: rgba(0,0,0,0.6); 
            padding: 2px 10px; 
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.8;
        }
        
        .device-tag {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 0.55rem;
            color: #ffaa44;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 1.8rem; font-weight: 800; color: #ffaa44; }
        .subtitle { font-size: 0.8rem; color: #888; margin-top: 4px; }
        
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #ffaa44; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #ffaa44; }
        
        /* Three-button toggle for Starting Hole - with inline dropdown */
        .starting-hole-toggle {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .hole-toggle-btn {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccc;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .hole-toggle-btn.active {
            background: #2a2a1a;
            border-color: #ffaa44;
            color: #ffaa44;
        }
        .hole-toggle-btn.shotgun-btn {
            flex: 1.2;
            gap: 2px;
        }
        .inline-shotgun-select {
            background: transparent;
            border: none;
            color: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            width: 50px;
            text-align: center;
        }
        .inline-shotgun-select:focus {
            outline: none;
        }
        .inline-shotgun-select option {
            background: #1a1a1a;
            color: #fff;
        }
        
        .players-grid {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .team-section { margin-bottom: 16px; }
        .team-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #333; }
        .team-title.team-a { color: #4caf50; }
        .team-title.team-b { color: #ff6b6b; }
        
        .player-input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            align-items: center;
        }
        .player-name-input { flex: 2; }
        .player-handicap-input { flex: 1; }
        .player-label-input { flex: 1; }
        
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(145deg, #2a2a1a 0%, #1a1a0a 100%);
            border: 1px solid #ffaa44;
            color: #ffaa44;
        }
        .btn-secondary {
            background: rgba(26,26,26,0.9);
            border: 1px solid #333;
            color: #ccc;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        .alert-success { background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; }
        .alert-error { background: #3a1a1a; border: 1px solid #ff6b6b; color: #ff6b6b; }
        .alert-info { background: #1a1a3a; border: 1px solid #ffaa44; color: #ffaa44; }
        
        .loading { text-align: center; padding: 40px; color: #888; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.6rem; color: #444; }
        
        .course-selector {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .course-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .course-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .course-btn.selected {
            background: #2a2a1a;
            border-color: #ffaa44;
            color: #ffaa44;
        }
        
        .role-buttons {
            display: flex;
            gap: 16px;
            margin-top: 12px;
        }
        .role-btn {
            flex: 1;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #ffaa44;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            color: #ffaa44;
        }
        .role-btn.selected {
            background: #2a2a1a;
            border: 2px solid #ffaa44;
        }
        
        .info-note { font-size: 0.7rem; color: #ffaa44; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v1.09</div>

<script>
// FILE: practice-setup.html - VERSION 1.09
// Creates PRACTICE game documents with CONSOLIDATED structure + SHOTGUN START support
// Compact Shotgun button with inline dropdown

var VERSION = "1.09";
var CACHE_KEY = "practice_setup_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var courses = [];

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

// Default players (SICC Ryder Cup teams)
var DEFAULT_PLAYERS = [
    { name: "Ang CH", team: "A", flight: 1, handicap: 1, label: "ACH" },
    { name: "Kenneth Foo", team: "A", flight: 1, handicap: 3, label: "KF" },
    { name: "Jeff Goh", team: "B", flight: 1, handicap: 0, label: "JG" },
    { name: "Ong C B", team: "B", flight: 1, handicap: 1, label: "OCB" },
    { name: "C K", team: "A", flight: 2, handicap: 8, label: "CK" },
    { name: "Yip H M", team: "A", flight: 2, handicap: 12, label: "YHM" },
    { name: "Piti", team: "B", flight: 2, handicap: 8, label: "P" },
    { name: "James Ong", team: "B", flight: 2, handicap: 11, label: "JO" }
];

// Generate default data string in NATURAL order (1-18)
function generateDefaultDataNatural(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

// Rotate data string to start at startingHole
function rotateDataString(naturalData, startingHole) {
    if (startingHole === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHole - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHole - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    var deviceTag = document.getElementById("deviceTag");
    if (deviceTag) deviceTag.innerHTML = deviceDisplay;
}

function loadCourses() {
    return db.collection("courses").get().then(function(snapshot) {
        courses = [];
        snapshot.forEach(function(doc) {
            courses.push({ id: doc.id, name: doc.data().name, par: doc.data().par, si: doc.data().si });
        });
        return courses;
    });
}

var state = {
    startingHole: 1,
    startingHoleType: "hole1"  // "hole1", "hole10", "shotgun"
};

function setStartingHole(type, value) {
    state.startingHoleType = type;
    if (type === "hole1") {
        state.startingHole = 1;
    } else if (type === "hole10") {
        state.startingHole = 10;
    } else if (type === "shotgun") {
        state.startingHole = value || 1;
    }
    render();
}

function savePracticeGame(courseId, selectedRole) {
    var selectedCourse = courses.find(function(c) { return c.id === courseId; });
    if (!selectedCourse) {
        alert("Please select a course");
        return;
    }
    
    var naturalData = generateDefaultDataNatural(selectedCourse.par);
    var rotatedData = rotateDataString(naturalData, state.startingHole);
    
    var gameData = {
        course: {
            name: selectedCourse.name,
            par: selectedCourse.par,
            si: selectedCourse.si
        },
        players: DEFAULT_PLAYERS,
        status: "practice",
        gameType: "practice",
        startingHole: state.startingHole,
        
        f1: {
            d: rotatedData,
            se: false,
            x: false
        },
        
        f2: {
            d: rotatedData,
            se: false,
            x: false
        },
        
        locks: {
            f1: null,
            f2: null
        },
        
        currentHoleF1: 1,
        currentHoleF2: 1,
        
        practiceRole: selectedRole,
        
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: Date.now() + (7 * 24 * 60 * 60 * 1000)
    };
    
    db.collection("practiceGames").add(gameData).then(function(docRef) {
        console.log("Practice game created with ID:", docRef.id);
        
        sessionStorage.setItem("practiceGameId", docRef.id);
        sessionStorage.setItem("practiceRole", selectedRole);
        
        showAlert("success", "Practice game created successfully!");
        setTimeout(function() {
            window.location.href = "pre-game.html";
        }, 1500);
    }).catch(function(error) {
        console.error("Error creating practice game:", error);
        showAlert("error", "Error creating practice game: " + error.message);
    });
}

function showAlert(type, message) {
    var alertDiv = document.createElement("div");
    alertDiv.className = "alert alert-" + type;
    alertDiv.innerHTML = message;
    var container = document.querySelector(".container");
    var form = document.getElementById("gameForm");
    container.insertBefore(alertDiv, form);
    setTimeout(function() {
        alertDiv.remove();
    }, 3000);
}

function render() {
    var hole1Class = "hole-toggle-btn" + (state.startingHoleType === "hole1" ? " active" : "");
    var hole10Class = "hole-toggle-btn" + (state.startingHoleType === "hole10" ? " active" : "");
    var shotgunClass = "hole-toggle-btn shotgun-btn" + (state.startingHoleType === "shotgun" ? " active" : "");
    
    var shotgunSelectValue = state.startingHole;
    
    var html = `
        <div class="header">
            <div class="title">🧪 START PRACTICE GAME</div>
            <div class="subtitle">Create a practice session (auto-deletes after 7 days)</div>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="gameForm">
            <div class="form-group">
                <label class="form-label">🏟️ SELECT COURSE</label>
                <div id="courseButtons" class="course-buttons">Loading courses...</div>
            </div>
            
            <div class="form-group">
                <label class="form-label">⛳ STARTING HOLE (SHOTGUN START)</label>
                <div class="starting-hole-toggle">
                    <div class="${hole1Class}" data-type="hole1">Hole 1</div>
                    <div class="${hole10Class}" data-type="hole10">Hole 10</div>
                    <div class="${shotgunClass}" data-type="shotgun">
                        Shotgun 
                        <select id="shotgunHoleSelect" class="inline-shotgun-select">
                            <option value="1" ${shotgunSelectValue === 1 ? 'selected' : ''}>1</option>
                            <option value="2" ${shotgunSelectValue === 2 ? 'selected' : ''}>2</option>
                            <option value="3" ${shotgunSelectValue === 3 ? 'selected' : ''}>3</option>
                            <option value="4" ${shotgunSelectValue === 4 ? 'selected' : ''}>4</option>
                            <option value="5" ${shotgunSelectValue === 5 ? 'selected' : ''}>5</option>
                            <option value="6" ${shotgunSelectValue === 6 ? 'selected' : ''}>6</option>
                            <option value="7" ${shotgunSelectValue === 7 ? 'selected' : ''}>7</option>
                            <option value="8" ${shotgunSelectValue === 8 ? 'selected' : ''}>8</option>
                            <option value="9" ${shotgunSelectValue === 9 ? 'selected' : ''}>9</option>
                            <option value="10" ${shotgunSelectValue === 10 ? 'selected' : ''}>10</option>
                            <option value="11" ${shotgunSelectValue === 11 ? 'selected' : ''}>11</option>
                            <option value="12" ${shotgunSelectValue === 12 ? 'selected' : ''}>12</option>
                            <option value="13" ${shotgunSelectValue === 13 ? 'selected' : ''}>13</option>
                            <option value="14" ${shotgunSelectValue === 14 ? 'selected' : ''}>14</option>
                            <option value="15" ${shotgunSelectValue === 15 ? 'selected' : ''}>15</option>
                            <option value="16" ${shotgunSelectValue === 16 ? 'selected' : ''}>16</option>
                            <option value="17" ${shotgunSelectValue === 17 ? 'selected' : ''}>17</option>
                            <option value="18" ${shotgunSelectValue === 18 ? 'selected' : ''}>18</option>
                        </select>
                    </div>
                </div>
                <div class="info-note">💡 Play will begin at selected hole. Scorecard will show holes in play order.</div>
            </div>
            
            <div class="form-group">
                <label class="form-label">🎮 SELECT YOUR ROLE</label>
                <div class="role-buttons">
                    <div class="role-btn" data-role="update1">✏️ UPDATE FLIGHT 1</div>
                    <div class="role-btn" data-role="update2">✏️ UPDATE FLIGHT 2</div>
                    <div class="role-btn" data-role="view">👁️ VIEW ONLY</div>
                </div>
            </div>
            
            <div class="players-grid">
                <div class="team-section">
                    <div class="team-title team-a">🇸🇬 TEAM A</div>
                    <div>${DEFAULT_PLAYERS.filter(p => p.team === "A").map(p => '<div class="player-input-row"><span>' + p.name + ' (HCP ' + p.handicap + ')</span></div>').join('')}</div>
                </div>
                <div class="team-section">
                    <div class="team-title team-b">🌍 TEAM B</div>
                    <div>${DEFAULT_PLAYERS.filter(p => p.team === "B").map(p => '<div class="player-input-row"><span>' + p.name + ' (HCP ' + p.handicap + ')</span></div>').join('')}</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <button type="button" class="btn btn-secondary" id="cancelBtn">← CANCEL</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">✅ START PRACTICE</button>
            </div>
        </form>
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
    
    // Load courses and render buttons
    loadCourses().then(function() {
        var courseContainer = document.getElementById("courseButtons");
        if (courseContainer && courses.length > 0) {
            var buttonsHtml = '';
            for (var i = 0; i < courses.length; i++) {
                var selected = (i === 0) ? 'selected' : '';
                buttonsHtml += `<div class="course-btn ${selected}" data-course-id="${courses[i].id}">${escapeHtml(courses[i].name)}</div>`;
            }
            courseContainer.innerHTML = buttonsHtml;
            
            document.querySelectorAll('.course-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.course-btn').forEach(function(b) { b.classList.remove('selected'); });
                    this.classList.add('selected');
                });
            });
        } else {
            courseContainer.innerHTML = '<div class="alert alert-info">No courses found. Please add courses in Course Management first.</div>';
        }
    }).catch(function(err) {
        console.error("Error loading courses:", err);
        document.getElementById("courseButtons").innerHTML = '<div class="alert alert-error">Error loading courses. Please refresh.</div>';
    });
    
    // Three-button toggle listeners
    document.querySelectorAll(".hole-toggle-btn").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
            // Don't trigger if clicking on the select dropdown inside shotgun button
            if (e.target.tagName === 'SELECT') return;
            
            var type = this.dataset.type;
            if (type === "shotgun") {
                var select = document.getElementById("shotgunHoleSelect");
                var holeValue = select ? parseInt(select.value) : 1;
                setStartingHole("shotgun", holeValue);
            } else if (type === "hole1") {
                setStartingHole("hole1", 1);
            } else if (type === "hole10") {
                setStartingHole("hole10", 10);
            }
        });
    });
    
    // Shotgun dropdown listener
    var shotgunSelect = document.getElementById("shotgunHoleSelect");
    if (shotgunSelect) {
        shotgunSelect.addEventListener("change", function() {
            if (state.startingHoleType === "shotgun") {
                state.startingHole = parseInt(this.value);
            } else {
                // If dropdown is changed while shotgun not active, activate shotgun
                setStartingHole("shotgun", parseInt(this.value));
            }
        });
    }
    
    // Role selection
    var selectedRole = null;
    document.querySelectorAll('.role-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('selected'); });
            this.classList.add('selected');
            selectedRole = this.dataset.role;
        });
    });
    
    document.getElementById("gameForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        var selectedCourseBtn = document.querySelector('.course-btn.selected');
        if (!selectedCourseBtn) {
            showAlert("error", "Please select a course");
            return;
        }
        
        if (!selectedRole) {
            showAlert("error", "Please select a role");
            return;
        }
        
        var courseId = selectedCourseBtn.dataset.courseId;
        savePracticeGame(courseId, selectedRole);
    });
    
    document.getElementById("cancelBtn").addEventListener("click", function() {
        window.location.href = "practice-mode.html";
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("practice-setup.html", "practice-mode.html", function(session) {
    console.log("Session initialized:", session);
    displayDeviceId();
    render();
});
</script>
</body>
</html>
