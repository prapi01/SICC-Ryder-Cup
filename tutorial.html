// Apply user settings IMMEDIATELY before anything else
// ============================================================

    AppSettings.init();
} else {

}

// ============================================================
// VERSION CACHE-BUSTING - v1.26: Preserves all URL parameters
// ============================================================
var APP_VERSION = "1.26";
var CACHE_KEY = "tutorial_version_v126";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    // v1.24: Preserve ALL existing URL parameters
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[TUTORIAL] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

var totalSteps = 9;

function updateStepIndicator() {
    var container = document.getElementById('stepIndicator');
    var html = '';
    for (var i = 1; i <= totalSteps; i++) {
        var status = '';
        if (i === currentStep) status = 'active';
        else if (i < currentStep) status = 'completed';
        html += '<div class="step-dot ' + status + '">' + i + '</div>';
    }
    container.innerHTML = html;
}

function addHighlight(elementId) {
    setTimeout(function() {
        var el = document.getElementById(elementId);
        if (el) {
            el.classList.add('highlight');
        }
    }, 100);
}

// ============================================================
// Custom Exit Modal Function - v1.22: Hide content immediately
// ============================================================

function showExitModal() {
    // Remove any existing modal
    var existingModal = document.getElementById('exitModal');
    if (existingModal) existingModal.remove();
    
    var modalHtml = `
        <div class="modal-overlay" id="exitModal" style="z-index: 20000;">
            <div style="background:#1a1a1a; border-radius:28px; padding:28px; max-width:340px; width:90%; text-align:center; border:2px solid #4caf50;">
                <div style="font-size:1.1rem; font-weight:600; color:#888; margin-bottom:12px;">EXIT TUTORIAL</div>
                <div style="font-size:0.85rem; color:#ccc; margin-bottom:24px; line-height:1.4;">
                    Exit tutorial and return to main menu?
                </div>
                <div style="display:flex; gap:12px;">
                    <button id="exitModalCancelBtn" style="flex:1; background:#1a1a1a; border:1px solid #333; color:#888; padding:12px; border-radius:40px; font-weight:600; font-size:0.9rem; cursor:pointer;">CANCEL</button>
                    <button id="exitModalConfirmBtn" style="flex:1; background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; padding:12px; border-radius:40px; font-weight:700; font-size:0.9rem; cursor:pointer;">EXIT</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById('exitModalCancelBtn').onclick = function() {
        document.getElementById('exitModal').remove();
    };
    
    document.getElementById('exitModalConfirmBtn').onclick = function() {
        document.getElementById('exitModal').remove();
        
        // v1.22: IMMEDIATELY hide the entire tutorial content and show grey icon
        var container = document.querySelector('.container');
        var stepIndicator = document.querySelector('.step-indicator');
        var instructionPanel = document.querySelector('.instruction-panel');
        var navButtons = document.querySelector('.navigation-buttons');
        
        if (container) container.style.visibility = 'hidden';
        if (stepIndicator) stepIndicator.style.visibility = 'hidden';
        if (instructionPanel) instructionPanel.style.visibility = 'hidden';
        if (navButtons) navButtons.style.visibility = 'hidden';
        
        // Show full-screen grey icon overlay
        var exitOverlay = document.createElement('div');
        exitOverlay.className = 'exit-overlay';
        exitOverlay.innerHTML = '<div class="exit-grey-icon">⛳</div>';
        document.body.appendChild(exitOverlay);
        
        // Small delay to ensure overlay is rendered, then navigate
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 50);
    };
}

// ============================================================
// Main Render Function - v1.23: Calls modular render functions
// ============================================================

function renderStep() {
    var demoScreen = document.getElementById('demoScreen');
    var instructionTitle = document.getElementById('instructionTitle');
    var instructionText = document.getElementById('instructionText');
    var instructionTip = document.getElementById('instructionTip');
    
    switch(currentStep) {
        case 1:
            renderStep1();
            instructionTitle.innerHTML = 'Step 1: Main Menu';
            break;
        case 2:
            if (typeof TutorialScoring !== 'undefined' && TutorialScoring.renderStep2) {
                TutorialScoring.renderStep2(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialScoring module not loaded');
            }
            break;
        case 3:
            if (typeof TutorialScoring !== 'undefined' && TutorialScoring.renderStep3) {
                TutorialScoring.renderStep3(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialScoring module not loaded');
            }
            break;
        case 4:
            if (typeof TutorialScoring !== 'undefined' && TutorialScoring.renderStep4) {
                TutorialScoring.renderStep4(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialScoring module not loaded');
            }
            break;
        case 5:
            if (typeof TutorialResults !== 'undefined' && TutorialResults.renderStep5) {
                TutorialResults.renderStep5(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialResults module not loaded');
            }
            break;
        case 6:
            if (typeof TutorialResults !== 'undefined' && TutorialResults.renderStep6) {
                TutorialResults.renderStep6(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialResults module not loaded');
            }
            break;
        case 7:
            if (typeof TutorialPostGame !== 'undefined' && TutorialPostGame.renderStep7) {
                TutorialPostGame.renderStep7(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight, function() {
                    if (currentStep < totalSteps) {
                        currentStep++;
                        renderStep();
                    }
                });
            } else {
                console.error('TutorialPostGame module not loaded');
            }
            break;
        case 8:
            if (typeof TutorialPostGame !== 'undefined' && TutorialPostGame.renderStep8) {
                TutorialPostGame.renderStep8(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialPostGame module not loaded');
            }
            break;
        case 9:
            if (typeof TutorialPostGame !== 'undefined' && TutorialPostGame.renderStep9) {
                TutorialPostGame.renderStep9(demoScreen, instructionTitle, instructionText, instructionTip, addHighlight);
            } else {
                console.error('TutorialPostGame module not loaded');
            }
            break;
    }
    updateStepIndicator();
    
    document.getElementById('prevBtn').disabled = (currentStep === 1);
    if (currentStep === totalSteps) {
        document.getElementById('nextBtn').innerHTML = 'FINISH →';
    } else {
        document.getElementById('nextBtn').innerHTML = 'NEXT →';
    }
}

// ============================================================
// Navigation - v1.22: Custom modal for EXIT button
// ============================================================

document.getElementById('prevBtn').addEventListener('click', function() {
    if (currentStep > 1) {
        currentStep--;
        renderStep();
    }
});

document.getElementById('nextBtn').addEventListener('click', function() {
    if (currentStep < totalSteps) {
        currentStep++;
        renderStep();
    } else {
        window.location.href = 'index.html';
    }
});

document.getElementById('skipBtn').addEventListener('click', function() {
    showExitModal();
});

// Initialize
renderStep();
</script>
