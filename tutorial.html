var currentStep = 1;

function updateStepIndicator() {
    var container = document.getElementById('stepIndicator');
    var html = '';
    for (var i = 1; i <= totalSteps; i++) {
        var status = '';
        if (i === currentStep) status = 'active';
        else if (i < currentStep) status = 'completed';
        html += '<div class="step-dot ' + status + '">' + i + '</div>';
    }
    container.innerHTML = html;
}

function addHighlight(elementId) {
    setTimeout(function() {
        var el = document.getElementById(elementId);
        if (el) el.classList.add('highlight');

}

function renderStep() {
    switch(currentStep) {
        case 1: renderStep1(); document.getElementById('instructionTitle').innerHTML = 'Step 1: Main Menu'; break;
        case 2: renderStep2(); document.getElementById('instructionTitle').innerHTML = 'Step 2: Select Your Role'; break;
        case 3: renderStep3(); document.getElementById('instructionTitle').innerHTML = 'Step 3: Enter Scores'; break;
        case 4: renderStep4(); document.getElementById('instructionTitle').innerHTML = 'Step 4: Correct a Previous Hole'; break;
        case 5: renderStep5(); document.getElementById('instructionTitle').innerHTML = 'Step 5: Match Game (Bubbles)'; break;
        case 6: renderStep6(); document.getElementById('instructionTitle').innerHTML = 'Step 6: Team Game + Stroke Game'; break;
        case 7: renderStep7(); document.getElementById('instructionTitle').innerHTML = 'Step 7: Sign Your Scorecard'; break;
        case 8: renderStep8(); document.getElementById('instructionTitle').innerHTML = 'Step 8: Waiting for Other Flight'; break;
        case 9: renderStep9(); document.getElementById('instructionTitle').innerHTML = 'Step 9: Handicap Adjustment + [Raw]'; break;
    }
    updateStepIndicator();
    document.getElementById('prevBtn').disabled = (currentStep === 1);
    document.getElementById('nextBtn').innerHTML = (currentStep === totalSteps) ? 'FINISH →' : 'NEXT →';
}

document.getElementById('prevBtn').addEventListener('click', function() { if(currentStep > 1) { currentStep--; renderStep(); } });
document.getElementById('nextBtn').addEventListener('click', function() { if(currentStep < totalSteps) { currentStep++; renderStep(); } else { window.location.href = 'index.html'; } });
document.getElementById('skipBtn').addEventListener('click', function() { if(confirm('Exit tutorial and return to main menu?')) window.location.href = 'index.html'; });

renderStep();
</script>
