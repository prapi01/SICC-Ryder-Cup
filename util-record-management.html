<!--
FILE: util-record-management.html
VERSION: 1.25
KEY CHANGES from v1.24:
   - ADDED: "APPLY STAGED PHOTO" button in the VALIDATE tab
   - This button allows users to apply a staged photo without needing data mismatches
   - Works even when the record is already valid
   - Button is styled with photo purple color (#8b5cf6)
   - PRESERVED: All existing functionality from v1.24
DEPENDS ON: js/util-core.js, js/util-validate-record.js, js/util-validate-ui.js, js/util-validate-app.js, js/util-copy-record.js, js/util-compare-record.js, js/util-delete-record.js, js/util-photo.js
STATUS: Ready for integration
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Record Management Tool v3.0</title>
    <style>
        /* ... existing styles ... */
        .btn-photo-apply {
            border-color: #8b5cf6;
            color: #8b5cf6;
        }
        .btn-photo-apply:hover {
            background: rgba(139, 92, 246, 0.1);
        }
        /* ... rest of existing styles ... */
    </style>
</head>
<body>
    <!-- ... existing HTML ... -->
    <div id="validateTab" class="tab-content">
        <div class="tab-header-with-info">
            <span class="tab-title">🔬 VALIDATE <span class="version-badge" id="validateVersionBadge">r1.09 u1.05 a1.03</span></span>
            <button class="btn-info-guide" onclick="showValidateInfoGuide()">ℹ️ Information</button>
        </div>
        <div class="card">
            <div class="card-title">🌍 ENVIRONMENT</div>
            <div class="env-row">
                <span class="env-side-label">🔬 VALIDATE</span>
                <div class="env-selector">
                    <button class="env-btn-small active-prod" id="validateProdBtn">PROD</button>
                    <button class="env-btn-small" id="validateDevBtn">DEV</button>
                </div>
                <span id="validateIndicator" class="env-indicator-small prod">PROD</span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📂 SELECT RECORD</div>
            <div class="select-wrapper">
                <select id="validateCollection" class="collection-select">
                    <option value="scheduledGames">scheduledGames</option>
                    <option value="historyGames">historyGames</option>
                    <option value="backupFolder">backupFolder</option>
                </select>
                <button id="validateRefreshBtn" class="btn btn-secondary">↻</button>
            </div>
            <div class="select-wrapper" style="margin-top:8px;">
                <select id="validateRecordSelect" class="record-select">
                    <option value="">-- Select a record --</option>
                </select>
                <button id="validateLoadBtn" class="btn btn-primary">▶ LOAD & VALIDATE</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="validateResults" class="results-panel">
            <div class="card">
                <div class="card-title">📋 GAME INFO</div>
                <div id="validateGameInfo"></div>
            </div>
            <div class="card">
                <div class="card-title">📸 CELEBRATION PHOTO</div>
                <div id="validatePhotoStatus"></div>
                <!-- v1.25: Apply Staged Photo button -->
                <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button id="validateApplyPhotoBtn" class="btn btn-photo-apply" disabled style="opacity:0.5;">
                        📸 APPLY STAGED PHOTO
                    </button>
                </div>
            </div>
            <div class="card">
                <div class="card-title">✈️ FLIGHT 1</div>
                <div id="validateFlight1"></div>
            </div>
            <div class="card">
                <div class="card-title">✈️ FLIGHT 2</div>
                <div id="validateFlight2"></div>
            </div>
            <div class="card">
                <div class="card-title">📊 T-1</div>
                <div id="validateT1"></div>
            </div>
            <div class="card">
                <div class="card-title">📊 T-2</div>
                <div id="validateT2"></div>
            </div>
            <div class="card">
                <div class="card-title">⛳ STROKE</div>
                <div id="validateStrk"></div>
            </div>
            <div class="card">
                <div class="card-title">🏅 MATCH</div>
                <div id="validateMatch"></div>
            </div>
            <div class="card">
                <div class="card-title">🏆 TR</div>
                <div id="validateTR"></div>
            </div>
            <div class="card">
                <div class="card-title">📊 SUMMARY</div>
                <div id="validateSummary"></div>
            </div>
            <div id="validateDetailsCard" class="card" style="display:none;">
                <div class="card-title">🔍 DETAILED MISMATCHES</div>
                <div id="validateDetails"></div>
            </div>
            <div id="validateFixCard" class="card" style="display:none; border-color:#4caf50;">
                <div class="card-title">🔧 FIX RECORD</div>
                <div id="validateStatus" class="validate-status" style="display:none;"></div>
                <div id="validateProgress" class="validate-progress"></div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                    <button id="validateBackupBtn" class="btn btn-secondary">💾 Backup Only</button>
                    <button id="validateFixBtn" class="btn btn-success">✅ Fix Record</button>
                </div>
            </div>
        </div>
    </div>
    <!-- ... rest of existing HTML ... -->
</body>
</html>
