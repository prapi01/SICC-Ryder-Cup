<!DOCTYPE html>
<html>
<head>
    <title>Test Game Calculators</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <script src="js/game-data.js"></script>
    <script src="js/game-match.js"></script>
    <script src="js/game-team.js"></script>
    <script src="js/game-stroke.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
        .result { background: #111; padding: 10px; margin: 10px 0; border-left: 3px solid #4caf50; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        button { background: #1a3a1a; color: #4caf50; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Game Calculators</h1>
    <div>
        <label>Game ID: </label>
        <input type="text" id="gameId" style="width:300px; background:#111; color:#fff; border:1px solid #333; padding:8px;">
        <button onclick="testCalculators()">Test</button>
    </div>
    <div id="output"></div>

    <script>
    var FIREBASE_CONFIG = {
        apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
        authDomain: "sicc-ryder-cup.firebaseapp.com",
        projectId: "sicc-ryder-cup",
        storageBucket: "sicc-ryder-cup.firebasestorage.app",
        messagingSenderId: "137641493845",
        appId: "1:137641493845:web:32399940bce639b01ddbdc"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    var db = firebase.firestore();

    async function testCalculators() {
        var gameId = document.getElementById('gameId').value;
        if (!gameId) {
            alert('Enter a game ID');
            return;
        }

        var output = document.getElementById('output');
        output.innerHTML = '<div>Loading game data...</div>';

        try {
            // Load game data
            var doc = await db.collection('scheduledGames').doc(gameId).get();
            if (!doc.exists) {
                output.innerHTML = '<div style="color:red">Game not found</div>';
                return;
            }

            var gameData = doc.data();
            
            // Set up GameData with the loaded data
            // Note: GameData expects to be initialized via loadGameFromSession
            // For testing, we need to set the data manually
            
            var flight1Data = gameData.f1?.d || '';
            var flight2Data = gameData.f2?.d || '';
            var players = gameData.players || [];
            var courseSi = gameData.course?.si || [];
            var startingHole = gameData.startingHole || 1;
            var teamGameFormat = gameData.teamGameFormat || 'tournament';
            
            output.innerHTML = '<div>✅ Game loaded: ' + gameData.course?.name + '</div>';
            
            // Test GameMatch.calculateAllMatches
            output.innerHTML += '<div class="result"><strong>GameMatch.calculateAllMatches()</strong><pre>';
            try {
                var matchResults = GameMatch.calculateAllMatches(players, flight1Data, flight2Data, courseSi, startingHole);
                output.innerHTML += 'crossFlight matches: ' + matchResults.crossFlight.length + '\n';
                output.innerHTML += 'intraFlight1 matches: ' + matchResults.intraFlight1.length + '\n';
                output.innerHTML += 'intraFlight2 matches: ' + matchResults.intraFlight2.length + '\n';
                output.innerHTML += 'Sample cross result (first match, hole 1): ' + JSON.stringify(matchResults.crossFlight[0]?.[0]) + '\n';
            } catch(e) {
                output.innerHTML += 'ERROR: ' + e.message + '\n';
            }
            output.innerHTML += '</pre></div>';
            
            // Test GameTeam.calculate
            output.innerHTML += '<div class="result"><strong>GameTeam.calculate()</strong><pre>';
            try {
                var teamResults = GameTeam.calculate(players, flight1Data, flight2Data, courseSi, startingHole, teamGameFormat);
                output.innerHTML += 't1Row (first 5 holes): ' + JSON.stringify(teamResults.t1Row.slice(0,5)) + '\n';
                output.innerHTML += 't2Row (first 5 holes): ' + JSON.stringify(teamResults.t2Row.slice(0,5)) + '\n';
                output.innerHTML += 'Flight 1 final total: ' + teamResults.flight1Final + '\n';
                output.innerHTML += 'Flight 2 final total: ' + teamResults.flight2Final + '\n';
            } catch(e) {
                output.innerHTML += 'ERROR: ' + e.message + '\n';
            }
            output.innerHTML += '</pre></div>';
            
            // Test GameStroke.calculate
            output.innerHTML += '<div class="result"><strong>GameStroke.calculate()</strong><pre>';
            try {
                var strkRow = GameStroke.calculate(players, flight1Data, flight2Data, courseSi, startingHole);
                output.innerHTML += 'strkRow (first 5 holes): ' + JSON.stringify(strkRow.slice(0,5)) + '\n';
                output.innerHTML += 'All strkRow: ' + JSON.stringify(strkRow) + '\n';
            } catch(e) {
                output.innerHTML += 'ERROR: ' + e.message + '\n';
            }
            output.innerHTML += '</pre></div>';
            
        } catch(err) {
            output.innerHTML = '<div style="color:red">Error: ' + err.message + '</div>';
        }
    }
    </script>
</body>
</html>
