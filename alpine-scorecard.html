<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alpine Scorecard - SICC Ryder Cup</title>
    
    <!-- Alpine.js - Lightweight reactive framework -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui, sans-serif; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .player-card {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .score-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .score-btn {
            background: #1a3a1a;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }
        .score-value {
            font-size: 1.3rem;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }
        
        .scorecard-table {
            width: 100%;
            font-size: 0.7rem;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .scorecard-table th, .scorecard-table td {
            padding: 6px 3px;
            text-align: center;
            border: 1px solid #222;
        }
        .scorecard-table th {
            color: #4caf50;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-save { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-next { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-back { background: #1a1a1a; color: #ccc; border: 1px solid #333; }
        
        .status {
            font-size: 0.7rem;
            color: #4caf50;
            margin: 10px 0;
            text-align: center;
        }
        
        .green-text { color: #4caf50; }
        .invisible { color: #000; }
    </style>
</head>
<body>

<div class="container" x-data="scorecardApp()" x-init="init()">
    <h2 style="text-align:center;">⛳ SICC Ryder Cup</h2>
    <div class="status" x-text="statusMessage"></div>
    
    <!-- Player Cards -->
    <template x-for="player in players">
        <div class="player-card">
            <div class="player-header">
                <span><strong x-text="player.name"></strong> (HCP <span x-text="player.handicap"></span>)</span>
                <div class="score-control">
                    <button class="score-btn" @click="changeScore(player, -1)">-</button>
                    <span class="score-value" x-text="getPlayerScore(player)"></span>
                    <button class="score-btn" @click="changeScore(player, 1)">+</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Scorecard -->
    <table class="scorecard-table">
        <thead>
            <tr>
                <th>Hole</th>
                <template x-for="h in 18">
                    <th x-text="h"></th>
                </template>
                <th>Tot</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Par</td>
                <template x-for="(par, idx) in coursePar">
                    <td x-text="par"></td>
                </template>
                <td x-text="totalPar"></td>
            </tr>
            <template x-for="player in players">
                <tr>
                    <td x-text="player.label"></td>
                    <template x-for="h in 18">
                        <td :class="isHolePlayed(player, h) ? 'green-text' : 'invisible'" 
                            x-text="getHoleScore(player, h)"></td>
                    </template>
                    <td x-text="getPlayerTotal(player)"></td>
                </tr>
            </template>
        </tbody>
    </table>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn btn-back" @click="prevHole">← Back</button>
        <button class="btn btn-save" @click="saveHole">💾 Save</button>
        <button class="btn btn-next" @click="nextHole">Next →</button>
    </div>
</div>

<script>
// Firebase Config
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

// Initialize Firebase
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// Course Data
const COURSE_PAR = [4, 4, 5, 3, 4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 4, 4, 5];

// Mock Game ID - Replace with actual game ID
const GAME_ID = "YOUR_GAME_ID_HERE";

function scorecardApp() {
    return {
        // State
        players: [],
        currentHole: 1,
        localScores: {},
        savedHoles: {},
        statusMessage: "Loading...",
        
        // Computed
        get coursePar() { return COURSE_PAR; },
        get totalPar() { return COURSE_PAR.reduce((a,b) => a + b, 0); },
        
        // Helper: Check if a hole has been saved
        isHolePlayed(player, hole) {
            return this.savedHoles[player.flight] && this.savedHoles[player.flight].includes(hole);
        },
        
        // Get score for a specific player on a specific hole
        getHoleScore(player, hole) {
            const key = `${player.flight}_${hole}_${player.idx}`;
            if (this.localScores[key] !== undefined) {
                return this.localScores[key];
            }
            if (this.savedHoles[player.flight] && this.savedHoles[player.flight].includes(hole)) {
                return this.savedScores[key] || COURSE_PAR[hole-1];
            }
            return COURSE_PAR[hole-1];
        },
        
        // Get current score for a player (current hole)
        getPlayerScore(player) {
            const key = `${player.flight}_${this.currentHole}_${player.idx}`;
            if (this.localScores[key] !== undefined) {
                return this.localScores[key];
            }
            if (this.savedHoles[player.flight] && this.savedHoles[player.flight].includes(this.currentHole)) {
                return this.savedScores[key] || COURSE_PAR[this.currentHole-1];
            }
            return COURSE_PAR[this.currentHole-1];
        },
        
        // Get total score for a player
        getPlayerTotal(player) {
            let total = 0;
            for (let h = 1; h <= 18; h++) {
                total += this.getHoleScore(player, h);
            }
            return total;
        },
        
        // Change score (+/-)
        changeScore(player, delta) {
            const key = `${player.flight}_${this.currentHole}_${player.idx}`;
            const current = this.getPlayerScore(player);
            let newScore = current + delta;
            if (newScore < 1) newScore = 1;
            if (newScore > 99) newScore = 99;
            this.localScores[key] = newScore;
            this.statusMessage = `Unsaved changes for hole ${this.currentHole}`;
        },
        
        // Save current hole to Firebase
        async saveHole() {
            const flight = 1; // Assuming Flight 1 for demo
            const updates = {};
            
            // Build the update payload from localScores for this hole
            for (const [key, score] of Object.entries(this.localScores)) {
                if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                    updates[key] = score;
                }
            }
            
            if (Object.keys(updates).length === 0) {
                this.statusMessage = "No changes to save";
                return;
            }
            
            try {
                this.statusMessage = "Saving...";
                // Update Firebase - simplified for demo
                // In real implementation, update the f1.d string
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Clear local scores for this hole
                for (const key of Object.keys(this.localScores)) {
                    if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                        delete this.localScores[key];
                    }
                }
                
                // Add to saved holes
                if (!this.savedHoles[flight]) this.savedHoles[flight] = [];
                if (!this.savedHoles[flight].includes(this.currentHole)) {
                    this.savedHoles[flight].push(this.currentHole);
                }
                
                this.statusMessage = `Hole ${this.currentHole} saved!`;
            } catch (error) {
                this.statusMessage = `Save failed: ${error.message}`;
            }
        },
        
        nextHole() {
            if (this.currentHole < 18) {
                this.currentHole++;
                this.statusMessage = `Hole ${this.currentHole}`;
            }
        },
        
        prevHole() {
            if (this.currentHole > 1) {
                this.currentHole--;
                this.statusMessage = `Hole ${this.currentHole}`;
            }
        },
        
        async init() {
            this.statusMessage = "Loading players...";
            
            // Load players from Firebase (simplified - use actual game data)
            // For demo, load from sessionStorage or API
            const storedGame = sessionStorage.getItem("currentGame");
            if (storedGame) {
                const gameData = JSON.parse(storedGame);
                this.players = gameData.players.map((p, idx) => ({ ...p, idx }));
                this.statusMessage = `Ready - Hole 1`;
            } else {
                // Demo players
                this.players = [
                    { name: "Ang C H", label: "ACH", handicap: 1, team: "A", flight: 1, idx: 0 },
                    { name: "Kenneth Foo", label: "KF", handicap: 3, team: "A", flight: 1, idx: 1 },
                    { name: "Jeff Goh", label: "JG", handicap: 0, team: "B", flight: 1, idx: 2 },
                    { name: "Ong C B", label: "OCB", handicap: 1, team: "B", flight: 1, idx: 3 },
                ];
                this.statusMessage = "Demo mode - Click Save to mark hole as played";
            }
            
            this.savedHoles = { 1: [], 2: [] };
            this.savedScores = {};
        }
    };
}
</script>

<!-- Instructions -->
<div style="text-align: center; font-size: 0.7rem; color: #555; margin-top: 20px;">
    Click + / - to change score • Click Save to record the hole • After save, score turns green
</div>

</body>
</html>
