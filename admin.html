<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - SICC Ryder Cup</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/index-hidden.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000000; 
            font-family: system-ui, -apple-system, 'SF Pro Text', sans-serif; 
            color: #ffffff; 
            padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) 20px env(safe-area-inset-left, 20px);
        }
        .container { max-width: 500px; margin: 0 auto; }
        
        .version-tag { 
            position: fixed; 
            top: max(8px, env(safe-area-inset-top, 8px)); 
            right: max(8px, env(safe-area-inset-right, 8px)); 
            font-size: 0.65rem; 
            color: #4caf50; 
            background: rgba(0,0,0,0.6); 
            padding: 2px 10px; 
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.8;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top, 8px));
            left: max(8px, env(safe-area-inset-left, 8px));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .header { text-align: center; margin-bottom: 20px; margin-top: 12px; }
        .title { font-size: 1.4rem; font-weight: 700; color: #4caf50; }
        .version { font-size: 0.6rem; color: #666; margin-top: 2px; }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .admin-btn {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .admin-btn:active { transform: scale(0.98); background: #1a1a1a; }
        .admin-btn .label { 
            font-size: 0.95rem; 
            font-weight: 600; 
            color: #4caf50; 
            display: block;
        }
        .admin-btn .desc { 
            font-size: 0.65rem; 
            color: #666; 
            display: block;
            margin-top: 1px;
        }
        
        /* Zoom toggle - compact switch style */
        .zoom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 16px;
            width: 100%;
        }
        .zoom-row .label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ccc;
        }
        .zoom-row .toggle-track {
            width: 50px;
            height: 28px;
            background: #2a2a2a;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease;
            flex-shrink: 0;
        }
        .zoom-row .toggle-track.on {
            background: #1a3a1a;
            border: 1px solid #4caf50;
        }
        .zoom-row .toggle-track.off {
            background: #2a2a2a;
            border: 1px solid #555;
        }
        .zoom-row .toggle-thumb {
            width: 22px;
            height: 22px;
            background: #888;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }
        .zoom-row .toggle-track.on .toggle-thumb {
            left: 24px;
            background: #4caf50;
        }
        .zoom-row .toggle-track.off .toggle-thumb {
            left: 2px;
            background: #888;
        }
        .zoom-row .status-text {
            font-size: 0.6rem;
            color: #666;
            margin-left: 8px;
            min-width: 30px;
        }
        .zoom-row .status-text.on { color: #4caf50; }
        .zoom-row .status-text.off { color: #888; }
        
        .back-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
        }
        .back-btn:active { transform: scale(0.98); background: #2a2a2a; }
        .back-btn .label { 
            font-size: 0.85rem; 
            font-weight: 500; 
            color: #888; 
        }
        
        .footer { text-align: center; margin-top: 20px; font-size: 0.5rem; color: #333; }
        .loading { text-align: center; padding: 40px; color: #888; }
        
        .divider {
            border: none;
            border-top: 1px solid #2a2a2a;
            margin: 4px 0;
        }
    </style>

<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v1.14</div>

<script>
// FILE: admin.html - VERSION 1.14

var VERSION = "1.14";
var CACHE_KEY = "admin_version_v114";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[ADMIN] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

var db = firebase.firestore();
var firestoreReady = true;
var deviceSession = null;

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function goToSetupGame() {
    SessionManager.addNavigationHistory("setup-game.html", "click_setup_new_game");
    SessionManager.updateSession({
        returnDestination: "admin.html"
    });
    window.location.href = "setup-game.html";
}

function goToManageGames() {
    SessionManager.addNavigationHistory("manage-games.html", "click_manage_games");
    SessionManager.updateSession({
        returnDestination: "admin.html"
    });
    window.location.href = "manage-games.html";
}

function goToCourses() {
    SessionManager.addNavigationHistory("courses.html", "click_course_management");
    SessionManager.updateSession({
        returnDestination: "admin.html"
    });
    window.location.href = "courses.html";
}

function goToPlayerManagement() {
    SessionManager.addNavigationHistory("player-management.html", "click_player_management");
    SessionManager.updateSession({
        returnDestination: "admin.html"
    });
    window.location.href = "player-management.html";
}

function goBackToMenu() {
    window.location.href = "index.html";
}

function toggleZoom() {
    if (typeof AppSettings === 'undefined') {
        Modal.alert("Settings module not loaded. Please refresh.");
        return;
    }
    var current = AppSettings.getZoomEnabled();
    AppSettings.setZoomEnabled(!current);
    render();
}

function render() {
    var zoomEnabled = false;
    if (typeof AppSettings !== 'undefined') {
        zoomEnabled = AppSettings.getZoomEnabled();
    }
    var statusText = zoomEnabled ? 'ON' : 'OFF';
    var toggleClass = zoomEnabled ? 'on' : 'off';
    var statusClass = zoomEnabled ? 'on' : 'off';
    
    var html = `
        <div class="header">
            <div class="title">⚙️ GAME SETTINGS</div>
            <div class="version">Administration</div>
        </div>
        
        <div class="menu">
            <div class="admin-btn" onclick="goToSetupGame()">
                <span class="label">Set Up New Game</span>
                <span class="desc">Schedule a new match</span>
            </div>
            
            <div class="admin-btn" onclick="goToManageGames()">
                <span class="label">Manage Scheduled Games</span>
                <span class="desc">Edit or delete upcoming games</span>
            </div>
            
            <div class="admin-btn" onclick="goToCourses()">
                <span class="label">Course Management</span>
                <span class="desc">Add or edit courses</span>
            </div>
            
            <div class="admin-btn" onclick="goToPlayerManagement()">
                <span class="label">Player Management</span>
                <span class="desc">Add, edit, or remove players</span>
            </div>
            
            <hr class="divider">
            
            <div class="zoom-row">
                <span class="label">🔍 Pinch Zoom</span>
                <div style="display:flex; align-items:center; gap:6px;">
                    <span class="status-text ${statusClass}">${statusText}</span>
                    <div class="toggle-track ${toggleClass}" onclick="toggleZoom()">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="back-btn" onclick="goBackToMenu()">
            <span class="label">← Back to Main Menu</span>
        </div>
        
        <div class="footer">SICC Ryder Cup</div>
    `;
    
    document.getElementById("app").innerHTML = html;
}

window.duplicateMasterRecord = function() {
    if (!db) {
        Modal.alert("Firebase not ready. Please refresh and try again.");
        return;
    }
    
    var newId;
    var masterRef = db.collection("scheduledGames").doc("MASTER_RECORD");
    
    masterRef.get().then(function(doc) {
        if (!doc.exists) {
            Modal.alert("❌ MASTER_RECORD not found in Firestore.\n\nPlease ensure the Master Record has been created.");
            return;
        }
        
        var original = doc.data();
        var today = new Date();
        var year = today.getFullYear();
        var month = String(today.getMonth() + 1).padStart(2, '0');
        var day = String(today.getDate()).padStart(2, '0');
        var dateStr = year + '-' + month + '-' + day;
        
        newId = generateGameId();
        
        var duplicate = JSON.parse(JSON.stringify(original));
        duplicate.date = dateStr;
        duplicate.gameStarted = true;
        duplicate.locks = { f1: null, f2: null };
        duplicate.signatures = {};
        duplicate.submitted = {};
        
        delete duplicate.id;
        delete duplicate.createdAt;
        delete duplicate.updatedAt;
        
        duplicate.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        duplicate.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        
        return db.collection("scheduledGames").doc(newId).set(duplicate);
    }).then(function() {
        console.log("✅ Game created with today's date. ID:", newId);
        Modal.alert("✅ Game created from MASTER_RECORD!\n\nGame ID: " + newId + "\n\nRefresh the page and click GAME DAY.");
        setTimeout(function() {
            window.location.reload();
        }, 1000);
    }).catch(function(err) {
        console.error("Error creating duplicate:", err);
        Modal.alert("❌ Error creating game: " + err.message);
    });
};

function generateGameId() {
    var now = new Date();
    var yy = String(now.getFullYear()).slice(-2);
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(now.getDate()).padStart(2, '0');
    var yymmdd = yy + mm + dd;
    var hh = String(now.getHours()).padStart(2, '0');
    var min = String(now.getMinutes()).padStart(2, '0');
    var hhmm = hh + min;
    var random = String(Math.floor(Math.random() * 100)).padStart(2, '0');
    return 'GM_' + yymmdd + '_' + hhmm + '_' + random;
}

window.goToPlayerManagement = goToPlayerManagement;
window.goToSetupGame = goToSetupGame;
window.goToManageGames = goToManageGames;
window.goToCourses = goToCourses;
window.goBackToMenu = goBackToMenu;
window.toggleZoom = toggleZoom;
window.generateGameId = generateGameId;

SessionManager.initSession("admin.html", "admin.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    displayDeviceId();
    render();
    
    if (typeof initHiddenAdmin === 'function') {
        initHiddenAdmin();
    }
});
</script>
</body>
</html>
