<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alpine Scorecard - Working</title>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui, sans-serif; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .status-bar {
            background: #1a3a1a;
            padding: 8px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            font-size: 0.75rem;
            text-align: center;
        }
        
        .player-card {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .player-name {
            font-size: 1rem;
            font-weight: 600;
        }
        .player-handicap {
            background: #1a3a1a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        .score-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .score-btn {
            background: #1a3a1a;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }
        .score-btn:active { transform: scale(0.95); }
        .score-value {
            font-size: 1.3rem;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }
        
        .scorecard-wrapper {
            overflow-x: auto;
            margin: 20px 0;
        }
        .scorecard-table {
            width: 100%;
            min-width: 800px;
            font-size: 0.7rem;
            border-collapse: collapse;
        }
        .scorecard-table th, .scorecard-table td {
            padding: 6px 3px;
            text-align: center;
            border: 1px solid #222;
        }
        .scorecard-table th {
            color: #4caf50;
            background: #111;
        }
        .score-green {
            color: #4caf50;
            font-weight: 600;
        }
        .score-invisible {
            color: #000;
        }
        .green-line td {
            border-bottom: 2px solid #4caf50;
            padding: 0;
            height: 2px;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border: none;
        }
        .btn-save { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-next { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-back { background: #1a1a1a; color: #ccc; border: 1px solid #333; }
        
        .hole-indicator {
            text-align: center;
            margin: 16px 0;
            font-size: 1.2rem;
        }
        .hole-badge {
            background: #1a3a1a;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid #4caf50;
        }
        
        .debug {
            font-size: 0.6rem;
            color: #555;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" x-data="scorecardApp()" x-init="init()">
    <!-- Status -->
    <div class="status-bar" x-text="statusMessage"></div>
    
    <!-- Current Hole -->
    <div class="hole-indicator">
        <span class="hole-badge">HOLE <span x-text="currentHole"></span> — PAR <span x-text="currentPar"></span>  SI <span x-text="currentSi"></span></span>
    </div>
    
    <!-- Player Cards (Flight 1 only for demo) -->
    <template x-for="player in flight1Players">
        <div class="player-card">
            <div class="player-header">
                <div>
                    <span class="player-name" x-text="player.name"></span>
                    <span class="player-handicap" x-text="player.label + ' ' + player.handicap"></span>
                </div>
                <div class="score-control">
                    <button class="score-btn" @click="changeScore(player, -1)">-</button>
                    <span class="score-value" x-text="getCurrentScore(player)"></span>
                    <button class="score-btn" @click="changeScore(player, 1)">+</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Scorecard -->
    <div class="scorecard-wrapper">
        <table class="scorecard-table">
            <thead>
                <tr>
                    <th>Hole</th>
                    <template x-for="h in 18">
                        <th x-text="getDisplayHoleNumber(h-1)"></th>
                    </template>
                    <th>Tot</th>
                </tr>
            </thead>
            <tbody>
                <!-- Par row -->
                <tr>
                    <td style="font-weight:700;">Par</td>
                    <template x-for="h in 18">
                        <td x-text="coursePar[getDisplayHoleNumber(h-1)-1]"></tr>
                    </template>
                    <td x-text="totalPar"></td>
                </tr>
                <!-- SI row -->
                <tr>
                    <td style="font-weight:700;">SI</td>
                    <template x-for="h in 18">
                        <td x-text="courseSi[getDisplayHoleNumber(h-1)-1]"></td>
                    </template>
                    <td>-</td>
                </tr>
                <!-- Flight 1 Players -->
                <template x-for="player in flight1Players">
                    <tr>
                        <td style="font-weight:600;" x-text="player.label"></td>
                        <template x-for="h in 18">
                            <td :class="isHoleSaved(player.flight, getDisplayHoleNumber(h-1)) ? 'score-green' : 'score-invisible'"
                                x-text="getStoredScore(player, getDisplayHoleNumber(h-1))"></td>
                        </template>
                        <td x-text="getPlayerTotal(player)" :class="getPlayerTotal(player) > 0 ? 'score-green' : 'score-invisible'"></td>
                    </tr>
                </template>
                <!-- Green line -->
                <tr class="green-line"><td colspan="20"><\/tr>
                <!-- Flight 2 Players -->
                <template x-for="player in flight2Players">
                    <tr>
                        <td style="font-weight:600;" x-text="player.label"></td>
                        <template x-for="h in 18">
                            <td :class="isHoleSaved(player.flight, getDisplayHoleNumber(h-1)) ? 'score-green' : 'score-invisible'"
                                x-text="getStoredScore(player, getDisplayHoleNumber(h-1))"></td>
                        </template>
                        <td x-text="getPlayerTotal(player)" :class="getPlayerTotal(player) > 0 ? 'score-green' : 'score-invisible'"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn btn-back" @click="prevHole">← Back</button>
        <button class="btn btn-save" @click="saveHole">💾 Save</button>
        <button class="btn btn-next" @click="nextHole">Next →</button>
    </div>
    
    <div class="debug">
        Flight 1 updater • Auto-refresh every 5s • Scores save to f1.d
    </div>
</div>

<script>
// Firebase Config
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

// Your Game ID
const GAME_ID = "m0KWjGuLJ5guZ3FWjnh8";

// Initialize Firebase
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// Course Data (from your document)
const COURSE_PAR = [4, 3, 4, 5, 3, 4, 4, 4, 4, 4, 4, 3, 5, 3, 5, 4, 3, 5];
const COURSE_SI = [13, 15, 7, 3, 17, 1, 5, 11, 9, 14, 2, 8, 6, 16, 10, 4, 18, 12];

// Players from your document
const ALL_PLAYERS = [
    { name: "Ang C H", label: "ACH", handicap: 1, team: "A", flight: 1 },
    { name: "Kenneth Foo", label: "KF", handicap: 3, team: "A", flight: 1 },
    { name: "C K", label: "CK", handicap: 8, team: "A", flight: 2 },
    { name: "Yip H M", label: "YHM", handicap: 12, team: "A", flight: 2 },
    { name: "Jeff Goh", label: "JG", handicap: 0, team: "B", flight: 1 },
    { name: "Ong C B", label: "OCB", handicap: 1, team: "B", flight: 1 },
    { name: "Piti", label: "P", handicap: 8, team: "B", flight: 2 },
    { name: "James Ong", label: "JO", handicap: 11, team: "B", flight: 2 }
];

// Player positions within flight (fixed order by handicap)
function getPlayerPositionInFlight(flight, team, players) {
    const flightPlayers = players.filter(p => p.flight === flight);
    const teamAPlayers = flightPlayers.filter(p => p.team === "A").sort((a,b) => a.handicap - b.handicap);
    const teamBPlayers = flightPlayers.filter(p => p.team === "B").sort((a,b) => a.handicap - b.handicap);
    
    if (team === "A") {
        if (teamAPlayers[0]?.name === players[0]?.name) return "a1";
        if (teamAPlayers[1]?.name === players[0]?.name) return "a2";
    } else {
        if (teamBPlayers[0]?.name === players[0]?.name) return "b1";
        if (teamBPlayers[1]?.name === players[0]?.name) return "b2";
    }
    return "a1";
}

// Parse f1.d string into object: { holeNumber: { a1, a2, b1, b2, saved } }
function parseFlightData(dataString, startingHole) {
    const result = {};
    for (let pos = 0; pos < 18; pos++) {
        // Convert storage position to actual hole number based on startingHole
        let actualHole;
        if (startingHole === 1) {
            actualHole = pos + 1;
        } else {
            const playOrder = [];
            for (let i = startingHole; i <= 18; i++) playOrder.push(i);
            for (let i = 1; i < startingHole; i++) playOrder.push(i);
            actualHole = playOrder[pos];
        }
        
        const startIdx = pos * 9;
        const segment = dataString.substr(startIdx, 9);
        if (segment.length === 9) {
            result[actualHole] = {
                saved: segment.charAt(0) === 'T',
                a1: parseInt(segment.substr(1, 2), 10),
                a2: parseInt(segment.substr(3, 2), 10),
                b1: parseInt(segment.substr(5, 2), 10),
                b2: parseInt(segment.substr(7, 2), 10)
            };
        }
    }
    return result;
}

// Update f1.d string with new scores
function updateFlightData(oldDataString, holeNumber, scores, startingHole) {
    // Find storage position for this hole
    let storagePos;
    if (startingHole === 1) {
        storagePos = holeNumber - 1;
    } else {
        const playOrder = [];
        for (let i = startingHole; i <= 18; i++) playOrder.push(i);
        for (let i = 1; i < startingHole; i++) playOrder.push(i);
        storagePos = playOrder.indexOf(holeNumber);
    }
    
    const a1Str = scores.a1.toString().padStart(2, '0');
    const a2Str = scores.a2.toString().padStart(2, '0');
    const b1Str = scores.b1.toString().padStart(2, '0');
    const b2Str = scores.b2.toString().padStart(2, '0');
    const newSegment = "T" + a1Str + a2Str + b1Str + b2Str;
    
    const startIdx = storagePos * 9;
    return oldDataString.substr(0, startIdx) + newSegment + oldDataString.substr(startIdx + 9);
}

function scorecardApp() {
    return {
        // State
        players: ALL_PLAYERS,
        flight1Players: [],
        flight2Players: [],
        currentHole: 1,
        startingHole: 10,
        localScores: {},  // { flight_hole_playerName: score }
        storedScores: {},  // Parsed from f1.d
        savedHoles: { 1: [], 2: [] },
        statusMessage: "Loading...",
        refreshInterval: null,
        f1DataString: "",
        f2DataString: "",
        
        // Computed
        get coursePar() { return COURSE_PAR; },
        get courseSi() { return COURSE_SI; },
        get totalPar() { return COURSE_PAR.reduce((a,b) => a + b, 0); },
        get currentPar() { return COURSE_PAR[this.currentHole - 1]; },
        get currentSi() { return COURSE_SI[this.currentHole - 1]; },
        
        // Convert storage position to actual hole number (shotgun start)
        getDisplayHoleNumber(storagePos) {
            if (this.startingHole === 1) return storagePos + 1;
            const playOrder = [];
            for (let i = this.startingHole; i <= 18; i++) playOrder.push(i);
            for (let i = 1; i < this.startingHole; i++) playOrder.push(i);
            return playOrder[storagePos];
        },
        
        // Get stored score for a player on a specific hole
        getStoredScore(player, hole) {
            const holeData = this.storedScores[player.flight]?.[hole];
            if (!holeData || !holeData.saved) return COURSE_PAR[hole - 1];
            
            // Find which position this player is in the flight
            const flightPlayers = this.players.filter(p => p.flight === player.flight);
            const teamAPlayers = flightPlayers.filter(p => p.team === "A").sort((a,b) => a.handicap - b.handicap);
            const teamBPlayers = flightPlayers.filter(p => p.team === "B").sort((a,b) => a.handicap - b.handicap);
            
            if (player.team === "A") {
                if (teamAPlayers[0]?.name === player.name) return holeData.a1;
                if (teamAPlayers[1]?.name === player.name) return holeData.a2;
            } else {
                if (teamBPlayers[0]?.name === player.name) return holeData.b1;
                if (teamBPlayers[1]?.name === player.name) return holeData.b2;
            }
            return COURSE_PAR[hole - 1];
        },
        
        // Get current score (editing) for player on current hole
        getCurrentScore(player) {
            const key = `${player.flight}_${this.currentHole}_${player.name}`;
            if (this.localScores[key] !== undefined) {
                return this.localScores[key];
            }
            return this.getStoredScore(player, this.currentHole);
        },
        
        // Check if a hole is saved for a flight
        isHoleSaved(flight, hole) {
            return this.storedScores[flight]?.[hole]?.saved === true;
        },
        
        // Get total score for a player across all holes
        getPlayerTotal(player) {
            let total = 0;
            for (let h = 1; h <= 18; h++) {
                total += this.getStoredScore(player, h);
            }
            return total;
        },
        
        // Change score (+/-)
        changeScore(player, delta) {
            const current = this.getCurrentScore(player);
            let newScore = current + delta;
            if (newScore < 1) newScore = 1;
            if (newScore > 99) newScore = 99;
            
            const key = `${player.flight}_${this.currentHole}_${player.name}`;
            this.localScores[key] = newScore;
            this.statusMessage = `Unsaved changes for hole ${this.currentHole}`;
        },
        
        // Save current hole to Firebase
        async saveHole() {
            // Get all players in Flight 1 (updater)
            const flight = 1;
            const flightPlayers = this.players.filter(p => p.flight === flight);
            const teamAPlayers = flightPlayers.filter(p => p.team === "A").sort((a,b) => a.handicap - b.handicap);
            const teamBPlayers = flightPlayers.filter(p => p.team === "B").sort((a,b) => a.handicap - b.handicap);
            
            // Get scores from localSaves or stored
            let a1Score = this.getStoredScore(teamAPlayers[0], this.currentHole);
            let a2Score = this.getStoredScore(teamAPlayers[1], this.currentHole);
            let b1Score = this.getStoredScore(teamBPlayers[0], this.currentHole);
            let b2Score = this.getStoredScore(teamBPlayers[1], this.currentHole);
            
            // Override with local changes
            const keys = Object.keys(this.localScores);
            for (const key of keys) {
                if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                    const playerName = key.split('_')[2];
                    const player = this.players.find(p => p.name === playerName);
                    if (player) {
                        if (player.team === "A") {
                            if (teamAPlayers[0]?.name === playerName) a1Score = this.localScores[key];
                            if (teamAPlayers[1]?.name === playerName) a2Score = this.localScores[key];
                        } else {
                            if (teamBPlayers[0]?.name === playerName) b1Score = this.localScores[key];
                            if (teamBPlayers[1]?.name === playerName) b2Score = this.localScores[key];
                        }
                    }
                }
            }
            
            const scoresToSave = { a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score };
            
            // Update the data string
            const newDataString = updateFlightData(this.f1DataString, this.currentHole, scoresToSave, this.startingHole);
            
            this.statusMessage = "Saving...";
            
            try {
                await db.collection("scheduledGames").doc(GAME_ID).update({
                    "f1.d": newDataString,
                    "f1.se": true,
                    "f2.x": true,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Clear local scores for this hole
                for (const key of keys) {
                    if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                        delete this.localScores[key];
                    }
                }
                
                this.statusMessage = `Hole ${this.currentHole} saved!`;
                await this.refreshData();
            } catch (error) {
                this.statusMessage = `Save failed: ${error.message}`;
            }
        },
        
        // Refresh data from Firebase
        async refreshData() {
            try {
                const doc = await db.collection("scheduledGames").doc(GAME_ID).get();
                if (doc.exists) {
                    const data = doc.data();
                    this.f1DataString = data.f1?.d || "";
                    this.f2DataString = data.f2?.d || "";
                    this.startingHole = data.startingHole || 1;
                    
                    // Parse f1.d
                    const parsedF1 = parseFlightData(this.f1DataString, this.startingHole);
                    this.storedScores = { 1: parsedF1, 2: {} };
                    
                    // Update saved holes list
                    this.savedHoles = { 1: [], 2: [] };
                    for (let h = 1; h <= 18; h++) {
                        if (parsedF1[h]?.saved) this.savedHoles[1].push(h);
                    }
                }
                this.statusMessage = `Hole ${this.currentHole} • Ready`;
            } catch (error) {
                this.statusMessage = `Refresh error: ${error.message}`;
            }
        },
        
        nextHole() {
            if (this.currentHole < 18) {
                this.currentHole++;
                this.statusMessage = `Hole ${this.currentHole}`;
            }
        },
        
        prevHole() {
            if (this.currentHole > 1) {
                this.currentHole--;
                this.statusMessage = `Hole ${this.currentHole}`;
            }
        },
        
        async init() {
            // Split players by flight
            this.flight1Players = this.players.filter(p => p.flight === 1);
            this.flight2Players = this.players.filter(p => p.flight === 2);
            
            this.statusMessage = "Loading game data...";
            await this.refreshData();
            
            // Auto-refresh every 5 seconds
            this.refreshInterval = setInterval(() => {
                this.refreshData();
            }, 5000);
        },
        
        // Cleanup
        destroy() {
            if (this.refreshInterval) clearInterval(this.refreshInterval);
        }
    };
}
</script>

</body>
</html>
