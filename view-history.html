<script>

};

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var currentGameData = null;
var allPlayers = [];
var coursePar = [], courseSi = [];
var f1DataString = "", f2DataString = "", resultsCache = null;
var startingHole = 1, teamGameFormat = "tournament";

// Viewer state
var currentDisplayMode = "play";
var currentFlight = 1;
var currentHole = 1;

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getDisplayHoles() {
    if (currentDisplayMode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    }
    return getPlayOrder();
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIntra = (a.flight === player.flight);
        var bIntra = (b.flight === player.flight);
        if (aIntra && !bIntra) return -1;
        if (!aIntra && bIntra) return 1;
        if (aIntra && bIntra) return a.handicap - b.handicap;
        return a.flight - b.flight;
    });
    return opponents;
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1] || 4;
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1] || 4;
}

function isHoleSaved(flight, hole) {
    var flightDataStr = flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    return holeData && holeData.saved;
}

// ============================================================
// CLINCH BUBBLE FUNCTIONS - Using GameUI (v5.00)
// ============================================================

function getMatchValueFromResults(player, opponent, holeNumber) {
    if (!resultsCache || !resultsCache.matchResults) return 0;
    var position = getHolePosition(holeNumber);
    var matchArray = resultsCache.matchResults[position];
    if (!matchArray) return 0;
    
    var teamAPlayers = allPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamBPlayers = allPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var aIdx = -1, bIdx = -1;
    if (player.team === 'A') {
        for (var i = 0; i < teamAPlayers.length; i++) {
            if (teamAPlayers[i].name === player.name) aIdx = i;
        }
        for (var i = 0; i < teamBPlayers.length; i++) {
            if (teamBPlayers[i].name === opponent.name) bIdx = i;
        }
    } else {
        for (var i = 0; i < teamAPlayers.length; i++) {
            if (teamAPlayers[i].name === opponent.name) aIdx = i;
        }
        for (var i = 0; i < teamBPlayers.length; i++) {
            if (teamBPlayers[i].name === player.name) bIdx = i;
        }
    }
    if (aIdx === -1 || bIdx === -1) return 0;
    var matchIndex = aIdx * teamBPlayers.length + bIdx;
    var value = matchArray[matchIndex] || 0;
    return (player.team === 'B') ? -value : value;
}

function getBubbleValue(player, opponent) {
    return GameUI.getBubbleValueShared(player, opponent, currentHole, resultsCache, allPlayers, getHolePosition);
}

function getBubbleClassWithClinch(player, opponent) {
    var clinchedAt = resultsCache ? (resultsCache.clinchedAt || {}) : {};
    return GameUI.getBubbleClassShared(
        player, opponent, currentHole, resultsCache, allPlayers,
        isHoleSaved, getHolePosition, clinchedAt
    );
}

function getTRForHole(holeNumber) {
    if (!resultsCache || !resultsCache.tr) {
        return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    }
    var position = getHolePosition(holeNumber);
    return {
        teamA: resultsCache.tr.teamA[position] !== undefined ? resultsCache.tr.teamA[position] : 9.5,
        teamB: resultsCache.tr.teamB[position] !== undefined ? resultsCache.tr.teamB[position] : 9.5,
        teamAGreen: resultsCache.tr.teamAGreen[position] !== undefined ? resultsCache.tr.teamAGreen[position] : true,
        teamBGreen: resultsCache.tr.teamBGreen[position] !== undefined ? resultsCache.tr.teamBGreen[position] : true
    };
}

function getFirstUnsavedHole(flight) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        if (!isHoleSaved(flight, hole)) return hole;
    }
    return 18;
}

// ============================================================
// Ticker
// ============================================================

function calculatePlayerScoreRelativeToPar(player) {
    var totalGross = 0, totalPar = 0;
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1];
        totalPar += par;
        var score = getStoredScore(player, h);
        totalGross += score;
    }
    return totalGross - totalPar;
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', calculatePlayerScoreRelativeToPar);
        if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
    }
}

// ============================================================
// Render Functions
// ============================================================

function renderHoleHeader() {
    var header = document.getElementById('holeHeader');
    if (header) {
        header.innerHTML = `<div style="display:inline-block; background:#111; padding:4px 20px; border-radius:40px; font-size:1.5rem; font-weight:800;">HOLE ${currentHole}</div>`;
    }
}

function renderTR() {
    var tr = getTRForHole(currentHole);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
}

function renderPlayerCards() {
    var players = getFlightOrderedPlayers(currentFlight);
    
    GameUI.renderPlayerCards(
        "playerCards",
        players,
        getAllOpponents,
        getBubbleClassWithClinch,
        getBubbleValue,
        function(player) { return getStoredScore(player, currentHole); },
        false,
        null
    );
    
    setTimeout(function() {
        var firstCard = document.querySelector('.player-card');
        var existingBadge = document.querySelector('.flight-badge');
        if (firstCard && !existingBadge) {
            var badge = document.createElement('div');
            badge.className = 'flight-badge';
            badge.innerText = 'FLIGHT ' + currentFlight;
            badge.style.cssText = 'position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#1a3a1a; border:2px solid #4caf50; color:#4caf50; font-size:0.8rem; font-weight:700; padding:4px 16px; border-radius:30px; z-index:100; white-space:nowrap;';
            firstCard.style.position = 'relative';
            firstCard.appendChild(badge);
        }
    }, 50);
}

function renderScorecard() {
    var holes = getDisplayHoles();
    window.savedHoles = { 1: [], 2: [] };
    for (var h = 1; h <= 18; h++) {
        if (isHoleSaved(1, h)) window.savedHoles[1].push(h);
        if (isHoleSaved(2, h)) window.savedHoles[2].push(h);
    }
    
    var t1Row = resultsCache ? (resultsCache.game2?.flight1?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var t2Row = resultsCache ? (resultsCache.game2?.flight2?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var strkRow = resultsCache ? (resultsCache.game3?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    
    GameUI.renderScorecard('scorecardWrapper', holes, allPlayers, getStoredScore, isHoleSaved, t1Row, t2Row, strkRow, coursePar, courseSi);
}

function renderAll() {
    if (!f1DataString || !f2DataString) return;
    renderHoleHeader();
    renderTR();
    renderPlayerCards();
    renderScorecard();
    updateNavButtons();
    if (typeof Ticker !== 'undefined') Ticker.refresh();
}

// ============================================================
// Navigation
// ============================================================

function updateNavButtons() {
    var playOrder = getPlayOrder();
    var isCurrentSaved = isHoleSaved(currentFlight, currentHole);
    var gameComplete = true; // History games are complete
    
    GameUI.updateNavigationButtons(
        currentHole,
        playOrder,
        isCurrentSaved,
        false,
        false,
        null
    );
}

function goToPrevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        var holeDisplay = document.querySelector('.compact-hole-display');
        if (holeDisplay) holeDisplay.innerText = currentHole;
        renderAll();
    }
}

function goToNextHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        var holeDisplay = document.querySelector('.compact-hole-display');
        if (holeDisplay) holeDisplay.innerText = currentHole;
        renderAll();
    }
}

function toggleDisplayMode() {
    currentDisplayMode = currentDisplayMode === 'play' ? 'natural' : 'play';
    GameUI.updateCompactPnButton();
    renderAll();
}

function toggleFlight() {
    currentFlight = currentFlight === 1 ? 2 : 1;
    var flightBtn = document.getElementById('compactFlightBtn');
    if (flightBtn) flightBtn.innerText = 'FLIGHT ' + currentFlight;
    renderAll();
}

// ============================================================
// Control Bar
// ============================================================

function buildCompactHeader() {
    var container = document.getElementById('compactHeaderContainer');
    if (!container) return;
    
    GameUI.renderCompactHeader(
        "compactHeaderContainer",
        currentFlight,
        currentHole,
        null,
        goToPrevHole,
        goToNextHole,
        toggleFlight,
        toggleDisplayMode
    );
    
    var saveBtn = document.getElementById('compactSaveBtn');
    if (saveBtn && saveBtn.parentNode) {
        var flightBtn = document.createElement('button');
        flightBtn.id = 'compactFlightBtn';
        flightBtn.className = 'compact-flight-btn';
        flightBtn.innerText = 'FLIGHT ' + currentFlight;
        flightBtn.onclick = toggleFlight;
        saveBtn.parentNode.replaceChild(flightBtn, saveBtn);
    }
    
    GameUI.updateCompactPnButton();
}

// ============================================================
// Game List
// ============================================================

async function loadGameList() {
    var container = document.getElementById('gameListContainer');
    container.innerHTML = '<div class="loading">Loading games...</div>';
    
    try {
        // Load from history-records subcollection
        var historySnapshot = await db.collection('history-records').orderBy('date', 'desc').get();
        var games = [];
        historySnapshot.forEach(function(doc) {
            var data = doc.data();
            games.push({
                id: doc.id,
                date: data.date,
                course: data.course?.name || 'Unknown Course',
                rawData: data
            });
        });
        
        if (games.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No completed games found.</div>';
            return;
        }
        
        var html = '';
        for (var i = 0; i < games.length; i++) {
            var game = games[i];
            var displayDate = game.date;
            if (displayDate) {
                var parts = displayDate.split('-');
                if (parts.length === 3) {
                    var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    displayDate = parts[2] + ' ' + monthNames[parseInt(parts[1]) - 1] + ' ' + parts[0];
                }
            }
            html += `
                <div class="game-item" data-game-id="${game.id}">
                    <div class="game-date">${displayDate}</div>
                    <div class="game-course">${escapeHtml(game.course)}</div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.game-item').forEach(function(el) {
            el.addEventListener('click', function() {
                var gameId = this.getAttribute('data-game-id');
                var game = games.find(function(g) { return g.id === gameId; });
                if (game) loadGameDetail(game);
            });
        });
        
    } catch (e) {
        console.error('Error loading history:', e);
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#ff6b6b;">Error loading games. Please refresh.</div>';
    }
}

function loadGameDetail(game) {
    var data = game.rawData;
    
    // Extract data from history record
    coursePar = data.course?.par || [];
    courseSi = data.course?.si || [];
    allPlayers = data.players || [];
    startingHole = data.startingHole || 1;
    teamGameFormat = data.teamGameFormat || 'tournament';
    f1DataString = data.f1DataString || "";
    f2DataString = data.f2DataString || "";
    resultsCache = data.results || null;
    
    document.getElementById("courseName").innerHTML = data.course?.name || "Unknown Course";
    
    // Find first hole to display
    var playOrder = getPlayOrder();
    currentHole = playOrder[0];
    currentFlight = 1;
    
    // Build UI
    buildCompactHeader();
    initTicker();
    renderAll();
    
    // Show detail view, hide list view
    document.getElementById('gameListView').style.display = 'none';
    document.getElementById('gameDetailView').style.display = 'block';
    
    // Make status bubble clickable to refresh
    var bubble = document.getElementById('statusBubble');
    if (bubble) bubble.onclick = function() { location.reload(); };
}

// ============================================================
// Navigation between views
// ============================================================

function backToGamesList() {
    document.getElementById('gameDetailView').style.display = 'none';
    document.getElementById('gameListView').style.display = 'block';
    loadGameList();
}

function exitToMainMenu() {
    window.location.href = "index.html";
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var shortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "📋 " + shortName;
    
    GameUI.applyTightLayout();
    
    document.getElementById('backToListBtn').onclick = exitToMainMenu;
    document.getElementById('backToGamesBtn').onclick = backToGamesList;
    
    loadGameList();
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

init();
</script>
