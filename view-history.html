<script>
// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.VIEW_HISTORY_VERSION = "7.02";

// ============================================================
// Firebase already initialized in firebase-config.js
// ============================================================
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var currentGameData = null;
var currentFlight = 1;
var currentHole = 1;
var startingHole = 1;
var teamGameFormat = "tournament";

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var f1DataString = "";
var f2DataString = "";
var resultsCache = null;

// ============================================================
// Helper Functions (same as view-game.html)
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    var mode = GameUI.getDisplayMode();
    if (mode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var flightDataStr = flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    return holeData && holeData.saved;
}

function isCurrentHoleSavedByAnyFlight() {
    return isHoleSaved(1, currentHole) || isHoleSaved(2, currentHole);
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

// ============================================================
// Match Value Read - Direct from stored results (same as view-game)
// ============================================================

function getMatchValueFromStoredResults(player, opponent, holeNumber) {
    if (!resultsCache) return 0;
    
    var position = getHolePosition(holeNumber);
    
    // SAME FLIGHT - read directly from intra-flight results
    if (player.flight === opponent.flight) {
        var intraMatches = (player.flight === 1) ? resultsCache.f1IntraMatches : resultsCache.f2IntraMatches;
        if (intraMatches && intraMatches[position]) {
            var matchKey = player.name + "_vs_" + opponent.name;
            var value = intraMatches[position][matchKey];
            return (value !== undefined) ? value : 0;
        }
        return 0;
    }
    
    // DIFFERENT FLIGHT - read directly from cross-flight results
    if (resultsCache.matchResults && resultsCache.matchResults[position]) {
        var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) {
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) {
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        
        var aIdx = -1;
        var bIdx = -1;
        
        if (player.team === "A") {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === player.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === opponent.name) bIdx = i;
            }
        } else {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === opponent.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === player.name) bIdx = i;
            }
        }
        
        if (aIdx !== -1 && bIdx !== -1) {
            var storedValue = resultsCache.matchResults[position][aIdx * teamBPlayers.length + bIdx] || 0;
            return (player.team === "B") ? -storedValue : storedValue;
        }
    }
    return 0;
}

// ============================================================
// BUBBLE FUNCTIONS - UPDATED v7.02: Uses GameMatch.getClinchHole()
// ============================================================

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getBubbleClassWithClinch(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var lastSyncedHole = resultsCache?.computedUpToHole || 0;
    var clinchedAt = resultsCache?.clinchedAt || {};
    
    // FIXED v7.02: Use GameMatch.getClinchHole() for smart list support
    var clinchHole = GameMatch.getClinchHole(clinchedAt, player.name, opponent.name);
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
    } else {
        var isSynced = (lastSyncedHole >= currentHole);
        if (!isSynced) return 'bubble-grey';
    }
    
    if (clinchHole && currentHole > clinchHole) return 'bubble-grey';
    if (clinchHole && currentHole === clinchHole) {
        if (matchValue > 0) return 'bubble-gold';
        if (matchValue < 0) return 'bubble-loss-clinch';
        return 'bubble-green';
    }
    
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function updateTRDisplay() {
    if (!resultsCache || !resultsCache.tr) {
        GameUI.updateTR("trDisplay", 9.5, 9.5, true, true);
        return;
    }
    var position = getHolePosition(currentHole);
    var teamA = resultsCache.tr.teamA[position] || 9.5;
    var teamB = resultsCache.tr.teamB[position] || 9.5;
    var teamAGreen = resultsCache.tr.teamAGreen[position] !== undefined ? resultsCache.tr.teamAGreen[position] : (teamA > teamB);
    var teamBGreen = resultsCache.tr.teamBGreen[position] !== undefined ? resultsCache.tr.teamBGreen[position] : (teamB > teamA);
    GameUI.updateTR("trDisplay", teamA, teamB, teamAGreen, teamBGreen);
}

// ============================================================
// Ticker Functions - READ playerTotals from stored results
// ============================================================

function getPlayerTotalScore(player) {
    if (!resultsCache || !resultsCache.playerTotals) {
        return 0;
    }
    
    var playerTotal = resultsCache.playerTotals[player.name];
    if (!playerTotal) return 0;
    
    return playerTotal.relativeToPar;
}

function getPlayerScoreForTicker(player) {
    return getPlayerTotalScore(player);
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Navigation Functions
// ============================================================

function nextHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (!isCurrentHoleSavedByAnyFlight()) {
        console.log("Cannot advance - hole " + currentHole + " has no saved data");
        return;
    }
    
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        updateHoleNumberDisplay();
        renderAll();
    }
}

function prevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        updateHoleNumberDisplay();
        renderAll();
    }
}

function updateHoleNumberDisplay() {
    GameUI.updateCompactHoleDisplay(currentHole);
    GameUI.updateHoleHeaderNumber(currentHole);
}

function onToggleFlight(flightNumber) {
    // flightNumber is the NEW flight to switch TO
    currentFlight = flightNumber;
    GameUI.updateFlightBadge(flightNumber);
    renderAll();
}

function onToggleDisplayMode(displayMode) {
    renderAll();
}

// ============================================================
// Control Bar - FIXED: Button shows OPPOSITE flight
// ============================================================

function renderCompactHeader() {
    var container = document.getElementById('compactHeaderContainer');
    if (!container) return;
    
    var displayMode = GameUI.getDisplayMode();
    var pnText = displayMode === 'play' ? 'P' : 'N';
    
    // Button shows opposite flight (click to switch to this flight)
    var oppositeFlight = currentFlight === 1 ? 2 : 1;
    
    var html = `
        <div class="compact-header" style="display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(6px, 2vw, 12px); margin-bottom: 15px; width: 100%;">
            <button class="compact-pn-btn" id="compactPnBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; border-radius: 30px; min-width: 44px; height: clamp(44px, 8vh, 52px); padding: 0 clamp(12px, 3vw, 20px); font-size: clamp(0.8rem, 3vw, 1rem); font-weight: 700; cursor: pointer; flex-shrink: 0;">
                ${pnText}
            </button>
            <button class="compact-flight-btn" id="compactFlightBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; border-radius: 30px; height: clamp(44px, 8vh, 52px); width: 100%; font-size: clamp(0.8rem, 3vw, 1rem); font-weight: 700; cursor: pointer; text-align: center; white-space: nowrap;">
                FLIGHT ${oppositeFlight}
            </button>
            <div class="compact-nav-group" style="display: flex; align-items: center; gap: clamp(4px, 1.5vw, 8px); flex-shrink: 0;">
                <button class="compact-prev-btn" id="compactPrevBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: clamp(44px, 8vw, 52px); height: clamp(44px, 8vh, 52px); border-radius: 30px; font-size: clamp(1rem, 4vw, 1.3rem); cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    ◀
                </button>
                <span class="compact-hole-display" style="font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 700; color: #4caf50; min-width: clamp(32px, 8vw, 44px); text-align: center;">${currentHole}</span>
                <button class="compact-next-btn" id="compactNextBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: clamp(44px, 8vw, 52px); height: clamp(44px, 8vh, 52px); border-radius: 30px; font-size: clamp(1rem, 4vw, 1.3rem); cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    ▶
                </button>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById('compactPnBtn').onclick = function() {
        var newMode = GameUI.getDisplayMode() === 'play' ? 'natural' : 'play';
        GameUI.setDisplayMode(newMode, null);
        renderAll();
    };
    
    // Flight button toggles to the flight shown on button (opposite of current)
    document.getElementById('compactFlightBtn').onclick = function() {
        var newFlight = currentFlight === 1 ? 2 : 1;
        currentFlight = newFlight;
        // Re-render the header to update button text for the new current flight
        renderCompactHeader();
        GameUI.updateFlightBadge(currentFlight);
        renderAll();
    };
    
    document.getElementById('compactPrevBtn').onclick = prevHole;
    document.getElementById('compactNextBtn').onclick = nextHole;
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================

function updatePlayerNamesToShortform() {
    var playerCards = document.querySelectorAll('.player-card');
    for (var i = 0; i < playerCards.length; i++) {
        var nameSpan = playerCards[i].querySelector('.player-name');
        if (nameSpan) {
            var originalName = nameSpan.innerText;
            var player = allPlayers.find(p => p.name === originalName);
            if (player && player.label) {
                nameSpan.innerText = player.label;
            }
        }
    }
}

function renderAll() {
    if (!f1DataString || !f2DataString) return;
    
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    updateTRDisplay();
    
    var currentPlayers = getFlightOrderedPlayers(currentFlight);
    GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClassWithClinch, getBubbleValue, getCurrentScore, false, null);
    updatePlayerNamesToShortform();
    GameUI.updateFlightBadge(currentFlight);
    
    // Hide any remaining score-control containers
    setTimeout(function() {
        var scoreControls = document.querySelectorAll('#playerCards .score-control');
        scoreControls.forEach(function(control) {
            control.style.display = 'none';
        });
    }, 10);
    
    var holes = getDisplayHoles();
    var savedHoles = { 1: [], 2: [] };
    for (var h = 1; h <= 18; h++) {
        if (isHoleSaved(1, h)) savedHoles[1].push(h);
        if (isHoleSaved(2, h)) savedHoles[2].push(h);
    }
    
    var t1Row = resultsCache?.game2?.flight1?.leader || new Array(18).fill('_');
    var t2Row = resultsCache?.game2?.flight2?.leader || new Array(18).fill('_');
    var strkRow = resultsCache?.game3?.leader || new Array(18).fill('_');
    var t1ClinchedHole = resultsCache?.game2?.flight1?.clinchedHole;
    var t2ClinchedHole = resultsCache?.game2?.flight2?.clinchedHole;
    var t1Display = resultsCache?.game2?.displayT1 || null;
    var t2Display = resultsCache?.game2?.displayT2 || null;
    var strkDisplay = resultsCache?.game3?.displayStrk || null;
    
    if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
        GameScorecard.renderScorecard(
            "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
            t1Row, t2Row, strkRow, coursePar, courseSi,
            t1ClinchedHole, t2ClinchedHole,
            t1Display, t2Display, strkDisplay
        );
    }
    
    // Update navigation button states
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var prevBtn = document.getElementById('compactPrevBtn');
    var nextBtn = document.getElementById('compactNextBtn');
    
    if (prevBtn) {
        prevBtn.disabled = (currentIndex === 0);
    }
    if (nextBtn) {
        var hasSavedData = isCurrentHoleSavedByAnyFlight();
        var isLastHole = (currentIndex === 17);
        nextBtn.disabled = (!hasSavedData) || isLastHole;
    }
    
    if (typeof Ticker !== 'undefined') Ticker.refresh();
}

// ============================================================
// RHP (Result & Handicap) Access
// ============================================================

function openRHP() {
    if (!currentGameData || !currentGameData.id) {
        console.warn("No game selected for RHP");
        return;
    }
    var recordId = currentGameData.id;
    var winningPlayers = { teamA: [], teamB: [] };
    for (var i = 0; i < allPlayers.length; i++) {
        if (allPlayers[i].team === 'A') winningPlayers.teamA.push(allPlayers[i]);
        else winningPlayers.teamB.push(allPlayers[i]);
    }
    var tr = resultsCache?.tr || { teamA: [9.5], teamB: [9.5] };
    var finalTeamA = tr.teamA[tr.teamA.length - 1] || 9.5;
    var finalTeamB = tr.teamB[tr.teamB.length - 1] || 9.5;
    var winner = finalTeamA > finalTeamB ? 'A' : (finalTeamB > finalTeamA ? 'B' : 'Tie');
    
    HandicapAdjustment.init(recordId, recordId, winningPlayers, {}, { teamA: finalTeamA, teamB: finalTeamB, winner: winner }, true);
}

// ============================================================
// Game List Functions
// ============================================================

function loadGameList() {
    var container = document.getElementById('gameListContainer');
    container.innerHTML = '<div class="loading">Loading games...</div>';
    
    db.collection('history-records').orderBy('date', 'desc').get()
        .then(function(snapshot) {
            var games = [];
            snapshot.forEach(function(doc) {
                var data = doc.data();
                games.push({
                    id: doc.id,
                    date: data.date,
                    course: data.course?.name || 'Unknown Course',
                    rawData: data
                });
            });
            
            if (games.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No completed games found.</div>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < games.length; i++) {
                var g = games[i];
                var displayDate = g.date;
                if (displayDate) {
                    var parts = displayDate.split('-');
                    if (parts.length === 3) {
                        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                        displayDate = parts[2] + ' ' + months[parseInt(parts[1]) - 1] + ' ' + parts[0];
                    }
                }
                html += '<div class="game-item" data-game-id="' + escapeHtml(g.id) + '">' +
                    '<div class="game-date">' + escapeHtml(displayDate) + '</div>' +
                    '<div class="game-course">' + escapeHtml(g.course) + '</div>' +
                    '</div>';
            }
            container.innerHTML = html;
            
            document.querySelectorAll('.game-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var id = this.getAttribute('data-game-id');
                    var game = games.find(function(g) { return g.id === id; });
                    if (game) loadGameDetail(game);
                });
            });
        })
        .catch(function(error) {
            console.error("Error loading games:", error);
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#ff6b6b;">Error loading games.</div>';
        });
}

function loadGameDetail(game) {
    var data = game.rawData;
    
    // Extract game data
    coursePar = data.course?.par || [];
    courseSi = data.course?.si || [];
    allPlayers = data.players || [];
    startingHole = data.startingHole || 1;
    teamGameFormat = data.teamGameFormat || "tournament";
    f1DataString = data.f1DataString || "";
    f2DataString = data.f2DataString || "";
    resultsCache = data.results || null;
    courseName = data.course?.name || "Unknown Course";
    
    currentGameData = { id: game.id, rawData: data };
    
    // Set initial hole (first unsaved or hole 1)
    var playOrder = getPlayOrder();
    currentHole = playOrder[0];
    currentFlight = 1;
    
    // Update UI
    document.getElementById("courseName").innerHTML = courseName;
    document.getElementById("gameDetailView").classList.add("data-ready");
    
    // Render components
    renderCompactHeader();
    initTicker();
    renderAll();
    
    // Show detail view, hide list view
    document.getElementById('gameListView').style.display = 'none';
    document.getElementById('gameDetailView').style.display = 'block';
    
    // Add RHP button to bottom menu
    GameUI.renderBottomMenu("bottomMenuContainer", function() {
        // Exit function - back to game list
        backToGamesList();
    });
    
    // Add RHP button after bottom menu
    setTimeout(function() {
        var bottomContainer = document.getElementById('bottomMenuContainer');
        if (bottomContainer && !document.getElementById('rhpBtn')) {
            var rhpBtn = document.createElement('button');
            rhpBtn.id = 'rhpBtn';
            rhpBtn.innerText = '📊 RESULT & HANDICAP';
            rhpBtn.style.cssText = 'background: #1a1a1a; border: 1px solid #ffaa44; color: #ffaa44; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px;';
            rhpBtn.onclick = openRHP;
            bottomContainer.appendChild(rhpBtn);
        }
    }, 100);
}

function backToGamesList() {
    // Clean up
    if (typeof Ticker !== 'undefined') Ticker.stop();
    
    // Reset state
    currentGameData = null;
    allPlayers = [];
    coursePar = [];
    courseSi = [];
    f1DataString = "";
    f2DataString = "";
    resultsCache = null;
    
    // Hide detail view, show list view
    document.getElementById('gameDetailView').style.display = 'none';
    document.getElementById('gameDetailView').classList.remove('data-ready');
    document.getElementById('gameListView').style.display = 'block';
    
    // Reload game list to refresh
    loadGameList();
}

function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// Exit to Main Menu
// ============================================================

function exitToMainMenu() {
    window.location.href = "index.html";
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "📋 " + myDeviceShortName;
    
    // Apply UI settings
    GameUI.applyTightLayout();
    GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
    
    // Set up button handlers
    document.getElementById('backToListBtn').onclick = exitToMainMenu;
    
    // Load game list
    loadGameList();
}

init();
</script>
