VERSION: 6.00

   - Reads completed games from history-records collection
   - Displays clinch data from stored results
   - Gold T-1/T-2 when flight clinched
   - Professional UI matching live game viewer
DEPENDS ON: Firebase Firestore, js/session.js, js/game-data.js, js/game-ui.js, js/ticker.js, js/hcp-adjust.js
STATUS: Production Ready
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SICC Ryder Cup - HISTORY</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <script src="js/game-data.js"></script>
    <script src="js/game-ui.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/hcp-adjust.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; padding-top: 20px; }
        
        .version-tag { position: fixed; top: 8px; right: 8px; font-size: 0.65rem; color: #4caf50; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-family: monospace; z-index: 1000; backdrop-filter: blur(4px); }
        .device-tag { position: fixed; top: 8px; left: 8px; font-size: 0.55rem; color: #4caf50; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 20px; font-family: monospace; z-index: 1000; opacity: 0.5; backdrop-filter: blur(4px); }
        
        .game-list { margin-bottom: 20px; }
        .game-item { background: #111; border: 1px solid #2a2a2a; border-radius: 20px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.1s ease; }
        .game-item:active { transform: scale(0.98); background: #1a1a1a; }
        .game-date { font-size: 1rem; font-weight: 600; color: #4caf50; }
        .game-course { font-size: 0.85rem; color: #888; margin-top: 4px; }
        
        .back-btn { background: #1a1a1a; border: 1px solid #4caf50; color: #4caf50; padding: 14px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; transition: all 0.1s ease; }
        .back-btn:active { transform: scale(0.98); }
        
        .status-bubble { background: rgba(76,175,80,0.15); border: 1px solid #4caf50; display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; color: #4caf50; margin: 8px 0 12px 0; cursor: pointer; backdrop-filter: blur(4px); }
        .team-score-card { background: #111; border-radius: 20px; padding: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #2a2a2a; }
        
        .player-card { background: #111; border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a2a2a; position: relative; }
        .player-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .player-name { font-size: 1rem; font-weight: 600; }
        .player-handicap { background: #1a3a1a; padding: 3px 10px; border-radius: 30px; font-size: 0.7rem; margin-left: 8px; color: #4caf50; }
        .score-value { font-size: 1.2rem; font-weight: 700; min-width: 48px; text-align: center; background: #1a1a1a; padding: 8px 0; border-radius: 30px; color: #4caf50; }
        
        .scorecard-section { margin: 20px 0; }
        .scorecard-wrapper { overflow-x: auto; border-radius: 16px; background: #111; border: 1px solid #2a2a2a; }
        .scorecard-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; min-width: 600px; }
        .scorecard-table th, .scorecard-table td { padding: 10px 4px; text-align: center; border-bottom: 1px solid #2a2a2a; }
        .scorecard-table th { color: #4caf50; background: #0d0d0d; font-weight: 600; position: sticky; top: 0; }
        .scorecard-table th:first-child, .scorecard-table td:first-child { position: sticky; left: 0; background: #111; z-index: 1; font-weight: 600; }
        .score-green { color: #4caf50; font-weight: 600; }
        .score-gold { color: #ffaa44; font-weight: 800; }
        .score-invisible { color: transparent; }
        .green-line td { border-bottom: 2px solid #4caf50; }
        
        .compact-header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 16px; }
        .compact-pn-btn, .compact-prev-btn, .compact-next-btn { border-radius: 40px !important; }
        .compact-flight-btn { border-radius: 40px !important; font-size: 1rem !important; font-weight: 800 !important; height: 52px; width: 100%; background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; cursor: pointer; }
        .compact-pn-btn { min-width: 52px; height: 52px; padding: 0 16px; font-size: 1rem; font-weight: 700; background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; border-radius: 40px; cursor: pointer; }
        .compact-nav-group { display: flex; align-items: center; gap: 8px; }
        .compact-nav-btn { width: 52px; height: 52px; border-radius: 40px; font-size: 1.3rem; background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; cursor: pointer; }
        .compact-hole-display { font-size: 1.2rem; font-weight: 700; color: #4caf50; min-width: 44px; text-align: center; }
        .compact-prev-btn:disabled, .compact-next-btn:disabled { background: #2a2a2a !important; color: #666 !important; border-color: #444 !important; opacity: 0.6; cursor: not-allowed; }
        
        .debug { text-align: center; font-size: 0.6rem; color: #444; margin-top: 20px; }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div id="gameListView" style="display: block;">
        <div class="game-list" id="gameListContainer"><div class="loading">Loading games...</div></div>
        <button class="back-btn" id="backToListBtn">← Back to Main Menu</button>
    </div>
    
    <div id="gameDetailView" style="display: none;">
        <div class="ticker-container" id="tickerContainer"><div class="ticker-content" id="tickerContent">Loading...</div></div>
        <div id="statusBubble" class="status-bubble">📜 HISTORY</div>
        <div id="courseName" style="text-align:center; margin-bottom:8px; font-size:0.85rem; color:#aaa;">Loading...</div>
        <div id="holeHeader" style="text-align:center; margin-bottom:10px;"></div>
        <div id="trDisplay" class="team-score-card"></div>
        <div id="playerCards" class="player-cards"></div>
        <div class="scorecard-section"><div id="compactHeaderContainer"></div><div class="scorecard-wrapper" id="scorecardWrapper"></div></div>
        <button class="back-btn" id="backToGamesBtn">← Back to Games List</button>
    </div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v6.00</div>

<script>
var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();

var currentGameData = null, allPlayers = [], coursePar = [], courseSi = [], f1DataString = "", f2DataString = "", resultsCache = null;
var startingHole = 1, currentDisplayMode = "play", currentFlight = 1, currentHole = 1;

function getPlayOrder() { var order = []; for (var i = startingHole; i <= 18; i++) order.push(i); for (var i = 1; i < startingHole; i++) order.push(i); return order; }
function getHolePosition(h) { var po = getPlayOrder(); for (var i = 0; i < po.length; i++) if (po[i] === h) return i; return h - 1; }
function getDisplayHoles() { if (currentDisplayMode === "natural") { var n = []; for (var i = 1; i <= 18; i++) n.push(i); return n; } return getPlayOrder(); }
function getFlightOrderedPlayers(flight) { var fp = allPlayers.filter(function(p) { return p.flight === flight; }); var tA = fp.filter(function(p) { return p.team === 'A'; }).sort(function(a,b){return a.handicap - b.handicap;}); var tB = fp.filter(function(p) { return p.team === 'B'; }).sort(function(a,b){return a.handicap - b.handicap;}); return tA.concat(tB); }
function getAllOpponents(player) { return allPlayers.filter(function(op) { return op.team !== player.team; }).sort(function(a,b){ var aI=(a.flight===player.flight), bI=(b.flight===player.flight); if(aI&&!bI) return -1; if(!aI&&bI) return 1; if(aI&&bI) return a.handicap-b.handicap; return a.flight-b.flight; }); }
function getStoredScore(player, hole) { var fd = player.flight===1?f1DataString:f2DataString; var hd = GameData.parseHoleData(fd, hole); if(!hd||!hd.saved) return coursePar[hole-1]||4; var fp = allPlayers.filter(function(p){return p.flight===player.flight;}); var tA = fp.filter(function(p){return p.team==='A';}).sort(function(a,b){return a.handicap-b.handicap;}); var tB = fp.filter(function(p){return p.team==='B';}).sort(function(a,b){return a.handicap-b.handicap;}); if(player.team==='A'){ if(tA[0]&&tA[0].name===player.name) return hd.scores.a1; if(tA[1]&&tA[1].name===player.name) return hd.scores.a2; } else { if(tB[0]&&tB[0].name===player.name) return hd.scores.b1; if(tB[1]&&tB[1].name===player.name) return hd.scores.b2; } return coursePar[hole-1]||4; }
function isHoleSaved(flight, hole) { var fd = flight===1?f1DataString:f2DataString; var hd = GameData.parseHoleData(fd, hole); return hd && hd.saved; }
function getMatchValueFromResults(p, o, h) { if(!resultsCache||!resultsCache.matchResults) return 0; var pos=getHolePosition(h); var ma=resultsCache.matchResults[pos]; if(!ma) return 0; var tA=allPlayers.filter(function(p){return p.team==='A';}).sort(function(a,b){return a.handicap-b.handicap;}); var tB=allPlayers.filter(function(p){return p.team==='B';}).sort(function(a,b){return a.handicap-b.handicap;}); var aI=-1,bI=-1; if(p.team==='A'){ for(var i=0;i<tA.length;i++) if(tA[i].name===p.name) aI=i; for(var i=0;i<tB.length;i++) if(tB[i].name===o.name) bI=i; } else { for(var i=0;i<tA.length;i++) if(tA[i].name===o.name) aI=i; for(var i=0;i<tB.length;i++) if(tB[i].name===p.name) bI=i; } if(aI===-1||bI===-1) return 0; var val=ma[aI*tB.length+bI]||0; return p.team==='B' ? -val : val; }
function getBubbleValue(p, o) { return GameUI.getBubbleValueShared(p, o, currentHole, resultsCache, allPlayers, getHolePosition); }
function getBubbleClassWithClinch(p, o) { var ca = resultsCache ? (resultsCache.clinchedAt || {}) : {}; return GameUI.getBubbleClassShared(p, o, currentHole, resultsCache, allPlayers, isHoleSaved, getHolePosition, ca); }
function getTRForHole(h) { if(!resultsCache||!resultsCache.tr) return {teamA:9.5,teamB:9.5,teamAGreen:true,teamBGreen:true}; var pos=getHolePosition(h); return {teamA:resultsCache.tr.teamA[pos]||9.5, teamB:resultsCache.tr.teamB[pos]||9.5, teamAGreen:resultsCache.tr.teamAGreen[pos]||true, teamBGreen:resultsCache.tr.teamBGreen[pos]||true}; }
function calculatePlayerScoreRelativeToPar(p) { var tg=0,tp=0; for(var h=1;h<=18;h++){ tp+=coursePar[h-1]; tg+=getStoredScore(p,h); } return tg-tp; }
function initTicker() { if(typeof Ticker!=='undefined'){ Ticker.init('tickerContainer','tickerContent',calculatePlayerScoreRelativeToPar); if(allPlayers&&allPlayers.length) Ticker.setPlayers(allPlayers); } }
function renderHoleHeader() { document.getElementById('holeHeader').innerHTML='<div style="display:inline-block; background:#111; padding:6px 24px; border-radius:40px; font-size:1.4rem; font-weight:800;">HOLE '+currentHole+'</div>'; }
function renderTR() { var tr=getTRForHole(currentHole); GameUI.updateTR("trDisplay",tr.teamA,tr.teamB,tr.teamAGreen,tr.teamBGreen); }
function renderPlayerCards() { var players=getFlightOrderedPlayers(currentFlight); GameUI.renderPlayerCards("playerCards",players,getAllOpponents,getBubbleClassWithClinch,getBubbleValue,function(p){return getStoredScore(p,currentHole);},false,null); setTimeout(function(){ var fc=document.querySelector('.player-card'); if(fc&&!document.querySelector('.flight-badge')){ var b=document.createElement('div'); b.className='flight-badge'; b.innerText='FLIGHT '+currentFlight; b.style.cssText='position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#1a3a1a; border:2px solid #4caf50; color:#4caf50; font-size:0.8rem; font-weight:700; padding:4px 16px; border-radius:30px; z-index:100; white-space:nowrap;'; fc.style.position='relative'; fc.appendChild(b); } },50); }
function renderScorecard() { var holes=getDisplayHoles(); window.savedHoles={1:[],2:[]}; for(var h=1;h<=18;h++){ if(isHoleSaved(1,h)) savedHoles[1].push(h); if(isHoleSaved(2,h)) savedHoles[2].push(h); } var t1Row=resultsCache?(resultsCache.game2?.flight1?.leader||new Array(18).fill('_')):new Array(18).fill('_'); var t2Row=resultsCache?(resultsCache.game2?.flight2?.leader||new Array(18).fill('_')):new Array(18).fill('_'); var strkRow=resultsCache?(resultsCache.game3?.leader||new Array(18).fill('_')):new Array(18).fill('_'); var t1c=resultsCache?.game2?.flight1?.clinched||{}; var t2c=resultsCache?.game2?.flight2?.clinched||{}; GameUI.renderScorecard('scorecardWrapper',holes,allPlayers,getStoredScore,isHoleSaved,t1Row,t2Row,strkRow,coursePar,courseSi,t1c,t2c); }
function renderAll() { if(!f1DataString||!f2DataString) return; renderHoleHeader(); renderTR(); renderPlayerCards(); renderScorecard(); updateNavButtons(); if(typeof Ticker!=='undefined') Ticker.refresh(); }
function updateNavButtons() { var po=getPlayOrder(); var saved=isHoleSaved(currentFlight,currentHole); GameUI.updateNavigationButtons(currentHole,po,saved,false,false,null); }
function goToPrevHole() { var po=getPlayOrder(); var idx=po.indexOf(currentHole); if(idx>0){ currentHole=po[idx-1]; var hd=document.querySelector('.compact-hole-display'); if(hd) hd.innerText=currentHole; renderAll(); } }
function goToNextHole() { var po=getPlayOrder(); var idx=po.indexOf(currentHole); if(idx<17){ currentHole=po[idx+1]; var hd=document.querySelector('.compact-hole-display'); if(hd) hd.innerText=currentHole; renderAll(); } }
function toggleDisplayMode() { currentDisplayMode=currentDisplayMode==='play'?'natural':'play'; GameUI.updateCompactPnButton(); renderAll(); }
function toggleFlight() { currentFlight=currentFlight===1?2:1; var btn=document.getElementById('compactFlightBtn'); if(btn) btn.innerText='FLIGHT '+currentFlight; renderAll(); }
function exitToMainMenu() { window.location.href="index.html"; }
function buildCompactHeader() { var c=document.getElementById('compactHeaderContainer'); if(!c) return; GameUI.renderCompactHeader("compactHeaderContainer",currentFlight,currentHole,null,goToPrevHole,goToNextHole,toggleFlight,toggleDisplayMode); var sb=document.getElementById('compactSaveBtn'); if(sb&&sb.parentNode){ var fb=document.createElement('button'); fb.id='compactFlightBtn'; fb.className='compact-flight-btn'; fb.innerText='FLIGHT '+currentFlight; fb.onclick=toggleFlight; sb.parentNode.replaceChild(fb,sb); } GameUI.updateCompactPnButton(); }

async function loadGameList() {
    var c = document.getElementById('gameListContainer');
    c.innerHTML = '<div class="loading">Loading games...</div>';
    try {
        var snap = await db.collection('history-records').orderBy('date', 'desc').get();
        var games = [];
        snap.forEach(function(doc) { var d = doc.data(); games.push({ id: doc.id, date: d.date, course: d.course?.name || 'Unknown Course', rawData: d }); });
        if (games.length === 0) { c.innerHTML = '<div style="text-align:center; padding:40px; color:#888;">No completed games found.</div>'; return; }
        var html = '';
        for (var i = 0; i < games.length; i++) {
            var g = games[i], displayDate = g.date;
            if (displayDate) { var parts = displayDate.split('-'); if (parts.length === 3) { var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; displayDate = parts[2] + ' ' + months[parseInt(parts[1])-1] + ' ' + parts[0]; } }
            html += '<div class="game-item" data-game-id="' + g.id + '"><div class="game-date">' + displayDate + '</div><div class="game-course">' + escapeHtml(g.course) + '</div></div>';
        }
        c.innerHTML = html;
        document.querySelectorAll('.game-item').forEach(function(el) { el.addEventListener('click', function() { var id = this.getAttribute('data-game-id'); var game = games.find(function(g){return g.id===id;}); if(game) loadGameDetail(game); }); });
    } catch(e) { c.innerHTML = '<div style="text-align:center; padding:40px; color:#ff6b6b;">Error loading games.</div>'; }
}

function loadGameDetail(game) {
    var d = game.rawData;
    coursePar = d.course?.par || [];
    courseSi = d.course?.si || [];
    allPlayers = d.players || [];
    startingHole = d.startingHole || 1;
    f1DataString = d.f1DataString || "";
    f2DataString = d.f2DataString || "";
    resultsCache = d.results || null;
    document.getElementById("courseName").innerHTML = d.course?.name || "Unknown Course";
    var po = getPlayOrder();
    currentHole = po[0];
    currentFlight = 1;
    buildCompactHeader();
    initTicker();
    renderAll();
    document.getElementById('gameListView').style.display = 'none';
    document.getElementById('gameDetailView').style.display = 'block';
    var b = document.getElementById('statusBubble');
    if(b) b.onclick = function() { location.reload(); };
}

function backToGamesList() {
    document.getElementById('gameDetailView').style.display = 'none';
    document.getElementById('gameListView').style.display = 'block';
    loadGameList();
}

function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }

async function init() {
    var sn = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "📋 " + sn;
    GameUI.applyTightLayout();
    document.getElementById('backToListBtn').onclick = exitToMainMenu;
    document.getElementById('backToGamesBtn').onclick = backToGamesList;
    loadGameList();
}
init();
</script>
</body>
</html>
