<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var currentGame = null;
var currentHole = 1;
var currentDisplayMode = "play";
var holeDataCache = null;
var allPlayersCache = null;
var courseCache = null;
var trCache = null;

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder(startingHole) {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    if (currentDisplayMode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder(courseCache?.startingHole || 1);
    }
}

function getHolePosition(holeNumber, startingHole) {
    var playOrder = getPlayOrder(startingHole);
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function decodeHoleData(holeDataString, holeNumber, startingHole, coursePar) {
    // holeDataString is 594 chars: 33 per hole in PLAY ORDER
    var playOrder = getPlayOrder(startingHole);
    var storagePos = -1;
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) {
            storagePos = i;
            break;
        }
    }
    
    if (storagePos === -1) return null;
    
    var startIdx = storagePos * 33;
    var holeSegment = holeDataString.substring(startIdx, startIdx + 33);
    
    if (holeSegment.length !== 33) return null;
    
    // Parse the 33 characters
    var f1ScoresEncoded = holeSegment.substring(0, 4);
    var f2ScoresEncoded = holeSegment.substring(4, 8);
    var matchBubblesEncoded = holeSegment.substring(8, 24);
    var trAEncoded = holeSegment.substring(24, 26);
    var trBEncoded = holeSegment.substring(26, 28);
    var trColors = holeSegment.substring(28, 30);
    var displayRows = holeSegment.substring(30, 33);
    
    // Decode flight scores
    var f1Scores = [];
    var f2Scores = [];
    for (var i = 0; i < 4; i++) {
        var f1Value = Encoding.decodeScore(f1ScoresEncoded[i]);
        var f2Value = Encoding.decodeScore(f2ScoresEncoded[i]);
        var par = coursePar[holeNumber - 1];
        f1Scores.push(par + f1Value);
        f2Scores.push(par + f2Value);
    }
    
    // Decode match bubbles (16 matches, in order: A1 vs B1, A1 vs B2, A2 vs B1, A2 vs B2, A3 vs B3...)
    var matchValues = [];
    for (var i = 0; i < 16; i++) {
        var encoded = matchBubblesEncoded[i];
        var value = Encoding.decodeMatchResult(encoded);
        matchValues.push(value);
    }
    
    // Decode TR
    var trA = Encoding.decodeTR(trAEncoded);
    var trB = Encoding.decodeTR(trBEncoded);
    var colors = Encoding.decodeTRColor(trColors);
    
    // Decode display rows
    var t1Row = Encoding.decodeDisplayRow(displayRows[0]);
    var t2Row = Encoding.decodeDisplayRow(displayRows[1]);
    var strkRow = Encoding.decodeDisplayRow(displayRows[2]);
    
    return {
        f1Scores: f1Scores,
        f2Scores: f2Scores,
        matchValues: matchValues,
        trA: trA,
        trB: trB,
        teamAGreen: colors.teamAGreen,
        teamBGreen: colors.teamBGreen,
        t1Row: t1Row,
        t2Row: t2Row,
        strkRow: strkRow
    };
}

function getPlayerScore(player, holeNumber) {
    if (!holeDataCache || !currentGame) return "-";
    
    var startingHole = courseCache?.startingHole || 1;
    var holeData = decodeHoleData(currentGame.holeData, holeNumber, startingHole, courseCache?.par || []);
    if (!holeData) return "-";
    
    var flightScores = (player.flight === 1) ? holeData.f1Scores : holeData.f2Scores;
    
    // Get ordered players for this flight to map index
    var flightPlayers = allPlayersCache.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var orderedPlayers = [teamA[0], teamA[1], teamB[0], teamB[1]];
    
    for (var i = 0; i < orderedPlayers.length; i++) {
        if (orderedPlayers[i] && orderedPlayers[i].name === player.name) {
            return flightScores[i];
        }
    }
    
    return "-";
}

function getMatchValue(player, opponent) {
    if (!holeDataCache || !currentGame) return 0;
    
    var startingHole = courseCache?.startingHole || 1;
    var holeData = decodeHoleData(currentGame.holeData, currentHole, startingHole, courseCache?.par || []);
    if (!holeData) return 0;
    
    // Find match index: all Team A players vs all Team B players in handicap order
    var teamAPlayers = allPlayersCache.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamBPlayers = allPlayersCache.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var aIndex = -1;
    var bIndex = -1;
    
    for (var i = 0; i < teamAPlayers.length; i++) {
        if (teamAPlayers[i].name === player.name) aIndex = i;
    }
    for (var i = 0; i < teamBPlayers.length; i++) {
        if (teamBPlayers[i].name === opponent.name) bIndex = i;
    }
    
    if (aIndex === -1 || bIndex === -1) return 0;
    
    var matchIndex = (aIndex * teamBPlayers.length) + bIndex;
    return holeData.matchValues[matchIndex] || 0;
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValue(player, opponent);
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValue(player, opponent);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getCurrentScore(player) {
    return getPlayerScore(player, currentHole);
}

function getAllOpponents(player) {
    return allPlayersCache.filter(function(op) { return op.team !== player.team; });
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayersCache.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function isHoleSaved(flight, hole) {
    // In history viewer, all holes are saved (game is complete)
    return true;
}

function getStoredScore(player, hole) {
    return getPlayerScore(player, hole);
}

function getTRForHole(holeNumber) {
    if (!holeDataCache || !currentGame) return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    
    var startingHole = courseCache?.startingHole || 1;
    var holeData = decodeHoleData(currentGame.holeData, holeNumber, startingHole, courseCache?.par || []);
    if (!holeData) return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    
    return {
        teamA: holeData.trA,
        teamB: holeData.trB,
        teamAGreen: holeData.teamAGreen,
        teamBGreen: holeData.teamBGreen
    };
}

// ============================================================
// Render Functions
// ============================================================

function renderAll() {
    if (!currentGame || !holeDataCache) return;
    
    var startingHole = courseCache?.startingHole || 1;
    var holeData = decodeHoleData(currentGame.holeData, currentHole, startingHole, courseCache?.par || []);
    if (!holeData) return;
    
    var currentPar = (courseCache?.par || [])[currentHole - 1] || 4;
    var currentSi = (courseCache?.si || [])[currentHole - 1] || 1;
    var tr = getTRForHole(currentHole);
    
    GameUI.updateHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    GameUI.updateFlightTab("flightTab", 1, false);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
    
    // Render Flight 1 players
    var flight1Players = getFlightOrderedPlayers(1);
    GameUI.renderPlayerCards(
        "playerCards",
        flight1Players,
        getAllOpponents,
        getBubbleClass,
        getBubbleValue,
        getCurrentScore,
        false,
        null
    );
    
    // Build display rows for scorecard
    var t1Row = new Array(18).fill('_');
    var t2Row = new Array(18).fill('_');
    var strkRow = new Array(18).fill('_');
    
    // Fill rows from holeData for all holes
    for (var hole = 1; hole <= 18; hole++) {
        var holeInfo = decodeHoleData(currentGame.holeData, hole, startingHole, courseCache?.par || []);
        if (holeInfo) {
            var pos = getHolePosition(hole, startingHole);
            t1Row[pos] = holeInfo.t1Row;
            t2Row[pos] = holeInfo.t2Row;
            strkRow[pos] = holeInfo.strkRow;
        }
    }
    
    var holes = getDisplayHoles();
    GameUI.renderScorecard(
        "scorecardWrapper",
        holes,
        allPlayersCache,
        getStoredScore,
        isHoleSaved,
        t1Row,
        t2Row,
        strkRow,
        courseCache?.par || [],
        courseCache?.si || []
    );
    
    // Update hole number display
    document.getElementById("holeNumberDisplay").innerText = currentHole;
    
    // Update nav buttons
    var playOrder = getPlayOrder(startingHole);
    var currentIndex = playOrder.indexOf(currentHole);
    var prevBtn = document.getElementById("prevHoleBtn");
    var nextBtn = document.getElementById("nextHoleBtn");
    if (prevBtn) prevBtn.disabled = (currentIndex === 0);
    if (nextBtn) nextBtn.disabled = (currentIndex === 17);
}

// ============================================================
// Navigation
// ============================================================

function goToPrevHole() {
    var startingHole = courseCache?.startingHole || 1;
    var playOrder = getPlayOrder(startingHole);
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        renderAll();
    }
}

function goToNextHole() {
    var startingHole = courseCache?.startingHole || 1;
    var playOrder = getPlayOrder(startingHole);
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        renderAll();
    }
}

// ============================================================
// Display Mode Toggle
// ============================================================

function setDisplayMode(mode) {
    currentDisplayMode = mode;
    var playBtn = document.getElementById("playOrderBtn");
    var naturalBtn = document.getElementById("naturalOrderBtn");
    if (playBtn && naturalBtn) {
        if (mode === "play") {
            playBtn.classList.add("active");
            naturalBtn.classList.remove("active");
        } else {
            playBtn.classList.remove("active");
            naturalBtn.classList.add("active");
        }
    }
    renderAll();
}

// ============================================================
// Game Selection
// ============================================================

function loadGameList() {
    var container = document.getElementById("gameSelector");
    container.innerHTML = '<div class="loading">Loading completed games...</div>';
    
    HistoryRecord.getArchivedGames(50, function(err, games) {
        if (err) {
            container.innerHTML = '<div class="empty-message">Error loading games: ' + err + '</div>';
            return;
        }
        
        if (!games || games.length === 0) {
            container.innerHTML = '<div class="empty-message">No completed games found.</div>';
            return;
        }
        
        var html = '<div class="game-list">';
        for (var i = 0; i < games.length; i++) {
            var g = games[i];
            var dateDisplay = g.date || "Unknown date";
            var courseDisplay = g.courseName || "Unknown course";
            var resultDisplay = g.winner || "Game complete";
            
            html += `
                <div class="game-item" data-id="${g.id}">
                    <div class="game-date">📅 ${dateDisplay}</div>
                    <div class="game-course">⛳ ${escapeHtml(courseDisplay)}</div>
                    <div class="game-result">🏆 ${escapeHtml(resultDisplay)}</div>
                </div>
            `;
        }
        html += '</div>';
        html += '<div style="text-align:center; font-size:0.7rem; color:#888;">Click a game to view details</div>';
        
        container.innerHTML = html;
        
        // Attach click handlers
        var items = document.querySelectorAll('.game-item');
        for (var i = 0; i < items.length; i++) {
            items[i].addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                loadGame(id);
            });
        }
    });
}

function loadGame(gameId) {
    var container = document.getElementById("gameSelector");
    container.innerHTML = '<div class="loading">Loading game data...</div>';
    
    HistoryRecord.getArchivedGame(gameId, function(err, gameData) {
        if (err || !gameData) {
            container.innerHTML = '<div class="empty-message">Error loading game: ' + (err || "Not found") + '</div>';
            return;
        }
        
        currentGame = gameData;
        allPlayersCache = gameData.players || [];
        courseCache = gameData.gameInfo?.course || {};
        if (courseCache && !courseCache.si) {
            courseCache.si = [];
            for (var i = 0; i < 18; i++) courseCache.si.push(i + 1);
        }
        
        // Validate holeData exists
        if (!gameData.holeData || gameData.holeData.length !== 594) {
            container.innerHTML = '<div class="empty-message">Invalid or missing hole data for this game.</div>';
            return;
        }
        
        holeDataCache = gameData.holeData;
        
        // Set starting hole for display order
        var startingHole = courseCache?.startingHole || 1;
        var playOrder = getPlayOrder(startingHole);
        currentHole = playOrder[0];
        
        // Update UI
        document.getElementById("courseName").innerHTML = courseCache?.name || "Unknown Course";
        document.getElementById("gameViewer").style.display = "block";
        container.style.display = "none";
        
        // Initialize display mode buttons
        setDisplayMode("play");
        
        renderAll();
    });
}

function goBackToGameList() {
    currentGame = null;
    holeDataCache = null;
    allPlayersCache = null;
    courseCache = null;
    currentHole = 1;
    
    document.getElementById("gameViewer").style.display = "none";
    var selector = document.getElementById("gameSelector");
    selector.style.display = "block";
    loadGameList();
}

function goBackToMenu() {
    window.location.href = "index.html";
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var shortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + shortName;
    
    SessionManager.initSession("view-history.html", "index.html", function(session) {
        console.log("Session initialized:", session);
    });
    
    loadGameList();
    
    document.getElementById("menuBtn").addEventListener("click", goBackToMenu);
    document.getElementById("prevHoleBtn").addEventListener("click", goToPrevHole);
    document.getElementById("nextHoleBtn").addEventListener("click", goToNextHole);
    document.getElementById("playOrderBtn").addEventListener("click", function() { setDisplayMode("play"); });
    document.getElementById("naturalOrderBtn").addEventListener("click", function() { setDisplayMode("natural"); });
    
    // Add back button to game selector (simple)
    var backBtn = document.createElement("button");
    backBtn.className = "btn-menu";
    backBtn.innerHTML = "← Back to Game List";
    backBtn.style.marginTop = "10px";
    backBtn.addEventListener("click", goBackToGameList);
    document.getElementById("gameViewer").appendChild(backBtn);
}

init();
</script>
