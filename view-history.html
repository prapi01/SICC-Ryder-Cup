<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {

} else {
    console.warn("[VIEW-HISTORY] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v8.51: Detail view back-link standardized
// ============================================================
var APP_VERSION = "8.52";
var CACHE_KEY = "view_history_version_v852";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    // Preserve ALL existing URL parameters
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[VIEW-HISTORY] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.VIEW_HISTORY_VERSION = "8.52";
console.log("[VIEW-HISTORY] Initializing v8.52 - Team One display rename");

// ============================================================
// Helper: Parse completedAt safely (handles both string and Firestore Timestamp)
// ============================================================
function parseCompletedAt(completedAt) {
    if (!completedAt) return new Date(0);
    if (completedAt.toDate) {
        return completedAt.toDate();
    }
    if (completedAt.seconds !== undefined) {
        return new Date(completedAt.seconds * 1000);
    }
    return new Date(completedAt);
}

// ============================================================
// Firebase already initialized in firebase-config.js
// ============================================================
var db = firebase.firestore();

// ============================================================
// Global state
// ============================================================
var allGames = [];
var dataLoaded = false;
var modulesLoaded = false;

// ============================================================
// Helper Functions
// ============================================================

function formatDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split('-');
    if (parts.length === 3) {
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return parts[2] + ' ' + months[parseInt(parts[1]) - 1] + ' ' + parts[0];
    }
    return dateStr;
}

function getFinalTR(results) {
    if (!results || !results.tr || !results.tr.teamA || !results.tr.teamB) {
        return { teamA: 9.5, teamB: 9.5 };
    }
    var lastIndex = results.tr.teamA.length - 1;
    return {
        teamA: results.tr.teamA[lastIndex] || 9.5,
        teamB: results.tr.teamB[lastIndex] || 9.5
    };
}

function getFinalDisplayRows(results) {
    if (!results) return { t1: "AS", t2: "AS", strk: "AS" };
    var lastIndex = 17;
    return {
        t1: results.game2?.displayT1?.[lastIndex] || "AS",
        t2: results.game2?.displayT2?.[lastIndex] || "AS",
        strk: results.game3?.displayStrk?.[lastIndex] || "AS"
    };
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ============================================================
// v8.40: Load and display celebration image DIRECTLY from record
// ============================================================

function loadCelebrationImageDirect(game, containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;
    
    // Check if the record has celebration data with a valid imageUrl
    var celebration = game.celebration || null;
    var imageUrl = celebration?.imageUrl || null;
    
    if (imageUrl) {
        // Directly display the photo from the record
        var imgHtml = '<img src="' + imageUrl + '" alt="Celebration" loading="lazy" onclick="window.open(\'' + imageUrl + '\', \'_blank\')" title="Click to view full size" class="loading" onload="this.className=\'loaded\'" onerror="this.className=\'error\'">';
        container.innerHTML = imgHtml;
        console.log('[VIEW-HISTORY] Displaying direct photo for:', game.archiveId, 'URL:', imageUrl.substring(0, 80) + '...');
    } else {
        // No photo in record - show placeholder
        container.innerHTML = '<div class="game-celebration-placeholder">🏌️</div>';
        console.log('[VIEW-HISTORY] No direct photo for:', game.archiveId);
    }
}

// ============================================================

// ============================================================

function showHandicapAdjustment(adjustedHandicaps, anchorName, players) {
    if (typeof HandicapAdjustment === 'undefined') {

        script.src = 'js/hcp-adjust.js?v=2.66';

        HandicapAdjustment.displayStoredAdjustment(adjustedHandicaps, anchorName, players, true);

}

// ============================================================
// Status Bubble Helper - Ensures bubble shows "VIEWER" after each render
// ============================================================

function setStatusBubbleToViewer() {

    if (statusBubble && statusBubble.innerText !== "VIEWER") {
        statusBubble.innerText = "VIEWER";

// ============================================================
// v8.25: Helper to get saved holes array using GameData (handles starting hole conversion)
// ============================================================

function getSavedHolesArray(flight, f1DataString, f2DataString, startingHole) {
    var dataString = flight === 1 ? f1DataString : f2DataString;
    if (typeof GameData !== 'undefined' && GameData.getSavedHolesFromString) {
        // Temporarily set startingHole in GameData for correct conversion
        var originalStartingHole = GameData.getStartingHole ? GameData.getStartingHole() : null;
        if (typeof GameData.getStartingHole === 'undefined') {
            // If GameData doesn't expose getStartingHole, we need to ensure the function uses the correct starting hole
            // The getSavedHolesFromString function internally uses getHoleAtStoragePosition which uses startingHole
            // We need to ensure startingHole is set correctly in GameData
            if (typeof GameData.setStartingHole === 'function') {
                GameData.setStartingHole(startingHole);
            } else if (typeof GameData._setStartingHole === 'function') {
                GameData._setStartingHole(startingHole);
            }
        }
        var saved = GameData.getSavedHolesFromString(dataString);
        // Restore original startingHole if needed
        if (originalStartingHole !== null && typeof GameData.setStartingHole === 'function') {
            GameData.setStartingHole(originalStartingHole);
        }
        return saved;
    }
    // Fallback: parse directly (less accurate for non-1 starting holes)
    var saved = [];
    if (!dataString) return saved;
    var i = 0;
    var holeNum = 1;
    while (i < dataString.length && holeNum <= 18) {
        if (dataString[i] === 'T') {
            saved.push(holeNum);
            i += 9;
        } else if (dataString[i] === 'F') {
            break;
        } else {
            i++;
        }
        holeNum++;
    }
    return saved;
}

// ============================================================
// Show Scorecard View - v8.36: Re-added display helper modules
// ============================================================

function showScorecardView(game) {
    var listView = document.getElementById('gameListView');
    var detailView = document.getElementById('gameDetailView');
    var detailContent = document.getElementById('detailContent');
    
    // v8.28: Safety check for gameId before navigation
    if (!game || !game.originalGameId) {
        console.error("[VIEW-HISTORY] Cannot show scorecard - no game ID");
        if (typeof Modal !== 'undefined' && Modal.alert) {
            Modal.alert("Error: No game ID found. Please return to the game list.");
        }
        return;
    }
    
    listView.style.display = 'none';
    detailView.style.display = 'block';
    detailContent.innerHTML = '<div class="grey-icon-container"><div class="grey-icon-loading">⛳</div></div>';
    
    // v8.36: Re-added game-match.js, game-team.js, game-stroke.js
    // These are DISPLAY HELPERS ONLY - they read stored data and format it
    // NO CALCULATIONS are performed in view-history
    var modulesToLoad = [
        'js/game-order.js',
        'js/game-data.js',
        'js/game-match.js',     // Display helper for match bubbles - NO CALCULATION
        'js/game-team.js',      // Display helper for team game - NO CALCULATION
        'js/game-stroke.js',    // Display helper for stroke game - NO CALCULATION
        'js/game-scorecard.js',
        'js/game-ui.js',
        'js/ticker.js'
    ];
    
    var loadedCount = 0;
    
    function checkAllLoaded() {
        loadedCount++;
        if (loadedCount === modulesToLoad.length) {
            renderScorecardView(game);
        }
    }
    
    for (var i = 0; i < modulesToLoad.length; i++) {
        var script = document.createElement('script');
        script.src = modulesToLoad[i];
        script.onload = checkAllLoaded;
        document.head.appendChild(script);
    }
}

function renderScorecardView(game) {
    var detailContent = document.getElementById('detailContent');
    
    var courseName = game.gameInfo?.course?.name || "Unknown Course";
    var coursePar = game.gameInfo?.course?.par || [];
    var courseSi = game.gameInfo?.course?.si || [];
    var allPlayers = game.players || [];
    var startingHole = game.gameInfo?.startingHole || 1;
    var f1DataString = game.f1DataString || "";
    var f2DataString = game.f2DataString || "";
    var resultsCache = game.results || null;
    
    // v8.25: Build savedHoles arrays using GameData.getSavedHolesFromString for correct conversion
    var savedHolesF1 = getSavedHolesArray(1, f1DataString, f2DataString, startingHole);
    var savedHolesF2 = getSavedHolesArray(2, f1DataString, f2DataString, startingHole);
    
    // v8.26: Update GameOrder with starting hole
    if (typeof GameOrder !== 'undefined' && GameOrder.setStartingHole) {
        GameOrder.setStartingHole(startingHole);
    }
    
    var html = `
        <div class="ticker-container" id="tickerContainer">
            <div class="ticker-content" id="tickerContent">&nbsp;</div>
        </div>
        <div style="text-align:center; margin-bottom:8px;" id="courseName">${escapeHtml(courseName)}</div>
        <div id="holeHeader"></div>
        <div id="flightTab" class="flight-tab"></div>
        <div id="trDisplay" class="team-score-card"></div>
        <div id="playerCards" class="player-cards"></div>
        <div class="scorecard-section">
            <div id="compactHeaderContainer"></div>
            <div class="scorecard-wrapper" id="scorecardWrapper"></div>
        </div>
        <div id="bottomMenuContainer"></div>
        <div class="debug" id="debug"></div>
    `;
    
    detailContent.innerHTML = html;
    
    GameUI.applyTightLayout();
    GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
    
    // v8.26: Delegate to GameOrder for order functions
    function getPlayOrder() {
        if (typeof GameOrder !== 'undefined' && GameOrder.getPlayOrder) {
            return GameOrder.getPlayOrder();
        }
        var order = [];
        for (var i = startingHole; i <= 18; i++) order.push(i);
        for (var i = 1; i < startingHole; i++) order.push(i);
        return order;
    }
    
    function getHolePosition(holeNumber) {
        if (typeof GameOrder !== 'undefined' && GameOrder.getPlayPosition) {
            return GameOrder.getPlayPosition(holeNumber);
        }
        var playOrder = getPlayOrder();
        for (var i = 0; i < playOrder.length; i++) {
            if (playOrder[i] === holeNumber) return i;
        }
        return holeNumber - 1;
    }
    
    function getDisplayHoles() {
        var mode = GameUI.getDisplayMode();
        if (typeof GameOrder !== 'undefined' && GameOrder.getDisplayHoles) {
            return GameOrder.getDisplayHoles(mode);
        }
        if (mode === "natural") {
            var natural = [];
            for (var i = 1; i <= 18; i++) natural.push(i);
            return natural;
        }
        return getPlayOrder();
    }
    
    function getFlightOrderedPlayers(flight) {
        var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
        var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        return teamA.concat(teamB);
    }
    
    function getStoredScore(player, hole) {
        var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
        var holeData = GameData.parseHoleData(flightDataStr, hole);
        if (!holeData || !holeData.saved) return coursePar[hole - 1];
        
        var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
        var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        if (player.team === 'A') {
            if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
            if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
        } else {
            if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
            if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
        }
        return coursePar[hole - 1];
    }
    
    // v8.25: Updated isHoleSaved to use pre-built savedHoles arrays
    function isHoleSaved(flight, hole) {
        var savedHolesArray = flight === 1 ? savedHolesF1 : savedHolesF2;
        return savedHolesArray.indexOf(hole) !== -1;
    }
    
    function isCurrentHoleSavedByAnyFlight() {
        return isHoleSaved(1, currentHole) || isHoleSaved(2, currentHole);
    }
    
    function getCurrentScore(player) {
        return getStoredScore(player, currentHole);
    }
    
    // v8.38: FIXED - getAllOpponents now correctly filters cross-flight opponents by team
    function getAllOpponents(player) {
        var opponents = [];
        
        // Intra-flight opponents (same flight, different team)
        var flightPlayers = allPlayers.filter(function(p) { 
            return p.flight === player.flight && p.team !== player.team; 
        });
        for (var i = 0; i < flightPlayers.length; i++) {
            if (flightPlayers[i].name !== player.name) {
                opponents.push(flightPlayers[i]);
            }
        }
        
        // Cross-flight opponents (different flight, OPPOSITE TEAM only)
        var otherFlightPlayers = allPlayers.filter(function(p) { 
            return p.flight !== player.flight && p.team !== player.team; 
        });
        for (var i = 0; i < otherFlightPlayers.length; i++) {
            opponents.push(otherFlightPlayers[i]);
        }
        
        return opponents;
    }
    
    // v8.39: FIXED - getMatchValueFromStoredResults now uses team-specific arrays for index lookup
    function getMatchValueFromStoredResults(player, opponent, holeNumber) {
        // Read from stored matchResults only - no calculation
        if (!resultsCache || !resultsCache.matchResults) return 0;
        
        var position = getHolePosition(holeNumber);
        var matchResultsArray = resultsCache.matchResults[position];
        if (!matchResultsArray) return 0;
        
        // Team A players ordered by flight then handicap
        var teamAPlayers = allPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { 
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        
        // Team B players ordered by flight then handicap
        var teamBPlayers = allPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { 
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        
        // Find player index in Team A array
        var aIndex = -1;
        for (var i = 0; i < teamAPlayers.length; i++) {
            if (teamAPlayers[i].name === player.name) aIndex = i;
            if (teamAPlayers[i].name === opponent.name) aIndex = i;
        }
        
        // Find player index in Team B array
        var bIndex = -1;
        for (var i = 0; i < teamBPlayers.length; i++) {
            if (teamBPlayers[i].name === player.name) bIndex = i;
            if (teamBPlayers[i].name === opponent.name) bIndex = i;
        }
        
        if (aIndex === -1 || bIndex === -1) return 0;
        
        // Match index = (Team A index * number of Team B players) + Team B index
        var matchIndex = (aIndex * teamBPlayers.length) + bIndex;
        var value = matchResultsArray[matchIndex] || 0;
        
        // If player is Team B, invert the value (because matchResults stores from Team A perspective)
        if (player.team === 'B') {
            return -value;
        }
        return value;
    }
    
    function getBubbleValue(player, opponent) {
        var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
        if (matchValue > 0) return matchValue;
        if (matchValue < 0) return Math.abs(matchValue);
        return 'AS';
    }
    
    // ============================================================
    // v8.43: FIXED getBubbleClass - Pass isOtherFlightHoleSaved as 10th parameter
    // ============================================================
    function getBubbleClass(player, opponent) {
        var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
        var clinchedAt = resultsCache?.clinchedAt || {};
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        var lastSyncedHole = resultsCache?.computedUpToHole || 18;
        
        // v8.43: In history view, ALL data is already saved, so isOtherFlightHoleSaved is always true
        // This ensures cross-flight bubbles show correct colors
        var isOtherFlightHoleSaved = true;
        
        // Use stored clinchedAt for history view
        // GameMatch is a DISPLAY HELPER ONLY - it reads stored data
        return GameMatch.getMatchBubbleClass(
            matchValue, clinchedAt, player, opponent, currentHole,
            isHoleSavedForFlight, lastSyncedHole, GameMatch.getClinchHole,
            startingHole, isOtherFlightHoleSaved  // v8.43: 10th parameter
        );
    }
    
    function updateTRDisplay() {
        if (!resultsCache || !resultsCache.tr) {
            GameUI.updateTR("trDisplay", 9.5, 9.5, true, true);
            return;
        }
        var position = getHolePosition(currentHole);
        var teamA = resultsCache.tr.teamA[position] || 9.5;
        var teamB = resultsCache.tr.teamB[position] || 9.5;
        var teamAGreen = resultsCache.tr.teamAGreen[position] !== undefined ? resultsCache.tr.teamAGreen[position] : (teamA > teamB);
        var teamBGreen = resultsCache.tr.teamBGreen[position] !== undefined ? resultsCache.tr.teamBGreen[position] : (teamB > teamA);
        GameUI.updateTR("trDisplay", teamA, teamB, teamAGreen, teamBGreen);
    }
    
    function getPlayerTotalScore(player) {
        if (!resultsCache || !resultsCache.playerTotals) return 0;
        var playerTotal = resultsCache.playerTotals[player.name];
        return playerTotal ? playerTotal.relativeToPar : 0;
    }
    
    function initTicker() {
        if (typeof Ticker !== 'undefined') {
            Ticker.init('tickerContainer', 'tickerContent', getPlayerTotalScore);
            if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
        }
    }
    
    function nextHole() {
        var playOrder = getPlayOrder();
        var currentIndex = playOrder.indexOf(currentHole);
        if (!isCurrentHoleSavedByAnyFlight()) return;
        if (currentIndex < 17) {
            currentHole = playOrder[currentIndex + 1];
            updateHoleNumberDisplay();
            renderDetailView();
            setStatusBubbleToViewer();
        }
    }
    
    function prevHole() {
        var playOrder = getPlayOrder();
        var currentIndex = playOrder.indexOf(currentHole);
        if (currentIndex > 0) {
            currentHole = playOrder[currentIndex - 1];
            updateHoleNumberDisplay();
            renderDetailView();
            setStatusBubbleToViewer();
        }
    }
    
    function updateHoleNumberDisplay() {
        GameUI.updateCompactHoleDisplay(currentHole);
        GameUI.updateHoleHeaderNumber(currentHole);
    }
    
    function onToggleFlight(flightNumber) {
        currentFlight = flightNumber;
        GameUI.updateFlightBadge(flightNumber);
        GameUI.updateCompactHoleDisplay(currentHole);
        renderPlayerCardsOnly();
        setStatusBubbleToViewer();
    }
    
    function renderPlayerCardsOnly() {
        if (!f1DataString || !f2DataString) return;
        
        updateTRDisplay();
        
        var currentPlayers = getFlightOrderedPlayers(currentFlight);
        GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClass, getBubbleValue, getCurrentScore, false, null);
        
        setTimeout(function() {
            var playerCards = document.querySelectorAll('#playerCards .player-name');
            for (var i = 0; i < playerCards.length; i++) {
                var originalName = playerCards[i].innerText;
                var player = allPlayers.find(function(p) { return p.name === originalName; });
                if (player && player.label) playerCards[i].innerText = player.label;
            }
        }, 10);
        
        GameUI.updateFlightBadge(currentFlight);
        
        if (typeof Ticker !== 'undefined') Ticker.refresh();
    }
    
    // v8.36: renderDetailView - Pass clinchedAt to GameScorecard
    function renderDetailView() {
        if (!f1DataString || !f2DataString) return;
        
        var currentPar = coursePar[currentHole - 1];
        var currentSi = courseSi[currentHole - 1];
        
        GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
        updateTRDisplay();
        
        var currentPlayers = getFlightOrderedPlayers(currentFlight);
        GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClass, getBubbleValue, getCurrentScore, false, null);
        
        setTimeout(function() {
            var playerCards = document.querySelectorAll('#playerCards .player-name');
            for (var i = 0; i < playerCards.length; i++) {
                var originalName = playerCards[i].innerText;
                var player = allPlayers.find(function(p) { return p.name === originalName; });
                if (player && player.label) playerCards[i].innerText = player.label;
            }
        }, 10);
        
        GameUI.updateFlightBadge(currentFlight);
        
        // v8.33: FIXED - Use displayT2 instead of flight2.leader, displayStrk instead of game3.leader
        var t1Row = resultsCache?.game2?.flight1?.leader || new Array(18).fill('_');
        var t2Row = resultsCache?.game2?.displayT2 || new Array(18).fill('_');
        var strkRow = resultsCache?.game3?.displayStrk || new Array(18).fill('_');
        var t1ClinchedHole = resultsCache?.game2?.flight1?.clinchedHole;
        var t2ClinchedHole = resultsCache?.game2?.flight2?.clinchedHole;
        var t1Display = resultsCache?.game2?.displayT1 || null;
        var t2Display = resultsCache?.game2?.displayT2 || null;
        var strkDisplay = resultsCache?.game3?.displayStrk || null;
        
        // v8.35: Get clinchedAt directly from the history record
        var clinchedAt = resultsCache?.clinchedAt || {};
        
        var displayMode = GameUI.getDisplayMode();
        
        // v8.36: Pass clinchedAt as 16th parameter to enable green highlights
        if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
            GameScorecard.renderScorecard(
                "scorecardWrapper",
                displayMode,
                startingHole,
                allPlayers,
                getStoredScore,
                isHoleSaved,
                t1Row,
                t2Row,
                strkRow,
                coursePar,
                courseSi,
                t1ClinchedHole,
                t2ClinchedHole,
                t1Display,
                t2Display,
                strkDisplay,
                clinchedAt
            );
        } else {
            // Fallback to old signature if needed
            var holes = getDisplayHoles();
            GameScorecard.renderScorecard(
                "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
                t1Row, t2Row, strkRow, coursePar, courseSi,
                t1ClinchedHole, t2ClinchedHole,
                t1Display, t2Display, strkDisplay,
                clinchedAt
            );
        }
        
        var playOrder = getPlayOrder();
        var currentIndex = playOrder.indexOf(currentHole);
        var prevBtn = document.getElementById('compactPrevBtn');
        var nextBtn = document.getElementById('compactNextBtn');
        
        if (prevBtn) prevBtn.disabled = (currentIndex === 0);
        if (nextBtn) {
            var hasSavedData = isCurrentHoleSavedByAnyFlight();
            var isLastHole = (currentIndex === 17);
            nextBtn.disabled = (!hasSavedData) || isLastHole;
        }
        
        if (typeof Ticker !== 'undefined') Ticker.refresh();
    }
    
    var playOrder = getPlayOrder();
    
    // v8.25: Find first hole that has saved data using the corrected savedHoles arrays
    var startHole = playOrder[0];
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        if (isHoleSaved(1, hole) || isHoleSaved(2, hole)) {
            startHole = hole;
            break;
        }
    }
    
    var currentHole = startHole;
    var currentFlight = 1;
    
    console.log('[VIEW-HISTORY] Initial hole set to:', currentHole);
    console.log('[VIEW-HISTORY] savedHolesF1:', savedHolesF1);
    console.log('[VIEW-HISTORY] savedHolesF2:', savedHolesF2);
    
    GameUI.renderCompactHeader(
        "compactHeaderContainer",
        currentFlight,
        currentHole,
        null,
        prevHole,
        nextHole,
        onToggleFlight,
        null
    );
    
    initTicker();
    renderDetailView();
    GameUI.renderBottomMenu("bottomMenuContainer", null);
    
    setStatusBubbleToViewer();
    
    detailContent.classList.add('data-ready');
}

function loadLabelHistory() {
    console.log("[VIEW-HISTORY] Loading labelHistory from playerInformation...");
    
    db.collection("playerInformation").doc("players").get()
        .then(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                var labelHistory = data.labelHistory || {};
                var players = data.players || [];
                var entryCount = Object.keys(labelHistory).length;
                
                console.log("[VIEW-HISTORY] labelHistory found:", entryCount, "entries");
                
                if (entryCount > 0) {
                    renderLabelResolutionCard(labelHistory, players);
                } else {
                    console.log("[VIEW-HISTORY] No labelHistory entries found");
                    // No card to render
                }
            } else {
                console.log("[VIEW-HISTORY] No playerInformation document found");
                // No card to render
            }
        })
        .catch(function(err) {
            console.warn("[VIEW-HISTORY] Could not load labelHistory:", err);
            // No card to render
        });
}

function renderLabelResolutionCard(labelHistory, players) {
    var container = document.getElementById('labelResolutionContainer');
    if (!container) return;
    
    // Build player name lookup from label
    var playerMap = {};
    for (var i = 0; i < players.length; i++) {
        if (players[i].label) {
            playerMap[players[i].label] = players[i].name;
        }
        // Also map by name
        playerMap[players[i].name] = players[i].name;
    }
    
    // Build list of resolutions
    var entries = [];
    for (var oldLabel in labelHistory) {
        var newLabel = labelHistory[oldLabel];
        if (oldLabel !== newLabel) {
            // Try to find player name by old label first, then new label
            var playerName = playerMap[oldLabel] || playerMap[newLabel] || oldLabel;
            entries.push({
                oldLabel: oldLabel,
                newLabel: newLabel,
                playerName: playerName
            });
        }
    }
    
    // If no entries, hide the card
    if (entries.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        console.log("[VIEW-HISTORY] No label resolutions to display");
        return;
    }
    
    // Build the card HTML
    var html = '<div class="label-resolution-card">';
    html += '<div class="label-resolution-title"><span class="icon">🔄</span> Label History Resolution</div>';
    
    for (var i = 0; i < entries.length; i++) {
        var entry = entries[i];
        html += '<div class="label-resolution-item">';
        html += '<span class="label-resolution-old">' + escapeHtml(entry.oldLabel) + '</span>';
        html += '<span class="label-resolution-arrow">→</span>';
        html += '<span class="label-resolution-new">' + escapeHtml(entry.newLabel) + '</span>';
        html += '<span class="label-resolution-player">' + escapeHtml(entry.playerName) + '</span>';
        html += '</div>';
    }
    
    html += '<div class="label-resolution-footer">Showing current labels for historical references</div>';
    html += '</div>';
    
    container.innerHTML = html;
    container.style.display = 'block';
    console.log("[VIEW-HISTORY] Label Resolution Card rendered with", entries.length, "entries");
}

function loadGameListAndModules() {
    var container = document.getElementById('gameListContainer');
    container.innerHTML = '<div class="grey-icon-container"><div class="grey-icon-loading">⛳</div></div>';
    
    dataLoaded = false;
    modulesLoaded = false;
    
    console.log("[VIEW-HISTORY] Loading ALL games from Firestore with FirebaseRetry.getCollection()...");
    FirebaseRetry.getCollection("historyGames", {
        onExit: function() {
            window.location.href = "index.html";
        }
    })
        .then(function(snapshot) {
            var games = [];
            snapshot.forEach(function(doc) {
                var data = doc.data();
                // v8.44: Include signatures from history data (nested structure)
                var signatures = data.signatures || null;
                // If signatures exist, use them; otherwise default to nested structure
                var normalizedSignatures = null;
                if (signatures) {
                    // Check if it's already nested (has f1.signed)
                    if (signatures.f1 && typeof signatures.f1 === 'object' && signatures.f1.signed !== undefined) {
                        normalizedSignatures = signatures;
                    } else if (signatures.f1 === true || signatures.f1 === false) {
                        // Convert flat to nested
                        normalizedSignatures = {
                            f1: { signed: signatures.f1 === true, signedAt: null, captainName: null },
                            f2: { signed: signatures.f2 === true, signedAt: null, captainName: null }
                        };
                    } else {
                        // Fallback: default nested with both signed
                        normalizedSignatures = {
                            f1: { signed: true, signedAt: null, captainName: null },
                            f2: { signed: true, signedAt: null, captainName: null }
                        };
                    }
                } else {
                    // No signatures in history - default to both signed (completed game)
                    normalizedSignatures = {
                        f1: { signed: true, signedAt: null, captainName: null },
                        f2: { signed: true, signedAt: null, captainName: null }
                    };
                }
                
                games.push({
                    archiveId: doc.id,
                    originalGameId: data.originalGameId,
                    date: data.gameInfo?.date || "",
                    courseName: data.gameInfo?.course?.name || "Unknown Course",
                    gameInfo: data.gameInfo,
                    players: data.players,
                    results: data.results,
                    f1DataString: data.f1DataString || "",
                    f2DataString: data.f2DataString || "",
                    adjustedHandicaps: data.adjustedHandicaps,
                    completedAt: data.completedAt || data.createdAt,
                    celebration: data.celebration || null,  // v8.40: Include celebration data
                    signatures: normalizedSignatures  // v8.44: Include normalized signatures
                });
            });
            
            // v8.49: FIXED SORT - Now sorts by game.date (actual game date) instead of completedAt
            // completedAt was inconsistent (undefined, string, Timestamp) causing wrong order
            games.sort(function(a, b) {
                var dateA = new Date(a.date);
                var dateB = new Date(b.date);
                return dateB - dateA; // Newest first
            });
            
            renderGameList(games);
        })
        .catch(function(error) {
            console.error("[VIEW-HISTORY] Error loading games after retries:", error);
            container.innerHTML = '<div class="error-message">Unable to load games. Please check your connection and refresh.</div>';
            dataLoaded = true;
            checkBothReady();
            // Still try to load labelHistory
            loadLabelHistory();
        });
    
    // v8.36: Re-added game-match.js, game-team.js, game-stroke.js
    // These are DISPLAY HELPERS ONLY - they read stored data and format it
    // NO CALCULATIONS are performed in view-history
    var modulesToLoad = [
        'js/game-order.js',
        'js/game-data.js',
        'js/game-match.js',     // Display helper for match bubbles - NO CALCULATION
        'js/game-team.js',      // Display helper for team game - NO CALCULATION
        'js/game-stroke.js',    // Display helper for stroke game - NO CALCULATION
        'js/game-scorecard.js',
        'js/game-ui.js',
        'js/ticker.js',
        'js/hcp-adjust.js'
    ];
    
    var loadedCount = 0;
    
    function moduleLoaded() {
        loadedCount++;
        console.log("[VIEW-HISTORY] Module loaded:", loadedCount, "of", modulesToLoad.length);
        if (loadedCount === modulesToLoad.length) {
            console.log("[VIEW-HISTORY] All modules loaded");
            modulesLoaded = true;
            checkBothReady();
        }
    }
    
    for (var i = 0; i < modulesToLoad.length; i++) {
        var script = document.createElement('script');
        script.src = modulesToLoad[i];
        script.onload = moduleLoaded;
        script.onerror = function() {
            console.error("[VIEW-HISTORY] Failed to load module:", this.src);
            loadedCount++;
            if (loadedCount === modulesToLoad.length) {
                modulesLoaded = true;
                checkBothReady();
            }
        };
        document.head.appendChild(script);
    }
}

function backToGameList() {
    var listView = document.getElementById('gameListView');
    var detailView = document.getElementById('gameDetailView');
    var detailContent = document.getElementById('detailContent');
    
    detailContent.innerHTML = '';
    detailView.style.display = 'none';
    listView.style.display = 'block';
    
    loadGameListAndModules();
}

function exitToMainMenu() {
    window.location.href = "index.html";
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "📋 " + myDeviceShortName;
    
    // v8.50: Standard back-link uses click event for main menu
    document.getElementById('backToMenuLink').addEventListener('click', exitToMainMenu);
    // v8.51: Standard back-link uses click event for back to game list
    document.getElementById('backToListLink').addEventListener('click', backToGameList);
    
    loadGameListAndModules();
}

init();
</script>
