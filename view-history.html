<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var currentGameData = null;
var currentGameId = null;
var currentOriginalGameId = null;
var allPlayersCache = null;
var courseCache = null;
var f1DataString = null;
var f2DataString = null;
var resultsCache = null;

var currentHole = 1;
var currentDisplayMode = "play";
var selectedFlight = 1;

// ============================================================
// Helper Functions
// ============================================================

function formatDisplayDate(dateString) {
    if (!dateString) return "";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function getPlayOrder(startingHole) {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber, startingHole) {
    var playOrder = getPlayOrder(startingHole);
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getDisplayHoles() {
    if (currentDisplayMode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder(courseCache?.startingHole || 1);
    }
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayersCache.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) {
        var par = (courseCache?.par || [])[hole - 1] || 4;
        return par;
    }
    
    var flightPlayers = allPlayersCache.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return (courseCache?.par || [])[hole - 1] || 4;
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    return allPlayersCache.filter(function(op) { return op.team !== player.team; });
}

function isHoleSaved(flight, hole) {
    var flightDataStr = flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    return holeData && holeData.saved;
}

function getMatchValueFromResults(player, opponent, holeNumber) {
    if (!resultsCache || !resultsCache.matchResults) return 0;
    var startingHole = courseCache?.startingHole || 1;
    var position = getHolePosition(holeNumber, startingHole);
    var matchArray = resultsCache.matchResults[position];
    if (!matchArray) return 0;
    
    var teamAPlayers = allPlayersCache.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamBPlayers = allPlayersCache.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var aIdx = -1, bIdx = -1;
    if (player.team === 'A') {
        for (var i = 0; i < teamAPlayers.length; i++) {
            if (teamAPlayers[i].name === player.name) aIdx = i;
        }
        for (var i = 0; i < teamBPlayers.length; i++) {
            if (teamBPlayers[i].name === opponent.name) bIdx = i;
        }
    } else {
        for (var i = 0; i < teamAPlayers.length; i++) {
            if (teamAPlayers[i].name === opponent.name) aIdx = i;
        }
        for (var i = 0; i < teamBPlayers.length; i++) {
            if (teamBPlayers[i].name === player.name) bIdx = i;
        }
    }
    if (aIdx === -1 || bIdx === -1) return 0;
    var matchIndex = aIdx * teamBPlayers.length + bIdx;
    var value = matchArray[matchIndex] || 0;
    return (player.team === 'B') ? -value : value;
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
    
    if (!isHoleSavedForFlight) return 'bubble-grey';
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getTRForHole(holeNumber) {
    if (!resultsCache || !resultsCache.tr) {
        return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    }
    var startingHole = courseCache?.startingHole || 1;
    var position = getHolePosition(holeNumber, startingHole);
    return {
        teamA: resultsCache.tr.teamA[position] !== undefined ? resultsCache.tr.teamA[position] : 9.5,
        teamB: resultsCache.tr.teamB[position] !== undefined ? resultsCache.tr.teamB[position] : 9.5,
        teamAGreen: resultsCache.tr.teamAGreen[position] !== undefined ? resultsCache.tr.teamAGreen[position] : true,
        teamBGreen: resultsCache.tr.teamBGreen[position] !== undefined ? resultsCache.tr.teamBGreen[position] : true
    };
}

// ============================================================
// Render Functions
// ============================================================

function renderHoleHeader() {
    var header = document.getElementById('holeHeader');
    if (header) {
        header.innerHTML = '<div style="display:inline-block; background:#111; padding:4px 20px; border-radius:40px; font-size:1.5rem; font-weight:800;">HOLE ' + currentHole + '</div>';
    }
}

function updateTRDisplay() {
    var tr = getTRForHole(currentHole);
    var teamADisplay = tr.teamA % 1 === 0 ? tr.teamA : tr.teamA.toFixed(1);
    var teamBDisplay = tr.teamB % 1 === 0 ? tr.teamB : tr.teamB.toFixed(1);
    var teamAColor = tr.teamA > tr.teamB ? '#4caf50' : (tr.teamA < tr.teamB ? '#ff6b6b' : '#4caf50');
    var teamBColor = tr.teamB > tr.teamA ? '#4caf50' : (tr.teamB < tr.teamA ? '#ff6b6b' : '#4caf50');
    
    var trDiv = document.getElementById('trDisplay');
    if (trDiv) {
        trDiv.innerHTML = '<div style="text-align:center;"><div style="display:flex; justify-content:center; align-items:center; gap:16px;">' +
            '<div><div style="font-size:0.85rem; font-weight:600; color:' + teamAColor + ';">TEAM A</div><div style="font-size:1.8rem; font-weight:800; color:' + teamAColor + ';">' + teamADisplay + '</div></div>' +
            '<div style="font-size:1.5rem; color:#888;">│</div>' +
            '<div><div style="font-size:0.85rem; font-weight:600; color:' + teamBColor + ';">TEAM B</div><div style="font-size:1.8rem; font-weight:800; color:' + teamBColor + ';">' + teamBDisplay + '</div></div>' +
        '</div></div>';
    }
}

function renderPlayerCards() {
    var players = getFlightOrderedPlayers(selectedFlight);
    var cardsHtml = '';
    
    for (var i = 0; i < players.length; i++) {
        var p = players[i];
        var score = getCurrentScore(p);
        var opponents = getAllOpponents(p);
        var bubblesHtml = '<div class="bubbles">';
        for (var j = 0; j < opponents.length; j++) {
            var opp = opponents[j];
            var bubbleClass = getBubbleClass(p, opp);
            var bubbleValue = getBubbleValue(p, opp);
            bubblesHtml += '<div class="bubble ' + bubbleClass + '">vs ' + escapeHtml(opp.label) + ' ' + bubbleValue + '</div>';
        }
        bubblesHtml += '</div>';
        
        cardsHtml += '<div class="player-card">' +
            '<div class="player-header">' +
                '<div><span class="player-name">' + escapeHtml(p.name) + '</span><span class="player-handicap">' + p.label + ' ' + p.handicap + '</span></div>' +
                '<div class="score-value">' + score + '</div>' +
            '</div>' +
            bubblesHtml +
        '</div>';
    }
    document.getElementById('playerCards').innerHTML = cardsHtml;
    
    setTimeout(function() {
        var firstCard = document.querySelector('.player-card');
        if (firstCard && !document.querySelector('.flight-badge')) {
            var badge = document.createElement('div');
            badge.className = 'flight-badge';
            badge.innerText = 'FLIGHT ' + selectedFlight;
            badge.style.cssText = 'position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#1a3a1a; border:2px solid #4caf50; color:#4caf50; font-size:0.8rem; font-weight:700; padding:4px 16px; border-radius:30px; z-index:100; white-space:nowrap;';
            firstCard.style.position = 'relative';
            firstCard.appendChild(badge);
        }
    }, 50);
}

function renderScorecard() {
    var holes = getDisplayHoles();
    window.savedHoles = { 1: [], 2: [] };
    for (var h = 1; h <= 18; h++) {
        if (isHoleSaved(1, h)) window.savedHoles[1].push(h);
        if (isHoleSaved(2, h)) window.savedHoles[2].push(h);
    }
    
    var t1Row = resultsCache ? (resultsCache.game2?.flight1?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var t2Row = resultsCache ? (resultsCache.game2?.flight2?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var strkRow = resultsCache ? (resultsCache.game3?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    
    GameUI.renderScorecard('scorecardWrapper', holes, allPlayersCache, getStoredScore, isHoleSaved, t1Row, t2Row, strkRow, courseCache?.par || [], courseCache?.si || []);
}

function renderScorecardPage() {
    if (!f1DataString || !f2DataString) return;
    
    renderHoleHeader();
    updateTRDisplay();
    renderPlayerCards();
    renderScorecard();
}

// ============================================================
// Navigation
// ============================================================

function goToPrevHole() {
    var startingHole = courseCache?.startingHole || 1;
    var playOrder = getPlayOrder(startingHole);
    var idx = playOrder.indexOf(currentHole);
    if (idx > 0) {
        currentHole = playOrder[idx - 1];
        document.getElementById('compactHoleDisplay').innerText = currentHole;
        renderHoleHeader();
        updateTRDisplay();
        renderPlayerCards();
        renderScorecard();
    }
}

function goToNextHole() {
    var startingHole = courseCache?.startingHole || 1;
    var playOrder = getPlayOrder(startingHole);
    var idx = playOrder.indexOf(currentHole);
    if (idx < 17) {
        currentHole = playOrder[idx + 1];
        document.getElementById('compactHoleDisplay').innerText = currentHole;
        renderHoleHeader();
        updateTRDisplay();
        renderPlayerCards();
        renderScorecard();
    }
}

function toggleDisplayMode() {
    currentDisplayMode = currentDisplayMode === 'play' ? 'natural' : 'play';
    document.getElementById('compactPnBtn').innerText = currentDisplayMode === 'play' ? 'P' : 'N';
    renderScorecard();
}

function onToggleFlight(flightNumber) {
    selectedFlight = flightNumber;
    document.getElementById('compactFlightBtn').innerText = 'FLIGHT ' + selectedFlight;
    renderPlayerCards();
}

// ============================================================
// Final Result Display
// ============================================================

function showResultMode() {
    if (!currentGameData) return;
    
    var finalResults = currentGameData.finalResults || {};
    var teamAScore = finalResults.teamAScore || 9.5;
    var teamBScore = finalResults.teamBScore || 9.5;
    var winner = finalResults.winner || "Tie";
    var winnerText = finalResults.winnerText || (winner === "A" ? "Team A Wins!" : winner === "B" ? "Team B Wins!" : "Tie Game!");
    
    var courseName = courseCache?.name || "Unknown Course";
    var gameDateRaw = currentGameData.gameInfo?.date || "";
    var gameDateFormatted = formatDisplayDate(gameDateRaw);
    
    document.getElementById("finalCourseName").innerHTML = escapeHtml(courseName);
    document.getElementById("finalDate").innerHTML = gameDateFormatted;
    
    var teamAClass = (winner === "A") ? "winner" : "loser";
    var teamBClass = (winner === "B") ? "winner" : "loser";
    if (winner === "Tie") { teamAClass = "winner"; teamBClass = "winner"; }
    
    document.getElementById("finalScore").innerHTML = '<span class="team-a ' + teamAClass + '">Team A ' + teamAScore + '</span><span>-</span><span class="team-b ' + teamBClass + '">' + teamBScore + ' Team B</span>';
    document.getElementById("finalWinner").innerHTML = winnerText;
    
    var winningTeamPlayers = [];
    if (winner === "A") {
        winningTeamPlayers = allPlayersCache.filter(function(p) { return p.team === "A"; });
        document.getElementById("finalPlayersTitle").innerHTML = "🏅 TEAM A 🏅";
    } else if (winner === "B") {
        winningTeamPlayers = allPlayersCache.filter(function(p) { return p.team === "B"; });
        document.getElementById("finalPlayersTitle").innerHTML = "🏅 TEAM B 🏅";
    } else {
        winningTeamPlayers = allPlayersCache;
        document.getElementById("finalPlayersTitle").innerHTML = "🏅 BOTH TEAMS 🏅";
    }
    
    var playersHtml = "";
    for (var i = 0; i < winningTeamPlayers.length; i++) {
        playersHtml += '<div class="final-player">' + escapeHtml(winningTeamPlayers[i].name) + '</div>';
    }
    document.getElementById("finalPlayersGrid").innerHTML = playersHtml;
    
    document.getElementById("finalResultPage").style.display = "block";
    document.getElementById("gameSelector").style.display = "none";
    document.getElementById("scorecardPage").style.display = "none";
}

function showScorecardMode() {
    currentHole = 1;
    currentDisplayMode = "play";
    selectedFlight = 1;
    
    document.getElementById("scorecardCourseName").innerHTML = courseCache?.name || "Unknown Course";
    var gameDateRaw = currentGameData?.gameInfo?.date || "";
    document.getElementById("scorecardGameDate").innerHTML = formatDisplayDate(gameDateRaw);
    
    // Build compact header
    var container = document.getElementById("compactHeaderContainer");
    if (container) {
        container.innerHTML = '<div class="compact-header">' +
            '<button class="compact-btn compact-pn-btn" id="compactPnBtn">P</button>' +
            '<button class="compact-btn compact-flight-btn" id="compactFlightBtn">FLIGHT 1</button>' +
            '<div class="compact-nav-group">' +
                '<button class="compact-btn compact-nav-btn" id="compactPrevBtn">◀</button>' +
                '<span class="compact-hole-display" id="compactHoleDisplay">1</span>' +
                '<button class="compact-btn compact-nav-btn" id="compactNextBtn">▶</button>' +
            '</div>' +
        '</div>';
        
        document.getElementById('compactPnBtn').onclick = toggleDisplayMode;
        document.getElementById('compactFlightBtn').onclick = function() {
            selectedFlight = selectedFlight === 1 ? 2 : 1;
            this.innerText = 'FLIGHT ' + selectedFlight;
            renderPlayerCards();
        };
        document.getElementById('compactPrevBtn').onclick = goToPrevHole;
        document.getElementById('compactNextBtn').onclick = goToNextHole;
        document.getElementById('compactHoleDisplay').innerText = currentHole;
    }
    
    renderScorecardPage();
    
    document.getElementById("finalResultPage").style.display = "none";
    document.getElementById("gameSelector").style.display = "none";
    document.getElementById("scorecardPage").style.display = "block";
}

function showHCPMode() {
    if (currentOriginalGameId) {
        window.location.href = "hcp-adjust.html?gameId=" + currentOriginalGameId + "&mode=readonly&returnTo=history";
    } else if (currentGameData && currentGameData.originalGameId) {
        window.location.href = "hcp-adjust.html?gameId=" + currentGameData.originalGameId + "&mode=readonly&returnTo=history";
    } else {
        alert("Unable to load handicap data");
    }
}

// ============================================================
// Game List Loading
// ============================================================

function loadGameList() {
    var container = document.getElementById("gameSelector");
    container.innerHTML = '<div class="loading">Loading completed games...</div>';
    
    db.collection("historyGames")
        .where("status", "==", "completed")
        .orderBy("completedAt", "desc")
        .limit(50)
        .get()
        .then(function(snapshot) {
            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-message">No completed games found.</div>';
                return;
            }
            
            var html = '<div class="game-list">';
            snapshot.forEach(function(doc) {
                var data = doc.data();
                var dateDisplay = data.gameInfo?.date || "Unknown date";
                var courseDisplay = data.gameInfo?.course?.name || "Unknown course";
                var resultDisplay = data.finalResults?.winnerText || "Game complete";
                
                html += '<div class="game-item" data-id="' + doc.id + '">' +
                    '<div class="game-date">📅 ' + dateDisplay + '</div>' +
                    '<div class="game-course">⛳ ' + escapeHtml(courseDisplay) + '</div>' +
                    '<div class="game-result">🏆 ' + escapeHtml(resultDisplay) + '</div>' +
                '</div>';
            });
            html += '</div><div style="text-align:center; font-size:0.7rem; color:#888;">Click a game to view details</div>';
            
            container.innerHTML = html;
            
            document.querySelectorAll('.game-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    loadGame(this.getAttribute('data-id'));
                });
            });
        })
        .catch(function(err) {
            console.error("Error loading games:", err);
            container.innerHTML = '<div class="empty-message">Error loading games: ' + err.message + '</div>';
        });
}

function loadGame(gameId) {
    var container = document.getElementById("gameSelector");
    container.innerHTML = '<div class="loading">Loading game data...</div>';
    
    db.collection("historyGames").doc(gameId).get()
        .then(function(doc) {
            if (!doc.exists) {
                container.innerHTML = '<div class="empty-message">Game not found.</div>';
                return;
            }
            
            var gameData = doc.data();
            currentGameData = gameData;
            currentGameId = gameId;
            currentOriginalGameId = gameData.originalGameId || null;
            allPlayersCache = gameData.players || [];
            courseCache = gameData.gameInfo?.course || {};
            f1DataString = gameData.f1DataString || "";
            f2DataString = gameData.f2DataString || "";
            resultsCache = gameData.results || null;
            
            if (!f1DataString || !f2DataString) {
                console.warn("Missing data strings, trying resultsCache only");
            }
            
            showResultMode();
        })
        .catch(function(err) {
            console.error("Error loading game:", err);
            container.innerHTML = '<div class="empty-message">Error loading game: ' + err.message + '</div>';
        });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var shortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + shortName;
    
    SessionManager.initSession("view-history.html", "index.html", function(session) {
        console.log("Session initialized:", session);
    });
    
    var urlParams = new URLSearchParams(window.location.search);
    var directGameId = urlParams.get('gameId');
    
    if (directGameId) {
        loadGame(directGameId);
    } else {
        loadGameList();
    }
    
    var statusBubble = document.getElementById('statusBubble');
    if (statusBubble) statusBubble.onclick = function() { location.reload(); };
    
    document.getElementById("finalScorecardBtn").addEventListener("click", showScorecardMode);
    document.getElementById("finalHcpBtn").addEventListener("click", showHCPMode);
    document.getElementById("finalBackBtn").addEventListener("click", function() {
        currentGameData = null;
        document.getElementById("finalResultPage").style.display = "none";
        document.getElementById("scorecardPage").style.display = "none";
        document.getElementById("gameSelector").style.display = "block";
        loadGameList();
    });
    document.getElementById("scorecardBackBtn").addEventListener("click", showResultMode);
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

init();
</script>
