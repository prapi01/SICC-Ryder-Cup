<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SICC Ryder Cup - VIEWER</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <script src="js/game-data.js"></script>
    <script src="js/game-ui.js"></script>
    <script src="js/game-scorecard.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/game-loader.js"></script>
    <script src="js/scorecard-viewer.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }
        
        /* All viewer content will be inside this container */
        #viewerContainer {
            width: 100%;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .debug {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        /* Ensure viewer has proper visibility */
        .status-bubble, #viewer-courseName, #viewer-holeHeader, 
        #viewer-trDisplay, #viewer-playerCards, .scorecard-section, 
        #viewer-bottomMenuContainer {
            visibility: visible;
        }
        
        .ticker-container {
            visibility: visible;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="viewerContainer" class="loading">Loading game data...</div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v7.00</div>

<script>
// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.VIEW_GAME_VERSION = "7.00";

// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var gameId = null;
var firestoreUnsubscribe = null;
var viewerInitialized = false;

// Data cache (will be populated from GameLoader)
var currentCache = null;
var allPlayers = [];
var courseName = "";
var coursePar = [];
var courseSi = [];
var startingHole = 1;

// ============================================================
// Helper Functions for ScorecardViewer Callbacks
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getStoredScoreForViewer(player, hole) {
    if (!currentCache) return coursePar[hole - 1] || 4;
    
    var flightDataStr = player.flight === 1 ? currentCache.f1DataString : currentCache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1] || 4;
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1] || 4;
}

function isHoleSavedForViewer(flight, hole) {
    if (!currentCache) return false;
    return currentCache.savedHoles[flight] && currentCache.savedHoles[flight].indexOf(hole) !== -1;
}

function getPlayerTotalScoreForTicker(player) {
    if (!currentCache) return 0;
    
    var flightDataStr = player.flight === 1 ? currentCache.f1DataString : currentCache.f2DataString;
    var totalGross = 0;
    var totalPar = 0;
    
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1] || 4;
        totalPar += par;
        
        var holeData = GameData.parseHoleData(flightDataStr, h);
        if (holeData && holeData.saved) {
            var score = 0;
            var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
            var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            if (player.team === 'A') {
                if (teamA[0] && teamA[0].name === player.name) score = holeData.scores.a1;
                else if (teamA[1] && teamA[1].name === player.name) score = holeData.scores.a2;
                else score = par;
            } else {
                if (teamB[0] && teamB[0].name === player.name) score = holeData.scores.b1;
                else if (teamB[1] && teamB[1].name === player.name) score = holeData.scores.b2;
                else score = par;
            }
            totalGross += score;
        } else {
            totalGross += par;
        }
    }
    return totalGross - totalPar;
}

// ============================================================
// Real-time Firestore Listener
// ============================================================

function onCacheUpdate(cache) {
    console.log("ScorecardViewer: Cache update received");
    
    // Update local data
    currentCache = cache;
    
    if (cache.course) {
        courseName = cache.course.name || "Unknown Course";
        coursePar = cache.course.par || [];
        courseSi = cache.course.si || [];
        startingHole = cache.startingHole || 1;
    }
    
    if (cache.players) {
        allPlayers = cache.players;
    }
    
    // Update viewer with new data
    if (viewerInitialized && window.ScorecardViewer) {
        window.ScorecardViewer.refresh();
    } else if (!viewerInitialized && currentCache && currentCache.players) {
        // Initialize viewer if not already done
        initializeViewer();
    }
    
    // Flash status bubble to indicate sync
    var statusBubble = document.querySelector('.status-bubble');
    if (statusBubble) {
        var originalText = statusBubble.innerText;
        statusBubble.innerText = "SYNC";
        statusBubble.style.backgroundColor = "rgba(255,170,68,0.3)";
        statusBubble.style.borderColor = "#ffaa44";
        setTimeout(function() {
            if (statusBubble) {
                statusBubble.innerText = originalText;
                statusBubble.style.backgroundColor = "rgba(76,175,80,0.3)";
                statusBubble.style.borderColor = "#4caf50";
            }
        }, 1000);
    }
}

function setupRealtimeListener() {
    if (!db || !gameId) {
        console.warn("Cannot setup realtime listener - db or gameId missing");
        return;
    }
    
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    console.log("Setting up realtime Firestore listener for game:", gameId);
    
    GameLoader.addDataCallback(onCacheUpdate);
    
    firestoreUnsubscribe = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (!doc.exists) return;
            console.log("Realtime update detected in view-game");
            GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                if (result.success) {
                    console.log("View-game cache refreshed from realtime update");
                }
            });
        }, function(error) {
            console.warn("Firestore realtime listener error:", error);
        });
}

// ============================================================
// Initialize ScorecardViewer
// ============================================================

function initializeViewer() {
    if (!currentCache || !currentCache.players) {
        console.log("Waiting for cache data before initializing viewer");
        return;
    }
    
    console.log("Initializing ScorecardViewer with current data");
    
    // Ensure we have the latest data
    if (currentCache.course) {
        courseName = currentCache.course.name || "Unknown Course";
        coursePar = currentCache.course.par || [];
        courseSi = currentCache.course.si || [];
        startingHole = currentCache.startingHole || 1;
    }
    
    if (currentCache.players) {
        allPlayers = currentCache.players;
    }
    
    var success = ScorecardViewer.init({
        containerId: "viewerContainer",
        
        // Data objects
        players: allPlayers,
        coursePar: coursePar,
        courseSi: courseSi,
        startingHole: startingHole,
        courseName: courseName,
        results: currentCache.results || null,
        
        // Callbacks
        getStoredScore: getStoredScoreForViewer,
        isHoleSaved: isHoleSavedForViewer,
        
        // Ticker configuration
        enableTicker: true,
        getPlayerTotalScore: getPlayerTotalScoreForTicker,
        
        // Display configuration
        statusText: "LIVE",
        statusColor: "#4caf50",
        defaultFlight: 1,
        defaultHole: null,  // Auto-detect first unsaved hole
        defaultDisplayMode: "play",
        isHistoryMode: false,
        
        // Exit callback
        onExit: function() {
            exitToMainMenu();
        }
    });
    
    if (success) {
        viewerInitialized = true;
        console.log("ScorecardViewer initialized successfully");
        
        // Hide loading state
        var container = document.getElementById("viewerContainer");
        if (container) {
            container.classList.remove("loading");
        }
    } else {
        console.error("Failed to initialize ScorecardViewer");
        document.getElementById("viewerContainer").innerHTML = '<div class="loading">Error loading viewer. Please refresh.</div>';
    }
}

// ============================================================
// Navigation and Cleanup
// ============================================================

function exitToMainMenu() {
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    if (window.ScorecardViewer) {
        window.ScorecardViewer.destroy();
    }
    
    GameLoader.unload();
    sessionStorage.removeItem("currentGameId");
    window.location.href = "index.html";
}

// ============================================================
// Get Preloaded Data (from index.html)
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyPreloadedData(preloadData) {
    console.log("Applying preloaded data for instant render");
    
    // Build a mock cache from preloaded data
    var mockCache = {
        course: preloadData.course,
        players: preloadData.players,
        startingHole: preloadData.startingHole || 1,
        teamGameFormat: preloadData.teamGameFormat || "tournament",
        f1DataString: preloadData.f1DataString || "",
        f2DataString: preloadData.f2DataString || "",
        results: preloadData.results || null,
        savedHoles: preloadData.savedHoles || { 1: [], 2: [] },
        t1Row: preloadData.t1Row || new Array(18).fill('_'),
        t2Row: preloadData.t2Row || new Array(18).fill('_'),
        strkRow: preloadData.strkRow || new Array(18).fill('0'),
        lastSyncedHole: preloadData.lastSyncedHole || 0,
        clinchedAt: preloadData.clinchedAt || {}
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(mockCache);
    }
    
    currentCache = mockCache;
    return true;
}

// ============================================================
// Initialize
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "👁️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : sessionStorage.getItem('currentGameId');
    if (!gameId) {
        document.getElementById("viewerContainer").innerHTML = '<div class="loading">Error: No game ID found</div>';
        return;
    }
    
    // Check for preloaded data
    var preloadData = getPreloadedRawGameData();
    var gameDataPreloaded = sessionStorage.getItem("gameDataPreloaded") === "true";
    
    if (preloadData && gameDataPreloaded) {
        applyPreloadedData(preloadData);
        sessionStorage.removeItem("gameDataPreloaded");
        
        // Initialize viewer immediately with preloaded data
        initializeViewer();
        
        // Still load from Firestore to get latest
        GameLoader.loadGame(gameId, "scheduledGames", function(result) {
            if (result.success) {
                console.log("Live data loaded, refreshing viewer");
                onCacheUpdate(result.cache);
            }
        });
        
        // Setup real-time listener for updates
        setupRealtimeListener();
    } else {
        // No preloaded data, load from Firestore
        GameLoader.loadGame(gameId, "scheduledGames", function(result) {
            if (!result.success) {
                document.getElementById("viewerContainer").innerHTML = '<div class="loading">Error: ' + (result.error || "Failed to load game") + '</div>';
                return;
            }
            
            onCacheUpdate(result.cache);
            setupRealtimeListener();
        });
    }
}

// Start the app
init();
</script>

</body>
</html>
