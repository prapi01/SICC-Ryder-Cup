<!DOCTYPE html>
<html lang="en">
<head>

    <title>View Game - SICC Ryder Cup</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <script src="js/game-scorecard.js"></script>
    <script src="js/game-ui.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

        .container {
            max-width: 500px;

            visibility: hidden;
        }

        .data-ready #courseName,
        .data-ready #holeHeader,
        .data-ready #trDisplay,
        .data-ready #playerCards,
        .data-ready .scorecard-section,
        .data-ready #bottomMenuContainer {
            visibility: visible;
        }
        
        .ticker-container {
            visibility: visible;
            margin-top: 30px;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .status-bubble {
            background: rgba(76,175,80,0.3);
            border: 1px solid #4caf50;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #4caf50;
            margin-bottom: 12px;
            cursor: pointer;
        }
        
        .team-score-card {
            background: #111;
            border-radius: 16px;
            text-align: center;
        }
        
        .player-card {
            background: #111;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #333;
            position: relative;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-name { font-size: 1rem; font-weight: 600; }
        .player-handicap { background: #1a3a1a; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-left: 8px; }
        
        .scorecard-section { margin: 20px 0; }
        .scorecard-wrapper { overflow-x: auto; }
        
        /* Flight Toggle Button */
        .flight-toggle {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
        }
        .flight-toggle-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            border: 2px solid;
            transition: all 0.2s ease;
            background: #1a3a1a;
        }
        .flight-toggle-btn.active {
            border-color: #ffaa44;
            color: #ffaa44;
        }
        .flight-toggle-btn:not(.active) {
            border-color: #4caf50;
            color: #4caf50;
            opacity: 0.6;
        }
        
        .debug { text-align: center; font-size: 0.6rem; color: #555; margin-top: 20px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        
        .footer { text-align: center; margin-top: 16px; font-size: 0.55rem; color: #444; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="status-bubble" id="statusBubble">LIVE</div>
    
    <div style="text-align:center; margin-bottom:8px;" id="courseName"></div>
    
    <div id="holeHeader"></div>
    
    <div class="flight-toggle" id="flightToggleContainer">
        <button class="flight-toggle-btn active" id="flight1Btn">FLIGHT 1</button>
        <button class="flight-toggle-btn" id="flight2Btn">FLIGHT 2</button>
    </div>
    
    <div id="trDisplay" class="team-score-card"></div>
    <div id="playerCards" class="player-cards"></div>
    
    <div class="scorecard-section">
        <div class="scorecard-wrapper" id="scorecardWrapper"></div>
    </div>
    
    <div id="bottomMenuContainer"></div>
    
    <div class="debug" id="debug"></div>
    <div class="footer">SICC Ryder Cup - Spectator View</div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v6.00</div>

<script>
// ============================================================
// Version Exposure
// ============================================================
window.VIEW_GAME_VERSION = "6.00";

// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var currentFlight = 1;  // 1 or 2
var currentHole = 1;

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var gameData = null;
var results = null;

var firestoreUnsubscribe = null;
var isDataReady = false;

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder(startingHole) {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber, startingHole) {
    var playOrder = getPlayOrder(startingHole);
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

// Get stored score from results (since View has no direct data string access)
function getStoredScore(player, hole) {
    // For View, scores are not needed for display - the scorecard uses t1Row/t2Row/strkRow
    // But player cards need current hole score
    // We can get from flight1Data/flight2Data if available in cache, or return par
    var cache = GameLoader.getLocalCache();
    if (cache && cache.flight1Data && cache.flight2Data) {
        var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
        var holeData = GameData ? GameData.parseHoleData(flightDataStr, hole) : null;
        if (holeData && holeData.saved) {
            var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
            var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            if (player.team === 'A') {
                if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
                if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
            } else {
                if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
                if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
            }
        }
    }
    return coursePar[hole - 1] || 4;
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles && cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

// Get current score for player card display
function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

// Get match value from results (pre-calculated)
function getMatchValueFromResults(player, opponent, holeNumber) {
    if (!results) return 0;
    
    var startingHole = gameData?.startingHole || 1;
    var position = getHolePosition(holeNumber, startingHole);
    
    // Same flight - use intra-flight results
    if (player.flight === opponent.flight) {
        var intraMatches = (player.flight === 1) ? results.f1IntraMatches : results.f2IntraMatches;
        if (intraMatches && intraMatches[position]) {
            var matchKey = player.name + "_vs_" + opponent.name;
            return intraMatches[position][matchKey] || 0;
        }
        return 0;
    }
    
    // Different flight - use cross-flight results
    if (results.matchResults && results.matchResults[position]) {
        var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        var aIdx = -1, bIdx = -1;
        if (player.team === "A") {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === player.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === opponent.name) bIdx = i;
            }
        } else {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === opponent.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === player.name) bIdx = i;
            }
        }
        
        if (aIdx !== -1 && bIdx !== -1) {
            var storedValue = results.matchResults[position][aIdx * teamBPlayers.length + bIdx] || 0;
            // Negate if player is from Team B (stored values are from Team A perspective)
            return (player.team === "B") ? -storedValue : storedValue;
        }
    }
    return 0;
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var clinchedAt = results?.clinchedAt || {};
    
    var matchKey1 = player.name + "_vs_" + opponent.name;
    var matchKey2 = opponent.name + "_vs_" + player.name;
    var clinchHole = clinchedAt[matchKey1] || clinchedAt[matchKey2];
    
    // Same flight - need hole saved status
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
    } else {
        // Cross-flight - need both flights saved for this hole
        var computedUpToHole = results?.computedUpToHole || 0;
        if (computedUpToHole < currentHole) return 'bubble-grey';
    }
    
    if (clinchHole && currentHole > clinchHole) return 'bubble-grey';
    if (clinchHole && currentHole === clinchHole) {
        if (matchValue > 0) return 'bubble-gold';
        if (matchValue < 0) return 'bubble-loss-clinch';
        return 'bubble-green';
    }
    
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

// ============================================================
// Render Functions
// ============================================================

function renderAll() {
    if (!results || !allPlayers.length) return;
    
    var startingHole = gameData?.startingHole || 1;
    var currentPar = coursePar[currentHole - 1] || 4;
    var currentSi = courseSi[currentHole - 1] || 1;
    
    // Get TR from results
    var position = getHolePosition(currentHole, startingHole);
    var trTeamA = results.tr?.teamA?.[position] ?? 9.5;
    var trTeamB = results.tr?.teamB?.[position] ?? 9.5;
    var trAGreen = results.tr?.teamAGreen?.[position] ?? true;
    var trBGreen = results.tr?.teamBGreen?.[position] ?? true;
    
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    GameUI.updateTR("trDisplay", trTeamA, trTeamB, trAGreen, trBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(currentFlight);
    GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClass, getBubbleValue, getCurrentScore, false, null);
    
    // Get display data from results
    var t1Display = results.game2?.displayT1 || null;
    var t2Display = results.game2?.displayT2 || null;
    var strkDisplay = results.game3?.displayStrk || null;
    var t1Row = t1Display || new Array(18).fill('_');
    var t2Row = t2Display || new Array(18).fill('_');
    var strkRow = strkDisplay || new Array(18).fill('0');
    
    var t1ClinchedHole = results.game2?.flight1?.clinchedHole || null;
    var t2ClinchedHole = results.game2?.flight2?.clinchedHole || null;
    
    var holes = [];
    var displayMode = GameUI.getDisplayMode();
    if (displayMode === "natural") {
        for (var i = 1; i <= 18; i++) holes.push(i);
    } else {
        for (var i = startingHole; i <= 18; i++) holes.push(i);
        for (var i = 1; i < startingHole; i++) holes.push(i);
    }
    
    // Use GameScorecard for table rendering
    if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
        GameScorecard.renderScorecard(
            "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
            t1Row, t2Row, strkRow, coursePar, courseSi,
            t1ClinchedHole, t2ClinchedHole,
            t1Display, t2Display, strkDisplay
        );
    }
    
    updateFlightToggleUI();
}

function updateFlightToggleUI() {
    var flight1Btn = document.getElementById('flight1Btn');
    var flight2Btn = document.getElementById('flight2Btn');
    if (flight1Btn && flight2Btn) {
        if (currentFlight === 1) {
            flight1Btn.classList.add('active');
            flight2Btn.classList.remove('active');
        } else {
            flight1Btn.classList.remove('active');
            flight2Btn.classList.add('active');
        }
    }
}

function setFlight(flight) {
    if (flight === currentFlight) return;
    currentFlight = flight;
    renderAll();
}

// ============================================================
// Navigation (Hole Selection)
// ============================================================

function nextHole() {
    if (currentHole < 18) {
        currentHole++;
        renderAll();
    }
}

function prevHole() {
    if (currentHole > 1) {
        currentHole--;
        renderAll();
    }
}

// ============================================================
// Real-time Listener
// ============================================================

function setupRealtimeListener() {
    if (!db || !gameId) return;
    
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    console.log("Setting up realtime listener for view-game:", gameId);
    
    firestoreUnsubscribe = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (!doc.exists) return;
            
            var data = doc.data();
            gameData = data;
            courseName = data.course?.name || "Unknown Course";
            coursePar = data.course?.par || [];
            courseSi = data.course?.si || [];
            allPlayers = data.players || [];
            results = data.results || null;
            
            document.getElementById("courseName").innerHTML = courseName;
            document.getElementById("mainContainer").classList.add("data-ready");
            
            // Update status bubble to show sync
            var statusBubble = document.getElementById("statusBubble");
            if (statusBubble) {
                statusBubble.innerText = "LIVE";
                statusBubble.style.backgroundColor = "rgba(76,175,80,0.3)";
                statusBubble.style.borderColor = "#4caf50";
            }
            
            renderAll();
            isDataReady = true;
        }, function(error) {
            console.warn("Realtime listener error:", error);
        });
}

// ============================================================
// Exit to Main Menu
// ============================================================

function exitToMainMenu() {
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    window.location.href = "index.html";
}

// ============================================================
// Initialize
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "👁️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) { 
        SessionManager.initSession("view-game.html", "index.html", resolve); 
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : sessionStorage.getItem('currentGameId');
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    // Initial load
    var doc = await db.collection("scheduledGames").doc(gameId).get();
    if (doc.exists) {
        var data = doc.data();
        gameData = data;
        courseName = data.course?.name || "Unknown Course";
        coursePar = data.course?.par || [];
        courseSi = data.course?.si || [];
        allPlayers = data.players || [];
        results = data.results || null;
        
        document.getElementById("courseName").innerHTML = courseName;
        document.getElementById("mainContainer").classList.add("data-ready");
        
        // Find the first hole that has any data (or default to 1)
        var computedUpToHole = results?.computedUpToHole || 0;
        currentHole = computedUpToHole > 0 ? computedUpToHole : 1;
        
        // Setup UI components
        GameUI.applyTightLayout();
        GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
        
        // Setup custom navigation (no save button)
        var navContainer = document.createElement('div');
        navContainer.style.display = 'flex';
        navContainer.style.justifyContent = 'center';
        navContainer.style.gap = '16px';
        navContainer.style.margin = '16px 0';
        navContainer.innerHTML = `
            <button id="viewPrevBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: 52px; height: 52px; border-radius: 30px; font-size: 1.3rem; cursor: pointer;">◀</button>
            <span id="viewHoleDisplay" style="font-size: 1.2rem; font-weight: 700; color: #4caf50; min-width: 60px; text-align: center;">HOLE ${currentHole}</span>
            <button id="viewNextBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: 52px; height: 52px; border-radius: 30px; font-size: 1.3rem; cursor: pointer;">▶</button>
        `;
        var holeHeader = document.getElementById('holeHeader');
        if (holeHeader) {
            holeHeader.insertAdjacentElement('afterend', navContainer);
        }
        
        document.getElementById('viewPrevBtn').onclick = prevHole;
        document.getElementById('viewNextBtn').onclick = nextHole;
        
        // Flight toggle buttons
        document.getElementById('flight1Btn').onclick = function() { setFlight(1); };
        document.getElementById('flight2Btn').onclick = function() { setFlight(2); };
        
        renderAll();
        
        // Setup real-time listener
        setupRealtimeListener();
    } else {
        document.getElementById("debug").innerHTML = "Error: Game not found";
    }
}

init();
</script>

</body>
</html>
