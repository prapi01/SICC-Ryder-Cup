<div class="version-tag">v1.03 VIEWER</div>

<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var gameMode = null;
var startingHole = 1;
var currentHole = 1;
var selectedFlight = 1;

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var flight1Data = {};
var flight2Data = {};
var savedHoles = { 1: [], 2: [] };

var t1Row = Array(18).fill('_');
var t2Row = Array(18).fill('_');
var strkRow = Array(18).fill('_');
var trTeamA = 9.5;
var trTeamB = 9.5;
var trTeamAGreen = true;
var trTeamBGreen = true;
var lastSyncedHole = 0;

var crossMatchResults = {};

var myDeviceShortName = "";
var unsubscribe = null;
var f1DataString = "";
var f2DataString = "";

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    return GameUI.getDisplayHoles(startingHole, GameUI.getDisplayMode());
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function parseFlightData(dataString) {
    var result = {};
    for (var pos = 0; pos < 18; pos++) {
        var actualHole;
        if (startingHole === 1) {
            actualHole = pos + 1;
        } else {
            var playOrder = getPlayOrder();
            actualHole = playOrder[pos];
        }
        
        var startIdx = pos * 9;
        var segment = dataString.substring(startIdx, startIdx + 9);
        if (segment.length === 9) {
            result[actualHole] = {
                saved: segment[0] === 'T',
                a1: parseInt(segment.substring(1, 3), 10),
                a2: parseInt(segment.substring(3, 5), 10),
                b1: parseInt(segment.substring(5, 7), 10),
                b2: parseInt(segment.substring(7, 9), 10)
            };
        }
    }
    return result;
}

function updateSavedHolesList() {
    savedHoles[1] = [];
    savedHoles[2] = [];
    for (var h = 1; h <= 18; h++) {
        if (flight1Data[h] && flight1Data[h].saved) savedHoles[1].push(h);
        if (flight2Data[h] && flight2Data[h].saved) savedHoles[2].push(h);
    }
}

function calculateLastSyncedHole() {
    var playOrder = getPlayOrder();
    var lastSynced = 0;
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        var f1Saved = flight1Data[hole] && flight1Data[hole].saved;
        var f2Saved = flight2Data[hole] && flight2Data[hole].saved;
        if (f1Saved && f2Saved) {
            lastSynced = hole;
        } else {
            break;
        }
    }
    return lastSynced;
}

// ============================================================
// Callback Functions for GameUI
// ============================================================

function getStoredScore(player, hole) {
    var flightData = player.flight === 1 ? flight1Data : flight2Data;
    var holeData = flightData[hole];
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    return savedHoles[flight] && savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    return allPlayers.filter(function(op) {
        return op.team !== player.team;
    });
}

function getBubbleClass(player, opponent) {
    var key = player.name + "_vs_" + opponent.name;
    var match = crossMatchResults[key];
    if (!match) return 'bubble-grey';
    if (!match.isSynced) return 'bubble-grey';
    if (match.value > 0) return 'bubble-green';
    if (match.value < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var key = player.name + "_vs_" + opponent.name;
    var match = crossMatchResults[key];
    if (!match) return 'AS';
    var absValue = Math.abs(match.value);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

// ============================================================
// Cross-Flight Calculations
// ============================================================

function getStrokeHoles(handicapDiff) {
    if (handicapDiff <= 0) return [];
    var holesWithSi = [];
    for (var i = 0; i < 18; i++) {
        holesWithSi.push({ hole: i + 1, si: courseSi[i] });
    }
    holesWithSi.sort(function(a, b) { return a.si - b.si; });
    var strokeHoles = [];
    for (var i = 0; i < handicapDiff && i < 18; i++) {
        strokeHoles.push(holesWithSi[i].hole);
    }
    return strokeHoles;
}

function getStrokesForHole(holeNumber, handicapDiff, strokeHolesCache) {
    if (handicapDiff <= 0) return 0;
    var strokeHoles = strokeHolesCache || getStrokeHoles(handicapDiff);
    for (var i = 0; i < strokeHoles.length; i++) {
        if (strokeHoles[i] === holeNumber) return 1;
    }
    return 0;
}

function calculateCrossMatchResult(playerA, playerB, upToHole) {
    var handicapDiff = Math.abs(playerA.handicap - playerB.handicap);
    var isPlayerAReceiving = (playerA.handicap > playerB.handicap);
    var strokeHoles = getStrokeHoles(handicapDiff);
    
    var f1Players = allPlayers.filter(function(p) { return p.flight === 1; });
    var f1TeamA = f1Players.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var f1TeamB = f1Players.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var f2Players = allPlayers.filter(function(p) { return p.flight === 2; });
    var f2TeamA = f2Players.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var f2TeamB = f2Players.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var playerAWon = 0;
    var playerBWon = 0;
    
    for (var hole = 1; hole <= upToHole; hole++) {
        var f1Hole = flight1Data[hole];
        var f2Hole = flight2Data[hole];
        if (!f1Hole || !f1Hole.saved || !f2Hole || !f2Hole.saved) continue;
        
        var playerAScore = null;
        var playerBScore = null;
        
        if (playerA.team === 'A') {
            if (f1TeamA[0] && f1TeamA[0].name === playerA.name) playerAScore = f1Hole.a1;
            else if (f1TeamA[1] && f1TeamA[1].name === playerA.name) playerAScore = f1Hole.a2;
        } else {
            if (f1TeamB[0] && f1TeamB[0].name === playerA.name) playerAScore = f1Hole.b1;
            else if (f1TeamB[1] && f1TeamB[1].name === playerA.name) playerAScore = f1Hole.b2;
        }
        
        if (playerB.team === 'A') {
            if (f2TeamA[0] && f2TeamA[0].name === playerB.name) playerBScore = f2Hole.a1;
            else if (f2TeamA[1] && f2TeamA[1].name === playerB.name) playerBScore = f2Hole.a2;
        } else {
            if (f2TeamB[0] && f2TeamB[0].name === playerB.name) playerBScore = f2Hole.b1;
            else if (f2TeamB[1] && f2TeamB[1].name === playerB.name) playerBScore = f2Hole.b2;
        }
        
        if (playerAScore === null || playerBScore === null) continue;
        
        var netA = playerAScore;
        var netB = playerBScore;
        if (isPlayerAReceiving) {
            netA = playerAScore - getStrokesForHole(hole, handicapDiff, strokeHoles);
        } else {
            netB = playerBScore - getStrokesForHole(hole, handicapDiff, strokeHoles);
        }
        
        if (netA < netB) playerAWon++;
        else if (netB < netA) playerBWon++;
    }
    
    return playerAWon - playerBWon;
}

function updateCrossMatchResults() {
    lastSyncedHole = calculateLastSyncedHole();
    
    var f1Players = allPlayers.filter(function(p) { return p.flight === 1; });
    var f2Players = allPlayers.filter(function(p) { return p.flight === 2; });
    
    var newResults = {};
    for (var i = 0; i < f1Players.length; i++) {
        for (var j = 0; j < f2Players.length; j++) {
            var p1 = f1Players[i];
            var p2 = f2Players[j];
            var key1 = p1.name + "_vs_" + p2.name;
            var key2 = p2.name + "_vs_" + p1.name;
            
            var result = 0;
            var isSynced = false;
            
            if (lastSyncedHole > 0) {
                result = calculateCrossMatchResult(p1, p2, lastSyncedHole);
                isSynced = (lastSyncedHole >= currentHole);
            }
            
            newResults[key1] = { value: result, isSynced: isSynced };
            newResults[key2] = { value: -result, isSynced: isSynced };
        }
    }
    crossMatchResults = newResults;
}

// ============================================================
// TR Calculation (Simplified - to be enhanced)
// ============================================================

function calculateTR() {
    trTeamA = 9.5;
    trTeamB = 9.5;
    trTeamAGreen = true;
    trTeamBGreen = true;
}

// ============================================================
// Full Render
// ============================================================

function renderAll() {
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    GameUI.updateHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    
    GameUI.updateFlightTab("flightTab", selectedFlight, false);
    
    GameUI.updateTR("trDisplay", trTeamA, trTeamB, trTeamAGreen, trTeamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(selectedFlight);
    
    GameUI.renderPlayerCards(
        "playerCards",
        currentPlayers,
        getAllOpponents,
        getBubbleClass,
        getBubbleValue,
        getCurrentScore,
        false,
        null
    );
    
    var holes = getDisplayHoles();
    GameUI.renderScorecard(
        "scorecardWrapper",
        holes,
        allPlayers,
        getStoredScore,
        isHoleSaved,
        t1Row,
        t2Row,
        strkRow,
        coursePar,
        courseSi
    );
}

// ============================================================
// Refresh from Firebase
// ============================================================

function refreshFromFirebase(data) {
    f1DataString = data.f1 && data.f1.d ? data.f1.d : f1DataString;
    f2DataString = data.f2 && data.f2.d ? data.f2.d : f2DataString;
    
    var newF1 = parseFlightData(f1DataString);
    var newF2 = parseFlightData(f2DataString);
    
    var changed = false;
    
    if (JSON.stringify(newF1) !== JSON.stringify(flight1Data)) {
        flight1Data = newF1;
        changed = true;
    }
    if (JSON.stringify(newF2) !== JSON.stringify(flight2Data)) {
        flight2Data = newF2;
        changed = true;
    }
    
    if (changed) {
        updateSavedHolesList();
        updateCrossMatchResults();
        calculateTR();
        renderAll();
    }
}

// ============================================================
// Display Mode (using GameUI)
// ============================================================

function setDisplayMode(mode) {
    GameUI.setDisplayMode(mode, function() {
        renderAll();
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    gameMode = session.activeGame ? session.activeGame.gameMode : "preview";
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    var collection = (gameMode === "preview" || session.activeGame.collection === "previewSandboxes") 
                     ? "previewSandboxes" : "scheduledGames";
    
    var gameRef = db.collection(collection).doc(gameId);
    var doc = await gameRef.get();
    if (!doc.exists) {
        document.getElementById("debug").innerHTML = "Error: Game not found";
        return;
    }
    
    var data = doc.data();
    courseName = data.course ? data.course.name : "Unknown Course";
    document.getElementById("courseName").innerHTML = courseName;
    coursePar = data.course ? data.course.par : [];
    courseSi = data.course ? data.course.si : [];
    allPlayers = data.players || [];
    startingHole = data.startingHole || 1;
    f1DataString = data.f1 && data.f1.d ? data.f1.d : "";
    f2DataString = data.f2 && data.f2.d ? data.f2.d : "";
    
    // Get the starting hole in play order
    var playOrder = getPlayOrder();
    currentHole = playOrder[0];
    
    flight1Data = parseFlightData(f1DataString);
    flight2Data = parseFlightData(f2DataString);
    updateSavedHolesList();
    updateCrossMatchResults();
    calculateTR();
    
    // Initialize display mode buttons via GameUI
    GameUI.updateToggleButtons(GameUI.getDisplayMode());
    
    renderAll();
    
    // Set up toggle button handlers
    document.getElementById("playOrderBtn").addEventListener("click", function() {
        setDisplayMode("play");
    });
    
    document.getElementById("naturalOrderBtn").addEventListener("click", function() {
        setDisplayMode("natural");
    });
    
    unsubscribe = gameRef.onSnapshot(function(snapshot) {
        if (snapshot.exists) {
            refreshFromFirebase(snapshot.data());
        }
    }, function(error) {
        document.getElementById("debug").innerHTML = "Sync error: " + error.message;
    });
}

// ============================================================
// Event Listeners
// ============================================================

document.getElementById("menuBtn").addEventListener("click", function() {
    window.location.href = "index.html";
});

document.getElementById("flight1Btn").addEventListener("click", function() {
    selectedFlight = 1;
    document.getElementById("flight1Btn").classList.add("active");
    document.getElementById("flight2Btn").classList.remove("active");
    renderAll();
});

document.getElementById("flight2Btn").addEventListener("click", function() {
    selectedFlight = 2;
    document.getElementById("flight2Btn").classList.add("active");
    document.getElementById("flight1Btn").classList.remove("active");
    renderAll();
});

init();
</script>

</body>
