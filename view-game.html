KEY CHANGES:
   - FIXED: Removed variable redeclaration conflicts (currentGameData already exists globally)
   - FIXED: Changed all GameUI references to gameUI (lowercase) to match game-ui.js v4.50 export
   - FIXED: Added loading overlay with spinner to hide artifacts until render complete
   - FIXED: UI elements fade in only after all data loaded
   - CHANGED: Use window.* variables to avoid redeclaration errors
   - ALL other functionality identical to v4.50
DEPENDS ON: game-ui.js (v4.50), game-loader.js, ticker.js, hcp-adjust.js, session.js
STATUS: Ready for integration
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a3d2f">
    <title>SICC Ryder Cup - VIEW GAME</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Hide loading artifacts until ready - fade-in animation */
        .viewer-content,
        .compact-header,
        .bubbles-container,
        .scorecard-container,
        .player-cards-container,
        .tr-container {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .viewer-content.ready,
        .compact-header.ready,
        .bubbles-container.ready,
        .scorecard-container.ready,
        .player-cards-container.ready,
        .tr-container.ready {
            opacity: 1;
        }
        
        /* Loading overlay styling */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #4caf50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 1rem;
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .loading-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay - hides artifacts until ready -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">Loading game data...</div>
        </div>
    </div>

    <div class="app-container" style="display: none;">
        <!-- Flight Toggle Buttons -->
        <div class="flight-toggle">
            <button id="flight1Btn" class="flight-btn active">Flight 1</button>
            <button id="flight2Btn" class="flight-btn">Flight 2</button>
        </div>
        
        <!-- Content Container -->
        <div id="viewerContent" class="viewer-content">
            <!-- Dynamic content will be inserted here -->
        </div>
        
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button id="backToPreGameBtn" class="nav-btn secondary">← Back</button>
            <button id="refreshBtn" class="nav-btn secondary">⟳ Refresh</button>
        </div>
    </div>

    <!-- Ticker -->
    <div id="tickerContainer" style="display: none;"></div>

    <script src="js/session.js"></script>
    <script src="js/game-loader.js"></script>
    <script src="js/game-ui.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/hcp-adjust.js"></script>

    <script>
        // v4.51 - No variable redeclaration conflicts
        // Use existing globals from game-loader.js (currentGameData already defined)
        
        // Only declare if not already defined globally
        if (typeof window.viewCurrentFlight === 'undefined') window.viewCurrentFlight = 1;
        if (typeof window.viewUnsubscribeListener === 'undefined') window.viewUnsubscribeListener = null;
        if (typeof window.viewGameId === 'undefined') window.viewGameId = null;
        
        // Reference to existing global currentGameData (from game-loader.js)
        // Do NOT redeclare - use as is
        
        // Get game ID from URL or cache
        function getGameId() {
            const urlParams = new URLSearchParams(window.location.search);
            let gameId = urlParams.get('id');
            
            if (!gameId) {
                // Try to get from sessionStorage
                const cached = sessionStorage.getItem('cachedGameData');
                if (cached && cached !== '{}') {
                    try {
                        const game = JSON.parse(cached);
                        gameId = game.id;
                    } catch(e) {}
                }
            }
            
            if (!gameId) {
                // Try pendingGameId from game-loader.js
                if (typeof pendingGameId !== 'undefined' && pendingGameId) {
                    gameId = pendingGameId;
                }
            }
            
            return gameId;
        }
        
        // Show all UI elements after loading is complete
        function showUI() {
            // Add 'ready' class to all UI containers for fade-in
            const containers = [
                '.compact-header',
                '.bubbles-container', 
                '.scorecard-container',
                '.player-cards-container',
                '.tr-container'
            ];
            
            containers.forEach(selector => {
                const elements = document.querySelectorAll(selector);
                elements.forEach(el => el.classList.add('ready'));
            });
            
            // Hide and remove loading overlay
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.add('hide');
                setTimeout(() => {
                    if (overlay.parentNode) overlay.remove();
                }, 300);
            }
            
            // Show app container
            const appContainer = document.querySelector('.app-container');
            if (appContainer) {
                appContainer.style.display = 'block';
            }
        }
        
        // Render all UI components - uses gameUI (lowercase)
        function renderUI() {
            // Use existing currentGameData from game-loader.js
            if (!currentGameData) return;
            
            const container = document.getElementById('viewerContent');
            if (!container) return;
            
            const currentHole = window.viewCurrentFlight === 1 ? (currentGameData.currentHoleF1 || 1) : (currentGameData.currentHoleF2 || 1);
            
            // Build HTML using gameUI functions
            let html = '';
            
            // Compact Header
            html += '<div class="compact-header">';
            html += gameUI.renderCompactHeader(currentGameData, currentHole, false);
            html += '</div>';
            
            // Bubbles container - pass clinchedAt data
            html += '<div class="bubbles-container">';
            html += gameUI.renderBubbles(currentGameData, currentHole, currentGameData.results?.clinchedAt);
            html += '</div>';
            
            // TR container
            html += '<div class="tr-container">';
            html += gameUI.updateTR(currentGameData, currentHole);
            html += '</div>';
            
            // Scorecard
            html += '<div class="scorecard-container">';
            html += gameUI.renderScorecard(currentGameData, window.viewCurrentFlight, null, currentHole);
            html += '</div>';
            
            // Player cards
            html += '<div class="player-cards-container">';
            html += gameUI.renderPlayerCards(currentGameData, window.viewCurrentFlight, null, currentHole);
            html += '</div>';
            
            container.innerHTML = html;
            
            // Fade in UI after render
            showUI();
        }
        
        // Refresh all UI
        function refreshUI() {
            if (!currentGameData) return;
            renderUI();
            
            // Update ticker if available
            if (typeof updateTicker === 'function') {
                updateTicker(currentGameData);
            }
        }
        
        // Initialize with game data
        async function init() {
            console.log('Initializing view-game v4.51');
            
            // Show loading overlay
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.remove('hide');
            }
            
            // Hide app container initially
            const appContainer = document.querySelector('.app-container');
            if (appContainer) {
                appContainer.style.display = 'none';
            }
            
            const gameId = getGameId();
            if (!gameId) {
                console.error('No game ID found');
                alert('No game selected. Redirecting to home...');
                window.location.href = 'index.html';
                return;
            }
            
            window.viewGameId = gameId;
            
            // Try to get cached data first (currentGameData may already have it)
            if (!currentGameData || currentGameData.id !== gameId) {
                const cachedData = sessionStorage.getItem('cachedGameData');
                if (cachedData && cachedData !== '{}') {
                    try {
                        const game = JSON.parse(cachedData);
                        if (game && game.id === gameId) {
                            console.log('Using cached game data');
                            // Update global currentGameData (from game-loader.js)
                            if (typeof setGameData === 'function') {
                                setGameData(game);
                            } else {
                                window.currentGameData = game;
                            }
                            renderUI();
                        }
                    } catch(e) {
                        console.warn('Failed to parse cached data:', e);
                    }
                }
            } else {
                // currentGameData already has the right game
                renderUI();
            }
            
            // Set up Firestore listener for real-time updates
            if (typeof loadGame === 'function' && window.viewGameId) {
                try {
                    if (window.viewUnsubscribeListener && typeof window.viewUnsubscribeListener === 'function') {
                        window.viewUnsubscribeListener();
                    }
                    window.viewUnsubscribeListener = loadGame(window.viewGameId, (updatedGame) => {
                        console.log('Game updated from Firestore');
                        // Update global currentGameData
                        if (typeof setGameData === 'function') {
                            setGameData(updatedGame);
                        } else {
                            window.currentGameData = updatedGame;
                        }
                        renderUI();
                    });
                } catch(e) {
                    console.error('Failed to attach Firestore listener:', e);
                }
            } else if (!currentGameData) {
                console.error('No game data and loadGame function not available');
                alert('Failed to load game data. Redirecting...');
                window.location.href = 'index.html';
            }
        }
        
        // Flight toggle
        function setupFlightToggle() {
            const flight1Btn = document.getElementById('flight1Btn');
            const flight2Btn = document.getElementById('flight2Btn');
            
            if (flight1Btn) {
                flight1Btn.addEventListener('click', () => {
                    window.viewCurrentFlight = 1;
                    flight1Btn.classList.add('active');
                    flight2Btn.classList.remove('active');
                    renderUI();
                });
            }
            
            if (flight2Btn) {
                flight2Btn.addEventListener('click', () => {
                    window.viewCurrentFlight = 2;
                    flight2Btn.classList.add('active');
                    flight1Btn.classList.remove('active');
                    renderUI();
                });
            }
        }
        
        // Navigation
        function setupNavigation() {
            const backBtn = document.getElementById('backToPreGameBtn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    window.location.href = 'pre-game.html';
                });
            }
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', () => {
                    refreshUI();
                });
            }
        }
        
        // Clean up listener on page unload
        window.addEventListener('beforeunload', () => {
            if (window.viewUnsubscribeListener && typeof window.viewUnsubscribeListener === 'function') {
                window.viewUnsubscribeListener();
            }
        });
        
        // Start the app
        init();
        setupFlightToggle();
        setupNavigation();
    </script>
</body>
</html>
