    <div style="text-align:center; margin-bottom:8px;" id="courseName"></div>

        <button class="flight-toggle-btn active" id="flight1Btn">FLIGHT 1</button>
        <button class="flight-toggle-btn" id="flight2Btn">FLIGHT 2</button>

    <div id="trDisplay" class="team-score-card"></div>
    <div id="playerCards" class="player-cards"></div>

<script>
// ============================================================
// Version Exposure
// ============================================================
window.VIEW_GAME_VERSION = "6.01";

// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var currentFlight = 1;
var currentHole = 1;

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];
var startingHole = 1;

var firestoreUnsubscribe = null;
var gameData = null;

// ============================================================
// Helper Functions (mirror real-game for compatibility)
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    var mode = GameUI.getDisplayMode();
    if (mode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

// Get stored score from GameLoader cache (same as real-game)
function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

// Get match value from results (pre-calculated by real-game)
function getMatchValueFromResults(player, opponent, holeNumber) {
    var cache = GameLoader.getLocalCache();
    var results = cache.results;
    if (!results) return 0;
    
    var position = getHolePosition(holeNumber);
    
    // Same flight - use intra-flight results
    if (player.flight === opponent.flight) {
        var intraMatches = (player.flight === 1) ? results.f1IntraMatches : results.f2IntraMatches;
        if (intraMatches && intraMatches[position]) {
            var matchKey = player.name + "_vs_" + opponent.name;
            return intraMatches[position][matchKey] || 0;
        }
        return 0;
    }
    
    // Different flight - use cross-flight results
    if (results.matchResults && results.matchResults[position]) {
        var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        var aIdx = -1, bIdx = -1;
        if (player.team === "A") {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === player.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === opponent.name) bIdx = i;
            }
        } else {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === opponent.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === player.name) bIdx = i;
            }
        }
        
        if (aIdx !== -1 && bIdx !== -1) {
            var storedValue = results.matchResults[position][aIdx * teamBPlayers.length + bIdx] || 0;
            return (player.team === "B") ? -storedValue : storedValue;
        }
    }
    return 0;
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValueFromResults(player, opponent, currentHole);
    var cache = GameLoader.getLocalCache();
    var lastSyncedHole = cache.lastSyncedHole;
    var clinchedAt = cache.results?.clinchedAt || {};
    
    var matchKey1 = player.name + "_vs_" + opponent.name;
    var matchKey2 = opponent.name + "_vs_" + player.name;
    var clinchHole = clinchedAt[matchKey1] || clinchedAt[matchKey2];
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
    } else {
        var isSynced = (lastSyncedHole >= currentHole);
        if (!isSynced) return 'bubble-grey';
    }
    
    if (clinchHole && currentHole > clinchHole) return 'bubble-grey';
    if (clinchHole && currentHole === clinchHole) {
        if (matchValue > 0) return 'bubble-gold';
        if (matchValue < 0) return 'bubble-loss-clinch';
        return 'bubble-green';
    }
    
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

// ============================================================
// Render Functions
// ============================================================

function updateTRDisplay() {
    var cache = GameLoader.getLocalCache();
    var position = getHolePosition(currentHole);
    var tr = cache.results?.tr || {};
    var teamA = tr.teamA?.[position] !== undefined ? tr.teamA[position] : 9.5;
    var teamB = tr.teamB?.[position] !== undefined ? tr.teamB[position] : 9.5;
    var teamAGreen = tr.teamAGreen?.[position] !== undefined ? tr.teamAGreen[position] : true;
    var teamBGreen = tr.teamBGreen?.[position] !== undefined ? tr.teamBGreen[position] : true;
    GameUI.updateTR("trDisplay", teamA, teamB, teamAGreen, teamBGreen);
}

function renderAll() {
    var cache = GameLoader.getLocalCache();
    if (!cache || !cache.players) return;
    
    var currentPar = coursePar[currentHole - 1] || 4;
    var currentSi = courseSi[currentHole - 1] || 1;
    
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    updateTRDisplay();
    
    var currentPlayers = getFlightOrderedPlayers(currentFlight);
    GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClass, getBubbleValue, getCurrentScore, false, null);
    
    var holes = getDisplayHoles();
    var t1ClinchedHole = cache.results?.game2?.flight1?.clinchedHole || null;
    var t2ClinchedHole = cache.results?.game2?.flight2?.clinchedHole || null;
    var t1Display = cache.results?.game2?.displayT1 || null;
    var t2Display = cache.results?.game2?.displayT2 || null;
    var strkDisplay = cache.results?.game3?.displayStrk || null;
    
    if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
        GameScorecard.renderScorecard(
            "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
            cache.t1Row, cache.t2Row, cache.strkRow, coursePar, courseSi,
            t1ClinchedHole, t2ClinchedHole,
            t1Display, t2Display, strkDisplay
        );
    }
    
    updateFlightToggleUI();
    updateHoleDisplay();
}

function updateFlightToggleUI() {
    var flight1Btn = document.getElementById('flight1Btn');
    var flight2Btn = document.getElementById('flight2Btn');
    if (flight1Btn && flight2Btn) {
        if (currentFlight === 1) {
            flight1Btn.classList.add('active');
            flight2Btn.classList.remove('active');
        } else {
            flight1Btn.classList.remove('active');
            flight2Btn.classList.add('active');
        }
    }
}

function updateHoleDisplay() {
    var holeDisplay = document.getElementById('viewHoleDisplay');
    if (holeDisplay) {
        holeDisplay.innerText = currentHole;
    }
}

function setFlight(flight) {
    if (flight === currentFlight) return;
    currentFlight = flight;
    renderAll();
}

function nextHole() {
    if (currentHole < 18) {
        currentHole++;
        renderAll();
    }
}

function prevHole() {
    if (currentHole > 1) {
        currentHole--;
        renderAll();
    }
}

// ============================================================
// Navigation and Menu
// ============================================================

function exitToMainMenu() {
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    GameLoader.unload();
    window.location.href = "index.html";
}

// ============================================================
// Real-time Listener and Cache Update
// ============================================================

function onCacheUpdate(cache) {
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        startingHole = cache.startingHole || 1;
        document.getElementById("courseName").innerHTML = courseName;
    }
    if (cache.players) {
        allPlayers = cache.players;
    }
    renderAll();
}

function setupRealtimeListener() {
    if (!db || !gameId) return;
    
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    console.log("Setting up realtime listener for view-game:", gameId);
    
    // Add callback to GameLoader
    GameLoader.addDataCallback(onCacheUpdate);
    
    // Initial load
    GameLoader.loadGame(gameId, "scheduledGames", function(result) {
        if (result.success) {
            console.log("View-game initial load successful");
            document.getElementById("mainContainer").classList.add("data-ready");
            
            var cache = result.cache;
            if (cache.course) {
                courseName = cache.course.name;
                coursePar = cache.course.par;
                courseSi = cache.course.si;
                startingHole = cache.startingHole || 1;
                document.getElementById("courseName").innerHTML = courseName;
            }
            if (cache.players) {
                allPlayers = cache.players;
            }
            
            // Find last synced hole
            var lastSynced = cache.lastSyncedHole || 1;
            currentHole = lastSynced;
            
            renderAll();
            
            // Setup navigation UI
            setupNavigationUI();
            
            // Setup flight toggle
            document.getElementById('flight1Btn').onclick = function() { setFlight(1); };
            document.getElementById('flight2Btn').onclick = function() { setFlight(2); };
            
            // Setup bottom menu
            GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
        } else {
            document.getElementById("debug").innerHTML = "Error: " + result.error;
        }
    });
    
    // Firestore listener for real-time updates
    firestoreUnsubscribe = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (!doc.exists) return;
            console.log("Realtime update detected in view-game");
            // Reload the game to refresh cache
            GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                if (result.success) {
                    console.log("View-game cache refreshed from realtime update");
                    var cache = result.cache;
                    if (cache.course) {
                        courseName = cache.course.name;
                        coursePar = cache.course.par;
                        courseSi = cache.course.si;
                        startingHole = cache.startingHole || 1;
                        document.getElementById("courseName").innerHTML = courseName;
                    }
                    if (cache.players) {
                        allPlayers = cache.players;
                    }
                    var lastSynced = cache.lastSyncedHole || 1;
                    currentHole = lastSynced;
                    renderAll();
                    updateHoleDisplay();
                    
                    // Flash status bubble
                    var statusBubble = document.getElementById("statusBubble");
                    if (statusBubble) {
                        var originalText = statusBubble.innerText;
                        statusBubble.innerText = "SYNC";
                        statusBubble.style.backgroundColor = "rgba(255,170,68,0.3)";
                        statusBubble.style.borderColor = "#ffaa44";
                        setTimeout(function() {
                            if (statusBubble) {
                                statusBubble.innerText = originalText;
                                statusBubble.style.backgroundColor = "rgba(76,175,80,0.3)";
                                statusBubble.style.borderColor = "#4caf50";
                            }
                        }, 1000);
                    }
                }
            });
        }, function(error) {
            console.warn("Realtime listener error:", error);
        });
}

function setupNavigationUI() {
    // Create navigation container if not exists
    if (document.getElementById('viewNavContainer')) return;
    
    var navContainer = document.createElement('div');
    navContainer.id = 'viewNavContainer';
    navContainer.className = 'nav-container';
    navContainer.innerHTML = `
        <button id="viewPrevBtn" class="nav-btn">◀</button>
        <span id="viewHoleDisplay" class="nav-hole-display">${currentHole}</span>
        <button id="viewNextBtn" class="nav-btn">▶</button>
    `;
    
    var holeHeader = document.getElementById('holeHeader');
    if (holeHeader && holeHeader.parentNode) {
        holeHeader.parentNode.insertBefore(navContainer, holeHeader.nextSibling);
    }
    
    document.getElementById('viewPrevBtn').onclick = prevHole;
    document.getElementById('viewNextBtn').onclick = nextHole;
    
    updateHoleDisplay();
}

// ============================================================
// Initialize
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "👁️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) { 
        SessionManager.initSession("view-game.html", "index.html", resolve); 
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : sessionStorage.getItem('currentGameId');
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    GameUI.applyTightLayout();
    setupRealtimeListener();
}

init();
</script>

</body>
</html>
