<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var displayFlight = 1;
var currentHole = 1;
var startingHole = 1;
var teamGameFormat = "tournament";

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var isGameCompleteFlag = false;
var celebrationTriggered = false;

var saveInProgress = false;
var unsubscribe = null;

// ============================================================
// Preloaded Data Support
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyPreloadedData(preloadData) {
    console.log("Applying preloaded data for instant render");
    
    // Extract data from preloadData.rawData
    var rawData = preloadData.rawData;
    
    courseName = rawData?.course?.name || "Unknown Course";
    coursePar = rawData?.course?.par || [];
    courseSi = rawData?.course?.si || [];
    allPlayers = rawData?.players || [];
    startingHole = rawData?.startingHole || 1;
    teamGameFormat = rawData?.teamGameFormat || "tournament";
    
    // v4.11 FIX: Include 'players' in mockCache
    var mockCache = {
        course: rawData?.course,
        players: rawData?.players,           // ← CRITICAL FIX
        startingHole: rawData?.startingHole || 1,
        teamGameFormat: rawData?.teamGameFormat || "tournament",
        f1DataString: rawData?.f1?.d || "",
        f2DataString: rawData?.f2?.d || "",
        results: rawData?.results || null,
        savedHoles: { 1: [], 2: [] },
        t1Row: new Array(18).fill('_'),
        t2Row: new Array(18).fill('_'),
        strkRow: new Array(18).fill('0'),
        lastSyncedHole: 0,
        clinchedAt: {},
        signatures: { f1: false, f2: false },
        submitted: { f1: false, f2: false },
        locks: { f1: null, f2: null },
        gameStarted: true
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(mockCache);
        console.log("GameLoader cache set with players:", mockCache.players?.length);
    }
    
    document.getElementById("courseName").innerHTML = courseName;
    
    // Reveal content after data is applied
    document.getElementById("mainContainer").classList.add("data-ready");
    
    return true;
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getDisplayHoles() {
    var mode = GameUI.getDisplayMode();
    if (mode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function getFirstUnsavedHole(flight) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        if (!isHoleSaved(flight, hole)) return hole;
    }
    return 18;
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

function getMatchValueFromStoredResults(player, opponent, holeNumber) {
    var cache = GameLoader.getLocalCache();
    var results = cache.results;
    if (!results) return 0;
    
    return GameData.getMatchValueFromResults(results, player, opponent, holeNumber, allPlayers, getHolePosition);
}

// ============================================================
// BUBBLE FUNCTIONS - WITHOUT "vs " PREFIX
// ============================================================

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getBubbleClassWithClinch(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var cache = GameLoader.getLocalCache();
    var lastSyncedHole = cache.lastSyncedHole;
    var clinchedAt = cache.clinchedAt || {};
    var matchKey = player.name + "_vs_" + opponent.name;
    var clinchHole = clinchedAt[matchKey];
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
    } else {
        var isSynced = (lastSyncedHole >= currentHole);
        if (!isSynced) return 'bubble-grey';
    }
    
    if (clinchHole && currentHole > clinchHole) return 'bubble-grey';
    if (clinchHole && currentHole === clinchHole) {
        if (matchValue > 0) return 'bubble-gold';
        if (matchValue < 0) return 'bubble-loss-clinch';
        return 'bubble-green';
    }
    
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function updateTRDisplay() {
    var tr = GameLoader.getTRForHole(currentHole);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
}

// ============================================================
// Ticker Functions
// ============================================================

function calculatePlayerScoreRelativeToPar(player) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var totalGross = 0;
    var totalPar = 0;
    
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1];
        totalPar += par;
        
        var holeData = GameData.parseHoleData(flightDataStr, h);
        if (holeData && holeData.saved) {
            var score = 0;
            var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
            var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            if (player.team === 'A') {
                if (teamA[0] && teamA[0].name === player.name) score = holeData.scores.a1;
                else if (teamA[1] && teamA[1].name === player.name) score = holeData.scores.a2;
            } else {
                if (teamB[0] && teamB[0].name === player.name) score = holeData.scores.b1;
                else if (teamB[1] && teamB[1].name === player.name) score = holeData.scores.b2;
            }
            totalGross += score;
        } else {
            totalGross += par;
        }
    }
    
    return totalGross - totalPar;
}

function getPlayerScoreForTicker(player) {
    return calculatePlayerScoreRelativeToPar(player);
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Render Functions
// ============================================================

function renderHoleHeader() {
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
}

function renderPlayerCards() {
    var currentPlayers = getFlightOrderedPlayers(displayFlight);
    
    // VIEW mode: canEdit = false (no edit buttons)
    GameUI.renderPlayerCards(
        "playerCards",
        currentPlayers,
        getAllOpponents,
        getBubbleClassWithClinch,
        getBubbleValue,
        getStoredScore,
        false,  // canEdit = false - NO edit buttons
        null    // no onScoreChange callback
    );
}

function renderScorecard() {
    var holes = getDisplayHoles();
    var cache = GameLoader.getLocalCache();
    window.savedHoles = cache.savedHoles;
    
    var t1Row = cache.results ? (cache.results.game2?.flight1?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var t2Row = cache.results ? (cache.results.game2?.flight2?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var strkRow = cache.results ? (cache.results.game3?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    
    GameUI.renderScorecard("scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved, t1Row, t2Row, strkRow, coursePar, courseSi);
}

function renderAll() {
    var cache = GameLoader.getLocalCache();
    if (!cache.f1DataString || !cache.f2DataString) return;
    
    renderHoleHeader();
    updateTRDisplay();
    renderPlayerCards();
    renderScorecard();
    updateNavButtons();
    if (typeof Ticker !== 'undefined') Ticker.refresh();
}

// ============================================================
// Navigation
// ============================================================

function updateNavButtons() {
    var playOrder = getPlayOrder();
    var isCurrentSaved = isHoleSaved(displayFlight, currentHole);
    
    GameUI.updateNavigationButtons(
        currentHole,
        playOrder,
        isCurrentSaved,
        isGameCompleteFlag,
        celebrationTriggered,
        showSignCardModal
    );
}

function goToPrevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        GameUI.updateCompactHoleDisplay(currentHole);
        renderAll();
    }
}

function goToNextHole() {
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        GameUI.updateCompactHoleDisplay(currentHole);
        renderAll();
    }
}

function toggleDisplayMode() {
    var newMode = GameUI.getDisplayMode() === 'play' ? 'natural' : 'play';
    GameUI.setDisplayMode(newMode, null);
    renderAll();
}

function toggleFlight() {
    displayFlight = displayFlight === 1 ? 2 : 1;
    GameUI.updateCompactActionButton("flight", displayFlight, currentHole);
    GameUI.updateFlightBadge(displayFlight);
    renderAll();
}

function exitToMainMenu() {
    if (unsubscribe) unsubscribe();
    window.location.href = "index.html";
}

// ============================================================
// Game Completion Flow
// ============================================================

function showSignCardModal() {
    if (typeof GameUI.ensureNoStuckModals === 'function') GameUI.ensureNoStuckModals();
    
    var modalHtml = `
        <div class="modal-overlay" id="signModalView" style="z-index: 10001; display: flex !important;">
            <div class="sign-modal-container">
                <div class="sign-modal-title">✍️ VIEW ONLY</div>
                <div class="sign-modal-message">Waiting for both flights to sign their cards.</div>
                <div class="sign-modal-buttons">
                    <button class="sign-btn-back" id="signBackBtnView">← BACK</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById('signBackBtnView')?.addEventListener('click', function() {
        document.getElementById('signModalView')?.remove();
    });
}

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    var tr = GameLoader.getTRForHole(currentHole);
    var winner = tr.teamA > tr.teamB ? "A" : (tr.teamB > tr.teamA ? "B" : "Tie");
    var winningPlayers = {
        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
    };
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() {
        if (typeof HandicapAdjustment !== 'undefined') {
            HandicapAdjustment.initForViewer(gameId, allPlayers,
                GameLoader.getLocalCache().f1DataString,
                GameLoader.getLocalCache().f2DataString,
                courseSi, coursePar, startingHole, null);
        }
    });
}

function enableCelebrationMode() {
    var nextBtn = document.getElementById('compactNextBtn');
    if (nextBtn && !celebrationTriggered && isGameCompleteFlag) {
        nextBtn.innerHTML = '🏆';
        nextBtn.style.background = '#ffaa44';
        nextBtn.style.color = '#1a3a1a';
        nextBtn.style.border = '1px solid #ffaa44';
        nextBtn.disabled = false;
        var newBtn = nextBtn.cloneNode(true);
        nextBtn.parentNode.replaceChild(newBtn, nextBtn);
        newBtn.onclick = showCelebrationAndHandicap;
    }
}

// ============================================================
// Build UI Components
// ============================================================

function buildCompactHeader() {
    GameUI.renderCompactHeader(
        "compactHeaderContainer",
        displayFlight,
        currentHole,
        goToPrevHole,
        goToNextHole,
        toggleFlight,
        toggleDisplayMode,
        "flight",
        null
    );
}

function buildBottomMenu() {
    GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
}

// ============================================================
// Firestore Listener
// ============================================================

function startGameListener() {
    if (unsubscribe) unsubscribe();
    unsubscribe = db.collection("scheduledGames").doc(gameId).onSnapshot(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            courseName = data.course?.name || "Unknown Course";
            coursePar = data.course?.par || [];
            courseSi = data.course?.si || [];
            allPlayers = data.players || [];
            startingHole = data.startingHole || 1;
            
            document.getElementById("courseName").innerHTML = courseName;
            
            var signatures = data.signatures || {};
            var bothSigned = signatures.f1?.signed === true && signatures.f2?.signed === true;
            if (bothSigned && !isGameCompleteFlag && !celebrationTriggered) {
                isGameCompleteFlag = true;
                enableCelebrationMode();
            }
            
            if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                Ticker.setPlayers(allPlayers);
                Ticker.refresh();
            }
            
            renderAll();
        }
    }, function(error) {
        document.getElementById("debug").innerHTML = "Sync error: " + error.message;
    });
}

// ============================================================
// Data Callback from GameLoader
// ============================================================

function onCacheUpdate(cache) {
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        document.getElementById("courseName").innerHTML = courseName;
    }
    allPlayers = cache.players;
    startingHole = cache.startingHole;
    
    if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
        Ticker.setPlayers(allPlayers);
        Ticker.refresh();
    }
    
    renderAll();
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    if (!gameId) gameId = sessionStorage.getItem('currentGameId');
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    var bubble = document.getElementById('statusBubble');
    if (bubble) bubble.onclick = function() { location.reload(); };
    
    var preloadData = getPreloadedRawGameData();
    var gameDataPreloaded = sessionStorage.getItem("gameDataPreloaded") === "true";
    
    if (preloadData && gameDataPreloaded) {
        console.log("Using preloaded data for instant render");
        applyPreloadedData(preloadData);
        
        sessionStorage.removeItem("gameDataPreloaded");
        
        GameUI.applyTightLayout();
        
        buildCompactHeader();
        buildBottomMenu();
        
        // Calculate first unsaved hole after cache is loaded
        var cache = GameLoader.getLocalCache();
        window.savedHoles = cache.savedHoles || { 1: [], 2: [] };
        var firstUnsaved = getFirstUnsavedHole(displayFlight);
        if (firstUnsaved && firstUnsaved !== currentHole) {
            currentHole = firstUnsaved;
            console.log("Setting currentHole to first unsaved hole:", currentHole);
        }
        GameUI.updateCompactHoleDisplay(currentHole);
        
        initTicker();
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
        
        renderAll();
        
        // Attach Firestore listener for real-time updates
        GameLoader.addDataCallback(onCacheUpdate);
        startGameListener();
        
    } else {
        console.log("No cached data available - redirecting to index.html");
        alert("Game data not loaded. Returning to main menu.");
        window.location.href = "index.html";
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

init();
</script>
