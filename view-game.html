<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var startingHole = 1;
var currentHole = 1;
var selectedFlight = 1;

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var flight1Data = {};
var flight2Data = {};
var savedHoles = { 1: [], 2: [] };

var t1Row = Array(18).fill('_');
var t2Row = Array(18).fill('_');
var strkRow = Array(18).fill('0');
var trTeamA = 9.5;
var trTeamB = 9.5;
var trTeamAGreen = true;
var trTeamBGreen = true;
var lastSyncedHole = 0;

var matchResults = {
    intraF1: {},
    intraF2: {},
    cross: {}
};

var gameResults = null;
var maxAllowedPosition = 0;
var isGameComplete = false;
var archiveId = null;

var myDeviceShortName = "";
var unsubscribe = null;
var f1DataString = "";
var f2DataString = "";

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getHoleAtPosition(position) {
    var playOrder = getPlayOrder();
    return playOrder[position];
}

function getDisplayHoles() {
    return GameUI.getDisplayHoles(startingHole, GameUI.getDisplayMode());
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function updateSavedHolesList() {
    savedHoles[1] = [];
    savedHoles[2] = [];
    for (var h = 1; h <= 18; h++) {
        if (flight1Data[h] && flight1Data[h].saved) savedHoles[1].push(h);
        if (flight2Data[h] && flight2Data[h].saved) savedHoles[2].push(h);
    }
}

function calculateLastSyncedHole() {
    var playOrder = getPlayOrder();
    var lastSynced = 0;
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        var f1Saved = flight1Data[hole] && flight1Data[hole].saved;
        var f2Saved = flight2Data[hole] && flight2Data[hole].saved;
        if (f1Saved && f2Saved) {
            lastSynced = hole;
        } else {
            break;
        }
    }
    return lastSynced;
}

// ============================================================
// Match Results using GameMatch (for bubbles only)
// ============================================================

function updateMatchResults() {
    lastSyncedHole = calculateLastSyncedHole();
    
    var flight1Players = allPlayers.filter(function(p) { return p.flight === 1; });
    var flight2Players = allPlayers.filter(function(p) { return p.flight === 2; });
    
    var flight1MaxHole = savedHoles[1].length > 0 ? Math.max.apply(null, savedHoles[1]) : 0;
    var flight2MaxHole = savedHoles[2].length > 0 ? Math.max.apply(null, savedHoles[2]) : 0;
    
    if (flight1MaxHole > 0) {
        matchResults.intraF1 = GameMatch.calculateIntraFlight(1, flight1Players, f1DataString, courseSi, startingHole, flight1MaxHole, coursePar);
    } else {
        matchResults.intraF1 = {};
    }
    
    if (flight2MaxHole > 0) {
        matchResults.intraF2 = GameMatch.calculateIntraFlight(2, flight2Players, f2DataString, courseSi, startingHole, flight2MaxHole, coursePar);
    } else {
        matchResults.intraF2 = {};
    }
    
    if (lastSyncedHole > 0) {
        matchResults.cross = GameMatch.calculateCrossFlight(f1DataString, f2DataString, allPlayers, courseSi, startingHole, lastSyncedHole, coursePar);
    } else {
        matchResults.cross = {};
    }
}

// ============================================================
// TR and Row Display from Results
// ============================================================

function updateDisplayFromResults() {
    if (!gameResults) return;
    
    var position = getHolePosition(currentHole);
    var computedUpTo = gameResults.computedUpToHole || 0;
    
    if (position >= computedUpTo) {
        trTeamA = 9.5;
        trTeamB = 9.5;
        trTeamAGreen = true;
        trTeamBGreen = true;
    } else {
        if (gameResults.tr) {
            trTeamA = gameResults.tr.teamA[position] !== undefined ? gameResults.tr.teamA[position] : 9.5;
            trTeamB = gameResults.tr.teamB[position] !== undefined ? gameResults.tr.teamB[position] : 9.5;
            trTeamAGreen = gameResults.tr.teamAGreen[position] !== undefined ? gameResults.tr.teamAGreen[position] : true;
            trTeamBGreen = gameResults.tr.teamBGreen[position] !== undefined ? gameResults.tr.teamBGreen[position] : true;
        }
    }
    
    if (trTeamA === trTeamB) {
        trTeamAGreen = true;
        trTeamBGreen = true;
    }
    
    if (gameResults.game2) {
        var flight1Leader = gameResults.game2.flight1.leader;
        var flight2Leader = gameResults.game2.flight2.leader;
        
        for (var i = 0; i < 18; i++) {
            if (flight1Leader && flight1Leader[i]) t1Row[i] = flight1Leader[i];
            if (flight2Leader && flight2Leader[i]) t2Row[i] = flight2Leader[i];
        }
    }
    
    if (gameResults.game3 && gameResults.game3.leader) {
        for (var i = 0; i < 18; i++) {
            if (gameResults.game3.leader[i]) strkRow[i] = gameResults.game3.leader[i];
        }
    }
    
    for (var i = computedUpTo; i < 18; i++) {
        t1Row[i] = '_';
        t2Row[i] = '_';
        strkRow[i] = '_';
    }
}

function calculateTR() {
    updateDisplayFromResults();
}

// ============================================================
// Callback Functions for GameUI
// ============================================================

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    return savedHoles[flight] && savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValue(player.name, opponent.name);
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = savedHoles[player.flight] && savedHoles[player.flight].indexOf(currentHole) !== -1;
        if (!isHoleSavedForFlight) return 'bubble-grey';
        if (matchValue > 0) return 'bubble-green';
        if (matchValue < 0) return 'bubble-red';
        return 'bubble-green';
    }
    
    var isSynced = (lastSyncedHole >= currentHole);
    if (!isSynced) return 'bubble-grey';
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValue(player.name, opponent.name);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getMatchValue(playerName, opponentName) {
    var intraKey = playerName + "_vs_" + opponentName;
    if (matchResults.intraF1[intraKey] !== undefined) return matchResults.intraF1[intraKey];
    if (matchResults.intraF2[intraKey] !== undefined) return matchResults.intraF2[intraKey];
    if (matchResults.cross[intraKey] !== undefined) return matchResults.cross[intraKey];
    return 0;
}

// ============================================================
// Navigation
// ============================================================

function updateNavButtons() {
    var prevBtn = document.getElementById("prevHoleBtn");
    var nextBtn = document.getElementById("nextHoleBtn");
    if (!prevBtn || !nextBtn) return;
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var maxAllowedHole = getHoleAtPosition(maxAllowedPosition);
    
    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (currentHole >= maxAllowedHole);
}

function updateHoleNumberDisplay() {
    var holeDisplay = document.getElementById("holeNumberDisplay");
    if (holeDisplay) {
        holeDisplay.innerText = currentHole;
    }
}

function goToPrevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        updateHoleNumberDisplay();
        updateDisplayFromResults();
        updateMatchResults();
        calculateTR();
        renderAll();
        updateNavButtons();
    }
}

function goToNextHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var maxAllowedHole = getHoleAtPosition(maxAllowedPosition);
    
    if (currentIndex < 17 && currentHole < maxAllowedHole) {
        currentHole = playOrder[currentIndex + 1];
        updateHoleNumberDisplay();
        updateDisplayFromResults();
        updateMatchResults();
        calculateTR();
        renderAll();
        updateNavButtons();
    }
}

// ============================================================
// Display Mode
// ============================================================

function updatePnButton() {
    var pnBtn = document.getElementById("pnToggleBtn");
    if (pnBtn) {
        var mode = GameUI.getDisplayMode();
        pnBtn.innerText = mode === "play" ? "P" : "N";
    }
}

function toggleDisplayMode() {
    var currentMode = GameUI.getDisplayMode();
    var newMode = currentMode === "play" ? "natural" : "play";
    GameUI.setDisplayMode(newMode, function() {
        updatePnButton();
        renderAll();
    });
}

// ============================================================
// Flight Toggle
// ============================================================

function toggleFlight() {
    if (selectedFlight === 1) {
        selectedFlight = 2;
        document.getElementById("flightToggleBtn").innerText = "✈️ Flight 2";
    } else {
        selectedFlight = 1;
        document.getElementById("flightToggleBtn").innerText = "✈️ Flight 1";
    }
    renderAll();
}

// ============================================================
// View Results (Celebration + HCP)
// ============================================================

function viewResults() {
    if (!isGameComplete) return;
    
    var winner = SignCard.getWinner(trTeamA, trTeamB);
    var winningPlayers = {
        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
    };
    
    // Show celebration screen
    SignCard.showCelebrationScreen(winner, trTeamA, trTeamB, winningPlayers, gameId, function() {
        // After celebration, show HCP Adjust (read-only)
        if (archiveId) {
            var matchPoints = {};
            for (var key in matchResults.cross) {
                if (key.indexOf('_vs_') !== -1) {
                    var parts = key.split('_vs_');
                    var playerA = parts[0];
                    var playerB = parts[1];
                    var value = matchResults.cross[key];
                    if (!matchPoints[playerA]) matchPoints[playerA] = { total: 0 };
                    if (value > 0) matchPoints[playerA].total += 1;
                    else if (value === 0) matchPoints[playerA].total += 0.5;
                    if (!matchPoints[playerB]) matchPoints[playerB] = { total: 0 };
                    if (value < 0) matchPoints[playerB].total += 1;
                    else if (value === 0) matchPoints[playerB].total += 0.5;
                }
            }
            HandicapAdjustment.init(gameId, archiveId, winningPlayers, matchPoints, {}, true);
        }
    });
}

// ============================================================
// Full Render
// ============================================================

function renderAll() {
    GameUI.updateTR("trDisplay", trTeamA, trTeamB, trTeamAGreen, trTeamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(selectedFlight);
    
    GameUI.renderPlayerCards(
        "playerCards",
        currentPlayers,
        getAllOpponents,
        getBubbleClass,
        getBubbleValue,
        getCurrentScore,
        false,
        null
    );
    
    var holes = getDisplayHoles();
    window.savedHoles = savedHoles;
    GameUI.renderScorecard(
        "scorecardWrapper",
        holes,
        allPlayers,
        getStoredScore,
        isHoleSaved,
        t1Row,
        t2Row,
        strkRow,
        coursePar,
        courseSi
    );
    
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    GameUI.updateHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    
    // Show/Hide View Results button
    var viewResultsBtn = document.getElementById("viewResultsBtn");
    if (viewResultsBtn) {
        viewResultsBtn.style.display = isGameComplete ? "block" : "none";
    }
}

// ============================================================
// Refresh from Firestore Snapshot
// ============================================================

function refreshFromFirestore(data) {
    f1DataString = data.f1 && data.f1.d ? data.f1.d : f1DataString;
    f2DataString = data.f2 && data.f2.d ? data.f2.d : f2DataString;
    
    if (data.results) {
        gameResults = data.results;
        maxAllowedPosition = (gameResults.computedUpToHole || 0) - 1;
        if (maxAllowedPosition < 0) maxAllowedPosition = -1;
    }
    
    if (data.signatures) {
        var bothSigned = data.signatures.f1?.signed === true && data.signatures.f2?.signed === true;
        if (bothSigned && !isGameComplete) {
            isGameComplete = true;
            if (typeof HistoryRecord !== 'undefined') {
                HistoryRecord.getArchivedGameByOriginalId(gameId, function(err, result) {
                    if (!err && result && result.id) {
                        archiveId = result.id;
                    }
                });
            }
        }
    }
    
    var newF1 = {};
    var newF2 = {};
    for (var h = 1; h <= 18; h++) {
        var f1Hole = GameData.parseHoleData(f1DataString, h);
        var f2Hole = GameData.parseHoleData(f2DataString, h);
        if (f1Hole) newF1[h] = f1Hole;
        if (f2Hole) newF2[h] = f2Hole;
    }
    
    var changed = false;
    
    if (JSON.stringify(newF1) !== JSON.stringify(flight1Data)) {
        flight1Data = newF1;
        changed = true;
    }
    if (JSON.stringify(newF2) !== JSON.stringify(flight2Data)) {
        flight2Data = newF2;
        changed = true;
    }
    
    if (changed) {
        updateSavedHolesList();
        updateMatchResults();
        updateDisplayFromResults();
        renderAll();
        updateNavButtons();
    } else {
        updateDisplayFromResults();
        renderAll();
        updateNavButtons();
    }
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    if (!gameId) {
        gameId = sessionStorage.getItem('currentGameId');
        console.log('view-game: using fallback gameId from sessionStorage:', gameId);
    }
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    var collection = "scheduledGames";
    if (session.activeGame && session.activeGame.collection === "previewSandboxes") {
        collection = "previewSandboxes";
    }
    
    var doc = await db.collection(collection).doc(gameId).get();
    if (!doc.exists) {
        document.getElementById("debug").innerHTML = "Error: Game not found";
        return;
    }
    
    var data = doc.data();
    courseName = data.course ? data.course.name : "Unknown Course";
    document.getElementById("courseName").innerHTML = courseName;
    coursePar = data.course ? data.course.par : [];
    courseSi = data.course ? data.course.si : [];
    allPlayers = data.players || [];
    startingHole = data.startingHole || 1;
    f1DataString = data.f1 && data.f1.d ? data.f1.d : "";
    f2DataString = data.f2 && data.f2.d ? data.f2.d : "";
    
    if (data.results) {
        gameResults = data.results;
        maxAllowedPosition = (gameResults.computedUpToHole || 0) - 1;
        if (maxAllowedPosition < 0) maxAllowedPosition = -1;
    }
    
    if (data.signatures) {
        var bothSigned = data.signatures.f1?.signed === true && data.signatures.f2?.signed === true;
        if (bothSigned) {
            isGameComplete = true;
            if (typeof HistoryRecord !== 'undefined') {
                HistoryRecord.getArchivedGameByOriginalId(gameId, function(err, result) {
                    if (!err && result && result.id) {
                        archiveId = result.id;
                    }
                });
            }
        }
    }
    
    GameData.setCourse({ par: coursePar });
    GameData.setPlayers(allPlayers);
    
    for (var h = 1; h <= 18; h++) {
        var f1Hole = GameData.parseHoleData(f1DataString, h);
        var f2Hole = GameData.parseHoleData(f2DataString, h);
        if (f1Hole) flight1Data[h] = f1Hole;
        if (f2Hole) flight2Data[h] = f2Hole;
    }
    
    var playOrder = getPlayOrder();
    
    if (maxAllowedPosition >= 0) {
        currentHole = getHoleAtPosition(maxAllowedPosition);
    } else {
        currentHole = playOrder[0];
    }
    
    // FIXED: Update hole number display on initialization
    updateHoleNumberDisplay();
    
    updateSavedHolesList();
    updateMatchResults();
    updateDisplayFromResults();
    
    updatePnButton();
    renderAll();
    updateNavButtons();
    
    document.getElementById("pnToggleBtn").addEventListener("click", toggleDisplayMode);
    document.getElementById("prevHoleBtn").addEventListener("click", goToPrevHole);
    document.getElementById("nextHoleBtn").addEventListener("click", goToNextHole);
    document.getElementById("flightToggleBtn").addEventListener("click", toggleFlight);
    document.getElementById("menuBtn").addEventListener("click", function() {
        window.location.href = "index.html";
    });
    document.getElementById("viewResultsBtn").addEventListener("click", viewResults);
    
    unsubscribe = db.collection(collection).doc(gameId).onSnapshot(function(snapshot) {
        if (snapshot.exists) {
            refreshFromFirestore(snapshot.data());
        }
    }, function(error) {
        document.getElementById("debug").innerHTML = "Sync error: " + error.message;
    });
}

init();
</script>
