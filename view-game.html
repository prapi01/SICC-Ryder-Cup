// ============================================================
// v7.40: Check completion from Firestore status (source of truth)
// ============================================================

function isGameCompletedFromCache(cache) {
    if (!cache) return false;
    // PRIMARY: Firestore status field
    if (cache.status === "completed") return true;
    // SECONDARY: local signatures (fallback for legacy)
    return isGameComplete();
}

// ============================================================
// v7.40: Post-game context detection - uses status first
// ============================================================

function checkPostGameContext(cache) {
    if (!cache) return false;
    
    // PRIMARY: Firestore status field (source of truth)
    if (cache.status === "completed") {
        console.log("[VIEW-GAME] Post-game context: status=completed");
        return true;
    }
    
    // SECONDARY: local signatures (fallback)
    var signatures = cache.signatures || {};
    var f1Signed = signatures.f1 && signatures.f1.signed === true;
    var f2Signed = signatures.f2 && signatures.f2.signed === true;
    var isComplete = f1Signed && f2Signed;
    
    var sessionFlag = sessionStorage.getItem('isPostGame') === 'true';
    var celebrationFlag = celebrationTriggered;
    
    var result = isComplete || sessionFlag || celebrationFlag;
    console.log("[VIEW-GAME] Post-game context check:", result, "(complete=" + isComplete + ", session=" + sessionFlag + ", celebration=" + celebrationFlag + ")");
    return result;
}

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

// ============================================================
// Load from History Record (post-game)
// ============================================================

function loadFromHistoryRecord(historyId) {
    console.log("Loading from history record:", historyId);
    
    db.collection("historyGames").doc(historyId).get()
        .then(function(doc) {
            if (!doc.exists) {
                console.warn("History record not found, falling back to scheduledGames");
                return;
            }
            
            var historyData = doc.data();
            
            courseName = historyData.gameInfo?.course?.name || "Unknown Course";
            coursePar = historyData.gameInfo?.course?.par || [];
            courseSi = historyData.gameInfo?.course?.si || [];
            allPlayers = historyData.players || [];
            startingHole = historyData.gameInfo?.startingHole || 1;
            teamGameFormat = historyData.gameInfo?.teamGameFormat || "tournament";
            
            updateGameOrder();
            
            // v7.40: Use nested signatures structure from history
            var historySignatures = historyData.signatures || null;
            var defaultSignatures = {
                f1: { signed: true, signedAt: null, captainName: null },
                f2: { signed: true, signedAt: null, captainName: null }
            };
            
            // If history has nested structure, use it; otherwise use default
            var signatures = defaultSignatures;
            if (historySignatures) {
                if (historySignatures.f1 && typeof historySignatures.f1 === 'object' && historySignatures.f1.signed !== undefined) {
                    signatures = historySignatures;
                } else if (historySignatures.f1 === true || historySignatures.f1 === false) {
                    // Convert flat to nested
                    signatures = {
                        f1: { signed: historySignatures.f1 === true, signedAt: null, captainName: null },
                        f2: { signed: historySignatures.f2 === true, signedAt: null, captainName: null }
                    };
                }
            }
            
            var historyCache = {
                course: { name: courseName, par: coursePar, si: courseSi },
                players: allPlayers,
                startingHole: startingHole,
                teamGameFormat: teamGameFormat,
                f1DataString: historyData.f1DataString || "",
                f2DataString: historyData.f2DataString || "",
                results: historyData.results || null,
                savedHoles: { 1: [], 2: [] },
                t1Row: historyData.results?.game2?.flight1?.leader || new Array(18).fill('_'),
                t2Row: historyData.results?.game2?.flight2?.leader || new Array(18).fill('_'),
                strkRow: historyData.results?.game3?.leader || new Array(18).fill('0'),
                lastSyncedPosition: 17,
                lastSyncedHole: 18,
                clinchedAt: historyData.results?.clinchedAt || {},
                signatures: signatures,
                submitted: { f1: true, f2: true },
                locks: { f1: null, f2: null },
                gameStarted: true,
                gameComplete: true,
                status: "completed"
            };
            
            for (var h = 1; h <= 18; h++) {
                var f1HoleData = GameData.parseHoleData(historyCache.f1DataString, h);
                var f2HoleData = GameData.parseHoleData(historyCache.f2DataString, h);
                if (f1HoleData && f1HoleData.saved) historyCache.savedHoles[1].push(h);
                if (f2HoleData && f2HoleData.saved) historyCache.savedHoles[2].push(h);
            }
            
            GameLoader.setLocalCache(historyCache);
            
            document.getElementById("courseName").innerHTML = courseName;
            document.getElementById("mainContainer").classList.add("data-ready");
            
            setInitialHole();
            
            gameCompleteFlag = true;
            hasSwitchedToHistory = true;
            
            updateHoleNumberDisplay();
            initTicker();
            if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
            renderAll();
            
            console.log("History record loaded successfully");
        })
        .catch(function(err) {
            console.error("Error loading history record:", err);
        });
}

// ============================================================
// v7.36: Set initial hole - FIXED for completed games
// ============================================================

function setInitialHole() {
    var playOrder = getPlayOrder();
    var startHole = playOrder[0];
    var lastSavedHole = null;
    var foundUnsaved = false;
    
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        var saved1 = isHoleSaved(1, hole);
        var saved2 = isHoleSaved(2, hole);
        
        if (saved1 && saved2) {
            lastSavedHole = hole;  // Track the last saved hole
        } else {
            // First unsaved hole found - this is where play should start
            startHole = hole;
            foundUnsaved = true;
            break;
        }
    }
    
    // If all holes are saved, go to the last one (HOLE 18)
    if (!foundUnsaved && lastSavedHole !== null) {
        startHole = lastSavedHole;
    }
    
    currentHole = startHole;
    console.log("[VIEW-GAME] setInitialHole: currentHole=", currentHole, "allSaved=", !foundUnsaved, "lastSavedHole=", lastSavedHole);
}

// ============================================================
// Ticker Functions - READ ONLY, NO CALCULATION
// ============================================================

function getPlayerTotalScore(player) {
    var cache = GameLoader.getLocalCache();
    if (!cache || !cache.results || !cache.results.playerTotals) {
        return 0;
    }
    
    var playerTotal = cache.results.playerTotals[player.name];
    if (!playerTotal) return 0;
    
    return playerTotal.relativeToPar;
}

function getPlayerScoreForTicker(player) {
    return getPlayerTotalScore(player);
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Helper Functions - v7.23: Delegate to GameOrder
// ============================================================

function getPlayOrder() {
    if (typeof GameOrder !== 'undefined' && GameOrder.getPlayOrder) {
        return GameOrder.getPlayOrder();
    }
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getPlayPositionForHole(holeNumber) {
    if (typeof GameOrder !== 'undefined' && GameOrder.getPlayPosition) {
        return GameOrder.getPlayPosition(holeNumber);
    }
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getHolePosition(holeNumber) {
    if (typeof GameOrder !== 'undefined' && GameOrder.getPlayPosition) {
        return GameOrder.getPlayPosition(holeNumber);
    }
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getNaturalHoleAtPosition(position) {
    if (typeof GameOrder !== 'undefined' && GameOrder.getNaturalHole) {
        return GameOrder.getNaturalHole(position);
    }
    var playOrder = getPlayOrder();
    return playOrder[position] || 0;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function isCurrentHoleSavedByAnyFlight() {
    return isHoleSaved(1, currentHole) || isHoleSaved(2, currentHole);
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

// ============================================================
// Match Value Read - Direct from stored results
// ============================================================

function getMatchValueFromStoredResults(player, opponent, holeNumber) {
    var cache = GameLoader.getLocalCache();
    var results = cache.results;
    if (!results) return 0;
    
    var position = getHolePosition(holeNumber);
    
    if (player.flight === opponent.flight) {
        var intraMatches = (player.flight === 1) ? results.f1IntraMatches : results.f2IntraMatches;
        if (intraMatches && intraMatches[position]) {
            var matchKey = player.name + "_vs_" + opponent.name;
            var value = intraMatches[position][matchKey];
            return (value !== undefined) ? value : 0;
        }
        return 0;
    }
    
    if (results.matchResults && results.matchResults[position]) {
        var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) {
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) {
            if (a.flight !== b.flight) return a.flight - b.flight;
            return a.handicap - b.handicap;
        });
        
        var aIdx = -1;
        var bIdx = -1;
        
        if (player.team === "A") {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === player.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === opponent.name) bIdx = i;
            }
        } else {
            for (var i = 0; i < teamAPlayers.length; i++) {
                if (teamAPlayers[i].name === opponent.name) aIdx = i;
            }
            for (var i = 0; i < teamBPlayers.length; i++) {
                if (teamBPlayers[i].name === player.name) bIdx = i;
            }
        }
        
        if (aIdx !== -1 && bIdx !== -1) {
            var storedValue = results.matchResults[position][aIdx * teamBPlayers.length + bIdx] || 0;
            return (player.team === "B") ? -storedValue : storedValue;
        }
    }
    return 0;
}

// ============================================================
// BUBBLE FUNCTIONS - v7.23: Uses GameOrder for sync
// ============================================================

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getSyncValueForBubble(cache) {
    if (cache.lastSyncedPosition !== undefined && cache.lastSyncedPosition >= 0) {
        return cache.lastSyncedPosition;
    }
    
    if (cache.lastSyncedHole !== undefined && cache.lastSyncedHole > 0) {
        var playPos = getPlayPositionForHole(cache.lastSyncedHole);
        return playPos;
    }
    
    return -1;
}

function getBubbleClassWithClinch(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var cache = GameLoader.getLocalCache();
    var clinchedAt = cache.clinchedAt || {};
    var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
    var lastSyncedValue = getSyncValueForBubble(cache);
    
    return GameMatch.getMatchBubbleClass(
        matchValue, clinchedAt, player, opponent, currentHole,
        isHoleSavedForFlight, lastSyncedValue, GameMatch.getClinchHole,
        startingHole
    );
}

// ============================================================
// v7.43: Game Completion Detection - nested signatures only
// ============================================================

function isGameComplete() {
    var cache = GameLoader.getLocalCache();
    if (!cache) return false;
    
    // PRIMARY: Firestore status field
    if (cache.status === "completed") return true;
    
    // SECONDARY: local signatures (nested structure only)
    if (!cache.signatures) return false;
    var f1Signed = cache.signatures.f1 && cache.signatures.f1.signed === true;
    var f2Signed = cache.signatures.f2 && cache.signatures.f2.signed === true;
    
    return f1Signed && f2Signed;
}

// ============================================================
// Get Last Playable Hole
// ============================================================

function getLastPlayableHole() {
    var playOrder = getPlayOrder();
    var lastHole = 1;
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        if (isHoleSaved(1, hole) && isHoleSaved(2, hole)) {
            lastHole = hole;
        }
    }
    return lastHole;
}

// ============================================================
// v8.10: Real-time Firestore Listener - VIEW read-only photo check
// Removed all flag settings - VIEW only downloads and displays
// ============================================================

function setupRealtimeListener() {
    if (!db || !gameId) {
        console.warn("Cannot setup realtime listener - db or gameId missing");
        return;
    }
    
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    console.log("Setting up realtime Firestore listener for game:", gameId);
    
    firestoreUnsubscribe = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (!doc.exists) return;
            if (hasSwitchedToHistory) return;
            
            var data = doc.data();
            var currentCache = GameLoader.getLocalCache();
            
            // ============================================================
            // v8.10: PHOTO CHECK - Simple URL-based download (NO flags)
            // VIEW is read-only - no flag reads, no flag writes
            // ============================================================
            var imageUrl = data.celebration?.imageUrl || null;
            
            if (imageUrl && imageUrl !== currentPhotoUrl) {
                console.log('[VIEW-GAME] Listener: New photo detected:', imageUrl);
                currentPhotoUrl = imageUrl;
                
                if (typeof window.downloadPhotoToSessionStorage === 'function') {
                    window.downloadPhotoToSessionStorage(imageUrl, function(err) {
                        if (err) {
                            console.warn('[VIEW-GAME] Listener: Download failed:', err.message);
                            return;
                        }
                        console.log('[VIEW-GAME] Listener: Photo downloaded and stored');
                        sessionStorage.setItem('celebrationPhotoUrl', imageUrl);
                        displayPhotoFromSessionStorage();
                    });
                } else {
                    console.warn('[VIEW-GAME] Listener: downloadPhotoToSessionStorage not available');
                }
            }
            
            // Check what changed
            var f1Changed = (currentCache.f1DataString !== data.f1?.d);
            var f2Changed = (currentCache.f2DataString !== data.f2?.d);
            var resultsChanged = (JSON.stringify(currentCache.results) !== JSON.stringify(data.results));
            var signaturesChanged = (JSON.stringify(currentCache.signatures) !== JSON.stringify(data.signatures));
            var statusChanged = (currentCache.status !== data.status);
            
            console.log("[VIEW-GAME] Realtime update - signaturesChanged:", signaturesChanged, "statusChanged:", statusChanged);
            
            // v7.43: ALWAYS process signature changes first
            if (signaturesChanged || statusChanged) {
                console.log("[VIEW-GAME] Signature or status change detected");
                
                // Refresh cache from Firestore
                GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                    if (result.success) {
                        console.log("[VIEW-GAME] Cache refreshed from realtime update");
                        
                        // Update local state from cache
                        var cache = result.cache;
                        if (cache.course) {
                            courseName = cache.course.name;
                            coursePar = cache.course.par;
                            courseSi = cache.course.si;
                        }
                        allPlayers = cache.players || [];
                        startingHole = cache.startingHole || 1;
                        updateGameOrder();
                        
                        if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                            Ticker.setPlayers(allPlayers);
                        }
                        
                        // v7.43: Check if both signatures are now true
                        var f1Signed = cache.signatures?.f1?.signed === true;
                        var f2Signed = cache.signatures?.f2?.signed === true;
                        var bothSigned = f1Signed && f2Signed;
                        
                        console.log("[VIEW-GAME] f1.signed:", f1Signed, "f2.signed:", f2Signed, "bothSigned:", bothSigned);
                        
                        // v7.43: Update gameCompleteFlag based on signatures
                        gameCompleteFlag = bothSigned || (cache.status === "completed");
                        
                        // v8.00: NO AUTO-REDIRECT - User clicks RESULT button manually
                        // Just update state and UI
                        
                        // Update UI
                        isPostGameContext = checkPostGameContext(cache);
                        renderCompactHeader();
                        renderAll();
                    } else {
                        console.warn("Failed to refresh cache from realtime update:", result.error);
                    }
                });
                return;
            }
            
            // Only process other changes if no signature/status change
            if (f1Changed || f2Changed || resultsChanged) {
                console.log("[VIEW-GAME] Data change detected (non-signature)");
                GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                    if (result.success) {
                        console.log("[VIEW-GAME] Cache refreshed from realtime update");
                        if (result.cache.course) {
                            courseName = result.cache.course.name;
                            coursePar = result.cache.course.par;
                            courseSi = result.cache.course.si;
                        }
                        allPlayers = result.cache.players;
                        startingHole = result.cache.startingHole;
                        updateGameOrder();
                        if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                            Ticker.setPlayers(allPlayers);
                        }
                        isPostGameContext = checkPostGameContext(result.cache);
                        renderCompactHeader();
                        renderAll();
                    } else {
                        console.warn("Failed to refresh cache from realtime update:", result.error);
                    }
                });
            }
        }, function(error) {
            console.warn("Firestore realtime listener error:", error);
        });
}

    var displayTeamA = (tr.teamA !== null && tr.teamA !== undefined && tr.teamA !== 0) ? tr.teamA : "-";
    var displayTeamB = (tr.teamB !== null && tr.teamB !== undefined && tr.teamB !== 0) ? tr.teamB : "-";
    GameUI.updateTR("trDisplay", displayTeamA, displayTeamB, tr.teamAGreen, tr.teamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(currentFlight);
    GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClassWithClinch, getBubbleValue, getCurrentScore, false, null);
    updatePlayerNamesToShortform();
    GameUI.updateFlightBadge(currentFlight);
    
    setTimeout(function() {
        var scoreControls = document.querySelectorAll('#playerCards .score-control');
        scoreControls.forEach(function(control) {
            control.style.display = 'none';
        });
    }, 10);
    
    var t1ClinchedHole = cache.results?.game2?.flight1?.clinchedHole;
    var t2ClinchedHole = cache.results?.game2?.flight2?.clinchedHole;
    var t1Display = cache.results?.game2?.displayT1 || null;
    var t2Display = cache.results?.game2?.displayT2 || null;
    var strkDisplay = cache.results?.game3?.displayStrk || null;
    
    var displayT1Row = cache.results?.game2?.displayT1 || cache.t1Row;
    var displayT2Row = cache.results?.game2?.displayT2 || cache.t2Row;
    var displayStrkRow = cache.results?.game3?.displayStrk || cache.strkRow;
    
    var displayMode = GameUI.getDisplayMode();
    
    if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
        GameScorecard.renderScorecard(
            "scorecardWrapper",
            displayMode,
            startingHole,
            allPlayers,
            getStoredScore,
            isHoleSaved,
            displayT1Row,
            displayT2Row,
            displayStrkRow,
            coursePar,
            courseSi,
            t1ClinchedHole,
            t2ClinchedHole,
            t1Display,
            t2Display,
            strkDisplay
        );
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var prevBtn = document.getElementById('compactPrevBtn');
    
    if (prevBtn) {
        prevBtn.disabled = (currentIndex === 0);
    }
    
    if (typeof Ticker !== 'undefined') Ticker.refresh();
    
    renderBottomMenuWithContext();
}

// ============================================================
// v7.27: Render bottom menu with context-aware button
// ============================================================

function renderBottomMenuWithContext() {
    var container = document.getElementById('bottomMenuContainer');
    if (!container) return;
    
    container.innerHTML = '';
    
    var btn = document.createElement('button');
    btn.id = 'menuBtn';
    
    if (isPostGameContext) {
        btn.textContent = '← Back to Main Menu';
        btn.style.borderColor = '#ffaa44';
        btn.style.color = '#ffaa44';
        btn.style.cssText = 'width:100%; padding:14px; border-radius:40px; font-weight:600; cursor:pointer; background:#1a1a1a; border:1px solid #ffaa44; color:#ffaa44; margin-top:20px;';
        btn.onclick = function() {
            console.log("[VIEW-GAME] Post-game context - showing exit modal");
            showPostGameExitModal();
        };
    } else {
        btn.textContent = '← Back to Main Menu';
        btn.style.cssText = 'width:100%; padding:14px; border-radius:40px; font-weight:600; cursor:pointer; background:#1a1a1a; color:#ccc; border:1px solid #333; margin-top:20px;';
        btn.onclick = function() {
            console.log("[VIEW-GAME] LIVE context - showing exit confirmation");
            showLiveExitModal();
        };
    }
    
    container.appendChild(btn);
}

// ============================================================
// v7.43: onCacheUpdate - Fixed signature detection
// ============================================================

function onCacheUpdate(cache) {
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        document.getElementById("courseName").innerHTML = courseName;
    }
    allPlayers = cache.players;
    startingHole = cache.startingHole;
    updateGameOrder();
    if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
        Ticker.setPlayers(allPlayers);
        Ticker.refresh();
    }
    
    var wasComplete = gameCompleteFlag;
    // v7.43: Check both signatures
    var f1Signed = cache.signatures?.f1?.signed === true;
    var f2Signed = cache.signatures?.f2?.signed === true;
    var bothSigned = f1Signed && f2Signed;
    
    gameCompleteFlag = bothSigned || (cache.status === "completed");
    
    isPostGameContext = checkPostGameContext(cache);
    
    console.log("[VIEW-GAME] onCacheUpdate: f1:", f1Signed, "f2:", f2Signed, "bothSigned:", bothSigned, "gameCompleteFlag:", gameCompleteFlag);
    
    // v8.00: NO AUTO-REDIRECT - User clicks RESULT button manually
    // Just update UI
    
    renderCompactHeader();
    renderAll();
}

// ============================================================
// v8.10: Initialization - VIEW read-only photo check
// ============================================================

async function init() {
    // v8.09: Show waiting screen immediately while data loads
    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
        WaitingScreen.show('Loading Game...');
    }
    
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "👁️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    // v7.35: FIXED - Check gameId properly
    var urlParams = new URLSearchParams(window.location.search);
    var urlGameId = urlParams.get('gameId');
    
    console.log("[VIEW-GAME] URL gameId:", urlGameId);
    console.log("[VIEW-GAME] session.activeGame:", session.activeGame);
    console.log("[VIEW-GAME] sessionStorage.currentGameId:", sessionStorage.getItem('currentGameId'));
    
    // v7.35: Check if session.activeGame has a valid gameId
    var sessionGameId = (session.activeGame && session.activeGame.gameId) ? session.activeGame.gameId : null;
    
    // Priority: session.activeGame.gameId → sessionStorage → URL parameter
    gameId = sessionGameId || sessionStorage.getItem('currentGameId') || urlGameId;
    
    console.log("[VIEW-GAME] Final gameId:", gameId);
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        // v8.09: Hide waiting screen on error
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
        }
        return;
    }
    
    // v8.10: VIEW loads photo from sessionStorage if available
    var cachedPhoto = sessionStorage.getItem('celebrationPhoto');
    if (cachedPhoto) {
        console.log('[VIEW-GAME] Photo found in sessionStorage');
        displayPhotoFromSessionStorage();
    } else {
        console.log('[VIEW-GAME] No photo in sessionStorage - will check on navigation');
    }
    
    var collection = "scheduledGames";
    GameLoader.addDataCallback(onCacheUpdate);
    
    var preloadData = getPreloadedRawGameData();
    var gameDataPreloaded = sessionStorage.getItem("gameDataPreloaded") === "true";
    
    if (preloadData && gameDataPreloaded) {
        applyPreloadedData(preloadData);
        sessionStorage.removeItem("gameDataPreloaded");
        GameUI.applyTightLayout();
        renderCompactHeader();
        GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
        setTimeout(function() { GameUI.addFlightBadge(currentFlight); }, 100);
        
        // v7.36: setInitialHole now properly handles completed games
        setInitialHole();
        updateHoleNumberDisplay();
        initTicker();
        if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
        renderAll();
        
        // v8.09: Hide waiting screen after preloaded data is ready
        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
            WaitingScreen.hide();
        }
        
        GameLoader.loadGame(gameId, collection, function(result) {
            if (result.success) {
                var cache = result.cache;
                if (cache.course) {
                    courseName = cache.course.name;
                    coursePar = cache.course.par;
                    courseSi = cache.course.si;
                }
                allPlayers = cache.players;
                startingHole = cache.startingHole;
                updateGameOrder();
                if (cache.results && cache.results.playerTotals) {
                    Ticker.refresh();
                }
                gameCompleteFlag = isGameComplete();
                isPostGameContext = checkPostGameContext(cache);
                
                // v8.09: If game is completed and celebrationData doesn't exist, create it
                if (gameCompleteFlag) {
                    var celebrationDataStr = sessionStorage.getItem('celebrationData');
                    if (!celebrationDataStr) {
                        console.log('[VIEW-GAME] Game completed - creating celebrationData for cold VIEW');
                        var tr = GameLoader.getTRForHole(18);
                        var winner = tr.teamA > tr.teamB ? 'A' : (tr.teamB > tr.teamA ? 'B' : 'Tie');
                        var winningPlayers = {
                            teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
                            teamB: allPlayers.filter(function(p) { return p.team === "B"; })
                        };
                        var celebrationData = {
                            winner: winner,
                            teamAScore: tr.teamA,
                            teamBScore: tr.teamB,
                            winningPlayers: winningPlayers,
                            gameId: gameId
                        };
                        sessionStorage.setItem('celebrationData', JSON.stringify(celebrationData));
                        console.log('[VIEW-GAME] celebrationData created for cold VIEW');
                    }
                }
                
                renderAll();
            }
        });
        setupRealtimeListener();
    } else {
        GameLoader.loadGame(gameId, collection, function(result) {
            if (!result.success) {
                document.getElementById("debug").innerHTML = "Error: " + result.error;
                // v8.09: Hide waiting screen on error
                if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                    WaitingScreen.hide();
                }
                return;
            }
            
            var cache = result.cache;
            courseName = cache.course?.name || "Unknown Course";
            coursePar = cache.course?.par || [];
            courseSi = cache.course?.si || [];
            allPlayers = cache.players || [];
            startingHole = cache.startingHole;
            teamGameFormat = cache.teamGameFormat || "tournament";
            document.getElementById("courseName").innerHTML = courseName;
            updateGameOrder();
            
            GameUI.applyTightLayout();
            renderCompactHeader();
            GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
            setTimeout(function() { GameUI.addFlightBadge(currentFlight); }, 100);
            
            // v7.36: setInitialHole now properly handles completed games
            setInitialHole();
            updateHoleNumberDisplay();
            initTicker();
            if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
            gameCompleteFlag = isGameComplete();
            isPostGameContext = checkPostGameContext(cache);
            
            // v8.09: If game is completed and celebrationData doesn't exist, create it
            if (gameCompleteFlag) {
                var celebrationDataStr = sessionStorage.getItem('celebrationData');
                if (!celebrationDataStr) {
                    console.log('[VIEW-GAME] Game completed - creating celebrationData for cold VIEW');
                    var tr = GameLoader.getTRForHole(18);
                    var winner = tr.teamA > tr.teamB ? 'A' : (tr.teamB > tr.teamA ? 'B' : 'Tie');
                    var winningPlayers = {
                        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
                        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
                    };
                    var celebrationData = {
                        winner: winner,
                        teamAScore: tr.teamA,
                        teamBScore: tr.teamB,
                        winningPlayers: winningPlayers,
                        gameId: gameId
                    };
                    sessionStorage.setItem('celebrationData', JSON.stringify(celebrationData));
                    console.log('[VIEW-GAME] celebrationData created for cold VIEW');
                }
            }
            
            // v8.00: REMOVED auto-redirect to post-game.html
            // User should see the RESULT button and click it manually
            // Redirect only happens when user clicks RESULT button -> showCelebrationModal()
            
            renderAll();
            document.getElementById("mainContainer").classList.add("data-ready");
            
            // v8.09: Hide waiting screen when data is ready
            if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                WaitingScreen.hide();
            }
            
            setupRealtimeListener();
        });
    }
    GameUI.updateToggleButtons(GameUI.getDisplayMode());
    
    console.log('[VIEW-GAME] v8.10 initialized - VIEW read-only photo check');
}
