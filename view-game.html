<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var gameId = null;
var currentHole = 1;
var selectedFlight = 1;
var currentDisplayMode = "play";

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];
var startingHole = 1;

var f1DataString = "";
var f2DataString = "";
var resultsCache = null;

var unsubscribe = null;

var isGameCompleteFlag = false;
var celebrationTriggered = false;

// ============================================================
// Ticker Functions
// ============================================================

function calculatePlayerScoreRelativeToPar(player) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var totalGross = 0;
    var totalPar = 0;
    
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1];
        totalPar += par;
        
        var holeData = GameData.parseHoleData(flightDataStr, h);
        if (holeData && holeData.saved) {
            var score = 0;
            var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
            var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            if (player.team === 'A') {
                if (teamA[0] && teamA[0].name === player.name) score = holeData.scores.a1;
                else if (teamA[1] && teamA[1].name === player.name) score = holeData.scores.a2;
            } else {
                if (teamB[0] && teamB[0].name === player.name) score = holeData.scores.b1;
                else if (teamB[1] && teamB[1].name === player.name) score = holeData.scores.b2;
            }
            totalGross += score;
        } else {
            totalGross += par;
        }
    }
    
    return totalGross - totalPar;
}

function getPlayerScoreForTicker(player) {
    return calculatePlayerScoreRelativeToPar(player);
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    if (currentDisplayMode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) {
        var par = coursePar[hole - 1] || 4;
        return par;
    }
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1] || 4;
}

function getCurrentScore(player) {
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    return allPlayers.filter(function(op) { return op.team !== player.team; });
}

function isHoleSaved(flight, hole) {
    var flightDataStr = flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    return holeData && holeData.saved;
}

function getMatchValueFromStoredResults(player, opponent, holeNumber) {
    if (!resultsCache) return 0;
    return GameData.getMatchValueFromResults(resultsCache, player, opponent, holeNumber, allPlayers, getHolePosition);
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
        if (matchValue > 0) return 'bubble-green';
        if (matchValue < 0) return 'bubble-red';
        return 'bubble-green';
    }
    
    var computedUpTo = resultsCache?.computedUpToHole || 0;
    var isSynced = (computedUpTo >= currentHole);
    
    if (!isSynced) return 'bubble-grey';
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getTRForHole(holeNumber) {
    if (!resultsCache || !resultsCache.tr) {
        return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    }
    
    var position = getHolePosition(holeNumber);
    var trA = resultsCache.tr.teamA[position];
    var trB = resultsCache.tr.teamB[position];
    var teamAGreen = resultsCache.tr.teamAGreen[position];
    var teamBGreen = resultsCache.tr.teamBGreen[position];
    
    return {
        teamA: trA !== undefined ? trA : 9.5,
        teamB: trB !== undefined ? trB : 9.5,
        teamAGreen: teamAGreen !== undefined ? teamAGreen : true,
        teamBGreen: teamBGreen !== undefined ? teamBGreen : true
    };
}

function getDisplayRow(rowName, position) {
    if (!resultsCache) return "AS";
    
    if (rowName === "t1") {
        var leader = resultsCache.game2?.flight1?.leader;
        if (leader && leader[position]) return leader[position];
    } else if (rowName === "t2") {
        var leader = resultsCache.game2?.flight2?.leader;
        if (leader && leader[position]) return leader[position];
    } else if (rowName === "strk") {
        var leader = resultsCache.game3?.leader;
        if (leader && leader[position]) return leader[position];
    }
    return "AS";
}

// ============================================================
// Celebration and Handicap Functions for Viewers
// ============================================================

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    
    var tr = getTRForHole(currentHole);
    var winner = SignCard.getWinner(tr.teamA, tr.teamB);
    var winningPlayers = {
        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
    };
    
    var matchPoints = {};
    if (resultsCache && resultsCache.matchResults) {
        var matchResultsArray = resultsCache.matchResults[17];
        if (matchResultsArray) {
            var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            for (var a = 0; a < teamAPlayers.length; a++) {
                for (var b = 0; b < teamBPlayers.length; b++) {
                    var matchIndex = a * teamBPlayers.length + b;
                    var value = matchResultsArray[matchIndex] || 0;
                    var playerA = teamAPlayers[a];
                    var playerB = teamBPlayers[b];
                    
                    if (!matchPoints[playerA.name]) matchPoints[playerA.name] = { total: 0 };
                    if (!matchPoints[playerB.name]) matchPoints[playerB.name] = { total: 0 };
                    
                    if (value > 0) matchPoints[playerA.name].total += 1;
                    else if (value < 0) matchPoints[playerB.name].total += 1;
                    else {
                        matchPoints[playerA.name].total += 0.5;
                        matchPoints[playerB.name].total += 0.5;
                    }
                }
            }
        }
    }
    
    var historyRecordId = gameId + "_history";
    
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() {
        if (typeof HandicapAdjustment !== 'undefined') {
            HandicapAdjustment.init(gameId, historyRecordId, winningPlayers, matchPoints, {}, true);
        } else {
            console.log("HandicapAdjustment not available");
        }
    });
}

function enableCelebrationMode() {
    var nextBtn = document.getElementById('compactNextBtn');
    if (nextBtn && !celebrationTriggered) {
        nextBtn.innerHTML = '🏆';
        nextBtn.style.background = '#ffaa44';
        nextBtn.style.color = '#1a3a1a';
        nextBtn.style.border = '1px solid #ffaa44';
        nextBtn.disabled = false;
        
        var newBtn = nextBtn.cloneNode(true);
        nextBtn.parentNode.replaceChild(newBtn, nextBtn);
        newBtn.addEventListener('click', function() {
            showCelebrationAndHandicap();
        });
        
        console.log('🏆 Celebration mode enabled for viewer');
    }
}

// ============================================================
// Navigation Functions (Viewer Mode - No Sign Button)
// ============================================================

function goToPrevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        updateHoleDisplay();
        renderAll();
        updateNavButtons();
    }
}

function goToNextHole() {
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        updateHoleDisplay();
        renderAll();
        updateNavButtons();
    }
}

function updateHoleDisplay() {
    var holeDisplay = document.querySelector('.compact-hole-display');
    if (holeDisplay) holeDisplay.innerText = currentHole;
    
    // Update hole header
    var currentPar = coursePar[currentHole - 1] || 4;
    renderHoleHeader(currentHole, currentPar);
}

function renderHoleHeader(holeNumber, par) {
    var container = document.getElementById('holeHeader');
    if (container) {
        container.innerHTML = `<div style="text-align: center; margin-bottom: 10px;"><div style="font-size: 1.5rem; font-weight: 800; background: #111; display: inline-block; padding: 4px 20px; border-radius: 40px;">HOLE ${holeNumber}</div></div>`;
    }
}

function updateNavButtons() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var prevBtn = document.getElementById('compactPrevBtn');
    var nextBtn = document.getElementById('compactNextBtn');
    
    if (prevBtn) prevBtn.disabled = (currentIndex === 0);
    
    if (nextBtn) {
        if (isGameCompleteFlag && !celebrationTriggered) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = (currentIndex === 17);
        }
    }
}

function renderAll() {
    if (!f1DataString || !f2DataString) return;
    
    var tr = getTRForHole(currentHole);
    updateTRDisplay(tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(selectedFlight);
    renderPlayerCards(currentPlayers);
    
    // Update flight badge
    var badge = document.querySelector('.flight-badge');
    if (badge) badge.innerText = 'FLIGHT ' + selectedFlight;
    
    var t1Row = new Array(18).fill('_');
    var t2Row = new Array(18).fill('_');
    var strkRow = new Array(18).fill('_');
    
    if (resultsCache) {
        for (var pos = 0; pos < 18; pos++) {
            t1Row[pos] = getDisplayRow("t1", pos);
            t2Row[pos] = getDisplayRow("t2", pos);
            strkRow[pos] = getDisplayRow("strk", pos);
        }
    }
    
    var holes = getDisplayHoles();
    window.savedHoles = { 1: [], 2: [] };
    for (var h = 1; h <= 18; h++) {
        if (isHoleSaved(1, h)) window.savedHoles[1].push(h);
        if (isHoleSaved(2, h)) window.savedHoles[2].push(h);
    }
    
    GameUI.renderScorecard(
        "scorecardWrapper",
        holes,
        allPlayers,
        getStoredScore,
        isHoleSaved,
        t1Row,
        t2Row,
        strkRow,
        coursePar,
        courseSi
    );
    
    updateNavButtons();
    
    if (typeof Ticker !== 'undefined') {
        Ticker.refresh();
    }
}

function updateTRDisplay(teamAPoints, teamBPoints, teamAGreen, teamBGreen) {
    var container = document.getElementById('trDisplay');
    if (!container) return;
    
    var teamADisplay = teamAPoints % 1 === 0 ? teamAPoints : teamAPoints.toFixed(1);
    var teamBDisplay = teamBPoints % 1 === 0 ? teamBPoints : teamBPoints.toFixed(1);
    var teamAColor = teamAGreen ? '#4caf50' : '#ff6b6b';
    var teamBColor = teamBGreen ? '#4caf50' : '#ff6b6b';
    
    container.innerHTML = `
        <div style="text-align: center;">
            <div style="display: flex; justify-content: center; align-items: center; gap: 16px;">
                <div style="text-align: center; min-width: 100px;">
                    <div style="font-size: 0.85rem; font-weight: 600; color: ${teamAColor};">TEAM A</div>
                    <div style="font-size: 1.8rem; font-weight: 800; color: ${teamAColor};">${teamADisplay}</div>
                </div>
                <div style="font-size: 1.5rem; color: #888;">│</div>
                <div style="text-align: center; min-width: 100px;">
                    <div style="font-size: 0.85rem; font-weight: 600; color: ${teamBColor};">TEAM B</div>
                    <div style="font-size: 1.8rem; font-weight: 800; color: ${teamBColor};">${teamBDisplay}</div>
                </div>
            </div>
        </div>
    `;
}

function renderPlayerCards(players) {
    var container = document.getElementById('playerCards');
    if (!container) return;
    
    var html = '';
    for (var i = 0; i < players.length; i++) {
        var player = players[i];
        var currentScore = getCurrentScore(player);
        var opponents = getAllOpponents(player);
        
        var bubblesHtml = '<div class="bubbles">';
        for (var j = 0; j < opponents.length; j++) {
            var opp = opponents[j];
            var bubbleClass = getBubbleClass(player, opp);
            var bubbleValue = getBubbleValue(player, opp);
            bubblesHtml += '<div class="bubble ' + bubbleClass + '">vs ' + opp.label + ' ' + bubbleValue + '</div>';
        }
        bubblesHtml += '</div>';
        
        html += `
            <div class="player-card" data-player-name="${player.name}" data-player-flight="${player.flight}">
                <div class="player-header">
                    <div>
                        <span class="player-name">${player.name}</span>
                        <span class="player-handicap">${player.label} ${player.handicap}</span>
                    </div>
                    <div class="score-value">${currentScore}</div>
                </div>
                ${bubblesHtml}
            </div>
        `;
    }
    
    container.innerHTML = html;
}

function toggleDisplayMode() {
    currentDisplayMode = currentDisplayMode === 'play' ? 'natural' : 'play';
    var pnBtn = document.getElementById('compactPnBtn');
    if (pnBtn) pnBtn.innerText = currentDisplayMode === 'play' ? 'P' : 'N';
    renderAll();
}

function onToggleFlight() {
    selectedFlight = selectedFlight === 1 ? 2 : 1;
    var flightBtn = document.getElementById('compactFlightBtn');
    if (flightBtn) flightBtn.innerText = 'FLIGHT ' + selectedFlight;
    
    // Update flight badge
    var badge = document.querySelector('.flight-badge');
    if (badge) badge.innerText = 'FLIGHT ' + selectedFlight;
    
    renderAll();
}

function exitToMainMenu() {
    if (unsubscribe) unsubscribe();
    window.location.href = "index.html";
}

// ============================================================
// Firestore Listener
// ============================================================

function startGameListener() {
    if (unsubscribe) unsubscribe();
    
    var collection = "scheduledGames";
    unsubscribe = db.collection(collection).doc(gameId).onSnapshot(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            
            courseName = data.course?.name || "Unknown Course";
            coursePar = data.course?.par || [];
            courseSi = data.course?.si || [];
            allPlayers = data.players || [];
            startingHole = data.startingHole || 1;
            
            f1DataString = data.f1?.d || "";
            f2DataString = data.f2?.d || "";
            resultsCache = data.results || null;
            
            var signatures = data.signatures || {};
            var bothSigned = signatures.f1?.signed === true && signatures.f2?.signed === true;
            
            if (bothSigned && !isGameCompleteFlag && !celebrationTriggered) {
                console.log('🎉 Game is complete! Enabling celebration mode for viewer.');
                isGameCompleteFlag = true;
                enableCelebrationMode();
            }
            
            document.getElementById("courseName").innerHTML = courseName;
            
            if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                Ticker.setPlayers(allPlayers);
                Ticker.refresh();
            }
            
            var playOrder = getPlayOrder();
            var foundCurrent = false;
            for (var i = 0; i < playOrder.length; i++) {
                var hole = playOrder[i];
                if (!isHoleSaved(selectedFlight, hole)) {
                    currentHole = hole;
                    foundCurrent = true;
                    break;
                }
            }
            if (!foundCurrent && playOrder.length > 0) {
                currentHole = playOrder[0];
            }
            updateHoleDisplay();
            
            renderAll();
        }
    }, function(error) {
        document.getElementById("debug").innerHTML = "Sync error: " + error.message;
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    if (!gameId) {
        gameId = sessionStorage.getItem('currentGameId');
    }
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    // Apply tight layout
    GameUI.applyTightLayout();
    
    // Create GREEN status bubble below ticker
    var tickerContainer = document.getElementById('tickerContainer');
    if (tickerContainer && !document.getElementById('statusBubble')) {
        var bubble = document.createElement('div');
        bubble.id = 'statusBubble';
        bubble.className = 'status-bubble';
        bubble.innerText = 'VIEWER';
        bubble.onclick = function() { location.reload(); };
        tickerContainer.insertAdjacentElement('afterend', bubble);
    }
    
    // Render compact header with FLIGHT toggle (no SAVE button)
    var compactContainer = document.getElementById('compactHeaderContainer');
    if (compactContainer) {
        var pnText = currentDisplayMode === 'play' ? 'P' : 'N';
        compactContainer.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px;">
                <button id="compactPnBtn" style="background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; border-radius:30px; padding:0 16px; min-width:60px; height:52px; font-size:1rem; font-weight:700; cursor:pointer; flex-shrink:0;">${pnText}</button>
                <button id="compactFlightBtn" style="background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; border-radius:30px; padding:0 16px; height:52px; font-size:1rem; font-weight:700; cursor:pointer; flex:1; text-align:center;">FLIGHT ${selectedFlight}</button>
                <div style="display: flex; align-items: center; gap: 8px; flex-shrink:0;">
                    <button id="compactPrevBtn" style="background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; width:52px; height:52px; border-radius:30px; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center;">◀</button>
                    <span id="compactHoleDisplay" style="font-size:1.2rem; font-weight:700; color:#4caf50; min-width:44px; text-align:center;">${currentHole}</span>
                    <button id="compactNextBtn" style="background:#1a3a1a; border:1px solid #4caf50; color:#4caf50; width:52px; height:52px; border-radius:30px; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center;">▶</button>
                </div>
            </div>
        `;
        
        // Attach handlers
        document.getElementById('compactPnBtn').onclick = toggleDisplayMode;
        document.getElementById('compactFlightBtn').onclick = onToggleFlight;
        document.getElementById('compactPrevBtn').onclick = goToPrevHole;
        document.getElementById('compactNextBtn').onclick = goToNextHole;
    }
    
    // Add flight badge to first player card
    setTimeout(function() {
        var firstCard = document.querySelector('.player-card');
        if (firstCard && !document.querySelector('.flight-badge')) {
            var badge = document.createElement('div');
            badge.className = 'flight-badge';
            badge.innerText = 'FLIGHT ' + selectedFlight;
            badge.style.cssText = 'position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: #1a3a1a; border: 2px solid #4caf50; color: #4caf50; font-size: 0.8rem; font-weight: 700; padding: 4px 16px; border-radius: 30px; z-index: 100; white-space: nowrap;';
            firstCard.style.position = 'relative';
            firstCard.appendChild(badge);
        }
    }, 100);
    
    // Render bottom menu
    var bottomContainer = document.getElementById('bottomMenuContainer');
    if (bottomContainer) {
        bottomContainer.innerHTML = '<button id="menuBtn" style="width:100%; padding:14px; border-radius:40px; font-weight:600; cursor:pointer; background:#1a1a1a; color:#ccc; border:1px solid #333; margin-top:20px;">← Back to Main Menu</button>';
        document.getElementById('menuBtn').onclick = exitToMainMenu;
    }
    
    // Render initial hole header
    renderHoleHeader(currentHole, coursePar[currentHole - 1] || 4);
    
    initTicker();
    startGameListener();
}

// Make functions global for console debugging
window.goToPrevHole = goToPrevHole;
window.goToNextHole = goToNextHole;
window.toggleDisplayMode = toggleDisplayMode;
window.onToggleFlight = onToggleFlight;
window.renderAll = renderAll;

init();
</script>

</body>
