<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var gameId = null;
var courseName = "", coursePar = [], courseSi = [], allPlayers = [], startingHole = 1;
var f1DataString = "", f2DataString = "", resultsCache = null;
var unsubscribe = null;
var isGameCompleteFlag = false, celebrationTriggered = false;

// Viewer state
var currentDisplayMode = "play";
var currentFlight = 1;
var currentHole = 1;

// ============================================================
// Cache Loading
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyCachedDataToGameLoader() {
    var cached = getPreloadedRawGameData();
    if (!cached || !cached.rawData) {
        return false;
    }
    
    console.log("Applying cached data to GameLoader (viewer mode)");
    var rawData = cached.rawData;
    
    var cacheData = {
        course: rawData.course,
        players: rawData.players,
        startingHole: rawData.startingHole || 1,
        teamGameFormat: rawData.teamGameFormat || "tournament",
        f1DataString: rawData.f1?.d || "",
        f2DataString: rawData.f2?.d || "",
        results: rawData.results || null,
        savedHoles: { 1: [], 2: [] },
        t1Row: new Array(18).fill('_'),
        t2Row: new Array(18).fill('_'),
        strkRow: new Array(18).fill('0'),
        lastSyncedHole: 0,
        clinchedAt: {},
        signatures: rawData.signatures || { f1: false, f2: false },
        submitted: rawData.submitted || { f1: false, f2: false },
        locks: rawData.locks || { f1: null, f2: null },
        gameStarted: rawData.gameStarted || false
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(cacheData);
    } else {
        console.error("GameLoader.setLocalCache not available");
        return false;
    }
    
    gameId = cached.gameId;
    return true;
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getDisplayHoles() {
    if (currentDisplayMode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    }
    return getPlayOrder();
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1] || 4;
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1] || 4;
}

function isHoleSaved(flight, hole) {
    var flightDataStr = flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    return holeData && holeData.saved;
}

function getFirstUnsavedHole(flight) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        if (!isHoleSaved(flight, hole)) return hole;
    }
    return 18;
}

function getTRForHole(holeNumber) {
    if (!resultsCache || !resultsCache.tr) {
        return { teamA: 9.5, teamB: 9.5, teamAGreen: true, teamBGreen: true };
    }
    var position = getHolePosition(holeNumber);
    return {
        teamA: resultsCache.tr.teamA[position] !== undefined ? resultsCache.tr.teamA[position] : 9.5,
        teamB: resultsCache.tr.teamB[position] !== undefined ? resultsCache.tr.teamB[position] : 9.5,
        teamAGreen: resultsCache.tr.teamAGreen[position] !== undefined ? resultsCache.tr.teamAGreen[position] : true,
        teamBGreen: resultsCache.tr.teamBGreen[position] !== undefined ? resultsCache.tr.teamBGreen[position] : true
    };
}

// ============================================================
// Ticker
// ============================================================

function calculatePlayerScoreRelativeToPar(player) {
    var totalGross = 0, totalPar = 0;
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1];
        totalPar += par;
        totalGross += getStoredScore(player, h);
    }
    return totalGross - totalPar;
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', calculatePlayerScoreRelativeToPar);
        if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
    }
}

// ============================================================
// Render Functions
// ============================================================

function renderHoleHeader() {
    var header = document.getElementById('holeHeader');
    if (header) {
        header.innerHTML = '<div style="display:inline-block; background:#111; padding:4px 20px; border-radius:40px; font-size:1.5rem; font-weight:800;">HOLE ' + currentHole + '</div>';
    }
}

function renderTR() {
    var tr = getTRForHole(currentHole);
    var teamADisplay = tr.teamA % 1 === 0 ? tr.teamA : tr.teamA.toFixed(1);
    var teamBDisplay = tr.teamB % 1 === 0 ? tr.teamB : tr.teamB.toFixed(1);
    var teamAColor = tr.teamA > tr.teamB ? '#4caf50' : (tr.teamA < tr.teamB ? '#ff6b6b' : '#4caf50');
    var teamBColor = tr.teamB > tr.teamA ? '#4caf50' : (tr.teamB < tr.teamA ? '#ff6b6b' : '#4caf50');
    
    var trDiv = document.getElementById('trDisplay');
    if (trDiv) {
        trDiv.innerHTML = '<div style="text-align:center;"><div style="display:flex; justify-content:center; align-items:center; gap:16px;">' +
            '<div><div style="font-size:0.85rem; font-weight:600; color:' + teamAColor + ';">TEAM A</div><div style="font-size:1.8rem; font-weight:800; color:' + teamAColor + ';">' + teamADisplay + '</div></div>' +
            '<div style="font-size:1.5rem; color:#888;">│</div>' +
            '<div><div style="font-size:0.85rem; font-weight:600; color:' + teamBColor + ';">TEAM B</div><div style="font-size:1.8rem; font-weight:800; color:' + teamBColor + ';">' + teamBDisplay + '</div></div>' +
        '</div></div>';
    }
}

function renderPlayerCards() {
    var players = GameUI.getFlightOrderedPlayersShared(currentFlight, allPlayers);
    var cardsHtml = '';
    
    for (var i = 0; i < players.length; i++) {
        var p = players[i];
        var score = getStoredScore(p, currentHole);
        var opponents = GameUI.getAllOpponentsShared(p, allPlayers);
        var bubblesHtml = '<div class="bubbles">';
        
        // Get clinchedAt from GameLoader for proper clinch display
        var cache = GameLoader.getLocalCache();
        var clinchedAt = cache ? cache.clinchedAt : {};
        
        for (var j = 0; j < opponents.length; j++) {
            var opp = opponents[j];
            var bubbleClass = GameUI.getBubbleClassShared(p, opp, currentHole, resultsCache, allPlayers, isHoleSaved, getHolePosition, clinchedAt);
            var bubbleValue = GameUI.getBubbleValueShared(p, opp, currentHole, resultsCache, allPlayers, getHolePosition);
            bubblesHtml += '<div class="bubble ' + bubbleClass + '">' + escapeHtml(opp.label) + ' ' + bubbleValue + '</div>';
        }
        bubblesHtml += '</div>';
        
        cardsHtml += '<div class="player-card">' +
            '<div class="player-header">' +
                '<div><span class="player-name">' + escapeHtml(p.name) + '</span><span class="player-handicap">' + p.label + ' ' + p.handicap + '</span></div>' +
                '<div class="score-value">' + score + '</div>' +
            '</div>' +
            bubblesHtml +
        '</div>';
    }
    document.getElementById('playerCards').innerHTML = cardsHtml;
    
    setTimeout(function() {
        var firstCard = document.querySelector('.player-card');
        if (firstCard && !document.querySelector('.flight-badge')) {
            var badge = document.createElement('div');
            badge.className = 'flight-badge';
            badge.innerText = 'FLIGHT ' + currentFlight;
            badge.style.cssText = 'position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:#1a3a1a; border:2px solid #4caf50; color:#4caf50; font-size:0.8rem; font-weight:700; padding:4px 16px; border-radius:30px; z-index:100; white-space:nowrap;';
            firstCard.style.position = 'relative';
            firstCard.appendChild(badge);
        }
    }, 50);
}

function renderScorecard() {
    var holes = getDisplayHoles();
    window.savedHoles = { 1: [], 2: [] };
    for (var h = 1; h <= 18; h++) {
        if (isHoleSaved(1, h)) window.savedHoles[1].push(h);
        if (isHoleSaved(2, h)) window.savedHoles[2].push(h);
    }
    
    var t1Row = resultsCache ? (resultsCache.game2?.flight1?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var t2Row = resultsCache ? (resultsCache.game2?.flight2?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    var strkRow = resultsCache ? (resultsCache.game3?.leader || new Array(18).fill('_')) : new Array(18).fill('_');
    
    GameUI.renderScorecard('scorecardWrapper', holes, allPlayers, getStoredScore, isHoleSaved, t1Row, t2Row, strkRow, coursePar, courseSi);
}

function renderAll() {
    if (!f1DataString || !f2DataString) return;
    renderHoleHeader();
    renderTR();
    renderPlayerCards();
    renderScorecard();
    updateNavButtons();
    if (typeof Ticker !== 'undefined') Ticker.refresh();
}

// ============================================================
// Navigation
// ============================================================

function updateNavButtons() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var prevBtn = document.getElementById('compactPrevBtn');
    var nextBtn = document.getElementById('compactNextBtn');
    var isCurrentSaved = isHoleSaved(currentFlight, currentHole);
    var isLastHole = (currentIndex === 17);
    
    if (prevBtn) prevBtn.disabled = (currentIndex === 0);
    
    if (nextBtn) {
        if (isLastHole && !isCurrentSaved) {
            nextBtn.disabled = true;
            nextBtn.style.opacity = '0.6';
        } else {
            nextBtn.disabled = false;
            nextBtn.style.opacity = '1';
        }
    }
}

function goToPrevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex > 0) {
        currentHole = playOrder[currentIndex - 1];
        document.getElementById('compactHoleDisplay').innerText = currentHole;
        renderAll();
    }
}

function goToNextHole() {
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    if (currentIndex < 17) {
        currentHole = playOrder[currentIndex + 1];
        document.getElementById('compactHoleDisplay').innerText = currentHole;
        renderAll();
    }
}

function toggleDisplayMode() {
    currentDisplayMode = currentDisplayMode === 'play' ? 'natural' : 'play';
    document.getElementById('compactPnBtn').innerText = currentDisplayMode === 'play' ? 'P' : 'N';
    renderAll();
}

function toggleFlight() {
    currentFlight = currentFlight === 1 ? 2 : 1;
    document.getElementById('compactFlightBtn').innerText = 'FLIGHT ' + currentFlight;
    renderAll();
}

function exitToMainMenu() {
    if (unsubscribe) unsubscribe();
    window.location.href = "index.html";
}

// ============================================================
// Celebration
// ============================================================

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    var tr = getTRForHole(currentHole);
    var winner = tr.teamA > tr.teamB ? "A" : (tr.teamB > tr.teamA ? "B" : "Tie");
    var winningPlayers = {
        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
    };
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() {
        if (typeof HandicapAdjustment !== 'undefined') {
            HandicapAdjustment.init(gameId, gameId + "_history", winningPlayers, {}, {}, true);
        }
    });
}

function enableCelebrationMode() {
    var nextBtn = document.getElementById('compactNextBtn');
    if (nextBtn && !celebrationTriggered && isGameCompleteFlag) {
        nextBtn.innerHTML = '🏆';
        nextBtn.style.background = '#ffaa44';
        nextBtn.style.color = '#1a3a1a';
        nextBtn.style.border = '1px solid #ffaa44';
        nextBtn.disabled = false;
        var newBtn = nextBtn.cloneNode(true);
        nextBtn.parentNode.replaceChild(newBtn, nextBtn);
        newBtn.onclick = showCelebrationAndHandicap;
    }
}

// ============================================================
// Build UI Components
// ============================================================

function buildCompactHeader() {
    var container = document.getElementById('compactHeaderContainer');
    if (!container) return;
    
    var pnText = currentDisplayMode === 'play' ? 'P' : 'N';
    container.innerHTML = '<div class="compact-header">' +
        '<button class="compact-btn compact-pn-btn" id="compactPnBtn">' + pnText + '</button>' +
        '<button class="compact-btn compact-flight-btn" id="compactFlightBtn">FLIGHT ' + currentFlight + '</button>' +
        '<div class="compact-nav-group">' +
            '<button class="compact-btn compact-nav-btn" id="compactPrevBtn">◀</button>' +
            '<span class="compact-hole-display" id="compactHoleDisplay">' + currentHole + '</span>' +
            '<button class="compact-btn compact-nav-btn" id="compactNextBtn">▶</button>' +
        '</div>' +
    '</div>';
    
    document.getElementById('compactPnBtn').onclick = toggleDisplayMode;
    document.getElementById('compactFlightBtn').onclick = toggleFlight;
    document.getElementById('compactPrevBtn').onclick = goToPrevHole;
    document.getElementById('compactNextBtn').onclick = goToNextHole;
}

function buildBottomMenu() {
    var container = document.getElementById('bottomMenuContainer');
    if (container) {
        GameUI.renderBottomMenu('bottomMenuContainer', exitToMainMenu);
    }
}

// ============================================================
// Firestore Listener (for real-time updates)
// ============================================================

function startGameListener() {
    if (unsubscribe) unsubscribe();
    unsubscribe = db.collection("scheduledGames").doc(gameId).onSnapshot(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            courseName = data.course?.name || "Unknown Course";
            coursePar = data.course?.par || [];
            courseSi = data.course?.si || [];
            allPlayers = data.players || [];
            startingHole = data.startingHole || 1;
            f1DataString = data.f1?.d || "";
            f2DataString = data.f2?.d || "";
            resultsCache = data.results || null;
            
            document.getElementById("courseName").innerHTML = courseName;
            
            var signatures = data.signatures || {};
            var bothSigned = signatures.f1?.signed === true && signatures.f2?.signed === true;
            if (bothSigned && !isGameCompleteFlag && !celebrationTriggered) {
                isGameCompleteFlag = true;
                enableCelebrationMode();
            }
            
            if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                Ticker.setPlayers(allPlayers);
                Ticker.refresh();
            }
            
            var newHole = getFirstUnsavedHole(currentFlight);
            if (newHole !== currentHole) {
                currentHole = newHole;
                var holeDisplay = document.getElementById('compactHoleDisplay');
                if (holeDisplay) holeDisplay.innerText = currentHole;
            }
            
            renderAll();
        }
    }, function(error) {
        document.getElementById("debug").innerHTML = "Sync error: " + error.message;
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var shortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + shortName;
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("view-game.html", "index.html", resolve);
    });
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    if (!gameId) gameId = sessionStorage.getItem('currentGameId');
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    // Make status bubble clickable
    var bubble = document.getElementById('statusBubble');
    if (bubble) bubble.onclick = function() { location.reload(); };
    
    buildCompactHeader();
    buildBottomMenu();
    
    // Try to use cached data first
    var cacheApplied = applyCachedDataToGameLoader();
    
    if (cacheApplied) {
        console.log("Using cached data for viewer mode");
        var cache = GameLoader.getLocalCache();
        courseName = cache.course?.name || "Unknown Course";
        coursePar = cache.course?.par || [];
        courseSi = cache.course?.si || [];
        allPlayers = cache.players || [];
        startingHole = cache.startingHole || 1;
        f1DataString = cache.f1DataString || "";
        f2DataString = cache.f2DataString || "";
        resultsCache = cache.results || null;
        
        document.getElementById("courseName").innerHTML = courseName;
        
        // NEW v4.06: Populate savedHoles from cache and set currentHole to first unsaved
        window.savedHoles = cache.savedHoles || { 1: [], 2: [] };
        var firstUnsaved = getFirstUnsavedHole(currentFlight);
        if (firstUnsaved && firstUnsaved !== currentHole) {
            currentHole = firstUnsaved;
            console.log("Setting currentHole to first unsaved hole:", currentHole);
        }
        var holeDisplay = document.getElementById('compactHoleDisplay');
        if (holeDisplay) holeDisplay.innerText = currentHole;
        
        initTicker();
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
        
        renderAll();
        
        // Reveal content after data is loaded
        document.getElementById("mainContainer").classList.add("data-ready");
        
        // Still attach Firestore listener for real-time updates
        startGameListener();
    } else {
        console.log("No cached data, loading from Firestore");
        initTicker();
        startGameListener();
        
        // Reveal content when data arrives via listener
        setTimeout(function() {
            if (!document.getElementById("mainContainer").classList.contains("data-ready")) {
                document.getElementById("mainContainer").classList.add("data-ready");
            }
        }, 500);
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

init();
</script>
