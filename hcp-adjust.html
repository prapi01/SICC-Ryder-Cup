<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="hcp-loading">⛳ Loading handicap data...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.27</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[HCP-ADJUST-PAGE] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.27: Fix calculate method name + restore cache
// ============================================================
var APP_VERSION = "1.27";
var CACHE_KEY = "hcp_adjust_version_v127";

var storedVersion = localStorage.getItem(CACHE_KEY);
var urlParams = new URLSearchParams(window.location.search);
var hasVersionParam = urlParams.get('v');

if (!hasVersionParam || hasVersionParam !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[HCP-ADJUST-PAGE] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.HCP_ADJUST_PAGE_VERSION = "1.27";
console.log("[HCP-ADJUST-PAGE] Initializing v1.27 - Fixed calculate method, restore cache");
console.log("[HCP-ADJUST-PAGE] WRV loaded:", typeof WRV !== 'undefined');

// ============================================================
// v1.27: Restore cache from sessionStorage
// ============================================================

function restoreCacheFromSession() {
    var stored = sessionStorage.getItem('gameCache');
    if (stored) {
        try {
            var cache = JSON.parse(stored);
            if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
                GameLoader.setLocalCache(cache);
                console.log('[HCP-ADJUST-PAGE] ✅ Cache restored from sessionStorage');
                return true;
            }
        } catch(e) {
            console.warn('[HCP-ADJUST-PAGE] Failed to restore cache:', e.message);
        }
    } else {
        console.log('[HCP-ADJUST-PAGE] No gameCache in sessionStorage');
    }
    return false;
}

// ============================================================
// Main Logic - UNCHANGED from v1.24 except calculate → calculateAllAdjustments
// ============================================================

var gameId = null;
var gameData = null;
var hcpData = null;
var celebrationData = null;
var fromHistoryMode = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    var mode = params.get('mode');
    fromHistoryMode = (mode === 'history');
    
    console.log("[HCP-ADJUST-PAGE] gameId:", gameId, "mode:", mode);
}

function getDeviceName() {
    try {
        var name = SessionManager.getShortNameOnly();
        return name || 'DEV-??';
    } catch(e) {
        return 'DEV-??';
    }
}

function showError(message) {
    var content = document.getElementById('content');
    content.innerHTML = `
        <div class="hcp-error">
            <div style="font-size:1.2rem; margin-bottom:12px;">⚠️ ${message}</div>
            <button onclick="location.reload()">RETRY</button>
        </div>
    `;
    document.getElementById('debug').textContent = 'Error: ' + message;
}

function renderHcpScreen() {
    if (!hcpData) {
        showError('No handicap data available');
        return;
    }
    
    var players = hcpData.players || [];
    var winner = celebrationData ? celebrationData.winner : 'Tie';
    var teamAScore = celebrationData ? celebrationData.teamAScore : 9.5;
    var teamBScore = celebrationData ? celebrationData.teamBScore : 9.5;
    
    var winnerText = winner === 'A' ? '🏆 Team A Wins!' : (winner === 'B' ? '🏆 Team B Wins!' : '🤝 Tie Game!');
    var winnerColor = winner === 'A' || winner === 'B' ? '#4caf50' : '#ffaa44';
    
    var playersHtml = '';
    players.forEach(function(p) {
        var change = p.finalHcp - p.startingHcp;
        var changeClass = 'hcp-change-neutral';
        var changeDisplay = '0';
        
        if (change > 0) {
            changeClass = 'hcp-change-positive';
            changeDisplay = '+' + change.toFixed(1);
        } else if (change < 0) {
            changeClass = 'hcp-change-negative';
            changeDisplay = change.toFixed(1);
        }
        
        playersHtml += `
            <tr>
                <td class="player-name">${escapeHtml(p.name)}</td>
                <td class="hcp-value">${p.startingHcp}</td>
                <td class="hcp-value">${p.finalHcp.toFixed(1)}</td>
                <td class="hcp-change ${changeClass}">${changeDisplay}</td>
            </tr>
        `;
    });
    
    var html = `
        <div class="hcp-container">
            <div class="hcp-title">🏌️ Handicap Adjustment</div>
            <div class="hcp-subtitle">Performance-based handicap updates for all players</div>
            
            <div class="hcp-winner-banner">
                <div class="winner-text">${winnerText}</div>
                <div class="winner-score">Team A ${teamAScore} - ${teamBScore} Team B</div>
            </div>
            
            <div class="hcp-card">
                <div class="hcp-card-title">📊 Adjusted Handicaps</div>
                <table class="hcp-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th style="text-align:center;">Before</th>
                            <th style="text-align:center;">After</th>
                            <th style="text-align:center;">Change</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${playersHtml}
                    </tbody>
                </table>
            </div>
            
            <div class="hcp-btn-group">
                <button class="hcp-btn hcp-btn-secondary" id="hcpBackBtn">← Back</button>
                <button class="hcp-btn hcp-btn-primary" id="hcpCommitBtn">✓ Save Changes</button>
            </div>
        </div>
    `;
    
    document.getElementById('content').innerHTML = html;
    
    if (fromHistoryMode) {
        var commitBtn = document.getElementById('hcpCommitBtn');
        if (commitBtn) {
            commitBtn.disabled = true;
            commitBtn.style.opacity = '0.5';
            commitBtn.style.cursor = 'not-allowed';
            commitBtn.textContent = '✓ Archived';
        }
    }
    
    document.getElementById('hcpBackBtn').addEventListener('click', function() {
        window.location.href = 'index.html';
    });
    
    document.getElementById('hcpCommitBtn').addEventListener('click', function() {
        commitHandicapAdjustment();
    });
}

function commitHandicapAdjustment() {
    if (!gameId || !hcpData) {
        Modal.alert('No data to save');
        return;
    }
    
    AuthPin.requireAuth('hcp-adjust', gameId, null, function() {
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.save) {
            HandicapAdjustment.save(gameId, hcpData, function(success) {
                if (success) {
                    Modal.alert('✅ Handicaps updated successfully!');
                    var checkModal = setInterval(function() {
                        var modals = document.querySelectorAll('.modal-overlay');
                        if (modals.length === 0) {
                            clearInterval(checkModal);
                            window.location.href = 'index.html';
                        }
                    }, 500);
                } else {
                    Modal.alert('❌ Failed to update handicaps. Please try again.');
                }
            });
        } else {
            Modal.alert('Handicap adjustment not available');
        }
    });
}

function loadHcpData() {
    if (!gameId) {
        showError('No game ID provided');
        return;
    }
    
    console.log("[HCP-ADJUST-PAGE] Loading game:", gameId);
    
    // v1.27: Restore cache if not already in memory
    var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
    if (!cache) {
        restoreCacheFromSession();
    }
    
    if (typeof FirebaseRetry === 'undefined') {
        showError('FirebaseRetry not loaded');
        return;
    }
    
    WaitingScreen.show("Loading handicap data...");
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            WaitingScreen.hide();
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        WaitingScreen.hide();
        
        if (!doc.exists) {
            return loadFromHistory(gameId);
        }
        
        gameData = doc.data();
        console.log("[HCP-ADJUST-PAGE] Game loaded:", gameData);
        
        var signatures = gameData.signatures || {};
        var f1Signed = signatures.f1?.signed === true;
        var f2Signed = signatures.f2?.signed === true;
        
        if (!f1Signed || !f2Signed) {
            showError('Game is not complete. Please sign both cards first.');
            return;
        }
        
        // v1.27: FIXED - calculate() → calculateAllAdjustments()
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.calculateAllAdjustments) {
            hcpData = HandicapAdjustment.calculateAllAdjustments(gameData);
            renderHcpScreen();
        } else {
            showError('Handicap calculation not available');
        }
    }).catch(function(err) {
        WaitingScreen.hide();
        console.error("[HCP-ADJUST-PAGE] Error:", err);
        showError(err.message || 'Failed to load game data');
    });
}

function loadFromHistory(gameId) {
    console.log("[HCP-ADJUST-PAGE] Trying to load from history:", gameId);
    
    var historyId = gameId + '_H';
    
    return FirebaseRetry.getDocument("historyGames", historyId, {
        onExit: function() {
            WaitingScreen.hide();
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        WaitingScreen.hide();
        
        if (!doc.exists) {
            showError('Game not found. Please return to the main menu.');
            return;
        }
        
        var historyData = doc.data();
        console.log("[HCP-ADJUST-PAGE] History data loaded:", historyData);
        
        gameData = {
            players: historyData.players || [],
            results: historyData.results || {},
            signatures: historyData.signatures || { f1: { signed: true }, f2: { signed: true } },
            course: historyData.gameInfo?.course || {},
            date: historyData.gameInfo?.date || ''
        };
        
        var stored = sessionStorage.getItem('celebrationData');
        if (stored) {
            try {
                celebrationData = JSON.parse(stored);
            } catch(e) {
                console.warn("[HCP-ADJUST-PAGE] Failed to parse celebration data:", e);
            }
        }
        
        // v1.27: FIXED - calculate() → calculateAllAdjustments()
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.calculateAllAdjustments) {
            hcpData = HandicapAdjustment.calculateAllAdjustments(gameData);
            renderHcpScreen();
        } else {
            showError('Handicap calculation not available');
        }
    }).catch(function(err) {
        WaitingScreen.hide();
        console.error("[HCP-ADJUST-PAGE] Error loading history:", err);
        showError(err.message || 'Failed to load history data');
    });
}

function init() {
    console.log("[HCP-ADJUST-PAGE] Initializing...");
    
    document.getElementById('deviceTag').textContent = '🏌️ ' + getDeviceName();
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    // v1.27: Restore cache from sessionStorage BEFORE loading
    restoreCacheFromSession();
    
    var stored = sessionStorage.getItem('celebrationData');
    if (stored) {
        try {
            celebrationData = JSON.parse(stored);
            console.log("[HCP-ADJUST-PAGE] Celebration data restored from sessionStorage");
            console.log("  gameId:", celebrationData.gameId);
            console.log("  winner:", celebrationData.winner);
        } catch(e) {
            console.warn("[HCP-ADJUST-PAGE] Failed to parse celebration data:", e);
        }
    }
    
    var urlParams = new URLSearchParams(window.location.search);
    var mode = urlParams.get('mode');
    fromHistoryMode = (mode === 'history');
    
    loadHcpData();
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
