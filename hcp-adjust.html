    <style>

<body>

<div class="container" id="mainContainer">
    <div class="hcp-header">
        <div class="hcp-title">HANDICAP ADJUSTMENT</div>
    </div>
    
    <div id="hcpTableContainer"></div>
    
    <div class="hcp-buttons" id="hcpButtons"></div>
    
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.19</div>

<script>
// ============================================================
// VERSION CACHE-BUSTING - Preserve all query parameters
// ============================================================
var APP_VERSION = "1.19";
var CACHE_KEY = "hcp_adjust_version_v119";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    var newUrl = window.location.pathname + "?v=" + APP_VERSION;
    
    currentParams.forEach(function(value, key) {
        if (key !== 'v') {
            newUrl += "&" + key + "=" + encodeURIComponent(value);
        }
    });
    
    console.log("[HCP-ADJUST-PAGE] Cache-busting redirect:", newUrl);
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.HCP_ADJUST_PAGE_VERSION = "1.19";
console.log("[HCP-ADJUST-PAGE] Initializing v1.19 - Main Menu confirmation modal");

// ============================================================
// v1.18: Restore celebration data from sessionStorage
// ============================================================
function restoreCelebrationData() {
    var stored = sessionStorage.getItem('celebrationData');
    if (stored) {
        try {
            var data = JSON.parse(stored);
            console.log("[HCP-ADJUST-PAGE] Celebration data restored from sessionStorage");
            console.log("  gameId:", data.gameId);
            console.log("  winner:", data.winner);
            window._currentCelebrationData = data;
            return true;
        } catch(e) {
            console.warn("[HCP-ADJUST-PAGE] Failed to parse celebration data:", e.message);
        }
    }
    return false;
}

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var isReadOnly = false;
var returnToHistory = false;
var loadAttempted = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    var mode = params.get('mode');
    isReadOnly = (mode === 'readonly' || mode === 'history');
    returnToHistory = (mode === 'history');
    console.log("[HCP-ADJUST-PAGE] gameId:", gameId, "mode:", mode);
}

function renderButtons(anchorName) {
    var container = document.getElementById('hcpButtons');
    if (!container) return;
    
    var html = '';
    
    if (isReadOnly) {
        if (returnToHistory) {
            html = '<button class="hcp-btn hcp-btn-close" id="hcpBackBtn">← Close</button>';
        } else {
            html = '<button class="hcp-btn hcp-btn-back" id="hcpBackBtn">← Back</button>';
        }
    } else {
        html = `
            <button class="hcp-btn hcp-btn-scorecard" id="backToScorecardBtn">Scorecard</button>
            <button class="hcp-btn hcp-btn-celebration" id="celebrationBtn">🎉</button>
            <button class="hcp-btn hcp-btn-menu" id="mainMenuBtn">Main Menu</button>
        `;
    }
    
    container.innerHTML = html;
    
    if (!isReadOnly) {
        var scorecardBtn = document.getElementById('backToScorecardBtn');
        if (scorecardBtn) {
            scorecardBtn.addEventListener('click', function() {
                if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
                    WaitingScreen.show("Loading Scorecard...");
                }
                window.location.href = 'view-game.html?gameId=' + gameId;
            });
        }
        
        var celebrationBtn = document.getElementById('celebrationBtn');
        if (celebrationBtn) {
            celebrationBtn.addEventListener('click', function() {
                console.log("[HCP-ADJUST] Celebration button clicked");
                
                if (!window._currentCelebrationData) {
                    console.log("[HCP-ADJUST] No celebration data, trying to restore from sessionStorage");
                    restoreCelebrationData();
                }
                
                if (window._currentCelebrationData) {
                    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
                        WaitingScreen.show("Loading Celebration...");
                    }
                    
                    if (typeof SignCard !== 'undefined' && SignCard.showCelebrationScreen) {
                        var data = window._currentCelebrationData;
                        SignCard.showCelebrationScreen(
                            data.winner,
                            data.teamAScore,
                            data.teamBScore,
                            data.winningPlayers,
                            data.gameId,
                            function() {
                                console.log("[HCP-ADJUST] Celebration onClose callback");
                                if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                                    WaitingScreen.hide();
                                }
                            }
                        );
                        setTimeout(function() {
                            if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                                WaitingScreen.hide();
                            }
                        }, 1000);
                    } else {
                        console.error("[HCP-ADJUST] SignCard.showCelebrationScreen not available");
                        alert('Celebration screen not available');
                        if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                            WaitingScreen.hide();
                        }
                    }
                } else {
                    console.error("[HCP-ADJUST] No celebration data available");
                    alert('Celebration data not available');
                    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                        WaitingScreen.hide();
                    }
                }
            });
        }
        
        // v1.19: Main Menu button with confirmation modal
        var mainMenuBtn = document.getElementById('mainMenuBtn');
        if (mainMenuBtn) {
            mainMenuBtn.addEventListener('click', function() {
                console.log("[HCP-ADJUST] Main Menu button clicked");
                
                if (typeof Modal !== 'undefined' && Modal.confirm) {
                    Modal.confirm(
                        "⚠️ Leave Game?\n\nYou will not be able to return to this game.",
                        function() {
                            console.log("[HCP-ADJUST] User confirmed - navigating to main menu");
                            window.location.href = 'index.html';
                        },
                        function() {
                            console.log("[HCP-ADJUST] User cancelled - staying on page");
                        }
                    );
                } else {
                    // Fallback to native confirm
                    if (confirm("⚠️ Leave Game?\n\nYou will not be able to return to this game.")) {
                        console.log("[HCP-ADJUST] User confirmed - navigating to main menu");
                        window.location.href = 'index.html';
                    } else {
                        console.log("[HCP-ADJUST] User cancelled - staying on page");
                    }
                }
            });
        }
    } else {
        var backBtn = document.getElementById('hcpBackBtn');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                if (returnToHistory) {
                    window.location.href = 'view-history.html?gameId=' + gameId;
                } else {
                    window.history.back();
                }
            });
        }
    }
}

function loadHcpData() {
    if (loadAttempted) {
        console.log("[HCP-ADJUST-PAGE] Load already attempted, skipping");
        return;
    }
    loadAttempted = true;
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    console.log("[HCP-ADJUST-PAGE] Loading game:", gameId);
    
    if (typeof GameLoader === 'undefined' || typeof GameLoader.loadGame !== 'function') {
        console.error("[HCP-ADJUST-PAGE] GameLoader not available");
        document.getElementById('debug').textContent = 'Error: GameLoader not loaded';
        setTimeout(function() {
            loadAttempted = false;
            loadHcpData();
        }, 1000);
        return;
    }
    
    GameLoader.loadGame(gameId, 'scheduledGames', function(result) {
        if (!result.success) {
            console.error("[HCP-ADJUST-PAGE] Failed to load game:", result.error);
            document.getElementById('debug').textContent = 'Error: ' + result.error;
            return;
        }
        
        var cache = result.cache;
        if (!cache) {
            document.getElementById('debug').textContent = 'Error: No cache data';
            return;
        }
        
        console.log("[HCP-ADJUST-PAGE] Cache loaded, players:", cache.players ? cache.players.length : 0);
        
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.initForViewer) {
            HandicapAdjustment.initForViewer(
                gameId,
                cache.players || [],
                cache.f1DataString || '',
                cache.f2DataString || '',
                cache.course?.si || [],
                cache.course?.par || [],
                cache.startingHole || 1,
                cache.results || null
            );
            console.log("[HCP-ADJUST-PAGE] HandicapAdjustment.initForViewer called");
            
            var container = document.getElementById('hcpTableContainer');
            if (container) {
                var checkTable = setInterval(function() {
                    if (container.querySelector('table')) {
                        container.classList.add('visible');
                        console.log("[HCP-ADJUST-PAGE] Table detected, container shown");
                        clearInterval(checkTable);
                    }
                }, 100);
                setTimeout(function() {
                    clearInterval(checkTable);
                    if (!container.classList.contains('visible')) {
                        container.classList.add('visible');
                        console.log("[HCP-ADJUST-PAGE] Timeout - container shown anyway");
                    }
                }, 5000);
            }
            
            var anchorName = 'Anchor';
            if (cache.players && cache.players.length > 0) {
                var sorted = cache.players.slice().sort(function(a, b) { return a.handicap - b.handicap; });
                anchorName = sorted[0]?.name || 'Anchor';
            }
            renderButtons(anchorName);
        } else {
            console.error("[HCP-ADJUST-PAGE] HandicapAdjustment.initForViewer not available");
            document.getElementById('debug').textContent = 'Error: HandicapAdjustment module not loaded';
        }
    });
}

function init() {
    console.log("[HCP-ADJUST-PAGE] Initializing...");
    
    restoreCelebrationData();
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    try {
        if (typeof SessionManager !== 'undefined' && typeof SessionManager.getShortNameOnly === 'function') {
            var deviceName = SessionManager.getShortNameOnly();
            document.getElementById('deviceTag').textContent = '🏌️ ' + (deviceName || 'DEV-??');
        } else {
            document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
        }
    } catch(e) {
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    loadHcpData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
