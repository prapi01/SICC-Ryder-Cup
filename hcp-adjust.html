<body>

<div class="container" id="mainContainer">
    <div id="content">
        <div class="hcp-loading">⛳ Loading handicap data...</div>
    </div>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.26</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[HCP-ADJUST-PAGE] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.26: Use initForViewer
// ============================================================
var APP_VERSION = "1.26";
var CACHE_KEY = "hcp_adjust_version_v126";

var storedVersion = localStorage.getItem(CACHE_KEY);
var urlParams = new URLSearchParams(window.location.search);
var hasVersionParam = urlParams.get('v');

if (!hasVersionParam || hasVersionParam !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[HCP-ADJUST-PAGE] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.HCP_ADJUST_PAGE_VERSION = "1.26";
console.log("[HCP-ADJUST-PAGE] Initializing v1.26 - Use initForViewer");
console.log("[HCP-ADJUST-PAGE] WRV loaded:", typeof WRV !== 'undefined');

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var gameData = null;
var celebrationData = null;
var fromHistoryMode = false;

// ============================================================
// v1.25: Restore cache from sessionStorage
// ============================================================

function restoreCacheFromSession() {
    var stored = sessionStorage.getItem('gameCache');
    if (stored) {
        try {
            var cache = JSON.parse(stored);
            if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
                GameLoader.setLocalCache(cache);
                console.log('[HCP-ADJUST-PAGE] ✅ Cache restored from sessionStorage');
                return true;
            }
        } catch(e) {
            console.warn('[HCP-ADJUST-PAGE] Failed to restore cache:', e.message);
        }
    } else {
        console.log('[HCP-ADJUST-PAGE] No gameCache in sessionStorage');
    }
    return false;
}

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    var mode = params.get('mode');
    fromHistoryMode = (mode === 'history');
    
    console.log("[HCP-ADJUST-PAGE] gameId:", gameId, "mode:", mode);
}

function getDeviceName() {
    try {
        var name = SessionManager.getShortNameOnly();
        return name || 'DEV-??';
    } catch(e) {
        return 'DEV-??';
    }
}

function showError(message) {
    var content = document.getElementById('content');
    content.innerHTML = `
        <div class="hcp-error">
            <div style="font-size:1.2rem; margin-bottom:12px;">⚠️ ${message}</div>
            <button onclick="location.reload()">RETRY</button>
        </div>
    `;
    document.getElementById('debug').textContent = 'Error: ' + message;
}

function commitHandicapAdjustment() {
    if (!gameId) {
        Modal.alert('No data to save');
        return;
    }
    
    AuthPin.requireAuth('hcp-adjust', gameId, null, function() {
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.save) {
            HandicapAdjustment.save(gameId, null, function(success) {
                if (success) {
                    Modal.alert('✅ Handicaps updated successfully!');
                    var checkModal = setInterval(function() {
                        var modals = document.querySelectorAll('.modal-overlay');
                        if (modals.length === 0) {
                            clearInterval(checkModal);
                            window.location.href = 'index.html';
                        }
                    }, 500);
                } else {
                    Modal.alert('❌ Failed to update handicaps. Please try again.');
                }
            });
        } else {
            Modal.alert('Handicap adjustment not available');
        }
    });
}

function loadHcpData() {
    if (!gameId) {
        showError('No game ID provided');
        return;
    }
    
    console.log("[HCP-ADJUST-PAGE] Loading game:", gameId);
    
    // v1.25: Restore cache if not already restored
    var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
    if (!cache) {
        console.log("[HCP-ADJUST-PAGE] No cache in memory - attempting restore from sessionStorage");
        restoreCacheFromSession();
        cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
        if (cache) {
            console.log("[HCP-ADJUST-PAGE] Cache restored successfully");
        }
    }
    
    if (typeof FirebaseRetry === 'undefined') {
        showError('FirebaseRetry not loaded');
        return;
    }
    
    WaitingScreen.show("Loading handicap data...");
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            WaitingScreen.hide();
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        WaitingScreen.hide();
        
        if (!doc.exists) {
            return loadFromHistory(gameId);
        }
        
        gameData = doc.data();
        console.log("[HCP-ADJUST-PAGE] Game loaded:", gameData);
        
        // Check if game is complete
        var signatures = gameData.signatures || {};
        var f1Signed = signatures.f1?.signed === true;
        var f2Signed = signatures.f2?.signed === true;
        
        if (!f1Signed || !f2Signed) {
            showError('Game is not complete. Please sign both cards first.');
            return;
        }
        
        // v1.26: Use initForViewer (correct API for standalone mode)
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.initForViewer) {
            // Get data from cache if available, otherwise from gameData
            var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
            var players = cache ? cache.players : (gameData.players || []);
            var results = cache ? cache.results : (gameData.results || {});
            var f1DataString = cache ? cache.f1DataString : (gameData.f1?.d || '');
            var f2DataString = cache ? cache.f2DataString : (gameData.f2?.d || '');
            var courseSi = cache ? cache.course?.si : (gameData.course?.si || []);
            var coursePar = cache ? cache.course?.par : (gameData.course?.par || []);
            var startingHole = cache ? cache.startingHole : (gameData.startingHole || 1);
            
            console.log("[HCP-ADJUST-PAGE] Calling HandicapAdjustment.initForViewer...");
            console.log("[HCP-ADJUST-PAGE] players:", players.length);
            console.log("[HCP-ADJUST-PAGE] f1DataString length:", f1DataString.length);
            console.log("[HCP-ADJUST-PAGE] f2DataString length:", f2DataString.length);
            
            // initForViewer renders the table directly
            HandicapAdjustment.initForViewer(
                gameId,
                players,
                f1DataString,
                f2DataString,
                courseSi,
                coursePar,
                startingHole,
                results
            );
            
            console.log("[HCP-ADJUST-PAGE] initForViewer called successfully");
        } else {
            showError('Handicap adjustment not available');
        }
    }).catch(function(err) {
        WaitingScreen.hide();
        console.error("[HCP-ADJUST-PAGE] Error:", err);
        showError(err.message || 'Failed to load game data');
    });
}

function loadFromHistory(gameId) {
    console.log("[HCP-ADJUST-PAGE] Trying to load from history:", gameId);
    
    var historyId = gameId + '_H';
    
    return FirebaseRetry.getDocument("historyGames", historyId, {
        onExit: function() {
            WaitingScreen.hide();
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        WaitingScreen.hide();
        
        if (!doc.exists) {
            showError('Game not found. Please return to the main menu.');
            return;
        }
        
        var historyData = doc.data();
        console.log("[HCP-ADJUST-PAGE] History data loaded:", historyData);
        
        // Extract game data from history record
        gameData = {
            players: historyData.players || [],
            results: historyData.results || {},
            signatures: historyData.signatures || { f1: { signed: true }, f2: { signed: true } },
            course: historyData.gameInfo?.course || {},
            date: historyData.gameInfo?.date || ''
        };
        
        // Use celebration data from sessionStorage
        var stored = sessionStorage.getItem('celebrationData');
        if (stored) {
            try {
                celebrationData = JSON.parse(stored);
            } catch(e) {
                console.warn("[HCP-ADJUST-PAGE] Failed to parse celebration data:", e);
            }
        }
        
        // v1.26: Use initForHistory for history mode
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.initForHistory) {
            HandicapAdjustment.initForHistory(gameId, historyId, 'view-game.html');
        } else if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.initForViewer) {
            // Fallback: use initForViewer with history data
            var cache = typeof GameLoader !== 'undefined' ? GameLoader.getLocalCache() : null;
            var players = cache ? cache.players : (gameData.players || []);
            var results = cache ? cache.results : (gameData.results || {});
            var f1DataString = cache ? cache.f1DataString : (gameData.f1?.d || '');
            var f2DataString = cache ? cache.f2DataString : (gameData.f2?.d || '');
            var courseSi = cache ? cache.course?.si : (gameData.course?.si || []);
            var coursePar = cache ? cache.course?.par : (gameData.course?.par || []);
            var startingHole = cache ? cache.startingHole : (gameData.startingHole || 1);
            
            HandicapAdjustment.initForViewer(
                gameId,
                players,
                f1DataString,
                f2DataString,
                courseSi,
                coursePar,
                startingHole,
                results
            );
        } else {
            showError('Handicap calculation not available');
        }
    }).catch(function(err) {
        WaitingScreen.hide();
        console.error("[HCP-ADJUST-PAGE] Error loading history:", err);
        showError(err.message || 'Failed to load history data');
    });
}

function init() {
    console.log("[HCP-ADJUST-PAGE] Initializing...");
    
    document.getElementById('deviceTag').textContent = '🏌️ ' + getDeviceName();
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    // v1.25: Restore cache from sessionStorage BEFORE loading
    var cacheRestored = restoreCacheFromSession();
    if (cacheRestored) {
        console.log("[HCP-ADJUST-PAGE] ✅ Cache ready for handicap calculation");
    } else {
        console.log("[HCP-ADJUST-PAGE] No cache in sessionStorage - will attempt to load from Firestore");
    }
    
    // Check for celebration data in sessionStorage
    var stored = sessionStorage.getItem('celebrationData');
    if (stored) {
        try {
            celebrationData = JSON.parse(stored);
            console.log("[HCP-ADJUST-PAGE] Celebration data restored from sessionStorage");
            console.log("  gameId:", celebrationData.gameId);
            console.log("  winner:", celebrationData.winner);
        } catch(e) {
            console.warn("[HCP-ADJUST-PAGE] Failed to parse celebration data:", e);
        }
    }
    
    // Check if this is history mode
    var urlParams = new URLSearchParams(window.location.search);
    var mode = urlParams.get('mode');
    fromHistoryMode = (mode === 'history');
    
    loadHcpData();
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
