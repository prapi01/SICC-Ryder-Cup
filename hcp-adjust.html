<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SICC Ryder Cup - HANDICAP ADJUSTMENT</title>
    
    <!-- Third-party libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Core dependencies -->
    <script src="js/firebase-config.js?v=1.32"></script>
    <script src="js/session.js?v=1.32"></script>
    <script src="js/settings.js?v=1.32"></script>
    <script src="js/modal.js?v=1.32"></script>
    <script src="js/waiting-screen.js?v=1.00"></script>
    
    <!-- WRV support -->
    <script src="js/wrv.js?v=1.02"></script>
    
    <script src="js/hcp-adjust.js?v=2.59"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .hcp-header {
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        
        .hcp-title {
            font-size: 24px;
            font-weight: 700;
            color: #4caf50;
            text-align: center;
            white-space: nowrap;
            margin: 0 auto;
        }
        
        #hcpTableContainer {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 12px;
            border: 2px solid #4caf50;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #hcpTableContainer.visible {
            opacity: 1;
        }
        
        #hcpTableContainer table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            min-width: 340px;
        }
        
        #hcpTableContainer th {
            padding: 12px 8px;
            text-align: center;
            font-size: 16px;
            background: #1a3a1a;
            color: #4caf50;
        }
        
        #hcpTableContainer th:first-child {
            text-align: left;
            width: 45px;
        }
        
        #hcpTableContainer th:nth-child(2) {
            width: 38px;
        }
        
        #hcpTableContainer th:nth-child(3) {
            width: 55px;
        }
        
        #hcpTableContainer th:nth-child(4) {
            width: 55px;
        }
        
        #hcpTableContainer th:nth-child(5) {
            width: 38px;
        }
        
        #hcpTableContainer td {
            padding: 10px 8px;
            text-align: center;
            font-size: 16px;
            border-bottom: 1px solid #333;
        }
        
        #hcpTableContainer td:first-child {
            text-align: left;
            font-size: 16px;
            font-weight: 600;
        }
        
        #hcpTableContainer .team-header td {
            padding: 6px 4px;
            text-align: center;
            color: #4caf50;
            font-weight: 700;
            font-size: 16px;
            background: #1a3a1a;
            border-top: 2px solid #000;
        }
        
        #hcpTableContainer .anchor-row td {
            color: #ffaa44;
            font-weight: 600;
            font-size: 16px;
        }
        
        #hcpTableContainer .final-zero td {
            color: #ffaa44;
            font-weight: 700;
            font-size: 16px;
        }
        
        .hcp-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .hcp-btn {
            flex: 1;
            min-width: 80px;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            border: 1px solid;
        }
        
        .hcp-btn:active {
            transform: scale(0.97);
        }
        
        .hcp-btn-close {
            background: #1a1a1a;
            border-color: #333;
            color: #ccc;
        }
        
        .hcp-btn-close:hover {
            background: #2a2a2a;
        }
        
        .debug {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="hcp-header">
        <div class="hcp-title">HANDICAP ADJUSTMENT</div>
    </div>
    
    <div id="hcpTableContainer"></div>
    
    <div class="hcp-buttons" id="hcpButtons"></div>
    
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.32</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[HCP-ADJUST-PAGE] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v1.32: Use initForHistory() instead of init()
// ============================================================
var APP_VERSION = "1.32";
var CACHE_KEY = "hcp_adjust_version_v132";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[HCP-ADJUST-PAGE] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.HCP_ADJUST_PAGE_VERSION = "1.32";
console.log("[HCP-ADJUST-PAGE] Initializing v1.32 - Using initForHistory()");

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var loadAttempted = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    console.log("[HCP-ADJUST-PAGE] gameId:", gameId);
}

// ============================================================
// v1.32: Render close button only
// ============================================================

function renderButtons() {
    var container = document.getElementById('hcpButtons');
    if (!container) return;
    
    var html = `
        <button class="hcp-btn hcp-btn-close" id="hcpCloseBtn">← Close</button>
    `;
    
    container.innerHTML = html;
    
    var closeBtn = document.getElementById('hcpCloseBtn');
    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            console.log("[HCP-ADJUST-PAGE] Close button clicked");
            // Return to history or main menu
            if (gameId) {
                window.location.href = 'view-history.html?gameId=' + gameId;
            } else {
                window.location.href = 'index.html';
            }
        });
    }
}

// ============================================================
// v1.32: Load handicap data from history record using initForHistory()
// ============================================================

function loadHcpData() {
    if (loadAttempted) {
        console.log("[HCP-ADJUST-PAGE] Load already attempted, skipping");
        return;
    }
    loadAttempted = true;
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    console.log("[HCP-ADJUST-PAGE] Loading handicap data for game:", gameId);
    
    // v1.32: Use initForHistory() for read-only display from historyGames
    if (typeof HandicapAdjustment !== 'undefined') {
        if (HandicapAdjustment.initForHistory) {
            HandicapAdjustment.initForHistory(gameId, null, 'view-history.html?gameId=' + gameId);
            console.log("[HCP-ADJUST-PAGE] HandicapAdjustment.initForHistory called");
        } else if (HandicapAdjustment.init) {
            // Fallback to init() if initForHistory not available
            HandicapAdjustment.init(gameId);
            console.log("[HCP-ADJUST-PAGE] HandicapAdjustment.init called (fallback)");
        } else {
            console.error("[HCP-ADJUST-PAGE] HandicapAdjustment not available");
            document.getElementById('debug').textContent = 'Error: HandicapAdjustment module not loaded';
            return;
        }
        
        // Show container when table renders
        var container = document.getElementById('hcpTableContainer');
        if (container) {
            var checkTable = setInterval(function() {
                if (container.querySelector('table')) {
                    container.classList.add('visible');
                    console.log("[HCP-ADJUST-PAGE] Table detected, container shown");
                    clearInterval(checkTable);
                }
            }, 100);
            setTimeout(function() {
                clearInterval(checkTable);
                if (!container.classList.contains('visible')) {
                    container.classList.add('visible');
                    console.log("[HCP-ADJUST-PAGE] Timeout - container shown anyway");
                }
            }, 5000);
        }
        
        renderButtons();
    } else {
        console.error("[HCP-ADJUST-PAGE] HandicapAdjustment not defined");
        document.getElementById('debug').textContent = 'Error: HandicapAdjustment module not loaded';
    }
}

// ============================================================
// init
// ============================================================

function init() {
    console.log("[HCP-ADJUST-PAGE] Initializing...");
    
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    try {
        if (typeof SessionManager !== 'undefined' && typeof SessionManager.getShortNameOnly === 'function') {
            var deviceName = SessionManager.getShortNameOnly();
            document.getElementById('deviceTag').textContent = '🏌️ ' + (deviceName || 'DEV-??');
        } else {
            document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
        }
    } catch(e) {
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    }
    
    loadHcpData();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
