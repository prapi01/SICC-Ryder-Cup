<body>

<div class="container" id="mainContainer">
    <div class="hcp-header">
        <div class="hcp-title">🏌️ HANDICAP ADJUSTMENT</div>
        <div class="hcp-subtitle" id="gameInfo">Loading...</div>
    </div>

        <div class="loading-placeholder">⛳ Loading handicap data...</div>

    <div class="hcp-buttons" id="hcpButtons">
        <!-- Buttons rendered by JavaScript -->
    </div>
    
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.04</div>

<script>
// ============================================================
// VERSION CACHE-BUSTING - Preserve all query parameters
// ============================================================
var APP_VERSION = "1.04";
var CACHE_KEY = "hcp_adjust_version_v104";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    var currentParams = new URLSearchParams(window.location.search);
    var newUrl = window.location.pathname + "?v=" + APP_VERSION;
    
    currentParams.forEach(function(value, key) {
        if (key !== 'v') {
            newUrl += "&" + key + "=" + encodeURIComponent(value);
        }
    });
    
    console.log("[HCP-ADJUST-PAGE] Cache-busting redirect:", newUrl);
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.HCP_ADJUST_PAGE_VERSION = "1.04";
console.log("[HCP-ADJUST-PAGE] Initializing v1.04 - Fixed load timing");

// ============================================================
// Main Logic
// ============================================================

var gameId = null;
var isReadOnly = false;
var returnToHistory = false;
var loadAttempted = false;

function getUrlParams() {
    var params = new URLSearchParams(window.location.search);
    gameId = params.get('gameId');
    var mode = params.get('mode');
    isReadOnly = (mode === 'readonly' || mode === 'history');
    returnToHistory = (mode === 'history');
    console.log("[HCP-ADJUST-PAGE] gameId:", gameId, "mode:", mode);
}

function renderButtons(anchorName) {
    var container = document.getElementById('hcpButtons');
    if (!container) return;
    
    var html = '';
    
    if (isReadOnly) {
        if (returnToHistory) {
            html = '<button class="hcp-btn hcp-btn-close" id="hcpBackBtn">← Close</button>';
        } else {
            html = '<button class="hcp-btn hcp-btn-back" id="hcpBackBtn">← Back</button>';
        }
    } else {
        html = `
            <button class="hcp-btn hcp-btn-scorecard" id="backToScorecardBtn">📋 Scorecard</button>
            <button class="hcp-btn hcp-btn-celebration" id="celebrationBtn">🎉</button>
            <button class="hcp-btn hcp-btn-menu" id="mainMenuBtn">🏠 Main Menu</button>
        `;
    }
    
    container.innerHTML = html;
    
    if (!isReadOnly) {
        var scorecardBtn = document.getElementById('backToScorecardBtn');
        if (scorecardBtn) {
            scorecardBtn.addEventListener('click', function() {
                if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
                    WaitingScreen.show("Loading Scorecard...");
                }
                window.location.href = 'view-game.html?gameId=' + gameId;
            });
        }
        
        var celebrationBtn = document.getElementById('celebrationBtn');
        if (celebrationBtn) {
            celebrationBtn.addEventListener('click', function() {
                if (typeof WaitingScreen !== 'undefined' && WaitingScreen.show) {
                    WaitingScreen.show("Loading Celebration...");
                }
                if (typeof SignCard !== 'undefined' && SignCard.replayCelebration) {
                    SignCard.replayCelebration();
                } else {
                    alert('Celebration screen not available');
                    if (typeof WaitingScreen !== 'undefined' && WaitingScreen.hide) {
                        WaitingScreen.hide();
                    }
                }
            });
        }
        
        var mainMenuBtn = document.getElementById('mainMenuBtn');
        if (mainMenuBtn) {
            mainMenuBtn.addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        }
    } else {
        var backBtn = document.getElementById('hcpBackBtn');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                if (returnToHistory) {
                    window.location.href = 'view-history.html?gameId=' + gameId;
                } else {
                    window.history.back();
                }
            });
        }
    }
}

// ============================================================
// v1.04: DIRECT LOAD - same logic that works in console
// ============================================================

function loadHcpData() {
    if (loadAttempted) {
        console.log("[HCP-ADJUST-PAGE] Load already attempted, skipping");
        return;
    }
    loadAttempted = true;
    
    if (!gameId) {
        document.getElementById('gameInfo').textContent = 'Error: No game ID provided';
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    console.log("[HCP-ADJUST-PAGE] Loading game:", gameId);
    document.getElementById('gameInfo').textContent = 'Loading game data...';
    
    if (typeof GameLoader === 'undefined' || typeof GameLoader.loadGame !== 'function') {
        console.error("[HCP-ADJUST-PAGE] GameLoader not available");
        document.getElementById('debug').textContent = 'Error: GameLoader not loaded';
        // Retry once
        setTimeout(function() {
            loadAttempted = false;
            loadHcpData();
        }, 1000);
        return;
    }
    
    // v1.04: EXACT same logic that works in console
    GameLoader.loadGame(gameId, 'scheduledGames', function(result) {
        if (!result.success) {
            console.error("[HCP-ADJUST-PAGE] Failed to load game:", result.error);
            document.getElementById('gameInfo').textContent = 'Error loading game';
            document.getElementById('debug').textContent = 'Error: ' + result.error;
            return;
        }
        
        var cache = result.cache;
        if (!cache) {
            document.getElementById('debug').textContent = 'Error: No cache data';
            return;
        }
        
        document.getElementById('gameInfo').textContent = cache.course?.name || 'Unknown Course';
        
        console.log("[HCP-ADJUST-PAGE] Cache loaded, players:", cache.players ? cache.players.length : 0);
        
        if (typeof HandicapAdjustment !== 'undefined' && HandicapAdjustment.initForViewer) {
            HandicapAdjustment.initForViewer(
                gameId,
                cache.players || [],
                cache.f1DataString || '',
                cache.f2DataString || '',
                cache.course?.si || [],
                cache.course?.par || [],
                cache.startingHole || 1,
                cache.results || null
            );
            console.log("[HCP-ADJUST-PAGE] HandicapAdjustment.initForViewer called");
            
            // Render buttons
            var anchorName = 'Anchor';
            if (cache.players && cache.players.length > 0) {
                var sorted = cache.players.slice().sort(function(a, b) { return a.handicap - b.handicap; });
                anchorName = sorted[0]?.name || 'Anchor';
            }
            renderButtons(anchorName);
        } else {
            console.error("[HCP-ADJUST-PAGE] HandicapAdjustment.initForViewer not available");
            document.getElementById('debug').textContent = 'Error: HandicapAdjustment module not loaded';
        }
    });
}

// ============================================================
// v1.04: Initialize - call load directly when DOM is ready
// ============================================================

function init() {
    console.log("[HCP-ADJUST-PAGE] Initializing...");
    getUrlParams();
    
    if (!gameId) {
        document.getElementById('gameInfo').textContent = 'Error: No game ID provided';
        document.getElementById('debug').textContent = 'Error: No game ID in URL';
        return;
    }
    
    SessionManager.getShortNameOnly().then(function(name) {
        document.getElementById('deviceTag').textContent = '🏌️ ' + name;
    }).catch(function() {
        document.getElementById('deviceTag').textContent = '🏌️ DEV-??';
    });
    
    // v1.04: Call load directly - no setTimeout delay
    loadHcpData();
}

// v1.04: Run init when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
