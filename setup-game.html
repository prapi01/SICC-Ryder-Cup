<!-- FILE: setup-game.html - VERSION 1.10 -->
<!-- Schedule a real Ryder Cup game -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Setup Game - SICC Ryder Cup</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(145deg, #0a1a0a 0%, #000000 100%);
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; 
            color: #ffffff; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .version-tag { 
            position: fixed; 
            top: 8px; 
            right: 8px; 
            font-size: 0.65rem; 
            color: #4caf50; 
            background: rgba(0,0,0,0.6); 
            padding: 2px 10px; 
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.8;
        }
        
        .device-tag {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 1.8rem; font-weight: 800; color: #4caf50; }
        .subtitle { font-size: 0.8rem; color: #888; margin-top: 4px; }
        
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #4caf50; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #4caf50; }
        
        .players-grid {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .team-section { margin-bottom: 20px; }
        .team-title { 
            font-size: 1rem; 
            font-weight: 700; 
            margin-bottom: 12px; 
            padding-bottom: 6px; 
            border-bottom: 2px solid;
            text-align: center;
        }
        .team-title.team-a { color: #4caf50; border-bottom-color: #4caf50; }
        .team-title.team-b { color: #ff6b6b; border-bottom-color: #ff6b6b; }
        
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #1a1a1a;
            border-radius: 10px;
        }
        .player-name { font-weight: 500; color: #fff; }
        .player-handicap { font-size: 0.8rem; color: #4caf50; background: rgba(76,175,80,0.2); padding: 2px 8px; border-radius: 20px; }
        .player-label { font-size: 0.7rem; color: #888; font-family: monospace; }
        
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(145deg, #1a3a1a 0%, #0d2a0d 100%);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        .btn-secondary {
            background: rgba(26,26,26,0.9);
            border: 1px solid #333;
            color: #ccc;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        .alert-success { background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; }
        .alert-error { background: #3a1a1a; border: 1px solid #ff6b6b; color: #ff6b6b; }
        .alert-info { background: #1a1a3a; border: 1px solid #4caf50; color: #4caf50; }
        
        .loading { text-align: center; padding: 40px; color: #888; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.6rem; color: #444; }
        
        .course-selector {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .course-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .course-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .course-btn.selected {
            background: #1a3a1a;
            border-color: #4caf50;
            color: #4caf50;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v1.10</div>

<script>
// FILE: setup-game.html - VERSION 1.10
// Creates REAL game documents with CONSOLIDATED structure
// FIX: Restored Team A/B player display

var VERSION = "1.10";
var CACHE_KEY = "setup_game_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var courses = [];

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

// Default players (SICC Ryder Cup teams)
var DEFAULT_PLAYERS = [
    { name: "Ang CH", team: "A", flight: 1, handicap: 1, label: "ACH" },
    { name: "Kenneth Foo", team: "A", flight: 1, handicap: 3, label: "KF" },
    { name: "Jeff Goh", team: "B", flight: 1, handicap: 0, label: "JG" },
    { name: "Ong C B", team: "B", flight: 1, handicap: 1, label: "OCB" },
    { name: "C K", team: "A", flight: 2, handicap: 8, label: "CK" },
    { name: "Yip H M", team: "A", flight: 2, handicap: 12, label: "YHM" },
    { name: "Piti", team: "B", flight: 2, handicap: 8, label: "P" },
    { name: "James Ong", team: "B", flight: 2, handicap: 11, label: "JO" }
];

// Generate default data string (all F, all scores = par)
function generateDefaultData(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    var deviceTag = document.getElementById("deviceTag");
    if (deviceTag) deviceTag.innerHTML = deviceDisplay;
}

function loadCourses() {
    return db.collection("courses").get().then(function(snapshot) {
        courses = [];
        snapshot.forEach(function(doc) {
            courses.push({ id: doc.id, name: doc.data().name, par: doc.data().par, si: doc.data().si });
        });
        return courses;
    });
}

function saveGame(date, courseId) {
    var selectedCourse = courses.find(function(c) { return c.id === courseId; });
    if (!selectedCourse) {
        alert("Please select a course");
        return;
    }
    
    var defaultData = generateDefaultData(selectedCourse.par);
    
    // CONSOLIDATED STRUCTURE - everything in ONE document
    var gameData = {
        date: date,
        course: {
            name: selectedCourse.name,
            par: selectedCourse.par,
            si: selectedCourse.si
        },
        players: DEFAULT_PLAYERS,
        status: "scheduled",
        gameType: "real",
        
        // Flight 1 data (scores, saveEvent, crossEvent)
        f1: {
            d: defaultData,
            se: false,
            x: false
        },
        
        // Flight 2 data (scores, saveEvent, crossEvent)
        f2: {
            d: defaultData,
            se: false,
            x: false
        },
        
        // Role locks (stored here, not in separate collection)
        locks: {
            f1: null,
            f2: null
        },
        
        // Optional: track current hole per flight
        currentHoleF1: 1,
        currentHoleF2: 1,
        
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection("scheduledGames").add(gameData).then(function(docRef) {
        console.log("Game created with ID:", docRef.id);
        showAlert("success", "Game scheduled successfully!");
        setTimeout(function() {
            window.location.href = "admin.html";
        }, 1500);
    }).catch(function(error) {
        console.error("Error creating game:", error);
        showAlert("error", "Error creating game: " + error.message);
    });
}

function showAlert(type, message) {
    var alertDiv = document.createElement("div");
    alertDiv.className = "alert alert-" + type;
    alertDiv.innerHTML = message;
    var container = document.querySelector(".container");
    var form = document.getElementById("gameForm");
    container.insertBefore(alertDiv, form);
    setTimeout(function() {
        alertDiv.remove();
    }, 3000);
}

function render() {
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, '0');
    var dd = String(today.getDate()).padStart(2, '0');
    var defaultDate = yyyy + "-" + mm + "-" + dd;
    
    // Separate players by team for display
    var teamAPlayers = DEFAULT_PLAYERS.filter(function(p) { return p.team === "A"; });
    var teamBPlayers = DEFAULT_PLAYERS.filter(function(p) { return p.team === "B"; });
    
    var teamAHtml = '';
    for (var i = 0; i < teamAPlayers.length; i++) {
        var p = teamAPlayers[i];
        teamAHtml += `
            <div class="player-row">
                <span class="player-name">${escapeHtml(p.name)}</span>
                <span class="player-handicap">HCP ${p.handicap}</span>
                <span class="player-label">${p.label}</span>
            </div>
        `;
    }
    
    var teamBHtml = '';
    for (var i = 0; i < teamBPlayers.length; i++) {
        var p = teamBPlayers[i];
        teamBHtml += `
            <div class="player-row">
                <span class="player-name">${escapeHtml(p.name)}</span>
                <span class="player-handicap">HCP ${p.handicap}</span>
                <span class="player-label">${p.label}</span>
            </div>
        `;
    }
    
    var html = `
        <div class="header">
            <div class="title">⛳ SCHEDULE REAL GAME</div>
            <div class="subtitle">Set up a new Ryder Cup match</div>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="gameForm">
            <div class="form-group">
                <label class="form-label">📅 GAME DATE</label>
                <input type="date" class="form-input" id="gameDate" value="${defaultDate}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">🏟️ COURSE</label>
                <div id="courseButtons" class="course-buttons">Loading courses...</div>
            </div>
            
            <div class="players-grid">
                <div class="team-section">
                    <div class="team-title team-a">🇸🇬 TEAM A</div>
                    ${teamAHtml}
                </div>
                <div class="team-section">
                    <div class="team-title team-b">🌍 TEAM B</div>
                    ${teamBHtml}
                </div>
                <div style="font-size:0.7rem; color:#555; text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #222;">
                    Flight 1: Ang CH, Kenneth Foo, Jeff Goh, Ong C B | Flight 2: C K, Yip H M, Piti, James Ong
                </div>
            </div>
            
            <div class="action-buttons">
                <button type="button" class="btn btn-secondary" id="cancelBtn">← CANCEL</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">✅ SAVE GAME</button>
            </div>
        </form>
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
    
    // Load courses and render buttons
    loadCourses().then(function() {
        var courseContainer = document.getElementById("courseButtons");
        if (courseContainer && courses.length > 0) {
            var buttonsHtml = '';
            for (var i = 0; i < courses.length; i++) {
                var selected = (i === 0) ? 'selected' : '';
                buttonsHtml += `<div class="course-btn ${selected}" data-course-id="${courses[i].id}">${escapeHtml(courses[i].name)}</div>`;
            }
            courseContainer.innerHTML = buttonsHtml;
            
            document.querySelectorAll('.course-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.course-btn').forEach(function(b) { b.classList.remove('selected'); });
                    this.classList.add('selected');
                });
            });
        } else {
            courseContainer.innerHTML = '<div class="alert alert-info">No courses found. Please add courses in Course Management first.</div>';
        }
    }).catch(function(err) {
        console.error("Error loading courses:", err);
        document.getElementById("courseButtons").innerHTML = '<div class="alert alert-error">Error loading courses. Please refresh.</div>';
    });
    
    document.getElementById("gameForm").addEventListener("submit", function(e) {
        e.preventDefault();
        var gameDate = document.getElementById("gameDate").value;
        var selectedCourseBtn = document.querySelector('.course-btn.selected');
        if (!selectedCourseBtn) {
            showAlert("error", "Please select a course");
            return;
        }
        var courseId = selectedCourseBtn.dataset.courseId;
        saveGame(gameDate, courseId);
    });
    
    document.getElementById("cancelBtn").addEventListener("click", function() {
        window.location.href = "admin.html";
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("setup-game.html", "admin.html", function(session) {
    console.log("Session initialized:", session);
    displayDeviceId();
    render();
});
</script>
</body>
</html>
