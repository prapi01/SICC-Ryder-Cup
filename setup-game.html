// Generate Short Game ID
// Format: GM_YYMMDD_HHMM_XX
// ============================================================

function generateGameId() {
    var now = new Date();
    var yy = String(now.getFullYear()).slice(-2);
    var mm = String(now.getMonth() + 1).padStart(2, '0');
    var dd = String(now.getDate()).padStart(2, '0');
    var yymmdd = yy + mm + dd;
    var hh = String(now.getHours()).padStart(2, '0');
    var min = String(now.getMinutes()).padStart(2, '0');
    var hhmm = hh + min;
    var random = String(Math.floor(Math.random() * 100)).padStart(2, '0');
    return 'GM_' + yymmdd + '_' + hhmm + '_' + random;
}

// ============================================================
// v1.29: AUTO-ARCHIVE OLD GAMES
// - 90+ days old: Move to trashGames collection, delete from scheduledGames
// - 180+ days old: Permanently delete from trashGames
// ============================================================

function archiveOldGames() {
    if (!firestoreReady) return;
    
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    
    // 90 days ago
    var ninetyDaysAgo = new Date(today);
    ninetyDaysAgo.setDate(ninetyDaysAgo.getDate() - 90);
    var ninetyDaysAgoStr = ninetyDaysAgo.toISOString().split('T')[0];
    
    // 180 days ago
    var oneEightyDaysAgo = new Date(today);
    oneEightyDaysAgo.setDate(oneEightyDaysAgo.getDate() - 180);
    var oneEightyDaysAgoStr = oneEightyDaysAgo.toISOString().split('T')[0];
    
    // Step 1: Permanently delete games older than 180 days from trashGames
    console.log("Checking trashGames for games older than 180 days (date < " + oneEightyDaysAgoStr + ")");
    db.collection("trashGames")
        .where("date", "<", oneEightyDaysAgoStr)
        .get()
        .then(function(snapshot) {
            var deletePromises = [];
            snapshot.forEach(function(doc) {
                console.log("Permanently deleting from trash:", doc.id, "date:", doc.data().date);
                deletePromises.push(db.collection("trashGames").doc(doc.id).delete());
            });
            return Promise.all(deletePromises);
        })
        .then(function() {
            console.log("Permanent deletion from trash complete");
        })
        .catch(function(e) {
            console.warn("Error deleting from trash:", e);
        });
    
    // Step 2: Move games older than 90 days from scheduledGames to trashGames
    console.log("Checking scheduledGames for games older than 90 days (date < " + ninetyDaysAgoStr + ")");
    db.collection("scheduledGames")
        .where("date", "<", ninetyDaysAgoStr)
        .get()
        .then(function(snapshot) {
            var movePromises = [];
            snapshot.forEach(function(doc) {
                var data = doc.data();
                var gameId = doc.id;
                console.log("Moving to trash:", gameId, "date:", data.date);
                
                // Add trash metadata
                data._trashedAt = firebase.firestore.FieldValue.serverTimestamp();
                data._originalCollection = "scheduledGames";
                data._originalId = gameId;
                
                // Write to trashGames
                var movePromise = db.collection("trashGames").doc(gameId).set(data)
                    .then(function() {
                        // Delete from scheduledGames
                        return db.collection("scheduledGames").doc(gameId).delete();
                    });
                movePromises.push(movePromise);
            });
            return Promise.all(movePromises);
        })
        .then(function() {
            console.log("Old games moved to trash complete");
        })
        .catch(function(e) {
            console.warn("Error moving games to trash:", e);
        });
}

function generateLabel(name) {
    if (!name) return "???";
    var parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    if (parts.length === 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    var label = "";
    for (var i = 0; i < Math.min(3, parts.length); i++) label += parts[i].charAt(0);
    return label.toUpperCase();
}

function generateDefaultDataNatural(parArray) {
    var result = "";
    for (var hole = 1; hole <= 18; hole++) {
        var par = parArray[hole - 1];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function rotateDataString(naturalData, startingHole) {
    if (startingHole === 1) return naturalData;
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    var rotated = [];
    for (var i = startingHole - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHole - 1; i++) rotated.push(blocks[i]);
    return rotated.join('');
}

function captureInitialFormState() {
    var datePicker = document.getElementById("datePicker");
    var courseSelect = document.getElementById("courseSelect");
    var shotgunHoleSelect = document.getElementById("shotgunHoleSelect");
    var tournamentRadio = document.getElementById("formatTournament");

        startingHole: state.startingHole,

        teamGameFormat: state.teamGameFormat,

    };
    
    isDirty = false;
    console.log("[DIRTY] Initial state captured");

function checkForChanges() {
    if (!state.isEditMode) return false;
    
    var datePicker = document.getElementById("datePicker");
    var courseSelect = document.getElementById("courseSelect");
    
    var currentDate = datePicker ? datePicker.value : "";
    var currentCourseId = state.selectedCourseId;
    var currentStartingHole = state.startingHole;
    var currentStartingHoleType = state.startingHoleType;
    var currentTeamGameFormat = state.teamGameFormat;
    
    var playersChanged = false;
    if (initialFormState && initialFormState.players) {
        if (state.players.length !== initialFormState.players.length) {
            playersChanged = true;
        } else {
            for (var i = 0; i < state.players.length; i++) {
                var current = state.players[i];
                var initial = initialFormState.players[i];
                if (current.name !== initial.name ||
                    current.handicap !== initial.handicap ||
                    current.team !== initial.team ||
                    current.flight !== initial.flight) {
                    playersChanged = true;
                    break;
                }
            }
        }
    }
    
    var wasDirty = isDirty;
    isDirty = (currentDate !== initialFormState?.date ||
               currentCourseId !== initialFormState?.courseId ||
               currentStartingHole !== initialFormState?.startingHole ||
               currentStartingHoleType !== initialFormState?.startingHoleType ||
               currentTeamGameFormat !== initialFormState?.teamGameFormat ||
               playersChanged);
    
    if (wasDirty !== isDirty) {
        console.log("[DIRTY] Changed:", isDirty);
    }
    
    return isDirty;
}

function attachBeforeUnloadHandler() {
    if (beforeUnloadHandlerAttached) return;
    
    window.addEventListener('beforeunload', function(e) {
        if (state.isEditMode && isDirty) {
            e.preventDefault();
            e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
            return e.returnValue;
        }
    });
    beforeUnloadHandlerAttached = true;
}

}

function loadDefaultPlayers(callback) {
    if (!firestoreReady) {
        console.warn("Firebase not ready, using fallback");
        state.players = HARDCODED_FALLBACK_PLAYERS.map(function(p) {
            return {
                name: p.name,
                handicap: p.handicap,
                team: p.team,
                flight: p.flight,
                label: generateLabel(p.name)
            };
        });
        if (callback) callback();
        return;
    }
    
    db.collection("playerInformation").doc("defaultPlayers").get()
        .then(function(doc) {
            if (doc.exists && doc.data().players && doc.data().players.length === 8) {
                var savedPlayers = doc.data().players;
                state.players = savedPlayers.map(function(p) {
                    return {
                        name: p.name,
                        handicap: p.handicap,
                        team: p.team,
                        flight: p.flight,
                        label: generateLabel(p.name)
                    };
                });
                console.log("Loaded default players from Firebase");
            } else {
                console.log("No default players found, using fallback");
                state.players = HARDCODED_FALLBACK_PLAYERS.map(function(p) {
                    return {
                        name: p.name,
                        handicap: p.handicap,
                        team: p.team,
                        flight: p.flight,
                        label: generateLabel(p.name)
                    };
                });
            }
            if (callback) callback();
        })
        .catch(function(e) {
            console.warn("Error loading default players:", e);
            state.players = HARDCODED_FALLBACK_PLAYERS.map(function(p) {
                return {
                    name: p.name,
                    handicap: p.handicap,
                    team: p.team,
                    flight: p.flight,
                    label: generateLabel(p.name)
                };
            });
            if (callback) callback();
        });
}

function saveAsDefaultPlayers(players, callback) {
    if (!firestoreReady) {
        if (callback) callback(false);
        return;
    }
    
    var playersToSave = [...players];
    playersToSave.sort(function(a, b) {
        if (a.team !== b.team) return a.team === "A" ? -1 : 1;
        if (a.flight !== b.flight) return a.flight - b.flight;
        return a.handicap - b.handicap;
    });
    
    var playersForStorage = playersToSave.map(function(p) {
        return {
            name: p.name,
            handicap: p.handicap,
            team: p.team,
            flight: p.flight
        };
    });
    
    db.collection("playerInformation").doc("defaultPlayers").set({
        players: playersForStorage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
        console.log("Default players saved to Firebase");
        if (callback) callback(true);
    }).catch(function(e) {
        console.error("Error saving default players:", e);
        if (callback) callback(false);
    });
}

function loadEditMode(callback) {
    var urlParams = new URLSearchParams(window.location.search);
    var mode = urlParams.get('mode');
    
    if (mode === 'edit') {
        state.isEditMode = true;
        var editData = sessionStorage.getItem("editGameData");
        if (editData) {
            var gameData = JSON.parse(editData);
            state.editingGameId = gameData.id;
            state.editDate = gameData.date;
            
            if (gameData.course) {
                state.selectedCourseId = gameData.course.id;
                state.selectedCourseData = gameData.course;
            }
            
            if (gameData.startingHole) {
                state.startingHole = gameData.startingHole;
                if (state.startingHole === 1) {
                    state.startingHoleType = "hole1";
                } else if (state.startingHole === 10) {
                    state.startingHoleType = "hole10";
                } else {
                    state.startingHoleType = "shotgun";
                }
            }
            
            if (gameData.teamGameFormat) {
                state.teamGameFormat = gameData.teamGameFormat;
            } else {
                state.teamGameFormat = "tournament";
            }
            
            if (gameData.players && gameData.players.length === 8) {
                state.players = gameData.players.map(function(p) {
                    return {
                        name: p.name,
                        handicap: p.handicap,
                        team: p.team,
                        flight: p.flight,
                        label: generateLabel(p.name)
                    };
                });
            } else {
                loadDefaultPlayers(callback);
                return;
            }
            
            sessionStorage.removeItem("editGameData");
            if (callback) callback();
        } else {
            loadDefaultPlayers(callback);
        }
    } else {
        loadDefaultPlayers(callback);
    }
}

function loadCourses(callback) {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Firebase connection failed. Please check internet.</div>';
        return;
    }
    
    db.collection("courses").get().then(function(snapshot) {
        var courses = [];
        snapshot.forEach(function(doc) {
            courses.push({ id: doc.id, name: doc.data().name, par: doc.data().par, si: doc.data().si });
        });
        courses.sort(function(a, b) {
            var nameA = a.name.toLowerCase();
            var nameB = b.name.toLowerCase();
            if (nameA < nameB) return -1;
            if (nameA > nameB) return 1;
            return 0;
        });
        state.courses = courses;
        
        if (!state.isEditMode || !state.selectedCourseId) {
            if (courses.length > 0) {
                state.selectedCourseId = courses[0].id;
                state.selectedCourseData = courses[0];
            }
        }
        
        if (callback) callback();
    }).catch(function(e) { 
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading courses: ' + e.message + '</div>';
    });
}

function updatePlayerName(idx, value) {
    state.players[idx].name = value;
    state.players[idx].label = generateLabel(value);
    if (state.isEditMode) checkForChanges();
    render();
}

function updatePlayerHandicap(idx, value) {
    state.players[idx].handicap = parseInt(value) || 0;
    if (state.isEditMode) checkForChanges();
    render();
}

function updatePlayerTeam(idx, value) {
    state.players[idx].team = value;
    if (state.isEditMode) checkForChanges();
    render();
}

function updatePlayerFlight(idx, value) {
    state.players[idx].flight = parseInt(value);
    if (state.isEditMode) checkForChanges();
    render();
}

function setTeamGameFormat(format) {
    state.teamGameFormat = format;
    if (state.isEditMode) checkForChanges();
    render();
}

function validateTeamFlight() {
    var flight1A = state.players.filter(function(p) { return p.flight === 1 && p.team === "A"; }).length;
    var flight1B = state.players.filter(function(p) { return p.flight === 1 && p.team === "B"; }).length;
    var flight2A = state.players.filter(function(p) { return p.flight === 2 && p.team === "A"; }).length;
    var flight2B = state.players.filter(function(p) { return p.flight === 2 && p.team === "B"; }).length;
    return flight1A === 2 && flight1B === 2 && flight2A === 2 && flight2B === 2;
}

function validateDate(dateStr) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var selectedDate = new Date(dateStr);
    selectedDate.setHours(0, 0, 0, 0);
    
    var maxDate = new Date();
    maxDate.setMonth(maxDate.getMonth() + 12);
    maxDate.setHours(0, 0, 0, 0);
    
    if (selectedDate < today) {
        return "Date must be today or in the future";
    }
    if (selectedDate > maxDate) {
        return "Date cannot be more than 12 months in the future";
    }
    return null;
}

function setStartingHole(type, value) {
    state.startingHoleType = type;
    if (type === "hole1") {
        state.startingHole = 1;
    } else if (type === "hole10") {
        state.startingHole = 10;
    } else if (type === "shotgun") {
        state.startingHole = value || 1;
    }
    if (state.isEditMode) checkForChanges();
    render();
}

// ============================================================
// v1.30: commitGame() - PIN for UPDATE only, NO PIN for CREATE
// ============================================================

function commitGame() {
    // Validate form first
    var dateInput = document.getElementById("datePicker");
    var selectedDate = dateInput ? dateInput.value : "";
    
    var dateError = validateDate(selectedDate);
    if (dateError) {
        state.dateError = dateError;
        render();
        return;
    }
    
    if (!validateTeamFlight()) {
        Modal.alert("Each flight needs exactly 2 Team A and 2 Team B players");
        return;
    }
    
    if (!state.selectedCourseData) {
        Modal.alert("Please select a course");
        return;
    }
    
    // ✅ For EDIT (UPDATE) - require PIN before saving
    if (state.isEditMode) {
        AuthPin.requireAuth('update', state.editingGameId, null, function() {
            // This callback runs after successful PIN authentication
            proceedWithCommit();
        });
    } else {
        // ✅ For CREATE (new game) - NO PIN needed
        proceedWithCommit();
    }
}

// ============================================================
// v1.30: proceedWithCommit() - extracted save logic
// ============================================================

function proceedWithCommit() {
    var zeroHandicapPlayers = state.players.filter(function(p) { return p.handicap === 0; });
    
    var anchorCallback = function(selectedAnchor) {
        if (state.editingGameId) {
            updateExistingGame(selectedAnchor);
        } else {
            createNewGame(selectedAnchor);
        }
    };
    
    if (zeroHandicapPlayers.length > 1) {
        showAnchorSelectionModal(zeroHandicapPlayers, anchorCallback);
    } else {
        var sortedByHcp = [...state.players].sort(function(a, b) { return a.handicap - b.handicap; });
        var defaultAnchor = sortedByHcp[0];
        anchorCallback(defaultAnchor);
    }
}

function createNewGame(anchorPlayer) {
    var naturalData = generateDefaultDataNatural(state.selectedCourseData.par);
    var rotatedData = rotateDataString(naturalData, state.startingHole);
    var emptyResults = initializeEmptyResults();
    
    var gameData = {
        date: document.getElementById("datePicker").value,
        course: state.selectedCourseData,
        players: state.players.map(function(p) {
            return {
                name: p.name,
                handicap: p.handicap,
                team: p.team,
                flight: p.flight,
                label: p.label
            };
        }),
        status: "scheduled",
        gameType: "real",
        startingHole: state.startingHole,
        teamGameFormat: state.teamGameFormat,
        anchor: anchorPlayer.name,
        updatedAt: new Date().toISOString(),
        
        f1: {
            d: rotatedData,
            se: false,
            x: false
        },
        f2: {
            d: rotatedData,
            se: false,
            x: false
        },
        
        locks: {
            f1: null,
            f2: null
        },
        
        currentHoleF1: 1,
        currentHoleF2: 1,
        
        results: emptyResults
    };
    
    gameData.createdAt = new Date().toISOString();
    var newGameId = generateGameId();
    
    db.collection("scheduledGames").doc(newGameId).set(gameData).then(function() {
        saveAsDefaultPlayers(state.players, function(saveSuccess) {
            if (saveSuccess) {
                console.log("Default players updated successfully");
            } else {
                console.warn("Failed to save default players, but game was created");
            }
            SessionManager.addNavigationHistory("admin.html", "game_created", { gameId: newGameId });
            document.getElementById("successMsg").style.display = "block";
            setTimeout(function() {
                window.location.href = "admin.html";
            }, 1500);
        });
    }).catch(function(e) {
        Modal.alert("Error saving game: " + e.message);
    });
}

function updateExistingGame(anchorPlayer) {
    db.collection("scheduledGames").doc(state.editingGameId).get().then(function(doc) {
        if (!doc.exists) {
            Modal.alert("Game not found. Cannot update.");
            return;
        }
        
        var existingData = doc.data();
        
        var updatePayload = {
            date: document.getElementById("datePicker").value,
            course: state.selectedCourseData,
            players: state.players.map(function(p) {
                return {
                    name: p.name,
                    handicap: p.handicap,
                    team: p.team,
                    flight: p.flight,
                    label: p.label
                };
            }),
            startingHole: state.startingHole,
            teamGameFormat: state.teamGameFormat,
            anchor: anchorPlayer.name,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            
            f1: existingData.f1 || { d: "", se: false, x: false },
            f2: existingData.f2 || { d: "", se: false, x: false },
            results: existingData.results || null,
            currentHoleF1: existingData.currentHoleF1 || 1,
            currentHoleF2: existingData.currentHoleF2 || 1,
            locks: existingData.locks || { f1: null, f2: null },
            signatures: existingData.signatures || { f1: false, f2: false },
            submitted: existingData.submitted || { f1: false, f2: false },
            gameStarted: existingData.gameStarted || false
        };
        
        var courseChanged = (existingData.course && existingData.course.id !== state.selectedCourseData.id);
        if (courseChanged) {
            var naturalData = generateDefaultDataNatural(state.selectedCourseData.par);
            var rotatedData = rotateDataString(naturalData, state.startingHole);
            updatePayload.f1 = { d: rotatedData, se: false, x: false };
            updatePayload.f2 = { d: rotatedData, se: false, x: false };
            updatePayload.results = initializeEmptyResults();
            updatePayload.currentHoleF1 = 1;
            updatePayload.currentHoleF2 = 1;
        }
        
        var startingHoleChanged = (existingData.startingHole !== state.startingHole);
        if (startingHoleChanged && !courseChanged && existingData.f1 && existingData.f1.d) {
            Modal.confirm(
                "Changing starting hole will reset all scores to par. Continue?",
                function() {
                    var naturalData = generateDefaultDataNatural(state.selectedCourseData.par);
                    var rotatedData = rotateDataString(naturalData, state.startingHole);
                    updatePayload.f1 = { d: rotatedData, se: false, x: false };
                    updatePayload.f2 = { d: rotatedData, se: false, x: false };
                    updatePayload.results = initializeEmptyResults();
                    updatePayload.currentHoleF1 = 1;
                    updatePayload.currentHoleF2 = 1;
                    
                    db.collection("scheduledGames").doc(state.editingGameId).update(updatePayload).then(function() {
                        SessionManager.addNavigationHistory("manage-games.html", "game_updated", { gameId: state.editingGameId });
                        document.getElementById("successMsg").style.display = "block";
                        isDirty = false;
                        setTimeout(function() {
                            window.location.href = "manage-games.html";
                        }, 1500);
                    }).catch(function(e) {
                        Modal.alert("Error updating game: " + e.message);
                    });
                },
                function() {
                    console.log("Starting hole change cancelled");
                    render();
                }
            );
            return;
        }
        
        db.collection("scheduledGames").doc(state.editingGameId).update(updatePayload).then(function() {
            SessionManager.addNavigationHistory("manage-games.html", "game_updated", { gameId: state.editingGameId });
            document.getElementById("successMsg").style.display = "block";
            isDirty = false;
            setTimeout(function() {
                window.location.href = "manage-games.html";
            }, 1500);
        }).catch(function(e) {
            Modal.alert("Error updating game: " + e.message);
        });
    }).catch(function(e) {
        Modal.alert("Error loading existing game: " + e.message);
    });
}

function onCourseChange(courseId) {
    for (var i = 0; i < state.courses.length; i++) {

            state.selectedCourseData = state.courses[i];

        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerName(idx, this.value);
        });
    });
    
    document.querySelectorAll(".player-hcp-input").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerHandicap(idx, this.value);
        });
    });
    
    document.querySelectorAll(".team-select").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerTeam(idx, this.value);
        });
    });
    
    document.querySelectorAll(".flight-select").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerFlight(idx, this.value);
        });
    });
    
    var commitBtn = document.getElementById("commitBtn");
    if (commitBtn) {
        commitBtn.onclick = function() {
            commitGame();
        };
    }
    
    var cancelBtn = document.getElementById("cancelBtn");
    if (cancelBtn) {
        cancelBtn.onclick = function() {
            goBack();
        };
    }
    
    var backLink = document.getElementById("backLink");
    if (backLink) {
        backLink.onclick = function() {
            goBack();
        };
    }
}

window.changeCourse = onCourseChange;
window.goBack = goBack;
window.commitGame = commitGame;

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}
