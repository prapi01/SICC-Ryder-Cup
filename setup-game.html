<!-- FILE: setup-game.html - VERSION 1.14 -->
<!--
Sets up new scheduled games with consolidated structure + SHOTGUN START support
- f1.d, f1.se, f1.x
- f2.d, f2.se, f2.x
- locks.f1, locks.f2
- startingHole (1-18, default=1)
- F1-18 string is ROTATED to start at startingHole
- Starting Hole selector: Hole 1 | Hole 10 | Shotgun (dropdown)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Set Up New Game - SICC Ryder Cup</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: system-ui, -apple-system, 'SF Pro Text', sans-serif; color: #ffffff; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .version-tag { 
            position: fixed; 
            top: 8px; 
            right: 8px; 
            font-size: 0.65rem; 
            color: #4caf50; 
            background: rgba(0,0,0,0.6); 
            padding: 2px 10px; 
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.8;
        }
        
        .device-tag {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        .title { font-size: 1.5rem; font-weight: 700; color: #4caf50; }
        .version { font-size: 0.7rem; color: #666; margin-top: 4px; }
        
        .card { background: #111; border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid #333; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #4caf50; border-left: 2px solid #4caf50; padding-left: 10px; }
        
        .date-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .date-label { font-size: 0.9rem; color: #888; }
        .date-input { background: #1a1a1a; border: 1px solid #333; border-radius: 30px; padding: 10px 16px; color: #fff; font-size: 1rem; }
        .error-msg { color: #ff6b6b; font-size: 0.75rem; margin-top: 8px; }
        
        .course-select { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 30px; padding: 12px 16px; color: #fff; font-size: 1rem; }
        
        /* Three-button toggle for Starting Hole */
        .starting-hole-toggle {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .hole-toggle-btn {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccc;
            transition: all 0.2s;
        }
        .hole-toggle-btn.active {
            background: #1a3a1a;
            border-color: #4caf50;
            color: #4caf50;
        }
        .hole-toggle-btn.shotgun-btn {
            flex: 0.8;
        }
        .shotgun-dropdown-container {
            margin-top: 8px;
        }
        .shotgun-select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
        }
        .shotgun-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .player-row { background: #0a0a0a; border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .player-line1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        .player-name-group { display: flex; align-items: center; gap: 6px; flex: 2; }
        .player-name-input { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 8px 10px; color: #fff; font-size: 0.85rem; width: 110px; }
        .player-label-display { background: #1a3a1a; color: #4caf50; padding: 4px 8px; border-radius: 14px; font-size: 0.7rem; font-weight: 600; }
        .player-hcp-group { display: flex; align-items: center; gap: 4px; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; }
        .hcp-label { font-size: 0.65rem; color: #888; }
        .player-hcp-input { width: 45px; background: transparent; border: none; color: #fff; font-size: 0.85rem; text-align: center; }
        .player-line2 { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
        .team-select, .flight-select { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 6px 12px; color: #fff; font-size: 0.8rem; cursor: pointer; }
        
        .btn { padding: 14px 20px; border-radius: 40px; font-weight: 600; font-size: 1rem; text-align: center; cursor: pointer; border: none; margin: 5px; }
        .btn-primary { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-secondary { background: #1a1a1a; color: #ccc; border: 1px solid #333; }
        
        .button-group { display: flex; gap: 12px; margin-top: 16px; }
        .back-link { text-align: center; margin-top: 20px; padding: 16px; color: #888; cursor: pointer; border-top: 1px solid #333; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .success-msg { color: #4caf50; font-size: 0.8rem; text-align: center; margin-top: 10px; }
        
        .edit-badge { background: #ffaa44; color: #1a1a1a; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; margin-left: 10px; display: inline-block; }
        
        .info-note { font-size: 0.7rem; color: #ffaa44; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v1.14</div>

<script>
// FILE: setup-game.html - VERSION 1.14
// Consolidated structure + SHOTGUN START with three-button toggle

var VERSION = "1.14";
var CACHE_KEY = "setup_game_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var deviceSession = null;

try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

var DEFAULT_PLAYERS = [
    { name: "Ang C H", handicap: 1, team: "A", flight: 1 },
    { name: "Kenneth Foo", handicap: 3, team: "A", flight: 1 },
    { name: "Jeff Goh", handicap: 0, team: "B", flight: 1 },
    { name: "Ong C B", handicap: 1, team: "B", flight: 1 },
    { name: "C K", handicap: 8, team: "A", flight: 2 },
    { name: "Yip H M", handicap: 12, team: "A", flight: 2 },
    { name: "Piti", handicap: 8, team: "B", flight: 2 },
    { name: "James Ong", handicap: 11, team: "B", flight: 2 }
];

function generateLabel(name) {
    if (!name) return "???";
    var parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    if (parts.length === 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    var label = "";
    for (var i = 0; i < Math.min(3, parts.length); i++) label += parts[i].charAt(0);
    return label.toUpperCase();
}

// Generate default data string in NATURAL order (1-18)
function generateDefaultDataNatural(parArray) {
    var result = "";
    for (var hole = 1; hole <= 18; hole++) {
        var par = parArray[hole - 1];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

// Rotate data string to start at startingHole
function rotateDataString(naturalData, startingHole) {
    if (startingHole === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHole - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHole - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

var state = {
    courses: [],
    selectedCourseId: null,
    selectedCourseData: null,
    players: [],
    dateError: null,
    editingGameId: null,
    isEditMode: false,
    editDate: null,
    userSelectedDate: null,
    startingHole: 1,
    startingHoleType: "hole1"  // "hole1", "hole10", "shotgun"
};

function loadEditMode() {
    var urlParams = new URLSearchParams(window.location.search);
    var mode = urlParams.get('mode');
    
    if (mode === 'edit') {
        state.isEditMode = true;
        var editData = sessionStorage.getItem("editGameData");
        if (editData) {
            var gameData = JSON.parse(editData);
            state.editingGameId = gameData.id;
            state.editDate = gameData.date;
            
            if (gameData.course) {
                state.selectedCourseId = gameData.course.id;
                state.selectedCourseData = gameData.course;
            }
            
            if (gameData.startingHole) {
                state.startingHole = gameData.startingHole;
                if (state.startingHole === 1) {
                    state.startingHoleType = "hole1";
                } else if (state.startingHole === 10) {
                    state.startingHoleType = "hole10";
                } else {
                    state.startingHoleType = "shotgun";
                }
            }
            
            if (gameData.players && gameData.players.length === 8) {
                state.players = gameData.players;
            } else {
                initPlayers();
            }
            
            sessionStorage.removeItem("editGameData");
        } else {
            initPlayers();
        }
    } else {
        initPlayers();
    }
}

function loadCourses() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Firebase connection failed. Please check internet.</div>';
        return;
    }
    
    db.collection("courses").get().then(function(snapshot) {
        var courses = [];
        snapshot.forEach(function(doc) {
            courses.push({ id: doc.id, name: doc.data().name, par: doc.data().par, si: doc.data().si });
        });
        courses.sort(function(a, b) {
            var nameA = a.name.toLowerCase();
            var nameB = b.name.toLowerCase();
            if (nameA < nameB) return -1;
            if (nameA > nameB) return 1;
            return 0;
        });
        state.courses = courses;
        
        if (!state.isEditMode || !state.selectedCourseId) {
            if (courses.length > 0) {
                state.selectedCourseId = courses[0].id;
                state.selectedCourseData = courses[0];
            }
        }
        
        render();
    }).catch(function(e) { 
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading courses: ' + e.message + '</div>';
    });
}

function initPlayers() {
    state.players = DEFAULT_PLAYERS.map(function(p) {
        return {
            name: p.name,
            handicap: p.handicap,
            team: p.team,
            flight: p.flight,
            label: generateLabel(p.name)
        };
    });
}

function updatePlayerName(idx, value) {
    state.players[idx].name = value;
    state.players[idx].label = generateLabel(value);
    render();
}

function updatePlayerHandicap(idx, value) {
    state.players[idx].handicap = parseInt(value) || 0;
    render();
}

function updatePlayerTeam(idx, value) {
    state.players[idx].team = value;
    render();
}

function updatePlayerFlight(idx, value) {
    state.players[idx].flight = parseInt(value);
    render();
}

function validateTeamFlight() {
    var flight1A = state.players.filter(function(p) { return p.flight === 1 && p.team === "A"; }).length;
    var flight1B = state.players.filter(function(p) { return p.flight === 1 && p.team === "B"; }).length;
    var flight2A = state.players.filter(function(p) { return p.flight === 2 && p.team === "A"; }).length;
    var flight2B = state.players.filter(function(p) { return p.flight === 2 && p.team === "B"; }).length;
    return flight1A === 2 && flight1B === 2 && flight2A === 2 && flight2B === 2;
}

function validateDate(dateStr) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var selectedDate = new Date(dateStr);
    selectedDate.setHours(0, 0, 0, 0);
    
    var maxDate = new Date();
    maxDate.setMonth(maxDate.getMonth() + 12);
    maxDate.setHours(0, 0, 0, 0);
    
    if (selectedDate < today) {
        return "Date must be today or in the future";
    }
    if (selectedDate > maxDate) {
        return "Date cannot be more than 12 months in the future";
    }
    return null;
}

function setStartingHole(type, value) {
    state.startingHoleType = type;
    if (type === "hole1") {
        state.startingHole = 1;
    } else if (type === "hole10") {
        state.startingHole = 10;
    } else if (type === "shotgun") {
        state.startingHole = value || 1;
    }
    render();
}

function commitGame() {
    var dateInput = document.getElementById("datePicker");
    var selectedDate = dateInput ? dateInput.value : "";
    
    var dateError = validateDate(selectedDate);
    if (dateError) {
        state.dateError = dateError;
        render();
        return;
    }
    
    if (!validateTeamFlight()) {
        alert("Each flight needs exactly 2 Team A and 2 Team B players");
        return;
    }
    
    if (!state.selectedCourseData) {
        alert("Please select a course");
        return;
    }
    
    var naturalData = generateDefaultDataNatural(state.selectedCourseData.par);
    var rotatedData = rotateDataString(naturalData, state.startingHole);
    
    var gameData = {
        date: selectedDate,
        course: state.selectedCourseData,
        players: state.players,
        status: "scheduled",
        gameType: "real",
        startingHole: state.startingHole,
        updatedAt: new Date().toISOString(),
        
        f1: {
            d: rotatedData,
            se: false,
            x: false
        },
        f2: {
            d: rotatedData,
            se: false,
            x: false
        },
        
        locks: {
            f1: null,
            f2: null
        },
        
        currentHoleF1: 1,
        currentHoleF2: 1
    };
    
    if (state.editingGameId) {
        db.collection("scheduledGames").doc(state.editingGameId).update(gameData).then(function() {
            SessionManager.addNavigationHistory("manage-games.html", "game_updated", { gameId: state.editingGameId });
            document.getElementById("successMsg").style.display = "block";
            setTimeout(function() {
                window.location.href = "manage-games.html";
            }, 1500);
        }).catch(function(e) {
            alert("Error updating game: " + e.message);
        });
    } else {
        gameData.createdAt = new Date().toISOString();
        db.collection("scheduledGames").add(gameData).then(function(docRef) {
            SessionManager.addNavigationHistory("admin.html", "game_created", { gameId: docRef.id });
            document.getElementById("successMsg").style.display = "block";
            setTimeout(function() {
                window.location.href = "admin.html";
            }, 1500);
        }).catch(function(e) {
            alert("Error saving game: " + e.message);
        });
    }
}

function render() {
    var courseOptions = '';
    for (var i = 0; i < state.courses.length; i++) {
        var c = state.courses[i];
        var selected = (state.selectedCourseId === c.id) ? 'selected' : '';
        courseOptions += '<option value="' + c.id + '" ' + selected + '>' + escapeHtml(c.name) + '</option>';
    }
    
    // Build player list
    var playersHtml = '';
    for (var idx = 0; idx < state.players.length; idx++) {
        var p = state.players[idx];
        playersHtml += `
            <div class="player-row">
                <div class="player-line1">
                    <div class="player-name-group">
                        <input type="text" class="player-name-input" value="${escapeHtml(p.name)}" data-idx="${idx}" placeholder="Name">
                        <span class="player-label-display">${escapeHtml(p.label)}</span>
                    </div>
                    <div class="player-hcp-group">
                        <span class="hcp-label">Hcp</span>
                        <input type="number" class="player-hcp-input" value="${p.handicap}" data-idx="${idx}" step="1" min="0" max="54">
                    </div>
                </div>
                <div class="player-line2">
                    <select class="team-select" data-idx="${idx}">
                        <option value="A" ${p.team === "A" ? "selected" : ""}>Team A</option>
                        <option value="B" ${p.team === "B" ? "selected" : ""}>Team B</option>
                    </select>
                    <select class="flight-select" data-idx="${idx}">
                        <option value="1" ${p.flight === 1 ? "selected" : ""}>Flight 1</option>
                        <option value="2" ${p.flight === 2 ? "selected" : ""}>Flight 2</option>
                    </select>
                </div>
            </div>
        `;
    }
    
    var isValid = validateTeamFlight();
    var today = new Date().toISOString().split('T')[0];
    var maxDate = new Date();
    maxDate.setMonth(maxDate.getMonth() + 12);
    var maxDateStr = maxDate.toISOString().split('T')[0];
    
    var defaultDate;
    if (state.userSelectedDate) {
        defaultDate = state.userSelectedDate;
    } else if (state.isEditMode && state.editDate) {
        defaultDate = state.editDate;
    } else {
        defaultDate = today;
    }
    
    var modeTitle = state.isEditMode ? 'EDIT SCHEDULED GAME' : 'SET UP NEW GAME';
    var modeBadge = state.isEditMode ? '<span class="edit-badge">EDIT MODE</span>' : '';
    
    // Three-button toggle classes
    var hole1Class = "hole-toggle-btn" + (state.startingHoleType === "hole1" ? " active" : "");
    var hole10Class = "hole-toggle-btn" + (state.startingHoleType === "hole10" ? " active" : "");
    var shotgunClass = "hole-toggle-btn shotgun-btn" + (state.startingHoleType === "shotgun" ? " active" : "");
    
    var shotgunSelectDisabled = (state.startingHoleType !== "shotgun");
    var shotgunSelectValue = (state.startingHoleType === "shotgun") ? state.startingHole : 1;
    
    var html = `
        <div class="header">
            <div class="title">📅 ${modeTitle} ${modeBadge}</div>
            <div class="version">Version ${VERSION}</div>
        </div>
        
        <div class="card">
            <div class="card-title">🎯 GAME DATE</div>
            <div class="date-row">
                <span class="date-label">Date of Game:</span>
                <input type="date" id="datePicker" class="date-input" value="${defaultDate}" min="${today}" max="${maxDateStr}">
            </div>
            ${state.dateError ? '<div class="error-msg">⚠️ ' + state.dateError + '</div>' : ''}
        </div>
        
        <div class="card">
            <div class="card-title">🏟️ COURSE SELECTION</div>
            <select id="courseSelect" class="course-select" onchange="changeCourse(this.value)">
                ${courseOptions}
            </select>
        </div>
        
        <div class="card">
            <div class="card-title">⛳ STARTING HOLE (SHOTGUN START)</div>
            <div class="starting-hole-toggle">
                <div class="${hole1Class}" data-type="hole1">Hole 1</div>
                <div class="${hole10Class}" data-type="hole10">Hole 10</div>
                <div class="${shotgunClass}" data-type="shotgun">Shotgun</div>
            </div>
            <div class="shotgun-dropdown-container">
                <select id="shotgunHoleSelect" class="shotgun-select" ${shotgunSelectDisabled ? 'disabled' : ''}>
                    <option value="1" ${shotgunSelectValue === 1 ? 'selected' : ''}>Hole 1</option>
                    <option value="2" ${shotgunSelectValue === 2 ? 'selected' : ''}>Hole 2</option>
                    <option value="3" ${shotgunSelectValue === 3 ? 'selected' : ''}>Hole 3</option>
                    <option value="4" ${shotgunSelectValue === 4 ? 'selected' : ''}>Hole 4</option>
                    <option value="5" ${shotgunSelectValue === 5 ? 'selected' : ''}>Hole 5</option>
                    <option value="6" ${shotgunSelectValue === 6 ? 'selected' : ''}>Hole 6</option>
                    <option value="7" ${shotgunSelectValue === 7 ? 'selected' : ''}>Hole 7</option>
                    <option value="8" ${shotgunSelectValue === 8 ? 'selected' : ''}>Hole 8</option>
                    <option value="9" ${shotgunSelectValue === 9 ? 'selected' : ''}>Hole 9</option>
                    <option value="10" ${shotgunSelectValue === 10 ? 'selected' : ''}>Hole 10</option>
                    <option value="11" ${shotgunSelectValue === 11 ? 'selected' : ''}>Hole 11</option>
                    <option value="12" ${shotgunSelectValue === 12 ? 'selected' : ''}>Hole 12</option>
                    <option value="13" ${shotgunSelectValue === 13 ? 'selected' : ''}>Hole 13</option>
                    <option value="14" ${shotgunSelectValue === 14 ? 'selected' : ''}>Hole 14</option>
                    <option value="15" ${shotgunSelectValue === 15 ? 'selected' : ''}>Hole 15</option>
                    <option value="16" ${shotgunSelectValue === 16 ? 'selected' : ''}>Hole 16</option>
                    <option value="17" ${shotgunSelectValue === 17 ? 'selected' : ''}>Hole 17</option>
                    <option value="18" ${shotgunSelectValue === 18 ? 'selected' : ''}>Hole 18</option>
                </select>
            </div>
            <div class="info-note">💡 Play will begin at selected hole. Scorecard will show holes in play order.</div>
        </div>
        
        <div class="card">
            <div class="card-title">👥 PLAYER SETUP (8 Players)</div>
            ${playersHtml}
            ${!isValid ? '<div class="error-msg">⚠️ Each flight needs exactly 2 Team A and 2 Team B players</div>' : ''}
        </div>
        
        <div class="button-group">
            <button class="btn btn-secondary" onclick="goBack()">← Cancel</button>
            <button class="btn btn-primary" onclick="commitGame()">✓ ${state.isEditMode ? 'UPDATE GAME' : 'COMMIT GAME'}</button>
        </div>
        
        <div id="successMsg" style="display:none;" class="success-msg">✓ Game ${state.isEditMode ? 'updated' : 'scheduled'} successfully! Redirecting...</div>
        
        <div class="back-link" onclick="goBack()">← Back to Game Settings</div>
    `;
    
    document.getElementById("app").innerHTML = html;
    
    // Date picker listener
    var datePicker = document.getElementById("datePicker");
    if (datePicker) {
        datePicker.addEventListener("change", function() {
            state.userSelectedDate = this.value;
        });
    }
    
    // Three-button toggle listeners
    document.querySelectorAll(".hole-toggle-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
            var type = this.dataset.type;
            if (type === "shotgun") {
                var select = document.getElementById("shotgunHoleSelect");
                var holeValue = select ? parseInt(select.value) : 1;
                setStartingHole("shotgun", holeValue);
            } else if (type === "hole1") {
                setStartingHole("hole1", 1);
            } else if (type === "hole10") {
                setStartingHole("hole10", 10);
            }
        });
    });
    
    // Shotgun dropdown listener
    var shotgunSelect = document.getElementById("shotgunHoleSelect");
    if (shotgunSelect) {
        shotgunSelect.addEventListener("change", function() {
            if (state.startingHoleType === "shotgun") {
                state.startingHole = parseInt(this.value);
                // No re-render needed, just update state
            }
        });
    }
    
    // Player input listeners
    document.querySelectorAll(".player-name-input").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerName(idx, this.value);
        });
    });
    
    document.querySelectorAll(".player-hcp-input").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerHandicap(idx, this.value);
        });
    });
    
    document.querySelectorAll(".team-select").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerTeam(idx, this.value);
        });
    });
    
    document.querySelectorAll(".flight-select").forEach(function(el) {
        el.addEventListener("change", function() {
            var idx = parseInt(this.dataset.idx);
            updatePlayerFlight(idx, this.value);
        });
    });
}

window.changeCourse = function(courseId) {
    for (var i = 0; i < state.courses.length; i++) {
        if (state.courses[i].id === courseId) {
            state.selectedCourseId = courseId;
            state.selectedCourseData = state.courses[i];
            break;
        }
    }
    render();
};

window.goBack = function() {
    if (state.isEditMode) {
        window.location.href = "manage-games.html";
    } else {
        window.location.href = "admin.html";
    }
};

window.commitGame = commitGame;

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("setup-game.html", "admin.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    displayDeviceId();
    loadEditMode();
    loadCourses();
});
</script>
