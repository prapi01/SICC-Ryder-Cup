<div class="container" id="app">
    <div class="loading">Loading game data...</div>
</div>
<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v1.04</div>

<script>
// FILE: game.html - VERSION 1.04

var UI_VERSION = "1.04";
var CACHE_KEY = "game_ui_version";

if (localStorage.getItem(CACHE_KEY) !== UI_VERSION) {
    localStorage.setItem(CACHE_KEY, UI_VERSION);
    window.location.href = window.location.pathname + "?v=" + UI_VERSION;
}

var uiData = null;

window.setDeviceId = function(deviceId) {
    var deviceTag = document.getElementById("deviceTag");
    if (deviceTag) deviceTag.innerHTML = deviceId;
};

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

window.updateGameUI = function(data) {
    console.log("game: updateGameUI called", data);
    
    uiData = data;
    
    if (!data || !data.players || !data.course) {
        document.getElementById("app").innerHTML = '<div class="loading">Waiting for game data...</div>';
        return;
    }
    
    var course = data.course;
    var isSaved = data.isSaved || false;
    var canModify = data.canModify || false;
    var currentHole = data.currentHole || 1;
    var activeFlight = data.activeFlight || 1;
    
    var teamAPts = 0;
    var teamBPts = 0;
    
    if (data.trPoints) {
        teamAPts = data.trPoints.teamA;
        teamBPts = data.trPoints.teamB;
    } else {
        teamAPts = (data.matchPoints ? data.matchPoints.teamA : 8) + 
                   (data.teamPoints ? data.teamPoints.teamA : 1) + 
                   (data.strokePoints ? data.strokePoints.teamA : 0.5);
        teamBPts = (data.matchPoints ? data.matchPoints.teamB : 8) + 
                   (data.teamPoints ? data.teamPoints.teamB : 1) + 
                   (data.strokePoints ? data.strokePoints.teamB : 0.5);
    }
    
    var teamAGreen = teamAPts >= teamBPts;
    var teamBGreen = teamBPts >= teamAPts;
    
    // Get players for current flight, sorted by team (A first, then B)
    var flightPlayers = data.players.filter(function(p) { return p.flight === activeFlight; });
    flightPlayers.sort(function(a, b) { 
        if (a.team === "A" && b.team === "B") return -1;
        if (a.team === "B" && b.team === "A") return 1;
        return 0;
    });
    
    // Build player cards
    var playerCards = "";
    for (var i = 0; i < flightPlayers.length; i++) {
        var p = flightPlayers[i];
        
        // Find player index in the global players array
        var playerIdx = -1;
        for (var k = 0; k < data.players.length; k++) {
            if (data.players[k].name === p.name) {
                playerIdx = k;
                break;
            }
        }
        
        // Get current score
        var scoreKey = activeFlight + "_" + currentHole + "_" + playerIdx;
        var currentScore = (data.scores && data.scores[scoreKey]) ? data.scores[scoreKey] : course.par[currentHole - 1];
        
        // Build match bubbles for this player
        var opponents = data.players.filter(function(op) { return op.team !== p.team; });
        var bubblesHtml = '<div class="bubbles">';
        for (var j = 0; j < opponents.length; j++) {
            var bubbleKey = p.name + "_vs_" + opponents[j].name;
            var result = (data.matchBubbles && data.matchBubbles[bubbleKey]) || "AS";
            var bubbleClass = "bubble";
            
            if (result === "AS") {
                bubbleClass += " bubble-pending";
            } else if (result.indexOf("+") === 0) {
                bubbleClass += " bubble-win";
            } else if (result.indexOf("-") === 0) {
                bubbleClass += " bubble-loss";
            } else {
                bubbleClass += " bubble-pending";
            }
            
            bubblesHtml += '<div class="' + bubbleClass + '">vs ' + opponents[j].label + ' ' + result + '</div>';
        }
        bubblesHtml += '</div>';
        
        var btnDisabled = canModify ? "" : "disabled";
        var btnStyle = canModify ? "" : 'style="opacity:0.5;"';
        
        playerCards += '<div class="player-card">' +
            '<div class="player-row">' +
                '<div>' +
                    '<span class="player-name">' + escapeHtml(p.name) + '</span>' +
                    '<span class="player-label-bubble">' + p.label + ' ' + p.handicap + '</span>' +
                '</div>' +
                '<div class="score-control">' +
                    '<button class="score-btn dec-btn" data-player-idx="' + playerIdx + '" data-flight="' + activeFlight + '" data-hole="' + currentHole + '" ' + btnDisabled + ' ' + btnStyle + '>-</button>' +
                    '<span class="score-value" id="score_' + playerIdx + '_' + currentHole + '">' + currentScore + '</span>' +
                    '<button class="score-btn inc-btn" data-player-idx="' + playerIdx + '" data-flight="' + activeFlight + '" data-hole="' + currentHole + '" ' + btnDisabled + ' ' + btnStyle + '>+</button>' +
                '</div>' +
            '</div>' +
            bubblesHtml +
        '</div>';
    }
    
    var pencilIcon = (data.userRole === "update1" || data.userRole === "update2") ? ' ✏️' : '';
    var flightTabHtml = '<div class="flight-tab">Flight ' + (data.editableFlight || activeFlight) + pencilIcon + '</div>';
    
    var teamADisplay = teamAPts % 1 === 0 ? teamAPts : teamAPts.toFixed(1);
    var teamBDisplay = teamBPts % 1 === 0 ? teamBPts : teamBPts.toFixed(1);
    var trHtml = '<span class="' + (teamAGreen ? "team-score-green" : "team-score-red") + '">Team A ' + teamADisplay + '</span> - <span class="' + (teamBGreen ? "team-score-green" : "team-score-red") + '">' + teamBDisplay + ' Team B</span>';
    
    // ============================================================
    // SCORECARD TABLE
    // ============================================================
    var players = data.players;
    var flight1Players = players.filter(function(p) { return p.flight === 1; });
    var flight2Players = players.filter(function(p) { return p.flight === 2; });
    
    // Sort players within each flight: Team A first, then Team B
    flight1Players.sort(function(a, b) {
        if (a.team === "A" && b.team === "B") return -1;
        if (a.team === "B" && b.team === "A") return 1;
        return 0;
    });
    
    flight2Players.sort(function(a, b) {
        if (a.team === "A" && b.team === "B") return -1;
        if (a.team === "B" && b.team === "A") return 1;
        return 0;
    });
    
    var tableHtml = '<table class="scorecard-table">';
    tableHtml += '<thead><tr><th>Hole</th>';
    for (var h = 1; h <= 18; h++) tableHtml += '<th>' + h + '</th>';
    tableHtml += '<th>Tot</th></tr></thead>';
    tableHtml += '<tbody>';
    
    // Par row
    tableHtml += '<tr><td style="font-weight:700;">Par</td>';
    var totalPar = 0;
    for (var ph = 1; ph <= 18; ph++) {
        totalPar += course.par[ph-1];
        tableHtml += '<td>' + course.par[ph-1] + '</td>';
    }
    tableHtml += '<td>' + totalPar + '</td></tr>';
    
    // SI row
    tableHtml += '<tr><td style="font-weight:700;">SI</td>';
    for (var sh = 0; sh < 18; sh++) {
        tableHtml += '<td>' + course.si[sh] + '</td>';
    }
    tableHtml += '<td>-</td></tr>';
    tableHtml += '<tr class="green-line"><td colspan="20"></td></tr>';
    
    // Flight 1 players
    for (var pi = 0; pi < flight1Players.length; pi++) {
        var p = flight1Players[pi];
        var pIdx = -1;
        for (var ix = 0; ix < players.length; ix++) {
            if (players[ix].name === p.name) pIdx = ix;
        }
        var total = 0;
        tableHtml += '<tr><td style="font-weight:600;">' + p.label + '</td>';
        for (var hole = 1; hole <= 18; hole++) {
            var scoreKey = p.flight + "_" + hole + "_" + pIdx;
            var score = (data.scores && data.scores[scoreKey]) ? data.scores[scoreKey] : course.par[hole-1];
            total += score;
            var completed = data.savedHoles && data.savedHoles[p.flight] && data.savedHoles[p.flight].indexOf(hole) !== -1;
            if (completed) {
                tableHtml += '<td class="completed"><strong>' + score + '</strong></td>';
            } else {
                tableHtml += '<td class="placeholder">' + score + '</td>';
            }
        }
        tableHtml += '<td class="completed"><strong>' + total + '</strong></td></tr>';
    }
    
    // T-1 row (Flight 1 cumulative)
    tableHtml += '<tr><td style="font-weight:600; color:#4caf50;">T-1</td>';
    var t1RowData = data.t1Row || [];
    for (var h = 1; h <= 18; h++) {
        var val = (h <= t1RowData.length) ? t1RowData[h-1] : 0;
        tableHtml += '<td style="color:#4caf50;">' + val + '</td>';
    }
    tableHtml += '<td style="color:#4caf50;">' + (data.t1Total || 0) + '</td></tr>';
    tableHtml += '<tr class="green-line"><td colspan="20"></td></tr>';
    
    // Flight 2 players
    for (var pi = 0; pi < flight2Players.length; pi++) {
        var p = flight2Players[pi];
        var pIdx = -1;
        for (var ix = 0; ix < players.length; ix++) {
            if (players[ix].name === p.name) pIdx = ix;
        }
        var total = 0;
        tableHtml += '<tr><td style="font-weight:600;">' + p.label + '</td>';
        for (var hole = 1; hole <= 18; hole++) {
            var scoreKey = p.flight + "_" + hole + "_" + pIdx;
            var score = (data.scores && data.scores[scoreKey]) ? data.scores[scoreKey] : course.par[hole-1];
            total += score;
            var completed = data.savedHoles && data.savedHoles[p.flight] && data.savedHoles[p.flight].indexOf(hole) !== -1;
            if (completed) {
                tableHtml += '<td class="completed"><strong>' + score + '</strong></td>';
            } else {
                tableHtml += '<td class="placeholder">' + score + '</td>';
            }
        }
        tableHtml += '<td class="completed"><strong>' + total + '</strong></td></tr>';
    }
    
    // T-2 row (Flight 2 cumulative)
    tableHtml += '<tr><td style="font-weight:600; color:#4caf50;">T-2</td>';
    var t2RowData = data.t2Row || [];
    for (var h = 1; h <= 18; h++) {
        var val = (h <= t2RowData.length) ? t2RowData[h-1] : 0;
        tableHtml += '<td style="color:#4caf50;">' + val + '</td>';
    }
    tableHtml += '<td style="color:#4caf50;">' + (data.t2Total || 0) + '</td></tr>';
    tableHtml += '<tr class="green-line"><td colspan="20"></td></tr>';
    
    // Strk row
    tableHtml += '<tr><td style="font-weight:600; color:#4caf50;">Strk</td>';
    var strkRowData = data.strkRow || [];
    for (var h = 1; h <= 18; h++) {
        var val = (h <= strkRowData.length) ? strkRowData[h-1] : "-";
        tableHtml += '<td style="color:#4caf50;">' + val + '</td>';
    }
    tableHtml += '<td style="color:#4caf50;">' + (data.strkTotal || "-") + '</td></tr>';
    tableHtml += '<tr class="green-line"><td colspan="20"></td></tr>';
    
    tableHtml += '</tbody>赶';
    
    var nextBtnClass = isSaved ? "action-btn btn-next-active" : "action-btn btn-next-inactive";
    var nextBtnDisabled = !isSaved ? "disabled" : "";
    
    var modeDisplay = data.modeDisplay || "READY";
    var modeClass = data.modeClass || "status-real";
    
    var html = 
        '<div class="status-bubble ' + modeClass + '">' + modeDisplay + '</div>' +
        '<div class="game-info"><div>' + escapeHtml(course.name) + (data.gameDate ? ' | ' + data.gameDate : '') + '</div></div>' +
        '<div class="game-header">' +
            '<div class="hole-number">HOLE ' + currentHole + '</div>' +
            '<div class="hole-par">PAR ' + course.par[currentHole-1] + '  SI ' + course.si[currentHole-1] + '</div>' +
        '</div>' +
        flightTabHtml +
        '<div class="team-score-card"><div class="team-score">' + trHtml + '</div></div>' +
        '<div class="player-cards">' + playerCards + '</div>' +
        '<div class="action-buttons">' +
            '<button class="action-btn btn-back" id="prevHoleBtn"' + (currentHole === 1 ? ' disabled' : '') + '>Back</button>' +
            '<button class="action-btn btn-save" id="saveBtn">Save</button>' +
            '<button class="' + nextBtnClass + '" id="nextHoleBtn" ' + nextBtnDisabled + '>Next</button>' +
        '</div>' +
        '<div class="scorecard-section">' +
            '<div class="scorecard-header">' +
                '<div class="scorecard-title">SCORECARD</div>' +
                '<button class="refresh-btn" id="refreshBtn">⟳</button>' +
            '</div>' +
            '<div class="scorecard-wrapper">' + tableHtml + '</div>' +
        '</div>' +
        '<div class="menu-buttons">' +
            '<button class="btn-menu" id="menuBtn">Main Menu</button>' +
            '<button class="btn-reset" id="resetRoleBtn">Switch Role</button>' +
        '</div>';
    
    document.getElementById("app").innerHTML = html;
    attachEvents();
};

function attachEvents() {
    // Decrement buttons
    document.querySelectorAll(".dec-btn").forEach(function(btn) {
        btn.removeEventListener("click", btn._listener);
        btn._listener = function() {
            if (!btn.disabled) {
                console.log("game: Decrement clicked", {
                    playerIdx: parseInt(this.dataset.playerIdx),
                    flight: parseInt(this.dataset.flight),
                    hole: parseInt(this.dataset.hole)
                });
                window.dispatchEvent(new CustomEvent('scoreChange', {
                    detail: {
                        playerIdx: parseInt(this.dataset.playerIdx),
                        flight: parseInt(this.dataset.flight),
                        hole: parseInt(this.dataset.hole),
                        delta: -1
                    }
                }));
            }
        };
        btn.addEventListener("click", btn._listener);
    });
    
    // Increment buttons
    document.querySelectorAll(".inc-btn").forEach(function(btn) {
        btn.removeEventListener("click", btn._listener);
        btn._listener = function() {
            if (!btn.disabled) {
                console.log("game: Increment clicked", {
                    playerIdx: parseInt(this.dataset.playerIdx),
                    flight: parseInt(this.dataset.flight),
                    hole: parseInt(this.dataset.hole)
                });
                window.dispatchEvent(new CustomEvent('scoreChange', {
                    detail: {
                        playerIdx: parseInt(this.dataset.playerIdx),
                        flight: parseInt(this.dataset.flight),
                        hole: parseInt(this.dataset.hole),
                        delta: 1
                    }
                }));
            }
        };
        btn.addEventListener("click", btn._listener);
    });
    
    var saveBtn = document.getElementById("saveBtn");
    if (saveBtn) {
        saveBtn.removeEventListener("click", saveBtn._listener);
        saveBtn._listener = function() {
            console.log("game: Save clicked");
            window.dispatchEvent(new CustomEvent('saveHole'));
        };
        saveBtn.addEventListener("click", saveBtn._listener);
    }
    
    var nextBtn = document.getElementById("nextHoleBtn");
    if (nextBtn) {
        nextBtn.removeEventListener("click", nextBtn._listener);
        nextBtn._listener = function() {
            if (!nextBtn.disabled) {
