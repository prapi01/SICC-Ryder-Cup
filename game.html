<!--
FILE: game.html
VERSION: 2.00
PURPOSE: Complete working game UI with:
         - Real-time Firebase sync (onSnapshot, no polling)
         - No UI-string (direct JavaScript objects)
         - Alpine.js for reactivity
         - Shotgun start support
         - Same visual layout as test-ui-simple.html
STATUS: Ready to replace existing game.html
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SICC Ryder Cup - Game</title>
    
    <!-- Alpine.js for reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Session Manager -->
    <script src="js/session.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui, sans-serif; color: #fff; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; }
        
        .status-bubble {
            background: rgba(76,175,80,0.3);
            border: 1px solid #4caf50;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-bottom: 16px;
        }
        
        .hole-header { text-align: center; margin: 16px 0; }
        .hole-number { font-size: 1.8rem; font-weight: 800; background: #111; display: inline-block; padding: 4px 20px; border-radius: 40px; }
        .hole-par { font-size: 0.8rem; color: #888; margin-top: 4px; }
        
        .flight-tab {
            background: #1a3a1a;
            border: 1px solid #4caf50;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            margin: 16px 0;
        }
        
        .team-score-card {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .team-score-green { color: #4caf50; }
        .team-score-red { color: #ff6b6b; }
        .team-score { font-size: 1.3rem; font-weight: 700; }
        
        .player-card {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-name { font-size: 1rem; font-weight: 600; }
        .player-handicap { background: #1a3a1a; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; margin-left: 8px; }
        .score-control { display: flex; gap: 12px; align-items: center; }
        .score-btn { background: #1a3a1a; border: none; width: 40px; height: 40px; border-radius: 30px; font-size: 1.2rem; color: #fff; cursor: pointer; }
        .score-btn:active { transform: scale(0.95); }
        .score-value { font-size: 1.2rem; font-weight: 700; min-width: 40px; text-align: center; }
        
        .bubbles { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .bubble { flex: 1; text-align: center; padding: 6px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
        .bubble-green { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .bubble-red { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
        .bubble-grey { background: #2a2a2a; color: #888; border: 1px solid #444; }
        
        .scorecard-wrapper { overflow-x: auto; margin: 20px 0; }
        .scorecard-table { width: 100%; min-width: 700px; font-size: 0.7rem; border-collapse: collapse; }
        .scorecard-table th, .scorecard-table td { padding: 6px 3px; text-align: center; border: 1px solid #222; }
        .scorecard-table th { color: #4caf50; background: #111; }
        .score-green { color: #4caf50; font-weight: 600; }
        .score-invisible { color: #000; }
        .green-line td { border-bottom: 2px solid #4caf50; padding: 0; height: 2px; }
        
        .action-buttons { display: flex; gap: 12px; margin: 20px 0; }
        .btn { flex: 1; padding: 12px; border-radius: 40px; font-weight: 600; text-align: center; cursor: pointer; border: none; }
        .btn-save { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-next { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .btn-back { background: #1a1a1a; color: #ccc; border: 1px solid #333; }
        .btn:active { transform: scale(0.98); }
        
        .debug { text-align: center; font-size: 0.6rem; color: #555; margin-top: 20px; }
        
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<div class="container" x-data="gameApp()" x-init="init()">
    <!-- Loading or Ready -->
    <div x-show="loading" class="loading">Loading game data...</div>
    
    <div x-show="!loading">
        <!-- Status -->
        <div class="status-bubble" x-text="modeDisplay"></div>
        <div style="text-align:center; margin-bottom:8px;" x-text="courseName"></div>
        
        <!-- Shotgun indicator -->
        <div x-show="startingHole !== 1" style="text-align:center; color:#ffaa44; font-size:0.7rem; margin-bottom:8px;">
            ⛳ Shotgun Start - Starting at Hole <span x-text="startingHole"></span>
        </div>
        
        <!-- Current Hole -->
        <div class="hole-header">
            <div class="hole-number">HOLE <span x-text="currentHole"></span></div>
            <div class="hole-par">PAR <span x-text="currentPar"></span>  SI <span x-text="currentSi"></span></div>
        </div>
        
        <!-- Flight Tab -->
        <div class="flight-tab">Flight <span x-text="editableFlight"></span><span x-show="canEdit"> ✏️</span></div>
        
        <!-- TR Score -->
        <div class="team-score-card">
            <div class="team-score">
                <span :class="trTeamAGreen ? 'team-score-green' : 'team-score-red'">Team A <span x-text="trTeamA"></span></span>
                - 
                <span :class="trTeamBGreen ? 'team-score-green' : 'team-score-red'"><span x-text="trTeamB"></span> Team B</span>
            </div>
        </div>
        
        <!-- Player Cards (current flight only) -->
        <template x-for="player in currentFlightPlayers">
            <div class="player-card">
                <div class="player-header">
                    <div>
                        <span class="player-name" x-text="player.name"></span>
                        <span class="player-handicap" x-text="player.label + ' ' + player.handicap"></span>
                    </div>
                    <div class="score-control">
                        <button class="score-btn" @click="changeScore(player, -1)" :disabled="!canEdit">-</button>
                        <span class="score-value" x-text="getCurrentScore(player)"></span>
                        <button class="score-btn" @click="changeScore(player, 1)" :disabled="!canEdit">+</button>
                    </div>
                </div>
                <div class="bubbles">
                    <template x-for="opp in getOpponents(player)">
                        <div class="bubble" :class="getBubbleClass(player, opp)">
                            vs <span x-text="opp.label"></span> <span x-text="getBubbleValue(player, opp)"></span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-back" @click="prevHole" :disabled="currentHole === 1">← Back</button>
            <button class="btn btn-save" @click="saveHole">💾 Save</button>
            <button class="btn btn-next" @click="nextHole" :disabled="!isCurrentHoleSaved">Next →</button>
        </div>
        
        <!-- Scorecard -->
        <div class="scorecard-wrapper">
            <table class="scorecard-table">
                <thead>
                    <tr>
                        <th>Hole</th>
                        <template x-for="h in displayHoles">
                            <th x-text="h"></th>
                        </template>
                        <th>Tot</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Par row -->
                    <tr>
                        <td style="font-weight:700;">Par</td>
                        <template x-for="h in displayHoles">
                            <td x-text="coursePar[h-1]"></td>
                        </template>
                        <td x-text="totalPar"></td>
                    </tr>
                    <!-- SI row -->
                    <tr>
                        <td style="font-weight:700;">SI</td>
                        <template x-for="h in displayHoles">
                            <td x-text="courseSi[h-1]"></td>
                        </template>
                        <td>-</td>
                    </tr>
                    <!-- Team A players -->
                    <template x-for="player in teamAPlayers">
                        <tr>
                            <td style="font-weight:600;" x-text="player.label"></td>
                            <template x-for="h in displayHoles">
                                <td :class="isHoleSaved(player.flight, h) ? 'score-green' : 'score-invisible'"
                                    x-text="getStoredScore(player, h)"></td>
                            </template>
                            <td :class="getPlayerTotal(player) > 0 ? 'score-green' : 'score-invisible'" x-text="getPlayerTotal(player)"></td>
                        </tr>
                    </template>
                    <!-- Green line -->
                    <tr class="green-line"><td colspan="20"></td></tr>
                    <!-- T-1 row -->
                    <tr>
                        <td style="color:#4caf50; font-weight:600;">T-1</td>
                        <template x-for="(val, idx) in t1Row">
                            <td :class="val && val !== '_' ? 'score-green' : 'score-invisible'" x-text="val === '_' ? '' : val"></td>
                        </template>
                        <td>-</td>
                    </tr>
                    <!-- Green line -->
                    <tr class="green-line"><td colspan="20"></td></tr>
                    <!-- Team B players -->
                    <template x-for="player in teamBPlayers">
                        <tr>
                            <td style="font-weight:600;" x-text="player.label"></td>
                            <template x-for="h in displayHoles">
                                <td :class="isHoleSaved(player.flight, h) ? 'score-green' : 'score-invisible'"
                                    x-text="getStoredScore(player, h)"></td>
                            </template>
                            <td :class="getPlayerTotal(player) > 0 ? 'score-green' : 'score-invisible'" x-text="getPlayerTotal(player)"></td>
                        </tr>
                    </template>
                    <!-- T-2 row -->
                    <tr>
                        <td style="color:#4caf50; font-weight:600;">T-2</td>
                        <template x-for="(val, idx) in t2Row">
                            <td :class="val && val !== '_' ? 'score-green' : 'score-invisible'" x-text="val === '_' ? '' : val"></td>
                        </template>
                        <td>-</td>
                    </tr>
                    <!-- Green line -->
                    <tr class="green-line"><td colspan="20"></td></tr>
                    <!-- Strk row -->
                    <tr>
                        <td style="color:#4caf50; font-weight:600;">Strk</td>
                        <template x-for="(val, idx) in strkRow">
                            <td :class="val && val !== '_' ? 'score-green' : 'score-invisible'" x-text="val === '_' ? '' : val"></td>
                        </template>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="debug">
            <span x-text="syncStatus"></span>
        </div>
    </div>
</div>

<script>
// Firebase Config
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

// Initialize Firebase if not already
if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
const db = firebase.firestore();

function gameApp() {
    return {
        // ============================================================
        // STATE
        // ============================================================
        loading: true,
        gameId: null,
        gameMode: 'real',
        editableFlight: 1,
        canEdit: true,
        startingHole: 1,
        
        // Course data
        courseName: '',
        coursePar: [],
        courseSi: [],
        
        // Players
        allPlayers: [],
        
        // Scores storage
        flight1Data: {},      // { hole: { a1, a2, b1, b2, saved } }
        flight2Data: {},
        localChanges: {},     // { flight_hole_playerName: score }
        
        // Current hole
        currentHole: 1,
        
        // TR values
        trTeamA: 9.5,
        trTeamB: 9.5,
        trTeamAGreen: true,
        trTeamBGreen: true,
        
        // Row data
        t1Row: Array(18).fill('_'),
        t2Row: Array(18).fill('_'),
        strkRow: Array(18).fill('_'),
        
        // Sync
        unsubscribe: null,
        syncStatus: 'Connecting...',
        modeDisplay: 'LIVE',
        
        // ============================================================
        // COMPUTED (Alpine watches these)
        // ============================================================
        
        get displayHoles() {
            const holes = [];
            for (let i = this.startingHole; i <= 18; i++) holes.push(i);
            for (let i = 1; i < this.startingHole; i++) holes.push(i);
            return holes;
        },
        
        get totalPar() {
            return this.coursePar.reduce((a, b) => a + b, 0);
        },
        
        get currentPar() {
            return this.coursePar[this.currentHole - 1] || 4;
        },
        
        get currentSi() {
            return this.courseSi[this.currentHole - 1] || 1;
        },
        
        get isCurrentHoleSaved() {
            const f1Saved = this.flight1Data[this.currentHole]?.saved || false;
            const f2Saved = this.flight2Data[this.currentHole]?.saved || false;
            // For the editable flight, we only care if that flight saved
            if (this.editableFlight === 1) return f1Saved;
            if (this.editableFlight === 2) return f2Saved;
            return f1Saved && f2Saved;
        },
        
        get currentFlightPlayers() {
            return this.allPlayers.filter(p => p.flight === this.editableFlight);
        },
        
        get teamAPlayers() {
            return this.allPlayers.filter(p => p.team === 'A').sort((a, b) => {
                if (a.flight !== b.flight) return a.flight - b.flight;
                return a.handicap - b.handicap;
            });
        },
        
        get teamBPlayers() {
            return this.allPlayers.filter(p => p.team === 'B').sort((a, b) => {
                if (a.flight !== b.flight) return a.flight - b.flight;
                return a.handicap - b.handicap;
            });
        },
        
        // ============================================================
        // METHODS
        // ============================================================
        
        // Get stored score for a player on a specific hole
        getStoredScore(player, hole) {
            const flightData = player.flight === 1 ? this.flight1Data : this.flight2Data;
            const holeData = flightData[hole];
            if (!holeData || !holeData.saved) return this.coursePar[hole - 1];
            
            // Find which position this player is in their flight
            const flightPlayers = this.allPlayers.filter(p => p.flight === player.flight);
            const teamAPlayers = flightPlayers.filter(p => p.team === 'A').sort((a, b) => a.handicap - b.handicap);
            const teamBPlayers = flightPlayers.filter(p => p.team === 'B').sort((a, b) => a.handicap - b.handicap);
            
            if (player.team === 'A') {
                if (teamAPlayers[0]?.name === player.name) return holeData.a1;
                if (teamAPlayers[1]?.name === player.name) return holeData.a2;
            } else {
                if (teamBPlayers[0]?.name === player.name) return holeData.b1;
                if (teamBPlayers[1]?.name === player.name) return holeData.b2;
            }
            return this.coursePar[hole - 1];
        },
        
        // Get current score (with local changes)
        getCurrentScore(player) {
            const key = `${player.flight}_${this.currentHole}_${player.name}`;
            if (this.localChanges[key] !== undefined) {
                return this.localChanges[key];
            }
            return this.getStoredScore(player, this.currentHole);
        },
        
        // Change score (+/-)
        changeScore(player, delta) {
            if (!this.canEdit) return;
            const current = this.getCurrentScore(player);
            let newScore = current + delta;
            if (newScore < 1) newScore = 1;
            if (newScore > 99) newScore = 99;
            
            const key = `${player.flight}_${this.currentHole}_${player.name}`;
            this.localChanges[key] = newScore;
        },
        
        // Get total score for a player
        getPlayerTotal(player) {
            let total = 0;
            for (let h = 1; h <= 18; h++) {
                total += this.getStoredScore(player, h);
            }
            return total;
        },
        
        // Check if a hole is saved for a flight
        isHoleSaved(flight, hole) {
            const flightData = flight === 1 ? this.flight1Data : this.flight2Data;
            return flightData[hole]?.saved || false;
        },
        
        // Get opponents for a player (for match bubbles)
        getOpponents(player) {
            return this.allPlayers.filter(op => op.team !== player.team);
        },
        
        // Get bubble class
        getBubbleClass(player, opponent) {
            // Simplified - in real implementation, calculate from match results
            return 'bubble-grey';
        },
        
        // Get bubble value
        getBubbleValue(player, opponent) {
            // Simplified - in real implementation, calculate from match results
            return 'AS';
        },
        
        // Save current hole
        async saveHole() {
            if (!this.canEdit) return;
            
            const flight = this.editableFlight;
            const flightPlayers = this.allPlayers.filter(p => p.flight === flight);
            const teamAPlayers = flightPlayers.filter(p => p.team === 'A').sort((a, b) => a.handicap - b.handicap);
            const teamBPlayers = flightPlayers.filter(p => p.team === 'B').sort((a, b) => a.handicap - b.handicap);
            
            // Get current scores
            let a1Score = this.getStoredScore(teamAPlayers[0], this.currentHole);
            let a2Score = this.getStoredScore(teamAPlayers[1], this.currentHole);
            let b1Score = this.getStoredScore(teamBPlayers[0], this.currentHole);
            let b2Score = this.getStoredScore(teamBPlayers[1], this.currentHole);
            
            // Override with local changes
            for (const [key, score] of Object.entries(this.localChanges)) {
                if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                    const playerName = key.split('_')[2];
                    if (teamAPlayers[0]?.name === playerName) a1Score = score;
                    if (teamAPlayers[1]?.name === playerName) a2Score = score;
                    if (teamBPlayers[0]?.name === playerName) b1Score = score;
                    if (teamBPlayers[1]?.name === playerName) b2Score = score;
                }
            }
            
            // Update the flight data string
            const currentDataString = flight === 1 ? this.f1DataString : this.f2DataString;
            const newDataString = this.updateFlightDataString(currentDataString, this.currentHole, {
                a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score
            });
            
            const collection = 'scheduledGames';
            const updatePayload = {};
            updatePayload[`f${flight}.d`] = newDataString;
            updatePayload[`f${flight}.se`] = true;
            updatePayload[`f${flight === 1 ? 2 : 1}.x`] = true;
            
            try {
                await db.collection(collection).doc(this.gameId).update(updatePayload);
                
                // Clear local changes for this hole
                for (const key of Object.keys(this.localChanges)) {
                    if (key.startsWith(`${flight}_${this.currentHole}_`)) {
                        delete this.localChanges[key];
                    }
                }
                this.syncStatus = 'Saved!';
                setTimeout(() => { if (this.syncStatus === 'Saved!') this.syncStatus = 'Synced'; }, 2000);
            } catch (error) {
                this.syncStatus = `Save error: ${error.message}`;
            }
        },
        
        // Update flight data string (162 chars)
        updateFlightDataString(oldString, holeNumber, scores) {
            // Find storage position for this hole (based on startingHole)
            let storagePos;
            if (this.startingHole === 1) {
                storagePos = holeNumber - 1;
            } else {
                const playOrder = [];
                for (let i = this.startingHole; i <= 18; i++) playOrder.push(i);
                for (let i = 1; i < this.startingHole; i++) playOrder.push(i);
                storagePos = playOrder.indexOf(holeNumber);
            }
            
            const a1Str = scores.a1.toString().padStart(2, '0');
            const a2Str = scores.a2.toString().padStart(2, '0');
            const b1Str = scores.b1.toString().padStart(2, '0');
            const b2Str = scores.b2.toString().padStart(2, '0');
            const newSegment = 'T' + a1Str + a2Str + b1Str + b2Str;
            
            const startIdx = storagePos * 9;
            return oldString.substring(0, startIdx) + newSegment + oldString.substring(startIdx + 9);
        },
        
        // Parse flight data string into object
        parseFlightData(dataString) {
            const result = {};
            for (let pos = 0; pos < 18; pos++) {
                let actualHole;
                if (this.startingHole === 1) {
                    actualHole = pos + 1;
                } else {
                    const playOrder = [];
                    for (let i = this.startingHole; i <= 18; i++) playOrder.push(i);
                    for (let i = 1; i < this.startingHole; i++) playOrder.push(i);
                    actualHole = playOrder[pos];
                }
                
                const startIdx = pos * 9;
                const segment = dataString.substring(startIdx, startIdx + 9);
                if (segment.length === 9) {
                    result[actualHole] = {
                        saved: segment[0] === 'T',
                        a1: parseInt(segment.substring(1, 3), 10),
                        a2: parseInt(segment.substring(3, 5), 10),
                        b1: parseInt(segment.substring(5, 7), 10),
                        b2: parseInt(segment.substring(7, 9), 10)
                    };
                }
            }
            return result;
        },
        
        // Calculate TR (simplified for now)
        calculateTR() {
            // This will be expanded with real calculations
            // For now, keep 9.5 - 9.5
            this.trTeamA = 9.5;
            this.trTeamB = 9.5;
            this.trTeamAGreen = true;
            this.trTeamBGreen = true;
        },
        
        // Navigation
        nextHole() {
            if (this.currentHole < 18 && this.isCurrentHoleSaved) {
                this.currentHole++;
            }
        },
        
        prevHole() {
            if (this.currentHole > 1) {
                this.currentHole--;
            }
        },
        
        // Initialize
        async init() {
            // Get session and game ID
            await new Promise((resolve) => {
                SessionManager.initSession('game.html', 'index.html', (session) => {
                    this.gameId = session.activeGame?.gameId;
                    this.gameMode = session.activeGame?.gameMode || 'real';
                    this.modeDisplay = this.gameMode === 'real' ? 'LIVE' : 'PREVIEW';
                    this.editableFlight = session.activeGame?.role === 'update1' ? 1 : 
                                        session.activeGame?.role === 'update2' ? 2 : 1;
                    this.canEdit = this.editableFlight === 1 || this.editableFlight === 2;
                    resolve();
                });
            });
            
            if (!this.gameId) {
                this.syncStatus = 'Error: No game ID';
                this.loading = false;
                return;
            }
            
            // Get game document reference
            const gameRef = db.collection('scheduledGames').doc(this.gameId);
            
            // Get initial data
            const doc = await gameRef.get();
            if (!doc.exists) {
                this.syncStatus = 'Error: Game not found';
                this.loading = false;
                return;
            }
            
            const data = doc.data();
            this.courseName = data.course?.name || 'Unknown Course';
            this.coursePar = data.course?.par || [];
            this.courseSi = data.course?.si || [];
            this.allPlayers = data.players || [];
            this.startingHole = data.startingHole || 1;
            this.f1DataString = data.f1?.d || '';
            this.f2DataString = data.f2?.d || '';
            
            // Parse flight data
            this.flight1Data = this.parseFlightData(this.f1DataString);
            this.flight2Data = this.parseFlightData(this.f2DataString);
            
            // Calculate initial TR
            this.calculateTR();
            
            this.loading = false;
            this.syncStatus = 'Synced';
            
            // Set up real-time listener
            this.unsubscribe = gameRef.onSnapshot((snapshot) => {
                if (snapshot.exists) {
                    const newData = snapshot.data();
                    this.f1DataString = newData.f1?.d || this.f1DataString;
                    this.f2DataString = newData.f2?.d || this.f2DataString;
                    
                    // Re-parse if changed
                    const newF1 = this.parseFlightData(this.f1DataString);
                    const newF2 = this.parseFlightData(this.f2DataString);
                    
                    // Check if changed
                    if (JSON.stringify(newF1) !== JSON.stringify(this.flight1Data)) {
                        this.flight1Data = newF1;
                        // Clear local changes that conflict
                        for (const key of Object.keys(this.localChanges)) {
                            if (key.startsWith('1_')) {
                                delete this.localChanges[key];
                            }
                        }
                    }
                    if (JSON.stringify(newF2) !== JSON.stringify(this.flight2Data)) {
                        this.flight2Data = newF2;
                        for (const key of Object.keys(this.localChanges)) {
                            if (key.startsWith('2_')) {
                                delete this.localChanges[key];
                            }
                        }
                    }
                    
                    this.calculateTR();
                    this.syncStatus = 'Synced';
                }
            }, (error) => {
                this.syncStatus = `Sync error: ${error.message}`;
            });
        },
        
        // Cleanup
        destroy() {
            if (this.unsubscribe) {
                this.unsubscribe();
            }
        }
    };
}
</script>
