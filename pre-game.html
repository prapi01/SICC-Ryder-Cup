<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: linear-gradient(145deg, #0a1a0a 0%, #000000 100%);
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);

            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;

        .flight-card {
            background: #111;

            text-align: center;
        }
        
        .players-list {
            margin-bottom: 20px;
        }
        
        .player-row {
            display: flex;
            justify-content: space-between;

            background: #1a3a1a;

        }
        
        .role-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .role-btn {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 2px solid;
            background: #1a1a1a;
            text-align: center;
        }
        
        .role-btn:active {
            transform: scale(0.97);
        }
        
        /* Role button states */
        .role-unlocked {
            border-color: #4caf50;
            color: #4caf50;
            background: #1a3a1a;
        }
        
        .role-selected {
            border-color: #4caf50;
            color: #4caf50;
            background: #1a3a1a;
            position: relative;
        }
        
        .role-selected::after {
            content: " ✓";
            font-weight: 800;
        }
        
        .role-locked-self {
            border-color: #4caf50;
            color: #4caf50;
            background: #1a3a1a;
            position: relative;
        }
        
        .role-locked-self::after {
            content: " 🔒";
        }
        
        .role-locked-other {
            border-color: #666;
            color: #888;
            background: #2a2a2a;
            cursor: pointer;
        }
        
        .role-locked-other:hover {
            border-color: #ffaa44;
            color: #ffaa44;
            background: #3a3a3a;
        }
        
        .tee-off-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #1a3a1a, #0d2a0d);
            border: 2px solid #4caf50;
            color: #4caf50;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 60px;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
            margin-top: 20px;
        }
        
        .tee-off-btn:active {
            transform: scale(0.98);
        }
        
        .tee-off-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .back-btn {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #4caf50;
            color: #4caf50;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
            margin-top: 12px;
            transition: all 0.1s ease;
        }
        
        .back-btn:active {
            transform: scale(0.98);
        }
        
        .debug {
            text-align: center;
            font-size: 0.6rem;
            color: #444;
            margin-top: 20px;
        }
        
        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            backdrop-filter: blur(8px);
        }
        
        .takeover-modal-container {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 32px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            border: 2px solid #ffaa44;
        }
        
        .takeover-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffaa44;
            margin-bottom: 16px;
        }
        
        .takeover-message {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 24px;
        }
        
        .takeover-device {
            font-size: 0.8rem;
            color: #ffaa44;
            margin-bottom: 20px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 20px;
        }
        
        .takeover-buttons {
            display: flex;
            gap: 12px;
        }
        
        .takeover-btn-no {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #888;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .takeover-btn-yes {
            flex: 1;
            background: #ffaa44;
            border: none;
            color: #1a3a1a;
            padding: 12px;
            border-radius: 40px;
            font-weight: 800;
            cursor: pointer;
        }
        
        .takeover-btn-yes:active, .takeover-btn-no:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="flight1Card" class="flight-card">
        <div class="flight-title">✈️ FLIGHT 1</div>
        <div id="flight1Players" class="players-list">
            <div class="player-row"><span class="player-name">Ang C H</span><span class="player-handicap">HCP 2</span></div>
            <div class="player-row"><span class="player-name">C K</span><span class="player-handicap">HCP 10</span></div>
            <div class="player-row"><span class="player-name">Ong C B</span><span class="player-handicap">HCP 1</span></div>
            <div class="player-row"><span class="player-name">James Ong</span><span class="player-handicap">HCP 10</span></div>
        </div>
        <div class="role-buttons">
            <button id="roleF1Btn" class="role-btn role-unlocked">UPDATE FLIGHT 1</button>
        </div>
    </div>
    
    <div id="flight2Card" class="flight-card">
        <div class="flight-title">✈️ FLIGHT 2</div>
        <div id="flight2Players" class="players-list">
            <div class="player-row"><span class="player-name">K F</span><span class="player-handicap">HCP 2</span></div>
            <div class="player-row"><span class="player-name">Yip H M</span><span class="player-handicap">HCP 14</span></div>
            <div class="player-row"><span class="player-name">Jeff Goh</span><span class="player-handicap">HCP 0</span></div>
            <div class="player-row"><span class="player-name">Piti</span><span class="player-handicap">HCP 10</span></div>
        </div>
        <div class="role-buttons">
            <button id="roleF2Btn" class="role-btn role-unlocked">UPDATE FLIGHT 2</button>
        </div>
    </div>
    
    <button id="teeOffBtn" class="tee-off-btn" disabled>🏌️ TEE OFF</button>
    <button id="backBtn" class="back-btn">← BACK TO MAIN MENU</button>
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v3.50</div>

<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Global State
// ============================================================

var gameId = null;
var gameMode = null;
var gameCollection = null;
var selectedRole = null;  // "f1" or "f2" or null
var currentLocks = { f1: null, f2: null };
var currentDeviceId = null;
var currentSessionId = null;
var unsubscribeLocks = null;

// ============================================================
// Helper Functions
// ============================================================

async function getGameId() {
    var session = await new Promise(function(resolve) {
        SessionManager.getSession(resolve);
    });
    if (session.activeGame && session.activeGame.gameId) {
        return session.activeGame.gameId;
    }
    return sessionStorage.getItem('currentGameId');
}

async function getDeviceInfo() {
    currentDeviceId = await SessionManager.getShortNameOnly();
    var session = await new Promise(function(resolve) {
        SessionManager.getSession(resolve);
    });
    currentSessionId = session.sessionId;
}

function isLockExpired(lock) {
    if (!lock) return true;
    return lock.ex < Date.now();
}

function getLockHolderDisplay(lock) {
    if (!lock) return null;
    return lock.did || lock.deviceId || "Unknown";
}

function updateRoleButtons() {
    var f1Btn = document.getElementById('roleF1Btn');
    var f2Btn = document.getElementById('roleF2Btn');
    var teeOffBtn = document.getElementById('teeOffBtn');
    
    var f1Lock = currentLocks.f1;
    var f2Lock = currentLocks.f2;
    
    var f1LockValid = f1Lock && !isLockExpired(f1Lock);
    var f2LockValid = f2Lock && !isLockExpired(f2Lock);
    var f1LockHolder = f1LockValid ? getLockHolderDisplay(f1Lock) : null;
    var f2LockHolder = f2LockValid ? getLockHolderDisplay(f2Lock) : null;
    var isMyF1Lock = f1LockValid && f1LockHolder === currentDeviceId;
    var isMyF2Lock = f2LockValid && f2LockHolder === currentDeviceId;
    
    // Update Flight 1 button
    if (isMyF1Lock) {
        f1Btn.className = 'role-btn role-locked-self';
        f1Btn.innerText = 'UPDATE FLIGHT 1';
        f1Btn.disabled = false;  // FIXED: Clickable to unlock
    } else if (f1LockValid) {
        f1Btn.className = 'role-btn role-locked-other';
        f1Btn.innerText = `UPDATE FLIGHT 1 (locked by ${f1LockHolder})`;
        f1Btn.disabled = false;  // FIXED: Clickable for takeover
    } else if (selectedRole === 'f1') {
        f1Btn.className = 'role-btn role-selected';
        f1Btn.innerText = 'UPDATE FLIGHT 1';
        f1Btn.disabled = false;
    } else {
        f1Btn.className = 'role-btn role-unlocked';
        f1Btn.innerText = 'UPDATE FLIGHT 1';
        f1Btn.disabled = false;
    }
    
    // Update Flight 2 button
    if (isMyF2Lock) {
        f2Btn.className = 'role-btn role-locked-self';
        f2Btn.innerText = 'UPDATE FLIGHT 2';
        f2Btn.disabled = false;
    } else if (f2LockValid) {
        f2Btn.className = 'role-btn role-locked-other';
        f2Btn.innerText = `UPDATE FLIGHT 2 (locked by ${f2LockHolder})`;
        f2Btn.disabled = false;  // FIXED: Clickable for takeover
    } else if (selectedRole === 'f2') {
        f2Btn.className = 'role-btn role-selected';
        f2Btn.innerText = 'UPDATE FLIGHT 2';
        f2Btn.disabled = false;
    } else {
        f2Btn.className = 'role-btn role-unlocked';
        f2Btn.innerText = 'UPDATE FLIGHT 2';
        f2Btn.disabled = false;
    }
    
    // Enable TEE OFF if user has a valid lock (self)
    var canTeeOff = isMyF1Lock || isMyF2Lock;
    teeOffBtn.disabled = !canTeeOff;
}

function showTakeoverModal(flight, currentLockHolder) {
    // Remove any existing modal
    var existingModal = document.querySelector('.modal-overlay');
    if (existingModal) existingModal.remove();
    
    var modalHtml = `
        <div class="modal-overlay" id="takeoverModal">
            <div class="takeover-modal-container">
                <div class="takeover-title">🔄 ROLE TAKEOVER</div>
                <div class="takeover-message">This role is currently locked by another device.</div>
                <div class="takeover-device">🔒 Locked by: ${currentLockHolder}</div>
                <div class="takeover-message">Do you want to take over this role?</div>
                <div class="takeover-buttons">
                    <button class="takeover-btn-no" id="takeoverNoBtn">NO, CANCEL</button>
                    <button class="takeover-btn-yes" id="takeoverYesBtn">YES, TAKE OVER</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById('takeoverNoBtn').onclick = function() {
        document.getElementById('takeoverModal').remove();
    };
    
    document.getElementById('takeoverYesBtn').onclick = async function() {
        document.getElementById('takeoverModal').remove();
        await takeOverRole(flight);
    };
}

async function takeOverRole(flight) {
    var lockKey = flight === 'f1' ? 'locks.f1' : 'locks.f2';
    var lockData = {
        did: currentDeviceId,
        sid: currentSessionId,
        at: Date.now(),
        ex: Date.now() + (6 * 60 * 60 * 1000)  // 6 hours
    };
    
    try {
        await db.collection(gameCollection).doc(gameId).update({
            [lockKey]: lockData,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log(`Takeover successful for ${flight}`);
        
        // If this device had the other flight locked, release it (one device, one role)
        var otherFlight = flight === 'f1' ? 'f2' : 'f1';
        var otherLockKey = otherFlight === 'f1' ? 'locks.f1' : 'locks.f2';
        var otherLock = currentLocks[otherFlight];
        var otherLockValid = otherLock && !isLockExpired(otherLock);
        var isOtherMyLock = otherLockValid && getLockHolderDisplay(otherLock) === currentDeviceId;
        
        if (isOtherMyLock) {
            await db.collection(gameCollection).doc(gameId).update({
                [otherLockKey]: null
            });
            console.log(`Released previous lock on ${otherFlight}`);
        }
        
        // Refresh the page to reflect new lock state
        location.reload();
    } catch (error) {
        console.error("Takeover failed:", error);
        alert("Failed to take over role. Please try again.");
    }
}

async function releaseLock(flight) {
    var lockKey = flight === 'f1' ? 'locks.f1' : 'locks.f2';
    try {
        await db.collection(gameCollection).doc(gameId).update({
            [lockKey]: null
        });
        console.log(`Lock released for ${flight}`);
        selectedRole = null;
        location.reload();
    } catch (error) {
        console.error("Failed to release lock:", error);
    }
}

async function setSelectedRole(flight) {
    var lockKey = flight === 'f1' ? 'locks.f1' : 'locks.f2';
    var currentLock = currentLocks[flight];
    var lockValid = currentLock && !isLockExpired(currentLock);
    var lockHolder = lockValid ? getLockHolderDisplay(currentLock) : null;
    var isMyLock = lockValid && lockHolder === currentDeviceId;
    
    // If already locked by this device, unlock (release)
    if (isMyLock) {
        await releaseLock(flight);
        return;
    }
    
    // If locked by another device, show takeover modal
    if (lockValid && lockHolder !== currentDeviceId) {
        showTakeoverModal(flight, lockHolder);
        return;
    }
    
    // If unlocked, lock it
    var lockData = {
        did: currentDeviceId,
        sid: currentSessionId,
        at: Date.now(),
        ex: Date.now() + (6 * 60 * 60 * 1000)
    };
    
    try {
        await db.collection(gameCollection).doc(gameId).update({
            [lockKey]: lockData,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log(`Lock acquired for ${flight}`);
        
        // If this device had the other flight locked, release it (one device, one role)
        var otherFlight = flight === 'f1' ? 'f2' : 'f1';
        var otherLockKey = otherFlight === 'f1' ? 'locks.f1' : 'locks.f2';
        var otherLock = currentLocks[otherFlight];
        var otherLockValid = otherLock && !isLockExpired(otherLock);
        var isOtherMyLock = otherLockValid && getLockHolderDisplay(otherLock) === currentDeviceId;
        
        if (isOtherMyLock) {
            await db.collection(gameCollection).doc(gameId).update({
                [otherLockKey]: null
            });
            console.log(`Released previous lock on ${otherFlight}`);
        }
        
        selectedRole = flight;
        location.reload();
    } catch (error) {
        console.error("Failed to acquire lock:", error);
        alert("Failed to lock role. Please try again.");
    }
}

function startLockListener() {
    if (unsubscribeLocks) unsubscribeLocks();
    unsubscribeLocks = db.collection(gameCollection).doc(gameId).onSnapshot(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            currentLocks = {
                f1: data.locks?.f1 || null,
                f2: data.locks?.f2 || null
            };
            updateRoleButtons();
        }
    }, function(error) {
        console.error("Lock listener error:", error);
    });
}

// ============================================================
// Navigation
// ============================================================

async function proceedToGame() {
    var isF1Locked = currentLocks.f1 && !isLockExpired(currentLocks.f1);
    var isF2Locked = currentLocks.f2 && !isLockExpired(currentLocks.f2);
    var isMyF1Lock = isF1Locked && getLockHolderDisplay(currentLocks.f1) === currentDeviceId;
    var isMyF2Lock = isF2Locked && getLockHolderDisplay(currentLocks.f2) === currentDeviceId;
    
    if (!isMyF1Lock && !isMyF2Lock) {
        alert("Please select a role first.");
        return;
    }
    
    var targetPage = (gameMode === "preview") ? "preview-game.html" : "real-game.html";
    var role = isMyF1Lock ? "update1" : "update2";
    
    await SessionManager.updateSession({
        activeGame: {
            gameId: gameId,
            gameType: gameMode,
            gameMode: gameMode,
            role: role,
            collection: gameCollection
        }
    });
    
    window.location.href = targetPage;
}

function goBack() {
    SessionManager.getSession(function(session) {
        var returnDest = session.returnDestination || "index.html";
        window.location.href = returnDest;
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var shortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + shortName;
    
    await getDeviceInfo();
    
    gameId = await getGameId();
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    var session = await new Promise(function(resolve) {
        SessionManager.getSession(resolve);
    });
    gameMode = session.activeGame?.gameType || "real";
    gameCollection = (gameMode === "preview") ? "previewSandboxes" : "scheduledGames";
    
    // Load initial locks
    var doc = await db.collection(gameCollection).doc(gameId).get();
    if (doc.exists) {
        var data = doc.data();
        currentLocks = {
            f1: data.locks?.f1 || null,
            f2: data.locks?.f2 || null
        };
    }
    
    // Set up button handlers
    document.getElementById('roleF1Btn').onclick = function() { setSelectedRole('f1'); };
    document.getElementById('roleF2Btn').onclick = function() { setSelectedRole('f2'); };
    document.getElementById('teeOffBtn').onclick = proceedToGame;
    document.getElementById('backBtn').onclick = goBack;
    
    updateRoleButtons();
    startLockListener();
}

init();
</script>

</body>
</html>
