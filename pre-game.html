<script>
// FILE: pre-game.html - VERSION 3.14

var VERSION = "3.14";
var CACHE_KEY = "pre_game_version";
var LOCK_DURATION_MS = 6 * 60 * 60 * 1000;
var STALE_THRESHOLD_MS = 60 * 60 * 1000;

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var unsubcribeGame = null;

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

var gameData = null;
var gameId = null;
var gameMode = null;
var tempSelectedRole = null;
var currentDeviceId = null;
var currentSessionId = null;
var deviceSession = null;
var isPreviewSandbox = false;

var locks = { f1: null, f2: null };
var currentShortName = "DEV-??";

// ============================================================
// Read cached data from index.html preload
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyCachedDataToGameLoader() {
    var cached = getPreloadedRawGameData();
    if (!cached || !cached.rawData) {
        console.error("No cached data available - this should not happen");
        return false;
    }
    
    console.log("Applying cached data to GameLoader");
    var rawData = cached.rawData;
    
    var cacheData = {
        course: rawData.course,
        players: rawData.players,
        startingHole: rawData.startingHole || 1,
        teamGameFormat: rawData.teamGameFormat || "tournament",
        f1DataString: rawData.f1?.d || "",
        f2DataString: rawData.f2?.d || "",
        results: rawData.results || null,
        savedHoles: { 1: [], 2: [] },
        t1Row: new Array(18).fill('_'),
        t2Row: new Array(18).fill('_'),
        strkRow: new Array(18).fill('0'),
        lastSyncedHole: 0,
        clinchedAt: {},
        signatures: rawData.signatures || { f1: false, f2: false },
        submitted: rawData.submitted || { f1: false, f2: false },
        locks: rawData.locks || { f1: null, f2: null },
        gameStarted: rawData.gameStarted || false
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(cacheData);
    } else {
        console.error("GameLoader.setLocalCache not available");
        return false;
    }
    
    gameId = cached.gameId;
    
    return true;
}

// ============================================================
// Display Functions
// ============================================================

function displayDeviceId() {
    var shortName = SessionManager.getShortNameOnly();
    currentShortName = shortName;
    var deviceTag = document.getElementById("deviceTag");
    deviceTag.innerHTML = "🖥️ " + shortName;
    
    var tapCount = 0;
    var tapTimer = null;
    deviceTag.addEventListener("click", function() {
        tapCount++;
        if (tapTimer) clearTimeout(tapTimer);
        tapTimer = setTimeout(function() {
            if (tapCount >= 2) {
                showAdminResetModal();
            }
            tapCount = 0;
        }, 300);
    });
}

function showAdminResetModal() {
    var modalHtml = `
        <div class="modal-overlay" id="adminResetModal">
            <div class="modal">
                <div class="modal-title">⚠️ ADMIN RESET</div>
                <div class="modal-message">This will reset ALL game data:</div>
                <div class="modal-message" style="font-size:0.7rem; margin-top:4px;">• All scores</div>
                <div class="modal-message" style="font-size:0.7rem;">• All locks</div>
                <div class="modal-message" style="font-size:0.7rem;">• Game started flag</div>
                <div class="modal-message" style="margin-top:10px; color:#ffaa44;">This action cannot be undone.</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-cancel" id="adminResetCancelBtn">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" id="adminResetConfirmBtn">✓ Reset Game</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("adminResetCancelBtn").addEventListener("click", function() {
        document.getElementById("adminResetModal").remove();
    });
    
    document.getElementById("adminResetConfirmBtn").addEventListener("click", function() {
        document.getElementById("adminResetModal").remove();
        
        var startingHoleVal = gameData.startingHole || 1;
        var coursePar = gameData.course.par;
        
        GameData.resetFullGame(gameId, startingHoleVal, coursePar, function(success) {
            if (success) {
                alert("Game has been reset. Page will reload.");
                window.location.reload();
            } else {
                alert("Reset failed. Please try again.");
            }
        });
    });
}

function formatDisplayDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split('-');
    if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    return dateStr;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function generateDefaultDataNatural(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function rotateDataString(naturalData, startingHoleVal) {
    if (startingHoleVal === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHoleVal - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHoleVal - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

function resetLocksOnly(callback) {
    if (!db || !gameId) {
        if (callback) callback(false);
        return;
    }
    
    var resetData = {
        "locks.f1": null,
        "locks.f2": null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection("scheduledGames").doc(gameId).update(resetData).then(function() {
        console.log("Locks reset only - scores preserved");
        locks.f1 = null;
        locks.f2 = null;
        tempSelectedRole = null;
        if (callback) callback(true);
    }).catch(function(e) {
        console.error("Reset locks error:", e);
        if (callback) callback(false);
    });
}

function hasAnyScores() {
    if (!gameData) return false;
    var f1HasT = gameData.f1?.d?.indexOf('T') !== -1;
    var f2HasT = gameData.f2?.d?.indexOf('T') !== -1;
    return f1HasT || f2HasT;
}

function startGameListener() {
    if (!firestoreReady || !gameId) return;
    if (unsubcribeGame) unsubcribeGame();
    
    var collection = "scheduledGames";
    
    unsubcribeGame = db.collection(collection).doc(gameId)
        .onSnapshot(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                if (data.locks) {
                    locks.f1 = data.locks.f1 || null;
                    locks.f2 = data.locks.f2 || null;
                    console.log("Listener updated locks:", locks);
                }
                render();
            }
        }, function(error) {
            console.warn("Game listener error:", error);
        });
}

// NEW v3.14: Immediate Firestore read to ensure locks are correct on load
function fetchLocksOnce() {
    if (!firestoreReady || !gameId) return;
    
    db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            if (data.locks) {
                var oldF1 = locks.f1;
                var oldF2 = locks.f2;
                locks.f1 = data.locks.f1 || null;
                locks.f2 = data.locks.f2 || null;
                console.log("fetchLocksOnce - updated locks from Firestore:", locks);
                console.log("  Previous f1:", oldF1?.did, "-> New f1:", locks.f1?.did);
                console.log("  Previous f2:", oldF2?.did, "-> New f2:", locks.f2?.did);
                render();
            }
        }
    }).catch(function(e) {
        console.warn("fetchLocksOnce error:", e);
    });
}

function canTakeRole(role) {
    var now = Date.now();
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    
    if (role === "update1") {
        var otherLockValid = locks.f2 && locks.f2.ex && locks.f2.ex > now;
        var otherLockIsMe = otherLockValid && locks.f2.did === myDeviceIdFull;
        if (otherLockIsMe) {
            alert("You already have Flight 2. Only one role per device.");
            return false;
        }
    } else if (role === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;
        var otherLockIsMe2 = otherLockValid2 && locks.f1.did === myDeviceIdFull;
        if (otherLockIsMe2) {
            alert("You already have Flight 1. Only one role per device.");
            return false;
        }
    }
    
    return true;
}

function toggleRole(role) {
    if (tempSelectedRole === role) {
        tempSelectedRole = null;
        render();
        return;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    if (role === "update1" && isF1Locked && !isF1LockedByMe) {
        showTakeoverModal(1);
        return;
    }
    if (role === "update2" && isF2Locked && !isF2LockedByMe) {
        showTakeoverModal(2);
        return;
    }
    
    if (!canTakeRole(role)) return;
    
    tempSelectedRole = role;
    
    if (deviceSession) {
        SessionManager.updateSession({
            activeGame: {
                gameId: gameId,
                gameType: gameMode,
                gameMode: gameMode,
                role: role,
                collection: "scheduledGames"
            }
        });
    }
    
    render();
}

function showTakeoverModal(flight) {
    var lock = flight === 1 ? locks.f1 : locks.f2;
    if (!lock) return;
    
    var deviceId = lock.did || "Unknown device";
    
    var modalHtml = `
        <div class="modal-overlay" id="takeoverModal">
            <div class="modal">
                <div class="modal-title">⚠️ ROLE TAKEOVER</div>
                <div class="modal-message">Flight ${flight} is currently locked by:</div>
                <div class="modal-device">${deviceId}</div>
                <div class="modal-message">Take over this role? The current device will be notified.</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-cancel" id="takeoverCancelBtn">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" id="takeoverConfirmBtn">✓ Take Over</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("takeoverCancelBtn").addEventListener("click", function() {
        document.getElementById("takeoverModal").remove();
    });
    
    document.getElementById("takeoverConfirmBtn").addEventListener("click", function() {
        document.getElementById("takeoverModal").remove();
        takeoverRole(flight);
    });
}

function takeoverRole(flight) {
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var collection = "scheduledGames";
    var deviceId = SessionManager.getDeviceIdDisplay();
    
    var sessionId = deviceSession?.sessionId || SessionManager.getSession()?.sessionId || "unknown";
    
    var updatePayload = {};
    var lockField = flight === 1 ? "locks.f1" : "locks.f2";
    
    updatePayload[lockField] = {
        did: deviceId,
        sid: sessionId,
        at: now,
        ex: expiryTime,
        takeoverAt: now
    };
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    db.collection(collection).doc(gameId).update(updatePayload).then(function() {
        console.log("Role takeover successful for Flight", flight);
        if (flight === 1) {
            locks.f1 = updatePayload["locks.f1"];
        } else {
            locks.f2 = updatePayload["locks.f2"];
        }
        tempSelectedRole = flight === 1 ? "update1" : "update2";
        render();
        alert(`You have taken over Flight ${flight}. Click TEE OFF to enter the game.`);
    }).catch(function(e) {
        alert("Error taking over role: " + e.message);
    });
}

function isGameCompleted(gameData) {
    if (!gameData) return false;
    var signatures = gameData.signatures || {};
    return signatures.f1?.signed === true && signatures.f2?.signed === true;
}

function loadGame() {
    var realGameId = sessionStorage.getItem("currentGameId");
    var activeGame = deviceSession ? deviceSession.activeGame : null;
    
    if (!realGameId) {
        alert("No game selected. Please return to main menu.");
        window.location.href = "index.html";
        return;
    }
    
    gameId = realGameId;
    gameMode = "real";
    isPreviewSandbox = false;
    
    var cacheApplied = applyCachedDataToGameLoader();
    
    if (!cacheApplied) {
        console.error("Failed to apply cached data - this should not happen");
        alert("Error loading game data. Please return to main menu and try again.");
        window.location.href = "index.html";
        return;
    }
    
    var cached = getPreloadedRawGameData();
    if (cached && cached.rawData) {
        gameData = cached.rawData;
        gameData.id = cached.gameId;
        
        // Initialize locks from cache (may be stale)
        if (gameData.locks) {
            locks.f1 = gameData.locks.f1 || null;
            locks.f2 = gameData.locks.f2 || null;
        }
        
        console.log("REAL mode - Data loaded from cache, locks from cache:", locks);
        
        startGameListener();
        
        // NEW v3.14: Immediately fetch fresh locks from Firestore
        fetchLocksOnce();
        
        render();
    } else {
        console.error("No cache data available");
        alert("Error loading game data. Please return to main menu and try again.");
        window.location.href = "index.html";
    }
}

function startGame() {
    if (!tempSelectedRole) {
        alert("Please select a role first");
        return;
    }
    
    if (tempSelectedRole === "view") {
        if (isGameCompleted(gameData)) {
            console.log("Game is completed - redirecting to view-history.html");
            window.location.href = "view-history.html?gameId=" + gameId;
            return;
        }
        
        localStorage.setItem("userRole", "view");
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: "view",
                    collection: "scheduledGames"
                }
            });
            SessionManager.addNavigationHistory("view-game.html", "tee_off_view", { gameId: gameId });
        }
        window.location.href = "view-game.html";
        return;
    }
    
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var collection = "scheduledGames";
    var updatePayload = {};
    
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    if (tempSelectedRole === "update1" && isF1Locked && !isF1LockedByMe) {
        alert("Flight 1 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    if (tempSelectedRole === "update2" && isF2Locked && !isF2LockedByMe) {
        alert("Flight 2 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    
    if (tempSelectedRole === "update1") {
        var otherLockValid = locks.f2 && locks.f2.ex && locks.f2.ex > now;
        var otherLockIsMe = otherLockValid && locks.f2.did === myDeviceIdFull;
        if (otherLockIsMe) {
            alert("You already have Flight 2. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    } else if (tempSelectedRole === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;
        var otherLockIsMe2 = otherLockValid2 && locks.f1.did === myDeviceIdFull;
        if (otherLockIsMe2) {
            alert("You already have Flight 1. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    }
    
    var deviceId = SessionManager.getDeviceIdDisplay();
    var sessionId = deviceSession?.sessionId || SessionManager.getSession()?.sessionId || "unknown";
    
    if (tempSelectedRole === "update1") {
        updatePayload["locks.f1"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    } else if (tempSelectedRole === "update2") {
        updatePayload["locks.f2"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    }
    
    updatePayload["gameStarted"] = true;
    updatePayload["lastActive"] = firebase.firestore.FieldValue.serverTimestamp();
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    console.log("Writing lock with sessionId:", sessionId);
    
    db.collection(collection).doc(gameId).update(updatePayload).then(function() {
        localStorage.setItem("userRole", tempSelectedRole);
        
        var targetPage = "real-game.html";
        
        console.log("Redirecting to:", targetPage, "gameMode:", gameMode);
        
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: tempSelectedRole,
                    collection: collection
                }
            });
            
            SessionManager.addNavigationHistory(targetPage, "tee_off_" + tempSelectedRole, { gameId: gameId });
            window.location.href = targetPage;
        } else {
            window.location.href = targetPage;
        }
    }).catch(function(e) {
        console.error("Error locking role:", e);
        alert("Error locking role: " + e.message);
    });
}

function goBack() {
    var returnDest = SessionManager.getReturnDestination();
    window.location.href = returnDest;
}

function getFormatDisplayName(format) {
    if (format === "relative") return "Relative";
    return "Tournament";
}

function getButtonClass(flight) {
    var now = Date.now();
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isLocked = (flight === 1 ? locks.f1 : locks.f2) && (flight === 1 ? locks.f1.ex : locks.f2.ex) > now;
    var isLockedByMe = isLocked && (flight === 1 ? locks.f1.did : locks.f2.did) === myDeviceIdFull;
    var isSelected = (flight === 1 && tempSelectedRole === "update1") || (flight === 2 && tempSelectedRole === "update2");
    
    if (isLocked && !isLockedByMe) {
        return "role-btn-locked";
    }
    
    if (isSelected) {
        return "role-btn-gold";
    }
    
    if (isLockedByMe && !isSelected) {
        return "role-btn-rejoin";
    }
    
    return "role-btn-default";
}

function getViewButtonClass() {
    var isSelected = (tempSelectedRole === "view");
    if (isSelected) {
        return "role-btn-gold";
    }
    return "role-btn-default";
}

function render() {
    if (!gameData) return;
    
    var courseName = gameData.course ? gameData.course.name : "Unknown Course";
    var players = gameData.players || [];
    var startingHole = gameData.startingHole || 1;
    var teamGameFormat = gameData.teamGameFormat || "tournament";
    var formatDisplayName = getFormatDisplayName(teamGameFormat);
    
    var dateDisplay = '';
    if (gameData.date) {
        dateDisplay = '<div class="course-date">' + formatDisplayDate(gameData.date) + '</div>';
    }
    
    var startingHoleText = "";
    if (startingHole === 1) {
        startingHoleText = "Hole 1";
    } else if (startingHole === 10) {
        startingHoleText = "Hole 10";
    } else {
        startingHoleText = "Shotgun " + startingHole;
    }
    
    var flight1Players = players.filter(function(p) { return p.flight === 1; });
    var flight1A = flight1Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight1B = flight1Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var flight2Players = players.filter(function(p) { return p.flight === 2; });
    var flight2A = flight2Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight2B = flight2Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    function renderTeam(teamPlayers) {
        var html = '';
        for (var i = 0; i < teamPlayers.length; i++) {
            var p = teamPlayers[i];
            html += '<div class="player-row"><span class="player-name">' + escapeHtml(p.name) + '</span><span class="player-handicap">' + p.handicap + '</span></div>';
        }
        return html;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    var f1ButtonClass = getButtonClass(1);
    var f2ButtonClass = getButtonClass(2);
    var viewButtonClass = getViewButtonClass();
    
    var f1ButtonText = "SCORE F1";
    var f2ButtonText = "SCORE F2";
    var viewButtonText = "VIEW ONLY";
    
    // v3.14: Keep buttons clickable for takeover, but disabled attribute is applied for locked buttons
    var isTeeOffDisabled = !tempSelectedRole && !isF1LockedByMe && !isF2LockedByMe;
    
    var roleStatusText = "";
    var roleStatusClass = "";
    if (tempSelectedRole === "update1") {
        roleStatusText = "✓ Score F1 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (tempSelectedRole === "update2") {
        roleStatusText = "✓ Score F2 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (tempSelectedRole === "view") {
        if (isGameCompleted(gameData)) {
            roleStatusText = "⚠️ This game is already completed. Click TEE OFF to see final results.";
        } else {
            roleStatusText = "✓ View Only selected. Click TEE OFF to continue.";
        }
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (isF1LockedByMe) {
        roleStatusText = "✓ You already have Flight 1. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (isF2LockedByMe) {
        roleStatusText = "✓ You already have Flight 2. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else {
        roleStatusText = "⚠️ Select a role above, then click TEE OFF";
        roleStatusClass = "role-status-warning";
    }
    
    var flight1LockInfo = '';
    var flight2LockInfo = '';
    
    if (isF1Locked) {
        var lockHolder = locks.f1.did || 'Unknown';
        flight1LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder}</span></div>`;
    } else {
        flight1LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    if (isF2Locked) {
        var lockHolder2 = locks.f2.did || 'Unknown';
        flight2LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder2}</span></div>`;
    } else {
        flight2LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    var html = `
        <div class="status-bubble" id="statusBubble">LIVE</div>
        
        <div class="header">
            <div class="title">🏌️ READY TO PLAY</div>
            <div class="subtitle">Verify teams and handicaps before teeing off</div>
        </div>
        
        <div class="course-card">
            <div class="course-name">⛳ ${escapeHtml(courseName)}</div>
            ${dateDisplay}
            <div class="course-info-row">
                <span class="course-info-item">
                    <span class="course-info-label">Starting Hole:</span>
                    <span class="course-info-value">${startingHoleText}</span>
                </span>
                <span class="course-info-item">
                    <span class="course-info-label">Team Game Format:</span>
                    <span class="course-info-value">${formatDisplayName}</span>
                </span>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3>FLIGHT 1</h3>
                ${flight1LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight1A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight1B)}</div>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3>FLIGHT 2</h3>
                ${flight2LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight2A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight2B)}</div>
            </div>
        </div>
        
        <div class="role-section">
            <div class="role-title">🎮 SELECT YOUR ROLE</div>
            <div class="role-buttons">
                <button class="role-btn ${f1ButtonClass}" onclick="toggleRole('update1')" ${f1ButtonClass === 'role-btn-locked' ? 'disabled' : ''}>${f1ButtonText}</button>
                <button class="role-btn ${f2ButtonClass}" onclick="toggleRole('update2')" ${f2ButtonClass === 'role-btn-locked' ? 'disabled' : ''}>${f2ButtonText}</button>
                <button class="role-btn ${viewButtonClass}" onclick="toggleRole('view')">${viewButtonText}</button>
            </div>
            <div class="role-status ${roleStatusClass}">${roleStatusText}</div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-back" onclick="goBack()">← BACK</button>
            <button class="btn btn-teeoff ${isTeeOffDisabled ? 'btn-teeoff-disabled' : ''}" onclick="startGame()" ${isTeeOffDisabled ? 'disabled' : ''}>⛳ TEE OFF →</button>
        </div>
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
    
    var statusBubble = document.getElementById("statusBubble");
    if (statusBubble) {
        statusBubble.onclick = function() {
            location.reload();
        };
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

window.toggleRole = toggleRole;
window.startGame = startGame;
window.goBack = goBack;
window.showTakeoverModal = showTakeoverModal;

SessionManager.initSession("pre-game.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    currentDeviceId = session.deviceId;
    displayDeviceId();
    loadGame();
});
</script>
</body>
</html>
