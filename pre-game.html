<body>
<div class="container" id="app">
    <div class="loading">Loading game data...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v2.29</div>

<script>
// FILE: pre-game.html - VERSION 2.29
// REMOVED: PRACTICE mode - only REAL and PREVIEW remain
// REAL mode: auto-reset on first device of game day
// PREVIEW mode: modal with RESET/CONTINUE when data exists

var VERSION = "2.29";
var CACHE_KEY = "pre_game_version";
var LOCK_DURATION_MS = 6 * 60 * 60 * 1000;

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var unsubcribeGame = null;

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

var gameData = null;
var gameId = null;
var gameMode = null;
var tempSelectedRole = null;
var currentDeviceId = null;
var currentSessionId = null;
var deviceSession = null;

var locks = { f1: null, f2: null };

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function formatDisplayDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split('-');
    if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    return dateStr;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function generateDefaultDataNatural(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function rotateDataString(naturalData, startingHole) {
    if (startingHole === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHole - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHole - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

function resetGameData(callback) {
    if (!db || !gameId) {
        if (callback) callback(false);
        return;
    }
    
    var startingHole = gameData.startingHole || 1;
    var naturalData = generateDefaultDataNatural(gameData.course.par);
    var rotatedData = rotateDataString(naturalData, startingHole);
    
    var resetData = {
        "f1.d": rotatedData,
        "f1.se": false,
        "f1.x": false,
        "f2.d": rotatedData,
        "f2.se": false,
        "f2.x": false,
        "locks.f1": null,
        "locks.f2": null,
        "currentHoleF1": 1,
        "currentHoleF2": 1,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection("scheduledGames").doc(gameId).update(resetData).then(function() {
        console.log("Game data reset to default - locks cleared");
        locks.f1 = null;
        locks.f2 = null;
        tempSelectedRole = null;
        if (callback) callback(true);
    }).catch(function(e) {
        console.error("Reset error:", e);
        if (callback) callback(false);
    });
}

function hasExistingData() {
    if (!gameData) return false;
    
    var f1HasData = gameData.f1 && gameData.f1.d && gameData.f1.d.indexOf('T') !== -1;
    var f2HasData = gameData.f2 && gameData.f2.d && gameData.f2.d.indexOf('T') !== -1;
    var f1HasEvent = gameData.f1 && (gameData.f1.se === true || gameData.f1.x === true);
    var f2HasEvent = gameData.f2 && (gameData.f2.se === true || gameData.f2.x === true);
    var hasLocks = (gameData.locks && (gameData.locks.f1 !== null || gameData.locks.f2 !== null));
    
    return f1HasData || f2HasData || f1HasEvent || f2HasEvent || hasLocks;
}

function startGameListener() {
    if (!firestoreReady || !gameId) return;
    if (unsubcribeGame) unsubcribeGame();
    
    unsubcribeGame = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                if (data.locks) {
                    locks.f1 = data.locks.f1 || null;
                    locks.f2 = data.locks.f2 || null;
                }
                render();
            }
        }, function(error) {
            console.warn("Game listener error:", error);
        });
}

function toggleRole(role) {
    if (tempSelectedRole === role) {
        tempSelectedRole = null;
        render();
        return;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    
    if (role === "update1" && isF1Locked) {
        alert("Flight 1 update role is already locked by another device");
        return;
    }
    if (role === "update2" && isF2Locked) {
        alert("Flight 2 update role is already locked by another device");
        return;
    }
    
    tempSelectedRole = role;
    
    if (deviceSession) {
        SessionManager.updateSession({
            activeGame: {
                gameId: gameId,
                gameType: gameMode,
                gameMode: gameMode,
                role: role,
                collection: "scheduledGames"
            }
        });
    }
    
    render();
}

function showSessionModal(callback) {
    var modalHtml = `
        <div class="modal-overlay" id="sessionModal">
            <div class="modal">
                <div class="modal-title">PREVIEW Session</div>
                <div class="modal-message">Existing game data found. What would you like to do?</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-reset" id="resetBtn">RESET (Start Over)</button>
                    <button class="modal-btn modal-btn-continue" id="continueBtn">CONTINUE</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("resetBtn").addEventListener("click", function() {
        document.getElementById("sessionModal").remove();
        resetGameData(function(success) {
            if (success) {
                window.location.reload();
            } else {
                if (callback) callback();
            }
        });
    });
    
    document.getElementById("continueBtn").addEventListener("click", function() {
        document.getElementById("sessionModal").remove();
        if (callback) callback();
    });
}

function loadGame() {
    var realGameId = sessionStorage.getItem("currentGameId");
    
    if (!realGameId) {
        alert("No game selected. Please return to main menu.");
        window.location.href = "index.html";
        return;
    }
    
    gameId = realGameId;
    
    db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            gameData = doc.data();
            gameData.id = doc.id;
            
            if (gameData.locks) {
                locks.f1 = gameData.locks.f1 || null;
                locks.f2 = gameData.locks.f2 || null;
            }
            
            var today = getTodayString();
            var isToday = (gameData.date === today);
            var hasLocks = (locks.f1 !== null || locks.f2 !== null);
            
            if (isToday) {
                gameMode = "real";
                if (!hasLocks) {
                    console.log("REAL mode - First device on game day. Resetting all data.");
                    resetGameData(function(success) {
                        db.collection("scheduledGames").doc(gameId).get().then(function(updatedDoc) {
                            if (updatedDoc.exists) {
                                gameData = updatedDoc.data();
                                gameData.id = updatedDoc.id;
                                if (gameData.locks) {
                                    locks.f1 = gameData.locks.f1 || null;
                                    locks.f2 = gameData.locks.f2 || null;
                                }
                            }
                            startGameListener();
                            render();
                        }).catch(function() {
                            startGameListener();
                            render();
                        });
                    });
                } else {
                    startGameListener();
                    render();
                }
            } else {
                gameMode = "preview";
                if (hasExistingData()) {
                    showSessionModal(function() {
                        render();
                    });
                } else {
                    startGameListener();
                    render();
                }
            }
        } else {
            alert("Game not found");
            window.location.href = "index.html";
        }
    }).catch(function(e) {
        alert("Error loading game: " + e.message);
        window.location.href = "index.html";
    });
}

function startGame() {
    if (!tempSelectedRole) {
        alert("Please select a role first");
        return;
    }
    
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var updatePayload = {};
    
    if (tempSelectedRole === "view") {
        localStorage.setItem("userRole", "view");
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: "view",
                    collection: "scheduledGames"
                }
            });
            SessionManager.addNavigationHistory("game.html", "tee_off_view", { gameId: gameId });
        }
        proceedToGame();
        return;
    }
    
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    
    if (tempSelectedRole === "update1" && isF1Locked) {
        alert("Flight 1 was locked by another device. Please refresh and try again.");
        tempSelectedRole = null;
        render();
        return;
    }
    if (tempSelectedRole === "update2" && isF2Locked) {
        alert("Flight 2 was locked by another device. Please refresh and try again.");
        tempSelectedRole = null;
        render();
        return;
    }
    
    var deviceId = SessionManager.getDeviceIdDisplay();
    var sessionId = deviceSession ? deviceSession.sessionId : "unknown";
    
    if (tempSelectedRole === "update1") {
        updatePayload["locks.f1"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    } else if (tempSelectedRole === "update2") {
        updatePayload["locks.f2"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    }
    
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    db.collection("scheduledGames").doc(gameId).update(updatePayload).then(function() {
        localStorage.setItem("userRole", tempSelectedRole);
        
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: tempSelectedRole,
                    collection: "scheduledGames"
                }
            });
            SessionManager.addNavigationHistory("game.html", "tee_off_" + tempSelectedRole, { gameId: gameId });
        }
        
        proceedToGame();
    }).catch(function(e) {
        alert("Error locking role: " + e.message);
    });
}

function resetRoleLocks() {
    if (confirm("⚠️ Reset all role locks? This will allow new devices to take update roles.")) {
        var resetPayload = {
            "locks.f1": null,
            "locks.f2": null,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        db.collection("scheduledGames").doc(gameId).update(resetPayload).then(function() {
            locks.f1 = null;
            locks.f2 = null;
            if (tempSelectedRole === "update1" || tempSelectedRole === "update2") {
                tempSelectedRole = null;
            }
            render();
        }).catch(function(e) {
            alert("Error resetting locks: " + e.message);
        });
    }
}

function proceedToGame() {
    sessionStorage.setItem("currentGame", JSON.stringify({
        id: gameData.id,
        date: gameData.date,
        course: gameData.course,
        players: gameData.players,
        mode: gameMode
    }));
    window.location.href = "game.html";
}

function goBack() {
    var returnDest = SessionManager.getReturnDestination();
    window.location.href = returnDest;
}

function render() {
    if (!gameData) return;
    
    var courseName = gameData.course ? gameData.course.name : "Unknown Course";
    var players = gameData.players || [];
    
    var modeBanner = '';
    if (gameMode === "real") {
        modeBanner = '<div class="mode-banner mode-real">🏆 REAL GAME - Scores are LIVE and synced to all devices</div>';
    } else if (gameMode === "preview") {
        modeBanner = '<div class="mode-banner mode-preview">🔍 PREVIEW MODE - Future game. Scores will NOT be saved.</div>';
    } else if (gameMode === "history") {
        modeBanner = '<div class="mode-banner mode-history">📜 HISTORY MODE - Read only. Past game results.</div>';
    }
    
    var dateDisplay = '';
    if (gameData.date) {
        dateDisplay = '<div class="course-date">📅 ' + formatDisplayDate(gameData.date) + '</div>';
    }
    
    var flight1Players = players.filter(function(p) { return p.flight === 1; });
    var flight1A = flight1Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    var flight1B = flight1Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    
    var flight2Players = players.filter(function(p) { return p.flight === 2; });
    var flight2A = flight2Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    var flight2B = flight2Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    
    function renderTeam(teamPlayers) {
        var html = '';
        for (var i = 0; i < teamPlayers.length; i++) {
            var p = teamPlayers[i];
            html += '<div class="player-row"><span class="player-name">' + escapeHtml(p.name) + '</span><span class="player-handicap">' + p.handicap + '</span></div>';
        }
        return html;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var isF1LockedBySelf = isF1Locked && locks.f1.did === SessionManager.getDeviceIdDisplay();
    var isF2LockedBySelf = isF2Locked && locks.f2.did === SessionManager.getDeviceIdDisplay();
    
    var update1Selected = (tempSelectedRole === "update1");
    var update2Selected = (tempSelectedRole === "update2");
    var viewSelected = (tempSelectedRole === "view");
    
    var update1Class = "role-btn";
    var update2Class = "role-btn";
    var viewClass = "role-btn role-btn-view";
    
    if (update1Selected) update1Class += " role-btn-selected";
    if (update2Selected) update2Class += " role-btn-selected";
    if (viewSelected) viewClass += " role-btn-selected";
    
    var isUpdate1Disabled = isF1Locked && !isF1LockedBySelf;
    var isUpdate2Disabled = isF2Locked && !isF2LockedBySelf;
    
    if (isUpdate1Disabled) update1Class += " role-btn-unavailable";
    if (isUpdate2Disabled) update2Class += " role-btn-unavailable";
    
    var isTeeOffDisabled = !tempSelectedRole;
    
    var roleStatusText = "";
    var roleStatusClass = "";
    if (tempSelectedRole === "update1") {
        roleStatusText = "✓ Flight 1 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
    } else if (tempSelectedRole === "update2") {
        roleStatusText = "✓ Flight 2 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
    } else if (tempSelectedRole === "view") {
        roleStatusText = "✓ View Only selected. Click TEE OFF to continue.";
        roleStatusClass = "role-status-selected";
    } else {
        roleStatusText = "⚠️ Select a role above, then click TEE OFF";
        roleStatusClass = "role-status-warning";
    }
    
    var html = `
        <div class="header">
            <div class="title">🏌️ READY TO PLAY</div>
            <div class="subtitle">Verify teams and handicaps before teeing off</div>
        </div>
        
        ${modeBanner}
        
        <div class="course-card">
            <div class="course-name">⛳ ${escapeHtml(courseName)}</div>
            ${dateDisplay}
        </div>
        
        <div class="flight-box">
            <div class="flight-header"><h3><i>⛳</i> FLIGHT 1</h3></div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight1A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight1B)}</div>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header"><h3><i>⛳</i> FLIGHT 2</h3></div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight2A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight2B)}</div>
            </div>
        </div>
        
        <div class="role-section">
            <div class="reset-icon" onclick="resetRoleLocks()">⟲</div>
            <div class="role-title">🎮 SELECT YOUR ROLE</div>
            <div class="role-buttons">
                <button class="${update1Class}" onclick="toggleRole('update1')" ${isUpdate1Disabled ? 'disabled' : ''}>✏️ UPDATE FLIGHT 1</button>
                <button class="${update2Class}" onclick="toggleRole('update2')" ${isUpdate2Disabled ? 'disabled' : ''}>✏️ UPDATE FLIGHT 2</button>
                <button class="${viewClass}" onclick="toggleRole('view')">👁️ VIEW ONLY</button>
            </div>
            <div class="role-status ${roleStatusClass}">${roleStatusText}</div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-back" onclick="goBack()">← BACK</button>
            <button class="btn btn-teeoff ${isTeeOffDisabled ? 'btn-teeoff-disabled' : ''}" onclick="startGame()" ${isTeeOffDisabled ? 'disabled' : ''}>⛳ TEE OFF →</button>
        </div>
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("pre-game.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    currentDeviceId = session.deviceId;
    displayDeviceId();
    loadGame();
});
</script>
</body>
</html>
