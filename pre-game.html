<script>
// FILE: pre-game.html - VERSION 3.28

// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[PRE-GAME] AppSettings not loaded, zoom may be enabled by default");
}

var VERSION = "3.28";
var CACHE_KEY = "pre_game_version_v328";

var LOCK_DURATION_MS = 6 * 60 * 60 * 1000;
var STALE_THRESHOLD_MS = 60 * 60 * 1000;

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    
    // v3.25: Preserve ALL existing URL parameters
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[PRE-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// Firebase already initialized in firebase-config.js
var db = firebase.firestore();
var firestoreReady = true;
var unsubcribeGame = null;

try {
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

var gameData = null;
var gameId = null;
var gameMode = null;
var tempSelectedRole = null;
var currentDeviceId = null;
var currentSessionId = null;
var deviceSession = null;
var isPreviewSandbox = false;

// v3.28: Preview mode flag
var isPreviewMode = false;

var locks = { f1: null, f2: null };
var currentShortName = "DEV-??";

// ============================================================
// v3.24: Long-click + Bubble for Admin - LARGER SQUARE BUTTON
// ============================================================

var adminBubbleTimeout = null;
var adminBubbleElement = null;
var isAdminBubbleActive = false;

function showAdminBubble(x, y) {
    // Remove any existing bubble
    hideAdminBubble();
    
    // Create LARGER SQUARE bubble with stacked text (matches index.html)
    var bubble = document.createElement('div');
    bubble.className = 'admin-bubble';
    bubble.innerHTML = `
        <span class="bubble-icon">⚙️</span>
        <span class="bubble-line1">ADMIN</span>
        <span class="bubble-line2">FUNCTION</span>
    `;
    
    // Position the bubble
    var bubbleSize = 80;
    bubble.style.left = Math.max(10, Math.min(window.innerWidth - bubbleSize - 10, x - bubbleSize / 2)) + 'px';
    bubble.style.top = Math.max(10, Math.min(window.innerHeight - bubbleSize - 10, y - bubbleSize / 2)) + 'px';
    
    bubble.addEventListener('click', function(e) {
        e.stopPropagation();
        hideAdminBubble();
        showPreGameAdminModal();
    });
    
    document.body.appendChild(bubble);
    adminBubbleElement = bubble;
    isAdminBubbleActive = true;
    
    // Auto-hide after 4 seconds if not clicked
    setTimeout(function() {
        if (isAdminBubbleActive) {
            hideAdminBubble();
        }
    }, 4000);
}

function hideAdminBubble() {
    if (adminBubbleElement && adminBubbleElement.parentNode) {
        adminBubbleElement.remove();
    }
    adminBubbleElement = null;
    isAdminBubbleActive = false;
}

function setupLongClickAdmin(element) {
    if (!element) return;
    
    var holdTimer = null;
    var isHolding = false;
    
    element.addEventListener('pointerdown', function(e) {
        if (isAdminBubbleActive) {
            hideAdminBubble();
            return;
        }
        if (e.metaKey || e.ctrlKey) return;
        
        isHolding = false;
        holdTimer = setTimeout(function() {
            isHolding = true;
            showAdminBubble(e.clientX || e.pageX || window.innerWidth / 2, e.clientY || e.pageY || window.innerHeight / 2);
        }, 800);
    });
    
    element.addEventListener('pointerup', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('pointerleave', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('click', function(e) {
        if (e.metaKey || e.ctrlKey) {
            e.preventDefault();
            e.stopPropagation();
            hideAdminBubble();
            showPreGameAdminModal();
        }
    });
}

function formatDisplayDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split('-');
    if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    return dateStr;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function generateDefaultDataNatural(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function rotateDataString(naturalData, startingHoleVal) {
    if (startingHoleVal === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHoleVal - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHoleVal - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

function resetLocksOnly(callback) {

        "locks.f2": null,

    };
    
    FirebaseRetry.execute(function() {
        return db.collection("scheduledGames").doc(gameId).update(resetData);
    }).then(function() {
        console.log("Locks reset only - scores preserved");
        locks.f1 = null;
        locks.f2 = null;

        if (callback) callback(true);
    }).catch(function(e) {

function startGameListener() {
    if (!firestoreReady || !gameId) return;
    if (unsubcribeGame) unsubcribeGame();
    
    var collection = "scheduledGames";
    
    unsubcribeGame = db.collection(collection).doc(gameId)
        .onSnapshot(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                if (data.locks) {
                    locks.f1 = data.locks.f1 || null;
                    locks.f2 = data.locks.f2 || null;
                    console.log("Listener updated locks:", locks);
                }
                if (gameData) {
                    // Update only locks, preserve other data
                    gameData.locks = data.locks;
                }
                render();
            }
        }, function(error) {
            console.warn("Game listener error:", error);
        });
}

        if (otherLockIsMe) {

            return false;
        }
    } else if (role === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;

        if (otherLockIsMe2) {
            Modal.alert("You already have Flight 1. Only one role per device.");
            return false;
        }
    }
    
    return true;
}

    };

function startGame() {
    // v3.28: Preview mode - prevent TEE OFF
    if (isPreviewMode) {
        return;
    }
    
    // v3.26: Safety check for gameId before navigation
    if (!gameId) {
        console.error("[PRE-GAME] Cannot navigate - no gameId");
        if (typeof Modal !== 'undefined' && Modal.alert) {
            Modal.alert("Error: No game ID found. Please return to the main menu.");
        }
        return;
    }
    
    if (!tempSelectedRole) {
        Modal.alert("Please select a role first");
        return;
    }
    
    if (tempSelectedRole === "view") {
        if (isGameCompleted(gameData)) {
            console.log("Game is completed - redirecting to view-history.html");
            window.location.href = "view-history.html?gameId=" + gameId;
            return;
        }
        
        localStorage.setItem("userRole", "view");
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {

                }
            });

        }
        window.location.href = "view-game.html?gameId=" + gameId;
        return;
    }
    
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var collection = "scheduledGames";
    var updatePayload = {};
    
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    if (tempSelectedRole === "update1" && isF1Locked && !isF1LockedByMe) {
        Modal.alert("Flight 1 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    if (tempSelectedRole === "update2" && isF2Locked && !isF2LockedByMe) {
        Modal.alert("Flight 2 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    
    if (tempSelectedRole === "update1") {
        var otherLockValid = locks.f2 && locks.f2.ex && locks.f2.ex > now;
        var otherLockIsMe = otherLockValid && locks.f2.did === myDeviceIdFull;
        if (otherLockIsMe) {
            Modal.alert("You already have Flight 2. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    } else if (tempSelectedRole === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;
        var otherLockIsMe2 = otherLockValid2 && locks.f1.did === myDeviceIdFull;
        if (otherLockIsMe2) {
            Modal.alert("You already have Flight 1. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    }
    
    var deviceId = SessionManager.getDeviceIdDisplay();
    var sessionId = deviceSession?.sessionId || SessionManager.getSession()?.sessionId || "unknown";
    
    if (tempSelectedRole === "update1") {
        updatePayload["locks.f1"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    } else if (tempSelectedRole === "update2") {
        updatePayload["locks.f2"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    }
    
    updatePayload["gameStarted"] = true;
    updatePayload["lastActive"] = firebase.firestore.FieldValue.serverTimestamp();
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    console.log("Writing lock with sessionId:", sessionId);
    
    FirebaseRetry.execute(function() {
        return db.collection(collection).doc(gameId).update(updatePayload);
    }).then(function() {
        localStorage.setItem("userRole", tempSelectedRole);
        
        var targetPage = "real-game.html";
        
        console.log("Redirecting to:", targetPage, "gameMode:", gameMode);
        
        if (deviceSession) {

        console.error("Error locking role:", e);
        Modal.alert("Error locking role: " + e.message);

        var isAnchor = (anchorName === p.name);
        var nameColor = isAnchor ? '#ffaa44' : '#ffffff';
        var hcpColor = isAnchor ? '#ffaa44' : '#4caf50';
        var label = p.label || '';
        
        html += '<div class="player-row">' +
            '<span class="player-name" style="color: ' + nameColor + ';">' + escapeHtml(p.name) + '</span>' +
            '<span class="player-label">' + escapeHtml(label) + '</span>' +
            '<span class="player-handicap" style="color: ' + hcpColor + ';">' + p.handicap + '</span>' +
            '</div>';
    }
    return html;
}

function render() {
    if (!gameData) return;
    
    var courseName = gameData.course ? gameData.course.name : "Unknown Course";
    var players = gameData.players || [];
    var startingHole = gameData.startingHole || 1;
    var teamGameFormat = gameData.teamGameFormat || "tournament";
    var formatDisplayName = getFormatDisplayName(teamGameFormat);
    var anchorName = gameData.anchor || null;
    
    var dateDisplay = '';
    if (gameData.date) {
        dateDisplay = '<div class="course-date">' + formatDisplayDate(gameData.date) + '</div>';
    }
    
    var startingHoleText = "";
    if (startingHole === 1) {
        startingHoleText = "Hole 1";
    } else if (startingHole === 10) {
        startingHoleText = "Hole 10";
    } else {
        startingHoleText = "Shotgun " + startingHole;
    }
    
    var flight1Players = players.filter(function(p) { return p.flight === 1; });
    var flight1A = flight1Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight1B = flight1Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var flight2Players = players.filter(function(p) { return p.flight === 2; });
    var flight2A = flight2Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight2B = flight2Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    var f1ButtonClass = getButtonClass(1);
    var f2ButtonClass = getButtonClass(2);
    var viewButtonClass = getViewButtonClass();
    
    var f1ButtonText = "SCORE F1";
    var f2ButtonText = "SCORE F2";
    var viewButtonText = "VIEW ONLY";
    
    var isTeeOffDisabled = !tempSelectedRole && !isF1LockedByMe && !isF2LockedByMe;
    
    // v3.28: Preview mode - disable TEE OFF and hide certain elements
    if (isPreviewMode) {
        isTeeOffDisabled = true;
    }
    
    var roleStatusText = "";
    var roleStatusClass = "";
    
    // v3.28: Preview mode status
    if (isPreviewMode) {
        roleStatusText = "👁️ Preview Only - This game is scheduled for " + formatDisplayDate(gameData.date);
        roleStatusClass = "role-status-preview";
        isTeeOffDisabled = true;
    } else if (tempSelectedRole === "update1") {
        roleStatusText = "✓ Score F1 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (tempSelectedRole === "update2") {
        roleStatusText = "✓ Score F2 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (tempSelectedRole === "view") {
        if (isGameCompleted(gameData)) {
            roleStatusText = "⚠️ This game is already completed. Click TEE OFF to see final results.";
        } else {
            roleStatusText = "✓ View Only selected. Click TEE OFF to continue.";
        }
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (isF1LockedByMe) {
        roleStatusText = "✓ You already have Flight 1. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (isF2LockedByMe) {
        roleStatusText = "✓ You already have Flight 2. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else {
        roleStatusText = "⚠️ Select a role above, then click TEE OFF";
        roleStatusClass = "role-status-warning";
    }
    
    var flight1LockInfo = '';
    var flight2LockInfo = '';
    
    if (isF1Locked) {
        var lockHolder = locks.f1.did || 'Unknown';
        flight1LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder}</span></div>`;
    } else {
        flight1LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    if (isF2Locked) {
        var lockHolder2 = locks.f2.did || 'Unknown';
        flight2LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder2}</span></div>`;
    } else {
        flight2LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    // v3.28: Preview mode - different title and bubble
    var titleText = isPreviewMode ? "📋 NEXT GAME" : "🏌️ READY TO PLAY";
    var subtitleText = isPreviewMode ? "View game setup (read-only)" : "Verify teams and handicaps before teeing off";
    var bubbleText = isPreviewMode ? "VIEW" : "LIVE";
    var bubbleColor = isPreviewMode ? '#ffaa44' : '#4caf50';
    var bubbleBg = isPreviewMode ? 'rgba(255,170,68,0.2)' : 'rgba(76,175,80,0.3)';
    var bubbleBorder = isPreviewMode ? '#ffaa44' : '#4caf50';
    
    // v3.28: Preview mode - no hint for admin (disabled)
    var titleHint = isPreviewMode ? '' : '<span class="title-hint">⌘+click or long press for admin</span>';
    
    // v3.28: Preview mode - hide TEE OFF button and role section
    var roleSectionHtml = '';
    var actionButtonsHtml = '';
    
    if (!isPreviewMode) {
        // Normal mode - show role section and TEE OFF button
        roleSectionHtml = `
            <div class="role-section">
                <div class="role-title">🎮 SELECT YOUR ROLE</div>
                <div class="role-buttons">
                    <button class="role-btn ${f1ButtonClass}" onclick="toggleRole('update1')">${f1ButtonText}</button>
                    <button class="role-btn ${f2ButtonClass}" onclick="toggleRole('update2')">${f2ButtonText}</button>
                    <button class="role-btn ${viewButtonClass}" onclick="toggleRole('view')">${viewButtonText}</button>
                </div>
                <div class="role-status ${roleStatusClass}">${roleStatusText}</div>
            </div>
        `;
        
        actionButtonsHtml = `
            <div class="action-buttons">
                <button class="btn btn-back" onclick="goBack()">← BACK</button>
                <button class="btn btn-teeoff ${isTeeOffDisabled ? 'btn-teeoff-disabled' : ''}" onclick="startGame()" ${isTeeOffDisabled ? 'disabled' : ''}>⛳ TEE OFF →</button>
            </div>
        `;
    } else {
        // Preview mode - show status only, no role buttons, no TEE OFF
        roleSectionHtml = `
            <div class="role-section" style="opacity:0.7; border-color:#333;">
                <div class="role-title" style="color:#888;">👁️ PREVIEW MODE</div>
                <div class="role-buttons">
                    <button class="role-btn role-btn-disabled">SCORE F1</button>
                    <button class="role-btn role-btn-disabled">SCORE F2</button>
                    <button class="role-btn role-btn-disabled">VIEW ONLY</button>
                </div>
                <div class="role-status ${roleStatusClass}">${roleStatusText}</div>
            </div>
        `;
        
        actionButtonsHtml = '';
    }
    
    // v3.28: Preview mode - subtle back link instead of button
    var backHtml = '';
    if (isPreviewMode) {
        backHtml = `
            <div class="preview-back-link" onclick="goBack()">← Back to Main Menu</div>
        `;
    } else {
        backHtml = '';
    }
    
    var html = `
        <div class="status-bubble" id="statusBubble" style="background:${bubbleBg}; border-color:${bubbleBorder}; color:${bubbleColor};">${bubbleText}</div>
        
        <div class="header">
            <div class="title" id="preGameTitle">
                ${titleText}
                ${titleHint}
            </div>
            <div class="subtitle">${subtitleText}</div>
        </div>
        
        <div class="course-card">
            <div class="course-name">⛳ ${escapeHtml(courseName)}</div>
            ${dateDisplay}
            <div class="course-info-row">
                <span class="course-info-item">
                    <span class="course-info-label">Starting Hole:</span>
                    <span class="course-info-value">${startingHoleText}</span>
                </span>
                <span class="course-info-item">
                    <span class="course-info-label">Team Game Format:</span>
                    <span class="course-info-value">${formatDisplayName}</span>
                </span>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3>FLIGHT 1</h3>
                ${flight1LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight1A, anchorName)}</div>
                <div class="team"><div class="team-title">TEAM ONE</div>${renderTeam(flight1B, anchorName)}</div>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3>FLIGHT 2</h3>
                ${flight2LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight2A, anchorName)}</div>
                <div class="team"><div class="team-title">TEAM ONE</div>${renderTeam(flight2B, anchorName)}</div>
            </div>
        </div>
        
        ${roleSectionHtml}
        
        ${actionButtonsHtml}
        
        ${backHtml}
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
    
    // ============================================================
    // v3.24: Setup long-click + Cmd+Click on title (disabled in preview mode)
    // ============================================================
    var titleEl = document.getElementById('preGameTitle');
    if (titleEl && !isPreviewMode) {
        setupLongClickAdmin(titleEl);
    }
    
    var statusBubble = document.getElementById("statusBubble");
    if (statusBubble) {
        statusBubble.onclick = function() {
            location.reload();
        };
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

// v3.24: Expose functions globally
window.showPreGameAdminModal = showPreGameAdminModal;
window.toggleRole = toggleRole;
window.startGame = startGame;
window.goBack = goBack;
window.showTakeoverModal = showTakeoverModal;

SessionManager.initSession("pre-game.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    currentDeviceId = session.deviceId;
    displayDeviceId();
    loadGame();
});
</script>
</body>
</html>
