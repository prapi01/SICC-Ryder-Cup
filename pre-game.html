<script>
// FILE: pre-game.html - VERSION 3.01
// FIXED: gameMode assignment from gameData.gameType or gameData.gameMode

var VERSION = "3.01";
var CACHE_KEY = "pre_game_version";
var LOCK_DURATION_MS = 6 * 60 * 60 * 1000;
var STALE_THRESHOLD_MS = 60 * 60 * 1000; // 60 minutes

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== VERSION) {
    localStorage.setItem(CACHE_KEY, VERSION);
    window.location.href = window.location.pathname + "?v=" + VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var unsubcribeGame = null;

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + VERSION);
} catch(e) { 
    console.warn(e);
}

var gameData = null;
var gameId = null;
var gameMode = null;
var tempSelectedRole = null;
var currentDeviceId = null;
var currentSessionId = null;
var deviceSession = null;
var isPreviewSandbox = false;

var locks = { f1: null, f2: null };
var currentShortName = "DEV-??";

function displayDeviceId() {
    var shortName = SessionManager.getShortNameOnly();
    currentShortName = shortName;
    document.getElementById("deviceTag").innerHTML = "🖥️ " + shortName;
}

function formatDisplayDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split('-');
    if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    return dateStr;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function generateDefaultDataNatural(parArray) {
    if (!parArray || parArray.length !== 18) {
        var defaultPar = "04";
        var result = "";
        for (var i = 0; i < 18; i++) {
            result += "F" + defaultPar + defaultPar + defaultPar + defaultPar;
        }
        return result;
    }
    
    var result = "";
    for (var h = 0; h < 18; h++) {
        var par = parArray[h];
        var parStr = par.toString().padStart(2, '0');
        result += "F" + parStr + parStr + parStr + parStr;
    }
    return result;
}

function rotateDataString(naturalData, startingHole) {
    if (startingHole === 1) return naturalData;
    
    var blocks = [];
    for (var i = 0; i < 18; i++) {
        blocks.push(naturalData.substr(i * 9, 9));
    }
    
    var rotated = [];
    for (var i = startingHole - 1; i < 18; i++) rotated.push(blocks[i]);
    for (var i = 0; i < startingHole - 1; i++) rotated.push(blocks[i]);
    
    return rotated.join('');
}

// Reset ONLY locks, preserve scores and gameStarted
function resetLocksOnly(callback) {
    if (!db || !gameId) {
        if (callback) callback(false);
        return;
    }
    
    var resetData = {
        "locks.f1": null,
        "locks.f2": null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection(isPreviewSandbox ? "previewSandboxes" : "scheduledGames").doc(gameId).update(resetData).then(function() {
        console.log("Locks reset only - scores preserved");
        locks.f1 = null;
        locks.f2 = null;
        tempSelectedRole = null;
        if (callback) callback(true);
    }).catch(function(e) {
        console.error("Reset locks error:", e);
        if (callback) callback(false);
    });
}

// Full reset (scores + locks) for NEW PREVIEW session or REAL first touch
function resetFullGame(callback) {
    if (!db || !gameId) {
        if (callback) callback(false);
        return;
    }
    
    var startingHole = gameData.startingHole || 1;
    var naturalData = generateDefaultDataNatural(gameData.course.par);
    var rotatedData = rotateDataString(naturalData, startingHole);
    
    var resetData = {
        "f1.d": rotatedData,
        "f1.se": false,
        "f1.x": false,
        "f2.d": rotatedData,
        "f2.se": false,
        "f2.x": false,
        "locks.f1": null,
        "locks.f2": null,
        "currentHoleF1": 1,
        "currentHoleF2": 1,
        "gameStarted": false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection(isPreviewSandbox ? "previewSandboxes" : "scheduledGames").doc(gameId).update(resetData).then(function() {
        console.log("Full game reset - scores and locks cleared");
        locks.f1 = null;
        locks.f2 = null;
        tempSelectedRole = null;
        if (callback) callback(true);
    }).catch(function(e) {
        console.error("Full reset error:", e);
        if (callback) callback(false);
    });
}

function hasAnyScores() {
    if (!gameData) return false;
    var f1HasT = gameData.f1?.d?.indexOf('T') !== -1;
    var f2HasT = gameData.f2?.d?.indexOf('T') !== -1;
    return f1HasT || f2HasT;
}

function startGameListener() {
    if (!firestoreReady || !gameId) return;
    if (unsubcribeGame) unsubcribeGame();
    
    var collection = isPreviewSandbox ? "previewSandboxes" : "scheduledGames";
    
    unsubcribeGame = db.collection(collection).doc(gameId)
        .onSnapshot(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                if (data.locks) {
                    locks.f1 = data.locks.f1 || null;
                    locks.f2 = data.locks.f2 || null;
                }
                render();
            }
        }, function(error) {
            console.warn("Game listener error:", error);
        });
}

function canTakeRole(role) {
    var now = Date.now();
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    
    // Check if this device already has a valid lock on the OTHER flight
    if (role === "update1") {
        var otherLockValid = locks.f2 && locks.f2.ex && locks.f2.ex > now;
        var otherLockIsMe = otherLockValid && locks.f2.did === myDeviceIdFull;
        if (otherLockIsMe) {
            alert("You already have Flight 2. Only one role per device.");
            return false;
        }
    } else if (role === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;
        var otherLockIsMe2 = otherLockValid2 && locks.f1.did === myDeviceIdFull;
        if (otherLockIsMe2) {
            alert("You already have Flight 1. Only one role per device.");
            return false;
        }
    }
    
    return true;
}

function toggleRole(role) {
    if (tempSelectedRole === role) {
        tempSelectedRole = null;
        render();
        return;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    // Check if trying to take a role that is locked by another device
    if (role === "update1" && isF1Locked && !isF1LockedByMe) {
        showTakeoverModal(1);
        return;
    }
    if (role === "update2" && isF2Locked && !isF2LockedByMe) {
        showTakeoverModal(2);
        return;
    }
    
    // Check one-device-one-role rule
    if (!canTakeRole(role)) return;
    
    tempSelectedRole = role;
    
    if (deviceSession) {
        SessionManager.updateSession({
            activeGame: {
                gameId: gameId,
                gameType: gameMode,
                gameMode: gameMode,
                role: role,
                collection: isPreviewSandbox ? "previewSandboxes" : "scheduledGames"
            }
        });
    }
    
    render();
}

function showTakeoverModal(flight) {
    var lock = flight === 1 ? locks.f1 : locks.f2;
    if (!lock) return;
    
    var deviceId = lock.did || "Unknown device";
    
    var modalHtml = `
        <div class="modal-overlay" id="takeoverModal">
            <div class="modal">
                <div class="modal-title">⚠️ ROLE TAKEOVER</div>
                <div class="modal-message">Flight ${flight} is currently locked by:</div>
                <div class="modal-device" style="font-family:monospace; font-size:0.8rem; color:#4caf50; margin:8px 0;">${deviceId}</div>
                <div class="modal-message">Take over this role? The current device will be notified.</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-cancel" id="takeoverCancelBtn">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" id="takeoverConfirmBtn">✓ Take Over</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("takeoverCancelBtn").addEventListener("click", function() {
        document.getElementById("takeoverModal").remove();
    });
    
    document.getElementById("takeoverConfirmBtn").addEventListener("click", function() {
        document.getElementById("takeoverModal").remove();
        takeoverRole(flight);
    });
}

function takeoverRole(flight) {
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var collection = isPreviewSandbox ? "previewSandboxes" : "scheduledGames";
    var deviceId = SessionManager.getDeviceIdDisplay();
    var sessionId = deviceSession ? deviceSession.sessionId : "unknown";
    
    var updatePayload = {};
    var lockField = flight === 1 ? "locks.f1" : "locks.f2";
    
    updatePayload[lockField] = {
        did: deviceId,
        sid: sessionId,
        at: now,
        ex: expiryTime,
        takeoverAt: now
    };
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    db.collection(collection).doc(gameId).update(updatePayload).then(function() {
        console.log("Role takeover successful for Flight", flight);
        if (flight === 1) {
            locks.f1 = updatePayload["locks.f1"];
        } else {
            locks.f2 = updatePayload["locks.f2"];
        }
        tempSelectedRole = flight === 1 ? "update1" : "update2";
        render();
        alert(`You have taken over Flight ${flight}. Click TEE OFF to enter the game.`);
    }).catch(function(e) {
        alert("Error taking over role: " + e.message);
    });
}

function showStaleSessionModal(callback) {
    var modalHtml = `
        <div class="modal-overlay" id="staleModal">
            <div class="modal">
                <div class="modal-title">⚠️ INACTIVE SESSION</div>
                <div class="modal-message">This preview session hasn't been active for over 60 minutes.</div>
                <div class="modal-message" style="margin-top:8px;">Locks will be reset. Scores will be preserved.</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-cancel" id="staleCancelBtn">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" id="staleConfirmBtn">✓ Continue & Reset Locks</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("staleCancelBtn").addEventListener("click", function() {
        document.getElementById("staleModal").remove();
        callback(false);
    });
    
    document.getElementById("staleConfirmBtn").addEventListener("click", function() {
        document.getElementById("staleModal").remove();
        callback(true);
    });
}

function loadGame() {
    var realGameId = sessionStorage.getItem("currentGameId");
    var activeGame = deviceSession ? deviceSession.activeGame : null;
    
    if (!realGameId) {
        alert("No game selected. Please return to main menu.");
        window.location.href = "index.html";
        return;
    }
    
    gameId = realGameId;
    
    if (activeGame && activeGame.collection === "previewSandboxes") {
        isPreviewSandbox = true;
        gameMode = "preview";
        console.log("Loading preview sandbox:", gameId);
        
        db.collection("previewSandboxes").doc(gameId).get().then(function(doc) {
            if (doc.exists) {
                gameData = doc.data();
                gameData.id = doc.id;
                
                if (gameData.locks) {
                    locks.f1 = gameData.locks.f1 || null;
                    locks.f2 = gameData.locks.f2 || null;
                }
                
                // Check for stale session (lastActive > 60 min)
                var lastActive = gameData.lastActive;
                var now = Date.now();
                var isStale = false;
                
                if (lastActive) {
                    var lastActiveTime = typeof lastActive === 'number' ? lastActive : lastActive.toMillis ? lastActive.toMillis() : Date.parse(lastActive);
                    var minutesSinceLastActive = (now - lastActiveTime) / 1000 / 60;
                    isStale = minutesSinceLastActive > 60;
                    console.log("PREVIEW: lastActive minutes ago:", minutesSinceLastActive, "isStale:", isStale);
                }
                
                if (isStale && hasAnyScores()) {
                    // Show modal to reset locks (keep scores)
                    showStaleSessionModal(function(confirmed) {
                        if (confirmed) {
                            resetLocksOnly(function() {
                                startGameListener();
                                render();
                            });
                        } else {
                            startGameListener();
                            render();
                        }
                    });
                } else {
                    startGameListener();
                    render();
                }
            } else {
                alert("Preview session not found");
                window.location.href = "index.html";
            }
        }).catch(function(e) {
            alert("Error loading preview session: " + e.message);
            window.location.href = "index.html";
        });
        return;
    }
    
    // REAL mode
    isPreviewSandbox = false;
    db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            gameData = doc.data();
            gameData.id = doc.id;
            
            // *** FIX: Set gameMode from gameType or gameMode field ***
            gameMode = gameData.gameType || gameData.gameMode || "real";
            console.log("REAL mode - gameMode set to:", gameMode);
            
            if (gameData.locks) {
                locks.f1 = gameData.locks.f1 || null;
                locks.f2 = gameData.locks.f2 || null;
            }
            
            var today = getTodayString();
            var isToday = (gameData.date === today);
            var gameStartedFlag = gameData.gameStarted === true;
            
            console.log("REAL mode - isToday:", isToday, "gameStarted:", gameStartedFlag);
            
            if (isToday && !gameStartedFlag) {
                console.log("REAL mode - First access on game day, resetting...");
                resetFullGame(function(success) {
                    db.collection("scheduledGames").doc(gameId).get().then(function(updatedDoc) {
                        if (updatedDoc.exists) {
                            gameData = updatedDoc.data();
                            gameData.id = updatedDoc.id;
                            if (gameData.locks) {
                                locks.f1 = gameData.locks.f1 || null;
                                locks.f2 = gameData.locks.f2 || null;
                            }
                        }
                        startGameListener();
                        render();
                    }).catch(function() {
                        startGameListener();
                        render();
                    });
                });
            } else {
                console.log("REAL mode - Game already started or not today, loading existing data");
                startGameListener();
                render();
            }
        } else {
            alert("Game not found");
            window.location.href = "index.html";
        }
    }).catch(function(e) {
        alert("Error loading game: " + e.message);
        window.location.href = "index.html";
    });
}

function startGame() {
    if (!tempSelectedRole) {
        alert("Please select a role first");
        return;
    }
    
    // VIEW ONLY
    if (tempSelectedRole === "view") {
        localStorage.setItem("userRole", "view");
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: "view",
                    collection: isPreviewSandbox ? "previewSandboxes" : "scheduledGames"
                }
            });
            SessionManager.addNavigationHistory("view-game.html", "tee_off_view", { gameId: gameId });
        }
        window.location.href = "view-game.html";
        return;
    }
    
    var now = Date.now();
    var expiryTime = now + LOCK_DURATION_MS;
    var collection = isPreviewSandbox ? "previewSandboxes" : "scheduledGames";
    var updatePayload = {};
    
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    // Check if trying to take a role already locked by another device
    if (tempSelectedRole === "update1" && isF1Locked && !isF1LockedByMe) {
        alert("Flight 1 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    if (tempSelectedRole === "update2" && isF2Locked && !isF2LockedByMe) {
        alert("Flight 2 was locked by another device. Please take over the role.");
        tempSelectedRole = null;
        render();
        return;
    }
    
    // One device one role check
    if (tempSelectedRole === "update1") {
        var otherLockValid = locks.f2 && locks.f2.ex && locks.f2.ex > now;
        var otherLockIsMe = otherLockValid && locks.f2.did === myDeviceIdFull;
        if (otherLockIsMe) {
            alert("You already have Flight 2. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    } else if (tempSelectedRole === "update2") {
        var otherLockValid2 = locks.f1 && locks.f1.ex && locks.f1.ex > now;
        var otherLockIsMe2 = otherLockValid2 && locks.f1.did === myDeviceIdFull;
        if (otherLockIsMe2) {
            alert("You already have Flight 1. Only one role per device.");
            tempSelectedRole = null;
            render();
            return;
        }
    }
    
    var deviceId = SessionManager.getDeviceIdDisplay();
    var sessionId = deviceSession ? deviceSession.sessionId : "unknown";
    
    if (tempSelectedRole === "update1") {
        updatePayload["locks.f1"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    } else if (tempSelectedRole === "update2") {
        updatePayload["locks.f2"] = {
            did: deviceId,
            sid: sessionId,
            at: now,
            ex: expiryTime
        };
    }
    
    updatePayload["gameStarted"] = true;
    updatePayload["lastActive"] = firebase.firestore.FieldValue.serverTimestamp();
    updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    
    db.collection(collection).doc(gameId).update(updatePayload).then(function() {
        localStorage.setItem("userRole", tempSelectedRole);
        
        var targetPage = "";
        if (gameMode === "real") {
            targetPage = "real-game.html";
        } else {
            targetPage = "preview-game.html";
        }
        
        console.log("Redirecting to:", targetPage, "gameMode:", gameMode);
        
        if (deviceSession) {
            SessionManager.updateSession({
                activeGame: {
                    gameId: gameId,
                    gameType: gameMode,
                    gameMode: gameMode,
                    role: tempSelectedRole,
                    collection: collection
                }
            });
            
            SessionManager.addNavigationHistory(targetPage, "tee_off_" + tempSelectedRole, { gameId: gameId });
            window.location.href = targetPage;
        } else {
            window.location.href = targetPage;
        }
    }).catch(function(e) {
        alert("Error locking role: " + e.message);
    });
}

function goBack() {
    var returnDest = SessionManager.getReturnDestination();
    window.location.href = returnDest;
}

function getFormatDisplayName(format) {
    if (format === "relative") return "Relative";
    return "Tournament";
}

function render() {
    if (!gameData) return;
    
    var courseName = gameData.course ? gameData.course.name : "Unknown Course";
    var players = gameData.players || [];
    var startingHole = gameData.startingHole || 1;
    var teamGameFormat = gameData.teamGameFormat || "tournament";
    var formatDisplayName = getFormatDisplayName(teamGameFormat);
    
    var modeBanner = '';
    if (gameMode === "real") {
        modeBanner = '<div class="mode-banner mode-real">🏆 REAL GAME - Scores are LIVE and synced to all devices</div>';
    } else if (gameMode === "preview") {
        modeBanner = '<div class="mode-banner mode-preview">🔍 PREVIEW MODE - Future game</div>';
    } else if (gameMode === "history") {
        modeBanner = '<div class="mode-banner mode-history">📜 HISTORY MODE - Read only. Past game results.</div>';
    }
    
    var dateDisplay = '';
    if (gameData.date && gameMode !== "preview") {
        dateDisplay = '<div class="course-date">📅 ' + formatDisplayDate(gameData.date) + '</div>';
    } else if (isPreviewSandbox && gameData.originalGameId) {
        dateDisplay = '<div class="course-date">📅 Preview Session</div>';
    }
    
    var startingHoleText = "";
    if (startingHole === 1) {
        startingHoleText = "Hole 1";
    } else if (startingHole === 10) {
        startingHoleText = "Hole 10";
    } else {
        startingHoleText = "Shotgun " + startingHole;
    }
    
    var flight1Players = players.filter(function(p) { return p.flight === 1; });
    var flight1A = flight1Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight1B = flight1Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var flight2Players = players.filter(function(p) { return p.flight === 2; });
    var flight2A = flight2Players.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var flight2B = flight2Players.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    function renderTeam(teamPlayers) {
        var html = '';
        for (var i = 0; i < teamPlayers.length; i++) {
            var p = teamPlayers[i];
            html += '<div class="player-row"><span class="player-name">' + escapeHtml(p.name) + '</span><span class="player-handicap">' + p.handicap + '</span></div>';
        }
        return html;
    }
    
    var now = Date.now();
    var isF1Locked = locks.f1 && locks.f1.ex && locks.f1.ex > now;
    var isF2Locked = locks.f2 && locks.f2.ex && locks.f2.ex > now;
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var isF1LockedByMe = isF1Locked && locks.f1.did === myDeviceIdFull;
    var isF2LockedByMe = isF2Locked && locks.f2.did === myDeviceIdFull;
    
    // Determine button states
    var update1Selected = (tempSelectedRole === "update1");
    var update2Selected = (tempSelectedRole === "update2");
    var viewSelected = (tempSelectedRole === "view");
    
    // Flight 1 button
    var update1Class = "role-btn";
    var update1Text = "✏️ UPDATE FLIGHT 1";
    if (update1Selected) {
        update1Class = "role-btn role-btn-selected";
        update1Text = "✓ UPDATE FLIGHT 1";
    } else if (isF1Locked && !isF1LockedByMe) {
        update1Class = "role-btn role-btn-locked";
        update1Text = "🔒 UPDATE FLIGHT 1";
    } else if (isF1Locked && isF1LockedByMe) {
        update1Class = "role-btn role-btn-selected";
        update1Text = "✓ UPDATE FLIGHT 1 (You)";
    } else {
        update1Class = "role-btn role-btn-available";
        update1Text = "🔓 UPDATE FLIGHT 1";
    }
    
    // Flight 2 button
    var update2Class = "role-btn";
    var update2Text = "✏️ UPDATE FLIGHT 2";
    if (update2Selected) {
        update2Class = "role-btn role-btn-selected";
        update2Text = "✓ UPDATE FLIGHT 2";
    } else if (isF2Locked && !isF2LockedByMe) {
        update2Class = "role-btn role-btn-locked";
        update2Text = "🔒 UPDATE FLIGHT 2";
    } else if (isF2Locked && isF2LockedByMe) {
        update2Class = "role-btn role-btn-selected";
        update2Text = "✓ UPDATE FLIGHT 2 (You)";
    } else {
        update2Class = "role-btn role-btn-available";
        update2Text = "🔓 UPDATE FLIGHT 2";
    }
    
    // View button
    var viewClass = "role-btn role-btn-view";
    var viewText = "👁️ VIEW ONLY";
    if (viewSelected) {
        viewClass = "role-btn role-btn-view role-btn-selected";
        viewText = "✓ VIEW ONLY";
    }
    
    // Also check if device already has a role (disables the other update button)
    var deviceHasFlight1 = isF1Locked && isF1LockedByMe;
    var deviceHasFlight2 = isF2Locked && isF2LockedByMe;
    
    if (deviceHasFlight1 && tempSelectedRole !== "update1") {
        update1Class = "role-btn role-btn-selected";
        update1Text = "✓ UPDATE FLIGHT 1 (You)";
    }
    if (deviceHasFlight2 && tempSelectedRole !== "update2") {
        update2Class = "role-btn role-btn-selected";
        update2Text = "✓ UPDATE FLIGHT 2 (You)";
    }
    
    var isTeeOffDisabled = !tempSelectedRole && !deviceHasFlight1 && !deviceHasFlight2;
    
    var roleStatusText = "";
    var roleStatusClass = "";
    if (tempSelectedRole === "update1") {
        roleStatusText = "✓ Flight 1 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
    } else if (tempSelectedRole === "update2") {
        roleStatusText = "✓ Flight 2 selected. Click TEE OFF to lock this role.";
        roleStatusClass = "role-status-selected";
    } else if (tempSelectedRole === "view") {
        roleStatusText = "✓ View Only selected. Click TEE OFF to continue.";
        roleStatusClass = "role-status-selected";
    } else if (deviceHasFlight1) {
        roleStatusText = "✓ You already have Flight 1. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else if (deviceHasFlight2) {
        roleStatusText = "✓ You already have Flight 2. Click TEE OFF to enter the game.";
        roleStatusClass = "role-status-selected";
        isTeeOffDisabled = false;
    } else {
        roleStatusText = "⚠️ Select a role above, then click TEE OFF";
        roleStatusClass = "role-status-warning";
    }
    
    // Flight lock info for headers
    var flight1LockInfo = '';
    var flight2LockInfo = '';
    
    if (isF1Locked) {
        var lockHolder = locks.f1.did || 'Unknown';
        flight1LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder}</span></div>`;
    } else {
        flight1LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    if (isF2Locked) {
        var lockHolder2 = locks.f2.did || 'Unknown';
        flight2LockInfo = `<div class="flight-lock-info"><span>🔒 ${lockHolder2}</span></div>`;
    } else {
        flight2LockInfo = '<div class="flight-lock-info"><span>🔓 Available</span></div>';
    }
    
    var html = `
        <div class="header">
            <div class="title">🏌️ READY TO PLAY</div>
            <div class="subtitle">Verify teams and handicaps before teeing off</div>
        </div>
        
        ${modeBanner}
        
        <div class="course-card">
            <div class="course-name">⛳ ${escapeHtml(courseName)}</div>
            ${dateDisplay}
            <div class="course-info-row">
                <span class="course-info-item">
                    <span class="course-info-label">Starting Hole:</span>
                    <span class="course-info-value">${startingHoleText}</span>
                </span>
                <span class="course-info-item">
                    <span class="course-info-label">Team Game Format:</span>
                    <span class="course-info-value">${formatDisplayName}</span>
                </span>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3><i>⛳</i> FLIGHT 1</h3>
                ${flight1LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight1A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight1B)}</div>
            </div>
        </div>
        
        <div class="flight-box">
            <div class="flight-header">
                <h3><i>⛳</i> FLIGHT 2</h3>
                ${flight2LockInfo}
            </div>
            <div class="teams-grid">
                <div class="team"><div class="team-title">TEAM A</div>${renderTeam(flight2A)}</div>
                <div class="team"><div class="team-title">TEAM B</div>${renderTeam(flight2B)}</div>
            </div>
        </div>
        
        <div class="role-section">
            <div class="role-title">🎮 SELECT YOUR ROLE</div>
            <div class="role-buttons">
                <button class="${update1Class}" onclick="toggleRole('update1')">${update1Text}</button>
                <button class="${update2Class}" onclick="toggleRole('update2')">${update2Text}</button>
                <button class="${viewClass}" onclick="toggleRole('view')">${viewText}</button>
            </div>
            <div class="role-status ${roleStatusClass}">${roleStatusText}</div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-back" onclick="goBack()">← BACK</button>
            <button class="btn btn-teeoff ${isTeeOffDisabled ? 'btn-teeoff-disabled' : ''}" onclick="startGame()" ${isTeeOffDisabled ? 'disabled' : ''}>⛳ TEE OFF →</button>
        </div>
        
        <div class="footer">SICC Ryder Cup v${VERSION}</div>
    `;
    
    document.getElementById("app").innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

// Make functions available globally
window.toggleRole = toggleRole;
window.startGame = startGame;
window.goBack = goBack;
window.showTakeoverModal = showTakeoverModal;

SessionManager.initSession("pre-game.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    deviceSession = session;
    currentDeviceId = session.deviceId;
    displayDeviceId();
    loadGame();
});
</script>
</body>
