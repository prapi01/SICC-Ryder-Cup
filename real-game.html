// ============================================================
// Preloaded Data Support
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyPreloadedData(preloadData) {
    console.log("Applying preloaded data for instant render");
    
    courseName = preloadData.course?.name || "Unknown Course";
    coursePar = preloadData.course?.par || [];
    courseSi = preloadData.course?.si || [];
    allPlayers = preloadData.players || [];
    startingHole = preloadData.startingHole || 1;
    teamGameFormat = preloadData.teamGameFormat || "tournament";
    
    var mockCache = {
        course: preloadData.course,
        players: preloadData.players,
        startingHole: preloadData.startingHole,
        teamGameFormat: preloadData.teamGameFormat,
        f1DataString: preloadData.f1DataString || "",
        f2DataString: preloadData.f2DataString || "",
        results: preloadData.results || null,
        savedHoles: preloadData.savedHoles || { 1: [], 2: [] },
        t1Row: preloadData.t1Row || new Array(18).fill('_'),
        t2Row: preloadData.t2Row || new Array(18).fill('_'),
        strkRow: preloadData.strkRow || new Array(18).fill('0'),
        lastSyncedHole: preloadData.lastSyncedHole || 0,
        clinchedAt: preloadData.clinchedAt || {},
        signatures: { f1: false, f2: false },
        submitted: { f1: false, f2: false },
        locks: { f1: null, f2: null },
        gameStarted: true
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(mockCache);
    } else {
        window._preloadedGameCache = mockCache;
    }
    
    document.getElementById("courseName").innerHTML = courseName;
    document.getElementById("mainContainer").classList.add("data-ready");
    
    usedPreloadedData = true;
    return true;
}

// ============================================================
// Ticker Functions
// ============================================================

function calculatePlayerScoreRelativeToPar(player) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var totalGross = 0;
    var totalPar = 0;
    
    for (var h = 1; h <= 18; h++) {
        var par = coursePar[h - 1];
        totalPar += par;
        
        var holeData = GameData.parseHoleData(flightDataStr, h);
        if (holeData && holeData.saved) {
            var score = 0;
            var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
            var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
            
            if (player.team === 'A') {
                if (teamA[0] && teamA[0].name === player.name) score = holeData.scores.a1;
                else if (teamA[1] && teamA[1].name === player.name) score = holeData.scores.a2;
            } else {
                if (teamB[0] && teamB[0].name === player.name) score = holeData.scores.b1;
                else if (teamB[1] && teamB[1].name === player.name) score = holeData.scores.b2;
            }
            totalGross += score;
        } else {
            totalGross += par;
        }
    }
    
    return totalGross - totalPar;
}

function getPlayerScoreForTicker(player) {
    return calculatePlayerScoreRelativeToPar(player);
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    var mode = GameUI.getDisplayMode();
    if (mode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    var key = player.flight + "_" + currentHole + "_" + player.name;
    if (localChanges[key] !== undefined) return localChanges[key];
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

function getMatchValueFromStoredResults(player, opponent, holeNumber) {
    var cache = GameLoader.getLocalCache();
    var results = cache.results;
    if (!results) return 0;
    
    return GameData.getMatchValueFromResults(results, player, opponent, holeNumber, allPlayers, getHolePosition);
}

// ============================================================
// BUBBLE FUNCTIONS
// ============================================================

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

// FIXED v5.02: Check both key orders for clinch lookup
function getBubbleClassWithClinch(player, opponent) {
    var matchValue = getMatchValueFromStoredResults(player, opponent, currentHole);
    var cache = GameLoader.getLocalCache();
    var lastSyncedHole = cache.lastSyncedHole;
    var clinchedAt = cache.clinchedAt || {};
    
    // FIXED v5.02: Check both key orders
    var matchKey1 = player.name + "_vs_" + opponent.name;
    var matchKey2 = opponent.name + "_vs_" + player.name;
    var clinchHole = clinchedAt[matchKey1] || clinchedAt[matchKey2];
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
    } else {
        var isSynced = (lastSyncedHole >= currentHole);
        if (!isSynced) return 'bubble-grey';
    }
    
    if (clinchHole && currentHole > clinchHole) return 'bubble-grey';
    if (clinchHole && currentHole === clinchHole) {
        if (matchValue > 0) return 'bubble-gold';
        if (matchValue < 0) return 'bubble-loss-clinch';
        return 'bubble-green';
    }
    
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function updateTRDisplay() {
    var tr = GameLoader.getTRForHole(currentHole);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
}

// ============================================================
// Save Functions
// ============================================================

function updateSaveButtonState() {
    var saveBtn = document.getElementById('compactSaveBtn');
    if (!saveBtn) return;
    var isCurrentSaved = isHoleSaved(editableFlight, currentHole);
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    var shouldDisable = isCurrentSaved && !hasUnsavedChanges;
    saveBtn.disabled = shouldDisable;
    saveBtn.style.opacity = shouldDisable ? '0.5' : '1';
    saveBtn.style.cursor = shouldDisable ? 'not-allowed' : 'pointer';
}

// FIXED v5.08: Restore button text and original style after save
function setSaveButtonIdle() {
    var saveBtn = document.getElementById('compactSaveBtn');
    if (saveBtn) {
        saveBtn.innerText = 'SAVE H' + currentHole;
        saveBtn.style.background = '';
        saveBtn.style.borderColor = '';
        saveBtn.style.color = '';
    }
    updateSaveButtonState();
    saveInProgress = false;
}

        setTimeout(function() {
            saveBtn.style.background = '#1a3a1a';

}

function performSave() {
    return new Promise(function(resolve, reject) {
        var flight = editableFlight;
        var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
        var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        var a1Score = getStoredScore(teamA[0], currentHole);
        var a2Score = getStoredScore(teamA[1], currentHole);
        var b1Score = getStoredScore(teamB[0], currentHole);
        var b2Score = getStoredScore(teamB[1], currentHole);
        
        for (var key in localChanges) {
            if (key.startsWith(flight + "_" + currentHole + "_")) {
                var playerName = key.split('_')[2];
                if (teamA[0] && teamA[0].name === playerName) a1Score = localChanges[key];
                if (teamA[1] && teamA[1].name === playerName) a2Score = localChanges[key];
                if (teamB[0] && teamB[0].name === playerName) b1Score = localChanges[key];
                if (teamB[1] && teamB[1].name === playerName) b2Score = localChanges[key];
            }
        }
        
        var scores = { a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score };
        
        GameData.saveCurrentHole(currentHole, scores, coursePar, async function(success) {
            if (success) {
                for (var key in localChanges) {
                    if (key.startsWith(flight + "_" + currentHole + "_")) {
                        delete localChanges[key];
                    }
                }
                
                // Refresh cache to get other flight's latest data
                await new Promise(function(resolveLoad) {
                    GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                        if (result.success) console.log("Cache refreshed after save");
                        resolveLoad();
                    });
                });
                
                // FIXED v4.68: Clear cumulative clinch data before cascade
                // Do NOT preserve old values - recalculate from scratch
                var cumulativeClinched = {};
                var cumulativeFlight1ClinchedHole = null;
                var cumulativeFlight2ClinchedHole = null;
                
                console.log("=== CASCADE START: cumulativeFlight1ClinchedHole =", cumulativeFlight1ClinchedHole);
                console.log("=== CASCADE START: cumulativeClinched cleared =", cumulativeClinched);
                
                // Process current hole
                var result = await saveResultsToFirestoreWithCumulative(currentHole, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole);
                cumulativeClinched = result.updatedClinched;
                cumulativeFlight1ClinchedHole = result.updatedFlight1ClinchedHole;
                cumulativeFlight2ClinchedHole = result.updatedFlight2ClinchedHole;
                
                console.log("=== After hole " + currentHole + ": cumulativeFlight1ClinchedHole =", cumulativeFlight1ClinchedHole);
                
                // Process subsequent holes
                var playOrder = getPlayOrder();
                var startPos = playOrder.indexOf(currentHole);
                for (var i = startPos + 1; i < 18; i++) {
                    var holeToUpdate = playOrder[i];
                    
                    console.log("--- Processing hole " + holeToUpdate + " ---");
                    console.log("  Before: cumulativeFlight1ClinchedHole =", cumulativeFlight1ClinchedHole);
                    
                    // Refresh cache before each hole to ensure latest data
                    await new Promise(function(resolveLoad) {
                        GameLoader.loadGame(gameId, "scheduledGames", function(loadResult) {
                            if (loadResult.success) console.log("  Cache refreshed before hole " + holeToUpdate);
                            resolveLoad();
                        });
                    });
                    
                    var loopResult = await saveResultsToFirestoreWithCumulative(holeToUpdate, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole);
                    cumulativeClinched = loopResult.updatedClinched;
                    cumulativeFlight1ClinchedHole = loopResult.updatedFlight1ClinchedHole;
                    cumulativeFlight2ClinchedHole = loopResult.updatedFlight2ClinchedHole;
                    
                    console.log("  After: cumulativeFlight1ClinchedHole =", cumulativeFlight1ClinchedHole);
                }
                
                if (typeof Ticker !== 'undefined') {
                    Ticker.refresh();
                }
                
                resolve(true);
            } else {
                reject(new Error("Save failed"));
            }
        });
    });
}

async function saveHole() {
    if (saveInProgress) return;
    if (!canEdit) return;
    if (isGameCompleteFlag) {
        alert("Game already complete.");
        return;
    }
    
    setSaveButtonPending();
    try {
        await performSave();
        flashSaveButtonSuccess();
        setSaveButtonIdle();
        document.getElementById("debug").innerHTML = "✓ Saved";
        setTimeout(function() {
            if (document.getElementById("debug").innerHTML === "✓ Saved") {
                document.getElementById("debug").innerHTML = "";
            }
        }, 1500);
        renderAll();
    } catch (error) {
        console.error("Save error:", error);
        setSaveButtonRetry();
        document.getElementById("debug").innerHTML = "✗ Save failed. Click RETRY.";
    }
}

function initializeEmptyResults() {
    return {
        version: 1,
        matchResults: new Array(18),
        game1: { matches: {}, pointsA: new Array(18).fill(8), pointsB: new Array(18).fill(8) },
        game2: {
            flight1: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0), clinchedHole: null },
            flight2: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0), clinchedHole: null },
            pointsA: new Array(18).fill(1),
            pointsB: new Array(18).fill(1)
        },
        game3: { leader: new Array(18).fill("AS"), nettA: new Array(18).fill(0), nettB: new Array(18).fill(0), pointsA: new Array(18).fill(0.5), pointsB: new Array(18).fill(0.5) },
        tr: { teamA: new Array(18).fill(9.5), teamB: new Array(18).fill(9.5), teamAGreen: new Array(18).fill(true), teamBGreen: new Array(18).fill(true) },
        computedUpToHole: 0,
        lastComputedAt: null,
        clinchedAt: {}
    };
}

function calculateMatchResultsArray(holeNumber) {
    var cache = GameLoader.getLocalCache();
    var matchResults = GameMatch.calculateCrossFlight(cache.f1DataString, cache.f2DataString, allPlayers, courseSi, startingHole, holeNumber, coursePar);
    var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var resultArray = [];
    for (var a = 0; a < teamAPlayers.length; a++) {
        for (var b = 0; b < teamBPlayers.length; b++) {
            var key = teamAPlayers[a].name + "_vs_" + teamBPlayers[b].name;
            var value = matchResults[key] || 0;
            if (value > 15) value = 15;
            if (value < -10) value = -10;
            resultArray.push(value);
        }
    }
    return resultArray;
}

function calculateHoleResultsWithCumulative(holeNumber, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole) {
    var cache = GameLoader.getLocalCache();
    var position = getHolePosition(holeNumber);
    var f1Hole = cache.flight1Data[holeNumber];
    var f2Hole = cache.flight2Data[holeNumber];
    
    console.log(`  calculateHoleResults(${holeNumber}) - position: ${position}`);
    console.log(`    f1Hole.saved: ${f1Hole?.saved}, f2Hole.saved: ${f2Hole?.saved}`);
    
    if (!f1Hole || !f1Hole.saved || !f2Hole || !f2Hole.saved) {
        console.log(`  calculateHoleResults(${holeNumber}) skipped - both flights not saved`);
        return null;
    }
    
    console.log(`    f1DataString (first 50 chars): ${cache.f1DataString.substring(0, 50)}...`);
    console.log(`    f2DataString (first 50 chars): ${cache.f2DataString.substring(0, 50)}...`);
    
    var teamResults = GameTeam.calculate(allPlayers, cache.f1DataString, cache.f2DataString, courseSi, startingHole, teamGameFormat);
    var flight1Total = teamResults.flight1Cumulative[position];
    var flight2Total = teamResults.flight2Cumulative[position];
    
    console.log(`    flight1Total from GameTeam: ${flight1Total}`);
    console.log(`    flight2Total from GameTeam: ${flight2Total}`);
    
    var strokeResults = GameStroke.calculate(allPlayers, cache.f1DataString, cache.f2DataString, courseSi, startingHole);
    var strokeLeader = strokeResults.leader[position];
    var matchResultsArray = calculateMatchResultsArray(holeNumber);
    
    var tempMatchResults = GameMatch.calculateCrossFlight(cache.f1DataString, cache.f2DataString, allPlayers, courseSi, startingHole, holeNumber, coursePar);
    var game1PointsA = 0, game1PointsB = 0, matchCount = 0;
    for (var key in tempMatchResults) {
        if (key.indexOf("_vs_") !== -1 && matchCount < 16) {
            var firstPlayerName = key.split("_vs_")[0];
            var firstPlayer = allPlayers.find(function(p) { return p.name === firstPlayerName; });
            if (firstPlayer && firstPlayer.team === "A") {
                var value = tempMatchResults[key];
                if (value > 0) game1PointsA += 1;
                else if (value < 0) game1PointsB += 1;
                else { game1PointsA += 0.5; game1PointsB += 0.5; }
                matchCount++;
            }
        }
    }
    
    var flight1PointsA = (flight1Total > 0) ? 1 : (flight1Total < 0) ? 0 : 0.5;
    var flight1PointsB = (flight1Total > 0) ? 0 : (flight1Total < 0) ? 1 : 0.5;
    var flight2PointsA = (flight2Total > 0) ? 1 : (flight2Total < 0) ? 0 : 0.5;
    var flight2PointsB = (flight2Total > 0) ? 0 : (flight2Total < 0) ? 1 : 0.5;
    var game2PointsA = flight1PointsA + flight2PointsA;
    var game2PointsB = flight1PointsB + flight2PointsB;
    var game3PointsA = (strokeLeader === "A") ? 1 : (strokeLeader === "B") ? 0 : 0.5;
    var game3PointsB = (strokeLeader === "A") ? 0 : (strokeLeader === "B") ? 1 : 0.5;
    var trA = game1PointsA + game2PointsA + game3PointsA;
    var trB = game1PointsB + game2PointsB + game3PointsB;
    var trAGreen = (trA > trB);
    var trBGreen = (trB > trA);
    var t1Leader = (flight1Total > 0) ? "A" : (flight1Total < 0) ? "B" : "AS";
    var t2Leader = (flight2Total > 0) ? "A" : (flight2Total < 0) ? "B" : "AS";
    var strkLeader = strokeLeader === "A" ? "A" : strokeLeader === "B" ? "B" : "AS";
    
    var remainingHoles = 18 - holeNumber;
    var maxOpponentPoints = remainingHoles * 2;
    
    var flight1ClinchedHole = cumulativeFlight1ClinchedHole;
    var flight2ClinchedHole = cumulativeFlight2ClinchedHole;
    
    console.log(`    remainingHoles: ${remainingHoles}, maxOpponentPoints: ${maxOpponentPoints}`);
    console.log(`    cumulativeFlight1ClinchedHole (input): ${cumulativeFlight1ClinchedHole}`);
    console.log(`    flight1Total: ${flight1Total}, condition: ${flight1Total} > ${maxOpponentPoints} = ${flight1Total > maxOpponentPoints}`);
    
    if (flight1ClinchedHole === null && flight1Total > maxOpponentPoints) {
        flight1ClinchedHole = holeNumber;
        console.log(`    >>> SET flight1ClinchedHole to ${holeNumber}`);
    }
    if (flight2ClinchedHole === null && flight2Total > maxOpponentPoints) {
        flight2ClinchedHole = holeNumber;
        console.log(`    >>> SET flight2ClinchedHole to ${holeNumber}`);
    }
    
    var clinchedAtUpdates = {};
    var teamAPlayers = allPlayers.filter(function(p) { return p.team === "A"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamBPlayers = allPlayers.filter(function(p) { return p.team === "B"; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    for (var a = 0; a < teamAPlayers.length; a++) {
        for (var b = 0; b < teamBPlayers.length; b++) {
            var matchKey = teamAPlayers[a].name + "_vs_" + teamBPlayers[b].name;
            var matchValue = matchResultsArray[a * teamBPlayers.length + b];
            var lead = Math.abs(matchValue);
            if (lead > remainingHoles && matchValue !== 0 && !cumulativeClinched[matchKey]) {
                clinchedAtUpdates[matchKey] = holeNumber;
                console.log(`    Clinch detected for ${matchKey} at hole ${holeNumber} (lead: ${lead}, remaining: ${remainingHoles})`);
            }
        }
    }
    
    var updatedClinched = { ...cumulativeClinched, ...clinchedAtUpdates };
    
    // NEW v5.00: Get display strings directly from modules (no computeDisplayStrings)
    var t1Display = teamResults.displayT1?.[position] || "AS";
    var t2Display = teamResults.displayT2?.[position] || "AS";
    var strkDisplay = strokeResults.displayStrk?.[position] || "AS";
    
    return {
        position: position,
        matchResults: matchResultsArray,
        t1Leader: t1Leader,
        t2Leader: t2Leader,
        strkLeader: strkLeader,
        game1PointsA: game1PointsA,
        game1PointsB: game1PointsB,
        game2PointsA: game2PointsA,
        game2PointsB: game2PointsB,
        game3PointsA: game3PointsA,
        game3PointsB: game3PointsB,
        trA: trA,
        trB: trB,
        trAGreen: trAGreen,
        trBGreen: trBGreen,
        flight1Total: flight1Total,
        flight2Total: flight2Total,
        flight1ClinchedHole: flight1ClinchedHole,
        flight2ClinchedHole: flight2ClinchedHole,
        clinchedAtUpdates: clinchedAtUpdates,
        updatedClinched: updatedClinched,
        updatedFlight1ClinchedHole: flight1ClinchedHole,
        updatedFlight2ClinchedHole: flight2ClinchedHole,
        // NEW v5.00: Display strings
        t1Display: t1Display,
        t2Display: t2Display,
        strkDisplay: strkDisplay
    };
}

async function saveResultsToFirestoreWithCumulative(holeNumber, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole) {
    console.log(`saveResultsToFirestore(${holeNumber}) called`);
    var resultsData = calculateHoleResultsWithCumulative(holeNumber, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole);
    if (!resultsData) {
        console.log(`saveResultsToFirestore(${holeNumber}) skipped - calculateHoleResults returned null`);
        return {
            updatedClinched: cumulativeClinched,
            updatedFlight1ClinchedHole: cumulativeFlight1ClinchedHole,
            updatedFlight2ClinchedHole: cumulativeFlight2ClinchedHole
        };
    }
    
    var position = resultsData.position;
    console.log(`saveResultsToFirestore(${holeNumber}) - position: ${position}`);
    
    var updatePayload = {};
    updatePayload[`results.matchResults.${position}`] = resultsData.matchResults;
    updatePayload[`results.game1.pointsA.${position}`] = resultsData.game1PointsA;
    updatePayload[`results.game1.pointsB.${position}`] = resultsData.game1PointsB;
    updatePayload[`results.game2.pointsA.${position}`] = resultsData.game2PointsA;
    updatePayload[`results.game2.pointsB.${position}`] = resultsData.game2PointsB;
    updatePayload[`results.game2.flight1.leader.${position}`] = resultsData.t1Leader;
    updatePayload[`results.game2.flight2.leader.${position}`] = resultsData.t2Leader;
    updatePayload[`results.game3.leader.${position}`] = resultsData.strkLeader;
    updatePayload[`results.game3.pointsA.${position}`] = resultsData.game3PointsA;
    updatePayload[`results.game3.pointsB.${position}`] = resultsData.game3PointsB;
    updatePayload[`results.tr.teamA.${position}`] = resultsData.trA;
    updatePayload[`results.tr.teamB.${position}`] = resultsData.trB;
    updatePayload[`results.tr.teamAGreen.${position}`] = resultsData.trAGreen;
    updatePayload[`results.tr.teamBGreen.${position}`] = resultsData.trBGreen;
    
    // NEW v5.00: Write display strings to Firestore
    updatePayload[`results.game2.displayT1.${position}`] = resultsData.t1Display;
    updatePayload[`results.game2.displayT2.${position}`] = resultsData.t2Display;
    updatePayload[`results.game3.displayStrk.${position}`] = resultsData.strkDisplay;
    
    // NEW v5.03: Write cumulative points for clinch detection
    updatePayload[`results.game2.flight1.cumulativePoints.${position}`] = resultsData.flight1Total;
    updatePayload[`results.game2.flight2.cumulativePoints.${position}`] = resultsData.flight2Total;
    
    // FIXED v5.06: Always write clinchedHole (including null) to allow clearing
    updatePayload["results.game2.flight1.clinchedHole"] = resultsData.flight1ClinchedHole;
    updatePayload["results.game2.flight2.clinchedHole"] = resultsData.flight2ClinchedHole;
    
    if (resultsData.clinchedAtUpdates && Object.keys(resultsData.clinchedAtUpdates).length > 0) {
        var mergedClinched = { ...cumulativeClinched, ...resultsData.clinchedAtUpdates };
        updatePayload["results.clinchedAt"] = mergedClinched;
        console.log(`  Writing clinchedAt with ${Object.keys(resultsData.clinchedAtUpdates).length} entries`);
    }
    
    if (position + 1 > (GameLoader.getLocalCache().results?.computedUpToHole || 0)) {
        updatePayload["results.computedUpToHole"] = position + 1;
    }
    updatePayload["results.lastComputedAt"] = new Date().toISOString();
    
    try {
        await db.collection("scheduledGames").doc(gameId).update(updatePayload);
        console.log(`saveResultsToFirestore(${holeNumber}) - Firestore update successful`);
        
        var cache = GameLoader.getLocalCache();
        if (!cache.results) cache.results = initializeEmptyResults();
        cache.results.matchResults[position] = resultsData.matchResults;
        cache.results.game1.pointsA[position] = resultsData.game1PointsA;
        cache.results.game1.pointsB[position] = resultsData.game1PointsB;
        cache.results.game2.pointsA[position] = resultsData.game2PointsA;
        cache.results.game2.pointsB[position] = resultsData.game2PointsB;
        cache.results.game2.flight1.leader[position] = resultsData.t1Leader;
        cache.results.game2.flight2.leader[position] = resultsData.t2Leader;
        
        // NEW v5.00: Cache display strings
        if (!cache.results.game2.displayT1) cache.results.game2.displayT1 = new Array(18).fill(null);
        if (!cache.results.game2.displayT2) cache.results.game2.displayT2 = new Array(18).fill(null);
        if (!cache.results.game3.displayStrk) cache.results.game3.displayStrk = new Array(18).fill(null);
        cache.results.game2.displayT1[position] = resultsData.t1Display;
        cache.results.game2.displayT2[position] = resultsData.t2Display;
        cache.results.game3.displayStrk[position] = resultsData.strkDisplay;
        
        // NEW v5.03: Cache cumulative points
        if (!cache.results.game2.flight1.cumulativePoints) cache.results.game2.flight1.cumulativePoints = new Array(18).fill(0);
        if (!cache.results.game2.flight2.cumulativePoints) cache.results.game2.flight2.cumulativePoints = new Array(18).fill(0);
        cache.results.game2.flight1.cumulativePoints[position] = resultsData.flight1Total;
        cache.results.game2.flight2.cumulativePoints[position] = resultsData.flight2Total;
        
        // FIXED v5.06: Always cache clinchedHole (including null)
        cache.results.game2.flight1.clinchedHole = resultsData.flight1ClinchedHole;
        cache.results.game2.flight2.clinchedHole = resultsData.flight2ClinchedHole;
        
        cache.results.game3.leader[position] = resultsData.strkLeader;
        cache.results.game3.pointsA[position] = resultsData.game3PointsA;
        cache.results.game3.pointsB[position] = resultsData.game3PointsB;
        cache.results.tr.teamA[position] = resultsData.trA;
        cache.results.tr.teamB[position] = resultsData.trB;
        cache.results.tr.teamAGreen[position] = resultsData.trAGreen;
        cache.results.tr.teamBGreen[position] = resultsData.trBGreen;
        
        if (resultsData.clinchedAtUpdates && Object.keys(resultsData.clinchedAtUpdates).length > 0) {
            if (!cache.results.clinchedAt) cache.results.clinchedAt = {};
            Object.assign(cache.results.clinchedAt, resultsData.clinchedAtUpdates);
        }
        
        if (position + 1 > cache.results.computedUpToHole) cache.results.computedUpToHole = position + 1;
        cache.results.lastComputedAt = updatePayload["results.lastComputedAt"];
        
    } catch (error) {
        console.error('Error saving results:', error);
    }
    
    return {
        updatedClinched: resultsData.updatedClinched,
        updatedFlight1ClinchedHole: resultsData.updatedFlight1ClinchedHole,
        updatedFlight2ClinchedHole: resultsData.updatedFlight2ClinchedHole
    };
}

// Navigation

function nextHole() {
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    
    var isLast = (currentHole === 18);
    var isSaved = isHoleSaved(editableFlight, currentHole);
    
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    
    var isCurrentSaved = isSaved && !hasUnsavedChanges;
    
    if (isLast && isCurrentSaved) {
        showSignCardModal();
        return;
    }
    
    if (!isCurrentSaved) {
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var nextIndex = (currentIndex + 1) % 18;
    currentHole = playOrder[nextIndex];
    
    updateHoleNumberDisplay();
    setSaveButtonIdle();
    renderAll();
}

function prevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (currentIndex <= 0) return;
    
    var prevIndex = currentIndex - 1;
    currentHole = playOrder[prevIndex];
    
    updateHoleNumberDisplay();
    setSaveButtonIdle();
    renderAll();
}

function updateHoleNumberDisplay() {
    GameUI.updateCompactHoleDisplay(currentHole);
    GameUI.updateHoleHeaderNumber(currentHole);
}

function onToggleFlight(flightNumber) {
    editableFlight = flightNumber;
    GameUI.updateFlightBadge(flightNumber);
    renderAll();
}

function showSignCardModal() {
    if (typeof GameUI.ensureNoStuckModals === 'function') GameUI.ensureNoStuckModals();
    
    var modalHtml = `
        <div class="modal-overlay" id="signModalNew">
            <div class="sign-modal-container">
                <div class="sign-modal-title">✍️ SIGN SCORECARD</div>
                <div class="sign-modal-message">Confirm that all scores are correct.</div>
                <div class="sign-modal-buttons">
                    <button class="sign-btn-back" id="signBackBtnNew">← BACK</button>
                    <button class="sign-btn-confirm" id="signConfirmBtnNew">✓ SIGN CARD</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    document.getElementById('signBackBtnNew').onclick = function() { document.getElementById('signModalNew').remove(); };
    document.getElementById('signConfirmBtnNew').onclick = async function() {
        document.getElementById('signModalNew').remove();
        var success = await SignCard.submitSignature(gameId, editableFlight, null, "scheduledGames");
        if (success) {
            var cache = GameLoader.getLocalCache();
            if (editableFlight === 1) cache.signatures.f1 = true;
            else cache.signatures.f2 = true;
            if (cache.signatures.f1 && cache.signatures.f2) {
                await createHistoryRecord();
                isGameCompleteFlag = true;
                celebrationTriggered = false;
                showGameCompleteScreen();
                renderAll();
            } else {
                showWaitingScreen();
            }
        } else {
            alert("Error signing card.");
        }
    };
}

function showGameCompleteScreen() {

    var modalHtml = `

            <div class="complete-modal-container">
                <div class="complete-title">🏆 GAME COMPLETE</div>
                <div class="complete-emojis">🍺 🏆 🍺</div>
                <div class="complete-message">Both cards have been signed!</div>
                <button id="seeResultsBtnNew" class="complete-btn">🏆 SEE RESULTS</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    activeCompleteModal = document.getElementById("completeModalNew");
    document.getElementById("seeResultsBtnNew").onclick = function() {
        activeCompleteModal.remove();
        activeCompleteModal = null;
        showCelebrationAndHandicap();
    };
}

async function createHistoryRecord() {
    var cache = GameLoader.getLocalCache();
    var tr = GameLoader.getTRForHole(currentHole);
    var allMatchResults = {};
    for (var hole = 1; hole <= 18; hole++) {
        var matchResults = GameMatch.calculateCrossFlight(cache.f1DataString, cache.f2DataString, allPlayers, courseSi, startingHole, hole, coursePar);
        for (var key in matchResults) allMatchResults[key] = matchResults[key];
    }
    var gameDataForHistory = { date: new Date().toISOString().split('T')[0], course: { name: courseName, id: cache.course?.id || "", par: coursePar, si: courseSi }, players: allPlayers, startingHole: startingHole, teamGameFormat: teamGameFormat };
    return new Promise(function(resolve, reject) {
        HistoryRecord.createPendingRecord(gameId, gameDataForHistory, cache.results, { teamA: tr.teamA, teamB: tr.teamB }, { f1: { signed: cache.signatures.f1 || false }, f2: { signed: cache.signatures.f2 || false } }, cache.f1DataString, cache.f2DataString, allMatchResults, function(err, recordId) { if (err) reject(err); else resolve(recordId); });
    });
}

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    var tr = GameLoader.getTRForHole(currentHole);
    var winner = SignCard.getWinner(tr.teamA, tr.teamB);
    var winningPlayers = { teamA: allPlayers.filter(function(p) { return p.team === "A"; }), teamB: allPlayers.filter(function(p) { return p.team === "B"; }) };
    var historyRecordId = gameId + "_history";
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() { HandicapAdjustment.init(gameId, historyRecordId, winningPlayers, {}, {}, false); });
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================

function updatePlayerNamesToShortform() {
    var playerCards = document.querySelectorAll('.player-card');
    for (var i = 0; i < playerCards.length; i++) {
        var nameSpan = playerCards[i].querySelector('.player-name');
        if (nameSpan) {
            var originalName = nameSpan.innerText;
            var player = allPlayers.find(p => p.name === originalName);
            if (player && player.label) {
                nameSpan.innerText = player.label;
            }
        }
    }
}

function renderAll() {
    var cache = GameLoader.getLocalCache();
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    var tr = GameLoader.getTRForHole(currentHole);
    
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(editableFlight);
    GameUI.renderPlayerCards("playerCards", currentPlayers, getAllOpponents, getBubbleClassWithClinch, getBubbleValue, getCurrentScore, canEdit && !isGameCompleteFlag,
        function(playerName, flight, delta) {
            if (isGameCompleteFlag) return;
            var player = allPlayers.find(p => p.name === playerName && p.flight === flight);
            if (!player) return;
            var current = getCurrentScore(player);
            var newScore = Math.max(1, Math.min(99, current + delta));
            localChanges[flight + "_" + currentHole + "_" + player.name] = newScore;
            renderAll();
        }
    );
    updatePlayerNamesToShortform();
    GameUI.updateFlightBadge(editableFlight);
    
    var holes = getDisplayHoles();
    window.savedHoles = cache.savedHoles;
    
    var t1ClinchedHole = cache.results?.game2?.flight1?.clinchedHole;
    var t2ClinchedHole = cache.results?.game2?.flight2?.clinchedHole;
    
    // NEW v5.00: Get display arrays from cache (written by cascade)
    var t1Display = cache.results?.game2?.displayT1 || null;
    var t2Display = cache.results?.game2?.displayT2 || null;
    var strkDisplay = cache.results?.game3?.displayStrk || null;
    
    GameUI.renderScorecard(
        "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
        cache.t1Row, cache.t2Row, cache.strkRow, coursePar, courseSi,
        t1ClinchedHole, t2ClinchedHole,
        t1Display, t2Display, strkDisplay
    );
    
    var playOrder = getPlayOrder();
    var isCurrentSaved = isHoleSaved(editableFlight, currentHole) && Object.keys(localChanges).filter(function(key) { return key.startsWith(editableFlight + "_" + currentHole + "_"); }).length === 0;
    GameUI.updateNavigationButtons(currentHole, playOrder, isCurrentSaved, isGameCompleteFlag, celebrationTriggered, showSignCardModal);
    if (typeof Ticker !== 'undefined') Ticker.refresh();
    
    updateSaveButtonState();
}

async function exitToMainMenu() {
    if (!confirm("Leave the game? Unsaved changes will be lost.")) return;
    if (canEdit) {
        var releasePayload = { ["locks.f" + editableFlight]: null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        try { await db.collection("scheduledGames").doc(gameId).update(releasePayload); } catch(e) {}
    }
    GameLoader.unload();
    sessionStorage.removeItem("currentGame");
    localStorage.removeItem("userRole");
    window.location.href = "index.html";
}

function onCacheUpdate(cache) {
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        document.getElementById("courseName").innerHTML = courseName;
    }
    allPlayers = cache.players;
    startingHole = cache.startingHole;
    if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
    if (cache.signatures.f1 && cache.signatures.f2 && !isGameCompleteFlag && !celebrationTriggered) {
        createHistoryRecord().then(function() { isGameCompleteFlag = true; showGameCompleteScreen(); renderAll(); }).catch(console.error);
    }
    renderAll();
}

function initializeGameData(collection, cache) {
    return new Promise(function(resolve) {
        var mockSession = { activeGame: { gameId: gameId, gameType: "real", gameMode: "real", collection: collection, role: editableFlight === 1 ? "update1" : "update2" } };
        GameData.loadGameFromSession(mockSession, function(success) {
            if (success) { GameData.setCourse({ par: cache.course?.par || [] }); GameData.setPlayers(cache.players || []); resolve(true); }
            else resolve(false);
        });
    });
}

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    var session = await new Promise(function(resolve) { SessionManager.initSession("real-game.html", "index.html", resolve); });
    var sessionRole = session.activeGame ? session.activeGame.role : null;
    editableFlight = (sessionRole === "update1") ? 1 : (sessionRole === "update2") ? 2 : 1;
    canEdit = (editableFlight === 1 || editableFlight === 2);
    gameId = session.activeGame ? session.activeGame.gameId : sessionStorage.getItem('currentGameId');
    if (!gameId) { document.getElementById("debug").innerHTML = "Error: No game ID"; return; }
    
    var collection = "scheduledGames";
    GameLoader.addDataCallback(onCacheUpdate);
    
    var preloadData = getPreloadedRawGameData();
    var gameDataPreloaded = sessionStorage.getItem("gameDataPreloaded") === "true";
    
    if (preloadData && gameDataPreloaded) {
        applyPreloadedData(preloadData);
        sessionStorage.removeItem("gameDataPreloaded");
        GameUI.applyTightLayout();
        GameUI.renderCompactHeader("compactHeaderContainer", editableFlight, currentHole, saveHole, prevHole, nextHole, onToggleFlight, null);
        GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
        setTimeout(function() { GameUI.addFlightBadge(editableFlight); }, 100);
        GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
        var playOrder = getPlayOrder();
        for (var i = 0; i < playOrder.length; i++) { if (!isHoleSaved(editableFlight, playOrder[i])) { currentHole = playOrder[i]; break; } }
        updateHoleNumberDisplay();
        initTicker();
        if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
        renderAll();
        setSaveButtonIdle();
        GameLoader.loadGame(gameId, collection, async function(result) {
            if (result.success) {
                var cache = result.cache;
                if (cache.course) { courseName = cache.course.name; coursePar = cache.course.par; courseSi = cache.course.si; }
                allPlayers = cache.players;
                startingHole = cache.startingHole;
                renderAll();
            }
        });
    } else {
        GameLoader.loadGame(gameId, collection, async function(result) {
            if (!result.success) { document.getElementById("debug").innerHTML = "Error: " + result.error; return; }
            var cache = result.cache;
            courseName = cache.course?.name || "Unknown Course";
            coursePar = cache.course?.par || [];
            courseSi = cache.course?.si || [];
            allPlayers = cache.players || [];
            startingHole = cache.startingHole;
            teamGameFormat = cache.teamGameFormat || "tournament";
            document.getElementById("courseName").innerHTML = courseName;
            var initSuccess = await initializeGameData(collection, cache);
            if (!initSuccess) { document.getElementById("debug").innerHTML = "Error: Failed to initialize"; return; }
            GameUI.applyTightLayout();
            GameUI.renderCompactHeader("compactHeaderContainer", editableFlight, currentHole, saveHole, prevHole, nextHole, onToggleFlight, null);
            GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
            setTimeout(function() { GameUI.addFlightBadge(editableFlight); }, 100);
            GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
            var playOrder = getPlayOrder();
            for (var i = 0; i < playOrder.length; i++) { if (!isHoleSaved(editableFlight, playOrder[i])) { currentHole = playOrder[i]; break; } }
            updateHoleNumberDisplay();
            initTicker();
            if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
            renderAll();
            setSaveButtonIdle();
            document.getElementById("mainContainer").classList.add("data-ready");
        });
    }
    GameUI.updateToggleButtons(GameUI.getDisplayMode());
}

init();
</script>
