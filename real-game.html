<script>
// ============================================================
// VERSION CACHE-BUSTING - Forces reload on new deployment
// ============================================================
var APP_VERSION = "5.81";
var CACHE_KEY = "real_game_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.REAL_GAME_VERSION = "5.81";
console.log("[REAL-GAME] Initializing v5.81 - using displayT1/displayT2/displayStrk for scorecard");

// ============================================================
// DEBUG CONFIGURATION
// ============================================================
var DEBUG_TARGET_HOLE = 14;
var DEBUG_CALL_COUNTERS = {
    calc: 0,
    update: 0,
    write: 0
};

// ============================================================
// Firebase already initialized in firebase-config.js
// ============================================================
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var editableFlight = 1;
var canEdit = true;
var currentHole = 1;
var localChanges = {};
var startingHole = 1;
var teamGameFormat = "tournament";

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var isGameCompleteFlag = false;
var celebrationTriggered = false;

var saveInProgress = false;

var activeWaitModal = null;
var activeCompleteModal = null;

var usedPreloadedData = false;
var takeoverDetected = false;

// v5.67: Flight toggle for viewing other flight
var viewOtherFlight = false;  // true = viewing other flight (read-only)

// Firestore real-time listener
var firestoreUnsubscribe = null;

// ============================================================
// Helper: Get highest hole saved by both flights
// ============================================================

function getHighestBothSaved(cache) {
    var holes1 = cache.savedHoles[1] || [];
    var holes2 = cache.savedHoles[2] || [];
    var max = 0;
    for (var h = 18; h >= 1; h--) {
        if (holes1.indexOf(h) !== -1 && holes2.indexOf(h) !== -1) {
            max = h;
            break;
        }
    }
    return max;
}

// ============================================================
// v5.71: Helper to get last hole using shared GameData utility
// ============================================================

function getLastHole() {
    if (typeof GameData !== 'undefined' && GameData.getLastHole) {
        return GameData.getLastHole(startingHole);
    }
    // Fallback
    return (startingHole === 1) ? 18 : startingHole - 1;
}

// ============================================================
// Pending Writes Queue (unchanged)
// ============================================================

function getPendingWritesKey() {
    return "pendingCascade_" + gameId;
}

function savePendingWrites(queueData) {
    if (!gameId) return;
    var key = getPendingWritesKey();
    if (queueData && queueData.pendingWrites && queueData.pendingWrites.length > 0) {
        queueData.timestamp = Date.now();
        localStorage.setItem(key, JSON.stringify(queueData));
        console.log(`[CASCADE-DEBUG] Saved pending writes to localStorage: ${queueData.pendingWrites.length} holes pending`);
    } else {
        localStorage.removeItem(key);
        console.log(`[CASCADE-DEBUG] Cleared pending writes from localStorage`);
    }
}

function loadPendingWrites() {
    if (!gameId) return null;
    var key = getPendingWritesKey();
    var stored = localStorage.getItem(key);
    if (!stored) return null;
    
    try {
        var data = JSON.parse(stored);
        if (Date.now() - data.timestamp > 3600000) {
            localStorage.removeItem(key);
            return null;
        }
        console.log(`[CASCADE-DEBUG] Loaded pending writes from localStorage: ${data.pendingWrites.length} holes pending`);
        return data;
    } catch(e) {
        localStorage.removeItem(key);
        return null;
    }
}

async function processPendingWrites() {
    var pendingData = loadPendingWrites();
    if (!pendingData) return false;
    
    console.log(`[CASCADE-DEBUG] Resuming ${pendingData.pendingWrites.length} pending writes...`);
    
    var debugDiv = document.getElementById("debug");
    if (debugDiv) {
        debugDiv.innerHTML = `⏳ Resuming ${pendingData.pendingWrites.length} pending updates...`;
    }
    
    var resultsCache = GameLoader.getLocalCache();
    if (!resultsCache.results) {
        resultsCache.results = initializeEmptyResults();
    }
    
    for (var i = 0; i < pendingData.pendingWrites.length; i++) {
        var pending = pendingData.pendingWrites[i];
        var holeNum = pending.hole;
        
        console.log(`[CASCADE-DEBUG] Writing pending hole ${holeNum}...`);
        
        try {
            await writeSingleHoleToFirestore(holeNum, pending.resultsData, resultsCache);
            console.log(`[CASCADE-DEBUG] Successfully wrote pending hole ${holeNum}`);
            
            pendingData.pendingWrites.splice(i, 1);
            i--;
            savePendingWrites(pendingData);
            
        } catch (error) {
            console.error(`[CASCADE-DEBUG] Failed to write pending hole ${holeNum}:`, error);
            if (debugDiv) {
                debugDiv.innerHTML = `❌ Failed to write hole ${holeNum}. Will retry on next load.`;
            }
            return false;
        }
    }
    
    console.log(`[CASCADE-DEBUG] All pending writes completed successfully`);
    if (debugDiv) {
        debugDiv.innerHTML = "✓ All updates completed";
        setTimeout(function() {
            if (debugDiv.innerHTML === "✓ All updates completed") {
                debugDiv.innerHTML = "";
            }
        }, 3000);
    }
    
    savePendingWrites(null);
    return true;
}

async function writeSingleHoleToFirestore(holeNumber, resultsData, cache) {
    var position = resultsData.position;
    var isTarget = (holeNumber === DEBUG_TARGET_HOLE);
    
    if(isTarget) {
        DEBUG_CALL_COUNTERS.write++;
        console.log(`[DEBUG-WRITE] === WRITE #${DEBUG_CALL_COUNTERS.write} for HOLE ${holeNumber} (TARGET) ===`);
        console.log(`[DEBUG-WRITE] Position: ${position}`);
        console.log(`[DEBUG-WRITE] f1IntraMatches: ${resultsData.f1IntraMatches ? Object.keys(resultsData.f1IntraMatches).length + ' entries' : 'null'}`);
        console.log(`[DEBUG-WRITE] f2IntraMatches: ${resultsData.f2IntraMatches ? Object.keys(resultsData.f2IntraMatches).length + ' entries' : 'null'}`);
        console.log(`[DEBUG-WRITE] matchResults: ${resultsData.matchResults ? resultsData.matchResults.length + ' values' : 'null'}`);
        if(resultsData.f2IntraMatches) {
            console.log(`[DEBUG-WRITE] f2IntraMatches sample:`, resultsData.f2IntraMatches);
        }
    }
    
    var updatePayload = {};
    
    if (resultsData.matchResults !== null) {
        updatePayload[`results.matchResults.${position}`] = resultsData.matchResults;
    }
    
    if (resultsData.f1IntraMatches !== null) {
        updatePayload[`results.f1IntraMatches.${position}`] = resultsData.f1IntraMatches;
    }
    
    if (resultsData.f2IntraMatches !== null) {
        updatePayload[`results.f2IntraMatches.${position}`] = resultsData.f2IntraMatches;
        if(isTarget) console.log(`[DEBUG-WRITE] Adding f2IntraMatches to payload at position ${position}`);
    } else {
        if(isTarget) console.warn(`[DEBUG-WRITE] f2IntraMatches is NULL - NOT adding to payload!`);
    }
    
    updatePayload["results.game1.pointsA"] = cache.results.game1.pointsA;
    updatePayload["results.game1.pointsB"] = cache.results.game1.pointsB;
    updatePayload["results.game2.pointsA"] = cache.results.game2.pointsA;
    updatePayload["results.game2.pointsB"] = cache.results.game2.pointsB;
    updatePayload["results.game2.flight1.leader"] = cache.results.game2.flight1.leader;
    updatePayload["results.game2.flight2.leader"] = cache.results.game2.flight2.leader;
    updatePayload["results.game2.displayT1"] = cache.results.game2.displayT1;
    updatePayload["results.game2.displayT2"] = cache.results.game2.displayT2;
    updatePayload["results.game2.flight1.cumulativePoints"] = cache.results.game2.flight1.cumulativePoints;
    updatePayload["results.game2.flight2.cumulativePoints"] = cache.results.game2.flight2.cumulativePoints;
    updatePayload["results.game3.leader"] = cache.results.game3.leader;
    updatePayload["results.game3.displayStrk"] = cache.results.game3.displayStrk;
    updatePayload["results.game3.pointsA"] = cache.results.game3.pointsA;
    updatePayload["results.game3.pointsB"] = cache.results.game3.pointsB;
    updatePayload["results.tr.teamA"] = cache.results.tr.teamA;
    updatePayload["results.tr.teamB"] = cache.results.tr.teamB;
    updatePayload["results.tr.teamAGreen"] = cache.results.tr.teamAGreen;
    updatePayload["results.tr.teamBGreen"] = cache.results.tr.teamBGreen;
    
    if (resultsData.flight1ClinchedHole !== undefined && resultsData.flight1ClinchedHole !== null) {
        updatePayload["results.game2.flight1.clinchedHole"] = resultsData.flight1ClinchedHole;
    }
    if (resultsData.flight2ClinchedHole !== undefined && resultsData.flight2ClinchedHole !== null) {
        updatePayload["results.game2.flight2.clinchedHole"] = resultsData.flight2ClinchedHole;
    }
    
    if (resultsData.clinchedAtUpdates && Object.keys(resultsData.clinchedAtUpdates).length > 0) {
        updatePayload["results.clinchedAt"] = resultsData.updatedClinched;
    } else {
        updatePayload["results.clinchedAt"] = resultsData.updatedClinched;
    }
    
    var now = new Date().toISOString();
    updatePayload["results.lastComputedAt"] = now;
    updatePayload["results.playerTotals"] = cache.results.playerTotals;
    
    if(isTarget) {
        console.log(`[DEBUG-WRITE] Payload keys being sent to Firestore:`, Object.keys(updatePayload));
        console.log(`[DEBUG-WRITE] f2IntraMatches in payload:`, updatePayload[`results.f2IntraMatches.${position}`] ? 'EXISTS' : 'MISSING');
    }
    
    try {
        await db.collection("scheduledGames").doc(gameId).update(updatePayload);
        if(isTarget) console.log(`[DEBUG-WRITE] SUCCESS - Firestore update completed for hole ${holeNumber}`);
        console.log(`[CASCADE-DEBUG] Results saved successfully for hole ${holeNumber}`);
    } catch (error) {
        console.error('Error saving results:', error);
        if(isTarget) console.error(`[DEBUG-WRITE] FAILED - Firestore update error:`, error);
    }
    
    return true;
}

// ============================================================
// Preloaded Data Support
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function applyPreloadedData(preloadData) {
    console.log("Applying preloaded data for instant render");
    
    courseName = preloadData.course?.name || "Unknown Course";
    coursePar = preloadData.course?.par || [];
    courseSi = preloadData.course?.si || [];
    allPlayers = preloadData.players || [];
    startingHole = preloadData.startingHole || 1;
    teamGameFormat = preloadData.teamGameFormat || "tournament";
    
    var mockCache = {
        course: preloadData.course,
        players: preloadData.players,
        startingHole: preloadData.startingHole,
        teamGameFormat: preloadData.teamGameFormat,
        f1DataString: preloadData.f1DataString || "",
        f2DataString: preloadData.f2DataString || "",
        results: preloadData.results || null,
        savedHoles: preloadData.savedHoles || { 1: [], 2: [] },
        t1Row: preloadData.t1Row || new Array(18).fill('_'),
        t2Row: preloadData.t2Row || new Array(18).fill('_'),
        strkRow: preloadData.strkRow || new Array(18).fill('0'),
        lastSyncedHole: preloadData.lastSyncedHole || 0,
        clinchedAt: preloadData.clinchedAt || {},
        signatures: { f1: false, f2: false },
        submitted: { f1: false, f2: false },
        locks: preloadData.locks || { f1: null, f2: null },
        gameStarted: true
    };
    
    if (typeof GameLoader !== 'undefined' && GameLoader.setLocalCache) {
        GameLoader.setLocalCache(mockCache);
    } else {
        window._preloadedGameCache = mockCache;
    }
    
    document.getElementById("courseName").innerHTML = courseName;
    document.getElementById("mainContainer").classList.add("data-ready");
    
    usedPreloadedData = true;
    return true;
}

// ============================================================
// Ticker Functions
// ============================================================

function getPlayerScoreForTicker(player) {
    var cache = GameLoader.getLocalCache();
    if (cache && cache.results && cache.results.playerTotals) {
        var playerTotal = cache.results.playerTotals[player.name];
        if (playerTotal && typeof playerTotal.relativeToPar === 'number') {
            return playerTotal.relativeToPar;
        }
    }
    return 0;
}

function initTicker() {
    if (typeof Ticker !== 'undefined') {
        Ticker.init('tickerContainer', 'tickerContent', getPlayerScoreForTicker);
        if (allPlayers && allPlayers.length) {
            Ticker.setPlayers(allPlayers);
        }
    }
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getRemainingHolesFromPlayOrder(currentHoleNumber) {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHoleNumber);
    if (currentIndex === -1) return 18 - currentHoleNumber;
    return 18 - (currentIndex + 1);
}

function getDisplayHoles() {
    var mode = GameUI.getDisplayMode();
    if (mode === "natural") {
        var natural = [];
        for (var i = 1; i <= 18; i++) natural.push(i);
        return natural;
    } else {
        return getPlayOrder();
    }
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getCurrentDisplayFlight() {
    if (viewOtherFlight) {
        return editableFlight === 1 ? 2 : 1;
    }
    return editableFlight;
}

function isCurrentDisplayEditable() {
    return !viewOtherFlight && canEdit && !takeoverDetected && !isGameCompleteFlag;
}

// ============================================================
// Player Score Functions
// ============================================================

function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    var key = player.flight + "_" + currentHole + "_" + player.name;
    if (localChanges[key] !== undefined) return localChanges[key];
    return getStoredScore(player, currentHole);
}

function updateTRDisplay() {
    var tr = GameLoader.getTRForHole(currentHole);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
}

// ============================================================
// Takeover Detection
// ============================================================

function checkLockOwnership() {
    var cache = GameLoader.getLocalCache();
    if (!cache || !cache.locks) return true;
    
    var now = Date.now();
    var myDeviceIdFull = SessionManager.getDeviceIdDisplay();
    var currentLock = (editableFlight === 1) ? cache.locks.f1 : cache.locks.f2;
    
    var stillOwnsLock = currentLock && currentLock.did === myDeviceIdFull && currentLock.ex > now;
    
    if (!stillOwnsLock && canEdit && !takeoverDetected && !isGameCompleteFlag) {
        takeoverDetected = true;
        canEdit = false;
        
        var saveBtn = document.getElementById('compactSaveBtn');
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.style.opacity = '0.5';
        }
        
        showTakeoverNotificationModal();
    }
    
    return stillOwnsLock;
}

function showTakeoverNotificationModal() {
    var flightText = editableFlight === 1 ? "Flight 1" : "Flight 2";
    
    var modalHtml = `
        <div class="modal-overlay" id="takeoverNotificationModal">
            <div class="takeover-modal-container">
                <div class="takeover-modal-title">⚠️ ROLE TAKEN OVER</div>
                <div class="takeover-modal-message">Your role (${flightText}) has been taken over by another device.</div>
                <div class="takeover-modal-device">You can no longer edit scores.</div>
                <div class="takeover-modal-buttons">
                    <button class="takeover-btn-viewer" id="takeoverViewerBtn">👁️ VIEWER</button>
                    <button class="takeover-btn-exit" id="takeoverExitBtn">🚪 EXIT</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("takeoverViewerBtn").addEventListener("click", function() {
        document.getElementById("takeoverNotificationModal").remove();
        window.location.href = "view-game.html";
    });
    
    document.getElementById("takeoverExitBtn").addEventListener("click", function() {
        document.getElementById("takeoverNotificationModal").remove();
        window.location.href = "index.html";
    });
}

function updateSaveButtonState() {
    var saveBtn = document.getElementById('compactSaveBtn');
    if (!saveBtn) return;
    
    if (viewOtherFlight) {
        saveBtn.disabled = true;
        saveBtn.style.opacity = '0.5';
        saveBtn.style.cursor = 'not-allowed';
        return;
    }
    
    if (!canEdit || takeoverDetected) {
        saveBtn.disabled = true;
        saveBtn.style.opacity = '0.5';
        return;
    }
    
    var isCurrentSaved = isHoleSaved(editableFlight, currentHole);
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    var shouldDisable = isCurrentSaved && !hasUnsavedChanges;
    saveBtn.disabled = shouldDisable;
    saveBtn.style.opacity = shouldDisable ? '0.5' : '1';
    saveBtn.style.cursor = shouldDisable ? 'not-allowed' : 'pointer';
}

function setSaveButtonIdle() {
    var saveBtn = document.getElementById('compactSaveBtn');

    if (viewOtherFlight) {
        saveBtn.disabled = true;
        saveBtn.innerText = 'SAVE H' + currentHole;

function performSave() {
    return new Promise(function(resolve, reject) {
        console.log(`[DEBUG-SAVE] performSave called for hole ${currentHole}, editableFlight=${editableFlight}`);
        
        if (!canEdit || takeoverDetected) {
            reject(new Error("Role was taken over. Cannot save."));
            return;
        }
        
        if (viewOtherFlight) {
            reject(new Error("Cannot save while viewing other flight."));
            return;
        }
        
        var flight = editableFlight;
        var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
        var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        var a1Score = getStoredScore(teamA[0], currentHole);
        var a2Score = getStoredScore(teamA[1], currentHole);
        var b1Score = getStoredScore(teamB[0], currentHole);
        var b2Score = getStoredScore(teamB[1], currentHole);
        
        for (var key in localChanges) {
            if (key.startsWith(flight + "_" + currentHole + "_")) {
                var playerName = key.split('_')[2];
                if (teamA[0] && teamA[0].name === playerName) a1Score = localChanges[key];
                if (teamA[1] && teamA[1].name === playerName) a2Score = localChanges[key];
                if (teamB[0] && teamB[0].name === playerName) b1Score = localChanges[key];
                if (teamB[1] && teamB[1].name === playerName) b2Score = localChanges[key];
            }
        }
        
        var scores = { a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score };
        
        GameData.saveCurrentHole(currentHole, scores, coursePar, async function(success) {
            if (success) {
                for (var key in localChanges) {
                    if (key.startsWith(flight + "_" + currentHole + "_")) {
                        delete localChanges[key];
                    }
                }
                
                console.log(`[CASCADE-DEBUG] === CASCADE START ===`);
                console.log(`[CASCADE-DEBUG] currentHole (saved) = ${currentHole}`);
                
                await new Promise(function(resolveLoad) {
                    GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                        if (result.success) console.log("[CASCADE-DEBUG] Cache refreshed after save");
                        resolveLoad();
                    });
                });
                
                var cache = GameLoader.getLocalCache();
                var existingClinched = cache.results?.clinchedAt || {};
                var cumulativeFlight1ClinchedHole = cache.results?.game2?.flight1?.clinchedHole || null;
                var cumulativeFlight2ClinchedHole = cache.results?.game2?.flight2?.clinchedHole || null;
                
                var cascadeStartHole = currentHole;
                
                console.log(`[CASCADE-DEBUG] cascadeStartHole = ${cascadeStartHole}`);
                console.log(`[CASCADE-DEBUG] existingClinched count = ${Object.keys(existingClinched).length}`);
                
                var highestBothSaved = getHighestBothSaved(cache);
                console.log(`[CASCADE-DEBUG] highestBothSaved = ${highestBothSaved}`);
                
                var cascadeResultsQueue = [];
                
                console.log(`[DEBUG-CALC] Calling calculateHoleResultsWithCumulative for hole ${currentHole}`);
                var resultsData = calculateHoleResultsWithCumulative(currentHole, existingClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole, cascadeStartHole);
                if (resultsData) {
                    console.log(`[DEBUG-CALC] resultsData received, clinchedAtUpdates count = ${Object.keys(resultsData.clinchedAtUpdates || {}).length}`);
                    updateLocalCacheWithResults(resultsData);
                    renderAll();
                    cascadeResultsQueue.push({
                        hole: currentHole,
                        resultsData: resultsData
                    });
                }
                
                var playOrder = getPlayOrder();
                var startPos = playOrder.indexOf(currentHole);
                
                console.log(`[CASCADE-DEBUG] Processing holes from ${currentHole + 1} to ${highestBothSaved}`);
                
                var currentCache = GameLoader.getLocalCache();
                
                for (var i = startPos + 1; i < 18; i++) {
                    var holeToUpdate = playOrder[i];
                    
                    if (holeToUpdate > highestBothSaved) {
                        console.log(`[CASCADE-DEBUG] Stopping cascade at hole ${holeToUpdate} (exceeds highestBothSaved ${highestBothSaved})`);
                        break;
                    }
                    
                    console.log(`[CASCADE-DEBUG] --- Processing hole ${holeToUpdate} (using local cache) ---`);
                    
                    var updatedClinched = currentCache.results?.clinchedAt || {};
                    var updatedFlight1Clinched = currentCache.results?.game2?.flight1?.clinchedHole || null;
                    var updatedFlight2Clinched = currentCache.results?.game2?.flight2?.clinchedHole || null;
                    
                    console.log(`[CASCADE-DEBUG] Before hole ${holeToUpdate} - clinchedAt count = ${Object.keys(updatedClinched).length}`);
                    
                    var loopResultsData = calculateHoleResultsWithCumulative(holeToUpdate, updatedClinched, updatedFlight1Clinched, updatedFlight2Clinched, cascadeStartHole);
                    if (loopResultsData) {
                        updateLocalCacheWithResults(loopResultsData);
                        renderAll();
                        cascadeResultsQueue.push({
                            hole: holeToUpdate,
                            resultsData: loopResultsData
                        });
                    }
                    
                    currentCache = GameLoader.getLocalCache();
                }
                
                console.log(`[CASCADE-DEBUG] Cascade calculation complete. ${cascadeResultsQueue.length} holes to write to Firestore.`);
                console.log(`[CASCADE-DEBUG] Queue contents: ${cascadeResultsQueue.map(function(item) { return item.hole; }).join(', ')}`);
                
                var pendingData = {
                    gameId: gameId,
                    cascadeStartHole: cascadeStartHole,
                    highestBothSaved: highestBothSaved,
                    pendingWrites: cascadeResultsQueue.map(function(item) {
                        return {
                            hole: item.hole,
                            resultsData: item.resultsData
                        };
                    })
                };
                savePendingWrites(pendingData);
                
                var finalCache = GameLoader.getLocalCache();
                
                // v5.70: FIX - Recalculate entire stroke game for all positions
                if (typeof GameStroke !== 'undefined') {
                    var freshStrokeResults = GameStroke.calculate(
                        allPlayers,
                        finalCache.f1DataString,
                        finalCache.f2DataString,
                        courseSi,
                        startingHole,
                        coursePar
                    );
                    
                    console.log('[STROKE-FIX] Recalculating all stroke game positions');
                    for (var pos = 0; pos < 18; pos++) {
                        finalCache.results.game3.leader[pos] = freshStrokeResults.leader[pos];
                        finalCache.results.game3.displayStrk[pos] = freshStrokeResults.displayStrk[pos];
                        finalCache.results.game3.nettA[pos] = freshStrokeResults.nettA[pos];
                        finalCache.results.game3.nettB[pos] = freshStrokeResults.nettB[pos];
                        finalCache.results.game3.pointsA[pos] = freshStrokeResults.pointsA[pos];
                        finalCache.results.game3.pointsB[pos] = freshStrokeResults.pointsB[pos];
                    }
                    console.log('[STROKE-FIX] Updated displayStrk:', freshStrokeResults.displayStrk.slice(0, 5));
                }
                
                for (var q = 0; q < cascadeResultsQueue.length; q++) {
                    var item = cascadeResultsQueue[q];
                    console.log(`[CASCADE-DEBUG] Writing hole ${item.hole} to Firestore...`);
                    
                    try {
                        await writeSingleHoleToFirestore(item.hole, item.resultsData, finalCache);
                        console.log(`[CASCADE-DEBUG] Successfully wrote hole ${item.hole}`);
                        
                        pendingData.pendingWrites = pendingData.pendingWrites.filter(function(w) {
                            return w.hole !== item.hole;
                        });
                        savePendingWrites(pendingData);
                        
                    } catch (error) {
                        console.error(`[CASCADE-DEBUG] Failed to write hole ${item.hole}:`, error);
                        reject(new Error(`Failed to write hole ${item.hole}`));
                        return;
                    }
                }
                
                savePendingWrites(null);
                
                if (typeof Ticker !== 'undefined') {
                    Ticker.refresh();
                }
                
                resolve(true);
            } else {
                reject(new Error("Save failed"));
            }
        });
    });
}

function updateLocalCacheWithResults(resultsData) {
    var position = resultsData.position;
    var holeNumber = getHoleAtPosition(position);
    var isTarget = (holeNumber === DEBUG_TARGET_HOLE);
    
    if(isTarget) {
        DEBUG_CALL_COUNTERS.update++;
        console.log(`[DEBUG-UPDATE] === UPDATE #${DEBUG_CALL_COUNTERS.update} for HOLE ${holeNumber} (position ${position}) (TARGET) ===`);
        console.log(`[DEBUG-UPDATE] Received f1IntraMatches: ${resultsData.f1IntraMatches ? Object.keys(resultsData.f1IntraMatches).length + ' entries' : 'null'}`);
        console.log(`[DEBUG-UPDATE] Received f2IntraMatches: ${resultsData.f2IntraMatches ? Object.keys(resultsData.f2IntraMatches).length + ' entries' : 'null'}`);
        console.log(`[DEBUG-UPDATE] Received matchResults: ${resultsData.matchResults ? resultsData.matchResults.length + ' values' : 'null'}`);
        if(resultsData.f2IntraMatches) {
            console.log(`[DEBUG-UPDATE] f2IntraMatches content:`, resultsData.f2IntraMatches);
        }
    }
    
    var cache = GameLoader.getLocalCache();
    if (!cache.results) {
        cache.results = initializeEmptyResults();
    }
    
    if(isTarget) {
        var beforeF2 = cache.results.f2IntraMatches?.[position];
        console.log(`[DEBUG-UPDATE] BEFORE: cache.f2IntraMatches[${position}] =`, beforeF2);
    }
    
    if (resultsData.matchResults !== null) {
        if (!cache.results.matchResults) cache.results.matchResults = new Array(18);
        cache.results.matchResults[position] = resultsData.matchResults;
    }
    
    if (resultsData.f1IntraMatches !== null) {
        if (!cache.results.f1IntraMatches) cache.results.f1IntraMatches = new Array(18);
        cache.results.f1IntraMatches[position] = resultsData.f1IntraMatches;
    }
    
    if (resultsData.f2IntraMatches !== null) {
        if (!cache.results.f2IntraMatches) cache.results.f2IntraMatches = new Array(18);
        cache.results.f2IntraMatches[position] = resultsData.f2IntraMatches;
        if(isTarget) console.log(`[DEBUG-UPDATE] Setting cache.f2IntraMatches[${position}]`);
    } else {
        if(isTarget) console.warn(`[DEBUG-UPDATE] resultsData.f2IntraMatches is NULL - not updating cache!`);
    }
    
    if (!cache.results.game1.pointsA) cache.results.game1.pointsA = new Array(18).fill(8);
    cache.results.game1.pointsA[position] = resultsData.game1PointsA;
    
    if (!cache.results.game1.pointsB) cache.results.game1.pointsB = new Array(18).fill(8);
    cache.results.game1.pointsB[position] = resultsData.game1PointsB;
    
    if (!cache.results.game2.pointsA) cache.results.game2.pointsA = new Array(18).fill(1);
    cache.results.game2.pointsA[position] = resultsData.game2PointsA;
    
    if (!cache.results.game2.pointsB) cache.results.game2.pointsB = new Array(18).fill(1);
    cache.results.game2.pointsB[position] = resultsData.game2PointsB;
    
    if (!cache.results.game2.flight1.leader) cache.results.game2.flight1.leader = new Array(18).fill("AS");
    cache.results.game2.flight1.leader[position] = resultsData.t1Leader;
    
    if (!cache.results.game2.flight2.leader) cache.results.game2.flight2.leader = new Array(18).fill("AS");
    cache.results.game2.flight2.leader[position] = resultsData.t2Leader;
    
    if (!cache.results.game2.displayT1) cache.results.game2.displayT1 = new Array(18).fill("AS");
    cache.results.game2.displayT1[position] = resultsData.t1Display;
    
    if (!cache.results.game2.displayT2) cache.results.game2.displayT2 = new Array(18).fill("AS");
    cache.results.game2.displayT2[position] = resultsData.t2Display;
    
    if (!cache.results.game2.flight1.cumulativePoints) cache.results.game2.flight1.cumulativePoints = new Array(18).fill(0);
    cache.results.game2.flight1.cumulativePoints[position] = resultsData.cumulativeF1 !== undefined ? resultsData.cumulativeF1 : 0;
    
    if (!cache.results.game2.flight2.cumulativePoints) cache.results.game2.flight2.cumulativePoints = new Array(18).fill(0);
    cache.results.game2.flight2.cumulativePoints[position] = resultsData.cumulativeF2 !== undefined ? resultsData.cumulativeF2 : 0;
    
    if (!cache.results.game3.leader) cache.results.game3.leader = new Array(18).fill("AS");
    cache.results.game3.leader[position] = resultsData.strkLeader;
    
    if (!cache.results.game3.displayStrk) cache.results.game3.displayStrk = new Array(18).fill("AS");
    cache.results.game3.displayStrk[position] = resultsData.strkDisplay;
    
    if (!cache.results.game3.pointsA) cache.results.game3.pointsA = new Array(18).fill(0.5);
    cache.results.game3.pointsA[position] = resultsData.game3PointsA;
    
    if (!cache.results.game3.pointsB) cache.results.game3.pointsB = new Array(18).fill(0.5);
    cache.results.game3.pointsB[position] = resultsData.game3PointsB;
    
    if (!cache.results.tr.teamA) cache.results.tr.teamA = new Array(18).fill(null);
    if (!cache.results.tr.teamB) cache.results.tr.teamB = new Array(18).fill(null);
    if (!cache.results.tr.teamAGreen) cache.results.tr.teamAGreen = new Array(18).fill(false);
    if (!cache.results.tr.teamBGreen) cache.results.tr.teamBGreen = new Array(18).fill(false);
    
    cache.results.tr.teamA[position] = resultsData.trA;
    cache.results.tr.teamB[position] = resultsData.trB;
    cache.results.tr.teamAGreen[position] = resultsData.trAGreen;
    cache.results.tr.teamBGreen[position] = resultsData.trBGreen;
    
    cache.results.game2.flight1.clinchedHole = resultsData.flight1ClinchedHole;
    cache.results.game2.flight2.clinchedHole = resultsData.flight2ClinchedHole;
    
    var oldClinchedCount = Object.keys(cache.results.clinchedAt || {}).length;
    cache.results.clinchedAt = resultsData.updatedClinched;
    var newClinchedCount = Object.keys(cache.results.clinchedAt || {}).length;
    console.log(`[DEBUG-CACHE] clinchedAt: ${oldClinchedCount} -> ${newClinchedCount}`);
    if (newClinchedCount > oldClinchedCount) {
        console.log(`[DEBUG-CACHE] New clinches:`, Object.keys(cache.results.clinchedAt));
    }
    
    if (resultsData.t1Display !== undefined && resultsData.t1Display !== null) {
        cache.t1Row[position] = resultsData.t1Display;
    }
    if (resultsData.t2Display !== undefined && resultsData.t2Display !== null) {
        cache.t2Row[position] = resultsData.t2Display;
    }
    if (resultsData.strkDisplay !== undefined && resultsData.strkDisplay !== null) {
        cache.strkRow[position] = resultsData.strkDisplay;
    }
    
    var highestBothSaved = getHighestBothSaved(cache);
    var playerTotals = calculatePlayerTotals(highestBothSaved);
    cache.results.playerTotals = playerTotals;
    
    if(isTarget) {
        var afterF2 = cache.results.f2IntraMatches?.[position];
        console.log(`[DEBUG-UPDATE] AFTER: cache.f2IntraMatches[${position}] =`, afterF2);
        if(afterF2) {
            console.log(`[DEBUG-UPDATE] AFTER content:`, afterF2);
        }
        if(beforeF2 === undefined && afterF2) {
            console.log(`[DEBUG-UPDATE] SUCCESS: f2IntraMatches was SAVED to cache`);
        } else if(beforeF2 === undefined && afterF2 === undefined) {
            console.error(`[DEBUG-UPDATE] FAILURE: f2IntraMatches was NOT saved to cache!`);
        }
    }
}

async function saveHole() {
    if (saveInProgress) return;
    if (viewOtherFlight) {
        Modal.alert("Cannot save while viewing other flight. Tap the flight button to return to scoring.");
        return;
    }
    if (!canEdit) {
        Modal.alert("You can no longer edit - your role was taken over.");
        return;
    }
    if (takeoverDetected) {
        Modal.alert("Your role was taken over. Cannot save.");
        return;
    }
    if (isGameCompleteFlag) {
        Modal.alert("Game already complete.");
        return;
    }
    
    console.log(`[DEBUG-SAVE] saveHole called for hole ${currentHole}`);
    setSaveButtonPending();
    try {
        await performSave();
        flashSaveButtonSuccess();
        setSaveButtonIdle();
        document.getElementById("debug").innerHTML = "✓ Saved";
        setTimeout(function() {
            if (document.getElementById("debug").innerHTML === "✓ Saved") {
                document.getElementById("debug").innerHTML = "";
            }
        }, 1500);
        renderAll();
    } catch (error) {
        console.error("Save error:", error);
        setSaveButtonRetry();
        document.getElementById("debug").innerHTML = "✗ Save failed. Click RETRY.";
    }
}

function initializeEmptyResults() {
    return {
        version: 1,
        matchResults: new Array(18),
        f1IntraMatches: new Array(18),
        f2IntraMatches: new Array(18),
        game1: { matches: {}, pointsA: new Array(18).fill(8), pointsB: new Array(18).fill(8) },
        game2: {
            flight1: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0), clinchedHole: null },
            flight2: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0), clinchedHole: null },
            pointsA: new Array(18).fill(1),
            pointsB: new Array(18).fill(1)
        },
        game3: { leader: new Array(18).fill("AS"), nettA: new Array(18).fill(0), nettB: new Array(18).fill(0), pointsA: new Array(18).fill(0.5), pointsB: new Array(18).fill(0.5) },
        tr: { 
            teamA: new Array(18).fill(null), 
            teamB: new Array(18).fill(null), 
            teamAGreen: new Array(18).fill(false), 
            teamBGreen: new Array(18).fill(false) 
        },
        lastComputedAt: null,
        clinchedAt: {},
        playerTotals: {}
    };
}

function calculatePlayerTotals(upToHole) {
    var cache = GameLoader.getLocalCache();
    var playerTotals = {};
    
    for (var p = 0; p < allPlayers.length; p++) {
        var player = allPlayers[p];
        var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
        var totalGross = 0;
        var totalPar = 0;
        
        for (var h = 1; h <= upToHole; h++) {
            var par = coursePar[h - 1];
            totalPar += par;
            
            var holeData = GameData.parseHoleData(flightDataStr, h);
            if (holeData && holeData.saved) {
                var score = 0;
                var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
                var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
                var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
                
                if (player.team === 'A') {
                    if (teamA[0] && teamA[0].name === player.name) score = holeData.scores.a1;
                    else if (teamA[1] && teamA[1].name === player.name) score = holeData.scores.a2;
                } else {
                    if (teamB[0] && teamB[0].name === player.name) score = holeData.scores.b1;
                    else if (teamB[1] && teamB[1].name === player.name) score = holeData.scores.b2;
                }
                totalGross += score;
            } else {
                totalGross += par;
            }
        }
        
        playerTotals[player.name] = {
            name: player.name,
            label: player.label,
            totalGross: totalGross,
            totalPar: totalPar,
            holesPlayed: upToHole,
            relativeToPar: totalGross - totalPar
        };
    }
    
    return playerTotals;
}

function getHoleAtPosition(position) {
    var playOrder = getPlayOrder();
    return playOrder[position];
}

// MAIN RESULTS CALCULATION
// ============================================================

function calculateHoleResultsWithCumulative(holeNumber, cumulativeClinched, cumulativeFlight1ClinchedHole, cumulativeFlight2ClinchedHole, cascadeStartHole) {
    var isTarget = (holeNumber === DEBUG_TARGET_HOLE);
    
    if(isTarget) {
        DEBUG_CALL_COUNTERS.calc++;
        console.log(`[DEBUG-CALC] === CALC #${DEBUG_CALL_COUNTERS.calc} for HOLE ${holeNumber} (TARGET) ===`);
        console.log(`[DEBUG-CALC] cascadeStartHole=${cascadeStartHole}`);
    }
    
    var cache = GameLoader.getLocalCache();
    var position = getHolePosition(holeNumber);
    var f1Hole = cache.flight1Data[holeNumber];
    var f2Hole = cache.flight2Data[holeNumber];
    
    var f1Available = (f1Hole && f1Hole.saved);
    var f2Available = (f2Hole && f2Hole.saved);
    var crossAvailable = f1Available && f2Available;
    
    if(isTarget) {
        console.log(`[DEBUG-CALC] f1Available=${f1Available}, f2Available=${f2Available}, crossAvailable=${crossAvailable}`);
        console.log(`[DEBUG-CALC] f1Hole.saved=${f1Hole?.saved}, f2Hole.saved=${f2Hole?.saved}`);
    }
    
    var remainingHolesByPosition = new Array(18);
    for (var pos = 0; pos < 18; pos++) {
        var holeForPos = getHoleAtPosition(pos);
        remainingHolesByPosition[pos] = getRemainingHolesFromPlayOrder(holeForPos);
    }
    
    var teamGameResults = GameTeam.calculateWithClinched(
        allPlayers, cache.f1DataString, cache.f2DataString, 
        courseSi, startingHole, teamGameFormat, remainingHolesByPosition
    );
    
    var flight1ClinchedHoleResult = teamGameResults.flight1ClinchedHole;
    var flight2ClinchedHoleResult = teamGameResults.flight2ClinchedHole;
    
    var f1IntraMatchesForHole = null;
    var clinchedAtUpdates = {};
    var remainingHoles = getRemainingHolesFromPlayOrder(holeNumber);
    var deviceId = SessionManager.getDeviceIdDisplay();
    var cascadeVersion = window.REAL_GAME_VERSION || "5.81";
    
    if (f1Available) {
        var flight1Players = allPlayers.filter(function(p) { return p.flight === 1; });
        if(isTarget) console.log(`[DEBUG-CALC] Calling Flight 1 intra-flight for hole ${holeNumber}`);
        var intra1Result = GameMatch.calculateIntraFlightWithClinch(
            1, flight1Players, cache.f1DataString, courseSi, startingHole, holeNumber, coursePar,
            remainingHoles, holeNumber, deviceId, cascadeVersion, cumulativeClinched
        );
        f1IntraMatchesForHole = intra1Result.intraMatches;
        for (var matchKey in intra1Result.clinchedAtUpdates) {
            clinchedAtUpdates[matchKey] = intra1Result.clinchedAtUpdates[matchKey];
        }
        if(isTarget) console.log(`[DEBUG-CALC] Flight 1 intra: ${Object.keys(intra1Result.intraMatches || {}).length} matches, ${Object.keys(intra1Result.clinchedAtUpdates).length} clinch updates`);
    }
    
    var f2IntraMatchesForHole = null;
    
    if (f2Available) {
        var flight2Players = allPlayers.filter(function(p) { return p.flight === 2; });
        if(isTarget) console.log(`[DEBUG-CALC] Calling Flight 2 intra-flight for hole ${holeNumber}`);
        var intra2Result = GameMatch.calculateIntraFlightWithClinch(
            2, flight2Players, cache.f2DataString, courseSi, startingHole, holeNumber, coursePar,
            remainingHoles, holeNumber, deviceId, cascadeVersion, cumulativeClinched
        );
        f2IntraMatchesForHole = intra2Result.intraMatches;
        for (var matchKey in intra2Result.clinchedAtUpdates) {
            clinchedAtUpdates[matchKey] = intra2Result.clinchedAtUpdates[matchKey];
        }
        if(isTarget) {
            console.log(`[DEBUG-CALC] Flight 2 intra: ${Object.keys(intra2Result.intraMatches || {}).length} matches, ${Object.keys(intra2Result.clinchedAtUpdates).length} clinch updates`);
            if(f2IntraMatchesForHole) {
                console.log(`[DEBUG-CALC] f2IntraMatchesForHole content:`, f2IntraMatchesForHole);
            } else {
                console.warn(`[DEBUG-CALC] f2IntraMatchesForHole is NULL!`);
            }
        }
    }
    
    var matchResultsArray = null;
    var game1PointsA = 0, game1PointsB = 0;
    
    if (crossAvailable) {
        if(isTarget) console.log(`[DEBUG-CALC] Calling cross-flight matches for hole ${holeNumber}`);
        var crossResult = GameMatch.calculateCrossFlightWithClinch(
            cache.f1DataString, cache.f2DataString, allPlayers, courseSi, startingHole, holeNumber, coursePar,
            remainingHoles, holeNumber, deviceId, cascadeVersion, cumulativeClinched
        );
        matchResultsArray = crossResult.matchResultsArray;
        
        for (var matchKey in crossResult.clinchedAtUpdates) {
            clinchedAtUpdates[matchKey] = crossResult.clinchedAtUpdates[matchKey];
        }
        
        var matchResultsObj = crossResult.matchResultsObj;
        var matchCount = 0;
        for (var key in matchResultsObj) {
            if (key.indexOf("_vs_") !== -1 && matchCount < 16) {
                var firstPlayerName = key.split("_vs_")[0];
                var firstPlayer = allPlayers.find(function(p) { return p.name === firstPlayerName; });
                if (firstPlayer && firstPlayer.team === "A") {
                    var value = matchResultsObj[key];
                    if (value > 0) game1PointsA += 1;
                    else if (value < 0) game1PointsB += 1;
                    else { game1PointsA += 0.5; game1PointsB += 0.5; }
                    matchCount++;
                }
            }
        }
        if(isTarget) console.log(`[DEBUG-CALC] Cross: ${Object.keys(crossResult.clinchedAtUpdates).length} clinch updates, game1Points=${game1PointsA}-${game1PointsB}`);
    }
    
    var strkLeader = "AS";
    var strkDisplay = "AS";
    
    if (crossAvailable) {
        var strokeResults = GameStroke.calculate(allPlayers, cache.f1DataString, cache.f2DataString, courseSi, startingHole, coursePar);
        strkLeader = strokeResults.leader[position] === "A" ? "A" : strokeResults.leader[position] === "B" ? "B" : "AS";
        strkDisplay = strokeResults.displayStrk?.[position] || "AS";
    }
    
    var cumulativeF1 = teamGameResults.flight1Cumulative[position];
    var cumulativeF2 = teamGameResults.flight2Cumulative[position];
    var t1Leader = teamGameResults.flight1Leaders[position];
    var t2Leader = teamGameResults.flight2Leaders[position];
    var t1Display = teamGameResults.displayT1[position];
    var t2Display = teamGameResults.displayT2[position];
    
    var flight1PointsA = (cumulativeF1 > 0) ? 1 : (cumulativeF1 < 0) ? 0 : 0.5;
    var flight1PointsB = (cumulativeF1 > 0) ? 0 : (cumulativeF1 < 0) ? 1 : 0.5;
    var flight2PointsA = (cumulativeF2 > 0) ? 1 : (cumulativeF2 < 0) ? 0 : 0.5;
    var flight2PointsB = (cumulativeF2 > 0) ? 0 : (cumulativeF2 < 0) ? 1 : 0.5;
    var game2PointsA = flight1PointsA + flight2PointsA;
    var game2PointsB = flight1PointsB + flight2PointsB;
    
    var game3PointsA = (strkLeader === "A") ? 1 : (strkLeader === "B") ? 0 : 0.5;
    var game3PointsB = (strkLeader === "A") ? 0 : (strkLeader === "B") ? 1 : 0.5;
    
    var trA, trB, trAGreen, trBGreen;
    
    if (crossAvailable) {
        trA = game1PointsA + game2PointsA + game3PointsA;
        trB = game1PointsB + game2PointsB + game3PointsB;
        trAGreen = (trA > trB);
        trBGreen = (trB > trA);
        if(isTarget) console.log(`[DEBUG-CALC] TR = ${trA} - ${trB}`);
    } else {
        trA = null;
        trB = null;
        trAGreen = false;
        trBGreen = false;
        if(isTarget) console.log(`[DEBUG-CALC] TR set to null (incomplete data)`);
    }
    
    var isCascadeStartHole = (holeNumber < cascadeStartHole);
    var updatedClinched = GameMatch.updateClinchedAt(cumulativeClinched, clinchedAtUpdates, cascadeStartHole, isCascadeStartHole);
    
    var result = {
        position: position,
        matchResults: matchResultsArray,
        f1IntraMatches: f1IntraMatchesForHole,
        f2IntraMatches: f2IntraMatchesForHole,
        t1Leader: t1Leader,
        t2Leader: t2Leader,
        strkLeader: strkLeader,
        game1PointsA: game1PointsA,
        game1PointsB: game1PointsB,
        game2PointsA: game2PointsA,
        game2PointsB: game2PointsB,
        game3PointsA: game3PointsA,
        game3PointsB: game3PointsB,
        trA: trA,
        trB: trB,
        trAGreen: trAGreen,
        trBGreen: trBGreen,
        flight1Total: cumulativeF1,
        flight2Total: cumulativeF2,
        flight1ClinchedHole: flight1ClinchedHoleResult,
        flight2ClinchedHole: flight2ClinchedHoleResult,
        clinchedAtUpdates: clinchedAtUpdates,
        updatedClinched: updatedClinched,
        updatedFlight1ClinchedHole: flight1ClinchedHoleResult,
        updatedFlight2ClinchedHole: flight2ClinchedHoleResult,
        t1Display: t1Display,
        t2Display: t2Display,
        strkDisplay: strkDisplay,
        netThisHoleF1: 0,
        netThisHoleF2: 0,
        cumulativeF1: cumulativeF1,
        cumulativeF2: cumulativeF2
    };
    
    if(isTarget) {
        console.log(`[DEBUG-CALC] FINAL RESULT for hole ${holeNumber}:`);
        console.log(`  - f1IntraMatches: ${result.f1IntraMatches ? Object.keys(result.f1IntraMatches).length + ' entries' : 'null'}`);
        console.log(`  - f2IntraMatches: ${result.f2IntraMatches ? Object.keys(result.f2IntraMatches).length + ' entries' : 'null'}`);
        console.log(`  - matchResults: ${result.matchResults ? result.matchResults.length + ' values' : 'null'}`);
        console.log(`  - clinchedAtUpdates: ${Object.keys(result.clinchedAtUpdates).length}`);
    }
    
    console.log(`[CASCADE-DEBUG] Hole ${holeNumber}: T-1=${t1Display}, T-2=${t2Display}, TR=${trA === null ? '-' : trA + '-' + trB}`);
    
    return result;
}

// Real-time Firestore Listener

function setupRealtimeListener() {
    if (!db || !gameId) {
        console.warn("Cannot setup realtime listener - db or gameId missing");
        return;
    }
    
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
    }
    
    console.log("Setting up realtime Firestore listener for game:", gameId);
    
    firestoreUnsubscribe = db.collection("scheduledGames").doc(gameId)
        .onSnapshot(function(doc) {
            if (!doc.exists) return;
            
            var data = doc.data();
            var currentCache = GameLoader.getLocalCache();
            
            var f1Changed = (currentCache.f1DataString !== data.f1?.d);
            var f2Changed = (currentCache.f2DataString !== data.f2?.d);
            var locksChanged = (JSON.stringify(currentCache.locks) !== JSON.stringify(data.locks));
            var resultsChanged = (JSON.stringify(currentCache.results) !== JSON.stringify(data.results));
            
            if (f1Changed || f2Changed || locksChanged || resultsChanged) {
                console.log("Realtime update detected");
                
                GameLoader.loadGame(gameId, "scheduledGames", function(result) {
                    if (result.success) {
                        console.log("Cache refreshed from realtime update");
                        
                        if (result.cache.course) {
                            courseName = result.cache.course.name;
                            coursePar = result.cache.course.par;
                            courseSi = result.cache.course.si;
                        }
                        allPlayers = result.cache.players;
                        startingHole = result.cache.startingHole;
                        
                        var clinchedAtFromFS = result.cache.results?.clinchedAt || {};
                        console.log(`[CASCADE-DEBUG] Firestore cache refresh: clinchedAt count = ${Object.keys(clinchedAtFromFS).length}`);
                        
                        if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) {
                            Ticker.setPlayers(allPlayers);
                        }
                        
                        checkLockOwnership();
                        renderAll();
                    } else {
                        console.warn("Failed to refresh cache from realtime update:", result.error);
                    }
                });
            }
        }, function(error) {
            console.warn("Firestore realtime listener error:", error);
        });
}

function nextHole() {
    console.log(`[DEBUG-NAV] nextHole called, currentHole=${currentHole}`);
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    
    if (takeoverDetected) {
        return;
    }
    
    if (viewOtherFlight) {
        console.log(`[DEBUG-NAV] Cannot advance hole while viewing other flight`);
        return;
    }
    
    var lastHole = getLastHole();
    var isLast = (currentHole === lastHole);
    var isSaved = isHoleSaved(editableFlight, currentHole);
    
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    
    var isCurrentSaved = isSaved && !hasUnsavedChanges;
    
    if (isLast && isCurrentSaved) {
        showSignCardModal();
        return;
    }
    
    if (!isCurrentSaved) {
        console.log(`[DEBUG-NAV] Cannot advance - hole ${currentHole} not saved`);
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var nextIndex = (currentIndex + 1) % 18;
    currentHole = playOrder[nextIndex];
    
    console.log(`[DEBUG-NAV] Moved to hole ${currentHole}`);
    updateHoleNumberDisplay();
    setSaveButtonIdle();
    renderAll();
}

function prevHole() {
    if (viewOtherFlight) {
        console.log(`[DEBUG-NAV] Cannot navigate holes while viewing other flight`);
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (currentIndex <= 0) return;
    
    var prevIndex = currentIndex - 1;
    currentHole = playOrder[prevIndex];
    
    updateHoleNumberDisplay();
    setSaveButtonIdle();
    renderAll();
}

function updateHoleNumberDisplay() {
    GameUI.updateCompactHoleDisplay(currentHole);

}

async function createHistoryRecord() {
    var cache = GameLoader.getLocalCache();
    var tr = GameLoader.getTRForHole(currentHole);
    var allMatchResults = {};
    for (var hole = 1; hole <= 18; hole++) {
        var matchResults = GameMatch.calculateCrossFlight(cache.f1DataString, cache.f2DataString, allPlayers, courseSi, startingHole, hole, coursePar);
        for (var key in matchResults) allMatchResults[key] = matchResults[key];
    }
    var gameDataForHistory = { date: new Date().toISOString().split('T')[0], course: { name: courseName, id: cache.course?.id || "", par: coursePar, si: courseSi }, players: allPlayers, startingHole: startingHole, teamGameFormat: teamGameFormat };
    return new Promise(function(resolve, reject) {
        HistoryRecord.createPendingRecord(gameId, gameDataForHistory, cache.results, { teamA: tr.teamA, teamB: tr.teamB }, { f1: { signed: cache.signatures.f1 || false }, f2: { signed: cache.signatures.f2 || false } }, cache.f1DataString, cache.f2DataString, allMatchResults, function(err, recordId) { if (err) reject(err); else resolve(recordId); });
    });
}

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    var tr = GameLoader.getTRForHole(currentHole);
    var winner = SignCard.getWinner(tr.teamA, tr.teamB);
    var winningPlayers = { teamA: allPlayers.filter(function(p) { return p.team === "A"; }), teamB: allPlayers.filter(function(p) { return p.team === "B"; }) };
    var historyRecordId = gameId + "_history";
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() { HandicapAdjustment.init(gameId, historyRecordId, winningPlayers, {}, {}, false); });
}

function updatePlayerNamesToShortform() {

                <button class="compact-prev-btn" id="compactPrevBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: 44px; height: 44px; border-radius: 30px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    ◀
                </button>
                <span class="compact-hole-display" style="font-size: 1rem; font-weight: 700; color: #4caf50; min-width: 36px; text-align: center;">${currentHole}</span>
                <button class="compact-next-btn" id="compactNextBtn" style="background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; width: 44px; height: 44px; border-radius: 30px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    ▶
                </button>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById('compactPnBtn').onclick = function() {
        var newMode = GameUI.getDisplayMode() === 'play' ? 'natural' : 'play';
        GameUI.setDisplayMode(newMode, null);
        renderAll();
    };
    
    document.getElementById('compactFlightToggleBtn').onclick = function() {
        onToggleFlightView();
    };
    
    var saveBtn = document.getElementById('compactSaveBtn');
    if (saveBtn && !saveButtonDisabled) {
        saveBtn.onclick = function() {
            saveHole();
        };
    }
    
    document.getElementById('compactPrevBtn').onclick = function() {
        prevHole();
    };
    
    document.getElementById('compactNextBtn').onclick = function() {
        if (isGameCompleteFlag && !celebrationTriggered) {
            showCelebrationAndHandicap();
        } else {
            nextHole();
        }
    };
}

// ============================================================
// RENDER FUNCTIONS - v5.81: Use displayT1/displayT2/displayStrk for scorecard
// ============================================================

function renderAll() {
    console.log(`[DEBUG-RENDER] renderAll called, currentHole=${currentHole}, editableFlight=${editableFlight}, viewOtherFlight=${viewOtherFlight}`);
    
    renderCompactHeaderWithFlightToggle();
    
    var cache = GameLoader.getLocalCache();
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    var tr = GameLoader.getTRForHole(currentHole);
    
    GameUI.renderHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    
    var displayTeamA = (tr.teamA !== null && tr.teamA !== undefined) ? tr.teamA : "-";
    var displayTeamB = (tr.teamB !== null && tr.teamB !== undefined) ? tr.teamB : "-";
    var displayTeamAGreen = (tr.teamA !== null && tr.teamA !== undefined) ? tr.teamAGreen : false;
    var displayTeamBGreen = (tr.teamB !== null && tr.teamB !== undefined) ? tr.teamBGreen : false;
    
    GameUI.updateTR("trDisplay", displayTeamA, displayTeamB, displayTeamAGreen, displayTeamBGreen);
    
    var displayFlight = getCurrentDisplayFlight();
    var canEditLocal = isCurrentDisplayEditable();
    
    var currentPlayers = getFlightOrderedPlayers(displayFlight);
    
    var stillOwnsLock = true;
    if (!viewOtherFlight) {
        stillOwnsLock = checkLockOwnership();
        canEditLocal = canEditLocal && stillOwnsLock;
    }
    
    function getOpponentsForPlayer(player) {
        return GameMatch.getAllOpponents(allPlayers, player);
    }
    
    function getMatchValueForPlayer(player, opponent) {
        var results = cache.results;
        return GameMatch.getMatchValueFromStoredResults(results, player, opponent, currentHole, getHolePosition, allPlayers);
    }
    
    function getBubbleDisplayValue(player, opponent) {
        var matchValue = getMatchValueForPlayer(player, opponent);
        return GameMatch.getMatchDisplayValue(matchValue);
    }
    
    function getBubbleClass(player, opponent) {
        var matchValue = getMatchValueForPlayer(player, opponent);
        var clinchedAt = cache.clinchedAt || {};
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        var lastSyncedHole = cache.lastSyncedHole;
        
        var bubbleClass = GameMatch.getMatchBubbleClass(
            matchValue, clinchedAt, player, opponent, currentHole,
            isHoleSavedForFlight, lastSyncedHole, GameMatch.getClinchHole,
            startingHole
        );
        
        if (bubbleClass === 'bubble-loss-clinch' || bubbleClass === 'bubble-gold') {
            console.log(`[DEBUG-RENDER] ${player.label} vs ${opponent.label}: matchValue=${matchValue}, bubbleClass=${bubbleClass}, clinchedAt count=${Object.keys(clinchedAt).length}`);
        }
        
        return bubbleClass;
    }
    
    GameUI.renderPlayerCards("playerCards", currentPlayers, getOpponentsForPlayer, getBubbleClass, getBubbleDisplayValue, getCurrentScore, canEditLocal,
        function(playerName, flight, delta) {
            if (isGameCompleteFlag) return;
            if (takeoverDetected) return;
            if (!canEdit) return;
            if (viewOtherFlight) return;
            var player = allPlayers.find(p => p.name === playerName && p.flight === flight);
            if (!player) return;
            var current = getCurrentScore(player);
            var newScore = Math.max(1, Math.min(99, current + delta));
            localChanges[flight + "_" + currentHole + "_" + player.name] = newScore;
            renderAll();
        }
    );
    updatePlayerNamesToShortform();
    
    if (viewOtherFlight) {
        GameUI.updateFlightBadge(displayFlight);
        var badge = document.querySelector('.flight-badge');
        if (badge) {
            badge.style.borderColor = '#ffaa44';
            badge.style.color = '#ffaa44';
        }
    } else {
        GameUI.updateFlightBadge(editableFlight);
        var badge = document.querySelector('.flight-badge');
        if (badge) {
            badge.style.borderColor = '#4caf50';
            badge.style.color = '#4caf50';
        }
    }
    
    var holes = getDisplayHoles();
    window.savedHoles = cache.savedHoles;
    
    var t1ClinchedHole = cache.results?.game2?.flight1?.clinchedHole;
    var t2ClinchedHole = cache.results?.game2?.flight2?.clinchedHole;
    
    var t1Display = cache.results?.game2?.displayT1 || null;
    var t2Display = cache.results?.game2?.displayT2 || null;
    var strkDisplay = cache.results?.game3?.displayStrk || null;
    
    // v5.81: FIXED - Use displayT1/displayT2/displayStrk which have the correct values with numbers
    // These arrays contain values like "B2", "A5", "B7" instead of just "B", "A", "B"
    var displayT1Row = cache.results?.game2?.displayT1 || cache.t1Row;
    var displayT2Row = cache.results?.game2?.displayT2 || cache.t2Row;
    var displayStrkRow = cache.results?.game3?.displayStrk || cache.strkRow;
    
    console.log(`[DEBUG-RENDER] Using displayT1Row (first 3):`, displayT1Row ? displayT1Row.slice(0, 3) : 'null');
    console.log(`[DEBUG-RENDER] Using displayT2Row (first 3):`, displayT2Row ? displayT2Row.slice(0, 3) : 'null');
    console.log(`[DEBUG-RENDER] Using displayStrkRow (first 3):`, displayStrkRow ? displayStrkRow.slice(0, 3) : 'null');
    
    if (typeof GameScorecard !== 'undefined' && GameScorecard.renderScorecard) {
        GameScorecard.renderScorecard(
            "scorecardWrapper", holes, allPlayers, getStoredScore, isHoleSaved,
            displayT1Row, displayT2Row, displayStrkRow, coursePar, courseSi,
            t1ClinchedHole, t2ClinchedHole,
            t1Display, t2Display, strkDisplay
        );
    }
    
    var playOrder = getPlayOrder();
    var isCurrentSaved = false;
    if (!viewOtherFlight) {
        isCurrentSaved = isHoleSaved(editableFlight, currentHole) && Object.keys(localChanges).filter(function(key) { return key.startsWith(editableFlight + "_" + currentHole + "_"); }).length === 0;
    } else {
        isCurrentSaved = isHoleSaved(displayFlight, currentHole);
    }
    GameUI.updateNavigationButtons(currentHole, playOrder, isCurrentSaved, isGameCompleteFlag, celebrationTriggered, showSignCardModal);
    if (typeof Ticker !== 'undefined') Ticker.refresh();
    
    updateSaveButtonState();
}

// ============================================================
// v5.69: FIXED exitToMainMenu - unsubscribe from Firestore BEFORE showing modal
// ============================================================

async function exitToMainMenu() {
    if (firestoreUnsubscribe) {
        firestoreUnsubscribe();
        firestoreUnsubscribe = null;
        console.log("[EXIT] Firestore listener unsubscribed");
    }
    
    if (canEdit && !takeoverDetected && !viewOtherFlight) {
        var releasePayload = { ["locks.f" + editableFlight]: null, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        try { 
            await db.collection("scheduledGames").doc(gameId).update(releasePayload);
            console.log("[EXIT] Lock released for flight", editableFlight);
        } catch(e) {
            console.warn("[EXIT] Failed to release lock:", e);
        }
    }
    
    Modal.confirm(
        "Leave the game? Unsaved changes will be lost.",
        function() {
            console.log("[EXIT] User confirmed exit");
            GameLoader.unload();
            sessionStorage.removeItem("currentGame");
            localStorage.removeItem("userRole");
            window.location.href = "index.html";
        },
        function() {
            console.log("[EXIT] User cancelled exit - staying in game");
            setupRealtimeListener();
        }
    );
}

function onCacheUpdate(cache) {
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        document.getElementById("courseName").innerHTML = courseName;
    }
    allPlayers = cache.players;
    startingHole = cache.startingHole;
    if (typeof Ticker !== 'undefined' && allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
    if (cache.signatures.f1 && cache.signatures.f2 && !isGameCompleteFlag && !celebrationTriggered) {
        createHistoryRecord().then(function() { isGameCompleteFlag = true; showGameCompleteScreen(); renderAll(); }).catch(console.error);
    }
    renderAll();
}

function initializeGameData(collection, cache) {
    return new Promise(function(resolve) {
        var mockSession = { activeGame: { gameId: gameId, gameType: "real", gameMode: "real", collection: collection, role: editableFlight === 1 ? "update1" : "update2" } };
        GameData.loadGameFromSession(mockSession, function(success) {
            if (success) { GameData.setCourse({ par: cache.course?.par || [] }); GameData.setPlayers(cache.players || []); resolve(true); }
            else resolve(false);
        });
    });
}

async function init() {
    console.log("[DEBUG-INIT] Starting initialization");
    
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    var session = await new Promise(function(resolve) { SessionManager.initSession("real-game.html", "index.html", resolve); });
    var sessionRole = session.activeGame ? session.activeGame.role : null;
    editableFlight = (sessionRole === "update1") ? 1 : (sessionRole === "update2") ? 2 : 1;
    canEdit = (editableFlight === 1 || editableFlight === 2);
    gameId = session.activeGame ? session.activeGame.gameId : sessionStorage.getItem('currentGameId');
    if (!gameId) { document.getElementById("debug").innerHTML = "Error: No game ID"; return; }
    
    console.log(`[DEBUG-INIT] gameId=${gameId}, editableFlight=${editableFlight}`);
    console.log(`[DEBUG-INIT] Monitoring target hole: ${DEBUG_TARGET_HOLE}`);
    
    var collection = "scheduledGames";
    GameLoader.addDataCallback(onCacheUpdate);
    
    var pendingWrites = loadPendingWrites();
    if (pendingWrites) {
        console.log(`[CASCADE-DEBUG] Found pending writes from previous session, resuming...`);
        await new Promise(function(resolveLoad) {
            GameLoader.loadGame(gameId, collection, function(result) {
                if (result.success) {
                    if (result.cache.course) {
                        courseName = result.cache.course.name;
                        coursePar = result.cache.course.par;
                        courseSi = result.cache.course.si;
                    }
                    allPlayers = result.cache.players;
                    startingHole = result.cache.startingHole;
                }
                resolveLoad();
            });
        });
        
        await processPendingWrites();
    }
    
    var preloadData = getPreloadedRawGameData();
    var gameDataPreloaded = sessionStorage.getItem("gameDataPreloaded") === "true";
    
    if (preloadData && gameDataPreloaded) {
        applyPreloadedData(preloadData);
        sessionStorage.removeItem("gameDataPreloaded");
        GameUI.applyTightLayout();
        renderCompactHeaderWithFlightToggle();
        GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
        setTimeout(function() { GameUI.addFlightBadge(editableFlight); }, 100);
        GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
        var playOrder = getPlayOrder();
        for (var i = 0; i < playOrder.length; i++) { if (!isHoleSaved(editableFlight, playOrder[i])) { currentHole = playOrder[i]; break; } }
        updateHoleNumberDisplay();
        initTicker();
        if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
        renderAll();
        setSaveButtonIdle();
        GameLoader.loadGame(gameId, collection, async function(result) {
            if (result.success) {
                var cache = result.cache;
                if (cache.course) { courseName = cache.course.name; coursePar = cache.course.par; courseSi = cache.course.si; }
                allPlayers = cache.players;
                startingHole = cache.startingHole;
                renderAll();
            }
        });
        setupRealtimeListener();
    } else {
        GameLoader.loadGame(gameId, collection, async function(result) {
            if (!result.success) { document.getElementById("debug").innerHTML = "Error: " + result.error; return; }
            var cache = result.cache;
            courseName = cache.course?.name || "Unknown Course";
            coursePar = cache.course?.par || [];
            courseSi = cache.course?.si || [];
            allPlayers = cache.players || [];
            startingHole = cache.startingHole;
            teamGameFormat = cache.teamGameFormat || "tournament";
            document.getElementById("courseName").innerHTML = courseName;
            var initSuccess = await initializeGameData(collection, cache);
            if (!initSuccess) { document.getElementById("debug").innerHTML = "Error: Failed to initialize"; return; }
            GameUI.applyTightLayout();
            renderCompactHeaderWithFlightToggle();
            GameUI.setDisplayMode(GameUI.getDisplayMode(), null);
            setTimeout(function() { GameUI.addFlightBadge(editableFlight); }, 100);
            GameUI.renderBottomMenu("bottomMenuContainer", exitToMainMenu);
            var playOrder = getPlayOrder();
            for (var i = 0; i < playOrder.length; i++) { if (!isHoleSaved(editableFlight, playOrder[i])) { currentHole = playOrder[i]; break; } }
            updateHoleNumberDisplay();
            initTicker();
            if (allPlayers && allPlayers.length) Ticker.setPlayers(allPlayers);
            renderAll();
            setSaveButtonIdle();
            document.getElementById("mainContainer").classList.add("data-ready");
            setupRealtimeListener();
        });
    }
    GameUI.updateToggleButtons(GameUI.getDisplayMode());
}

init();
</script>
