<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }
        
        .status-bubble, #courseName, #holeHeader, #trDisplay, #playerCards, .scorecard-section, #bottomMenuContainer {
            visibility: hidden;
        }
        
        .data-ready .status-bubble,
        .data-ready #courseName,
        .data-ready #holeHeader,
        .data-ready #trDisplay,
        .data-ready #playerCards,
        .data-ready .scorecard-section,
        .data-ready #bottomMenuContainer {
            visibility: visible;
        }
        
        .ticker-container {
            visibility: visible;
            margin-top: 30px;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            cursor: pointer;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .debug { text-align: center; font-size: 0.6rem; color: #555; margin-top: 20px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        
        /* Modal styles (not in game-ui.js) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .takeover-modal-container {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 28px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid #ffaa44;
            z-index: 10002;
        }
        .takeover-modal-title { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #ffaa44; 
            margin-bottom: 16px; 
        }
        .takeover-modal-message { 
            font-size: 0.9rem; 
            color: #ccc; 
            margin-bottom: 8px; 
        }
        .takeover-modal-device {
            font-family: monospace;
            font-size: 0.8rem;
            color: #4caf50;
            margin: 12px 0;
            padding: 6px;
            background: #0a0a0a;
            border-radius: 12px;
        }
        .takeover-modal-buttons { 
            display: flex; 
            gap: 12px; 
            margin-top: 24px;
        }
        .takeover-btn-viewer {
            flex: 1;
            background: #1a3a1a;
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .takeover-btn-exit {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .sign-modal-container {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 28px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid #4caf50;
            z-index: 10002;
        }
        .sign-modal-title { font-size: 1.5rem; font-weight: 700; color: #4caf50; margin-bottom: 16px; }
        .sign-modal-message { font-size: 0.9rem; color: #ccc; margin-bottom: 24px; }
        .sign-modal-buttons { display: flex; gap: 12px; }
        .sign-btn-back {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .sign-btn-confirm {
            flex: 1;
            background: #1a3a1a;
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .waiting-modal-container {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid #4caf50;
        }
        .waiting-title { font-size: 1.3rem; font-weight: 700; color: #4caf50; margin-bottom: 20px; }
        .waiting-message { font-size: 0.95rem; color: #ffaa44; margin-bottom: 8px; }
        .waiting-submessage { font-size: 0.75rem; color: #888; }
        .waiting-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid #333;
            border-top-color: #4caf50;
            border-radius: 50%;
            margin: 24px auto 0;
            animation: spin 1s linear infinite;
        }
        
        .complete-modal-container {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid #4caf50;
        }
        .complete-title { font-size: 1.5rem; font-weight: 700; color: #4caf50; margin-bottom: 12px; }
        .complete-emojis { font-size: 1.2rem; margin-bottom: 20px; }
        .complete-message { font-size: 0.85rem; color: #ccc; margin-bottom: 28px; }
        .complete-btn {
            background: #ffaa44;
            color: #1a3a1a;
            border: none;
            width: 180px;
            height: 56px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="ticker-container" id="tickerContainer">
        <div class="ticker-content" id="tickerContent">&nbsp;</div>
    </div>
    
    <div class="status-bubble" id="statusBubble">LIVE</div>
    
    <div style="text-align:center; margin-bottom:8px;" id="courseName"></div>
    
    <div id="holeHeader"></div>
    
    <div id="flightTab" class="flight-tab"></div>
    <div id="trDisplay" class="team-score-card"></div>
    <div id="playerCards" class="player-cards"></div>
    
    <div class="scorecard-section">
        <div id="compactHeaderContainer"></div>
        <div class="scorecard-wrapper" id="scorecardWrapper"></div>
    </div>
    
    <div id="bottomMenuContainer"></div>
    
    <div class="debug" id="debug"></div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v6.25</div>

<script>
// ============================================================
// Apply user settings IMMEDIATELY before anything else
// ============================================================
if (typeof AppSettings !== 'undefined') {
    AppSettings.init();
} else {
    console.warn("[REAL-GAME] AppSettings not loaded, zoom may be enabled by default");
}

// ============================================================
// VERSION CACHE-BUSTING - v6.25: Universal script loader
// ============================================================
var APP_VERSION = "6.25";
var CACHE_KEY = "real_game_version_v625";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    
    // v6.25: Preserve ALL existing URL parameters
    var currentParams = new URLSearchParams(window.location.search);
    currentParams.set('v', APP_VERSION);
    var newUrl = window.location.pathname + "?" + currentParams.toString();
    
    console.log("[REAL-GAME] Cache-busting redirect. Preserving params:", currentParams.toString());
    window.location.href = newUrl;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.REAL_GAME_VERSION = "6.25";
console.log("[REAL-GAME] Initializing v6.25 - Universal script loader");
console.log("[REAL-GAME] =========================================");
console.log("[REAL-GAME] WRV loaded:", typeof WRV !== 'undefined');
console.log("[REAL-GAME] celebration-photo loaded:", typeof checkAndRenameCelebrationPhoto === 'function');
console.log("[REAL-GAME] =========================================");

// ============================================================
// The main entry point is now in js/real-game-main.js
// It will auto-start when the DOM is ready
// ============================================================

console.log("[REAL-GAME] Waiting for RealGameMain to initialize...");

// If for some reason the modules don't auto-start, this fallback will help
setTimeout(function() {
    if (typeof startGame !== 'function') {
        console.warn("[REAL-GAME] startGame not found - modules may not have loaded");
        document.getElementById("debug").innerHTML = "Loading... Please refresh if this persists.";
    }
}, 3000);
</script>

</body>
</html>
