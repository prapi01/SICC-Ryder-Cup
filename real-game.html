<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var editableFlight = 1;
var canEdit = true;
var startingHole = 1;
var currentHole = 1;
var teamGameFormat = "tournament";

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var flight1Data = {};
var flight2Data = {};
var localChanges = {};
var savedHoles = { 1: [], 2: [] };

var t1Row = Array(18).fill('_');
var t2Row = Array(18).fill('_');
var strkRow = Array(18).fill('0');
var trTeamA = 9.5;
var trTeamB = 9.5;
var trTeamAGreen = true;
var trTeamBGreen = true;
var lastSyncedHole = 0;

var flight1Cumulative = new Array(18).fill(0);
var flight2Cumulative = new Array(18).fill(0);

var matchResults = {
    intraF1: {},
    intraF2: {},
    cross: {}
};

var gameResults = null;

var myDeviceShortName = "";
var unsubscribe = null;
var f1DataString = "";
var f2DataString = "";

var submitted = { f1: false, f2: false };
var signatures = { f1: false, f2: false };
var isGameCompleteFlag = false;

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    var order = [];
    for (var i = startingHole; i <= 18; i++) order.push(i);
    for (var i = 1; i < startingHole; i++) order.push(i);
    return order;
}

function getDisplayHoles() {
    return GameUI.getDisplayHoles(startingHole, GameUI.getDisplayMode());
}

function getHolePosition(holeNumber) {
    var playOrder = getPlayOrder();
    for (var i = 0; i < playOrder.length; i++) {
        if (playOrder[i] === holeNumber) return i;
    }
    return holeNumber - 1;
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function updateSavedHolesList() {
    savedHoles[1] = [];
    savedHoles[2] = [];
    for (var h = 1; h <= 18; h++) {
        if (flight1Data[h] && flight1Data[h].saved) savedHoles[1].push(h);
        if (flight2Data[h] && flight2Data[h].saved) savedHoles[2].push(h);
    }
}

function calculateLastSyncedHole() {
    var playOrder = getPlayOrder();
    var lastSynced = 0;
    for (var i = 0; i < playOrder.length; i++) {
        var hole = playOrder[i];
        var f1Saved = flight1Data[hole] && flight1Data[hole].saved;
        var f2Saved = flight2Data[hole] && flight2Data[hole].saved;
        if (f1Saved && f2Saved) {
            lastSynced = hole;
        } else {
            break;
        }
    }
    return lastSynced;
}

// ============================================================
// Match Results using GameMatch
// ============================================================

function updateMatchResults() {
    lastSyncedHole = calculateLastSyncedHole();
    
    var flight1Players = allPlayers.filter(function(p) { return p.flight === 1; });
    var flight2Players = allPlayers.filter(function(p) { return p.flight === 2; });
    
    var flight1MaxHole = savedHoles[1].length > 0 ? Math.max.apply(null, savedHoles[1]) : 0;
    var flight2MaxHole = savedHoles[2].length > 0 ? Math.max.apply(null, savedHoles[2]) : 0;
    
    if (flight1MaxHole > 0) {
        matchResults.intraF1 = GameMatch.calculateIntraFlight(1, flight1Players, f1DataString, courseSi, startingHole, flight1MaxHole, coursePar);
    } else {
        matchResults.intraF1 = {};
    }
    
    if (flight2MaxHole > 0) {
        matchResults.intraF2 = GameMatch.calculateIntraFlight(2, flight2Players, f2DataString, courseSi, startingHole, flight2MaxHole, coursePar);
    } else {
        matchResults.intraF2 = {};
    }
    
    if (lastSyncedHole > 0) {
        matchResults.cross = GameMatch.calculateCrossFlight(f1DataString, f2DataString, allPlayers, courseSi, startingHole, lastSyncedHole, coursePar);
    } else {
        matchResults.cross = {};
    }
    
    updateTeamGame();
    updateStrokeGame();
}

// ============================================================
// Team Game using GameTeam
// ============================================================

function updateTeamGame() {
    try {
        var teamResults = GameTeam.calculate(allPlayers, f1DataString, f2DataString, courseSi, startingHole, teamGameFormat);
        t1Row = teamResults.t1Row;
        t2Row = teamResults.t2Row;
        flight1Cumulative = teamResults.flight1Cumulative;
        flight2Cumulative = teamResults.flight2Cumulative;
    } catch (e) {
        console.error("GameTeam calculation error:", e);
    }
}

// ============================================================
// Stroke Game using GameStroke
// ============================================================

function updateStrokeGame() {
    try {
        var strokeResults = GameStroke.calculate(allPlayers, f1DataString, f2DataString, courseSi, startingHole);
        for (var i = 0; i < strokeResults.length; i++) {
            strkRow[i] = strokeResults[i];
        }
    } catch (e) {
        console.error("GameStroke calculation error:", e);
    }
}

// ============================================================
// TR Calculation
// ============================================================

function calculateGame1Points() {
    if (lastSyncedHole === 0) {
        return { teamAPoints: 8, teamBPoints: 8 };
    }
    
    if (gameResults && gameResults.game1 && gameResults.computedUpToHole >= lastSyncedHole) {
        var pos = getHolePosition(lastSyncedHole);
        return {
            teamAPoints: gameResults.game1.pointsA[pos],
            teamBPoints: gameResults.game1.pointsB[pos]
        };
    }
    
    var teamAPoints = 0;
    var teamBPoints = 0;
    var matchCount = 0;
    
    for (var key in matchResults.cross) {
        if (key.indexOf("_vs_") !== -1 && matchCount < 16) {
            var firstPlayerName = key.split("_vs_")[0];
            var firstPlayer = allPlayers.find(function(p) { return p.name === firstPlayerName; });
            if (firstPlayer && firstPlayer.team === "A") {
                var value = matchResults.cross[key];
                if (value > 0) teamAPoints += 1;
                else if (value < 0) teamBPoints += 1;
                else { teamAPoints += 0.5; teamBPoints += 0.5; }
                matchCount++;
            }
        }
    }
    
    if (matchCount === 0) return { teamAPoints: 8, teamBPoints: 8 };
    return { teamAPoints: teamAPoints, teamBPoints: teamBPoints };
}

function getCurrentGame2Points() {
    if (lastSyncedHole === 0) return { teamAPoints: 1, teamBPoints: 1 };
    
    if (gameResults && gameResults.game2 && gameResults.computedUpToHole >= lastSyncedHole) {
        var pos = getHolePosition(lastSyncedHole);
        return {
            teamAPoints: gameResults.game2.pointsA[pos],
            teamBPoints: gameResults.game2.pointsB[pos]
        };
    }
    
    var flight1Total = flight1Cumulative[lastSyncedHole - 1] || 0;
    var flight2Total = flight2Cumulative[lastSyncedHole - 1] || 0;
    
    var flight1PointsA = (flight1Total > 0) ? 1 : (flight1Total < 0) ? 0 : 0.5;
    var flight1PointsB = (flight1Total > 0) ? 0 : (flight1Total < 0) ? 1 : 0.5;
    var flight2PointsA = (flight2Total > 0) ? 1 : (flight2Total < 0) ? 0 : 0.5;
    var flight2PointsB = (flight2Total > 0) ? 0 : (flight2Total < 0) ? 1 : 0.5;
    
    return {
        teamAPoints: flight1PointsA + flight2PointsA,
        teamBPoints: flight1PointsB + flight2PointsB
    };
}

function getCurrentGame3Points() {
    if (lastSyncedHole === 0 || lastSyncedHole > 18) return { teamAPoints: 0.5, teamBPoints: 0.5 };
    
    if (gameResults && gameResults.game3 && gameResults.computedUpToHole >= lastSyncedHole) {
        var pos = getHolePosition(lastSyncedHole);
        return {
            teamAPoints: gameResults.game3.pointsA[pos],
            teamBPoints: gameResults.game3.pointsB[pos]
        };
    }
    
    var currentLeader = strkRow[lastSyncedHole - 1] || '0';
    if (currentLeader === 'A') return { teamAPoints: 1, teamBPoints: 0 };
    if (currentLeader === 'B') return { teamAPoints: 0, teamBPoints: 1 };
    return { teamAPoints: 0.5, teamBPoints: 0.5 };
}

function calculateTR() {
    var game1Points = calculateGame1Points();
    var game2Points = getCurrentGame2Points();
    var game3Points = getCurrentGame3Points();
    
    trTeamA = game1Points.teamAPoints + game2Points.teamAPoints + game3Points.teamAPoints;
    trTeamB = game1Points.teamBPoints + game2Points.teamBPoints + game3Points.teamBPoints;
    
    if (trTeamA > trTeamB) {
        trTeamAGreen = true;
        trTeamBGreen = false;
    } else if (trTeamB > trTeamA) {
        trTeamAGreen = false;
        trTeamBGreen = true;
    } else {
        trTeamAGreen = true;
        trTeamBGreen = true;
    }
}

// ============================================================
// Results Calculation and Storage
// ============================================================

function initializeEmptyResults() {
    return {
        version: 1,
        game1: {
            matches: {},
            pointsA: new Array(18).fill(8),
            pointsB: new Array(18).fill(8)
        },
        game2: {
            flight1: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0) },
            flight2: { leader: new Array(18).fill("AS"), cumulativePoints: new Array(18).fill(0) },
            pointsA: new Array(18).fill(1),
            pointsB: new Array(18).fill(1)
        },
        game3: {
            leader: new Array(18).fill("AS"),
            nettA: new Array(18).fill(0),
            nettB: new Array(18).fill(0),
            pointsA: new Array(18).fill(0.5),
            pointsB: new Array(18).fill(0.5)
        },
        tr: {
            teamA: new Array(18).fill(9.5),
            teamB: new Array(18).fill(9.5),
            teamAGreen: new Array(18).fill(true),
            teamBGreen: new Array(18).fill(true)
        },
        computedUpToHole: 0,
        lastComputedAt: null
    };
}

function calculateHoleResults(holeNumber) {
    var position = getHolePosition(holeNumber);
    
    var f1Hole = flight1Data[holeNumber];
    var f2Hole = flight2Data[holeNumber];
    
    if (!f1Hole || !f1Hole.saved || !f2Hole || !f2Hole.saved) {
        return null;
    }
    
    var teamResults = GameTeam.calculate(allPlayers, f1DataString, f2DataString, courseSi, startingHole, teamGameFormat);
    var flight1Total = teamResults.flight1Cumulative[position];
    var flight2Total = teamResults.flight2Cumulative[position];
    
    var strokeResults = GameStroke.calculate(allPlayers, f1DataString, f2DataString, courseSi, startingHole);
    var strokeLeader = strokeResults[position];
    
    var tempMatchResults = GameMatch.calculateCrossFlight(f1DataString, f2DataString, allPlayers, courseSi, startingHole, holeNumber, coursePar);
    var game1PointsA = 0;
    var game1PointsB = 0;
    var matchCount = 0;
    
    for (var key in tempMatchResults) {
        if (key.indexOf("_vs_") !== -1 && matchCount < 16) {
            var firstPlayerName = key.split("_vs_")[0];
            var firstPlayer = allPlayers.find(function(p) { return p.name === firstPlayerName; });
            if (firstPlayer && firstPlayer.team === "A") {
                var value = tempMatchResults[key];
                if (value > 0) game1PointsA += 1;
                else if (value < 0) game1PointsB += 1;
                else { game1PointsA += 0.5; game1PointsB += 0.5; }
                matchCount++;
            }
        }
    }
    
    var flight1Leader = (flight1Total > 0) ? "A" : (flight1Total < 0) ? "B" : "AS";
    var flight2Leader = (flight2Total > 0) ? "A" : (flight2Total < 0) ? "B" : "AS";
    
    var flight1PointsA = (flight1Total > 0) ? 1 : (flight1Total < 0) ? 0 : 0.5;
    var flight1PointsB = (flight1Total > 0) ? 0 : (flight1Total < 0) ? 1 : 0.5;
    var flight2PointsA = (flight2Total > 0) ? 1 : (flight2Total < 0) ? 0 : 0.5;
    var flight2PointsB = (flight2Total > 0) ? 0 : (flight2Total < 0) ? 1 : 0.5;
    var game2PointsA = flight1PointsA + flight2PointsA;
    var game2PointsB = flight1PointsB + flight2PointsB;
    
    var game3PointsA = (strokeLeader === "A") ? 1 : (strokeLeader === "B") ? 0 : 0.5;
    var game3PointsB = (strokeLeader === "A") ? 0 : (strokeLeader === "B") ? 1 : 0.5;
    
    var trA = game1PointsA + game2PointsA + game3PointsA;
    var trB = game1PointsB + game2PointsB + game3PointsB;
    var trAGreen = (trA > trB);
    var trBGreen = (trB > trA);
    
    return {
        position: position,
        game1PointsA: game1PointsA,
        game1PointsB: game1PointsB,
        game2Flight1Total: flight1Total,
        game2Flight2Total: flight2Total,
        game2Flight1Leader: flight1Leader,
        game2Flight2Leader: flight2Leader,
        game2PointsA: game2PointsA,
        game2PointsB: game2PointsB,
        game3Leader: (strokeLeader === "A") ? "A" : (strokeLeader === "B") ? "B" : "AS",
        game3PointsA: game3PointsA,
        game3PointsB: game3PointsB,
        trA: trA,
        trB: trB,
        trAGreen: trAGreen,
        trBGreen: trBGreen
    };
}

async function saveResultsToFirestore(holeNumber) {

    updatePayload["results.game2.flight1.leader." + position] = resultsData.game2Flight1Leader;
    updatePayload["results.game2.flight2.leader." + position] = resultsData.game2Flight2Leader;
    updatePayload["results.game2.flight1.cumulativePoints." + position] = resultsData.game2Flight1Total;
    updatePayload["results.game2.flight2.cumulativePoints." + position] = resultsData.game2Flight2Total;
    updatePayload["results.game2.pointsA." + position] = resultsData.game2PointsA;
    updatePayload["results.game2.pointsB." + position] = resultsData.game2PointsB;
    updatePayload["results.game3.leader." + position] = resultsData.game3Leader;
    updatePayload["results.game3.pointsA." + position] = resultsData.game3PointsA;
    updatePayload["results.game3.pointsB." + position] = resultsData.game3PointsB;
    updatePayload["results.tr.teamA." + position] = resultsData.trA;
    updatePayload["results.tr.teamB." + position] = resultsData.trB;
    updatePayload["results.tr.teamAGreen." + position] = resultsData.trAGreen;
    updatePayload["results.tr.teamBGreen." + position] = resultsData.trBGreen;
    
    if (position + 1 > (gameResults?.computedUpToHole || 0)) {
        updatePayload["results.computedUpToHole"] = position + 1;
    }
    updatePayload["results.lastComputedAt"] = new Date().toISOString();
    
    try {
        await db.collection("scheduledGames").doc(gameId).update(updatePayload);
        console.log('Results saved for hole', holeNumber, 'position', position);
        
        if (!gameResults) {
            gameResults = initializeEmptyResults();
        }
        gameResults.game1.pointsA[position] = resultsData.game1PointsA;
        gameResults.game1.pointsB[position] = resultsData.game1PointsB;
        gameResults.game2.flight1.leader[position] = resultsData.game2Flight1Leader;
        gameResults.game2.flight2.leader[position] = resultsData.game2Flight2Leader;
        gameResults.game2.flight1.cumulativePoints[position] = resultsData.game2Flight1Total;
        gameResults.game2.flight2.cumulativePoints[position] = resultsData.game2Flight2Total;
        gameResults.game2.pointsA[position] = resultsData.game2PointsA;
        gameResults.game2.pointsB[position] = resultsData.game2PointsB;
        gameResults.game3.leader[position] = resultsData.game3Leader;
        gameResults.game3.pointsA[position] = resultsData.game3PointsA;
        gameResults.game3.pointsB[position] = resultsData.game3PointsB;
        gameResults.tr.teamA[position] = resultsData.trA;
        gameResults.tr.teamB[position] = resultsData.trB;
        gameResults.tr.teamAGreen[position] = resultsData.trAGreen;
        gameResults.tr.teamBGreen[position] = resultsData.trBGreen;
        if (position + 1 > gameResults.computedUpToHole) {
            gameResults.computedUpToHole = position + 1;
        }
        gameResults.lastComputedAt = updatePayload["results.lastComputedAt"];
        
    } catch (error) {
        console.error('Error saving results:', error);
    }
}

function buildMatchResultsForHandicap() {
    // Convert cross match results to format needed for performance adjustment
    // For each player, calculate total points from their 4 matches
    var playerPoints = {};
    
    for (var key in matchResults.cross) {
        if (key.indexOf("_vs_") !== -1) {
            var parts = key.split("_vs_");
            var playerA = parts[0];
            var playerB = parts[1];
            var value = matchResults.cross[key];
            
            // For player A perspective
            if (!playerPoints[playerA]) playerPoints[playerA] = { total: 0 };
            if (value > 0) playerPoints[playerA].total += 1;
            else if (value === 0) playerPoints[playerA].total += 0.5;
            
            // For player B perspective (inverse)
            if (!playerPoints[playerB]) playerPoints[playerB] = { total: 0 };
            if (value < 0) playerPoints[playerB].total += 1;
            else if (value === 0) playerPoints[playerB].total += 0.5;
        }
    }
    
    return playerPoints;
}

function buildHoleResultsForHandicap() {
    // For anchor adjustment, we need net scores per hole for each player vs anchor
    // This will be populated when anchor is selected
    var holeResults = {};

        holeResults[hole] = {};

        // We'll compute this dynamically when anchor is known
    }
    
    return holeResults;
}

function getStoredScore(player, hole) {
    var flightDataStr = player.flight === 1 ? f1DataString : f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    return savedHoles[flight] && savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    var key = player.flight + "_" + currentHole + "_" + player.name;
    if (localChanges[key] !== undefined) return localChanges[key];
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

function getBubbleClass(player, opponent) {
    var matchValue = getMatchValue(player.name, opponent.name);
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = savedHoles[player.flight] && savedHoles[player.flight].indexOf(currentHole) !== -1;
        if (!isHoleSavedForFlight) return 'bubble-grey';
        if (matchValue > 0) return 'bubble-green';
        if (matchValue < 0) return 'bubble-red';
        return 'bubble-green';
    }
    
    var isSynced = (lastSyncedHole >= currentHole);
    if (!isSynced) return 'bubble-grey';
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = getMatchValue(player.name, opponent.name);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

function getMatchValue(playerName, opponentName) {
    var intraKey = playerName + "_vs_" + opponentName;
    if (matchResults.intraF1[intraKey] !== undefined) return matchResults.intraF1[intraKey];
    if (matchResults.intraF2[intraKey] !== undefined) return matchResults.intraF2[intraKey];
    if (matchResults.cross[intraKey] !== undefined) return matchResults.cross[intraKey];
    return 0;
}

        function(playerName, flight, delta) {

                    break;
                }

            if (newScore > 99) newScore = 99;
            var key = flight + "_" + currentHole + "_" + player.name;
            localChanges[key] = newScore;
            renderAll();
        }
    );
    
    var holes = getDisplayHoles();

        "scorecardWrapper",
        holes,
        allPlayers,
        getStoredScore,
        isHoleSaved,
        t1Row,

        nextBtn.disabled = true;

        nextBtn.classList.remove("btn-next");

            nextBtn.classList.add("btn-next-inactive");
            nextBtn.classList.remove("btn-next");
        }
    }
}

async function saveHole() {
    if (!canEdit) return;
    if (isGameCompleteFlag || submitted["f" + editableFlight]) {
        alert("Card already submitted. Cannot make changes.");
        return;
    }
    
    var flight = editableFlight;
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    var a1Score = getStoredScore(teamA[0], currentHole);
    var a2Score = getStoredScore(teamA[1], currentHole);
    var b1Score = getStoredScore(teamB[0], currentHole);
    var b2Score = getStoredScore(teamB[1], currentHole);
    
    for (var key in localChanges) {
        if (key.startsWith(flight + "_" + currentHole + "_")) {
            var playerName = key.split('_')[2];
            if (teamA[0] && teamA[0].name === playerName) a1Score = localChanges[key];
            if (teamA[1] && teamA[1].name === playerName) a2Score = localChanges[key];
            if (teamB[0] && teamB[0].name === playerName) b1Score = localChanges[key];
            if (teamB[1] && teamB[1].name === playerName) b2Score = localChanges[key];
        }
    }
    
    var scores = { a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score };
    
    try {
        await GameData.saveCurrentHole(currentHole, scores, coursePar, function(success) {
            if (success) {
                for (var key in localChanges) {
                    if (key.startsWith(flight + "_" + currentHole + "_")) {
                        delete localChanges[key];
                    }
                }
                document.getElementById("debug").innerHTML = "Saved!";
                setTimeout(function() {
                    if (document.getElementById("debug").innerHTML === "Saved!") {
                        document.getElementById("debug").innerHTML = "";
                    }
                }, 2000);
                
                saveResultsToFirestore(currentHole);
                updateNextButton();
            } else {
                document.getElementById("debug").innerHTML = "Save failed";
            }
        });
    } catch (error) {
        document.getElementById("debug").innerHTML = "Save error: " + error.message;
    }
}

function updateFlightDataString(oldString, holeNumber, scores) {
    var storagePos;
    if (startingHole === 1) {
        storagePos = holeNumber - 1;
    } else {
        var playOrder = getPlayOrder();
        storagePos = playOrder.indexOf(holeNumber);
    }
    
    var a1Str = scores.a1.toString().padStart(2, '0');
    var a2Str = scores.a2.toString().padStart(2, '0');
    var b1Str = scores.b1.toString().padStart(2, '0');
    var b2Str = scores.b2.toString().padStart(2, '0');
    var newSegment = "T" + a1Str + a2Str + b1Str + b2Str;
    var startIdx = storagePos * 9;
    return oldString.substring(0, startIdx) + newSegment + oldString.substring(startIdx + 9);
}

// ============================================================
// Navigation
// ============================================================

function nextHole() {
    var isLast = CardSubmit.isLastHole(currentHole, startingHole);
    var isSaved = isHoleSaved(editableFlight, currentHole);
    
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    
    var isCurrentSaved = isSaved && !hasUnsavedChanges;
    
    if (isLast && isCurrentSaved) {
        return;
    }
    
    if (!isCurrentSaved) {
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var nextIndex = (currentIndex + 1) % 18;
    currentHole = playOrder[nextIndex];
    updateMatchResults();
    calculateTR();
    renderAll();
}

function prevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var prevIndex = (currentIndex - 1 + 18) % 18;
    currentHole = playOrder[prevIndex];
    updateMatchResults();
    calculateTR();
    renderAll();
}

// ============================================================
// Refresh from Firestore Snapshot
// ============================================================

function refreshFromFirestore(data) {
    f1DataString = data.f1 && data.f1.d ? data.f1.d : f1DataString;
    f2DataString = data.f2 && data.f2.d ? data.f2.d : f2DataString;
    
    if (data.results) {
        gameResults = data.results;
    }
    
    if (data.submitted) {
        submitted.f1 = data.submitted.f1 === true;
        submitted.f2 = data.submitted.f2 === true;
    }
    
    if (data.signatures) {
        signatures.f1 = data.signatures.f1?.signed === true;
        signatures.f2 = data.signatures.f2?.signed === true;
    }
    
    isGameCompleteFlag = CardSubmit.isGameComplete(submitted);
    
    if (signatures.f1 && signatures.f2 && !isGameCompleteFlag) {
        isGameCompleteFlag = true;
        showCelebrationAndHandicap();
        return;
    }
    
    var newF1 = {};
    var newF2 = {};
    for (var h = 1; h <= 18; h++) {
        var f1Hole = GameData.parseHoleData(f1DataString, h);
        var f2Hole = GameData.parseHoleData(f2DataString, h);
        if (f1Hole) newF1[h] = f1Hole;
        if (f2Hole) newF2[h] = f2Hole;
    }
    
    var changed = false;
    
    if (JSON.stringify(newF1) !== JSON.stringify(flight1Data)) {
        flight1Data = newF1;
        changed = true;
        for (var key in localChanges) {
            if (key.startsWith("1_")) delete localChanges[key];
        }
    }
    if (JSON.stringify(newF2) !== JSON.stringify(flight2Data)) {
        flight2Data = newF2;
        changed = true;
        for (var key in localChanges) {
            if (key.startsWith("2_")) delete localChanges[key];
        }
    }
    
    if (changed) {
        updateSavedHolesList();
        updateMatchResults();
        calculateTR();
        renderAll();
    }
}

        }
        
        db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
            if (!doc.exists) {
                document.getElementById("debug").innerHTML = "Error: Game not found";
                return;
            }
            
            var data = doc.data();
            courseName = data.course ? data.course.name : "Unknown Course";
            document.getElementById("courseName").innerHTML = courseName;
            coursePar = data.course ? data.course.par : [];
            courseSi = data.course ? data.course.si : [];
            allPlayers = data.players || [];
            startingHole = data.startingHole || 1;
            teamGameFormat = data.teamGameFormat || "tournament";
            
            if (data.results) {
                gameResults = data.results;
            } else {
                gameResults = initializeEmptyResults();
            }
            
            if (data.signatures) {
                signatures.f1 = data.signatures.f1?.signed === true;
                signatures.f2 = data.signatures.f2?.signed === true;
            }
            
            GameData.setCourse({ par: coursePar });
            GameData.setPlayers(allPlayers);
            
            var flight1 = GameData.getFlightData(1);
            var flight2 = GameData.getFlightData(2);
            f1DataString = flight1.data;
            f2DataString = flight2.data;
            
            if (data.f1 && data.f1.d && data.f1.d !== f1DataString) {
                f1DataString = data.f1.d;
            }
            if (data.f2 && data.f2.d && data.f2.d !== f2DataString) {
                f2DataString = data.f2.d;
            }
            
            if (data.submitted) {
                submitted.f1 = data.submitted.f1 === true;
                submitted.f2 = data.submitted.f2 === true;
            }
            isGameCompleteFlag = CardSubmit.isGameComplete(submitted);
            
            for (var h = 1; h <= 18; h++) {
                var f1Hole = GameData.parseHoleData(f1DataString, h);
                var f2Hole = GameData.parseHoleData(f2DataString, h);
                if (f1Hole) flight1Data[h] = f1Hole;
                if (f2Hole) flight2Data[h] = f2Hole;
            }
            
            var playOrder = getPlayOrder();
            currentHole = playOrder[0];
            
            updateSavedHolesList();
            updateMatchResults();
            calculateTR();
            
            GameUI.updateToggleButtons(GameUI.getDisplayMode());
            renderAll();
            
            document.getElementById("playOrderBtn").addEventListener("click", function() {
                setDisplayMode("play");
            });
            document.getElementById("naturalOrderBtn").addEventListener("click", function() {
                setDisplayMode("natural");
            });
            
            document.getElementById("nextBtn").addEventListener("click", function() {
                var isLast = CardSubmit.isLastHole(currentHole, startingHole);
                var isSaved = isHoleSaved(editableFlight, currentHole);
                
                var hasUnsavedChanges = false;
                for (var key in localChanges) {
                    if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
                        hasUnsavedChanges = true;
                        break;
                    }
                }
                
                var isCurrentSaved = isSaved && !hasUnsavedChanges;
                
                if (isLast && isCurrentSaved) {
                    showSignCardModal();
                } else if (!isLast) {
                    nextHole();
                }
            });
            
            unsubscribe = db.collection("scheduledGames").doc(gameId).onSnapshot(function(snapshot) {
                if (snapshot.exists) {
                    refreshFromFirestore(snapshot.data());
                }
            }, function(error) {
                document.getElementById("debug").innerHTML = "Sync error: " + error.message;
            });
        });
    });
}

// ============================================================
// Event Listeners
// ============================================================

document.getElementById("saveBtn").addEventListener("click", saveHole);
document.getElementById("backBtn").addEventListener("click", prevHole);
document.getElementById("menuBtn").addEventListener("click", exitToMainMenu);

init();
</script>

</body>
