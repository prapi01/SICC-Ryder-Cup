<script>
// ============================================================
// Firebase Config
// ============================================================

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

if (!firebase.apps.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
}
var db = firebase.firestore();

// ============================================================
// Game State
// ============================================================

var gameId = null;
var editableFlight = 1;
var canEdit = true;
var currentHole = 1;
var localChanges = {};
var startingHole = 1;

var courseName = "";
var coursePar = [];
var courseSi = [];
var allPlayers = [];

var currentArchiveId = null;
var isGameCompleteFlag = false;
var celebrationTriggered = false;
var pendingArchiveCreated = false;

// Save button state
var saveBtn = null;
var saveInProgress = false;

// Modal references
var activeWaitModal = null;
var activeCompleteModal = null;

// ============================================================
// Save Button State Management
// ============================================================

function setSaveButtonIdle() {
    if (!saveBtn) return;
    saveBtn.classList.remove('btn-save-pending', 'btn-save-retry');
    saveBtn.classList.add('btn-save');
    saveBtn.innerHTML = '💾 SAVE';
    saveBtn.disabled = false;
    saveInProgress = false;
}

function setSaveButtonPending() {
    if (!saveBtn) return;
    saveBtn.classList.remove('btn-save', 'btn-save-retry');
    saveBtn.classList.add('btn-save-pending');
    saveBtn.innerHTML = '⏳ SAVING...';
    saveBtn.disabled = true;
    saveInProgress = true;
}

function setSaveButtonRetry() {
    if (!saveBtn) return;
    saveBtn.classList.remove('btn-save', 'btn-save-pending');
    saveBtn.classList.add('btn-save-retry');
    saveBtn.innerHTML = '⚠️ RETRY';
    saveBtn.disabled = false;
    saveInProgress = false;
}

function flashSaveButtonSuccess() {
    if (!saveBtn) return;
    saveBtn.classList.add('btn-save-flash');
    setTimeout(function() {
        saveBtn.classList.remove('btn-save-flash');
    }, 500);
}

// ============================================================
// Helper Functions
// ============================================================

function getPlayOrder() {
    return GameLoader.getPlayOrder(startingHole);
}

function getDisplayHoles() {
    return GameUI.getDisplayHoles(startingHole, GameUI.getDisplayMode());
}

function getHolePosition(holeNumber) {
    return GameLoader.getHolePosition(holeNumber, startingHole);
}

function getFlightOrderedPlayers(flight) {
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    return teamA.concat(teamB);
}

function getStoredScore(player, hole) {
    var cache = GameLoader.getLocalCache();
    var flightDataStr = player.flight === 1 ? cache.f1DataString : cache.f2DataString;
    var holeData = GameData.parseHoleData(flightDataStr, hole);
    if (!holeData || !holeData.saved) return coursePar[hole - 1];
    
    var flightPlayers = allPlayers.filter(function(p) { return p.flight === player.flight; });
    var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
    
    if (player.team === 'A') {
        if (teamA[0] && teamA[0].name === player.name) return holeData.scores.a1;
        if (teamA[1] && teamA[1].name === player.name) return holeData.scores.a2;
    } else {
        if (teamB[0] && teamB[0].name === player.name) return holeData.scores.b1;
        if (teamB[1] && teamB[1].name === player.name) return holeData.scores.b2;
    }
    return coursePar[hole - 1];
}

function isHoleSaved(flight, hole) {
    var cache = GameLoader.getLocalCache();
    return cache.savedHoles[flight] && cache.savedHoles[flight].indexOf(hole) !== -1;
}

function getCurrentScore(player) {
    var key = player.flight + "_" + currentHole + "_" + player.name;
    if (localChanges[key] !== undefined) return localChanges[key];
    return getStoredScore(player, currentHole);
}

function getAllOpponents(player) {
    var opponents = allPlayers.filter(function(op) { return op.team !== player.team; });
    opponents.sort(function(a, b) {
        var aIsIntra = (a.flight === player.flight);
        var bIsIntra = (b.flight === player.flight);
        if (aIsIntra && !bIsIntra) return -1;
        if (!aIsIntra && bIsIntra) return 1;
        return 0;
    });
    return opponents;
}

function getBubbleClass(player, opponent) {
    var matchValue = GameLoader.getMatchValue(player.name, opponent.name);
    var cache = GameLoader.getLocalCache();
    var lastSyncedHole = cache.lastSyncedHole;
    
    if (player.flight === opponent.flight) {
        var isHoleSavedForFlight = isHoleSaved(player.flight, currentHole);
        if (!isHoleSavedForFlight) return 'bubble-grey';
        if (matchValue > 0) return 'bubble-green';
        if (matchValue < 0) return 'bubble-red';
        return 'bubble-green';
    }
    
    var isSynced = (lastSyncedHole >= currentHole);
    if (!isSynced) return 'bubble-grey';
    if (matchValue > 0) return 'bubble-green';
    if (matchValue < 0) return 'bubble-red';
    return 'bubble-green';
}

function getBubbleValue(player, opponent) {
    var matchValue = GameLoader.getMatchValue(player.name, opponent.name);
    var absValue = Math.abs(matchValue);
    if (absValue === 0) return 'AS';
    return absValue.toString();
}

// ============================================================
// TR Display
// ============================================================

function updateTRDisplay() {
    var tr = GameLoader.getTRForHole(currentHole);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
}

// ============================================================
// Save Functions
// ============================================================

function performSave() {
    return new Promise(function(resolve, reject) {
        var flight = editableFlight;
        var flightPlayers = allPlayers.filter(function(p) { return p.flight === flight; });
        var teamA = flightPlayers.filter(function(p) { return p.team === 'A'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        var teamB = flightPlayers.filter(function(p) { return p.team === 'B'; }).sort(function(a, b) { return a.handicap - b.handicap; });
        
        var a1Score = getStoredScore(teamA[0], currentHole);
        var a2Score = getStoredScore(teamA[1], currentHole);
        var b1Score = getStoredScore(teamB[0], currentHole);
        var b2Score = getStoredScore(teamB[1], currentHole);
        
        for (var key in localChanges) {
            if (key.startsWith(flight + "_" + currentHole + "_")) {
                var playerName = key.split('_')[2];
                if (teamA[0] && teamA[0].name === playerName) a1Score = localChanges[key];
                if (teamA[1] && teamA[1].name === playerName) a2Score = localChanges[key];
                if (teamB[0] && teamB[0].name === playerName) b1Score = localChanges[key];
                if (teamB[1] && teamB[1].name === playerName) b2Score = localChanges[key];
            }
        }
        
        var scores = { a1: a1Score, a2: a2Score, b1: b1Score, b2: b2Score };
        
        GameData.saveCurrentHole(currentHole, scores, coursePar, function(success) {
            if (success) {
                // Clear local changes for this hole
                for (var key in localChanges) {
                    if (key.startsWith(flight + "_" + currentHole + "_")) {
                        delete localChanges[key];
                    }
                }
                resolve(true);
            } else {
                reject(new Error("Save failed"));
            }
        });
    });
}

async function saveHole() {
    if (saveInProgress) return;
    if (!canEdit) return;
    if (isGameCompleteFlag) {
        alert("Game already complete. Cannot make changes.");
        return;
    }
    
    setSaveButtonPending();
    
    try {
        await performSave();
        flashSaveButtonSuccess();
        setSaveButtonIdle();
        document.getElementById("debug").innerHTML = "Saved!";
        setTimeout(function() {
            if (document.getElementById("debug").innerHTML === "Saved!") {
                document.getElementById("debug").innerHTML = "";
            }
        }, 2000);
        updateNavButtons();
        renderAll();
    } catch (error) {
        console.error("Save error:", error);
        setSaveButtonRetry();
        document.getElementById("debug").innerHTML = "Save failed. Click RETRY.";
    }
}

function retrySave() {
    if (saveInProgress) return;
    saveHole();
}

// ============================================================
// Navigation
// ============================================================

function nextHole() {
    if (isGameCompleteFlag && !celebrationTriggered) {
        showCelebrationAndHandicap();
        return;
    }
    
    var isLast = CardSubmit.isLastHole(currentHole, startingHole);
    var isSaved = isHoleSaved(editableFlight, currentHole);
    
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    
    var isCurrentSaved = isSaved && !hasUnsavedChanges;
    
    if (isLast && isCurrentSaved) {
        showSignCardModal();
        return;
    }
    
    if (!isCurrentSaved) {
        return;
    }
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    var nextIndex = (currentIndex + 1) % 18;
    currentHole = playOrder[nextIndex];
    
    renderAll();
}

function prevHole() {
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    
    if (currentIndex <= 0) return;
    
    var prevIndex = currentIndex - 1;
    currentHole = playOrder[prevIndex];
    
    renderAll();
}

function updateNavButtons() {
    var backBtn = document.getElementById("backBtn");
    var nextBtn = document.getElementById("nextBtn");
    if (!backBtn || !nextBtn) return;
    
    var playOrder = getPlayOrder();
    var currentIndex = playOrder.indexOf(currentHole);
    backBtn.disabled = (currentIndex === 0);
    
    var isLast = CardSubmit.isLastHole(currentHole, startingHole);
    var isSaved = isHoleSaved(editableFlight, currentHole);
    
    var hasUnsavedChanges = false;
    for (var key in localChanges) {
        if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
            hasUnsavedChanges = true;
            break;
        }
    }
    
    var isCurrentSaved = isSaved && !hasUnsavedChanges;
    
    if (isGameCompleteFlag && !celebrationTriggered) {
        nextBtn.textContent = "🏆 SEE RESULTS";
        nextBtn.disabled = false;
        nextBtn.classList.add("btn-game-complete");
        nextBtn.classList.remove("btn-next", "btn-next-inactive");
        return;
    }
    
    nextBtn.classList.remove("btn-game-complete");
    
    if (isLast) {
        if (isCurrentSaved) {
            nextBtn.textContent = "✍️ SIGN CARD";
            nextBtn.disabled = false;
            nextBtn.classList.add("btn-next");
            nextBtn.classList.remove("btn-next-inactive");
        } else {
            nextBtn.textContent = "✍️ SIGN CARD";
            nextBtn.disabled = true;
            nextBtn.classList.add("btn-next-inactive");
            nextBtn.classList.remove("btn-next");
        }
    } else {
        nextBtn.textContent = "Next →";
        if (isCurrentSaved) {
            nextBtn.disabled = false;
            nextBtn.classList.add("btn-next");
            nextBtn.classList.remove("btn-next-inactive");
        } else {
            nextBtn.disabled = true;
            nextBtn.classList.add("btn-next-inactive");
            nextBtn.classList.remove("btn-next");
        }
    }
}

function showSignCardModal() {
    var modalHtml = `
        <div class="modal-overlay" id="signModalNew">
            <div class="sign-modal-container">
                <div class="sign-modal-title">✍️ SIGN SCORECARD</div>
                <div class="sign-modal-message">Confirm that all scores are correct before signing.</div>
                <div class="sign-modal-buttons">
                    <button class="sign-btn-back" id="signBackBtnNew">← BACK</button>
                    <button class="sign-btn-confirm" id="signConfirmBtnNew">✓ SIGN CARD</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("signBackBtnNew").addEventListener("click", function() {
        document.getElementById("signModalNew").remove();
    });
    
    document.getElementById("signConfirmBtnNew").addEventListener("click", async function() {
        document.getElementById("signModalNew").remove();
        
        var collection = "scheduledGames";
        var success = await SignCard.submitSignature(gameId, editableFlight, null, collection);
        
        if (success) {
            var cache = GameLoader.getLocalCache();
            if (editableFlight === 1) cache.signatures.f1 = true;
            else cache.signatures.f2 = true;
            
            if (SignCard.isGameCompleted(cache.signatures)) {
                createPendingArchiveRecord(function(err, archiveId) {
                    if (err) console.error("Failed to create archive record:", err);
                    isGameCompleteFlag = true;
                    celebrationTriggered = false;
                    showGameCompleteScreen();
                    renderAll();
                });
            } else {
                showWaitingScreen();
            }
        } else {
            alert("Error signing card. Please try again.");
        }
    });
}

function createPendingArchiveRecord(callback) {
    if (pendingArchiveCreated) {
        if (callback) callback(null, currentArchiveId);
        return;
    }
    
    var cache = GameLoader.getLocalCache();
    var tr = GameLoader.getTRForHole(currentHole);
    
    db.collection("scheduledGames").doc(gameId).get()
        .then(function(doc) {
            if (!doc.exists) throw new Error("Game not found");
            var gameDataSnapshot = doc.data();
            
            var finalScores = { teamA: tr.teamA, teamB: tr.teamB };
            var signaturesData = {
                f1: { signed: cache.signatures.f1, signedAt: null, captainName: null },
                f2: { signed: cache.signatures.f2, signedAt: null, captainName: null }
            };
            
            var archiveResults = {
                version: cache.results?.version || 1,
                game1: { pointsA: cache.results?.game1?.pointsA || new Array(18).fill(8), pointsB: cache.results?.game1?.pointsB || new Array(18).fill(8) },
                game2: {
                    flight1: { leader: cache.results?.game2?.flight1?.leader || new Array(18).fill("AS"), cumulativePoints: cache.results?.game2?.flight1?.cumulativePoints || new Array(18).fill(0) },
                    flight2: { leader: cache.results?.game2?.flight2?.leader || new Array(18).fill("AS"), cumulativePoints: cache.results?.game2?.flight2?.cumulativePoints || new Array(18).fill(0) }
                },
                game3: { leader: cache.results?.game3?.leader || new Array(18).fill("AS"), nettA: new Array(18).fill(0), nettB: new Array(18).fill(0) },
                tr: { teamA: cache.results?.tr?.teamA || new Array(18).fill(9.5), teamB: cache.results?.tr?.teamB || new Array(18).fill(9.5), teamAGreen: new Array(18).fill(true), teamBGreen: new Array(18).fill(true) },
                computedUpToHole: cache.results?.computedUpToHole || 0
            };
            
            HistoryRecord.createPendingRecord(gameId, gameDataSnapshot, archiveResults, finalScores, signaturesData, function(err, archiveId) {
                if (err) console.error("Error creating archive record:", err);
                else {
                    currentArchiveId = archiveId;
                    pendingArchiveCreated = true;
                }
                if (callback) callback(err, archiveId);
            });
        })
        .catch(function(err) {
            console.error("Error loading game data for archive:", err);
            if (callback) callback(err, null);
        });
}

function buildMatchResultsForHandicap() {
    var cache = GameLoader.getLocalCache();
    var playerPoints = {};
    
    for (var key in cache.matchResults.cross) {
        if (key.indexOf("_vs_") !== -1) {
            var parts = key.split("_vs_");
            var playerA = parts[0];
            var playerB = parts[1];
            var value = cache.matchResults.cross[key];
            
            if (!playerPoints[playerA]) playerPoints[playerA] = { total: 0 };
            if (value > 0) playerPoints[playerA].total += 1;
            else if (value === 0) playerPoints[playerA].total += 0.5;
            
            if (!playerPoints[playerB]) playerPoints[playerB] = { total: 0 };
            if (value < 0) playerPoints[playerB].total += 1;
            else if (value === 0) playerPoints[playerB].total += 0.5;
        }
    }
    
    return playerPoints;
}

function showCelebrationAndHandicap() {
    if (celebrationTriggered) return;
    celebrationTriggered = true;
    
    var tr = GameLoader.getTRForHole(currentHole);
    var winner = SignCard.getWinner(tr.teamA, tr.teamB);
    var winningPlayers = {
        teamA: allPlayers.filter(function(p) { return p.team === "A"; }),
        teamB: allPlayers.filter(function(p) { return p.team === "B"; })
    };
    
    var matchPoints = buildMatchResultsForHandicap();
    
    window.replayCelebration = function() {
        SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() {});
    };
    
    SignCard.showCelebrationScreen(winner, tr.teamA, tr.teamB, winningPlayers, gameId, function() {
        if (currentArchiveId) {
            HandicapAdjustment.init(gameId, currentArchiveId, winningPlayers, matchPoints, {});
        } else {
            createPendingArchiveRecord(function(err, archiveId) {
                if (err) window.location.href = "index.html";
                else HandicapAdjustment.init(gameId, archiveId, winningPlayers, matchPoints, {});
            });
        }
    });
}

function renderAll() {
    var cache = GameLoader.getLocalCache();
    var currentPar = coursePar[currentHole - 1];
    var currentSi = courseSi[currentHole - 1];
    var tr = GameLoader.getTRForHole(currentHole);
    
    GameUI.updateHoleHeader("holeHeader", currentHole, currentPar, currentSi);
    GameUI.updateFlightTab("flightTab", editableFlight, canEdit && !isGameCompleteFlag);
    GameUI.updateTR("trDisplay", tr.teamA, tr.teamB, tr.teamAGreen, tr.teamBGreen);
    
    var currentPlayers = getFlightOrderedPlayers(editableFlight);
    
    GameUI.renderPlayerCards(
        "playerCards",
        currentPlayers,
        getAllOpponents,
        getBubbleClass,
        getBubbleValue,
        getCurrentScore,
        canEdit && !isGameCompleteFlag,
        function(playerName, flight, delta) {
            if (isGameCompleteFlag) return;
            var player = null;
            for (var i = 0; i < allPlayers.length; i++) {
                if (allPlayers[i].name === playerName && allPlayers[i].flight === flight) {
                    player = allPlayers[i];
                    break;
                }
            }
            if (!player) return;
            var current = getCurrentScore(player);
            var newScore = current + delta;
            if (newScore < 1) newScore = 1;
            if (newScore > 99) newScore = 99;
            var key = flight + "_" + currentHole + "_" + player.name;
            localChanges[key] = newScore;
            renderAll();
        }
    );
    
    var holes = getDisplayHoles();
    window.savedHoles = cache.savedHoles;
    GameUI.renderScorecard(
        "scorecardWrapper",
        holes,
        allPlayers,
        getStoredScore,
        isHoleSaved,
        cache.t1Row,
        cache.t2Row,
        cache.strkRow,
        coursePar,
        courseSi
    );
    
    updateNavButtons();
}

async function exitToMainMenu() {
    if (!confirm("Leave the game? Your current unsaved changes will be lost.")) {
        return;
    }
    
    var releasePayload = {};
    if (canEdit) {
        releasePayload["locks.f" + editableFlight] = null;
        releasePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        try {
            await db.collection("scheduledGames").doc(gameId).update(releasePayload);
        } catch (error) {
            console.error("Error releasing lock:", error);
        }
    }
    
    GameLoader.unload();
    sessionStorage.removeItem("currentGame");
    localStorage.removeItem("userRole");
    window.location.href = "index.html";
}

function onCacheUpdate(cache) {
    // Update local variables from cache
    if (cache.course) {
        courseName = cache.course.name;
        coursePar = cache.course.par;
        courseSi = cache.course.si;
        document.getElementById("courseName").innerHTML = courseName;
    }
    allPlayers = cache.players;
    startingHole = cache.startingHole;
    
    // Update UI
    renderAll();
}

// ============================================================
// Initialize GameData from Loader
// ============================================================

function initializeGameData(collection, cache) {
    return new Promise(function(resolve) {
        var mockSession = {
            activeGame: {
                gameId: gameId,
                gameType: "real",
                gameMode: "real",
                collection: collection,
                role: editableFlight === 1 ? "update1" : "update2"
            }
        };
        
        GameData.loadGameFromSession(mockSession, function(success) {
            if (success) {
                GameData.setCourse({ par: cache.course?.par || [] });
                GameData.setPlayers(cache.players || []);
                console.log("GameData initialized successfully");
                resolve(true);
            } else {
                console.error("GameData initialization failed");
                resolve(false);
            }
        });
    });
}

// ============================================================
// Initialization
// ============================================================

async function init() {
    var myDeviceShortName = await SessionManager.getShortNameOnly();
    document.getElementById("deviceTag").innerHTML = "🖥️ " + myDeviceShortName;
    
    saveBtn = document.getElementById("saveBtn");
    
    var session = await new Promise(function(resolve) {
        SessionManager.initSession("real-game.html", "index.html", resolve);
    });
    
    var sessionRole = session.activeGame ? session.activeGame.role : null;
    if (sessionRole === "update1") editableFlight = 1;
    else if (sessionRole === "update2") editableFlight = 2;
    else editableFlight = 1;
    canEdit = (editableFlight === 1 || editableFlight === 2);
    
    gameId = session.activeGame ? session.activeGame.gameId : null;
    if (!gameId) gameId = sessionStorage.getItem('currentGameId');
    
    if (!gameId) {
        document.getElementById("debug").innerHTML = "Error: No game ID";
        return;
    }
    
    var collection = "scheduledGames";
    if (session.activeGame && session.activeGame.collection === "previewSandboxes") {
        collection = "previewSandboxes";
    }
    
    GameLoader.addDataCallback(onCacheUpdate);
    
    GameLoader.loadGame(gameId, collection, async function(result) {
        if (!result.success) {
            document.getElementById("debug").innerHTML = "Error: " + result.error;
            return;
        }
        
        var cache = result.cache;
        courseName = cache.course?.name || "Unknown Course";
        coursePar = cache.course?.par || [];
        courseSi = cache.course?.si || [];
        allPlayers = cache.players || [];
        startingHole = cache.startingHole;
        
        document.getElementById("courseName").innerHTML = courseName;
        
        // Initialize GameData properly
        var initSuccess = await initializeGameData(collection, cache);
        if (!initSuccess) {
            document.getElementById("debug").innerHTML = "Error: Failed to initialize game data";
            return;
        }
        
        // Set current hole to first unsaved hole for this flight
        var playOrder = getPlayOrder();
        for (var i = 0; i < playOrder.length; i++) {
            var hole = playOrder[i];
            if (!isHoleSaved(editableFlight, hole)) {
                currentHole = hole;
                break;
            }
        }
        
        renderAll();
        setSaveButtonIdle();
        
        // Set up event listeners
        document.getElementById("playOrderBtn").addEventListener("click", function() {
            GameUI.setDisplayMode("play", function() { renderAll(); });
        });
        document.getElementById("naturalOrderBtn").addEventListener("click", function() {
            GameUI.setDisplayMode("natural", function() { renderAll(); });
        });
        document.getElementById("saveBtn").addEventListener("click", function() {
            if (saveBtn.classList.contains('btn-save-retry')) {
                retrySave();
            } else {
                saveHole();
            }
        });
        document.getElementById("backBtn").addEventListener("click", prevHole);
        document.getElementById("menuBtn").addEventListener("click", exitToMainMenu);
        
        document.getElementById("nextBtn").addEventListener("click", function() {
            if (isGameCompleteFlag && !celebrationTriggered) {
                showCelebrationAndHandicap();
                return;
            }
            
            var isLast = CardSubmit.isLastHole(currentHole, startingHole);
            var isSaved = isHoleSaved(editableFlight, currentHole);
            
            var hasUnsavedChanges = false;
            for (var key in localChanges) {
                if (key.startsWith(editableFlight + "_" + currentHole + "_")) {
                    hasUnsavedChanges = true;
                    break;
                }
            }
            
            var isCurrentSaved = isSaved && !hasUnsavedChanges;
            
            if (isLast && isCurrentSaved) showSignCardModal();
            else if (!isLast) nextHole();
        });
    });
    
    // Initialize UI display mode
    GameUI.updateToggleButtons(GameUI.getDisplayMode());
}

init();
