<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Practice Mode - SICC Ryder Cup</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(145deg, #0a1a0a 0%, #000000 100%);
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; 
            color: #ffffff; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 550px; margin: 0 auto; }
        
        .version-tag { 
            position: fixed; 
            top: 8px; 
            right: 8px; 
            font-size: 0.65rem; 
            color: #ffaa44; 
            background: rgba(0,0,0,0.6); 
            padding: 2px 10px; 
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.8;
        }
        
        .device-tag {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 0.55rem;
            color: #ffaa44;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        .title { font-size: 1.8rem; font-weight: 800; color: #ffaa44; }
        .subtitle { font-size: 0.8rem; color: #888; margin-top: 4px; }
        
        .card { background: #111; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #ffaa44; border-left: 2px solid #ffaa44; padding-left: 10px; }
        
        .game-list { margin-top: 8px; }
        .game-item { 
            background: #0a0a0a; 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 12px; 
            border: 1px solid #333;
            transition: all 0.2s ease;
        }
        .game-item:hover { border-color: #ffaa44; }
        .game-id { font-size: 0.8rem; color: #ffaa44; font-family: monospace; font-weight: bold; margin-bottom: 8px; }
        .game-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .game-course { font-size: 1rem; font-weight: 600; color: #fff; }
        .game-time { font-size: 0.8rem; color: #888; }
        .game-players { font-size: 0.75rem; color: #666; margin-top: 4px; }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-join {
            flex: 3;
            background: #1a3a1a;
            border: 1px solid #ffaa44;
            border-radius: 30px;
            padding: 8px 20px;
            color: #ffaa44;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-delete {
            flex: 1;
            background: #3a1a1a;
            border: 1px solid #ff6b6b;
            border-radius: 30px;
            padding: 8px 12px;
            color: #ff6b6b;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;
        }
        .btn-join:active, .btn-delete:active { transform: scale(0.97); }
        
        .empty-msg { text-align: center; padding: 40px; color: #888; }
        
        .new-game-btn {
            background: linear-gradient(145deg, #2a2a1a 0%, #1a1a0a 100%);
            border: 2px solid #ffaa44;
            border-radius: 60px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .new-game-btn:active { transform: scale(0.98); }
        .new-game-btn .icon { font-size: 1.5rem; display: block; margin-bottom: 8px; }
        .new-game-btn .label { font-size: 1.2rem; font-weight: 700; color: #ffaa44; }
        .new-game-btn .desc { font-size: 0.7rem; color: #888; margin-top: 4px; }
        
        .back-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-btn:active { transform: scale(0.98); background: #2a2a2a; }
        .back-btn .label { font-size: 0.9rem; font-weight: 600; color: #ccc; }
        
        .footer { text-align: center; margin-top: 20px; font-size: 0.6rem; color: #444; }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading">Loading practice games...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v1.06</div>

<script>
    var VERSION = "1.06";
    var CACHE_KEY = "practice_mode_version";
    
    var storedVersion = localStorage.getItem(CACHE_KEY);
    if (storedVersion !== VERSION) {
        localStorage.setItem(CACHE_KEY, VERSION);
        window.location.href = window.location.pathname + "?v=" + VERSION;
    }
    
    var FIREBASE_CONFIG = {
        apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
        authDomain: "sicc-ryder-cup.firebaseapp.com",
        projectId: "sicc-ryder-cup",
        storageBucket: "sicc-ryder-cup.firebasestorage.app",
        messagingSenderId: "137641493845",
        appId: "1:137641493845:web:32399940bce639b01ddbdc"
    };
    
    var db = null;
    var firestoreReady = false;
    var deviceSession = null;
    
    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        firestoreReady = true;
        console.log("Firebase ready - v" + VERSION);
    } catch(e) { 
        console.warn(e);
    }
    
    var SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
    
    function displayDeviceId() {
        var deviceDisplay = SessionManager.getDeviceIdDisplay();
        document.getElementById("deviceTag").innerHTML = deviceDisplay;
    }
    
    function formatTime(timestamp) {
        var date = new Date(timestamp);
        var hours = date.getHours().toString().padStart(2, '0');
        var minutes = date.getMinutes().toString().padStart(2, '0');
        return hours + ':' + minutes;
    }
    
    function formatDate(timestamp) {
        var date = new Date(timestamp);
        var day = date.getDate();
        var month = date.getMonth() + 1;
        return day + '/' + month;
    }
    
    function deleteOldGames(games) {
        var now = Date.now();
        var deleted = false;
        for (var i = 0; i < games.length; i++) {
            var game = games[i];
            if (game.lastActive && (now - game.lastActive) > SEVEN_DAYS) {
                db.collection("practiceGames").doc(game.id).delete();
                deleted = true;
            }
        }
        if (deleted) loadAndRender();
    }
    
    function joinGame(gameId, displayId, courseName) {
        SessionManager.updateSession({
            activeGame: {
                gameId: gameId,
                gameType: "practice",
                gameMode: "practice",
                role: null,
                collection: "practiceGames"
            },
            returnDestination: "practice-mode.html"
        });
        SessionManager.addNavigationHistory("pre-game.html", "join_practice_game", { gameId: gameId, displayId: displayId });
        
        sessionStorage.removeItem("currentGameId");
        sessionStorage.setItem("practiceGameId", gameId);
        window.location.href = "pre-game.html";
    }
    
    function deleteGame(gameId, displayId) {
        if (confirm("Delete practice game " + displayId + "? This action cannot be undone.")) {
            db.collection("practiceGames").doc(gameId).delete().then(function() {
                loadAndRender();
            }).catch(function(e) {
                alert("Error deleting game: " + e.message);
            });
        }
    }
    
    function startNewGame() {
        SessionManager.addNavigationHistory("practice-setup.html", "new_practice_game");
        window.location.href = "practice-setup.html?mode=new";
    }
    
    function goBack() {
        // Back to Landing Page (Main Menu)
        window.location.href = "index.html";
    }
    
    function loadAndRender() {
        if (!firestoreReady) {
            document.getElementById("app").innerHTML = '<div class="loading">Connecting to server...</div>';
            return;
        }
        
        db.collection("practiceGames").orderBy("lastActive", "desc").get().then(function(snapshot) {
            var games = [];
            snapshot.forEach(function(doc) {
                var data = doc.data();
                games.push({ 
                    id: doc.id, 
                    displayId: data.displayId || data.gameId,
                    course: data.course,
                    players: data.players,
                    createdAt: data.createdAt,
                    lastActive: data.lastActive,
                    status: data.status
                });
            });
            
            deleteOldGames(games);
            var activeGames = games.filter(function(g) { return g.status === "active"; });
            
            var gamesHtml = '';
            if (activeGames.length === 0) {
                gamesHtml = '<div class="empty-msg">No active practice games.<br>Start a new one below!</div>';
            } else {
                for (var i = 0; i < activeGames.length; i++) {
                    var game = activeGames[i];
                    var courseName = game.course ? game.course.name : "Unknown Course";
                    var playerCount = game.players ? game.players.length : 0;
                    var timeStr = formatTime(game.createdAt);
                    var dateStr = formatDate(game.createdAt);
                    
                    gamesHtml += `
                        <div class="game-item">
                            <div class="game-id">🆔 ${escapeHtml(game.displayId)}</div>
                            <div class="game-info">
                                <div class="game-course">⛳ ${escapeHtml(courseName)}</div>
                                <div class="game-time">🕐 Started: ${dateStr} at ${timeStr}</div>
                            </div>
                            <div class="game-players">👥 ${playerCount} players configured</div>
                            <div class="action-buttons">
                                <button class="btn-join" onclick="joinGame('${game.id}', '${escapeHtml(game.displayId)}', '${escapeHtml(courseName)}')">🔗 JOIN THIS GAME</button>
                                <button class="btn-delete" onclick="deleteGame('${game.id}', '${escapeHtml(game.displayId)}')">🗑️</button>
                            </div>
                        </div>
                    `;
                }
            }
            
            var html = `
                <div class="header">
                    <div class="title">🧪 PRACTICE MODE</div>
                    <div class="subtitle">Test the app with real-time sync - No impact on real games</div>
                </div>
                
                <div class="card">
                    <div class="card-title">🎮 ACTIVE PRACTICE GAMES</div>
                    <div class="game-list">
                        ${gamesHtml}
                    </div>
                </div>
                
                <div class="new-game-btn" onclick="startNewGame()">
                    <div class="icon">🆕</div>
                    <div class="label">START NEW PRACTICE GAME</div>
                    <div class="desc">Create a new practice session with your own settings</div>
                </div>
                
                <div class="back-btn" onclick="goBack()">
                    <div class="label">← Back to Main Menu</div>
                </div>
                
                <div class="footer">Practice games auto-delete after 7 days of inactivity</div>
            `;
            
            document.getElementById("app").innerHTML = html;
        }).catch(function(e) {
            console.warn(e);
            document.getElementById("app").innerHTML = '<div class="loading">Error loading practice games. Please refresh.</div>';
        });
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            return m;
        });
    }
    
    SessionManager.initSession("practice-mode.html", "practice-mode.html", function(session) {
        console.log("Session initialized:", session);
        deviceSession = session;
        displayDeviceId();
        loadAndRender();
    });
</script>
</body>
</html>
