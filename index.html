    <style>

            font-family: system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;

        .ngb .icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
        .ngb .title { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; background: none; -webkit-background-clip: unset; color: #4caf50; }
        .ngb .subtitle-text { font-size: 1rem; font-weight: 500; color: #ccc; margin-bottom: 4px; }
        .ngb .date { font-size: 0.9rem; font-weight: 400; color: #aaa; }
        .ngb .course-name { font-size: 0.85rem; font-weight: 400; color: #888; margin-top: 8px; }

        .menu-buttons {

        }
        
        .menu-btn {
            background: linear-gradient(145deg, #1a1a1a, #111);
            border: 1px solid #4caf50;
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.02);
            border-color: #4caf50;
        }
        .menu-btn .label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }
        
        .gsb {
            background: rgba(17,17,17,0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 60px;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 220px;
            margin: 0 auto;
            backdrop-filter: blur(4px);
        }
        .gsb:active { transform: scale(0.98); background: rgba(26,26,26,0.9); }
        .gsb .icon { font-size: 1rem; margin-right: 8px; display: inline-block; vertical-align: middle; }
        .gsb .label { font-size: 0.85rem; font-weight: 600; color: #ccc; display: inline-block; vertical-align: middle; }
        
        .footer {
            text-align: center;

        .modal-overlay {

            display: flex;

            justify-content: center;
            z-index: 2000;
        }
        .modal {
            background: #111;
            border-radius: 24px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            border: 1px solid #ffaa44;
            text-align: center;
        }
        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffaa44;
            margin-bottom: 16px;
        }
        .modal-message {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }
        .modal-time {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 24px;
            font-family: monospace;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        .modal-btn-new {
            background: #3a1a1a;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        .modal-btn-continue {
            background: #1a3a1a;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .loading { text-align: center; padding: 40px; color: #888; }

<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v2.23</div>

<script>
// FILE: index.html - VERSION 2.23
// FIXED: VIEW PREVIOUS GAMES - green border (same as NGB)
// FIXED: GAME SETTINGS - smaller button, faint grey border (restored)

var APP_VERSION = "2.23";
var CACHE_KEY = "index_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + APP_VERSION);
} catch(e) { 
    console.warn(e);
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function formatDisplayDate(dateString) {
    if (!dateString) return "";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function findNextGame(scheduledGames) {
    var today = getTodayString();
    
    var futureGames = scheduledGames.filter(function(game) {
        return game.date >= today;
    });
    
    if (futureGames.length === 0) return null;
    
    futureGames.sort(function(a, b) {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return 0;
    });
    
    return futureGames[0];
}

function getGameStatus(gameDateStr) {
    var today = getTodayString();
    if (gameDateStr === today) return "today";
    if (gameDateStr > today) return "future";
    return "past";
}

function checkExistingPreviewData(gameId) {
    return db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            var f1HasData = data.f1 && data.f1.d && data.f1.d.indexOf('T') !== -1;
            var f2HasData = data.f2 && data.f2.d && data.f2.d.indexOf('T') !== -1;
            var hasLocks = data.locks && (data.locks.f1 !== null || data.locks.f2 !== null);
            return f1HasData || f2HasData || hasLocks;
        }
        return false;
    }).catch(function() { return false; });
}

function showResumeModal(gameId, gameDate, callback) {
    var modalHtml = `
        <div class="modal-overlay" id="resumeModal">
            <div class="modal">
                <div class="modal-title">⚠️ Existing Game Data Found</div>
                <div class="modal-message">This game already has saved scores.</div>
                <div class="modal-time">📅 ${formatDisplayDate(gameDate)}</div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-continue" id="resumeContinueBtn">Continue</button>
                    <button class="modal-btn modal-btn-new" id="resumeResetBtn">Reset (Start Over)</button>
                    <button class="modal-btn" id="resumeCancelBtn" style="background:#333; color:#fff;">Cancel</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("resumeContinueBtn").addEventListener('click', function() {
        document.getElementById("resumeModal").remove();
        callback("continue");
    });
    
    document.getElementById("resumeResetBtn").addEventListener('click', function() {
        document.getElementById("resumeModal").remove();
        callback("reset");
    });
    
    document.getElementById("resumeCancelBtn").addEventListener('click', function() {
        document.getElementById("resumeModal").remove();
        callback("cancel");
    });
}

function resetGameData(gameId) {
    return db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (!doc.exists) return false;
        var gameData = doc.data();
        var startingHole = gameData.startingHole || 1;
        
        function generateDefaultDataNatural(parArray) {
            var result = "";
            for (var h = 0; h < 18; h++) {
                var par = parArray[h];
                var parStr = par.toString().padStart(2, '0');
                result += "F" + parStr + parStr + parStr + parStr;
            }
            return result;
        }
        
        function rotateDataString(naturalData, startHole) {
            if (startHole === 1) return naturalData;
            var blocks = [];
            for (var i = 0; i < 18; i++) {
                blocks.push(naturalData.substr(i * 9, 9));
            }
            var rotated = [];
            for (var i = startHole - 1; i < 18; i++) rotated.push(blocks[i]);
            for (var i = 0; i < startHole - 1; i++) rotated.push(blocks[i]);
            return rotated.join('');
        }
        
        var naturalData = generateDefaultDataNatural(gameData.course.par);
        var rotatedData = rotateDataString(naturalData, startingHole);
        
        var resetData = {
            "f1.d": rotatedData,
            "f1.se": false,
            "f1.x": false,
            "f2.d": rotatedData,
            "f2.se": false,
            "f2.x": false,
            "locks.f1": null,
            "locks.f2": null,
            "currentHoleF1": 1,
            "currentHoleF2": 1,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        return db.collection("scheduledGames").doc(gameId).update(resetData).then(function() {
            return true;
        });
    });
}

function proceedToGame(gameId, gameType, targetPage) {
    var gameMode = (gameType === "preview") ? "preview" : "real";
    
    SessionManager.addNavigationHistory(targetPage, "click_ngb", { gameId: gameId, gameType: gameType });
    SessionManager.updateSession({
        returnDestination: "index.html",
        activeGame: {
            gameId: gameId,
            gameType: gameType,
            gameMode: gameMode,
            role: null,
            collection: "scheduledGames"
        }
    });
    sessionStorage.setItem("currentGameId", gameId);
    window.location.href = targetPage;
}

function handleNGB(targetPage) {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var nextGame = findNextGame(games);
        if (!nextGame) {
            alert("No scheduled game found. Please set up a game first.");
            return;
        }
        
        var gameId = nextGame.id;
        var gameDate = nextGame.date;
        var gameStatus = getGameStatus(gameDate);
        
        if (gameStatus === "today") {
            proceedToGame(gameId, "real", targetPage);
        } else if (gameStatus === "future") {
            checkExistingPreviewData(gameId).then(function(hasData) {
                if (hasData) {
                    showResumeModal(gameId, gameDate, function(action) {
                        if (action === "continue") {
                            proceedToGame(gameId, "preview", targetPage);
                        } else if (action === "reset") {
                            resetGameData(gameId).then(function() {
                                proceedToGame(gameId, "preview", targetPage);
                            });
                        }
                    });
                } else {
                    proceedToGame(gameId, "preview", targetPage);
                }
            });
        } else {
            proceedToGame(gameId, "preview", targetPage);
        }
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function goToPreviousGames() {
    SessionManager.addNavigationHistory("history.html", "previous_games");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "history.html";
}

function goToAdmin() {
    SessionManager.addNavigationHistory("admin.html", "game_settings");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "admin.html";
}

function loadAndRender() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Connecting to server...</div>';
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course, startingHole: doc.data().startingHole });
        });
        
        var nextGame = findNextGame(games);
        
        var ngbHtml = '';
        if (nextGame) {
            var status = getGameStatus(nextGame.date);
            var formattedDate = formatDisplayDate(nextGame.date);
            var courseName = nextGame.course ? nextGame.course.name : "Unknown Course";
            
            if (status === "today") {
                ngbHtml = `
                    <div class="ngb" onclick="handleNGB('pre-game.html')">
                        <div class="icon">⛳</div>
                        <div class="title">TODAY GAME</div>
                        <div class="course-name">${escapeHtml(courseName)}</div>
                    </div>
                `;
            } else {
                ngbHtml = `
                    <div class="ngb" onclick="handleNGB('pre-game.html')">
                        <div class="icon">🔍</div>
                        <div class="title">PREVIEW</div>
                        <div class="subtitle-text">NEXT GAME</div>
                        <div class="date">${formattedDate}</div>
                        <div class="course-name">${escapeHtml(courseName)}</div>
                    </div>
                `;
            }
        } else {
            ngbHtml = `
                <div class="ngb" style="opacity:0.7; cursor:default;">
                    <div class="icon">🏌️</div>
                    <div class="title">NO GAME</div>
                    <div class="no-game">No scheduled games found</div>
                </div>
            `;
        }
        
        var html = `
            <div class="header">
                <div class="golf-icon">⛳</div>
                <div class="title">SICC RYDER CUP</div>
                <div class="subtitle">Match Play · Team Game · Net Stroke</div>
            </div>
            
            ${ngbHtml}
            
            <div class="menu-buttons">
                <div class="menu-btn" id="previousGamesBtn">
                    <span class="label">📋 VIEW PREVIOUS GAMES</span>
                </div>
            </div>
            
            <div class="gsb" id="adminBtn">
                <span class="icon">⚙️</span>
                <span class="label">GAME SETTINGS</span>
            </div>
            
            <div class="footer">SICC Ryder Cup App v${APP_VERSION}<br>© 2026 Singapore Island Country Club</div>
        `;
        
        document.getElementById("app").innerHTML = html;
        
        document.getElementById("previousGamesBtn").addEventListener("click", goToPreviousGames);
        document.getElementById("adminBtn").addEventListener("click", goToAdmin);
        
    }).catch(function(e) {
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading games. Please refresh.</div>';
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("index.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    displayDeviceId();
    loadAndRender();
});
</script>
</body>
</html>
