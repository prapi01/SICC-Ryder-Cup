    <script>
        // Dynamically set button widths based on title width
        function setButtonWidths() {
            var title = document.querySelector('.title');
            var ngb = document.querySelector('.ngb');
            var menuBtns = document.querySelectorAll('.menu-btn');
            var gsb = document.querySelector('.gsb');
            
            if (!title || !ngb) return;
            
            var titleWidth = title.offsetWidth;
            var buttonWidth = Math.floor(titleWidth * 1.05);
            
            ngb.style.width = buttonWidth + 'px';
            ngb.style.height = buttonWidth + 'px';
            
            menuBtns.forEach(function(btn) {
                btn.style.width = buttonWidth + 'px';
            });
            
            if (gsb) {
                gsb.style.width = buttonWidth + 'px';
            }
        }
        
        // Run after page loads and after any resize
        window.addEventListener('load', setButtonWidths);
        window.addEventListener('resize', setButtonWidths);
    </script>

<script>
// FILE: index.html - VERSION 3.22

var APP_VERSION = "3.22";
var CACHE_KEY = "index_version";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

// Firebase is already initialized in firebase-config.js
var db = firebase.firestore();

var firestoreReady = true;
var currentSession = null;

// Preload tracking
var preloadComplete = false;
var preloadInProgress = false;
var pendingGameId = null;

// Get splash elements
var splashOverlay = document.getElementById('splashOverlay');
var splashGolfIcon = document.getElementById('splashGolfIcon');
var splashTitle = document.getElementById('splashTitle');
var splashSubtitle = document.getElementById('splashSubtitle');

// ============================================================
// Splash Screen Logic - FIXED v3.22: Once per session
// ============================================================

function shouldShowSplash() {
    // Check if splash has been shown in this session
    var splashShownThisSession = sessionStorage.getItem('splashShown');
    
    if (splashShownThisSession === 'true') {
        console.log("Splash already shown this session - skipping");
        return false;
    }
    
    console.log("No splash recorded this session - showing splash");
    return true;
}

function recordSplashShown() {
    sessionStorage.setItem('splashShown', 'true');
    console.log("Splash recorded as shown for this session");
}

function hideSplashAndShowApp() {
    splashOverlay.style.opacity = '0';
    setTimeout(function() {
        splashOverlay.remove();
        var container = document.querySelector('.container');
        if (container) {
            container.style.display = 'block';
        }
        initApp();
    }, 800);
}

if (shouldShowSplash()) {
    recordSplashShown();
    
    setTimeout(function() {
        splashGolfIcon.style.transition = 'transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
        splashGolfIcon.style.transform = 'translateY(0) rotate(360deg)';
    }, 100);
    
    setTimeout(function() {
        splashTitle.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
        splashTitle.style.opacity = '1';
        splashTitle.style.transform = 'translateY(0)';
    }, 400);
    
    setTimeout(function() {
        splashSubtitle.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
        splashSubtitle.style.opacity = '1';
        splashSubtitle.style.transform = 'translateY(0)';
    }, 600);
    
    setTimeout(function() {
        var thumpRing = document.createElement('div');
        thumpRing.style.cssText = `
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-left: -25px;
            margin-top: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(76,175,80,0.5) 0%, transparent 70%);
            transform: scale(0);
            pointer-events: none;
            z-index: 10001;
        `;
        splashOverlay.appendChild(thumpRing);
        thumpRing.style.animation = 'splashThumpRing 0.4s ease-out forwards';
    }, 700);
    
    setTimeout(function() {
        splashOverlay.style.animation = 'splashShake 0.3s ease-in-out';
    }, 700);
    
    if (navigator.vibrate) {
        setTimeout(function() {
            navigator.vibrate(50);
        }, 700);
    }
    
    setTimeout(hideSplashAndShowApp, 2800);
} else {
    splashOverlay.style.display = 'none';
    var container = document.querySelector('.container');
    if (container) {
        container.style.display = 'block';
    }
    initApp();
}

function initApp() {
    displayDeviceId();
    loadAndRender();
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function formatDisplayDate(dateString) {
    if (!dateString) return "";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function startBackgroundPreload(gameId, onComplete) {
    var existing = getPreloadedRawGameData();
    if (existing && existing.gameId === gameId) {
        console.log("Preload: Data already cached for game", gameId);
        preloadComplete = true;
        if (onComplete) onComplete(true);
        return;
    }
    
    if (preloadInProgress) {
        console.log("Preload already in progress");
        return;
    }
    
    if (!db || !gameId) {
        console.log("Preload: No db or gameId");
        if (onComplete) onComplete(false);
        return;
    }
    
    console.log("Preload: Starting for game", gameId);
    preloadInProgress = true;
    pendingGameId = gameId;
    
    db.collection("scheduledGames").doc(gameId).get()
        .then(function(doc) {
            if (doc.exists) {
                var preloadData = {
                    gameId: gameId,
                    rawData: doc.data(),
                    preloadTimestamp: Date.now()
                };
                sessionStorage.setItem("preloadedRawGameData", JSON.stringify(preloadData));
                preloadComplete = true;
                console.log("Preload: Complete for game", gameId);
                if (onComplete) onComplete(true);
            } else {
                console.log("Preload: Game not found", gameId);
                if (onComplete) onComplete(false);
            }
            preloadInProgress = false;
        })
        .catch(function(err) {
            console.warn("Preload: Failed", err);
            preloadInProgress = false;
            if (onComplete) onComplete(false);
        });
}

function findNextGame(scheduledGames) {
    var today = getTodayString();
    
    var futureGames = scheduledGames.filter(function(game) {
        return game.date >= today;
    });
    
    if (futureGames.length === 0) return null;
    
    futureGames.sort(function(a, b) {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return 0;
    });
    
    return futureGames[0];
}

function getGameStatus(gameDateStr) {
    var today = getTodayString();
    if (gameDateStr === today) return "today";
    if (gameDateStr > today) return "future";
    return "past";
}

// SIMPLIFIED v3.21: TODAY GAME button active for entire day
function handleTodayGame() {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    if (!preloadComplete) {
        alert("Still loading game data. Please wait a moment.");
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var todayGame = null;
        var todayStr = getTodayString();
        for (var i = 0; i < games.length; i++) {
            if (games[i].date === todayStr) {
                todayGame = games[i];
                break;
            }
        }
        
        if (!todayGame) {
            alert("No game scheduled for today. Please set up a game first.");
            return;
        }
        
        var gameId = todayGame.id;
        
        // Check if game is completed (both signatures true)
        db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
            if (doc.exists) {
                var data = doc.data();
                var signatures = data.signatures || {};
                var f1Signed = signatures.f1?.signed === true;
                var f2Signed = signatures.f2?.signed === true;
                var isCompleted = f1Signed && f2Signed;
                
                if (typeof displayGameId === 'function') {
                    displayGameId(gameId);
                }
                
                if (isCompleted) {
                    // Game completed - show results via history view
                    window.location.href = "view-history.html?gameId=" + gameId;
                } else {
                    // Game in progress - normal flow
                    proceedToRealGame(gameId, "real");
                }
            } else {
                if (typeof displayGameId === 'function') {
                    displayGameId(gameId);
                }
                proceedToRealGame(gameId, "real");
            }
        }).catch(function(e) {
            console.error("Error checking game completion:", e);
            if (typeof displayGameId === 'function') {
                displayGameId(gameId);
            }
            proceedToRealGame(gameId, "real");
        });
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function handleNextGame() {
    alert("This is the next scheduled game.\n\nOn the game day, this button will become 'TODAY GAME'.");
}

function goToDemo() {

}

function proceedToRealGame(gameId, gameType) {
    var gameMode = (gameType === "preview") ? "preview" : "real";
    
    SessionManager.addNavigationHistory("pre-game.html", "click_ngb", { gameId: gameId, gameType: gameType });
    SessionManager.updateSession({
        returnDestination: "index.html",
        activeGame: {
            gameId: gameId,
            gameType: gameType,
            gameMode: gameMode,
            role: null,
            collection: "scheduledGames"
        }
    });
    sessionStorage.setItem("currentGameId", gameId);
    window.location.href = "pre-game.html";
}

    SessionManager.addNavigationHistory("view-history.html", "previous_games");

function loadAndRender() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Connecting to server...</div>';
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course, startingHole: doc.data().startingHole });
        });
        
        var nextGame = findNextGame(games);
        
        var today = getTodayString();
        var todayGame = games.find(function(g) { return g.date === today; });
        if (todayGame && typeof displayGameId === 'function') {
            displayGameId(todayGame.id);
        }
        
        var preloadStarted = false;
        
        var ngbHtml = '';
        if (nextGame) {
            var status = getGameStatus(nextGame.date);
            var formattedDate = formatDisplayDate(nextGame.date);
            var courseName = nextGame.course ? nextGame.course.name : "Unknown Course";
            
            if (status === "today") {
                // SIMPLIFIED: TODAY GAME button shows regardless of completion
                var cachedData = getPreloadedRawGameData();
                if (cachedData && cachedData.gameId === nextGame.id) {
                    preloadComplete = true;
                    ngbHtml = `
                        <div class="ngb" onclick="handleTodayGame()">
                            <div class="icon">⛳</div>
                            <div class="title">TODAY GAME</div>
                            <div class="date">${formattedDate}</div>
                            <div class="course-name">${escapeHtml(courseName)}</div>
                        </div>
                    `;
                } else {
                    preloadComplete = false;
                    preloadStarted = true;
                    ngbHtml = `
                        <div class="ngb ngb-loading" id="todayGameBtn">
                            <div class="icon">⛳</div>
                            <div class="title"><span class="loading-spinner"></span> LOADING...</div>
                            <div class="date">${formattedDate}</div>
                            <div class="course-name">${escapeHtml(courseName)}</div>
                        </div>
                    `;
                    startBackgroundPreload(nextGame.id, function(success) {
                        if (success) {
                            console.log("Preload complete, enabling TODAY GAME button");
                            var btnContainer = document.getElementById('todayGameBtn');
                            if (btnContainer) {
                                btnContainer.outerHTML = `
                                    <div class="ngb" onclick="handleTodayGame()">
                                        <div class="icon">⛳</div>
                                        <div class="title">TODAY GAME</div>
                                        <div class="date">${formattedDate}</div>
                                        <div class="course-name">${escapeHtml(courseName)}</div>
                                    </div>
                                `;
                                setTimeout(setButtonWidths, 10);
                            }
                        } else {
                            console.log("Preload failed, showing error state");
                            var btnContainer = document.getElementById('todayGameBtn');
                            if (btnContainer) {
                                btnContainer.outerHTML = `
                                    <div class="ngb ngb-inactive" onclick="alert('Failed to load game data. Please refresh.')">
                                        <div class="icon">⚠️</div>
                                        <div class="title">LOAD FAILED</div>
                                        <div class="date">${formattedDate}</div>
                                        <div class="course-name">${escapeHtml(courseName)}</div>
                                    </div>
                                `;
                            }
                        }
                    });
                }
            } else {
                ngbHtml = `
                    <div class="ngb ngb-inactive" onclick="handleNextGame()">
                        <div class="icon">🏆</div>
                        <div class="title">NEXT GAME</div>
                        <div class="subtitle-text">${formattedDate}</div>
                        <div class="course-name">${escapeHtml(courseName)}</div>
                    </div>
                `;
            }
        } else {
            ngbHtml = `
                <div class="ngb ngb-inactive" style="opacity:0.7; cursor:default;">
                    <div class="icon">🏌️</div>
                    <div class="title">NO GAME</div>
                    <div class="no-game">No scheduled games found</div>
                </div>
            `;
        }
        
        var html = `
            <div class="header">
                <div class="golf-icon" id="golfIcon">⛳</div>
                <div class="title">SICC RYDER CUP</div>
                <div class="subtitle">Match Play · Team Game · Net Stroke</div>
            </div>
            
            <div class="app-content">
                ${ngbHtml}
                
                <div class="menu-buttons">
                    <div class="menu-btn" id="previousGamesBtn">
                        <span class="label">📋 VIEW PREVIOUS GAMES</span>
                    </div>
                    <div class="menu-btn" id="demoBtn">
                        <span class="label">🎮 DEMO & TUTORIAL</span>
                    </div>
                </div>
                
                <div class="gsb" id="adminBtn">
                    <span class="icon">⚙️</span>
                    <span class="label">GAME SETTINGS</span>
                </div>
            </div>
            
            <div class="footer">SICC Ryder Cup App v${APP_VERSION}<br>© 2026 Piti Pramotedham - piti@pramotedham.com</div>
        `;
        
        document.getElementById("app").innerHTML = html;
        
        setTimeout(setButtonWidths, 10);
        
        var golfIcon = document.getElementById("golfIcon");
        if (golfIcon) {
            golfIcon.addEventListener('dblclick', function(e) {
                e.stopPropagation();
                if (confirm("⚠️ ADMIN FUNCTION\n\nDuplicate Master Record to today's date?")) {
                    if (typeof duplicateMasterRecord === 'function') {
                        duplicateMasterRecord();
                    } else {
                        alert("Error: Admin function not available. Please refresh.");
                    }
                }
            });
        }
        
        document.getElementById("previousGamesBtn").addEventListener("click", goToPreviousGames);
        document.getElementById("demoBtn").addEventListener("click", goToDemo);
        document.getElementById("adminBtn").addEventListener("click", goToAdmin);
        
        if (typeof initHiddenAdmin === 'function') {
            initHiddenAdmin();
        }
        
        if (!preloadStarted && todayGame && !preloadComplete) {
            var cachedData = getPreloadedRawGameData();
            if (!cachedData || cachedData.gameId !== todayGame.id) {
                startBackgroundPreload(todayGame.id, function(success) {
                    if (success) {
                        console.log("Background preload completed");
                    }
                });
            }
        }
        
    }).catch(function(e) {
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading games. Please refresh.</div>';
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("index.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    currentSession = session;
    displayDeviceId();
    if (firestoreReady) {
        loadAndRender();
    }
});
</script>
</body>
