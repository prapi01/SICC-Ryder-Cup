function formatDisplayDate(dateString) {
    if (!dateString) return "";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function findNextGame(scheduledGames) {
    var today = getTodayString();
    
    var futureGames = scheduledGames.filter(function(game) {
        return game.date >= today;
    });
    
    if (futureGames.length === 0) return null;
    
    futureGames.sort(function(a, b) {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return 0;
    });
    
    return futureGames[0];
}

function getGameStatus(gameDateStr) {
    var today = getTodayString();
    if (gameDateStr === today) return "today";
    if (gameDateStr > today) return "future";
    return "past";
}

function checkExistingPreviewData(gameId) {
    return db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            var f1HasData = data.f1 && data.f1.d && data.f1.d.indexOf('T') !== -1;
            var f2HasData = data.f2 && data.f2.d && data.f2.d.indexOf('T') !== -1;
            var hasLocks = data.locks && (data.locks.f1 !== null || data.locks.f2 !== null);
            return f1HasData || f2HasData || hasLocks;
        }
        return false;
    }).catch(function() { return false; });
}

function resetGameData(gameId) {
    return db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (!doc.exists) return false;
        var gameData = doc.data();
        var startingHole = gameData.startingHole || 1;
        
        function generateDefaultDataNatural(parArray) {
            var result = "";
            for (var h = 0; h < 18; h++) {
                var par = parArray[h];
                var parStr = par.toString().padStart(2, '0');
                result += "F" + parStr + parStr + parStr + parStr;
            }
            return result;
        }
        
        function rotateDataString(naturalData, startHole) {
            if (startHole === 1) return naturalData;
            var blocks = [];
            for (var i = 0; i < 18; i++) {
                blocks.push(naturalData.substr(i * 9, 9));
            }
            var rotated = [];
            for (var i = startHole - 1; i < 18; i++) rotated.push(blocks[i]);
            for (var i = 0; i < startHole - 1; i++) rotated.push(blocks[i]);
            return rotated.join('');
        }
        
        var naturalData = generateDefaultDataNatural(gameData.course.par);
        var rotatedData = rotateDataString(naturalData, startingHole);
        
        var resetData = {
            "f1.d": rotatedData,
            "f1.se": false,
            "f1.x": false,
            "f2.d": rotatedData,
            "f2.se": false,
            "f2.x": false,
            "locks.f1": null,
            "locks.f2": null,
            "currentHoleF1": 1,
            "currentHoleF2": 1,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        return db.collection("scheduledGames").doc(gameId).update(resetData).then(function() {
            return true;
        });
    });
}

function showPreviewSessionModal(gameId, gameDate, courseName) {
    var deviceId = SessionManager.getDeviceIdDisplay();
    
    // Load existing preview sandboxes for this game
    db.collection("previewSandboxes")
        .where("originalGameId", "==", gameId)
        .where("expiresAt", ">", Date.now())
        .get()
        .then(function(snapshot) {
            var sessions = [];
            snapshot.forEach(function(doc) {
                var data = doc.data();
                sessions.push({
                    id: doc.id,
                    sessionName: data.sessionName,
                    createdBy: data.createdBy,
                    createdAt: data.createdAt,
                    updatedAt: data.updatedAt
                });
            });
            
            // Sort by most recent first
            sessions.sort(function(a, b) {
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });
            
            renderPreviewModal(gameId, gameDate, courseName, deviceId, sessions);
        })
        .catch(function(err) {
            console.error("Error loading preview sessions:", err);
            renderPreviewModal(gameId, gameDate, courseName, deviceId, []);
        });
}

function renderSessionsList(sessions, deviceId) {
    if (!sessions || sessions.length === 0) {
        return '<div class="empty-sessions">No active preview sessions.<br>Create a new session to start testing.</div>';
    }
    
    var html = '<div class="sessions-list">';
    for (var i = 0; i < sessions.length; i++) {
        var s = sessions[i];
        var timeAgo = getTimeAgo(s.updatedAt || s.createdAt);
        var isCurrentUser = (s.createdBy === deviceId);
        var creatorLabel = isCurrentUser ? '(You)' : s.createdBy;
        
        html += `
            <div class="session-item" data-session-id="${s.id}">
                <div class="session-name">📌 ${escapeHtml(s.sessionName)}</div>
                <div class="session-meta">
                    ${timeAgo} • Created by ${escapeHtml(creatorLabel)}
                </div>
            </div>
        `;
    }
    html += '</div>';
    return html;
}

function getTimeAgo(timestamp) {
    if (!timestamp) return 'Recently';
    var seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'Just now';
    var minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + ' min ago';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
    var days = Math.floor(hours / 24);
    return days + ' day' + (days > 1 ? 's' : '') + ' ago';
}

function createNewPreviewSession(gameId, gameDate, sessionName) {
    // First, get the original game data
    db.collection("scheduledGames").doc(gameId).get().then(function(doc) {
        if (!doc.exists) {
            alert("Original game not found");
            return;
        }
        
        var originalData = doc.data();
        var deviceId = SessionManager.getDeviceIdDisplay();
        var sessionId_short = Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        var sandboxId = "preview_" + gameId + "_" + sessionId_short;
        
        // Create default data string
        function generateDefaultDataNatural(parArray) {
            var result = "";
            for (var h = 0; h < 18; h++) {
                var par = parArray[h];
                var parStr = par.toString().padStart(2, '0');
                result += "F" + parStr + parStr + parStr + parStr;
            }
            return result;
        }
        
        function rotateDataString(naturalData, startHole) {
            if (startHole === 1) return naturalData;
            var blocks = [];
            for (var i = 0; i < 18; i++) {
                blocks.push(naturalData.substr(i * 9, 9));
            }
            var rotated = [];
            for (var i = startHole - 1; i < 18; i++) rotated.push(blocks[i]);
            for (var i = 0; i < startHole - 1; i++) rotated.push(blocks[i]);
            return rotated.join('');
        }
        
        var startingHole = originalData.startingHole || 1;
        var naturalData = generateDefaultDataNatural(originalData.course.par);
        var rotatedData = rotateDataString(naturalData, startingHole);
        
        var sandboxData = {
            originalGameId: gameId,
            sessionName: sessionName,
            createdBy: deviceId,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            expiresAt: Date.now() + (24 * 60 * 60 * 1000), // 24 hours
            
            course: originalData.course,
            players: originalData.players,
            startingHole: startingHole,
            
            f1: {
                d: rotatedData,
                se: false,
                x: false
            },
            f2: {
                d: rotatedData,
                se: false,
                x: false
            },
            locks: {
                f1: null,
                f2: null
            },
            currentHoleF1: 1,
            currentHoleF2: 1
        };
        
        db.collection("previewSandboxes").doc(sandboxId).set(sandboxData).then(function() {
            console.log("Preview sandbox created:", sandboxId);
            proceedToPreview(gameId, gameDate, sandboxId, sessionName);
        }).catch(function(err) {
            console.error("Error creating preview sandbox:", err);
            alert("Error creating preview session: " + err.message);
        });
    }).catch(function(err) {
        console.error("Error loading original game:", err);
        alert("Error loading game data");
    });
}

function proceedToPreview(gameId, gameDate, sandboxId, sessionName) {
    var targetPage = "pre-game.html";
    
    SessionManager.addNavigationHistory(targetPage, "click_preview", { 
        gameId: gameId, 
        gameType: "preview",
        sandboxId: sandboxId,
        sessionName: sessionName
    });
    SessionManager.updateSession({
        returnDestination: "index.html",
        activeGame: {
            gameId: sandboxId,
            originalGameId: gameId,
            gameType: "preview",
            gameMode: "preview",
            role: null,
            collection: "previewSandboxes"
        }
    });
    sessionStorage.setItem("currentGameId", sandboxId);
    window.location.href = targetPage;
}

function handleTodayGame() {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var todayGame = null;
        var todayStr = getTodayString();
        for (var i = 0; i < games.length; i++) {
            if (games[i].date === todayStr) {
                todayGame = games[i];
                break;
            }
        }
        
        if (!todayGame) {
            alert("No game scheduled for today. Please set up a game first.");
            return;
        }
        
        var gameId = todayGame.id;
        var gameDate = todayGame.date;
        var gameStatus = getGameStatus(gameDate);
        
        if (gameStatus === "today") {
            proceedToRealGame(gameId, "real");
        }
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function handlePreviewGame() {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var nextGame = findNextGame(games);
        if (!nextGame) {
            alert("No scheduled game found. Please set up a game first.");
            return;
        }
        
        var gameId = nextGame.id;
        var gameDate = nextGame.date;
        var courseName = nextGame.course ? nextGame.course.name : "Unknown Course";
        
        showPreviewSessionModal(gameId, gameDate, courseName);
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function proceedToRealGame(gameId, gameType) {
    var gameMode = (gameType === "preview") ? "preview" : "real";
    
    SessionManager.addNavigationHistory("pre-game.html", "click_ngb", { gameId: gameId, gameType: gameType });
    SessionManager.updateSession({
        returnDestination: "index.html",
        activeGame: {
            gameId: gameId,
            gameType: gameType,
            gameMode: gameMode,
            role: null,
            collection: "scheduledGames"
        }
    });
    sessionStorage.setItem("currentGameId", gameId);
    window.location.href = "pre-game.html";
}

function goToPreviousGames() {
    SessionManager.addNavigationHistory("history.html", "previous_games");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "history.html";
}

function goToAdmin() {
    SessionManager.addNavigationHistory("admin.html", "game_settings");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "admin.html";
}

function loadAndRender() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Connecting to server...</div>';
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course, startingHole: doc.data().startingHole });
        });
        
        var nextGame = findNextGame(games);
        
        var ngbHtml = '';
        if (nextGame) {
            var status = getGameStatus(nextGame.date);
            var formattedDate = formatDisplayDate(nextGame.date);
            var courseName = nextGame.course ? nextGame.course.name : "Unknown Course";
            
            if (status === "today") {
                ngbHtml = `
                    <div class="ngb" onclick="handleTodayGame()">
                        <div class="icon">⛳</div>
                        <div class="title">TODAY GAME</div>
                        <div class="course-name">${escapeHtml(courseName)}</div>
                    </div>
                `;
            } else {
                ngbHtml = `
                    <div class="ngb" onclick="handlePreviewGame()">
                        <div class="icon">🔍</div>
                        <div class="title">PREVIEW</div>
                        <div class="subtitle-text">NEXT GAME</div>
                        <div class="date">${formattedDate}</div>
                        <div class="course-name">${escapeHtml(courseName)}</div>
                    </div>
                `;
            }
        } else {
            ngbHtml = `
                <div class="ngb" style="opacity:0.7; cursor:default;">
                    <div class="icon">🏌️</div>
                    <div class="title">NO GAME</div>
                    <div class="no-game">No scheduled games found</div>
                </div>
            `;
        }
        
        var html = `
            <div class="header">
                <div class="golf-icon">⛳</div>
                <div class="title">SICC RYDER CUP</div>
                <div class="subtitle">Match Play · Team Game · Net Stroke</div>
            </div>
            
            ${ngbHtml}
            
            <div class="menu-buttons">
                <div class="menu-btn" id="previousGamesBtn">
                    <span class="label">📋 VIEW PREVIOUS GAMES</span>
                </div>
            </div>
            
            <div class="gsb" id="adminBtn">
                <span class="icon">⚙️</span>
                <span class="label">GAME SETTINGS</span>
            </div>
            
            <div class="footer">SICC Ryder Cup App v${APP_VERSION}<br>© 2026 Singapore Island Country Club</div>
        `;
        
        document.getElementById("app").innerHTML = html;
        
        document.getElementById("previousGamesBtn").addEventListener("click", goToPreviousGames);
        document.getElementById("adminBtn").addEventListener("click", goToAdmin);
        
    }).catch(function(e) {
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading games. Please refresh.</div>';
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

SessionManager.initSession("index.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    currentSession = session;
    displayDeviceId();
    loadAndRender();
});
</script>
