VERSION: 3.54
KEY CHANGES from v3.53:
   - ADDED: GAME DAY button now checks if game is complete before redirecting
   - If game complete → shows GAME COMPLETE modal → post-game context
   - If game not complete → goes to pre-game.html (LIVE scoring setup)
   - Uses standardized Modal.confirmGameComplete() for consistency
   - All existing functionality preserved from v3.53
DEPENDS ON: js/firebase-config.js, js/session.js, js/modal.js, js/waiting-screen.js
STATUS: Ready for integration
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SICC Ryder Cup</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=3.54"></script>
    <script src="js/session.js?v=3.54"></script>
    <script src="js/modal.js?v=3.54"></script>
    <script src="js/waiting-screen.js?v=1.00"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            min-height: 100vh;
            background: #000;
        }
        
        body {
            background: #000;
            font-family: system-ui, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
            text-align: center;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: 800;
            color: #4caf50;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }
        
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        
        .menu-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            border: 2px solid;
            transition: all 0.2s;
            background: #1a1a1a;
            color: #fff;
            text-decoration: none;
            display: block;
        }
        
        .menu-btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            border-color: #4caf50;
            color: #4caf50;
            background: #1a3a1a;
        }
        
        .btn-primary:hover {
            background: #2a4a2a;
        }
        
        .btn-secondary {
            border-color: #333;
            color: #888;
        }
        
        .btn-secondary:hover {
            border-color: #555;
            color: #aaa;
        }
        
        .btn-gold {
            border-color: #ffaa44;
            color: #ffaa44;
            background: #1a3a1a;
        }
        
        .btn-gold:hover {
            background: #2a4a2a;
        }
        
        .btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .version-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            font-size: 0.65rem;
            color: #4caf50;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 16px;
            font-family: monospace;
            z-index: 1000;
        }
        
        .device-tag {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: max(8px, env(safe-area-inset-left));
            font-size: 0.55rem;
            color: #4caf50;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 1000;
            opacity: 0.4;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 0.6rem;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">⛳ SICC</div>
    <div class="subtitle">RYDER CUP</div>
    
    <div class="menu-grid">
        <button class="menu-btn btn-primary" id="gameDayBtn">🏆 GAME DAY</button>
        <button class="menu-btn btn-secondary" id="nextGameBtn">📅 NEXT GAME</button>
        <button class="menu-btn btn-secondary" id="viewHistoryBtn">📜 VIEW HISTORY</button>
        <button class="menu-btn btn-secondary" id="adminBtn">⚙️ ADMIN</button>
    </div>
    
    <div class="footer">SICC Ryder Cup v3.54</div>
</div>

<div class="device-tag" id="deviceTag">---</div>
<div class="version-tag">v3.54</div>

<script>
// ============================================================
// VERSION CACHE-BUSTING - Forces reload on new deployment
// ============================================================
var APP_VERSION = "3.54";
var CACHE_KEY = "index_version_v354";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

// ============================================================
// Version Exposure for Console Debugging
// ============================================================
window.INDEX_VERSION = "3.54";
console.log("[INDEX] Initializing v3.54 - GAME DAY with completion check");

// ============================================================
// Firebase already initialized in firebase-config.js
// ============================================================
var db = firebase.firestore();

// ============================================================
// Device Tag
// ============================================================
SessionManager.getShortNameOnly().then(function(name) {
    document.getElementById('deviceTag').textContent = '🏠 ' + name;
}).catch(function() {
    document.getElementById('deviceTag').textContent = '🏠 DEV-??';
});

// ============================================================
// Check if there's a game scheduled for today
// ============================================================
function checkGameDay() {
    var today = new Date().toISOString().split('T')[0];
    console.log("[INDEX] Checking for game on:", today);
    
    db.collection("scheduledGames")
        .where("date", "==", today)
        .where("status", "in", ["scheduled", "in_progress"])
        .limit(1)
        .get()
        .then(function(snapshot) {
            if (snapshot.empty) {
                console.log("[INDEX] No game scheduled for today");
                document.getElementById('gameDayBtn').textContent = '🏆 NO GAME TODAY';
                document.getElementById('gameDayBtn').classList.add('btn-disabled');
                document.getElementById('gameDayBtn').onclick = null;
                return;
            }
            
            var doc = snapshot.docs[0];
            var gameData = doc.data();
            var gameId = doc.id;
            
            console.log("[INDEX] Game found:", gameId);
            document.getElementById('gameDayBtn').textContent = '🏆 GAME DAY';
            document.getElementById('gameDayBtn').classList.remove('btn-disabled');
            
            // Check if game is complete (both cards signed)
            var signatures = gameData.signatures || {};
            var f1Signed = signatures.f1?.signed === true;
            var f2Signed = signatures.f2?.signed === true;
            var isComplete = f1Signed && f2Signed;
            
            if (isComplete) {
                console.log("[INDEX] Game is COMPLETE → Show GAME COMPLETE modal");
                document.getElementById('gameDayBtn').onclick = function() {
                    handleCompletedGame(gameId);
                };
            } else {
                console.log("[INDEX] Game is NOT complete → Go to pre-game");
                document.getElementById('gameDayBtn').onclick = function() {
                    window.location.href = 'pre-game.html?gameId=' + gameId;
                };
            }
        })
        .catch(function(err) {
            console.error("[INDEX] Error checking game day:", err);
            document.getElementById('gameDayBtn').textContent = '🏆 ERROR';
        });
}

// ============================================================
// Handle Completed Game - Show GAME COMPLETE modal
// ============================================================
function handleCompletedGame(gameId) {
    console.log("[INDEX] Game complete - showing GAME COMPLETE modal");
    
    if (typeof Modal !== 'undefined' && Modal.confirmGameComplete) {
        Modal.confirmGameComplete(function() {
            console.log("[INDEX] SEE RESULTS clicked - navigating to post-game");
            
            // Set session flags
            sessionStorage.setItem('isPostGame', 'true');
            sessionStorage.setItem('currentGameId', gameId);
            
            // Navigate to HCP Adjust (post-game context)
            window.location.href = 'hcp-adjust.html?gameId=' + gameId;
        });
    } else {
        // Fallback
        console.warn("[INDEX] Modal.confirmGameComplete not available, using direct navigation");
        sessionStorage.setItem('isPostGame', 'true');
        sessionStorage.setItem('currentGameId', gameId);
        window.location.href = 'hcp-adjust.html?gameId=' + gameId;
    }
}

// ============================================================
// Button Handlers
// ============================================================

document.getElementById('nextGameBtn').addEventListener('click', function() {
    window.location.href = 'setup-game.html';
});

document.getElementById('viewHistoryBtn').addEventListener('click', function() {
    window.location.href = 'view-history.html';
});

document.getElementById('adminBtn').addEventListener('click', function() {
    window.location.href = 'admin.html';
});

// ============================================================
// Initialize
// ============================================================

checkGameDay();

</script>

</body>
</html>
