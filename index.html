    <style>

            padding: 20px;
        }
        .container { max-width: 420px; width: 100%; }
        
        .device-tag {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 0.55rem;

            padding: 2px 8px;

            font-family: monospace;
            z-index: 1000;

        }
        
        .header { text-align: center; margin-bottom: 40px; }
        .golf-icon { font-size: 4rem; margin-bottom: 16px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #ffffff 0%, #4caf50 100%); background-clip: text; -webkit-background-clip: text; color: transparent; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .subtitle { font-size: 0.8rem; color: #888; margin-top: 4px; letter-spacing: 1px; }
        .today-date { margin-top: 16px; padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 60px; display: inline-block; font-size: 0.85rem; color: #4caf50; border: 1px solid rgba(76,175,80,0.3); backdrop-filter: blur(4px); }
        
        .ngb { 
            background: linear-gradient(145deg, #1a3a1a 0%, #0d2a0d 100%);
            border: 2px solid #4caf50;

            padding: 50px 20px;
            text-align: center;
            cursor: pointer;

            margin-bottom: 20px;

        .ngb:active { transform: scale(0.98); }
        .ngb .icon { font-size: 3rem; margin-bottom: 16px; display: block; }
        .ngb .title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 12px; background: none; -webkit-background-clip: unset; }
        .ngb .date { font-size: 1.3rem; font-weight: 600; color: #ffffff; }
        .ngb .no-game { font-size: 1.1rem; font-weight: 500; color: #888; }
        
        .title-active { color: #4caf50; }
        .title-past { color: #888; }
        
        /* Both buttons now use same style */
        .menu-btn {
            background: rgba(17,17,17,0.8);
            border: 1px solid rgba(76,175,80,0.4);
            border-radius: 24px;
            padding: 14px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
        .menu-btn:active { transform: scale(0.98); background: rgba(26,26,26,0.9); }
        .menu-btn .icon { font-size: 1.2rem; margin-right: 8px; display: inline-block; vertical-align: middle; }
        .menu-btn .label { font-size: 1rem; font-weight: 600; color: #4caf50; display: inline-block; vertical-align: middle; letter-spacing: 0.5px; }
        
        .gsb {
            background: rgba(17,17,17,0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 60px;
            padding: 14px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 220px;
            margin: 0 auto;
            backdrop-filter: blur(4px);
        }
        .gsb:active { transform: scale(0.98); background: rgba(26,26,26,0.9); }
        .gsb .icon { font-size: 1rem; margin-right: 8px; display: inline-block; vertical-align: middle; }
        .gsb .label { font-size: 0.9rem; font-weight: 600; color: #ccc; display: inline-block; vertical-align: middle; }
        
        .footer { text-align: center; margin-top: 40px; font-size: 0.6rem; color: #444; }
        .loading { text-align: center; padding: 40px; color: #888; }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal {
            background: #111;
            border-radius: 24px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            border: 1px solid #ffaa44;
            text-align: center;
        }
        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffaa44;
            margin-bottom: 16px;
        }
        .modal-message {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }
        .modal-time {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 24px;
            font-family: monospace;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        .modal-btn-new {
            background: #3a1a1a;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        .modal-btn-continue {
            background: #1a3a1a;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading">Loading...</div>
</div>
<div class="device-tag" id="deviceTag">🖥️ ---</div>
<div class="version-tag">v2.19</div>

<script>
// FILE: index.html - VERSION 2.19
// REMOVED TEST NEW UI button
// PRACTICE MODE button now same style as VIEW PREVIOUS GAMES

var APP_VERSION = "2.19";
var CACHE_KEY = "index_version";
var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

var FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-9hqHpG_Op_kxp9sj8pLs1LS261o2oc",
    authDomain: "sicc-ryder-cup.firebaseapp.com",
    projectId: "sicc-ryder-cup",
    storageBucket: "sicc-ryder-cup.firebasestorage.app",
    messagingSenderId: "137641493845",
    appId: "1:137641493845:web:32399940bce639b01ddbdc"
};

var db = null;
var firestoreReady = false;
var pendingGameId = null;
var pendingGameMode = null;

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    firestoreReady = true;
    console.log("Firebase ready - v" + APP_VERSION);
} catch(e) { 
    console.warn(e);
}

function displayDeviceId() {
    var deviceDisplay = SessionManager.getDeviceIdDisplay();
    document.getElementById("deviceTag").innerHTML = deviceDisplay;
}

function formatDate(dateString) {
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function formatTodayDate() {
    var today = new Date();
    var day = today.getDate();
    var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var month = monthNames[today.getMonth()];
    var year = today.getFullYear();
    return day + ' ' + month + ' ' + year;
}

function findNextGame(scheduledGames) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayStr = today.toISOString().split('T')[0];
    
    var futureGames = scheduledGames.filter(function(game) {
        return game.date >= todayStr;
    });
    
    if (futureGames.length === 0) return null;
    
    futureGames.sort(function(a, b) {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return 0;
    });
    
    return futureGames[0];
}

function getGameStatus(gameDateStr) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var gameDate = new Date(gameDateStr);
    gameDate.setHours(0, 0, 0, 0);
    
    if (gameDate > today) return "future";
    if (gameDate < today) return "past";
    return "today";
}

function proceedToGame(gameId, gameType, targetPage) {
    var gameMode = (gameType === "preview") ? "preview" : "real";
    
    SessionManager.addNavigationHistory(targetPage, "click_ngb", { gameId: gameId, gameType: gameType });
    SessionManager.updateSession({
        returnDestination: "index.html",
        activeGame: {
            gameId: gameId,
            gameType: gameType,
            gameMode: gameMode,
            role: null,
            collection: "scheduledGames"
        }
    });
    sessionStorage.removeItem("practiceGameId");
    sessionStorage.setItem("currentGameId", gameId);
    window.location.href = targetPage;
}

function handleNGB(targetPage) {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var nextGame = findNextGame(games);
        if (!nextGame) {
            alert("No scheduled game found. Please set up a game first.");
            return;
        }
        
        var gameId = nextGame.id;
        var gameDate = nextGame.date;
        var gameStatus = getGameStatus(gameDate);
        
        console.log("handleNGB:", { gameId, gameDate, gameStatus, targetPage });
        
        if (gameStatus === "today") {
            proceedToGame(gameId, "real", targetPage);
        } else if (gameStatus === "future") {
            proceedToGame(gameId, "preview", targetPage);
        } else {
            proceedToGame(gameId, "preview", targetPage);
        }
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function goToPracticeMode() {
    SessionManager.addNavigationHistory("practice-mode.html", "click_pmb");
    SessionManager.updateSession({
        returnDestination: "practice-mode.html",
        activeGame: {
            gameId: null,
            gameType: "practice",
            gameMode: "practice",
            role: null,
            collection: null
        }
    });
    window.location.href = "practice-mode.html";
}

function goToAdmin() {
    SessionManager.addNavigationHistory("admin.html", "click_gsb");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "admin.html";
}

function viewPreviousGames() {
    SessionManager.addNavigationHistory("history.html", "click_pvg");
    SessionManager.updateSession({
        returnDestination: "index.html"
    });
    window.location.href = "history.html";
}

function loadAndRender() {
    if (!firestoreReady) {
        document.getElementById("app").innerHTML = '<div class="loading">Connecting to server...</div>';
        return;
    }
    
    db.collection("scheduledGames").get().then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var nextGame = findNextGame(games);
        
        var ngbHtml = '';
        if (nextGame) {
            var status = getGameStatus(nextGame.date);
            var formattedDate = formatDate(nextGame.date);
            var displayTitle = "";
            var displaySubText = "";
            
            if (status === "today") {
                displayTitle = "TODAY GAME";
                displaySubText = "";
            } else if (status === "future") {
                displayTitle = "NEXT GAME";
                displaySubText = '<div class="date">' + formattedDate + '</div>';
            } else {
                displayTitle = "PAST GAME";
                displaySubText = '<div class="date">' + formattedDate + '</div>';
            }
            
            var titleClass = (status === "past") ? "title-past" : "title-active";
            
            ngbHtml = `
                <div class="ngb" onclick="handleNGB('game.html')">
                    <div class="icon">⛳</div>
                    <div class="title ${titleClass}">${displayTitle}</div>
                    ${displaySubText}
                </div>
            `;
        } else {
            ngbHtml = `
                <div class="ngb" style="opacity:0.7;">
                    <div class="icon">🏌️</div>
                    <div class="title title-past">NEXT GAME</div>
                    <div class="no-game">No Game Scheduled</div>
                </div>
            `;
        }
        
        var todayFormatted = formatTodayDate();
        
        var html = `
            <div class="header">
                <div class="golf-icon">⛳</div>
                <div class="title">SICC RYDER CUP</div>
                <div class="subtitle">Match Play · Team Game · Net Stroke</div>
                <div class="today-date">📅 ${todayFormatted}</div>
            </div>
            
            ${ngbHtml}
            
            <div class="menu-btn" onclick="goToPracticeMode()">
                <span class="icon">🏌️</span>
                <span class="label">PRACTICE MODE</span>
            </div>
            
            <div class="menu-btn" onclick="viewPreviousGames()">
                <span class="icon">📜</span>
                <span class="label">VIEW PREVIOUS GAMES</span>
            </div>
            
            <div class="gsb" onclick="goToAdmin()">
                <span class="icon">⚙️</span>
                <span class="label">GAME SETTINGS</span>
            </div>
            
            <div class="footer">SICC Ryder Cup</div>
        `;
        
        document.getElementById("app").innerHTML = html;
    }).catch(function(e) {
        console.warn(e);
        document.getElementById("app").innerHTML = '<div class="loading">Error loading games. Please refresh.</div>';
    });
}

SessionManager.initSession("index.html", "index.html", function(session) {
    console.log("Session initialized:", session);
    displayDeviceId();
    loadAndRender();
});
</script>
</body>
</html>
