    <script>
        // Dynamically set button widths based on title width
        function setButtonWidths() {
            var title = document.querySelector('.title');
            var ngb = document.querySelector('.ngb');
            var menuBtns = document.querySelectorAll('.menu-btn');
            var gsb = document.querySelector('.gsb');
            
            if (!title || !ngb) return;
            
            var titleWidth = title.offsetWidth;
            var buttonWidth = Math.floor(titleWidth * 1.05);
            
            ngb.style.width = buttonWidth + 'px';
            ngb.style.height = buttonWidth + 'px';
            
            menuBtns.forEach(function(btn) {
                btn.style.width = buttonWidth + 'px';
            });
            
            if (gsb) {
                gsb.style.width = buttonWidth + 'px';
            }
        }
        
        // Run after page loads
        window.addEventListener('load', setButtonWidths);
        window.addEventListener('resize', setButtonWidths);
    </script>

<script>
// FILE: index.html - VERSION 3.56

// Version exposure for console debugging
window.INDEX_VERSION = "3.56";

var APP_VERSION = "3.56";
var CACHE_KEY = "index_version_v356";

var storedVersion = localStorage.getItem(CACHE_KEY);
if (storedVersion !== APP_VERSION) {
    localStorage.setItem(CACHE_KEY, APP_VERSION);
    window.location.href = window.location.pathname + "?v=" + APP_VERSION;
}

// v3.53: Determine if this is first load of the session
var isFirstLoad = (sessionStorage.getItem('appInitialized') !== 'true');

// If not first load, show grey icon screen IMMEDIATELY (no blank screen)
if (!isFirstLoad) {
    console.log("[INDEX] Non-first-load - creating grey icon screen immediately");
    var immediateGreyScreen = document.createElement('div');
    immediateGreyScreen.id = 'greyIconScreen';
    immediateGreyScreen.innerHTML = '<div class="grey-icon">⛳</div>';
    immediateGreyScreen.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:#000000; display:flex; align-items:center; justify-content:center; z-index:20000;';
    document.body.appendChild(immediateGreyScreen);
}

// Firebase is already initialized in firebase-config.js
var db = firebase.firestore();

var firestoreReady = true;
var currentSession = null;

// Preload tracking
var preloadComplete = false;
var mainContainer = null;
var dataReady = false;
var splashAnimationCompleted = false;
var animationStarted = false;

// Get splash elements
var splashOverlay = document.getElementById('splashOverlay');
var splashGolfIcon = document.getElementById('splashGolfIcon');
var splashTitle = document.getElementById('splashTitle');
var splashSubtitle = document.getElementById('splashSubtitle');

// ============================================================
// v3.53: FIRST LOAD ONLY - Simple splash animation
// No Firebase dependency - pure UI, fixed 4 seconds
// ============================================================

function recordSplashShown() {
    sessionStorage.setItem('appInitialized', 'true');
    console.log("[SPLASH] App marked as initialized");
}

function startSplashAnimation() {
    console.log("[SPLASH] Starting animation");
    
    // Force reflow
    void splashGolfIcon.offsetHeight;
    
    // Make icon visible and start drop animation
    splashGolfIcon.style.visibility = 'visible';
    splashGolfIcon.style.filter = 'grayscale(100%)';
    splashGolfIcon.style.opacity = '0.8';
    
    // Force reflow again
    void splashGolfIcon.offsetHeight;
    
    // Drop animation: from -300px to 0 with 360° spin
    splashGolfIcon.style.transition = 'transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
    splashGolfIcon.style.transform = 'translateY(0) rotate(360deg)';
    
    // On impact (600ms) - remove grayscale to reveal colour, apply thump effects
    setTimeout(function() {
        console.log("[SPLASH] Impact - THUMP + COLOUR!");
        
        // Remove grayscale to reveal natural icon colour
        splashGolfIcon.style.filter = 'none';
        splashGolfIcon.style.opacity = '1';
        
        // Screen shake
        splashOverlay.style.animation = 'splashShake 0.3s ease-in-out';
        
        // Thump ring effect
        var rect = splashGolfIcon.getBoundingClientRect();
        var ring = document.createElement('div');
        ring.style.cssText = `
            position: fixed;
            left: ${rect.left + rect.width/2 - 30}px;
            top: ${rect.top + rect.height/2 - 30}px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(76,175,80,0.6) 0%, transparent 70%);
            transform: scale(0);
            pointer-events: none;
            z-index: 10001;
        `;
        document.body.appendChild(ring);
        ring.style.transition = 'transform 0.4s ease-out';
        ring.style.transform = 'scale(5)';
        setTimeout(function() { if (ring) ring.remove(); }, 500);
        
        // Vibration
        if (navigator.vibrate) {
            navigator.vibrate(50);
        }
        
        // Title transforms to colour gradient
        splashTitle.style.background = 'linear-gradient(135deg, #ffffff 0%, #4caf50 100%)';
        splashTitle.style.backgroundClip = 'text';
        splashTitle.style.webkitBackgroundClip = 'text';
        splashTitle.style.color = 'transparent';
        
        // Subtitle subtle colour
        splashSubtitle.style.color = '#aaa';
        
    }, 600);
    
    // v3.53: FIXED - Hide splash after exactly 4 seconds
    // Firebase loads in background during this time
    setTimeout(function() {
        console.log("[SPLASH] 4 seconds complete - hiding splash");
        splashOverlay.style.opacity = '0';
        setTimeout(function() {
            if (splashOverlay) splashOverlay.remove();
            var appDiv = document.getElementById("app");
            if (appDiv && !appDiv.classList.contains('visible')) {
                appDiv.classList.add('visible');
            }
            recordSplashShown();
            // Now load the UI (data may already be loaded)
            if (typeof renderMainUI === 'function') {
                renderMainUI();
            } else {
                // Fallback: reload

// ============================================================
// Preload Functions (run in background during splash)
// ============================================================

function getPreloadedRawGameData() {
    var stored = sessionStorage.getItem("preloadedRawGameData");
    if (stored) {
        try {
            var data = JSON.parse(stored);
            if (data.preloadTimestamp && (Date.now() - data.preloadTimestamp) < 300000) {
                return data;
            } else {
                sessionStorage.removeItem("preloadedRawGameData");
            }
        } catch(e) {
            console.warn("Failed to parse preloaded raw data:", e);
        }
    }
    return null;
}

function preloadGameData(gameId, callback) {
    if (!db || !gameId) {
        if (callback) callback(false);
        return;
    }
    
    var existing = getPreloadedRawGameData();
    if (existing && existing.gameId === gameId) {
        console.log("Preload: Data already cached for game", gameId);
        preloadComplete = true;
        if (callback) callback(true);
        return;
    }
    
    console.log("Preload: Starting for game", gameId);
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        if (doc.exists) {
            var preloadData = {
                gameId: gameId,
                rawData: doc.data(),
                preloadTimestamp: Date.now()
            };
            sessionStorage.setItem("preloadedRawGameData", JSON.stringify(preloadData));
            preloadComplete = true;
            console.log("Preload: Complete for game", gameId);
            if (callback) callback(true);
        } else {
            console.log("Preload: Game not found", gameId);
            if (callback) callback(false);
        }
    }).catch(function(err) {
        console.warn("Preload: Failed after retries", err);
        if (callback) callback(false);
    });
}

// ============================================================
// v3.56: GAME DAY - Check if game is complete
// ============================================================

function handleGameDayClick(gameId) {
    console.log("[INDEX] GAME DAY clicked, checking completion for:", gameId);
    
    FirebaseRetry.getDocument("scheduledGames", gameId, {
        onExit: function() {
            window.location.href = "index.html";
        }
    }).then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            var signatures = data.signatures || {};
            var f1Signed = signatures.f1?.signed === true;
            var f2Signed = signatures.f2?.signed === true;
            var isComplete = f1Signed && f2Signed;
            
            if (isComplete) {
                console.log("[INDEX] Game is complete - going to post-game page");
                sessionStorage.setItem('isPostGame', 'true');
                sessionStorage.setItem('currentGameId', gameId);
                // v3.56: Go to post-game.html which shows GAME COMPLETE modal → Celebration
                window.location.href = 'post-game.html?gameId=' + gameId;
            } else {
                console.log("[INDEX] Game is NOT complete - going to pre-game");
                proceedToRealGame(gameId, "real");
            }
        } else {
            console.warn("[INDEX] Game not found, proceeding to pre-game");
            proceedToRealGame(gameId, "real");
        }
    }).catch(function(err) {
        console.error("[INDEX] Error checking game completion:", err);
        proceedToRealGame(gameId, "real");
    });
}

// ============================================================
// v3.51: Custom Pull-to-Refresh (only for web app mode)
// ============================================================

function initPullToRefresh() {
    // Only enable for standalone web app (Add to Home Screen)
    var isWebApp = window.navigator.standalone === true;
    if (!isWebApp) {
        console.log("[PULL-TO-REFRESH] Browser mode - using native refresh");
        return;
    }
    
    console.log("[PULL-TO-REFRESH] Web app mode - enabling custom pull-to-refresh");
    
    var pullEl = document.getElementById('pullToRefresh');
    var arrowEl = document.getElementById('pullArrow');
    var spinnerEl = document.getElementById('pullSpinner');
    var textEl = document.getElementById('pullText');
    
    var startY = 0;
    var pullY = 0;
    var isPulling = false;
    var isRefreshing = false;
    var threshold = 80; // pixels to trigger refresh
    
    document.addEventListener('touchstart', function(e) {
        // Only trigger if at the top of the page
        if (window.scrollY > 10) return;
        startY = e.touches[0].clientY;
        isPulling = true;
    }, { passive: true });
    
    document.addEventListener('touchmove', function(e) {
        if (!isPulling || isRefreshing) return;
        // Only if scrolling down
        var currentY = e.touches[0].clientY;
        pullY = currentY - startY;
        if (pullY < 0) {
            pullY = 0;
            return;
        }
        // Show pull indicator
        if (pullY > 10) {
            pullEl.classList.add('active');
            var progress = Math.min(pullY / threshold, 1);
            pullEl.style.height = Math.min(60, 20 + pullY * 0.5) + 'px';
            arrowEl.style.transform = 'rotate(' + (progress * 180) + 'deg)';
            if (progress >= 1) {
                textEl.textContent = 'Release to refresh';
                arrowEl.style.color = '#ffaa44';
            } else {
                textEl.textContent = 'Pull to refresh';
                arrowEl.style.color = '#4caf50';
            }
        }
    }, { passive: true });
    
    document.addEventListener('touchend', function(e) {
        if (!isPulling || isRefreshing) {
            isPulling = false;
            return;
        }
        isPulling = false;
        
        // Check if threshold reached
        if (pullY >= threshold) {
            // Trigger refresh
            isRefreshing = true;
            arrowEl.classList.add('hidden');
            spinnerEl.classList.remove('hidden');
            textEl.textContent = 'Refreshing...';
            pullEl.style.height = '60px';
            
            // Perform refresh
            setTimeout(function() {
                window.location.reload();
            }, 800);
        } else {
            // Reset
            pullEl.classList.remove('active');
            pullEl.style.height = '0';
            arrowEl.style.transform = 'rotate(0deg)';
            textEl.textContent = 'Pull to refresh';
            arrowEl.style.color = '#4caf50';
        }
        pullY = 0;
    }, { passive: true });
}

// v3.50: Long-click + Bubble for Admin - LARGER SQUARE BUTTON

var adminBubbleTimeout = null;
var adminBubbleElement = null;
var isAdminBubbleActive = false;

function showAdminBubble(x, y) {
    // Remove any existing bubble
    hideAdminBubble();
    
    // Create LARGER SQUARE bubble with stacked text
    var bubble = document.createElement('div');
    bubble.className = 'admin-bubble';
    bubble.innerHTML = `
        <span class="bubble-icon">⚙️</span>

    `;
    
    // Position the bubble
    var bubbleSize = 80;
    bubble.style.left = Math.max(10, Math.min(window.innerWidth - bubbleSize - 10, x - bubbleSize / 2)) + 'px';
    bubble.style.top = Math.max(10, Math.min(window.innerHeight - bubbleSize - 10, y - bubbleSize / 2)) + 'px';
    
    // Click handler - calls window.showAdminModal from index-hidden.js
    bubble.addEventListener('click', function(e) {
        e.stopPropagation();
        hideAdminBubble();
        if (typeof window.showAdminModal === 'function') {
            window.showAdminModal();
        } else {
            alert("Admin functions not available. Please refresh.");
        }
    });
    
    document.body.appendChild(bubble);
    adminBubbleElement = bubble;
    isAdminBubbleActive = true;
    
    // Auto-hide after 4 seconds if not clicked
    setTimeout(function() {
        if (isAdminBubbleActive) {
            hideAdminBubble();
        }
    }, 4000);
}

function hideAdminBubble() {
    if (adminBubbleElement && adminBubbleElement.parentNode) {
        adminBubbleElement.remove();
    }
    adminBubbleElement = null;
    isAdminBubbleActive = false;
}

function setupLongClickAdmin(element) {
    if (!element) return;
    
    var holdTimer = null;
    var isHolding = false;
    
    element.addEventListener('pointerdown', function(e) {
        if (isAdminBubbleActive) {
            hideAdminBubble();
            return;
        }
        if (e.metaKey || e.ctrlKey) return;
        
        isHolding = false;
        holdTimer = setTimeout(function() {
            isHolding = true;
            showAdminBubble(e.clientX || e.pageX || window.innerWidth / 2, e.clientY || e.pageY || window.innerHeight / 2);
        }, 800);
    });
    
    element.addEventListener('pointerup', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('pointerleave', function(e) {
        clearTimeout(holdTimer);
    });
    
    element.addEventListener('click', function(e) {
        if (e.metaKey || e.ctrlKey) {
            e.preventDefault();
            e.stopPropagation();
            hideAdminBubble();
            if (typeof window.showAdminModal === 'function') {
                window.showAdminModal();
            } else {
                alert("Admin functions not available. Please refresh.");
            }
        }
    });
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function formatDisplayDate(dateString) {
    if (!dateString) return "";
    var parts = dateString.split('-');
    if (parts.length === 3) {
        var day = parts[2];
        var month = parts[1];
        var year = parts[0];
        var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var monthIndex = parseInt(month) - 1;
        return day + ' ' + monthNames[monthIndex] + ' ' + year;
    }
    return dateString;
}

function getTodayString() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + "-" + month + "-" + day;
}

function findNextGame(scheduledGames) {
    var today = getTodayString();
    
    var futureGames = scheduledGames.filter(function(game) {
        return game.date >= today;
    });
    
    if (futureGames.length === 0) return null;
    
    futureGames.sort(function(a, b) {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return 0;
    });
    
    return futureGames[0];
}

function handleTodayGame() {
    if (!firestoreReady) {
        alert("Connecting to server... Please wait.");
        return;
    }
    
    FirebaseRetry.getCollection("scheduledGames", {
        onExit: function() {
            window.location.href = "index.html";
        }
    }).then(function(snapshot) {
        var games = [];
        snapshot.forEach(function(doc) {
            games.push({ id: doc.id, date: doc.data().date, course: doc.data().course });
        });
        
        var todayGame = null;
        var todayStr = getTodayString();
        for (var i = 0; i < games.length; i++) {
            if (games[i].date === todayStr) {
                todayGame = games[i];
                break;
            }
        }
        
        if (!todayGame) {
            alert("No game scheduled for today. Please set up a game first.");
            return;
        }
        
        var gameId = todayGame.id;
        
        if (typeof displayGameId === 'function') {
            displayGameId(gameId);
        }
        
        // v3.56: Use the new completion check
        handleGameDayClick(gameId);
        
    }).catch(function(e) {
        console.error("Error loading games:", e);
        alert("Error loading games: " + e.message);
    });
}

function handleNextGame() {
    alert("This is the next scheduled game.\n\nOn the game day, this button will become 'GAME DAY'.");

                    <div class="title">NO GAME</div>
                    <div class="no-game">No scheduled games found</div>

                </div>

            </div>

        `;
        
        appDiv.innerHTML = html;
